<title>分章短文 · 雅思词汇真经</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;
 --accent:#b4442e;--acc-soft:#fdf1ec;--mark:#ffe9a8;--green:#2f7d4f;--warn:#c0392b;
 --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif}
html.dark{color-scheme:dark;--bg:#16181c;--panel:#1d2025;--ink:#e8eaed;--ink2:#9aa3ad;--line:#2c3037;
 --chip:#242830;--acc-soft:#2a211f;--mark:#5a4718;--green:#6cc38b;--warn:#f0776a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,
 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding-bottom:80px;
 -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{padding:26px 0 8px}
h1{margin:0;font-size:24px;font-weight:750;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.65}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);
 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}
.back:hover{color:var(--accent);border-color:var(--accent)}
#chs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.cb{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--panel);
 color:var(--ink2);border-radius:9px;padding:5px 9px;display:flex;gap:5px;align-items:baseline;line-height:1.2}
.cb b{font-variant-numeric:tabular-nums;font-weight:700;font-size:11px;opacity:.7}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cb.on b{color:#fff;opacity:.9}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
 border-top:1px solid var(--line);padding-top:13px}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.2px}
.ttl em{font-style:normal;color:var(--ink2);font-weight:500;font-size:13px;margin-left:7px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cv1{display:flex;align-items:baseline;gap:8px;font-size:12.8px;color:var(--ink2);flex-wrap:wrap}
.cv1 b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.cvp{height:5px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}
.cvp i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cov details{margin-top:4px}
.cov summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;outline:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary:hover{color:var(--accent)}
.left{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.left span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:2px 7px;cursor:help}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 11px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pn{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--acc-soft);
 border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.pt{font-size:14.5px;font-weight:700}
.ph .say{margin-left:auto}
.sn{margin:0 0 12px;padding:1px 4px;border-radius:6px;transition:background .15s}
.sn:last-child{margin-bottom:0}
.sn .en{display:block;font:16.4px/1.62 var(--serif);letter-spacing:.1px;color:var(--ink)}
.sn .zh{display:block;font-size:12.6px;line-height:1.55;color:var(--ink2);margin-top:2px}
body.nozh .sn .zh{display:none}
.sn.cur{background:var(--acc-soft);box-shadow:0 0 0 2px var(--acc-soft)}
.sn.cur .en{color:var(--accent)}
mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 30%,transparent)}
mark.pv:hover{background:var(--mark);box-shadow:none}
mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}
mark.pv.dv{background:none;font-weight:500;font-style:italic;box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--accent) 30%,transparent)}
body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.blind .sn .en{filter:blur(5px);cursor:pointer;user-select:none}
body.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}
.say:hover{color:var(--accent);background:var(--acc-soft)}
.say svg{width:15px;height:15px}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.wlist span{font-size:11.5px;color:var(--ink2);background:var(--chip);border-radius:5px;padding:1px 6px;cursor:pointer}
.wlist span:hover{color:var(--accent)}
#pop{position:fixed;z-index:90;min-width:170px;max-width:310px;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:11px 13px;display:none}
#pop.on{display:block}
#pop .pw{font:700 16px/1.3 var(--serif)}
#pop .pm{font-size:12.8px;color:var(--ink2);margin-top:4px;line-height:1.6}
#pop .pa{display:flex;gap:6px;margin-top:9px}
#pop .pa button{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}
#pop .pa button:hover{border-color:var(--accent);color:var(--accent)}
#pop .pa button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:99;
 max-width:80vw;text-align:center}
#toast.on{opacity:.95;transform:translate(-50%,0)}
@media (max-width:620px){.wrap{padding:0 12px}h1{font-size:21px}.pass{padding:13px 13px 9px}
 .sn .en{font-size:16px;line-height:1.8}.sn .zh{font-size:12.5px}.ttl{font-size:15.5px;width:100%}
 .acts{margin-left:0;width:100%}.cb{font-size:11.8px;padding:4px 7px}}
/* ---- 本篇小测 ---- */
.qz{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.qbb{font:inherit;font-size:12px;font-weight:650;color:var(--accent);background:var(--acc-soft);
 border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:7px;padding:3px 10px;cursor:pointer}
.qbb:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.qsc{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qsc b{color:var(--accent);font-weight:700}
.qzbox{margin-top:10px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
 border-radius:11px;padding:11px 13px 12px}
.qh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);margin-bottom:7px}
.qh .qn2{font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.qh .qclose{margin-left:auto;font:inherit;font-size:11.5px;background:none;border:0;color:var(--ink2);
 cursor:pointer;padding:1px 3px}
.qh .qclose:hover{color:var(--accent);text-decoration:underline}
.qq{font:15.5px/1.62 var(--serif);color:var(--ink)}
.qq .qw{font-family:var(--serif);font-size:17px;font-weight:700}
.qq .blank{display:inline-block;min-width:66px;height:1.02em;margin:0 3px;vertical-align:-3px;
 border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.qzh{display:block;font-size:12.4px;line-height:1.55;color:var(--ink2);margin-top:3px;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.qo button{font:inherit;font-size:13px;line-height:1.5;text-align:left;background:var(--panel);color:var(--ink);
 border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.12s}
.qo button:hover{border-color:var(--accent);color:var(--accent)}
.qo button .oi{font-size:10.5px;color:var(--ink2);margin-right:6px;font-variant-numeric:tabular-nums}
.qo button.ok{background:var(--panel);border-color:var(--green);color:var(--green);font-weight:650}
.qo button.ok .oi{color:var(--green)}
.qo button.no{border-color:var(--warn);color:var(--warn)}
.qo button.no .oi{color:var(--warn)}
.qo button.dim{opacity:.5}
.qf{font-size:12.4px;line-height:1.6;color:var(--ink2);margin-top:10px;min-height:20px}
.qf:after{content:"";display:block;clear:both}
.qf b{color:var(--ink)}
.qf i{font-style:normal;opacity:.75}
.qf .qy{color:var(--green);font-weight:700}
.qf .qn{color:var(--warn);font-weight:700}
.qf button{font:inherit;font-size:12px;font-weight:650;border-radius:7px;padding:4px 12px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);float:right;margin-left:8px}
.qf button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.qf button:hover{filter:brightness(1.05)}
.qdone{font-size:13.4px;line-height:1.6}
.qdone b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.qbad{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qbad span{font-size:11.5px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);
 border-radius:5px;padding:1px 7px;cursor:pointer}
.qbad span:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:620px){.qo{grid-template-columns:1fr}.qzbox{padding:10px 11px 11px}}
</style>

<script>
var TXT={"1":[{"t":"Three Shells","s":[["The earth has three outer layers.","地球有三个外层。"],["The atmosphere is a thin shell of gas around us.","大气层是我们周围一层薄薄的气体。"],["Oxygen, hydrogen and carbon dioxide are gases in it.","氧气、氢气和二氧化碳都是其中的气体。"],["An oxide is a compound of oxygen and another element.","氧化物是氧与另一种元素结合的化合物。"],["Below the air is the hydrosphere, all the water on the globe.","空气下面是水圈,即地球上所有的水。"],["Under that is the lithosphere, the rocky shell.","再下面是岩石圈,那层石头壳。"],["Its crust is thin, its mantle is thick, and its core is very hot.","它的地壳薄,地幔厚,地核非常热。"]]},{"t":"Lines on a Map","s":[["The equator divides the globe into two halves.","赤道把地球分成两半。"],["Latitude tells you how far you are from it.","纬度告诉你离它有多远。"],["Longitude tells you how far east or west you are.","经度告诉你偏东或偏西多少。"],["The axis runs from pole to pole.","地轴从一极通到另一极。"],["A vertical line meets the ground at a right angle.","垂直线与地面成直角。"],["At a high altitude the horizon looks far away.","海拔高时,地平线看上去很远。"],["The Arctic and Antarctic are cold polar regions.","北极和南极是寒冷的极地。"],["The tropics are hot all year.","热带全年炎热。"]]},{"t":"When the Ground Shakes","s":[["A disaster comes without warning.","灾难来的时候没有预兆。"],["A volcano may erupt and send magma down the slope.","火山可能喷发,把岩浆送下山坡。"],["An earthquake shakes the crust, and seismic waves travel fast.","地震摇动地壳,地震波跑得很快。"],["A tsunami is a torrent of water that can drown a street.","海啸是一股能把整条街淹没的洪流。"],["A drought, a flood or an avalanche can ruin a whole year.","一场旱灾、一场洪水或一次雪崩能毁掉一整年。"],["A gale, a gust and a stormy sky are only the start.","大风、一阵狂风和阴沉的天只是开头。"],["Thunder, lightning and a downpour follow.","接着是雷、闪电和倾盆大雨。"],["Such a calamity will endanger a town and jeopardise its farms.","这样的灾祸会危及一座城镇,危及它的农场。"],["Even a small mishap may be catastrophic.","就连一点小意外也可能是灾难性的。"],["Floods erode the land, and the damage is destructive.","洪水侵蚀土地,破坏是毁灭性的。"]]},{"t":"What the Forecast Says","s":[["A forecast is a guess with numbers in it.","预报是一个带着数字的猜测。"],["The temperature may be twenty degrees Celsius.","气温可能是二十摄氏度。"],["A mild, moderate day is neither hot nor cold.","温和适中的一天既不热也不冷。"],["A warm afternoon, a thermal wind and a shower are common in summer.","暖午后、热风和阵雨在夏天很常见。"],["In the tropics the air is moist, damp and humid.","热带空气潮湿。"],["Water vapour rises, evaporates, and then precipitates as rain.","水汽上升、蒸发,然后以雨的形式落下。"],["Mist, fog, dew and a rainbow belong to the same cycle.","薄雾、雾、露水和彩虹属于同一个循环。"],["Winter brings snow, frost and hail, and the ground turns frigid.","冬天带来雪、霜和冰雹,地面变得严寒。"],["You shiver and tremble with chill until the thaw.","你冷得发抖,一直抖到解冻。"],["Sunrise and sunset, sunshine, shade and shadow change by the hour.","日出日落、阳光、阴凉和影子每小时都在变。"],["A solar eclipse and a lunar eclipse follow the calendar.","日食和月食按照历法出现。"],["Smog and fume hang over the city.","雾霾和烟气笼罩着城市。"]]},{"t":"Reading the Rocks","s":[["Geology studies the ground under our feet.","地质学研究我们脚下的地面。"],["A pebble may be granite, marble or quartz, and all of them are minerals.","一块卵石可能是花岗岩、大理岩或石英,它们都是矿物。"],["An ore is rock rich enough to be worth digging.","矿石是富到值得开采的岩石。"],["Sediment settles as silt, and wet soil becomes muddy clay.","沉积物沉成淤泥,湿土变成黏乎乎的黏土。"],["A plate may crack and leave a gap full of debris.","板块可能裂开,留下一个满是碎屑的缝隙。"],["On the margin and fringe of a desert the land is barren.","在沙漠的边缘和外围,土地是贫瘠的。"],["Near a river it is fertile, and farmers fertilise it and sow there.","靠河的地方则肥沃,农民在那里施肥播种。"],["To deforest a hillside is to invite erosion.","把山坡砍光,就是招来侵蚀。"],["Beyond the suburb, on the outskirts, a remote plain lies adjacent to a ridge.","在郊外、在城镇边缘,一片偏远的平原紧挨着一道山脊。"],["The air is toxic with pollution, and the pollutant has contaminated the water.","空气因污染而有毒,污染物已经污染了水。"],["Nature here is not natural: much of it is artificial or synthetic.","这里的自然并不自然:许多是人造的、合成的。"]]},{"t":"Slow Damage","s":[["Land can deteriorate, and then degrade fast.","土地会变坏,然后迅速退化。"],["A careless dam aggravates the damage and erodes the bank.","一座草率的水坝加剧损害,侵蚀河岸。"],["Some change is inevitable, and some is irreversible.","有些变化是必然的,有些不可逆转。"],["Rain falls irregularly, and the pattern looks abnormal.","雨下得没有规律,模式看上去是反常的。"],["That choice was simply inappropriate.","那个选择只是不合适。"],["The greenhouse effect and El Niño are strange phenomena.","温室效应和厄尔尼诺是奇怪的现象。"],["Yet from the peak the view is splendid, grand and magnificent.","但从山顶看,景色壮丽、宏伟、堂皇。"],["A dense fog and a flash of lightning made it dramatic.","浓雾和一道闪电让它很有戏剧性。"],["Water will pour, drain, drip and gush.","水会倾泻、排出、滴落、涌出。"]]},{"t":"North and South","s":[["The northern hemisphere and the southern hemisphere have opposite seasons.","北半球和南半球的季节相反。"],["A southeast wind and a northwest gale bring different weather.","东南风和西北大风带来不同的天气。"],["An eastern coast is mild, and an oriental garden is quiet.","东海岸气候温和,东方式的园子很安静。"],["Oceania is a continent of islands.","大洋洲是一个由岛屿组成的大陆。"],["Out on the ocean a light breeze is welcome.","在海上,一阵轻风是受欢迎的。"],["A magnet and a star once guided navigation.","磁针和星星曾经指引航行。"],["At sunrise a paradise of light appears.","日出时出现一片光的乐园。"],["A superficial view is shallow, so look deeper.","表面的看法是浅的,要看得更深些。"]]},{"t":"From Hill to Coast","s":[["From the hillside you overlook the whole valley.","从山坡上你俯瞰整个山谷。"],["A steep cliff stands above the beach, and the tide pulls at the current.","陡峭的悬崖立在沙滩上方,潮水拉扯着水流。"],["A glacier cut this valley long ago.","很久以前冰川切出了这条山谷。"],["A river builds a delta, and then a flat plain.","河流造出三角洲,然后是平坦的平原。"],["Higher up lies a plateau; further on, a narrow ridge and a slope.","更高处是高原;再往前,一道窄脊和一段斜坡。"],["Peak, mount, mountain and range all mean high ground.","峰、山、山峦和山脉都指高地。"],["A swamp, a cave and an oasis break the surface of the land.","沼泽、洞穴和绿洲打破了地面的平整。"]]},{"t":"The Edge of the Sea","s":[["The mainland ends in a peninsula and a gulf.","大陆终止于一个半岛和一个海湾。"],["The Mediterranean, the Atlantic and the Pacific are three seas.","地中海、大西洋和太平洋是三个海。"],["Marine life is rich near the coast and the shore.","海岸附近海洋生物丰富。"],["A sandy beach is easy to walk on, but a stony one is not.","沙滩好走,石滩不好走。"],["A spring, a brook and a stream are small waters.","泉、小溪和溪流都是小水体。"],["A waterfall and a fountain are moving water; a reservoir keeps it still.","瀑布和喷泉是流动的水;水库把水存住。"],["The water is shallow here, so you can see the bottom.","这里水浅,你能看见水底。"]]},{"t":"Country and Wilderness","s":[["The climate of a region is not its weather today.","一个地区的气候不等于它今天的天气。"],["Meteorology measures both of them.","气象学把两者都测出来。"],["A snowy morning in a rural district is very quiet.","乡村的雪晨非常安静。"],["Beyond the last field the wilderness begins.","最后一块田之外,荒野开始。"],["The border between them is only a hedge.","两者之间的边界只是一道树篱。"],["Nothing here is artificial, and nothing is disturbed.","这里没有一样是人造的,也没有一样被打扰。"],["In the distance a lightning storm lights the sky.","远处,一场雷电照亮天空。"]]},{"t":"Storms and Seasons","s":[["The monsoon brings the rainfall that the whole region waits for.","季风带来整个地区都在等的降雨。"],["A hurricane, a typhoon and a tornado are the same storm with three names.","飓风、台风和龙卷风,是同一场风暴的三个名字。"],["Heavy rain means flooding, and a sprinkle is only enough to wet the dust.","大雨意味着洪水,而毛毛雨只够把尘土打湿。"],["Heating the air makes it rise and circulate.","加热空气使它上升并循环。"],["An arid country will freeze at night and bake by day.","干旱的地方夜里会结冰,白天会烤人。"],["At dusk the wind will blow, then puff, then drop.","黄昏时风会吹,然后一阵一阵,然后停。"],["The intensity of a storm is not the same as its intensive damage.","风暴的强度,不等于它密集的破坏。"]]},{"t":"The Shape of the Land","s":[["The terrain of the north is rough, and the landscape of the south is smooth.","北方地形崎岖,南方风景平缓。"],["Two ridges run parallel to the coast.","两道山脊与海岸平行。"],["The source of the river is far away, in a desolate valley.","这条河的源头在很远的一个荒凉山谷里。"],["From a distant hill you can see the whole plain.","从远处的山丘上,你能看见整片平原。"],["A new road will upgrade the region, but it will change the environment.","一条新路会提升这个地区,但也会改变环境。"],["The surrounding villages share the same condition.","周围的村庄处境相同。"],["The situation is not desperate yet.","情况还没到绝望的地步。"]]},{"t":"Odd Things","s":[["A phenomenon is something that happens and cannot be explained at once.","现象是发生了却一时解释不了的事。"],["A thermodynamic system trades heat for work.","热力学系统用热换功。"],["The view was super, and the walk was interesting.","景色极好,走起来也有意思。"],["Smoke will emerge from the vent and float on the air.","烟会从喷口冒出来,浮在空气里。"],["Wash the dirt off first.","先把泥土洗掉。"],["On a clear night the sky is a heaven of stars.","晴朗的夜里,天空是一片星星的天堂。"],["A northeast wind in winter, a southwest wind in summer.","冬天刮东北风,夏天刮西南风。"],["Petrol, gasoline and petroleum are the same thing at three stages.","汽油、车用汽油和石油,是同一个东西的三个阶段。"]]}],"2":[{"t":"How a Leaf Works","s":[["In sunlight a leaf carries out photosynthesis.","在阳光下,叶子进行光合作用。"],["It takes in dioxide and water and releases oxygen.","它吸收二氧化碳和水,放出氧气。"],["Every cell must respire, day and night.","每个细胞日夜都要呼吸。"],["Roots take up nutrient from the soil.","根从土壤中吸收养分。"],["The uptake is slow, and the circulation carries it up.","吸收很慢,循环把它送上去。"],["A plant will absorb what it needs and release the rest.","植物吸收需要的,放出其余的。"],["Energy comes in as light and leaves as heat.","能量以光的形式进入,以热的形式离开。"]]},{"t":"From Seed to Scent","s":[["A seed in damp soil will germinate.","湿土里的种子会发芽。"],["A shoot appears, then a bud burgeons into a flower.","嫩芽冒出,然后花苞鼓成花。"],["The blossom opens, and the bloom fills the garden with scent.","花开起来,满园都是香气。"],["The scent is aromatic because it attracts insects.","这香气是芳香的,因为它吸引昆虫。"],["Later the fruit will ripen on the branch.","之后果实会在枝上成熟。"],["After that the leaves wither and fall.","再往后叶子枯萎、落下。"],["They decompose, rot and decay, and the heap smells stale.","它们分解、腐烂、朽坏,那堆东西闻起来陈腐。"]]},{"t":"Naming Living Things","s":[["Botany studies plants; it begins with one organism.","植物学研究植物,从单个生物体开始。"],["We classify every plant and name its species.","我们给每一种植物分类,给它的物种命名。"],["Genetics explains the variation we see.","遗传学解释了我们所见的变异。"],["A single mutation can change a colour or a shape.","一个突变就能改变颜色或形状。"],["Over long periods such changes let a line evolve.","长时间下来,这些变化让一个谱系演化。"],["Hybridisation and diversity keep a population strong.","杂交和多样性让种群保持强健。"],["A perennial herb returns every year, and must reproduce before winter.","多年生草本每年回来,并且必须在冬天前繁殖。"],["Numbers fluctuate with rain and temperature, and the vegetation cover changes too.","数量随降雨和气温波动,植被覆盖也在变。"]]},{"t":"A Day on the Farm","s":[["The farmer ploughs the arable field with a spade.","农夫用铁锹翻可耕的田。"],["He breaks the clods with a rake and sows the seed.","他用耙子打碎土块,然后播种。"],["In summer he must weed, and a thorn costs him a morning.","夏天他得除草,一根荆棘就要花掉一个上午。"],["At harvest he will pick the fruit and pluck the grapes.","收获时他摘果子、采葡萄。"],["He stacks the hay in a heap and ties a bundle of straw.","他把干草堆成一堆,捆一捆稻草。"],["A bunch of flowers stands in a vase on the table.","一束花插在桌上的瓶子里。"],["Land once abandoned can be reclaimed, and the yield rises year by year.","曾经荒废的地可以复垦,产量年年上升。"],["On the terrace above the village a plantation of vines is worked by hand.","村子上面的梯田里,葡萄园靠手工打理。"]]},{"t":"Wood and Grass","s":[["Timber and charcoal come from the forestry beyond the meadow.","木料和木炭来自草甸那边的林场。"],["A log is cut, and the logo of the company is burned into it.","一根木头被锯开,公司的标识烙在上面。"],["Look at a tree: the trunk divides into a branch, and the branch into a bough.","看一棵树:树干分成枝,枝又分成大枝。"],["The root holds it, and the grass grows thin beneath it.","根把它抓住,下面的草长得很稀。"],["A reed stands by the water, and a weed covers the lawn.","芦苇立在水边,杂草盖满草坪。"],["Olive, pine, vine, violet, tulip and mint each need their own soil.","橄榄、松树、葡萄、紫罗兰、郁金香和薄荷各有各的土。"]]},{"t":"The Ecosystem","s":[["Ecology studies the ecosystem as a whole.","生态学研究作为整体的生态系统。"],["Horticulture applies the same rules in a garden.","园艺把同样的规律用到园子里。"],["A rainforest and a jungle are the richest habitats on land.","雨林和丛林是陆地上最富饶的生境。"],["A reef in warm water is the sea's equivalent.","温水里的珊瑚礁是海里的对应物。"],["A fungus or a mould breaks dead matter down, and an alga feeds on what is left.","真菌或霉菌分解死物,藻类靠剩下的东西为生。"],["Pollen travels by wind or insect, and an enzyme or a catalyst speeds the reaction.","花粉靠风或昆虫传播,酶或催化剂加速反应。"],["A mechanism of counterbalance keeps the surroundings stable until they exceed a limit.","一个平衡机制让周围环境保持稳定,直到越过某个界限。"]]},{"t":"Guarding the Green","s":[["To protect a forest is cheaper than to rebuild one.","保护森林比重建森林便宜。"],["Conservation means preserving a wetland and setting land aside.","保育意味着保住湿地、把土地留出来。"],["A bush fire must be extinguished before it spreads.","林火必须在蔓延前扑灭。"],["A fire will destruct everything and ruin a century of growth.","一场火会毁掉一切,毁掉百年的生长。"],["One careless decision can demolish a habitat and undermine a population.","一个草率的决定就能拆掉生境、削弱种群。"],["A road that infringes on a reserve may push a species towards extinction.","一条侵占保护区的路可能把物种推向灭绝。"],["Left alone, a fallen tree will perish within a season.","不去管它,倒下的树一个季节内就朽尽了。"]]},{"t":"Was It Worth It","s":[["The pattern is always the same: a small impact, a seasonal change, an outcome nobody predicted.","模式总是一样:一点冲击、一次季节变化、一个谁也没料到的结果。"],["An experimental plot gives the first real evidence.","一块试验田给出第一批真正的证据。"],["A favourable season and a productive field give an effective harvest.","有利的季节加上丰产的田,给出有效的收成。"],["An efficient farm wastes little.","高效的农场浪费很少。"],["The gain may be considerable, the loss massive, the value immense.","收益可能相当可观,损失可能巨大,价值无比。"],["The difference between a maximal and a minimal effort is often the optimal one.","最大努力与最小努力之间的那个差别,往往就是最优解。"],["An eco-friendly farm, a shade-tolerant plant and a short-day crop all work with nature.","生态友好的农场、耐阴植物和短日照作物,都顺着自然做事。"]]},{"t":"Working the Land","s":[["They cultivate the field in spring and rear animals behind the house.","春天他们耕地,在屋后养牲畜。"],["An emission is what goes out of a chimney and into the sky.","排放是从烟囱出去、进了天空的东西。"]]}],"3":[{"t":"Who Studies Animals","s":[["A biologist studies life itself.","生物学家研究生命本身。"],["A zoologist studies animals, and an ecologist studies how they live together.","动物学家研究动物,生态学家研究它们如何共处。"],["A botanist studies the plants around them.","植物学家研究它们周围的植物。"],["Their subject is all wildlife: the fauna of a region and the flora it feeds on.","他们的对象是整个野生生物界:一个地区的动物群和它赖以为生的植物群。"],["Every creature, however small, belongs to a species.","每一个生物,无论多小,都属于某个物种。"]]},{"t":"Branches of the Family","s":[["A mammal feeds its young on milk.","哺乳动物用奶喂养幼崽。"],["A primate has hands, a vertebrate has a backbone, and a reptile has scales.","灵长类有手,脊椎动物有脊柱,爬行动物有鳞。"],["An amphibian lives in water and on land.","两栖动物在水里和陆地上都能生活。"],["A carnivore eats meat; a herbivore eats plants.","食肉动物吃肉,食草动物吃植物。"],["All of them originate from one ancestor and derive their habits from it.","它们全都源自同一个祖先,并从那里获得习性。"],["The traits stem from a common line, and each descendant passes them to its offspring.","特征来自共同的谱系,每个后代再把它传给子代。"],["A subgroup may split off and become a new line.","一个亚群可能分出去,成为一个新的谱系。"]]},{"t":"Flock, Herd, Swarm","s":[["A flock of birds, a herd of deer and a swarm of bees are all crowds.","一群鸟、一群鹿和一群蜂都是群体。"],["A throng of people fills the market square.","一大群人挤满集市广场。"],["A beast is wild; a brute is only cruel.","野兽是野的;畜生只是残忍。"],["In the mating season the courtship comes first.","到了交配季节,先有求偶。"],["Then the female will lay her eggs, and the young will hatch.","然后雌性产卵,幼体孵出。"],["The brood grows, and fish spawn in the shallows.","一窝幼雏长大,鱼在浅水里产卵。"],["Some species breed twice a year and interbreed with their neighbours.","有的物种一年繁殖两次,并与邻近的同类杂交。"],["A species that proliferates quickly may pay for it with sterility.","增殖快的物种可能要以不育为代价。"],["Only when they mature do they leave the nest.","只有成熟了,它们才离开巢。"]]},{"t":"Parts of a Body","s":[["Anatomy is the study of the body.","解剖学研究身体。"],["Skin, claw, paw, beak and fin each have a job.","皮肤、爪、掌、喙和鳍各有各的用处。"],["A bird has a wing, a plume of feathers and a tail.","鸟有翅膀、一撮羽毛和尾巴。"],["A mammal has fur, and a hedgehog's bristle will curl at a touch.","哺乳动物有毛,刺猬的硬毛一碰就卷。"],["A ram has a horn, and an elephant a tusk of ivory.","公羊有角,大象有象牙。"],["Not one cell is wasted.","没有一个细胞是多余的。"]]},{"t":"Small Lives, Big Numbers","s":[["A worm turns the soil and a pest ruins the crop.","蚯蚓翻土,害虫毁庄稼。"],["A parasite lives on its host, and a spider waits in the corner.","寄生虫住在宿主身上,蜘蛛在角落里等待。"],["A butterfly opens on the flower, a mosquito arrives at dusk, a cricket sings under a stone.","蝴蝶在花上张翅,蚊子黄昏到来,蟋蟀在石下唱歌。"],["A penguin and a seal live where the water is cold.","企鹅和海豹住在水冷的地方。"],["A tortoise and a turtle carry their houses with them.","陆龟和海龟把房子背在身上。"],["A whale is no fish, and a kangaroo is no deer.","鲸不是鱼,袋鼠也不是鹿。"]]},{"t":"In the Field","s":[["A camel crosses the desert, and a panda eats bamboo.","骆驼穿越沙漠,熊猫吃竹子。"],["An elephant never forgets, and a bear sleeps through the winter.","大象从不忘事,熊睡过整个冬天。"],["A wolf hunts in a pack, a fox outwits the dog, and a dragon belongs to story.","狼成群捕猎,狐狸比狗狡猾,而龙属于故事。"],["A cub, a calf, a pup and a lamb are all the young of something.","幼兽、幼崽、小狗和羊羔都是某种动物的孩子。"],["Cattle, an ox, a bull and a buffalo are all cattle.","牛、阉牛、公牛和水牛都是牛。"],["A horse, a zebra and a donkey may all wear a saddle and a harness.","马、斑马和驴都可能背上鞍、套上挽具。"],["A mouse and a rat share the barn, a squirrel the tree, a hare the field, a frog the pond.","老鼠和田鼠分住谷仓,松鼠住树上,野兔住田里,青蛙住池塘。"]]},{"t":"Wings Overhead","s":[["A falcon, a hawk, an eagle and an owl all hunt.","猎隼、鹰、雕和猫头鹰都捕猎。"],["Only the owl works at night.","只有猫头鹰夜间工作。"],["A swallow, a sparrow, a pigeon and a crow live close to people.","燕子、麻雀、鸽子和乌鸦住在人身边。"],["A swan and a goose swim in the pond, and a cock wakes the farm.","天鹅和鹅在池塘里游,公鸡叫醒农场。"]]},{"t":"Behaviour and Illness","s":[["Behaviour is a language.","行为是一种语言。"],["A bite and a sting are warnings; a bark and a roar are claims.","咬和蜇是警告;吠和吼是宣告。"],["A rub against a tree is a signature.","在树上蹭一下就是签名。"],["An animal will creep through grass and crawl under a rock to reach its habitat.","动物会从草里潜行、从石头下爬过,抵达栖息地。"],["It builds a nest or a hive, marks the cell of its cage, and rests in the stable or the barn.","它筑巢或筑蜂房,在笼子的格子里做记号,在马厩或谷仓里休息。"],["A barrier, a bar and a hedge keep it in.","栅栏、横杆和树篱把它围住。"],["An epidemic spreads as a virus, a germ, a microbe and bacteria multiply.","随着病毒、病菌、微生物和细菌的繁殖,流行病扩散开来。"],["Metabolism, protein and vitamin levels decide who survives.","代谢、蛋白质和维生素的水平决定谁能活下来。"],["The body secretes and excretes what it cannot use, and a predator devours its prey whole.","身体把用不上的东西分泌、排泄掉,捕食者则把猎物整个吞下。"]]},{"t":"Instinct and Survival","s":[["Instinct is intuitive, and older than thought.","本能是直觉的,比思考更古老。"],["A potential for intelligence is functional only if the animal stays sensitive and flexible.","智力的潜能只有在动物保持敏感和灵活时才有用。"],["Acoustic signals come at night, and optical cues by day.","夜里是听觉信号,白天是视觉线索。"],["A nocturnal animal is active after dark, a dormant one sleeps through the bad months.","夜行动物天黑后活跃,休眠的动物睡过坏月份。"],["Hibernation is the deepest sleep of all.","冬眠是所有睡眠中最深的一种。"],["A keeper can track and trace a herd and alternate pasture.","饲养员能追踪一群动物,轮换牧场。"],["A captive animal is defensive; it will undergo stress and suffer in silence.","被圈养的动物是防御性的;它会承受压力,默默忍受。"],["For many, subsistence is a daily question: will we exist tomorrow?","对许多动物来说,生存是每天的问题:明天我们还存在吗?"],["To exterminate a species is easy, to tame one is hard.","灭绝一个物种很容易,驯服一个很难。"],["A shepherd learns that a cruel winter is the real teacher.","牧羊人会明白,残酷的冬天才是真正的老师。"]]},{"t":"Small and Vulnerable","s":[["Two kinds of finch may hybridise where their ranges meet.","两种雀在分布区重叠的地方可能杂交。"],["An insect is small, and a gene is smaller.","昆虫很小,而基因更小。"],["A victim is the one it happened to.","受害者是它发生在身上的那个。"],["A young animal is vulnerable until it can run.","幼兽在能跑之前是脆弱的。"]]}],"4":[{"t":"What Is Out There","s":[["The cosmos is everything there is.","宇宙就是存在的一切。"],["Our galaxy is one among billions, and the universe goes beyond reckoning.","我们的银河系只是几十亿中的一个,而宇宙之大无法计算。"],["Interstellar space is not empty: dust and gas drift between the stars.","星际空间并不空:尘埃和气体在群星之间漂流。"],["A comet drags its tail behind it.","彗星拖着尾巴。"],["A terrestrial planet is rocky, and a celestial body may be ice.","类地行星是岩石质的,天体也可能是冰。"],["Astronomy maps all this; astrology only pretends to.","天文学测绘这一切;占星术只是假装能。"],["An astronaut in orbit sees the curve of the earth below.","轨道上的宇航员向下看到地球的弧线。"]]},{"t":"Leaving the Ground","s":[["A meteorite leaves a crater in the ground.","陨石在地面留下一个陨石坑。"],["Volcanic ash and dust settle in an envelope around the globe.","火山灰和尘埃像封套一样落在地球周围。"],["A spacecraft, a spaceship, a probe and a module all travel by propulsion.","航天器、宇宙飞船、探测器和舱体都靠推进力飞行。"],["Pressure and dynamics decide whether they hold together.","压力和动力学决定它们会不会散架。"],["Motion is a matter of the orbit and the ecliptic.","运动取决于轨道和黄道。"],["A curve, a tail and a vent are all parts of the same machine.","一条曲线、一个尾部和一处喷口,都是同一台机器的一部分。"]]},{"t":"Watching the Sky","s":[["An observatory stands on the mountain, and a telescope the size of a house points up.","天文台立在山顶,一台房子那么大的望远镜指向上方。"],["A flyby past a moon is a spectacle.","一次掠过卫星的飞越是一场奇观。"],["An expedition to a crater is exploration of the hardest kind.","一次前往陨石坑的远征是最难的那种探索。"],["Diameter and radius measure a world.","直径和半径度量一个世界。"],["Substance, composition and compound describe what it is made of.","物质、成分和化合物描述它由什么构成。"],["A fossil in a sample, a specimen under glass, a particle, a molecule, an atom, an ion, an electron, a quantum.","样品里的化石、玻璃下的标本、粒子、分子、原子、离子、电子、量子。"],["Each is a smaller piece of the same question.","每一个都是同一个问题更小的一块。"]]},{"t":"Reading the Signal","s":[["A liquid and a fluid flow; a solid does not.","液体和流体都会流动,固体不会。"],["To synthesise a compound is to build a formation nobody has seen.","合成一种化合物,就是造出没人见过的形成物。"],["Every method has limits.","每种方法都有边界。"],["The spectrum gives frequency, and the antenna picks up a signal.","光谱给出频率,天线接收信号。"],["The circuit carries it, refraction bends it, and ultraviolet light stays invisible.","电路传递它,折射让它偏折,紫外光则始终不可见。"],["A distinct and discernible difference separates one star from another.","一种清晰可辨的差别把一颗星与另一颗分开。"],["A collision can squash a fragment into dust.","一次碰撞能把碎片压成尘埃。"],["A cataclysmic end is not impossible, and the thought is overwhelming.","灾难性的结局并非不可能,这念头压得人喘不过气。"],["It drives some to despair, and others to a desperate hope.","它把一些人推向绝望,把另一些人推向不顾一切的希望。"],["We are not hopeless yet.","我们还没有到毫无希望的地步。"]]},{"t":"Pieces of the Sky","s":[["A chunk of rock the size of a house came down last night.","一块房子那么大的岩石昨夜落了下来。"],["A dimension is one way of measuring it.","维度是测量它的一种方式。"],["Anything radioactive will glow on a photograph.","任何放射性的东西都会在照片上发亮。"]]}],"5":[{"t":"From Primary to Doctor","s":[["Education starts at primary school and goes on to secondary school.","教育从小学开始,一直到中学。"],["After that come a university, a college, an institute or an academy.","之后是大学、学院、研究所或专科学校。"],["A pupil who graduates passes through a ceremony.","毕业的学生要走过一场典礼。"],["He may collect a bachelor, a master or a doctor's title.","他可能拿到学士、硕士或博士的头衔。"],["On campus the fresher is lost, and the senior is already leaving.","在校园里,新生还在迷路,四年级的已经在离开。"],["The sophomore knows the way, and the junior is planning a career.","二年级认得了路,三年级在规划职业。"],["Later all of them become alumni.","后来他们都成了校友。"]]},{"t":"Learn, Study, Acquire","s":[["To learn is to take something in; to study is to work at it.","学是把东西装进去;研读是为它下功夫。"],["You study in order to acquire knowledge.","你读书是为了获得知识。"],["Later you study further to gain expertise.","之后你继续钻研,取得专长。"],["Everyone starts as a novice.","每个人起初都是新手。"],["Firms still recruit on the strength of a degree.","公司招人时看的仍是学位。"],["A country that is literate but not numerate has only half an education.","一个识字却不会算数的国家,教育只算做了一半。"],["Illiteracy is expensive.","文盲的代价很高。"]]},{"t":"The Campus Day","s":[["On orientation day a platform of talks explains the rules.","迎新那天,平台上的几场讲座讲清规矩。"],["You register, appear on the roster, enrol and finish matriculation.","你注册、上名册、入学登记,办完入学手续。"],["Accommodation means a room in a dorm or a hall of residence.","住宿意味着宿舍或学生公寓里的一间房。"],["The canteen and the dining hall serve the same three dishes.","食堂和餐厅卖同样的老三样。"],["A coed school takes both boys and girls.","男女同校的学校男女生都收。"]]},{"t":"Who Runs the Place","s":[["A headmaster runs a school, a principal a college, a dean a faculty.","校长管一所学校,院长管一个学院,系主任管一个系。"],["The professor lectures, and the scholar writes.","教授讲课,学者写作。"],["The scientist experiments, and the mentor quietly changes a life.","科学家做实验,而导师悄悄改变一个人的一生。"],["A tutor takes a small group, and a lecturer a large one.","导师带小班,讲师带大班。"],["An assistant marks the papers.","助教批改试卷。"]]},{"t":"Papers and Titles","s":[["A candidate must qualify before anything else.","申请者首先要合格。"],["Then he is certified, and holds a license or a permit.","然后被认证,持有执照或许可证。"],["At the end he receives a diploma.","最后他拿到文凭。"],["A degree is the proof, and a title is the name of it.","学位是证明,头衔是它的名字。"],["A diplomat is not a graduate of anything, though an ambassador may hold three degrees.","外交官并不是哪个专业的毕业生,尽管一位大使可能有三个学位。"]]},{"t":"Clever, Wise, or Neither","s":[["An intelligent student may be clever without being smart.","聪明的学生可能机灵却不精明。"],["An all-round pupil wins prizes, and a genius wins attention.","全面发展的学生拿奖,天才赢得关注。"],["An elite school produces confidence; an idiot is simply someone who never had a chance.","精英学校生产自信;而白痴只是从来没得到过机会的人。"],["Wisdom is slower than wit.","智慧比机智慢。"],["Aptitude is what you are given, and capability is what you build.","天资是给你的,能力是你自己建的。"],["An excellent performance is outstanding, and a brilliant one is rare.","优秀的表现是出众的,杰出的表现是罕见的。"],["Skill is what remains when the diligent and the painstaking have gone to bed.","技艺,是勤勉的人和刻苦的人都睡下之后剩下的东西。"]]},{"t":"Name and Fame","s":[["Prestige follows reputation the way a shadow follows a body.","声望追随名声,就像影子跟着身体。"],["An eminent scholar is respected.","著名的学者受人尊敬。"],["A notorious one is only talked about.","臭名的那位只被人议论。"],["Esteem is quieter than fame.","敬重比名气安静。"],["To respect a teacher is not the same as to fear him.","尊敬一位老师,不等于怕他。"]]},{"t":"How to Teach","s":[["How you approach a scheme matters more than the scheme.","你怎么着手一个方案,比方案本身更重要。"],["A motive motivates, and praise stimulates.","动机会驱动,表扬会激励。"],["A deadline spurs you on, and gives you an impetus.","截止期鞭策你,给你一股推动力。"],["A real teacher instils a habit rather than cramming a fact.","真正的好老师灌进去的是习惯,不是硬塞的事实。"],["A school that emphasises marks and enhances nothing will enable nobody.","只强调分数、什么也不提升的学校,谁也成全不了。"],["It will inspire no one, and it will spoil the pupils it indulges.","它激励不了任何人,还会把纵容的学生惯坏。"],["To abuse a system is easier than to mend it.","滥用一套制度,总比修补它容易。"]]},{"t":"The Trouble with Reform","s":[["The real problem is seldom the issue itself.","真正的麻烦很少是问题本身。"],["It is the affair around it.","而是围绕它的那一堆事。"],["Any controversial reform becomes a puzzle for the parents.","任何有争议的改革,对家长都是一道难题。"],["It becomes a riddle for the staff.","对教师则是一道谜语。"],["And the answer stays obscure for years.","而答案多年都模糊不清。"]]},{"t":"What the Library Holds","s":[["The library is where a literature begins.","图书馆是文献开始的地方。"],["An article by an author, a tale, a work of fiction, a story, a diary, a book of poetry.","一篇作者写的文章、一个故事、一部小说、一个短篇、一本日记、一本诗集。"],["A magazine and a journal have different readers.","杂志和学术期刊有两拨不同的读者。"],["Good coverage means a bibliography that others can follow.","好的覆盖意味着别人能顺着参考书目找下去。"],["An encyclopedia summarises, a biography explains, a documentary shows.","百科全书做概述,传记做解释,纪录片做展示。"]]},{"t":"Paper and Screen","s":[["A series, a record, a file and a profile all store something.","一套丛书、一份档案、一个文件、一份简介,都存着点什么。"],["A draft is not final, and a sketch is not a picture.","草稿不是定稿,速写不是画。"],["A brochure is thin, and a manual is thick.","小册子薄,手册厚。"],["Every book has a frame, an index, a catalogue and a category.","每本书都有版式、索引、目录和类目。"],["An inventory lists what is there, and a list keeps it short.","清单列出有什么,而一张清单把它变短。"],["Read the content in its context, one chapter at a time.","要在语境里读内容,一次一章。"],["The volume sits on the shelf like a reel of film.","那一卷书躺在书架上,像一卷胶片。"]]},{"t":"The Map of Subjects","s":[["Every subject has its object.","每门学科都有它的对象。"],["Every student has a major and a minor.","每个学生都有主修和辅修。"],["Sociology studies groups, politics studies power, economics studies scarcity.","社会学研究群体,政治学研究权力,经济学研究稀缺。"],["Marketing studies desire, and accounting and audit study money.","市场营销研究欲望,会计与审计研究钱。"],["Statistics studies uncertainty, psychology the mind, philosophy the argument.","统计学研究不确定性,心理学研究心智,哲学研究论证。"],["Logic studies the form of it.","逻辑学研究论证的形式。"],["Biology, physics and chemistry divide up the material world.","生物、物理和化学切分物质世界。"],["Agriculture feeds us, logistics moves what is grown, and geography maps where it happens.","农业养活我们,物流运送种出来的东西,地理画出它发生在哪里。"],["History explains why; engineering builds what comes next.","历史解释为什么;工程建造接下来的东西。"],["Mechanics explains the building, and electronics controls it.","力学解释这座建筑,电子学控制它。"],["Maths is the language underneath: arithmetic, geometry, algebra, calculus.","数学是底下那门语言:算术、几何、代数、微积分。"]]},{"t":"Numbers and Shapes","s":[["Add one and one, and you have a sum, a total you can write down.","一加一得到一个和,一个可以写下来的总数。"],["A merger of two firms follows the same equation.","两家公司合并遵循同一个等式。"],["Two identical pages are the same page twice.","两页完全相同的内容就是同一页的两遍。"],["Minus takes away: subtract, multiply, divide.","减号拿走:减、乘、除。"],["What is left is the dividend and the remainder.","剩下的是被除数和余数。"],["The answer is rational only if the numbers agree.","只有数字合得上,答案才是有理数。"],["A parameter is fixed; a variable is not.","参数是固定的;变量不是。"],["An even number divides by two, and an odd one does not.","偶数能被二整除,奇数不能。"],["The mean is the average, and a multiple is what you get when you double, triple or quadruple it.","均值就是平均数,而倍数是你翻倍、三倍、四倍得到的结果。"],["Maximum and minimum mark the two ends.","最大值和最小值标出两端。"],["Approximately means not exactly: a decimal, a per cent, a proportion, a rate, a ratio, a fraction, a scale.","大约意味着不精确:小数、百分比、比例、比率、比、分数、刻度。"]]},{"t":"Draw What You Mean","s":[["A chart, a graph, a diagram and a table all show the same numbers.","图表、曲线、示意图和表格展示的是同一组数字。"],["A matrix is a table with rules.","矩阵是一张带规则的表格。"],["A rectangle, a cube, an angle and a triangle measure space.","矩形、立方体、角和三角形度量空间。"],["A diagonal cuts a shape in two; a straight line does not.","对角线把一个形状切成两半;直线不会。"],["A circle is round, and a dot is a circle with no size.","圆是圆的,而点是没大小的圆。"],["A sphere, a cone, an extent, a width and a length describe the rest.","球体、锥体、范围、宽度和长度描述剩下的部分。"]]},{"t":"In the Laboratory","s":[["In the laboratory the experiment produces data.","在实验室里,实验产生数据。"],["Data have both quantity and quality.","数据既有数量也有质量。"],["A theory that is empirical can be tested.","经验性的理论可以被检验。"],["A practical doctrine can be applied, and a principle can be taught.","实用的学说可以应用,原理可以教授。"],["A discipline and a formula hold the field together.","一门学科和一个公式把整个领域撑住。"],["A component composes a mixture, and a blend is a mixture you can taste.","成分构成混合物,而调好的混合是你能尝出来的。"]]},{"t":"Hot, Cold, Wet, Dry","s":[["An ounce of density, a Fahrenheit reading, a mercury thermometer.","一盎司的密度、一个华氏读数、一支水银温度计。"],["A battery and a volt do the arguing.","一块电池和一伏特替人辩论。"],["Heat will radiate, and light will emit.","热会辐射,光会发射。"],["Glass is transparent, a tube is hollow, and ozone is thin.","玻璃透明,管子中空,臭氧稀薄。"],["Gravity pulls, and friction slows.","重力在拉,摩擦力在拖。"],["An eccentric result will displace the old one.","一个古怪的结果会把旧的顶掉。"],["Water will boil, ice will melt, sugar will dissolve, iron will rust, juice will ferment.","水会沸腾,冰会融化,糖会溶解,铁会生锈,果汁会发酵。"],["A dilute acid that is noxious is dangerous.","一瓶刺鼻的稀酸是危险的。"],["A static charge does not move, an inert gas does not react, and an inherent property cannot be taken away.","静电荷不动,惰性气体不反应,固有属性拿不走。"]]},{"t":"Term, Timetable, Deadline","s":[["The term begins, the semester runs, and the timetable becomes a schedule.","学期开始,半学期推进,课表变成日程。"],["Every page has a deadline on it.","每一页上都有一个截止日。"],["A course has lessons, a curriculum has courses.","一门课有若干节,一套课程体系有若干门课。"],["A seminar is a forum, and a syllabus is the map of it all.","研讨课是一个论坛,教学大纲是这一切的地图。"],["The system is rudimentary at the bottom and elementary in the middle.","这套体系在底层是初步的,中段是入门的。"],["It is basic and fundamental before it is profound.","它在深奥之前先是基础和根本的。"],["Even then it may be profound only on the surface.","即便如此,它也可能只是表面上深奥。"]]},{"t":"Required or Chosen","s":[["Some subjects are compulsory, and a prerequisite comes first.","有些科目是必修,而前置课要先修。"],["A few are selective, and many are elective.","少数是选拔性的,很多是选修。"],["Every assignment must be submitted on time.","每份作业都必须按时提交。"],["It should be previewed, reviewed and revised.","它应该被预习、复习和修改。"],["Then it is inspected, and the sources are consulted again.","然后被检查,资料再查一遍。"],["To skim is to read fast, to scan is to look for one thing, to scrutinise is to trust nothing.","略读是快读,扫读是找一个东西,细读是什么都不信。"],["To recite is to remember aloud, and to dictate is to speak while others write.","背诵是出声记住,口述是别人写而你讲。"]]},{"t":"Exam Day","s":[["The examination, the test and the quiz all lead to a presentation.","考试、测验和小考,最后都通向一次展示。"],["A student who plagiarises or copies is finished.","抄袭或照抄的学生就完了。"],["Print the thesis, the essay, the paper, the dissertation and the project.","把学位论文、文章、论文、毕业论文和项目报告都打印出来。"],["Give each one a heading.","给每一份一个标题。"],["Begin at the outset with an outline.","开头先列提纲。"],["Make your point clear, and put the gist of your opinion in the first line.","把观点说清楚,并把意见的要点放在第一行。"]]},{"t":"Argue It Properly","s":[["To introduce a subject you need a reference to cite.","要引出话题,你需要一条可以引用的参考。"],["You need a source to quote and a passage to extract.","你需要一个可以摘引的来源,和一段可以摘出的文字。"],["Then an abstract and a summary.","然后是一段摘要和一个总结。"],["Assume nothing you cannot test, and presume nothing you cannot check.","无法检验的不要假定;无法核对的不要推定。"],["Suppose a case, and see where it goes.","假设一种情形,看它走到哪里。"],["A hypothesis is a guess with a method; a postulate is a guess with authority.","假说是有方法的猜测;公设是有权威的猜测。"],["To speculate is to guess without either.","推测是两者都没有的猜测。"]]},{"t":"Think and Conclude","s":[["You may predict what will happen and perceive what is happening.","你可以预测将要发生什么,察觉正在发生什么。"],["You may detect what is hidden and discern what is faint.","你可以发现藏着的东西,辨认微弱的东西。"],["You recognise what is familiar, and you are conscious of what you reckon is true.","你认出熟悉的东西,并意识到你认为真实的东西。"],["Some would deem the claim false, but the data imply otherwise.","有人会认为这个说法是错的,但数据暗示相反。"],["A deliberate error will represent the opposite of the truth.","一个故意的错误会代表真相的反面。"],["If you insist on one reading, you will persist in it.","你若坚持一种读法,就会一直固执下去。"],["Better to understand the whole and comprehend the parts.","不如先理解整体,再理解各部分。"],["Analyse the material, diagnose the fault, infer the cause, deduce the rule.","分析材料,诊断故障,推断原因,演绎出规则。"],["Then conclude with care.","然后再谨慎地下结论。"]]},{"t":"Compare and Prove","s":[["An analogy helps, but to compare is not to contrast.","类比有用,但比较不等于对比。"],["The two often overlap.","两者常常重叠。"],["A contradiction is not the same as a disagreement.","矛盾不等于分歧。"],["Those who differ may still be diverse, and the nuance lies in the detail.","意见不同的人仍可能各有道理,而细微差别就在细节里。"],["Be thorough: give an example, and then an instance.","要彻底:举一个例子,再举一个实例。"],["Confirm, demonstrate, illustrate, manifest and prove what you can.","能证实、论证、说明、显现和证明的就去做。"],["Determine, decide and resolve what you must.","必须断定、决定和解决的,就不要拖。"],["An inductive method starts from the detail and ends at the rule.","归纳法从细节出发,到规则结束。"]]},{"t":"Survey, Score, Reward","s":[["A survey, a piece of research, an observation, an inquiry and a query lead to a questionnaire.","一次调查、一项研究、一次观察、一次询问和一个疑问,最后落成一份问卷。"],["To achieve, to accomplish and to attain are three ways of arriving.","达成、完成和达到,是抵达的三种方式。"],["Credit, score, mark, grade and rank measure the arrival.","学分、得分、分数、等级和名次度量这次抵达。"],["A row of desks and a queue at the door measure the wait.","一排课桌和门口的一列队伍度量等待。"],["A grant pays, and praise and appreciation reward.","拨款付钱,表扬和欣赏是回报。"],["Feedback, honest or not, tells you where you stand.","反馈,不管诚实与否,都告诉你站在哪里。"],["Never underestimate the difficulty, and never overestimate your progress.","绝不要低估难度,也绝不要高估自己的进度。"],["Apply for a fellowship or a scholarship, and collect the reward, the award and the prize.","去申请研究员基金或奖学金,领回报酬、奖励和奖品。"],["Remember that the fee comes first.","记住学费永远排在前面。"]]},{"t":"In Class","s":[["Students cram the night before and forget it by Friday.","学生考前一夜死记,到周五就忘了。"],["A capable student needs only one look at it.","有能力的学生只需看一眼。"],["Two plus two is four; that is where most people stop.","二加二等于四;多数人到此为止。"],["Submit the essay, and do not disagree with the evidence.","把文章交上去,也不要跟证据顶嘴。"],["A good question will elicit a better answer.","好问题会引出更好的答案。"],["To observe is to watch and write down.","观察是看着并记下来。"],["To inquire is to ask formally.","询问是正式地问。"],["A teacher will appreciate the attempt even when it fails.","即便失败,老师也会欣赏这次尝试。"]]}],"6":[{"t":"From Idea to Patent","s":[["Technology is not the same as technique.","技术不等于技巧。"],["A polytechnic trains the engineer and the mechanic together.","理工学院把工程师和技工放在一起训练。"],["Every advance begins as a small idea.","每一次进步都始于一个小念头。"],["To innovate is to try; to make a breakthrough is to succeed.","创新是去尝试;突破是成功了。"],["A gizmo may look like nothing and still hold a patent.","一个小玩意儿可能不起眼,却握着一项专利。"],["Someone had to devise it, invent it and file the claim.","总得有人把它设计出来、发明出来,再递交申请。"],["To discover is to find what was already there.","发现是找到本来就在那里的东西。"]]},{"t":"Make It Public","s":[["To disclose, reveal, uncover and expose are four ways of making something public.","披露、揭示、揭开和曝光,是把它公开的四种说法。"],["Each inventor works in a narrow domain.","每个发明者都在一个狭窄的领域里工作。"],["It is one realm of knowledge, on a foundation laid by others.","那是知识的一个王国,站在别人打好的地基上。"],["To specialise is to choose.","专精就是选择。"],["To concentrate and to focus are to refuse everything else.","集中和聚焦,就是拒绝别的所有东西。"]]},{"t":"Tools of the Trade","s":[["A device, an appliance, a facility, a piece of equipment, an instrument and a tool.","装置、器具、设施、设备、仪器和工具。"],["Six words for the same habit of making work easier.","六个词,说的是同一个习惯:让活儿变轻。"],["To utilise them is to put them to use, and usage is the record of how.","利用它们就是把它们用起来,而用法是这件事的记录。"],["A tester reads a gauge so that we can measure.","检测器读量表,好让我们测量。"],["Then we calculate, compute, count, estimate, assess and evaluate.","然后我们计算、运算、计数、估算、评估和评价。"],["An accessory is not necessary but convenient.","配件不必要,但方便。"],["A byproduct is not wanted but produced, and an auxiliary part helps the main one.","副产品不想要却被生产出来,而辅助部件是帮主部件的。"]]},{"t":"Add, Gather, Attach","s":[["A versatile tool can add a function.","多用途工具能加一项功能。"],["It can accumulate fittings as you buy them.","你买一件,它就能攒下一件配件。"],["You assemble a frame, gather the parts and attach them where they belong.","你组装框架,把零件聚起来,再安到它们该在的地方。"]]},{"t":"Light, Sound, Signal","s":[["Optics begins with a lens.","光学从一片镜片开始。"],["A microscope turns a drop of water into a world.","显微镜把一滴水变成一个世界。"],["Radar sends out a pulse and listens for the echo.","雷达发出一个脉冲,然后听回声。"],["A sensor waits for what comes back.","传感器等着有什么回来。"],["Multimedia puts text, sound and image on one network, and a browser is the window onto it.","多媒体把文字、声音和图像放在同一个网络上,而浏览器是通向它的窗口。"],["You dial a number, open a microcomputer or a laptop, and load the software.","你拨一个号,打开一台微型计算机或笔记本电脑,载入软件。"],["The keyboard, the screen, the loudspeaker and the microphone are the edges of your world.","键盘、屏幕、扬声器和麦克风,是你世界的四边。"]]},{"t":"Old Tape, New Signal","s":[["A cassette and a tape belong to the last century.","磁带和录音带属于上个世纪。"],["Binary and digital belong to this one.","二进制和数字属于这一个。"],["Wireless and high-definition are now ordinary words.","无线和高清如今是普通词。"],["Audio and vision are studied as a single problem.","音频和视觉被当作同一个问题来研究。"],["Fantasy and science fiction have always arrived first.","奇幻和科幻总是先到。"]]},{"t":"Make It Work Better","s":[["A pump moves water and a generator moves electrons.","泵送水,发电机送电子。"],["A gear moves force, and a pivot decides which way it turns.","齿轮传力,支点决定它往哪边转。"],["A hydraulic system pushes with liquid.","液压系统用液体推动。"],["Drainage and sewage take the waste away, and ventilation brings the air in.","排水和污水把废物带走,通风把空气送进来。"],["To compress is to make smaller; to condense is to make denser.","压缩是变小;冷凝是变密。"],["To refine, simplify, purify, filter and distil are five ways of taking something out.","提炼、简化、提纯、过滤和蒸馏,是把某样东西取出来的五种办法。"]]},{"t":"Mode and Phase","s":[["Every machine has a mode, a prototype, a framework, an aspect and a phase.","每台机器都有模式、原型、框架、方面和阶段。"],["To operate it is to facilitate the work.","操作它,就是让工作更顺。"],["To transform, convert, alter, shift and turn it is to change its form.","转变、转换、改动、移换和转动,是改变它的形态。"],["To adapt and adjust it is to change its fit.","适应和调整,是改变它的配合。"],["To pinpoint a fault you must be accurate and precise.","要精确定位故障,你必须准确而精确。"],["A correct answer is right, and a precise one is exact.","正确的答案是对的,精确的答案则是分毫不差。"]]},{"t":"Five Degrees of Bad","s":[["An error, a mistake, a flaw, a wrong setting and a fault.","错误、过失、缺陷、错设和故障。"],["Five degrees of the same misfortune.","同一场不幸的五个等级。"],["A stumble is the mildest of them.","绊一下是最轻的一个。"],["Allow for a contingency.","要给意外留出余地。"],["Circumstance is never entirely on your side.","环境从来不会完全站在你这边。"]]}],"7":[{"t":"What Culture Carries","s":[["Culture is what a people passes on without writing it down.","文化是一个民族不写下来也传下去的东西。"],["A civilisation leaves more behind: walls, laws, and a habit of argument.","文明留下的更多:城墙、法律,以及一种争论的习惯。"],["The renaissance looked back at an older world and copied it.","文艺复兴回头去看一个更古老的世界,把它抄了下来。"],["An epic keeps the whole story in verse.","史诗把整个故事装在韵文里。"],["An ideology explains everything and forgives nothing.","意识形态解释一切,却什么也不宽恕。"]]},{"t":"Tradition and Custom","s":[["A tradition is old, and a convention is only agreed.","传统是旧的,而惯例只是大家同意的。"],["A custom sits between the two.","习俗处在两者之间。"],["Feudalism tied the land to the lord, and slavery tied the person to the owner.","封建制把土地系在领主身上,奴隶制把人系在主人身上。"],["Both raise the same ethical and moral questions.","两者都引出同样的伦理与道德问题。"],["A tribe keeps its own law, and an aboriginal people keeps its own story.","部落有自己的法,原住民有自己的故事。"]]},{"t":"Native and Foreign","s":[["An inhabitant knows the ground; a native was born on it.","居民熟悉这片土地;本地人生在这片土地上。"],["A local will tell you where to eat.","本地人会告诉你去哪儿吃。"],["To a foreigner the same street looks exotic.","对外国人来说,同一条街看着有异域风情。"],["An alien is not from another country but from another world.","alien 不是来自另一个国家,而是来自另一个世界。"],["An anthropologist writes all of this down.","人类学家把这全都写下来。"],["A humanitarian cares less about the notes than about the people.","人道主义者关心的不是笔记,而是人。"]]},{"t":"What Is Left Behind","s":[["Heritage is what we inherit, not what we buy.","遗产是我们继承的,不是我们买的。"],["An antique is old, but old is not always valuable.","古董是旧的,但旧不一定值钱。"],["Archaeology reads the ground, and to excavate is to open it.","考古学读地面,而发掘就是把它打开。"],["A museum keeps what comes out.","博物馆把挖出来的东西收起来。"],["Pottery, a decorated bowl and an engraved stone tell more than a king's name.","陶器、一只带花纹的碗和一块刻字的石头,比国王的名字说得更多。"]]},{"t":"Faith and Ritual","s":[["Religion answers a question that science does not ask.","宗教回答一个科学不问的问题。"],["A ritual makes a belief visible.","仪式让信仰看得见。"],["Etiquette is the ritual of ordinary life.","礼仪是日常生活的仪式。"],["The soul and the spirit are not quite the same word.","灵魂和心灵并不完全是同一个词。"],["A sacred place is set apart, and a hallowed one has been used for a long time.","神圣的地方是被分开的,而奉为神圣的地方已被用了很久。"],["Holy is the strongest of the three.","holy 是三个里最重的。"]]},{"t":"The Church and the Temple","s":[["A Pope leads, a bishop governs, and a priest serves.","教皇统领,主教治理,神父服务。"],["A missionary travels; a monk stays.","传教士走,修士留。"],["The Bible is read in a church, sung in a cathedral, and heard in a choir.","圣经在教堂里读,在大教堂里唱,在唱诗班里被听见。"],["A temple and a pagoda belong to another tradition.","寺庙和塔属于另一个传统。"]]},{"t":"Crown and Sword","s":[["An empire is bigger than a kingdom, and imperial is the adjective for both.","帝国比王国大,而 imperial 是两者共用的形容词。"],["A dynasty counts its years in a chronology of its own.","王朝用自己的年表来计年。"],["An emperor rules an empire; a king and a queen rule a kingdom.","皇帝统治帝国;国王和王后统治王国。"],["A prince and a princess wait, and majesty is what you call them while you wait.","王子和公主在等,而 majesty 是你等的时候对他们的称呼。"],["Nobility holds the land, a lord holds a castle, and a knight holds a promise.","贵族握着土地,领主握着城堡,骑士握着一个承诺。"],["A guardian holds the gate.","守卫握着大门。"]]},{"t":"Fame, Fortune, Setback","s":[["Nostalgia is homesickness for a time, not a place.","怀旧是对一个时间的思乡,不是一个地方。"],["A celebrity has status but no background.","名人有名分,却没有背景。"],["Experience is what you get when the plan fails.","经验是计划失败时你得到的东西。"],["An anecdote is a small story with a point.","轶事是一个带道理的小故事。"],["An accident is not an incident, though both are unplanned.","事故不是事件,尽管两者都不在计划之内。"],["Some thrive in prosperity and break in adversity.","有人在顺境中兴旺,在逆境中折断。"],["A setback is only a setback if you stop.","挫折只有在你停下时才算挫折。"]]},{"t":"At Home and Away","s":[["A royal family is watched by everyone and known by nobody.","王室被所有人看着,却没人真正了解。"],["Being homesick is missing the room more than the country.","想家是想念那个房间,甚于想念那个国家。"]]}],"8":[{"t":"Signs and Symbols","s":[["A language begins with a sign.","语言从一个符号开始。"],["A symbol stands for something else, and a gesture says it with the hand.","符号代表别的东西,而手势用手把它说出来。"],["Handwriting is the oldest personal mark.","笔迹是最古老的个人记号。"],["A pictograph draws the thing itself, and a wedge pressed in clay was the first writing.","图画文字画出事物本身,而压在泥上的楔形是第一批文字。"],["A knot in a rope once counted for a number.","绳上的一个结曾经代表一个数。"],["Linguistics studies all of this as one system.","语言学把这一切当作一个系统来研究。"]]},{"t":"The Shape of a Sentence","s":[["Semantics is about meaning, and syntax is about order.","语义学讲意义,句法学讲顺序。"],["Grammar is the rule that holds both together.","语法是把两者撑在一起的规则。"],["An utterance is what you actually say.","话语是你真正说出来的那句。"],["Oral language is spoken; verbal language uses words, written or not.","口头语言是说的;语言表达用词,不论写不写。"],["An expression, an idiom, a phrase and a clause are four sizes of the same thing.","表达、习语、短语和从句,是同一个东西的四个尺寸。"]]},{"t":"Sound and Accent","s":[["Phonetics studies the sounds themselves.","语音学研究声音本身。"],["You pronounce a word, and your intonation rises at the end.","你念出一个词,语调在结尾上扬。"],["An inflection changes the pitch or the form.","屈折变化改变音高或词形。"],["A dialect has its own words; an accent has only its own sounds.","方言有自己的词;口音只有自己的音。"],["A syllable is a beat, and a phoneme is the smallest sound.","音节是一个节拍,音素是最小的音。"],["A vowel is open, and a consonant closes the mouth.","元音是张开的,辅音把嘴合上。"]]},{"t":"Letters and Words","s":[["An alphabet spells sounds; a logogram writes a whole word.","字母表拼出音;表词文字写整个词。"],["Vocabulary is what you know, and a dictionary is where you check it.","词汇量是你知道的,词典是你查的地方。"],["Tense is time, and a prefix or a suffix changes the meaning.","时态是时间,而前缀或后缀改变意思。"],["An abbreviation shortens a word, and a synonym means the same, while an antonym means the opposite.","缩写把词变短,同义词意思相同,反义词意思相反。"]]},{"t":"Parts of Speech","s":[["A noun names, and a verb does.","名词命名,动词做事。"],["A singular noun is one, and a plural is more than one.","单数名词是一个,复数是多于一个。"],["A pronoun stands in for a noun.","代词代替名词。"],["An adjective describes, and an adverb tells you how.","形容词描写,副词告诉你怎么。"],["A preposition shows place, and a conjunction joins.","介词表示位置,连词起连接作用。"]]},{"t":"Say It Another Way","s":[["A consistent text is easy to follow, even if the subject is complicated.","前后一致的文本好读,即便主题复杂。"],["A complex idea can still be put simply.","复杂的想法也可以说得简单。"],["To compile a dictionary is to gather every version of every word.","编一部词典,就是把每个词的每个版本收起来。"],["To translate is to change the language, and to paraphrase is to change the words.","翻译是换语言,改述是换词。"],["To interpret is to explain what it meant.","解释是说明它原本什么意思。"],["To narrate is to tell it in order, and to illuminate is to throw light on it.","叙述是按顺序讲,阐明是给它打光。"],["To decipher is to read what was hidden.","破译是读出被藏起来的东西。"]]},{"t":"Talk It Over","s":[["Eloquence is the art of saying it well.","雄辩是把话说好的本事。"],["To communicate is not only to speak but to be understood.","沟通不只是说,还要被听懂。"],["A discussion is quiet; a debate has sides.","讨论是安静的;辩论有双方。"],["A brainstorm has no rules, and a commentary has only one voice.","头脑风暴没有规则,而评论只有一种声音。"],["To negotiate is to give something up.","谈判就是放弃一点什么。"],["A contention is a claim someone is willing to defend.","主张是一个有人愿意为之辩护的说法。"]]}],"9":[{"t":"The Press","s":[["A medium carries a message, and the press carries it daily.","媒介承载信息,而新闻界每天承载它。"],["A journalist reports; a correspondent is sent abroad.","记者报道;通讯记者被派到国外。"],["A critic judges, and a commentator explains.","评论家评判,解说员解释。"],["An exponent of a style defends it.","某一风格的代表人物为它辩护。"],["An announcer reads the news, and a messenger carries a note.","播音员读新闻,信使送纸条。"],["An editor cuts, and a typist types.","编辑删改,打字员打字。"]]},{"t":"Words in Circulation","s":[["A handout is given away, and a leaflet is left on a table.","宣传单是白送的,传单是留在桌上的。"],["Propaganda is not news, though it looks like it.","宣传不是新闻,尽管它长得像。"],["To publish is to make public; to disseminate is to spread wide.","出版是让它公开;传播是让它扩散。"],["We foresee what will happen and anticipate what may.","我们预见会发生的,预判可能发生的。"],["We expect the usual and await the late.","我们预期寻常的,等候迟到的。"]]},{"t":"Free Time","s":[["A pastime fills an empty hour.","消遣填满空闲的一小时。"],["To entertain and to amuse are not quite the same: one holds your attention, the other makes you smile.","娱乐和逗乐并不完全一样:一个抓住你的注意力,一个让你笑。"],["Recreation rests you, though it may tire you too.","休闲让你休息,尽管它也可能让你累。"],["Gossip is about people; a rumour is about facts nobody checked.","闲话说的是人;谣言说的是没人核实过的事。"],["A consensus is what everyone can live with.","共识是每个人都能接受的东西。"],["A festival and a feast both mark a day, but only one is about food.","节庆和盛宴都标记一天,但只有一个是关于吃的。"]]},{"t":"On Stage","s":[["A programme lists what will happen, and a rehearsal makes sure it does.","节目单列出会发生什么,排练确保它真的发生。"],["To perform is to do it in front of people.","演出就是在人前做这件事。"],["To imitate is to copy, to mimic is to copy for fun, and to simulate is to copy the conditions.","模仿是照抄,学样是抄着玩,而模拟是复制条件。"],["A circus, a magic show and a drama all ask you to believe.","马戏、魔术和戏剧都要你相信。"],["A concert, a symphony, an orchestra and a ballet fill a hall.","音乐会、交响曲、乐团和芭蕾填满一个大厅。"],["An opera and a comedy end well; a tragedy does not.","歌剧和喜剧结局是好的;悲剧不是。"],["Animation, a film and a movie are three names for a moving picture.","动画、影片和电影,是活动画面的三个名字。"]]},{"t":"The Gallery","s":[["An artist, a craftsman and a painter work in different ways.","艺术家、匠人和画家,做事的方式不同。"],["A role is played, a scene is set, and a stage is lit.","角色被扮演,场景被布置,舞台被打亮。"],["A gallery shows, and an exhibition explains.","画廊展示,展览解释。"],["Aesthetic judgement is about beauty, not price.","审美判断关乎美,不关乎价格。"],["To collect is to keep, to select is to choose, and to opt is to choose and stop.","收藏是留着,挑选是选出来,而选择某一个则意味着选定并放弃其他。"]]},{"t":"Picture and Shape","s":[["To photograph is to take the light, and a portrait is a photograph of a person.","摄影是取光,而肖像是人的照片。"],["A painting is made of paint, and a sculpture of material.","画由颜料做成,雕塑由材料做成。"],["To draw is to make a line, and to depict is to show it clearly.","画是画一条线,描绘是把它清楚呈现。"],["To describe is to say it in words.","描述是用文字说出来。"],["To carve is to take material away.","雕刻是把材料去掉。"],["To improvise is to make it up as you go.","即兴是边走边编。"]]},{"t":"Sound and Rhythm","s":[["Musical taste divides people: classical, jazz, rock, hip-hop and pop.","音乐品味把人分开:古典、爵士、摇滚、嘻哈和流行。"],["A lyric is the words, and a band is the people.","歌词是词,乐队是人。"],["A solo is one voice, and a melody is one line.","独奏是一个声音,而旋律是一条线。"],["Rhythm is when it happens, and tone is what colour it has.","节奏讲它什么时候发生,音色讲它是什么颜色。"],["A tune is easy to remember, and a disc is easy to keep.","曲调好记,唱片好存。"],["A piano, a violin, a cello, a guitar, a harmonica, a trumpet, a drum and a flute.","钢琴、小提琴、大提琴、吉他、口琴、小号、鼓和长笛。"]]},{"t":"The Games","s":[["A competition may be small; a tournament runs for weeks.","比赛可能很小;锦标赛要跑好几周。"],["The Olympic Games are the largest of all.","奥运会是最大的那个。"],["A sponsor pays, and a patron protects.","赞助商出钱,庇护人保护。"],["An athlete trains, and a champion wins.","运动员训练,冠军获胜。"],["A spectator only watches, and a volunteer only helps.","观众只是看,志愿者只是帮忙。"],["The famous and the well-known are nearly the same, but one is louder.","famous 和 well-known 差不多,但一个更响。"],["An energetic player looks lively; a vigorous one looks strong.","energetic 的球员看着有活力;vigorous 的球员看着有力。"]]},{"t":"Training Day","s":[["A stadium holds a crowd, and a gym holds a few.","体育场容纳一群人,健身房容纳几个人。"],["Training is the work; exercise is the habit.","训练是活儿;锻炼是习惯。"],["Indoor sport is warm, and outdoor sport is honest.","室内运动温暖,室外运动诚实。"],["A mobile body moves, and movement is the point.","能动的身体会动,而运动就是目的。"],["Yoga stretches you; a sprawl leaves you on the floor.","瑜伽把你伸展;而趴摊把你留在垫子上。"],["To stretch too far is to strain a muscle.","伸展过头就是拉伤肌肉。"],["Chess, badminton, golf, billiards, soccer, tennis, volleyball and hockey all need a different skill.","国际象棋、羽毛球、高尔夫、台球、足球、网球、排球和曲棍球,各需一种本事。"]]},{"t":"Hit, Throw, Run","s":[["A goal needs a ball, a bat or a racket.","进球需要球、球棒或球拍。"],["To kick, to knock, to flip and to pitch are four ways of sending it away.","踢、敲、弹和投,是把它送走的四种方式。"],["To throw and to toss are the same throw at two speeds.","抛和掷,是同一次投掷的两个速度。"],["To slide and to slip are both losing grip; to glide is keeping it.","滑动和打滑都是失去抓地;滑翔是保持着它。"],["To tumble is to fall badly.","翻滚是摔得很难看。"],["You ski on snow and skate on ice.","在雪上滑雪,在冰上滑冰。"]]},{"t":"Move and Stop","s":[["To dive is to go in head first; to plunge is to go in all at once.","dive 是头朝下入水;plunge 是一下子整个人进去。"],["To jump and to leap are the same jump with different nerve.","jump 和 leap 是同一次跳,胆量不同。"],["To hop is on one leg, and to bounce is off a surface.","单脚跳是一条腿,反弹是离开一个面。"],["Cycling, drift and slide are three ways of not quite stopping.","骑行、漂移和滑行,是三种没完全停下来的方式。"]]},{"t":"Out of Doors","s":[["A tent is home for a night, and a camp is home for a week.","帐篷是一夜的家,营地是一周的家。"],["A picnic is a meal you carry; a hunt is a walk with a purpose.","野餐是你带去的饭;打猎是有目的的走。"],["A race and a marathon are measured in time.","赛跑和马拉松用时间来量。"],["A pedestrian has no engine, and a pace is his speed.","行人没有发动机,而步速就是他的速度。"],["A step is one, and a stride is two.","一步是一下,而大步是两下。"],["An excursion, a cruise, a trip and a vacation differ in length.","远足、游轮、旅行和假期,长度不同。"],["To hike is to walk far, to jog is to run slowly, and to wander is to have no plan.","徒步是走远路,慢跑是慢慢跑,而漫游是没有计划。"],["To linger is to stay, and to lag is to fall behind.","逗留是留下,落后是掉队。"],["To climb is to go up; to pull and to drag are how you get someone else up.","攀爬是往上;拉和拖是你把别人弄上去的方式。"],["To bend and to bow are the same movement with different meaning.","弯和鞠躬是同一个动作,意思不同。"]]},{"t":"For Adults Only","s":[["An X-rated film is one a child may not buy a ticket for.","X 级影片是孩子买不到票的那种。"]]}],"10":[{"t":"Stuff and Things","s":[["Stuff is the word we use when we cannot name the thing.","说不出名字的时候,我们就用 stuff 这个词。"],["An item is one of them, and merchandise is a lot of them for sale.","item 是其中一件,而 merchandise 是拿来卖的一批。"],["A souvenir is a thing you bring home, and an artefact is a thing you dig up.","纪念品是你带回家的,人工制品是挖出来的。"],["A material may be raw or crude before it is worked.","材料在被加工前可能是原始的、未提炼的。"],["A necessity you cannot do without, an outfit you wear, and a kit you carry.","必需品少不了,一套衣服穿在身上,一个工具包带在身上。"],["A utensil is a tool for the kitchen.","器皿是厨房里的工具。"]]},{"t":"Throw It Away","s":[["Garbage, rubbish, trash and junk are four words for what nobody wants.","垃圾、废物、破烂和废旧品,是没人要的东西的四种说法。"],["Litter is the small kind, dropped in the street.","乱丢的垃圾是小的那种,扔在街上。"],["Waste is what is left over, and a landfill is where it goes.","废料是剩下的东西,而垃圾填埋场是它去的地方。"],["Sewerage carries the rest.","下水系统带走其余的。"],["To recycle is to use it again; to reuse is to use it again as it is.","回收是再加工利用;重复使用是照原样再用一遍。"]]},{"t":"Wash and Wipe","s":[["Detergent, lotion, shampoo and soap all clean something.","洗涤剂、乳液、洗发水和肥皂,都是用来清洁的。"],["You fill the tub, pull the plug, and the water leaves through the pipe or the tube.","你把浴缸放满,拔掉塞子,水从管子或管道流走。"],["A mop takes the water, a broom takes the dust, and you sweep the floor.","拖把收水,扫帚收灰,你扫一遍地。"],["A tap is where the water comes from.","水龙头是水来的地方。"]]},{"t":"Bed and Floor","s":[["A mattress takes the weight, and a sheet goes over it.","床垫承重,床单盖在上面。"],["A blanket and a quilt keep you warm.","毯子和被子让你暖和。"],["A pillow is under your head, and a cushion is behind your back.","枕头在头下,靠垫在背后。"],["A carpet covers a room, a rug covers a corner, and a mat covers a step.","地毯盖住一间房,小地毯盖住一个角,而门垫盖住一级台阶。"],["A pad is small, a sponge holds water, and a towel dries you.","垫片很小,海绵装水,毛巾擦干你。"]]},{"t":"Small Parts","s":[["A staple holds paper, and a nail holds wood.","订书钉固定纸,钉子固定木头。"],["A razor is for a shave, and a fuse protects a circuit.","剃刀用来刮脸,保险丝保护电路。"],["A cable is thick, a cord is thin, and a strand is thinner still.","电缆粗,软线细,而股线更细。"],["A match lights, and a candle burns with wax.","火柴点火,蜡烛用蜡燃烧。"]]},{"t":"Paper and Office","s":[["A portfolio holds your work, and a paperback fits a pocket.","作品集装着你的作品,平装本能塞进口袋。"],["A pamphlet is thin, and a memorandum is short for a reason.","小册子薄,备忘录短是有原因的。"],["A cover protects, and tissue protects lightly.","封面起保护作用,薄纸轻轻保护。"],["To Xerox is to copy, and to duplicate is to make one more.","复印是照原样复制,复制是多做一份。"],["Stationery, glue, ink, rubber, scissors and a shear all sit in the same drawer.","文具、胶水、墨水、橡皮、剪刀和一把大剪,都放在同一个抽屉里。"]]},{"t":"Edge and Opening","s":[["An edge is a line, and a rim is a circle of it.","边缘是一条线,而沿口是一圈边缘。"],["An element is inside; a factor is outside and pushes.","元素在里面;因素在外面推。"],["A section is a part of the whole.","部分是整个中的一块。"],["A tag, a label and a badge all say what something is.","吊牌、标签和徽章都在说这是什么东西。"],["A bolt, a knob and a handle are what you hold or turn.","螺栓、旋钮和把手,是你抓或转的东西。"],["A shutter closes, a curtain covers, a pane lets light through, and opacity stops it.","百叶窗关上,窗帘遮上,窗格透光,而不透明度挡住它。"]]},{"t":"Hold It","s":[["A jar is glass, a barrel is wood, and a bucket or a pail carries water.","罐子是玻璃的,桶是木头的,而水桶提水。"],["A phone rings, and a bell rings louder.","电话响,铃响得更响。"],["A camera keeps a moment.","相机留住一个瞬间。"],["A portable radio goes with you.","便携收音机跟着你走。"]]},{"t":"Light and Power","s":[["A spotlight points, and a lantern carries.","聚光灯指向一处,提灯随身带。"],["A bulb lights a room, and a flashlight lights a path.","灯泡照亮房间,手电照亮一条路。"],["A refrigerator, or a fridge, keeps food cold.","冰箱让食物保持低温。"],["A vacuum takes the dust, a fan moves the air, and a switch turns both on.","吸尘器收灰尘,风扇推动空气,而开关把两者打开。"]]},{"t":"Around the House","s":[["A hurdle is for jumping, and a fence is for stopping.","栏架用来跳,篱笆用来拦。"],["A pedal is pushed with a foot; a shelf holds what you cannot put down.","踏板用脚踩;架子放你放不下的东西。"],["A ladder goes up, a lift goes up faster, and a stool is a chair with no back.","梯子往上,电梯上得更快,而凳子是没有靠背的椅子。"],["A drawer slides, an umbrella opens, and a raincoat keeps you dry.","抽屉滑出来,雨伞撑开,雨衣让你不湿。"]]},{"t":"Metal and Stone","s":[["To dredge is to take things up from the bottom.","疏浚是把东西从水底取上来。"],["A mill grinds, and a forge heats.","磨坊研磨,锻炉加热。"],["An alloy is a metal mixed with another metal.","合金是一种金属与另一种金属混合。"],["Iron, lead, brass and bronze are four of them.","铁、铅、黄铜和青铜是其中的四种。"],["Cement, lime and plaster all set hard.","水泥、石灰和灰泥都会硬结。"],["A can is thin metal with nothing inside.","罐头是空着的薄金属。"]]},{"t":"Cloth and Plastic","s":[["Leather is skin, plastic is oil, and fibre is the thread itself.","皮是皮,塑料是石油,而纤维是线本身。"],["A fabric is woven or knitted; to knit is to loop, and to weave is to cross.","布料是织出来或编出来的;织是套圈,编是交叉。"],["Canvas is rough, linen is cool, cotton is soft, and nylon is strong.","帆布粗糙,亚麻凉爽,棉柔软,尼龙结实。"],["Lumber is cut wood, and a wooden floor is quieter than stone.","lumber 是锯好的木材,木地板比石头安静。"]]},{"t":"Worth Having","s":[["A mine and a pit are holes we dig for something.","矿和坑是我们为了某样东西挖的洞。"],["Fuel burns, and grease lubricates.","燃料燃烧,油脂润滑。"],["A diamond is hard, and a crystal is clear.","钻石硬,晶体清。"],["An inferior copy is cheaper; a counterfeit one pretends to be real.","劣质仿品便宜;伪造的那个假装是真的。"],["A fake is a lie you can hold.","假货是一个你能拿在手里的谎。"],["Something fragile breaks, something miniature is small, and something durable lasts.","易碎的一碰就坏,微型的很小,而耐用的能撑很久。"],["Good tools are available to anyone who looks.","好工具对着所有肯找的人开放。"]]}],"11":[{"t":"What Is in Fashion","s":[["Fashion changes, but style does not.","时尚会变,风格不会。"],["A trend is what people are doing; a tendency is what they are drifting towards.","趋势是人们在做什么;倾向是他们在往哪儿漂。"],["Popularity is a number, and vogue is a mood.","流行度是一个数字,而时髦是一种气氛。"],["When one look prevails, everyone wears it.","当一种样子占了上风,人人都穿它。"],["A model wears it first, and an icon makes it famous.","模特先穿上它,偶像让它出名。"],["An idol is worshipped; an icon is only copied.","偶像被崇拜;而图标只被模仿。"]]},{"t":"Too Much of a Good Thing","s":[["Luxury is what you do not need and still want.","奢侈品是你不需要却仍想要的东西。"],["An extravagant purchase is one you will not mention at home.","奢侈的消费是你在家里不会提的那种。"],["Jewellery is worn, a jewel is set in it, and a gem is cut to shine.","珠宝戴在身上,宝石镶在里面,而宝石被切割出光。"],["Jade is green, and it is older than fashion.","玉是绿的,而且比时尚更古老。"],["To adorn and to ornament are to add; to embellish is to add too much.","装饰和点缀是加上去;修饰是加得太多。"],["To embroider is to sew a picture onto cloth.","刺绣是把一幅画缝到布上。"]]},{"t":"Face and Hair","s":[["Hairdressing is a craft, and pigment is a powder.","美发是一门手艺,而颜料是一种粉末。"],["To dye is to change the colour for good.","染色是把颜色改得回不来。"],["Cosmetics and make-up cover the face.","化妆品和妆容盖住脸。"],["A masquerade hides it, and a veil hides it more gently.","假面舞会把它藏起来,而面纱藏得更温柔。"],["A costume is a costume only on the right night.","戏服只有在合适的夜晚才叫戏服。"]]},{"t":"How One Looks","s":[["A decent appearance is enough for most occasions.","得体的外表对多数场合就够了。"],["An exquisite dress is finished in every detail.","一件精致的裙子,每个细节都做完了。"],["Grace is how you move; elegance is how you hold still.","优雅是你怎么动;高雅是你怎么静着。"],["Nothing is perfect, but some things come close.","没有什么是完美的,但有些很接近。"],["A handsome face, a charming manner and a pretty smile are three different compliments.","好看的脸、迷人的举止和漂亮的微笑,是三种不同的称赞。"],["A beautiful thing is beautiful all through; an ugly one is only ugly to you.","美的东西整体都美;丑的东西只是对你来说丑。"],["Her figure is slender, and her build is slight.","她身形纤细,体格单薄。"]]},{"t":"What You Wear","s":[["To dress is to put clothes on; to clothe a family is to keep them warm.","穿衣是把衣服穿上;供一家人穿衣是让他们暖着。"],["A uniform says what you do, and a garment says what you chose.","制服说明你做什么,而衣服说明你选了什么。"],["Laundry is the pile you forgot, and a wardrobe is the space you filled.","待洗的衣物是你忘掉的那一堆,衣柜是你填满的那个空间。"],["An overall, an overcoat, a robe and a gown cover everything.","工装裤、大衣、长袍和礼袍,把整个人盖住。"],["A sweater, a jacket, a skirt, jeans and trousers are the everyday five.","毛衣、夹克、裙子、牛仔裤和长裤,是日常的五件。"]]},{"t":"Small Things That Hold It Together","s":[["A clasp and a button close; a glove covers a hand.","扣环和纽扣负责合上;手套盖住手。"],["A hat has a brim, a cap has a peak, and a scarf goes round the neck.","帽子有帽檐,便帽有帽舌,而围巾绕在脖子上。"],["A handkerchief is folded, and a purse or a wallet is carried.","手帕是折起来的,而钱包随身带着。"],["A vest, a wrap and a cloak are three ways of adding warmth.","背心、披肩和斗篷是加暖的三种方式。"],["A collar, a sleeve, a sock, a stocking, a slipper and a boot.","领子、袖子、短袜、长袜、拖鞋和靴子。"]]},{"t":"Needle and Thread","s":[["Lace is fine, and a tailor is patient.","蕾丝精细,而裁缝有耐心。"],["To sew is to join, to stitch is to join again and again, and to spin is to make the thread first.","缝是把两块连起来,缉是一针一针连,而纺是先把线做出来。"],["A needle, a pin, a string and a thread are all thin.","针、别针、细绳和线,都很细。"],["A strap holds, a stripe marks, and a ribbon decorates.","带子固定,条纹标记,丝带装饰。"],["A belt, a chain, a bracelet, a necklace and a bead.","腰带、链条、手镯、项链和珠子。"]]},{"t":"Cloth and Colour","s":[["A textile is any cloth made on a machine.","纺织品是机器织出来的任何布。"],["Velvet is soft, wool is warm, and a patch covers a hole.","天鹅绒柔软,羊毛暖和,补丁盖住破洞。"],["A rag is a cloth that has finished its work.","破布是一块干完了活的布。"],["Something shabby is worn out but still worn.","破旧的东西已经磨坏,却仍被穿着。"],["A tight fit looks good for an hour.","紧身的衣服好看一个小时。"],["Colour fades in the sun, and a stain stays.","颜色在太阳下会褪,而污渍会留下。"],["White, yellow, brown, grey, pink, purple and tan are all one word away from a shade.","白、黄、棕、灰、粉、紫和棕褐,离一个色调都只差一个词。"],["A blot is a stain that landed badly.","污斑是一处落得很糟的污渍。"],["A new look can fascinate a whole city for a season.","一种新样子能让整座城市着迷一季。"]]}],"12":[{"t":"Food and Appetite","s":[["Food is what you eat; a diet is what you eat every day.","food 是你吃的东西;diet 是你每天吃的东西。"],["Appetite is the wish to eat, and hunger is the need.","食欲是想吃,而饥饿是必须吃。"],["A treat is something you did not earn.","款待是你没挣来的那一点好东西。"],["To cater is to feed a lot of people at once.","承办饮食就是一次喂饱很多人。"],["A provision is food you keep for later, and anything edible can be eaten.","储备是留着以后吃的食物,而凡可食用的都能吃。"],["A recipe is a list with instructions.","食谱是一张带说明的清单。"]]},{"t":"Where You Eat","s":[["A restaurant sells food; a refectory and a cafeteria give it to people who queue.","餐馆卖饭;食堂和自助餐厅把饭给排队的人。"],["A buffet lets you choose, and a barbecue lets you wait.","自助餐让你挑,烧烤让你等。"],["Supper is late and light; a banquet is long and heavy.","晚饭晚而轻;宴会长而重。"],["A refreshment is a drink and a snack, and an appetiser is only the beginning.","茶点是饮料加零食,而开胃菜只是开头。"],["Cuisine is a country's way of cooking; a menu is one page of it.","菜系是一个国家的做法;菜单是它的一页。"],["You order, and a takeaway goes home with you.","你点单,而外卖跟你回家。"]]},{"t":"The Table","s":[["A chef cooks, and a gourmet judges.","厨师做饭,美食家评判。"],["A vegetarian eats no meat at all.","素食者一点肉都不吃。"],["Cutlery means a fork, a knife and a spoon.","餐具指的是叉、刀和勺。"],["A bowl holds soup, a dish holds a meal, and a saucer holds a cup.","碗盛汤,盘盛一餐,而茶碟托着杯子。"],["A tray carries them all.","托盘把它们全端走。"],["Silver, ceramic and porcelain are three ways of making a plate look expensive.","银、陶瓷和瓷器,是让盘子显得贵的三种方式。"]]},{"t":"In the Kitchen","s":[["A glass is clear, and a mug has a handle.","玻璃杯透明,马克杯有把手。"],["A kettle boils water, and a pan fries an egg.","水壶烧水,平底锅煎蛋。"],["A pot is deep, and a stove or a furnace is hot.","锅是深的,而炉子或高炉是热的。"],["An oven bakes, and a tin keeps it fresh.","烤箱烘焙,铁罐保鲜。"],["A lid keeps the heat in.","盖子把热气关住。"]]},{"t":"What You Drink","s":[["A drink is anything in a cup; a beverage is the same word in a hotel.","drink 是杯子里的任何东西;beverage 是酒店里的同一个词。"],["Juice and soda are soft; alcohol, liquor, whisky and brandy are not.","果汁和苏打是软饮;酒精、烈酒、威士忌和白兰地不是。"],["Coffee keeps you awake, and wine makes you drunk.","咖啡让你醒着,酒让你醉。"],["A cigarette and tobacco are the other habit.","香烟和烟草是另一种习惯。"],["A sober man remembers the evening.","清醒的人记得那个晚上。"]]},{"t":"From the Ground","s":[["A vegetable can be a tomato, a potato, a pea or a bean.","蔬菜可以是番茄、土豆、豌豆或豆子。"],["A cucumber is cool, and a cabbage is heavy.","黄瓜是凉的,卷心菜是沉的。"],["An onion makes you cry, and a mushroom grows in the dark.","洋葱让你流泪,蘑菇在暗处长。"],["An eggplant, a carrot, a turnip and a radish are all roots or fruit.","茄子、胡萝卜、芜菁和萝卜,都是根或果实。"],["To peel is to take the skin, to strip is to take the leaves, and to hull is to take the shell.","削皮是去皮,剥是去叶,而脱壳是去壳。"]]},{"t":"Sweet and Soft","s":[["A cherry is small, and a berry is smaller.","樱桃小,浆果更小。"],["A grape grows in a bunch, and a papaya grows alone.","葡萄成串长,木瓜单个长。"],["A peach is soft, a pear is firm, and a plum is both.","桃子软,梨硬,李子两样都占。"],["An orange is round, a melon is rounder, a lemon is sour and a kiwi is green inside.","橙子圆,瓜更圆,柠檬酸,猕猴桃里面是绿的。"]]},{"t":"Crop and Cattle","s":[["A crop is what a field gives; corn, grain and wheat are the big three.","庄稼是田里给出的东西;玉米、谷物和小麦是三大样。"],["To reap is to cut it, and flour is what you grind it into.","收割是把它割下来,而面粉是你把它磨成的。"],["Porridge and paste are the oldest way to eat it.","粥和面糊是吃它最古老的方式。"],["Livestock means animals kept for food: chicken, turkey, beef, pork and mutton.","牲畜指为食物而养的动物:鸡、火鸡、牛肉、猪肉和羊肉。"],["A sausage is the parts you did not want to name.","香肠是那些你不想点名的部分。"],["Fish come from a pond, and a rod is how you get them out.","鱼从池塘来,而钓竿是你把它们弄出来的办法。"]]},{"t":"Milk and Bread","s":[["Dairy means milk and everything made from it.","乳制品指牛奶及用它做的一切。"],["Yogurt is thick, cream is thicker, and cheese is solid.","酸奶稠,奶油更稠,而奶酪是固体的。"],["Butter is fat you can spread.","黄油是能抹开的脂肪。"],["A salad is raw, and a sandwich is a meal with a lid.","沙拉是生的,而三明治是带盖的一餐。"],["A hamburger, a pie and a pizza are three shapes of the same idea.","汉堡、馅饼和披萨,是同一个想法的三种形状。"],["Pasta and spaghetti need a sauce.","意面和意大利面条需要酱。"],["Soup is warm, and pudding is sweet.","汤是热的,布丁是甜的。"],["A biscuit is dry, and jam makes it less so.","饼干是干的,果酱让它没那么干。"]]},{"t":"Salt, Sugar, Spice","s":[["A nut is hard, and chocolate melts.","坚果硬,巧克力化。"],["Ice cream is cold, and vanilla is the plainest flavour.","冰淇淋是冷的,香草是最普通的味道。"],["Mustard is sharp, and wasabi is sharper.","芥末冲,山葵更冲。"],["Pepper, ginger, garlic and scallion are the four that go in first.","胡椒、姜、蒜和葱,是最先下锅的四样。"],["Vinegar is sour, salt is salty, and sugar and candy and honey are sweet.","醋是酸的,盐是咸的,而糖、糖果和蜂蜜是甜的。"],["Flavour is the whole taste, and a spice or a sauce adds to it.","风味是整个味道,而香料或酱汁往上加。"],["Ketchup is sweet and red, and perfume is not for eating.","番茄酱又甜又红,而香水不是用来吃的。"],["An ingredient goes in; a supplement is added because something is missing.","食材是放进去的;补充剂是因为缺了什么才加的。"]]},{"t":"Taste and Cook","s":[["Sour, sweet, bitter and spicy are the four you can name.","酸、甜、苦、辣,是你能叫出名字的四种。"],["Something delicious is worth the wait; something tasty is only good.","delicious 值得等;tasty 只是好吃。"],["Hunger is loud, and thirst is patient.","饿很吵,渴很耐心。"],["To digest is to take your time.","消化就是慢慢来。"],["To cook, to bake, to fry and to roast are four kinds of heat.","煮、烤、煎和烘,是四种热法。"],["To toast is to brown it, and to suck, to lick and to chew are three ways of meeting food.","烘烤是让它变褐,而吸、舔和嚼,是与食物相遇的三种方式。"],["Gum is chewed but never swallowed.","口香糖只嚼不咽。"],["To soak and to dip are both wet; to squeeze and to stir are both with the hands.","浸和蘸都是弄湿;挤和搅都是用手。"],["To grind is to break it down, and to slice is to make it thin.","磨是把它弄碎,切片是把它变薄。"]]},{"t":"A Quick Bite","s":[["A loaf lasts a family three days.","一条面包够一家人吃三天。"],["Something yummy is not the same as something good for you.","好吃的不等于对你有好处的。"],["When you are thirsty, nothing else matters.","你渴的时候,别的都不重要。"]]}],"13":[{"t":"Building Something","s":[["Architecture is the art of the whole; an erection is only the fact of
