<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;

 --chip:#242830;--acc-soft:#2a211f;--mark:#5a4718;--green:#6cc38b;--warn:#f0776a}

body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,

 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}

 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}

.sn.cur{background:var(--acc-soft);box-shadow:none;border-radius:3px}

mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 30%,transparent)}

mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}

body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.para.blind .ps .pen{filter:blur(4.5px);cursor:pointer;user-select:none}
body.para.blind .ps.rev .pen{filter:none}
body.sent.blind .sn .en{filter:blur(4.5px);cursor:pointer;user-select:none}
body.sent.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}

 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}

.qf button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.qf button:hover{filter:brightness(1.05)}

.qdone b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.qbad{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qbad span{font-size:11.5px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);
 border-radius:5px;padding:1px 7px;cursor:pointer}

 <h1>分章短文</h1>
 <p class="sub">每章十几篇小短文，把本章的词放进语境里背：每篇一段英文，连着读下来是一个完整的意思，下面配一整段中文。加粗带底色的是本章词，点一下看释义、收进生词本。每篇底下有「小测」：看句子填词、选中文释义、选英文单词，几个小题当堂检验。</p>

<script>
var TXT={"1":[{"t":"The Air We Share","s":[["On a clear morning the sky looks empty, but above us there is a thin shell of gas called the atmosphere, and it holds the oxygen we breathe and the carbon dioxide we breathe out.","晴朗的早晨天空看着空空的,可我们头顶有一层薄薄的气体叫大气层,里面装着我们吸的氧气和我们呼出的二氧化碳。"],["Hydrogen is the lightest gas of all, and when oxygen joins another element the result is an oxide, as it is in rust.","氢是最轻的气体;氧和别的元素结合就成了氧化物,铁锈就是。"],["Water in the air is vapour, and on a hot afternoon it evaporates from the road; when the vapour cools it precipitates as rain and comes back to us.","空气里的水是水蒸气,炎热的下午它从路面蒸发上去;等水汽一凉,又凝成雨落回我们身上。"],["Warm air rises and cool air moves in, so the air in a closed room keeps circulating all day.","暖空气上升,冷空气补进来,所以关着窗的屋子里空气也在流动。"],["The temperature stayed near fifteen degrees Celsius, just as the forecast said, and in a mild winter we leave the heating off, because a moderate coat is enough for the walk to school.","温度一直在十五摄氏度上下,跟预报说的一样;冬天不冷的时候我们不开暖气,一件薄厚适中的外套就够走去学校。"],["A thermal shirt holds the heat close to the skin, which is why the children wear one under everything in January.","保暖内衣把热气留在皮肤边上,所以一月里孩子们都在最里面穿一件。"]]},{"t":"The Water World","s":[["Most of the globe is covered by water, and all of that water together is the hydrosphere.","地球大部分表面都是水,这些水加起来就是水圈。"],["The ocean is one great body, but we give its corners their own names, so a gulf is a piece of sea almost closed by land.","海洋是一整片,可我们给它各个角落都起了名字,海湾就是几乎被陆地围起来的一片海。"],["The beach where children play is the edge of it, and the coast runs north for miles, so from the shore you can watch the tide come in.","孩子们玩的沙滩就是它的边;海岸向北延伸好几英里,站在岸上就能看见潮水涨上来。"],["A warm current runs north past the islands, and sailors have used it for navigation across the Atlantic for centuries, while the Mediterranean is warm and almost still.","一股暖流从岛边往北流,水手靠它导航几百年了;地中海则是温暖的,几乎不流动。"],["A brook is small enough to jump across and a stream is wider, but both begin at a cold spring in the rocks, and that spring is the source of the river that runs through our town.","小溪窄得一步能跨过去,小河宽一些,可两条都发源于岩缝里一眼冰凉的泉水,那眼泉就是流过我们镇子的河的源头。"],["The water is shallow here, so you can walk across, but further down it is deep enough to drown a cow.","这里水浅,人能走过去;再往下就深得能淹死一头牛。"],["A reservoir was built behind the dam, and in spring the water falls over the waterfall in a white line, while a fountain in the square throws water into the air.","坝后修了一座水库,春天水从瀑布上泻下来,拉成一道白线;广场上的喷泉把水抛到空中。"],["By morning there is dew on the grass, and a tap that keeps dripping will drain the tank before the sun is up.","到早上草上就结了露水;水龙头要是一直滴,太阳出来前就能把水箱放干。"],["She poured the last of the tea out and looked at the water, and marine animals far out at sea went on with their morning.","她把最后一点茶倒掉,看了看水面,远海里的海洋动物照旧过着它们的早晨。"]]},{"t":"What Lies Under Our Feet","s":[["The rocky shell of the earth is the lithosphere, and the thin skin we stand on is the crust.","地球外面那层石头壳叫岩石圈,我们脚踩的这层薄皮叫地壳。"],["Under the crust the mantle is hot enough to flow, and at the centre the core is hotter still, so rock melts down there and becomes magma.","地壳下面是热得能流动的地幔,最中间的地核还要更热,所以那里的岩石会熔成岩浆。"],["When the magma finds a way out we get a volcano, and this one last erupted in 1963, so the island has been quiet since.","岩浆一旦找到出口就成了火山;这一座上回喷发是 1963 年,之后岛上一直很安静。"],["An earthquake is harder to see coming, and the seismic stations along the coast record every shake, because two plates are always moving past each other.","地震就难预料得多,沿岸的地震台把每一次震动都记下来,因为两块板块一直在互相错动。"],["Where they pull apart the ground may crack open into a wide gap, and in the old mine you can still find a piece of ore.","它们分离的地方,地面可能裂开一道很宽的缝;老矿里还能捡到矿石。"],["The mineral in it shines like glass, so quartz is clear, granite is speckled, and the floor of the church is a single slab of marble.","里面的矿物亮得像玻璃;石英是透明的,花岗岩带斑点,教堂地面是一整块大理石。"],["A pebble from the river fits in your hand and a magnet will not lift it, but geology begins with a handful of sediment from the bank.","河里的鹅卵石刚好握在手心,磁铁吸不起来;可地质学就是从河岸上抓一把沉积物开始的。"]]},{"t":"Lines on a Map","s":[["A map is covered with thin lines, and the ones that run up and down give the longitude of a place, while the ones that run across give its latitude.","地图上画满细线,竖着走的那几条给出经度,横着走的给出纬度。"],["Latitude tells you how far you are from the equator, and the globe is round, so we cut it into two halves and call each half a hemisphere.","纬度告诉你离赤道有多远;地球是圆的,我们把它切成两半,每一半叫一个半球。"],["Stand on a hill and the horizon is a long way off, and the altitude of that hill is written on the map.","站在山上,地平线离得很远,那座山的高度也标在地图上。"],["Between the tropics the sun is overhead at least once a year, but the arctic stays cold all winter and even the Antarctic summer is cold.","热带地区一年里太阳至少直射一次;北极圈整个冬天都冷,南极的夏天也冷。"],["The polar ice is thick, and at the pole the axis of the earth comes out of the ground.","极地的冰很厚,地轴就从极点那里钻出地面。"],["Asia is the largest continent and the mainland of China takes up a good part of it, while Oceania is a name for the islands of the Pacific.","亚洲是最大的洲,中国大陆占了很大一块;大洋洲是太平洋那些岛的名字。"],["Italy is a peninsula and the delta of the river is a fan of mud and reeds, so a plateau is high and flat, a plain is low and flat, and in the desert an oasis is the only green thing for a hundred miles.","意大利是个半岛,那条河的三角洲是一把泥沙和芦苇摊开的扇子;高原又高又平,平原又低又平;沙漠里一百英里之内唯一的绿色就是那片绿洲。"],["Beyond the last field the land turns into wilderness, with a swamp on one side and a cave in the rock on the other.","过了最后一块田,地就荒了,一边是沼泽,另一边岩石里有个山洞。"],["The southern coast is wet and the eastern hills are dry, while the southeast gets the most sun and in the northwest it snows in April.","南边海岸多雨,东边山上干燥;东南日照最多,西北四月还下雪。"],["The cliff drops straight into the sea, and above it a glacier moves so slowly that you cannot see it move.","悬崖笔直落进海里,崖上一条冰川移得极慢,慢到你看不出来。"]]},{"t":"Wind and Rain","s":[["Weather changes every day, but the climate of a place stays much the same for a lifetime, and meteorology is the science of both.","天气天天变,一个地方的气候却几十年都差不多,气象学把两样一起研究。"],["In summer the monsoon comes in from the sea and brings weeks of rain, and by August the river is full.","夏天季风从海上过来,带来好几个星期的雨,到八月河就满了。"],["A breeze lifts the curtains, a gust slams the gate, and a gale takes the roof off the shed.","微风掀起窗帘,一阵狂风把院门拍上,大风把棚子的顶都掀了。"],["The wind came from the northeast in the morning, then swung round to the southwest, and by evening it was blowing from the sea.","早上风从东北来,后来转到西南,到傍晚又从海上吹过来。"],["A hurricane, a typhoon and a tornado are all spinning storms, and the name changes only with the sea they are born in.","飓风、台风、龙卷风都是打着转的风暴,名字不同只因为它们生成的海不一样。"],["On a stormy night the wind will puff and drop and then blow again, and water gushes out of the broken pipe and runs down the street.","暴风雨的夜里,风一阵一阵地吹,停一下又吹;水从破管子里涌出来,顺着街流。"],["The sky turned grey, there was a flash of lightning, and the thunder came a few seconds later.","天色转灰,闪电亮了一下,几秒钟后雷声才到。"],["A downpour like that brings more rainfall in an hour than the whole of last month, and then it began to sprinkle, just enough to spot the dust.","那样一场暴雨,一个小时的雨量比上个月一整月还多;之后就只剩零星小雨,刚够把尘土打湿。"],["A shower passed over in the afternoon and left a rainbow, and by six the clouds were gone.","下午一阵雨过去,留下一条彩虹,六点云就散了。"]]},{"t":"A Dry Year","s":[["The third summer without rain was the worst drought the village had known, and the river shrank to a line of stones.","连续第三个没雨的夏天,是村里人见过最厉害的干旱,河缩成了一条石头线。"],["It is an arid country at the best of times, so the flooding of last year was hard to believe.","这地方最好的年景也是干旱的,所以去年那场洪水简直难以相信。"],["A torrent came down the valley that night and took the bridge with it, and the tsunami that followed the earthquake reached the coast in twenty minutes.","那天夜里一股急流冲下山谷,把桥一起带走;地震之后的海啸二十分钟就到了岸边。"],["Higher up, an avalanche closed the road for three days, so nobody came down from the pass.","再往高处,一场雪崩把路封了三天,山口上没人下来。"],["A disaster of that size is not a mishap, and the damage it does is catastrophic.","那么大的一场灾难不算小意外,它造成的破坏是灾难性的。"],["The flood was a calamity for the farmers, and it was destructive far beyond the valley, because such storms endanger the villages on the coast and jeopardise the fishing that feeds them.","那场洪水对农民是场大祸,破坏远不止那个山谷,因为这样的风暴危及沿岸的村子,也危及养活他们的渔业。"],["El Niño is the name we give the warm water in the Pacific, and it changes the weather of half the world.","我们把太平洋上那片暖水叫作厄尔尼诺,它改变了半个世界的天气。"],["A rainbow is a phenomenon you can explain, but a run of dry years is harder.","彩虹这种自然现象你能解释,连着几年干旱就难说了。"]]},{"t":"The Shape of the Land","s":[["The terrain of the north is rough, but the landscape of the south is soft and green.","北方地形崎岖,南方的风景却柔和、到处是绿。"],["The road across the plain is flat and smooth, so you can drive for an hour without turning the wheel, and then the ground turns sandy and after that it is stony all the way to the pass.","穿过平原的路又平又顺,开一个小时都不用打方向;再往前地面变成沙土,之后一路到山口都是石头。"],["The slope is steep here, almost vertical in places, and the path is narrow enough for one person.","这里的坡很陡,有几处几乎是垂直的,小路窄得只容一个人。"],["Two ridges run parallel to the river, and between them the valley is deep and quiet.","两道山脊与河平行,中间的山谷又深又静。"],["On the hillside a few sheep work their way up, and the peak above them keeps its snow until May.","山坡上几只羊慢慢往上走,上面的山峰到五月还留着雪。"],["We began to mount the last stretch at four, and from the top we could overlook the whole range.","四点我们开始爬最后一段,到了顶上,整条山脉都在脚下。"],["It was a splendid view, grand in a way that photographs never catch, and quite magnificent in the evening light.","景色极好,那种壮阔照片拍不出来,傍晚的光里尤其辉煌。"],["My brother thought it was super, and I found the whole thing interesting in a way I did not expect.","我弟弟觉得棒极了,我则意外地觉得这一切很有意思。"],["The light changed fast, so the shadow of the mountain moved across the field in a dramatic way, and by dusk the whole valley was blue.","光线变得很快,山的影子戏剧性地扫过田野,到黄昏整个山谷都蓝了。"]]},{"t":"Cold and Damp","s":[["In the morning there was frost on the window and a thin sheet of ice on the bucket, and by noon it began to hail.","早上窗上有霜,桶里结了一层薄冰,到中午又下起冰雹,小硬球在屋顶上弹。"],["Then the wind turned warm, the ice began to thaw, and the lane turned to mud.","后来风变暖了,冰开始化,小路成了泥。"],["There was a chill in the air all day, and I could not stop shivering by the gate, so I went back inside.","一整天空气里都有寒意,我在门口忍不住发抖,只好回屋。"],["My hands began to tremble with the cold, and a snowy January like that keeps everyone indoors.","我冻得手直抖,这样下雪的一月,谁都愿意待在家里。"],["It is a frigid place in winter, and the pond will freeze over before January, so the snow lies on the fields until March.","这里冬天冷得刺骨,还不到一月池塘就冻上了,雪在田里躺到三月。"],["In summer the air is humid and the walls feel damp, so everything left out gets moist by morning.","夏天空气潮湿,墙摸上去是湿的,放在外面的东西到早上都潮了。"],["A mist came off the river at dusk and hung in the streets until the sun was up.","黄昏时河面起了雾,在街上挂到太阳出来。"],["The smog over the city is worse in winter, when the fume from a thousand chimneys has nowhere to go, so it is dense enough to hide the houses across the road.","城里的烟雾冬天更重,上千个烟囱冒的烟没处去,浓得对面人家的房子都看不见。"]]},{"t":"A Slow Change","s":[["Two wet winters washed the old road away, so the surface began to erode and now there is a gully along the edge.","两个多雨的冬天把老路冲坏了,路面开始被侵蚀,如今边上多了一道沟。"],["Left alone the damage will aggravate, and the slope above it will deteriorate year by year.","放着不管,损坏会加剧,上面的坡会一年年坏下去。"],["Some of the change is irreversible, and that is the part that worries the council, although for now the harm is superficial.","有些变化是不可逆的,正是这部分让镇议会担心,不过眼下损坏还只在表面。"],["It was inevitable that the field would degrade once the hedges were cut and the wood was left to deforest itself.","树篱一砍、林子没人管,那块地退化就是必然的。"],["The plan is to upgrade the drainage and put the hedges back, but rain has come irregularly for years, so the work is hard to plan.","计划是把排水修好、把树篱种回去,可这些年降雨很不规律,活儿难安排。"],["Cutting the trees on that soil was an inappropriate thing to do, and the result is plainly abnormal.","在那样的土上砍树是不合适的做法,如今的结果明显不正常。"],["The hills behind the village are barren now, and the fields below are no longer fertile, because nobody is left to fertilise them.","村后的山坡如今光秃秃的,下面的田也不肥了,因为没人再给它们施肥。"],["Nature does not hurry, and what looks natural to us is often the work of a hundred years, while the new grass by the gate is artificial and the flowers are synthetic.","大自然不着急,我们看着天然的样子往往是上百年的工夫;而门口新铺的草是人造的,花也是假的。"]]},{"t":"Near and Far","s":[["They moved out of the city to a rural district, and now they live in a suburb with a garden.","他们从城里搬到了乡下,如今住在一个带花园的郊区。"],["On the outskirts the houses thin out, and after that there are only fields, so the place is remote and in winter the nearest shop is a distant light across the valley.","到了市郊边上,房子就稀了,再过去只剩田地,所以那地方很偏,冬天最近的商店是山谷对面远远的一点灯光。"],["The land around it is desolate, empty of everything but stone.","四周的地一片荒凉,除了石头什么都没有。"],["Our field is adjacent to the wood, and the border between them is a low wall.","我家那块地紧挨着树林,两边的界是一道矮墙。"],["There is a margin of grass along the wall and a fringe of reeds at the water, and after the storm there was debris in every ditch.","墙边留着一条草,水边长着一排芦苇;暴风雨过后,每条沟里都是碎枝烂叶。"],["The stream ran muddy for a week while the silt settled on the beds of clay and the yard was covered in dirt.","溪水浑了一个星期,淤泥沉在黏土上,院子里全是泥。"],["The waste from the factory was toxic, and it began to contaminate the brook within a month, so now the pollution can be measured and every pollutant in the water is written down.","工厂排的废物有毒,一个月就把小溪污染了,现在污染能测出来,水里每一种污染物都记在本上。"],["The environment here is tested twice a year, and the surrounding villages share the same condition, so the situation is better than it was, though nobody calls it good.","这里的环境一年测两次,周围的村子处境相同;情况比从前好些,可没人说它好。"]]},{"t":"Light Through the Day","s":[["The solar panels on the roof give us hot water from April to October, and the lunar calendar is still used for the festivals.","屋顶的太阳能板从四月到十月给我们热水,农历到今天还用来过节。"],["The old people keep the calendar in their heads, and they know that sunrise is at half past five in June.","老人们把历法记在脑子里,他们知道六月五点半日出。"],["By six the whole street is in sunshine, and at dusk the light goes soft and the shadow of the church reaches the bridge.","六点整条街都是阳光;黄昏光线变柔,教堂的影子伸到桥上。"],["We sat in the shade of the tree until sunset, and then it was too cold to stay.","我们坐在树荫里到日落,之后就冷得坐不住了。"],["There was an eclipse of the sun that spring, and for two minutes the birds went quiet.","那年春天有一次日食,有整整两分钟鸟都不叫了。"],["The sky above the desert at night is a heaven of stars, and the people there call it a paradise, while the oriental garden by the lake is small and quiet.","沙漠的夜空满天星斗,那里的人管它叫天堂;湖边那座东方园林则小而安静。"],["I lay on my back and looked up, and the whole thing was dramatic in a way I had never seen.","我躺下往上看,那种壮阔是我从没见过的。"]]},{"t":"Fuel for the Road","s":[["My uncle runs a small garage, and he sells petrol, gas and gasoline, which are the same thing under three names.","我叔叔开了个小修车铺,卖汽油;三个叫法说的都是同一样东西。"],["Petroleum is what comes out of the ground before it is refined, so it is the source of all three.","石油是从地里出来、还没炼过的那个东西,所以这三种都来自它。"],["A greenhouse stays warm because the glass holds the heat in, and the gases from a car do much the same to the earth.","温室暖是因为玻璃把热留住,汽车排的气对地球做的差不多是同一件事。"],["A thermodynamic engine turns heat into work, and that is all a car engine really does.","热力学发动机把热变成功,汽车发动机做的其实就是这件事。"],["The intensity of the smell told him the pipe was leaking, and by evening the garage needed an intensive clean.","气味那么冲,他知道管子漏了,到晚上铺子得彻底擦一遍。"],["Smoke began to emerge from under the bonnet, and a thin line of it floated up past the window.","烟从引擎盖下面冒出来,细细一缕飘过窗边。"]]}],"2":[{"t":"How a Leaf Works","s":[["A leaf does two things at once, and we give them two long names: it makes food by photosynthesis and it burns that food by respiring.","一片叶子同时做两件事,我们给它们起了两个长名字:靠光合作用造食物,靠呼吸消耗食物。"],["Sunlight falls on the leaf, and the green parts absorb the energy and release oxygen into the air.","阳光落在叶子上,绿色的部分吸收能量,把氧气释放到空气里。"],["The tree takes carbon dioxide in through tiny holes and gives back the oxygen we need, so a wood is a kind of counterbalance to a city.","树从细孔里吸进二氧化碳,把我们要的氧气还回来,所以一片林子对一座城像是一种平衡。"],["Water and nutrient salts go up from the root, and the circulation of sap carries them to the highest branch.","水和营养盐从根往上走,树液的循环把它们送到最高的枝头。"],["The uptake is slow in winter, when the leaves are gone and the tree is only waiting.","冬天叶子落光,树只是在等,吸收也慢下来。"],["An enzyme in the leaf acts as a catalyst, so a reaction that would take years happens in a second.","叶子里的酶起催化剂的作用,本来要几年才完成的反应,一秒钟就成了。"],["Nobody designed this mechanism; it was found by experiment, and it is still the most efficient way we know to turn light into food.","这个机制不是谁设计的,是实验找出来的,至今仍是我们所知把光变成食物最省力的办法。"],["The energy a single tree stores in a summer is considerable, and the emission of oxygen from one wood can be measured.","一棵树一夏天存下的能量相当可观,一片林子放出多少氧气是能测出来的。"]]},{"t":"Naming the Green World","s":[["Botany is the study of plants, and ecology is the study of how they live with everything else.","植物学研究植物,生态学研究它们怎么和别的东西一起活。"],["A wood, a pond and the animals in them form one ecosystem, and every organism in it has a place.","一片林子、一个池塘和里面的动物构成一个生态系统,里面每个生物都有自己的位置。"],["Genetics explains why an oak comes from an acorn and not from a pine cone, and why no two leaves are quite the same.","遗传学解释了为什么橡树从橡子长出来,不长在松果上,也解释了为什么没有两片叶子完全一样。"],["Most of that difference is variation, and a little of it is mutation, which is a change in the message itself.","这些差别大多是变异,一小部分是突变,突变是信息本身变了。"],["Diversity is the point, because a field with one crop dies of one disease.","多样性恰恰是关键,因为只种一样庄稼的地,一场病就能全毁。"],["Gardeners use hybridisation to join two good plants into one, and botanists classify the result by its flowers, its leaves and its genes.","园艺的人用杂交把两种好植物并成一种,植物学家按花、按叶、按基因把它分类。"],["Plants reproduce in their own time and evolve over thousands of years, so the numbers on any one year fluctuate and mean little.","植物按自己的节奏繁殖,进化要几千年,所以单独一年的数字上下波动,说明不了什么。"],["A perennial comes back every spring, which is why it is worth the wait.","多年生植物每年春天都回来,所以值得等。"]]},{"t":"The Vegetable Patch","s":[["My grandmother calls her work horticulture, but to us it is just the garden behind the house.","我奶奶管她的活儿叫园艺,对我们来说那就是屋后的菜园。"],["She cultivates the same strip every year, and she sows the seed in April when the ground is warm.","她年年种同一条地,四月地暖了就撒种。"],["The soil there is arable, deep and dark, and in March she turns it over with a plough, or with a spade when the tractor will not fit; in the hills behind the village the fields are cut into a terrace, one above another.","那块地能耕,又深又黑;三月她用犁翻,拖拉机进不去的地方就用铁锹;村后的山地上,田被切成一层层梯田。"],["Then she rakes it flat and stacks the dry grass in a heap by the wall.","然后她把地耙平,把干草堆在墙边。"],["She plucks the herbs for soup and picks the beans when they are small, and the yield is more than the two of us can eat.","做汤时她掐香草,豆子还小就摘,收成够我们俩吃不完。"],["She ties the onions into a bundle and the flowers into a bunch, and puts the best ones in a vase on the table, because salt will preserve the rest through the winter.","她把洋葱捆成一捆,把花扎成一束,最好的几枝插在桌上的花瓶里,剩下的用盐腌着过冬。"],["They rear chickens in the yard, and every year one of them is kept for the winter.","他们在院子里养鸡,每年留一只过冬。"],["The harvest is a week of work and the whole family comes for it, and in a good year the beans alone can exceed a hundred kilos.","收成要忙一个星期,全家都回来帮忙;年景好的时候光豆子就能超过一百公斤。"]]},{"t":"From Bud to Rot","s":[["In March the buds on the apple tree begin to burgeon, and by April the whole tree is in blossom.","三月苹果树的芽开始鼓起来,到四月满树都是花。"],["The blossom smells sweet, and the scent carries far enough for the bees to find it.","花开得香,香味飘得很远,蜜蜂循着味儿就来了。"],["Some herbs are aromatic and some flowers only bloom for a week, so the garden changes every seven days.","有些香草气味很浓,有些花只开一个星期,所以园子每七天变一个样。"],["Pollen from one flower has to reach another, and only then does the seed germinate.","一朵花的花粉得到另一朵花上去,种子才会发芽。"],["The fruit ripens slowly through August, and the wasps know before we do.","果子在八月慢慢熟,黄蜂比我们更早发现。"],["By October the leaves wither and the last of the fruit falls, and the whole thing begins to decompose.","到十月叶子枯了,最后几个果子掉下来,一切开始分解。"],["What is left rots into the soil, and a mould or a fungus does the work, so nothing is wasted.","剩下的烂进土里,霉菌和真菌干这个活儿,一点都不浪费。"],["A tomato left on the windowsill goes stale in three days, and that is the same decay, only faster.","窗台上放着的番茄三天就不新鲜了,那是同一个腐烂过程,只是快些。"]]},{"t":"Wood and Grass","s":[["In the rainforest the trees are so tall that the ground stays in shade all day, and only a shade-tolerant plant can live down there.","雨林里的树高得地面整天在阴影里,只有耐阴的植物能活在那底下。"],["A short-day plant waits for the nights to get long before it flowers, and sunlight is the only clock it has.","短日照植物要等夜变长才开花,阳光是它唯一的钟。"],["Further out, the jungle gives way to a plantation, where one kind of tree is grown in straight lines for timber.","再往外,丛林让位给种植园,那里只种一种树,排成直行,为的是木材。"],["The logs are cut into charcoal, and the forestry office marks every trunk that falls and puts its logo on the stack.","原木烧成木炭,林务局把每一棵倒下的树都记上账,在木堆上盖自己的标志。"],["A branch breaks off in the wind, and the bough above it holds the nest.","风刮断一根树枝,上面那根粗枝上还架着鸟窝。"],["Below, the grass in the meadow is cut for hay, and the dry straw is kept for the animals.","下面草甸的草割下来晒成干草,干草留着喂牲口。"],["Reeds stand at the water, and a thorn hedge keeps the goats out of the vegetable field.","水边长着芦苇,一道荆棘篱笆把羊挡在菜地外面。"],["The lawn needs cutting twice a month, and the weeds need pulling all summer.","草坪一个月要剪两次,杂草整个夏天都得拔。"],["Every tree has a root, and every root is looking for water.","每棵树都有根,每条根都在找水。"]]},{"t":"Six Plants and a Reef","s":[["The olive tree by the gate is older than the house, and nobody remembers who planted it.","门口的橄榄树比房子还老,没人记得是谁种的。"],["On the hill the pines hold the soil, and the wind through them sounds like the sea.","山坡上松树抓着土,风穿过松林听着像海。"],["A vine climbs the wall, and by September it is heavy with grapes.","一株藤爬满墙,到九月挂满了葡萄。"],["In the corner there is a violet and a row of tulips that come up every April.","角落里有一丛紫罗兰,还有一排每年四月都冒出来的郁金香。"],["Mint grows where nothing else will, and it grows there fast.","薄荷长在别的植物都长不了的地方,而且长得快。"],["Out past the reef the water turns dark, and the alga on the rocks is the beginning of the whole food chain.","礁石外面水色变深,岩上的藻类正是整条食物链的开头。"],["A fungus is neither plant nor animal, and it lives by breaking things down.","真菌既不是植物也不是动物,它靠分解东西过日子。"]]},{"t":"Fire, Axe and After","s":[["A bush fire started on the ridge in February and burned for four days before anyone could extinguish it.","二月山脊上起了林火,烧了四天才被扑灭。"],["Fire can ruin a hundred years of growth in an afternoon, and a fire that hot can destruct a wood in an hour; the animals that cannot run perish where they stand.","一场火一个下午就能毁掉一百年的生长,这么热的火一个小时就能把一片林子烧毁;跑不掉的动物就地死掉。"],["Afterwards the forestry team came to demolish what was left and to clear the burnt logs.","之后林务队来拆掉剩下的东西,清走烧焦的木头。"],["Cutting the trees there would infringe the protection order, and it would undermine the work of twenty years.","在那儿砍树违反保护令,也会把二十年的活儿一点点毁掉。"],["The pattern of the seasons has changed, and nobody can say what the outcome will be, though hunting once drove the wolf here close to extinction.","季节的规律变了,没人说得准结果会怎样;不过从前打猎曾把这里的狼逼到灭绝边缘。"],["The impact of one dry summer is small; the impact of five is not.","一个干旱的夏天影响不大,连着五个就不一样了。"],["Conservation is cheap when it works, and it is far more efficient than repairing the damage afterwards.","保护做对了很便宜,比起事后修补要省力得多。"],["An experimental plot was fenced off, and the result was effective within two years, so they went on to reclaim the old quarry and plant it with pines.","一块试验地被围了起来,两年之内就看出了效果,于是他们接着把废石场复垦、种上松树。"],["The change was considerable, in places massive, and the effect on the soil was immense.","变化相当大,有些地方是巨大的,对土的影响也很深远。"],["With maximal care and minimal cost, this is the optimal way to keep a wood alive.","用最大的心思、最小的花费,这是让一片林子活下去最妥当的办法。"],["A seasonal worker knows the difference, and a productive field pays for itself.","季节工懂这个差别,一块多产的田自己养得起自己。"],["Conditions here are favourable, the soil is protected, and the surroundings are as they were before we came.","这里条件好,土被保住了,周围也还是我们来之前的样子。"],["It is an eco-friendly way to farm, and after ten years the vegetation has come back on its own.","这是对环境友好的种法,十年之后草木自己长回来了。"]]}],"3":[{"t":"Who Studies Animals","s":[["A biologist studies life itself, and a zoologist studies animals, while an ecologist asks how they live together.","生物学家研究生命本身,动物学家研究动物,生态学家问的是它们怎么一起活。"],["A botanist stays with the plants, and the plants of a place are its flora, just as its animals are its fauna.","植物学家守着植物;一个地方的植物叫植物区系,动物叫动物区系。"],["Wildlife is the word we use for all of them together, and every one of them belongs to a species.","这些合起来我们叫野生生物,其中每一个都属于某个物种。"],["A creature with a backbone is a vertebrate, and among those a mammal feeds its young on milk.","有脊椎的动物是脊椎动物,其中哺乳动物用奶喂幼崽。"],["A primate has hands that can hold things, a reptile has scales, and an amphibian spends half its life in water.","灵长类有能抓东西的手,爬行动物有鳞,两栖动物一半日子在水里。"],["A carnivore eats meat and a herbivore eats plants, and the teeth of each tell you which it is.","食肉动物吃肉,食草动物吃草,看牙就知道是哪一种。"]]},{"t":"A Herd, a Flock, a Swarm","s":[["Sheep move in a flock and cattle in a herd, and in summer a swarm of bees leaves the hive for a new tree.","羊成群走,牛成群走,夏天一群蜜蜂离开蜂箱去找新树。"],["At the market there is a throng of people by the gate and a crowd around the fruit, and nobody can move.","集市上门边挤着一大群人,水果摊前也围了一圈,谁都动不了。"],["A beast is simply a big animal, but a brute is one that will hurt you, and the man who beat the donkey was cruel.","野兽就是大动物,而畜生是会伤人的那种;打驴的那个人很残忍。"]]},{"t":"Family Lines","s":[["Every breed of dog is said to originate in the wolf, and they all derive from one ancestor that lived long ago.","据说每一种狗都源自狼,它们都来自很久以前同一个祖先。"],["The word dog itself stems from an old English name, and the line runs down to the descendants we keep today.","这个词本身出自一个古英语名字,这条线一直传到今天我们养的这些后代。"],["The offspring of two kinds may be a subgroup of their own, and farmers will breed them for a better coat.","两种动物的后代可能自成一个亚群,农人为了皮毛会特意培育。"],["Two close species may interbreed where their ranges meet, and in a garden two plants may hybridise in the same way.","两个近缘物种在分布重叠的地方会杂交,园子里的两种植物也一样。"],["Left alone, a small group will proliferate until the food runs out, and then sterility and disease do the rest.","不去管它,一小群会迅速繁殖,直到食物耗尽,接着不育和疾病来完成剩下的事。"],["A male finds a mate by display, and the courtship can last a week before she will let him near.","雄性靠展示找伴侣,求偶能持续一个星期,她才让他靠近。"],["A hen will lay an egg a day in spring, and the eggs hatch after three weeks, while a fish will spawn in thousands and leave them.","母鸡春天一天下一个蛋,三个星期后孵出来;鱼一次产几千个卵,然后就不管了。"],["The young are not mature for a year, and until then the brood stays close.","幼崽要一年才成年,在那之前一窝都待得很近。"]]},{"t":"Skin, Claw and Wing","s":[["A mammal is covered in fur, a bird in feather, and a fish in scales that shine like a coin.","哺乳动物长毛,鸟长羽毛,鱼长鳞,亮得像硬币。"],["Under the fur the skin is thin, and a cat will use a claw to hold what it has caught.","毛下面的皮很薄,猫用爪子抓住它逮到的东西。"],["A dog gives you its paw, and a bird takes food with its beak.","狗把爪子递给你,鸟用喙把食物叼走。"],["A fish steers with a fin and a bird with a wing, and the plume on the heron is longer than the rest.","鱼靠鳍转向,鸟靠翅膀,苍鹭头上那根羽毛比别处长。"],["The bristle on a pig is stiff enough to make a brush, and the hair on a lamb will curl by itself.","猪鬃硬得能做刷子,羊羔的毛自己就打卷。"]]},{"t":"Small Things","s":[["An insect has six legs, and in summer the air is full of them.","昆虫有六条腿,夏天空气里全是它们。"],["A worm comes up when it rains, and a spider builds in the corner of the shed.","下雨时蚯蚓会爬上来,蜘蛛在棚子角落结网。"],["A butterfly crosses the garden and a mosquito finds you at dusk, and a cricket sings until midnight.","蝴蝶穿过园子,蚊子黄昏时找到你,蟋蟀叫到半夜。"],["Some of them are a pest on the crops, and a parasite lives on another animal and gives nothing back.","其中一些是庄稼上的害虫;寄生虫住在别的动物身上,什么也不给。"],["A mouse lives in the wall and a rat in the drain, a squirrel takes the nuts we put out, and a hare sits still in the field until you are close.","老鼠住在墙里,大老鼠在下水道;松鼠拿走我们放的坚果;野兔在田里一动不动,直到你走近。"],["Only a frog is at home in both the pond and the grass.","只有青蛙在水里和草里都待得自在。"]]},{"t":"In the Aviary","s":[["A falcon is faster than a hawk in a dive, and an eagle is bigger than both.","俯冲时猎隼比鹰快,而雕比它们都大。"],["An owl hunts at night and a swallow catches flies all day, and a sparrow takes the crumbs from the table.","猫头鹰夜里捕食,燕子白天抓飞虫,麻雀捡桌上的面包屑。"],["Pigeons live under the bridge and crows on the roof, and both are always there.","鸽子住在桥下,乌鸦在屋顶上,两边都一直在。"],["A swan on the river is whiter than a goose, and the cock in the yard calls at four.","河上的天鹅比鹅还白,院里的公鸡四点就打鸣。"],["The penguin cannot fly at all, and it swims instead.","企鹅根本不会飞,它改游泳。"]]},{"t":"At the Zoo","s":[["At the zoo a seal swims in a circle and a tortoise does not move for an hour.","动物园里海豹一圈一圈地游,乌龟一个小时不动。"],["The turtle in the big tank is older than the keeper, and the whale on the wall is only a model.","大缸里的海龟比饲养员还老,墙上的鲸只是个模型。"],["A kangaroo carries its young in a pocket, and a camel can go a week without water.","袋鼠把孩子装在口袋里,骆驼能一星期不喝水。"],["The panda eats nothing but bamboo, and the elephant is given hay and fruit.","熊猫只吃竹子,大象喂的是干草和水果。"],["Its ivory is worth more than the animal alive, which is why it is hunted.","它的象牙比活着的它更值钱,所以才有人猎它。"],["A horn is bone, and the coat of a bear is thick enough for the snow.","角是骨头,熊的毛厚得能挡雪。"],["The wolf walks the length of its cage and back, and the fox sleeps through the afternoon.","狼在笼子里走到头再走回来,狐狸睡一下午。"],["On the wall of the shop there is a dragon, red and gold, and nobody asks why.","店墙上画着一条红金两色的龙,没人问为什么。"]]},{"t":"On the Farm","s":[["The cub was born in March, and the calf a week later, and both stayed close to the barn door.","那只幼兽三月出生,小牛晚一个星期,两个都待在谷仓门口。"],["The pup follows the shepherd everywhere, and the lamb stays with the flock.","小狗跟着牧羊人到处跑,羊羔跟着羊群。"],["They keep cattle on the low field and a buffalo by the water, and the ox pulls the cart when the tractor is broken.","低处的地养牛,水边一头水牛;拖拉机坏了就靠公牛拉车。"],["The bull is kept apart, because he is not safe with strangers.","公牛单独关着,因为它见了生人不安全。"],["A horse is saddled in the morning and a donkey is harnessed to the cart, and both are back in the stable by dark.","早上给马备鞍,给驴套上车,天黑前两个都回马厩。"],["A zebra will never be tame, and a child soon learns the difference.","斑马永远驯不服,孩子很快就能看出这个差别。"],["The keeper comes at six, and the shepherd at seven, and the animals know both.","饲养员六点来,牧羊人七点来,动物认得他们两个。"]]},{"t":"How They Live","s":[["The behaviour of a fox is easy to watch and hard to explain, and a cat will rub its head on your hand for no reason.","狐狸的行为好看不好解释;猫会无缘无故用头蹭你的手。"],["A dog will bark at the gate and a lion will roar at nothing, and a snake will bite if you step on it.","狗对着大门叫,狮子无缘无故地吼,你踩到蛇它就会咬。"],["A wasp can sting more than once, and a bee only once.","黄蜂能蜇好几下,蜜蜂只蜇一次。"],["A beetle will creep under a stone and a baby will crawl across the floor, and neither is in a hurry.","甲虫会钻到石头底下,娃娃会在地板上爬,两个都不着急。"],["The habitat of a bird is the wood and the hedge, and its nest is built in the fork of a branch.","鸟的栖息地是林子和树篱,它的窝搭在树枝分叉的地方。"],["A hive holds ten thousand bees, and a cage holds one bird, and the difference is not lost on anyone.","一个蜂箱装一万只蜂,一个笼子只装一只鸟,这个差别谁都看得出来。"],["A cell is the smallest part of a living thing, and a barrier of wire keeps the rabbits out of the field.","细胞是生物最小的部分;一道铁丝屏障把兔子挡在田外。"],["There is a bar across the gate, and the gate is shut at night.","门上横着一根闩,夜里就关上。"]]},{"t":"Inside the Body","s":[["Anatomy is the study of what is inside, and it begins with the bone.","解剖学研究里面有什么,从骨头开始。"],["An epidemic moves through a town in weeks, and it is carried by a germ too small to see.","流行病几星期就能传遍一个镇子,带它的是看不见的病菌。"],["A gene is passed from parent to young, and a virus is not a living thing at all.","基因由父母传给孩子;病毒根本不算生物。"],["Bacteria and other microbes live on the skin and in the mouth, and most of them do no harm.","细菌和其他微生物住在皮肤上和嘴里,大多数并不伤人。"],["Metabolism is the rate at which the body burns what it is given, and protein and vitamin are what it needs to build with.","新陈代谢是身体烧掉所得东西的速度;蛋白质和维生素是它用来建造的材料。"],["A gland will secrete what the body needs, and the rest is excreted by the kidney.","腺体会分泌身体需要的东西,剩下的由肾排出去。"],["A wolf will devour a rabbit in two minutes, and instinct tells it to.","狼两分钟就能吞掉一只兔子,本能叫它这么做。"],["An intuitive jump is often right, but it is not knowledge.","直觉的一跳常常是对的,可那不算知识。"]]},{"t":"Senses and Sleep","s":[["Every animal has potential that its body allows and no more, and a fish will never learn to climb.","每个动物都有身体允许的潜力,多一点也不行;鱼永远学不会爬树。"],["Intelligence is measured by what an animal does with what it has, and a crow does a great deal.","智力看的是动物拿手里的东西做了什么,乌鸦做的就很多。"],["A functional wing is one that works, and a sensitive nose is one that finds food in the dark.","有用的翅膀是能飞的,灵敏的鼻子是黑夜里能找到食的。"],["A flexible body fits through a gap, and an acoustic signal carries further than a light.","柔软的身体能钻过缝,声音信号比光传得远。"],["An optical nerve tells the brain what the eye sees, and the ear does the same for sound.","视神经把眼睛看到的告诉脑子,耳朵对声音做同样的事。"],["A nocturnal animal sleeps by day, and a dormant one may sleep through a whole season.","夜行动物白天睡,休眠的动物能睡过一整季。"],["Hibernation is how a hedgehog gets through the winter, and it wakes in March thin and hungry.","冬眠是刺猬过冬的办法,三月醒来又瘦又饿。"]]},{"t":"Hunter and Prey","s":[["A hunter reads a track in the mud and a trace on a leaf, and both tell him what passed in the night.","猎人看得懂泥里的脚印和叶子上的痕迹,两样都告诉他夜里有什么经过。"],["The prey is always listening, and the predator always waits, and their turns alternate through the year.","猎物一直在听,捕食者一直在等,一年里它们轮流占上风。"],["The victim of a hunt is usually old or young, and the young are vulnerable for a reason.","被猎杀的通常是老的或小的,幼崽脆弱是有原因的。"],["A captive animal is fed and safe and has no life of its own, and a defensive one will fight for a corner of ground.","被关起来的动物有吃有安全,却没有自己的生活;处于守势的动物会为一块地拼命。"],["Every animal will undergo some hardship and suffer some cold, and that is part of existing at all.","每个动物都要经历一些艰难、受一些冻,这本来就是活着的一部分。"],["Most of them live at subsistence level, and a bad year is a bad year for everything.","它们大多只够糊口,年景坏的时候,对谁都是坏年头。"],["We have exterminated more species than we can count, and each one was the only one of its kind.","我们消灭掉的物种多得数不清,而每一种都是它那一类里唯一的一种。"]]}],"4":[{"t":"Looking Up","s":[["The cosmos is everything there is, and the universe is the same thing seen as a whole.","宇宙就是存在的一切,把这一切当成一个整体看,还是宇宙。"],["Our galaxy is one among billions, and interstellar space is not empty, because dust and gas drift between the stars.","我们的银河系只是几十亿个里的一个;星际空间也不是空的,尘埃和气体在群星之间飘。"],["A celestial body is anything up there, while a terrestrial planet is one like ours, with rock under your feet.","天体是天上任何一样东西;类地行星则是像我们这样的,脚下踩着石头。"],["Astronomy studies all of it, and astrology only pretends to.","天文学研究这一切,占星术只是装作能。"],["On a clear night the telescope at the observatory shows a spectacle that no photograph keeps.","晴朗的夜里,天文台的望远镜能给你看一场照片留不住的景象。"],["A planet goes round the sun in an orbit, and that path lies close to the ecliptic.","行星沿轨道绕太阳走,那条路离黄道很近。"],["The diameter of the earth is about twelve thousand kilometres, and its radius is half of that.","地球的直径约一万二千公里,半径是它的一半。"]]},{"t":"Out There","s":[["An astronaut in orbit sees the curve of the earth below, and the whole thing looks small from up there.","轨道上的宇航员向下看见地球的弧线,从上面看,这一切都很小。"],["A comet drags its tail behind it, and the tail always points away from the sun.","彗星拖着尾巴,尾巴永远背向太阳。"],["A meteorite that lands makes a crater, and the dust and ash stay in the air for months.","落下来的陨石砸出一个坑,扬起的尘土和灰在空中好几个月。"],["A spacecraft is sent up in a module, and the propulsion comes from a vent at the back.","航天器由一个舱段送上天,推力从尾部的喷口出来。"],["The pressure inside is kept at one atmosphere, and the dynamics of the whole thing are worked out on paper first.","舱内压力保持在一个大气压;整个东西的动力学先在纸上算清楚。"],["Motion in space is simple, because nothing slows you down.","太空里的运动很简单,因为没有东西让你慢下来。"],["A spaceship on a long expedition carries a probe for a flyby, and the sample it brings back is worth the cost.","远航的飞船带着探测器做飞越,它带回来的样品值这个价钱。"],["Exploration is the word for all of it, and it began with somebody looking up.","这一切都叫探索,而它是从有人抬头看天开始的。"]]},{"t":"What Things Are Made Of","s":[["Every substance is either a solid, a liquid or a fluid that flows, and water can be all three in one day.","每种物质不是固体、液体,就是会流动的流体,水一天里能变成三样。"],["Its composition tells you what is in it, and a compound is two elements joined together.","它的成分告诉你里面有什么;化合物是两种元素结合在一起。"],["A particle is a very small piece, a molecule is a group of atoms, and an atom is the smallest part of an element.","微粒是很小的一块,分子是一组原子,原子是元素最小的部分。"],["An ion carries a charge, an electron is one of its parts, and a quantum is the smallest amount you can have.","离子带电,电子是它的一部分,量子是你能拿到的最小的一份。"],["Chemists synthesise a new compound by a method they invent, and the formation of the crystal is watched under a lens.","化学家用自己想出来的方法合成新化合物,晶体的形成在镜片下看着。"],["A fossil is a specimen of something that lived long ago, and the sample from the moon is kept in a box.","化石是远古生物的一件标本;月球带回来的样品锁在盒子里。"]]},{"t":"Light and Signals","s":[["White light holds every colour, and a spectrum is that light spread out in order.","白光里含着所有颜色,光谱就是把这光按顺序摊开。"],["A dimension is one way of measuring a thing, and the frequency of a wave is how often it comes.","维度是量一样东西的一种方式;波的频率是它多久来一次。"],["The signal from the probe is picked up by an antenna, and the circuit behind it turns the wave into a number.","探测器发回的信号由天线接收,后面的电路把波变成一个数字。"],["Refraction bends light as it passes from air into glass, which is why a straw looks broken in a glass of water.","折射让光从空气进玻璃时拐弯,所以插在水杯里的吸管看着是断的。"],["Ultraviolet light is invisible to us, and anything radioactive gives off something we cannot see either.","紫外线我们看不见,放射性的东西放出的东西我们也看不见。"],["Two stars are distinct if you can tell them apart, and discernible if you can just make them out.","两颗星分得清是一回事,勉强看得出轮廓是另一回事。"]]},{"t":"When It Goes Wrong","s":[["A collision at that speed would squash anything we could build, and the envelope of the capsule is only thin metal.","那个速度撞上来,我们造得出的一切都会被压扁,而舱的外壳只是薄金属。"],["A chunk of rock the size of a house came down over the desert last spring, and it broke into a thousand fragments.","去年春天一块房子那么大的岩石落在沙漠上,碎成千百片。"],["An event that size is cataclysmic, and the dust it lifts is overwhelming for a whole season.","那种规模的事件是灾难性的,它扬起的尘埃能压住整整一季。"],["The people who study it do not despair, and they are not desperate either, because the numbers are on their side.","研究它的人并不绝望,也没有走投无路,因为数字站在他们这边。"],["It would be hopeless to plan for everything, so they plan for what is likely.","为所有情况做准备是没指望的,所以他们只为可能发生的做准备。"]]}],"5":[{"t":"From Primary to University","s":[["Education begins at home and then at a primary school, where a child learns to read and to sit still.","教育从家里开始,然后进小学,孩子在那里学认字,也学坐得住。"],["Secondary school comes next, and after that some go on to a university or a college in another town.","接下来是中学,之后有人去外地上大学或学院。"],["A college is often smaller than a university, and an institute may teach only one thing, such as engineering.","理工学院通常比大学小,而且可能只教一样东西,比如工程。"],["An academy is the oldest word of the three, and it still sounds grander than the others.","专科学校是这三个说法里最老的,听起来也最气派。"],["The campus here is one long street with a lawn at each end, and in summer it is full of people who have nowhere to be.","这里的校园就是一条长街,两头各一块草坪,夏天到处是没地方去的人。"]]},{"t":"The First Week","s":[["In the first week you register at the office, and then you enrol in four courses and hope they do not clash.","开学第一周你去办公室注册,然后选四门课,指望它们别撞。"],["Your name goes on a roster that the tutor reads out on the first morning.","你的名字被写进花名册,导师在第一天早上念一遍。"],["Matriculation is the old word for being let in, and it still appears on the letter they send you.","录取入学是\"被准许进去\"的老说法,如今还印在他们寄给你的那封信上。"],["A fresher knows nothing, a sophomore thinks he knows everything, and by the third year a student is junior and quiet.","大一新生什么都不懂,大二学生自以为全懂,到三年级人就沉下来了,也不吵了。"],["In the last year you are a senior, and after that you are one of the alumni, whether you come back or not.","最后一年你是毕业班,之后不管你回不回来,你都是校友了。"],["Orientation week is three days of being shown buildings you will never enter again.","入学介绍那一周有三天,带你去看一些你以后不会再进的楼。"],["Accommodation is the first real problem, because the dorm holds six and there are seven of you.","住处是第一个真问题,宿舍住六个,而你们有七个。"],["The dining hall is cheap and the canteen is cheaper, and both close at eight.","食堂贵一点,小餐厅更便宜,两个都八点关门。"]]},{"t":"Learning and Teaching","s":[["You learn a language by using it, and you study a subject by sitting down with it for years.","语言是用出来的,学科是坐下来磨出来的。"],["Either way you acquire something that stays, and that is what knowledge means.","两条路都是把一样留得住的东西拿到手,这就叫知识。"],["Expertise is narrower and deeper, and it takes a novice ten years to get there.","专门技能更窄也更深,新手要走十年。"],["The department will recruit two more teachers this year, because the classes are too big.","系里今年要再招两个老师,因为班太大了。"],["A person who can read and write is literate, and illiteracy is still common in the countryside.","能读能写的人是识字的,而乡下文盲还不少。"],["To be numerate is to be at home with numbers, and it matters as much as the other.","会算数就是跟数字处得来,这跟识字一样要紧。"],["Some students cram the night before and forget it by Friday, which is not learning at all.","有些学生考前一晚死记,到周五就忘了,这根本不算学。"],["A good teacher will instil a habit rather than a fact, and will emphasise the method more than the answer.","好老师灌输的是习惯而不是事实,强调方法多过答案。"],["That is what enhances a class and enables a shy student to speak.","这才让一节课变好,也让害羞的学生能开口。"],["A single question can inspire a whole year of work.","一个问题能激起一整年的用功。"]]},{"t":"Why Anyone Bothers","s":[["The motive is rarely money, and the students who last are the ones who were motivated by something else.","动机很少是钱,能撑下来的学生都是被别的东西推动的。"],["A good lecture stimulates an interest that was not there before, and a hard problem spurs people on.","一堂好课能激起本来没有的兴趣,一个难题会推着人往前走。"],["The impetus often comes from a teacher who took the trouble, and it lasts for years.","推动力常常来自一个肯费心的老师,而且能持续好多年。"],["Parents who indulge a child will spoil him, and a school that indulges a class spoils the whole year.","父母一味纵容会把孩子宠坏;学校一味纵容一个班,整年就毁了。"],["The abuse of a system is what ruins it, not the system itself.","毁掉一套制度的,是滥用它的人,不是制度本身。"]]},{"t":"Clever, Brilliant, Notorious","s":[["An intelligent student works things out, a clever one finds a shortcut, and a smart one does both and looks good doing it.","聪明的学生能把事情想通,机灵的学生能找到捷径,而精明的那位两样都会,还做得好看。"],["An all-round student is good at three things, and a genius is good at one thing nobody else can do at all.","全能的学生三样都好,天才把一件别人根本做不了的事做好。"],["The elite of a school are not always the ones with the best marks, and an idiot can pass an exam.","学校的精英不一定是分数最高的,而笨蛋也能通过考试。"],["Wisdom is slower than wit, and it lasts longer.","智慧比机智慢,可它更耐久。"],["Aptitude is what you start with, and a capable student will get somewhere with very little of it.","天资是你起步时的东西,而有能力的学生哪怕天资不多也能走出来。"],["An excellent essay is careful, an outstanding one is brave, and a brilliant one is both and reads easily.","优秀的文章是仔细的,杰出的文章是敢的,而出色的文章两样都有,读起来还轻松。"],["Prestige takes a hundred years to build, and a reputation takes one afternoon to lose.","声望要一百年才建起来,名声一个下午就能丢掉。"],["An eminent professor may be dull in class, and a notorious one is remembered for the wrong reason.","有名望的教授课上可能很闷,而声名狼藉的那位是被人记错了地方。"],["Students esteem the teachers who respect them, and it is that simple.","学生敬重尊重他们的老师,就这么简单。"],["A diligent student does the work, a painstaking one does it twice, and both end up with the skill.","勤勉的学生把活干了,苦干的学生干两遍,两个人最后都学到了本事。"],["The approach matters more than the hours, and a scheme that looks clever on paper often fails in a classroom.","方法比时长要紧,纸上看着聪明的方案,到了教室里常常不灵。"]]},{"t":"The People in the Building","s":[["The headmaster runs the school and the principal runs the college, and both are called the head by everyone.","校长管中学,院长管学院,可大家一律叫他们\"头儿\"。"],["A dean looks after one faculty, and the faculty is both the teachers and the subject they teach.","院长管一个学院,而这个词既指全体教员,也指他们教的学科。"],["A professor has a chair, a scholar has a library card, and a scientist has a laboratory and no time.","教授有教席,学者有借书证,科学家有实验室和没时间。"],["A mentor answers the questions you did not know how to ask, and a tutor is paid by the hour to do the same.","导师回答你不知道怎么问的问题,家教按小时收费,做的是同一件事。"],["A lecturer stands at the front, and an assistant stands at the side and marks the papers.","讲师站在前面,助教站在旁边改卷子。"],["Every candidate wants the same thing, and only half of them will get it.","每个应试者想要的都一样,而只有一半人拿得到。"],["A pupil is still at school, and a graduate has a degree and no idea what to do next.","小学生还在学校里,毕业生有了学位,却不知道下一步做什么。"]]},{"t":"Paper That Says You Can","s":[["A degree is a piece of paper that says you studied something for three years.","学位是一张纸,说明你研究过某个东西三年。"],["To qualify you have to pass the exams, and to be certified you have to prove it again to somebody else.","要取得资格得通过考试,要拿到证明还得再向别人证明一遍。"],["A license and a permit are both permission, but a license is for a trade and a permit is for one act.","执照和许可是同一种准许,只是执照针对一门手艺,许可针对一件事。"],["A diploma is what you hang on the wall, and a diplomat is the one who gets sent abroad with it.","文凭是挂在墙上的那张,而外交官是带着它被派到国外去的人。"],["An ambassador outranks the diplomat, and the ceremony at the end of the year outranks both in memory.","大使比外交官高一级,而年底那场典礼在记忆里比两个都重。"],["A bachelor has three years behind him, a master two more, and a doctor at least three after that.","学士读完三年,硕士再两年,博士之后至少再三年。"],["You earn credit for each course, and a score of sixty is enough to pass.","每门课都挣学分,六十分就够及格。"],["The mark on the paper matters less than the grade at the end of the year, and the rank in the class matters least of all.","卷面上的分数不如学年总评要紧,而班里的名次最不要紧。"]]},{"t":"The Shape of a Term","s":[["A course lasts one semester, and a term is the old word for the same thing.","一门课上一个学期,两个词说的是同一件事,后面那个更老。"],["The timetable is fixed in September and the schedule changes by October, and the deadline never moves.","课表九月定好,日程到十月就变,而截止日期从来不动。"],["A lesson is fifty minutes, and the curriculum is what the whole year has to contain.","一节课五十分钟,而课程体系是一整年必须装下的东西。"],["There is a seminar on Tuesday and a forum on Thursday, and both are worse than they sound.","周二有研讨课,周四有讨论会,两个都比听起来难熬。"],["The syllabus tells you what will be covered, and the system behind it decides what you may take.","教学大纲告诉你讲什么,而它背后的制度决定你能选什么。"],["A rudimentary knowledge of the language is enough for the first year, but the basic course assumes nothing at all.","语言有一点入门底子就够第一年用,而基础课则假设你什么都不会。"],["The fundamental ideas are taught first, and the elementary ones are taught again in October to whoever forgot them.","先讲根本的道理,到十月再把初级的东西给忘了的人重讲一遍。"],["Two lectures go deep and one only skims the surface, and the profound one is usually optional.","两堂课讲得深,一堂只碰个表面,而深的那堂通常是可以不去的。"],["The compulsory courses are the ones nobody chooses, and a prerequisite is what you must pass before you may start.","必修课是没人会选的课;先修条件是你开始之前必须先过的那一门。"],["A selective course is hard to get into, and an elective is the one you take because it fits on a Tuesday.","选拔性的课难进,选修课则是你因为排在周二才选的那门。"],["Every assignment has to be submitted online, and the printer in the library jams at least once a day.","每份作业都得在线提交,图书馆的打印机一天至少卡一次。"],["Discipline is what gets you to the nine o clock lecture, and it has nothing to do with punishment.","纪律是让你赶上九点那堂课的东西,跟惩罚没关系。"],["A principle is a rule you can argue from, a doctrine is one you are told to accept, and a theory is one that may still be wrong.","原则是你能据以论证的规则,教义是你被要求接受的,而理论是可能还错的。"]]},{"t":"Reading for a Degree","s":[["Before a lecture you preview the chapter, and after it you review your notes while they still make sense.","上课前先预习这一章,课后趁笔记还看得懂赶紧复习。"],["In May you revise everything again, which is a different verb and a worse job.","到五月要把所有东西再温一遍,那是另一个词,也是更苦的活。"],["You inspect the data first, then you consult the handbook when the numbers look wrong.","先检查数据,数字看着不对再去查手册。"],["Learn to skim a report in two minutes and to scan a page for one name, because nobody reads every word.","学会两分钟略读一份报告,也学会在一页上扫出一个名字,因为没人逐字读。"],["A good examiner will scrutinise the argument, not the handwriting.","好考官细看的是论证,不是字迹。"],["You recite the poem in class and dictate a paragraph to the class, and both are more frightening than the examination itself.","你在课上背诗,也给全班做听写,两样都比考试本身吓人。"],["A test is short and a quiz is shorter, and a presentation is the only one where they look at you.","测验短,小测更短,而展示是唯一他们要看着你的那一种。"],["To plagiarise is to copy a sentence and hope, and it is the one thing that will end a degree.","抄袭就是抄一句、然后祈祷,这是唯一能终结一个学位的事。"],["Print it twice, keep one copy, and hand in the other.","打两份,一份留着,一份交上去。"]]},{"t":"The Library","s":[["Literature is what people wrote, and the library keeps it on three floors.","文学是人们写下来的东西,图书馆把它放在三层楼里。"],["An article is short, an author is whoever wrote it, and a tale is what your grandmother told you.","文章短,作者是写它的人,而故事是你奶奶讲给你听的那种。"],["Fiction is invented and a story can be either, and a diary is true and dull.","小说是编的,故事可以是编的也可以是真事,而日记是真的、也很闷。"],["Poetry takes a page to say what a sentence could, and a magazine takes a week to say nothing.","诗用一页说一句话能说完的事,杂志用一星期说什么也没说。"],["A journal is where the work is published, and the coverage of a subject is how much of it has been written about.","期刊是发表研究的地方;一个题目的覆盖程度,是它被写过多少。"],["The bibliography at the end is longer than the chapter, and the encyclopedia on the shelf is older than the building.","书末的参考书目比那一章还长,架上的百科全书比这栋楼还老。"],["A biography is one life, a documentary is one year, and a series is one subject spread over twelve evenings.","传记写的是一生,纪录片拍的是一年,而系列片是一个题目摊在十二个晚上。"],["Every experiment goes into a record, and every record goes into a file.","每次实验都进一份记录,每份记录都进一个档案。"],["A profile is a page about a person, and a draft is a page that is not finished.","简介是写人的一页,草稿是还没写完的一页。"],["He sketched the plan on a brochure, and the manual for the machine is three pages of drawings.","他把计划画在一本小册子背面,而那台机器的说明书是三页图。"],["A frame holds a picture and also holds an argument, and an index tells you where to look.","画框装画,框架也装论证;索引告诉你该往哪儿看。"],["The catalogue lists every book by category, and the inventory counts what is actually on the shelf.","目录按类别列出每本书,清单则数清架上真正有几本。"],["The content of a course is not the same as its context, and a list of chapters is not a book.","一课的内容不等于它的语境,一串章名也不等于一本书。"],["Volume one is on the desk, volume two is lost, and the reel of film has not been shown since 1974.","第一卷在桌上,第二卷丢了,那卷胶片从 1974 年就没再放过。"]]},{"t":"Bits and Pieces of a Course","s":[["A platform is where you stand to speak, and it is also where the course materials are put online.","讲台既是你站着讲话的台子,也是课程资料放在网上的那个地方。"],["The college went coed in 1972, which means it began to take women as well as men.","这所学院 1972 年开始男女同校,意思是它开始收女生。"],["The issue was never the money, and the whole affair was settled in a week.","问题从来不是钱,整件事一个星期就了了。"],["It became a controversial decision, and the argument turned into a puzzle nobody could solve and a riddle nobody could answer.","这个决定有了争议,争论变成一个谁也解不开的谜,一个谁也说不出答案的谜语。"],["The reason was obscure, and the letter they sent was deliberately unclear.","原因很含糊,他们寄来的那封信也故意写得不清不楚。"],["The object of the course is not the same as the subject of the course, and both are on the first page.","课程的目标和课程的主题不是一回事,两样都印在第一页。"],["You choose a major in the second year and a minor in the third, and neither is easy to change.","二年级选主修,三年级选辅修,两个都不好改。"]]},{"t":"Choosing a Subject","s":[["Sociology looks at people in groups, politics looks at who decides, and economics looks at what things cost.","社会学看人群,政治学看谁说了算,经济学看东西值多少钱。"],["Marketing is how a company sells, accounting is how it counts, and an audit is when somebody else counts again.","营销讲怎么卖,会计讲怎么记账,而审计是别人再数一遍。"],["Statistics turns a crowd into a number, and psychology asks why the crowd did that.","统计学把一群人变成一个数字,心理学问这群人为什么这么做。"],["Philosophy asks what a question means, and logic tells you whether the answer follows.","哲学问一个问题到底是什么意思,逻辑告诉你答案能不能推出来。"],["Biology is about living things, physics about how they move, and chemistry about what they are made of.","生物学研究活物,物理学研究它们怎么动,化学研究它们由什么组成。"],["Agriculture feeds everyone, logistics gets the food to the shop, and geography explains why the shop is there.","农业养活所有人,物流把食物送到店里,地理学解释店为什么开在那儿。"],["History is what happened, and mechanics is why the machine will not start.","历史是发生过的事,力学是机器为什么打不着火。"],["Electronics is what is inside the radio, and maths is what you need before you may touch either.","电子学是收音机里面的东西,而数学是你碰这两样之前必须会的。"],["Arithmetic is the four operations, geometry is shapes, algebra is letters for numbers, and calculus is what comes after.","算术是四则运算,几何是形状,代数是拿字母代替数字,微积分是之后的事。"]]},{"t":"Sums and Numbers","s":[["Three plus four is seven, and the sum of a column is what you get when you add it up.","三加四等于七;一列数加起来得到的那个结果就是和。"],["The total is the whole thing, and after the merger the two companies had one total.","总数指的是整体;两家公司合并之后,只有一个总数了。"],["An equation says two things are the same, and identical means they really are the same.","方程式说两样东西相等,而完全相同是说它们真的一样。"],["Take away is minus, and subtract is the same word for grown ups.","拿掉就是减,而减去只是大人用的那个说法。"],["Multiply by two and divide by four, and you are back where you started.","乘二再除四,你就回到原处。"],["The dividend is the number being divided and the remainder is what is left over.","被除数是那个要被除的数,余数是除完剩下的。"],["A rational answer is one another person can follow, and a variable is the part that keeps changing.","合理的答案别人能跟着走一遍;变量是那个一直在变的部分。"],["A parameter is fixed for the experiment even though nobody can say why.","参数在实验里是固定的,尽管没人说得出为什么。"],["Two, four and six are even, and one, three and five are odd, and that is all there is to it.","二、四、六是偶数,一、三、五是奇数,就这么回事。"],["Double it, then triple it, and if you are brave, quadruple it, and the answer is a multiple of the first number.","翻一倍,再翻两倍,胆大的话翻四倍;答案总是原来那个数的倍数。"],["The maximum is what the machine can do, and the minimum is what it needs to start.","最大值是机器能干的极限,最小值是它启动所需。"],["There are approximately forty students, which means thirty eight or forty one, and nobody counts.","大约四十个学生,意思是三十八或四十一,反正没人真数。"]]},{"t":"Charts and Shapes","s":[["A chart shows the numbers as a picture, a graph draws a line through them, and a diagram shows how the parts fit.","图表把数字画成图,曲线图在它们之间连一条线,示意图则说明各部分怎么拼。"],["A table puts them in rows, and a matrix puts numbers in both rows and columns.","表格把数字排成行,矩阵则把数字排成行和列。"],["A rectangle has four straight sides, a triangle has three, and a cube is a box with six faces.","长方形四条直边,三角形三条,立方体是六个面的盒子。"],["An angle of ninety degrees is a corner, and the diagonal runs from one corner to the other.","九十度角就是一个角;对角线从一个角连到另一个角。"],["A circle is round, a sphere is round in every direction, and a cone is round at the bottom and pointed at the top.","圆是平面的圆,球是每个方向都圆,圆锥底下圆、上面尖。"],["A dot marks one point on the line, and a straight line is the shortest way between two.","点在线上的某处做一个记号;直线是两点之间最短的路。"],["The extent of the field is a hundred metres, and its width is half its length.","这块地的范围有一百米,宽度是长度的一半。"],["Write it as a decimal and then as a per cent, because a proportion is easier to see that way.","写成小数,再写成百分数,因为比例那样更好看。"],["The rate is how fast, the ratio is how much to how much, and a fraction is one number over another.","速率是多快,比率是多少比多少,分数是一个数除以另一个数。"],["On a scale of one to ten the machine is a seven, and one ounce of it is enough to sink a boat.","按一到十分算,这台机器算七分;一盎司这种东西就够沉掉一条船。"],["Density is how much fits in a space, and that is all the word means.","密度是一个空间里能装多少,这个词就这个意思。"]]},{"t":"The Bench","s":[["The quantity matters less than the quality, and a small jar of the pure thing is worth a barrel of the other.","数量不如质量要紧,一小罐纯的,值一大桶不纯的。"],["The thermometer on the wall is in Fahrenheit, and the one in the drawer is in Celsius, so nobody knows what the weather is.","墙上的温度计是华氏,抽屉里那支是摄氏,于是没人知道天气到底怎样。"],["Mercury rises with the heat, and a battery holds the charge that the volt measures.","水银受热上升;电池存着由伏特来量的那份电。"],["A fire will radiate heat across a room, and a lamp will emit just enough light to read by.","火把热辐射到整个屋子,灯放出的光刚够看书。"],["Glass is transparent, so you can see the hollow inside, and the tube is hollow all the way down.","玻璃是透明的,你能看见里面是空的;那根管子从头到尾都是空的。"],["Ozone high up protects us, and ozone at street level does not.","高处的臭氧保护我们,街面上的臭氧不是。"],["Gravity pulls everything down, and friction is why nothing slides for ever.","重力把一切往下拉,摩擦则解释为什么没有东西能一直滑下去。"],["The old man was eccentric, and he would displace a whole shelf of books to find one.","那老头脾气古怪,为了找一本书能把整个书架挪开。"],["Water will boil at a hundred, melt ice at nought, and dissolve sugar without a sound.","水在一百度沸腾,在零度融冰,把糖化掉的时候一声不响。"],["Iron will rust in the rain, and milk will ferment in the heat.","铁在雨里会锈,牛奶在热里会发酵。"],["Dilute the acid before you touch it, because the strong one is noxious and will burn through a glove.","碰酸之前先稀释,浓的那瓶有毒,能烧穿一只手套。"],["A static charge will lift a hair, and an inert gas will do nothing at all.","静电能把一根头发吸起来,惰性气体则什么都不做。"],["Nothing inherent in the metal makes it weak; the fault is in how it was made.","这金属本身并不弱,毛病出在它是怎么造出来的。"],["The formula tells you the proportions, and each component goes in by weight.","配方告诉你比例,每种成分按重量放进去。"],["Compose the mixture slowly, blend it until it is even, and do not stir a blend once it is set.","慢慢把混合物配好,搅到均匀;一旦凝住就别再搅。"],["Empirical work means you tried it, and practical means it worked in the kitchen and not only on paper.","经验的,是说你真试过;实用的,是说它在厨房里也管用,不只是纸上。"]]},{"t":"Thinking It Through","s":[["You presume the bus will come, you suppose it will be on time, and you are wrong about one of them.","你假定公交会来,你猜想它会准点,其中一样你猜错了。"],["A hypothesis is a guess you can test, and a postulate is one you agree not to test.","假说是你能检验的猜想,公设是大家说好不去检验的那种。"],["We can only speculate about the rest, and predict what happens next with the same numbers.","剩下的事我们只能推测,再用同一批数字预测下一步。"],["You perceive a change before you can name it, and a good instrument will detect what the eye cannot.","你能察觉到变化,却还说不出是什么;好的仪器能测出眼睛测不到的。"],["To discern a pattern is to see it and be sure, and to recognise it is to have seen it before.","辨认出规律是看见并且确定,而认出它是以前见过。"],["A conscious choice is one you knew you were making, and most of them are not.","有意识的选择是你知道自己正在做的那个,而大多数选择都不是。"],["I reckon it will rain, and I deem the plan unwise, and neither is a promise.","我估计会下雨,我认为这个计划不明智,两个都不是保证。"],["A silence can imply more than a sentence, and a nod can represent agreement you do not feel.","沉默能暗示的比一句话多,一个点头也能代表你并不真有的同意。"],["She will insist on paying and persist in walking home, and both are a kind of pride.","她坚持付钱,也坚持走回家,两样都是某种骄傲。"],["You can understand a word and still not comprehend the sentence it sits in.","你可能认识一个词,却还是不明白它所在的那句话。"]]},{"t":"Analysing and Concluding","s":[["To analyse is to take it apart, and to diagnose is to say what is wrong with it.","分析是把它拆开,诊断是说出它哪儿坏了。"],["From two facts you may infer a third, and from a rule you may deduce a case.","从两件事可以推想第三件,从一条规则可以推出一个具体情形。"],["You conclude only when the evidence stops, and not before.","证据用完才下结论,早一步都不行。"],["An analogy is a comparison that helps, and a contrast is a comparison that separates, so compare the two cases before you use either word.","类比是帮你想通的比较,对照是把两样分开的比较;用这两个词之前,先比一比两个例子。"],["Where two accounts overlap they agree, and where one is in contradiction with the other, one of them is wrong.","两份说法重叠的地方是一致的,互相矛盾的地方必有一份是错的。"],["Two people can disagree and still differ in nothing else, and a diverse group will disagree more often and think better.","两个人可以意见不同,别处却完全一样;一群人越多样,分歧越多,想得也越好。"],["The nuance is the small difference that decides the case, and it is always in the detail.","细微差别就是决定胜负的那点小不同,而它总在细节里。"],["An inductive argument goes from many cases to one rule, and it can never be certain.","归纳论证从许多事例走到一条规则,它永远不能确定。"],["A thorough check takes an afternoon, and it turns up the one thing an example would have hidden.","彻底的检查要花一个下午,它能找出一个例子会遮住的那样东西。"],["For instance, the second reading confirms what the first one suggested, and the third demonstrates it.","举例来说,第二次读数证实了第一次的猜测,第三次把它演示出来了。"],["The fault will manifest itself as a noise, and a diagram will illustrate where it comes from.","故障会表现为一种响声,一张图能说明它是从哪儿来的。"],["Then you must determine the cause, decide what to do, and resolve the thing before Friday.","然后你得确定原因、决定怎么办,在周五之前把它解决掉。"]]},{"t":"Writing It Up","s":[["A thesis is one argument held for a hundred pages, and a dissertation is the same thing with more footnotes.","论文是一个论点撑起一百页;学位论文是同样的东西,脚注更多。"],["A project is smaller and a report is shorter, and both have a heading on every page.","项目小一些,报告短一些,两样每页都有标题。"],["From the outset you should know the outline, even if the middle of it changes.","从一开始你就该知道纲要,哪怕中间会变。"],["The gist is what you would say if somebody stopped you in the street, and the opinion is what you think of it.","要点是别人在街上拦住你时你会说的那几句,看法是你对它的评价。"],["Introduce the question in the first paragraph, and do not introduce yourself.","第一段引出问题,别引出你自己。"],["Every reference has to be a real book, and every claim has to cite one.","每条参考文献都得是真书,每个论断都得引一条。"],["A good question will elicit an answer the writer did not plan, and a good quotation will do the same in fewer words.","好问题能引出写的人没准备过的答案,好的引文用更少的字做到同样的事。"],["You extract one sentence from a page, quote it exactly, and put the rest back on the shelf.","你从一页里摘出一句,原样引用,剩下的放回架上。"],["The abstract is written last, because it summarises what you found out.","摘要最后写,因为它总结的是你发现了什么。"],["A summary of a summary is a title.","摘要的摘要就是标题。"]]},{"t":"Research and Money","s":[["A survey asks many people the same thing, and a questionnaire is the paper you hand them.","调查问很多人同一件事,问卷是你递给他们的那张纸。"],["Research begins with a question, and you have to observe before you can answer it, which mostly means sitting still.","研究从一个问题开始,而要回答就得先观察,而观察多半就是坐着不动。"],["If you inquire politely you will get an answer, and if you query the number you may get a better one.","客气地问会得到回答;对那个数字提出疑问,可能得到更好的答案。"],["You will not achieve much in a week, and you cannot accomplish it alone.","一个星期做不成什么,一个人也完成不了。"],["It takes years to attain that level, and a morning to lose the habit.","达到那个水平要几年,丢掉习惯只要一个早上。"],["There is a queue outside the office from eight, and a row of chairs for the ones who wait.","八点起办公室外就排队,还有一排椅子给等的人坐。"],["The grant pays the fees, and a scholarship pays them and a little more, while a fellowship is the one that also buys the coffee.","助学金付学费,奖学金付学费还多一点,而研究员津贴那种还管得起咖啡。"],["They will praise the work in public and criticise it in the corridor, and both are useful.","他们会在公开场合称赞这份工作,在走廊里批评它,两样都有用。"],["I appreciate the feedback even when it is wrong, because a wrong note still tells you something.","即使是错的反馈我也领情,因为错的意见也能告诉你点什么。"],["Do not underestimate the reading, and do not overestimate the writing.","别低估读书的量,也别高估写作的难。"],["You apply in January and hear nothing until April, and then a letter arrives.","一月申请,四月之前没有音信,然后信来了。"],["The reward for the best paper is a prize and a small award, and the fee for the conference is your own.","最佳论文的回报是一个奖和一笔小奖金,而会议注册费得你自己出。"]]}],"6":[{"t":"From the Workshop","s":[["Technology is what we can do with what we know, and a technique is the way one person does it.","科技是我们知道的东西能做到的事,而技巧是一个人做它的手法。"],["My cousin went to a polytechnic and came out an engineer, and his friend stayed in the garage and became a mechanic.","我表哥读的是工学院,出来是工程师;他的朋友留在修车铺,成了机修工。"],["Every advance starts with somebody who is annoyed enough to try something else.","每一次进步都从一个人被烦得受不了开始,于是他试了别的办法。"],["To innovate is to do it differently, and a breakthrough is when the difference works.","创新是换个做法,而突破是那个换法居然行了。"],["The first version was a gizmo the size of a shoebox, and it did one thing badly.","最早那版是个鞋盒大小的玩意儿,只干一件事,还干得不好。"],["He took out a patent, so nobody else could sell it, and then he had to defend the patent for ten years.","他申请了专利,别人就不能卖;之后他花了十年守这个专利。"],["To devise something is to work it out on paper, to invent it is to build it, and to discover it is to find it already there.","设计是在纸上想出来,发明是造出来,发现是发现有样东西本来就在。"]]},{"t":"Finding Out","s":[["A company will disclose what it wants you to know and reveal the rest by accident.","公司只透露它想让你知道的,剩下的靠意外泄露。"],["Two reporters uncovered the file, and the story exposed what had been going on for years.","两个记者挖出了那份档案,报道把做了好些年的事揭了出来。"],["Each science has its own domain, and the realm of the very small belongs to physics.","每门科学有自己的领域,极小的那个领域属于物理。"],["The foundation of the whole thing was one experiment in 1908, and nobody expected it to work.","整件事的基础是 1908 年的一个实验,当时没人觉得它能成。"],["You specialise late, and until then you concentrate on the basics.","专精要晚一点,在那之前先专心打基础。"],["The lens brings the light to a focus, and the whole design focuses on that one point.","透镜把光聚到一个焦点,整个设计也都集中在那一点上。"],["They utilise the waste heat, and the usage of water has fallen by half.","他们利用废热,用水量降了一半。"]]},{"t":"The Kit","s":[["A tester tells you whether it works, and a gauge tells you how much.","测试仪告诉你它行不行,计量器告诉你有多少。"],["A device does one job, an appliance does it in the kitchen, and equipment is the whole set.","装置干一件事,器具是厨房里干那件事的,设备是一整套。"],["The facility has a workshop and a clean room, which is more than the lab next door has.","这个场所有车间,还有一间洁净室,比隔壁实验室强。"],["An instrument measures, and a tool makes; a hammer is the second and a thermometer the first.","仪器用来测量,工具用来制作;锤子是后者,温度计是前者。"],["You calculate the answer, a machine will compute it faster, and a child can count it on his fingers.","你算出答案,机器算得更快,而孩子用手指头也能数出来。"],["To estimate is to guess with numbers, to assess is to judge what you found, and to evaluate is to decide what it is worth.","估算是有数字的猜,评定是对结果做判断,评价是决定它值多少。"]]},{"t":"Bits and Pieces","s":[["An accessory is not needed but is sold with it, and a byproduct is what you get without trying.","配件不是必需品,却跟着一起卖;副产品是你没想生产却得到的东西。"],["An auxiliary pump starts when the main one fails, and it is tested once a year.","辅助泵在主泵坏的时候启动,一年测一次。"],["A versatile tool will do four jobs, and a good mechanic is versatile in the same way.","多用的工具能干四样活,好的机修工也是这样什么都会一点。"],["You add the parts one at a time and the total accumulates, so by Friday the box is full.","零件一个一个加上去,总数慢慢积累,到周五箱子就满了。"],["Two men assemble the frame while a third gathers the screws and attaches the panel.","两个人装框架,第三个人收螺丝、把面板固定上去。"],["Every part belongs to a set, and the set has a number stamped on the box.","每个零件属于一套,那套在箱子上印着编号。"]]},{"t":"Seeing Small, Hearing Far","s":[["Optics is the study of light, and a microscope with a good lens will show you the whole of a fly.","光学研究光,配上好镜片的显微镜能让你看清一只苍蝇的全部。"],["Radar sends out a pulse and listens for the echo, and a sensor does the same thing quietly.","雷达发一个脉冲,听回声;传感器做的是同一件事,只是不出声。"],["Multimedia is sound and picture together, and the network carries both to the screen.","多媒体是声音加画面,网络把两样都送到屏幕上。"],["You open a browser on a microcomputer or a laptop, and the software does the rest.","你在微型机或笔记本上打开浏览器,剩下的交给软件。"],["The keyboard clicks, the screen lights up, and the loudspeaker says what the microphone heard.","键盘咔哒响,屏幕亮起来,扬声器把麦克风听到的说出来。"],["An old cassette and a reel of tape were how we kept sound, and the dial was how we found the station.","从前我们用盒式磁带和一卷带子存声音,靠刻度盘找台。"],["Everything inside works in binary, which is why the signal is called digital.","里面的一切都以二进制运转,所以信号叫数字信号。"],["Wireless means no cable, and high-definition means you can count the hairs.","无线就是没有线,高清就是能数清头发。"],["Audio is what you hear and vision is what you see, and a fantasy film puts both in a place that never existed.","声音是听的,画面是看的,而奇幻电影把两样放在一个从不存在的地方。"],["Science fiction has been right about the telephone and wrong about almost everything else.","科幻作品猜对了电话,别的几乎全猜错。"]]},{"t":"Water, Air and Steam","s":[["A pump moves water up, and a generator turns the fall of it back into power.","泵把水往上送,发电机把水落下来的力变回电。"],["The gear turns the shaft, and the shaft turns on a pivot that has not been oiled since March.","齿轮带动轴,轴在一个从三月起就没上过油的枢轴上转。"],["The hydraulic lift works on water pressure, and it will hold a car at any height.","液压升降机靠水压工作,能把一辆车停在任意高度。"],["The drainage was put in before the houses, and the sewage goes the other way.","排水系统比房子先修好,污水走的是另一条路。"],["Ventilation is the whole art of letting air in without letting the rain in.","通风这门手艺,说到底就是让空气进来、别让雨进来。"],["Compress the gas and it warms, let it expand and it cools, and condense it and you have liquid again.","压缩气体它会热,让它膨胀它会冷,再冷凝它就变回液体。"],["They refine the oil, simplify the pipe, purify the water and filter the air.","他们炼油、简化管道、净水、过滤空气。"],["To distil is to boil it and catch what comes off, which is how the strong spirit is made.","蒸馏就是把它煮开、接住出来的东西,烈酒就是这么来的。"]]},{"t":"How It Works","s":[["The machine has three modes, and the quiet one is the only one worth using.","这台机器有三种模式,只有安静的那个值得用。"],["A prototype is built to fail, and the framework is what you keep after it does.","原型就是造来失败的,而它失败之后留下的那个骨架才是收获。"],["Every aspect of the design was checked in the first phase, and the second phase changed all of it.","设计的每个方面都在第一阶段查过了,第二阶段把它们全改了。"],["One person operates it and two people watch, and that is how a factory works.","一个人操作,两个人看着,工厂就是这么运转的。"],["A handle on the side facilitates the lift, and it transforms a two man job into a one man job.","侧面的把手让抬起变得容易,把一个两人活变成一个一人活。"],["You can convert it to gas, alter the speed, shift the weight and turn it round, but you cannot adapt it to salt water.","你能把它改成烧气、改速度、挪重心、转方向,却没法让它适应海水。"],["Every new owner will adjust something, and half of them adjust it wrong.","每个新主人都会调点什么,一半人调错了。"]]},{"t":"When It Goes Wrong","s":[["The engineer could pinpoint the fault in a minute, and she was accurate every time.","工程师一分钟就能指出故障在哪,而且每次都准。"],["The figure has to be precise, because a rough number is worse than none.","这个数字必须精确,因为粗略的数字比没有还糟。"],["The correct reading is on the left, and the one on the right is wrong.","正确的读数在左边,右边那个是错的。"],["An error in the third line made the whole table useless, and it was a mistake anyone could make.","第三行一个错误让整张表作废,而这个错谁都可能犯。"],["There is a flaw in the metal, and the fault is not in the design.","金属里有一处缺陷,毛病不在设计上。"],["He stumbled on the step and dropped the box, and that is how the corner got broken.","他在台阶上绊了一下,箱子掉了,角就是这么磕坏的。"],["We keep a spare part for a contingency, because the circumstance will come up sooner or later.","我们留一个备件以防万一,因为那种情况迟早会出现。"]]}],"7":[{"t":"What a People Leaves Behind","s":[["Culture is everything a people does without thinking about it, and civilisation is what happens when they start writing it down.","文化是一群人不假思索就在做的事,文明是他们开始把它记下来之后的产物。"],["The renaissance was a hundred years when Europe read its own old books again.","文艺复兴是欧洲重新读自己旧书的那一百年。"],["An epic is a long poem about one man, and every country has one it is proud of.","史诗是关于一个人的长诗,每个国家都有一首引以为傲的。"],["An ideology is a set of ideas that explains everything and forgives itself.","意识形态是一套解释一切、也宽恕自己的一套想法。"],["A tradition is what your grandmother did, a convention is what everyone does, and a custom is what this village does and the next one does not.","传统是你奶奶做的,惯例是大家都做的,而风俗是这个村子做、隔壁村子不做的。"]]},{"t":"Orders Old and New","s":[["Under feudalism the land belonged to one man and the people on it belonged to the land.","封建制度下,地属于一个人,地上的人属于这块地。"],["Slavery is older than any of that, and it is not finished yet.","奴隶制比这些都老,而且至今没有结束。"],["An ethical question is what you should do, and a moral one is what you owe to the person in front of you.","伦理问题问你该做什么,道德问题问你对面前这个人欠什么。"],["A tribe is a group that knows its own names back seven generations.","部落是一群能把自家名字往上数七代的人。"],["The aboriginal people here were the first inhabitants, and they were native to this coast long before anyone wrote it down.","这里的原住民是最早的居民,在有人把它写下来之前很久,他们就属于这片海岸。"],["The local school teaches the local language, and the books are printed twenty miles away.","本地学校教本地话,书却在二十英里外印。"],["To a villager the fruit is ordinary, and to a foreigner it is exotic.","对村里人这果子很平常,对外来人却是新奇的外国货。"],["An alien is not from here, and in the old books the word meant a stranger, not a creature from another world.","外来的不是本地人;在旧书里这个词指陌生人,不是外星生物。"],["An anthropologist lives with a tribe for a year, and a humanitarian stays for ten.","人类学家和一个部落住一年,人道主义者住十年。"]]},{"t":"The Past in the Ground","s":[["Heritage is what you inherit without signing anything, and a house is the part of it you can touch.","遗产是你不签任何字就继承下来的东西,房子是其中能摸到的那部分。"],["An antique is a chair nobody may sit on, and the museum keeps three of them behind glass.","古董是一把谁都不许坐的椅子,博物馆在玻璃后面放了三把。"],["Archaeology is careful digging, and to excavate a site takes a summer and a hundred forms.","考古是小心地挖,发掘一处遗址要一个夏天和一百张表。"],["The pottery they found was engraved with a line of birds, and the bowl was decorated inside as well.","他们找到的陶器上刻着一行鸟,碗里面也画了花。"]]},{"t":"What People Believe","s":[["Religion answers the questions that nothing else answers, and ritual is how the answer is repeated every year.","宗教回答别的东西回答不了的问题,仪式就是每年把那个回答重复一遍。"],["Etiquette is the small rules of a belief, and it matters more at the table than in the church.","礼节是信仰里的小规矩,在饭桌上比在教堂里更要紧。"],["A belief is what you hold when the evidence stops, and the soul is the part of you that a belief says will not stop.","信念是证据用完之后你还握着的那个东西;而在信仰里,灵魂是你身上不会结束的那部分。"],["The spirit of a place is not its ghost; it is the mood the street puts you in.","一个地方的精神不是它的鬼魂,而是那条街给你的心情。"],["A sacred stone, a hallowed ground and a holy day all mean set apart, and the three words come from the same idea.","神圣、受崇敬、圣洁,三个词都指\"被单独划出来\",是一个意思。"],["The Pope is in Rome, a bishop runs a diocese, and a missionary is sent where nobody asked him to come.","教皇在罗马,主教管一个教区,而传教士是被派到没人请他去的地方的人。"],["A priest says the service, the Bible is read from the front, and the church is cold in winter.","神父主持礼拜,圣经在前面念,教堂冬天很冷。"],["The cathedral took two hundred years, and the choir has been singing in it since 1503.","这座大教堂修了两百年,唱诗班从 1503 年就在这里唱。"],["A monk keeps the hours, a temple keeps the incense, and a pagoda keeps nothing but the view.","修士守着时辰,庙里守着香火,而塔上什么也不守,只有风景。"]]},{"t":"Crowns and Titles","s":[["An empire is what one country calls another country after it takes it.","帝国是一个国家拿下另一个国家之后,对它的称呼。"],["The imperial palace is open to the public now, and the royal family lives in a smaller house.","皇宫如今对公众开放,王室住在一处小些的房子里。"],["A dynasty lasts while the money lasts, and the chronology of the last one fills a whole shelf.","王朝能撑多久看钱能撑多久;上一个王朝的年表占了整整一格书架。"],["The emperor had the last word, the king had the army, and the queen had neither and kept the throne anyway.","皇帝说了算,国王有军队,女王两样都没有,却还是坐住了王位。"],["A prince is taught to wait, and a princess is taught to smile while she waits.","王子从小学的是等,公主从小学的是一边等一边笑。"],["Their majesties is what you call them, and majesty is also what a mountain has at sunset.","称呼他们用\"陛下\",而威严也是日落时一座山有的那种气象。"],["The nobility had the land and the titles, and the lord at the top of the hill owned the road.","贵族有地和头衔,山顶上那位老爷连路都是他的。"],["A knight had a horse and a code, and a guardian had only the job of standing between a child and the world.","骑士有马和一套规矩,而监护人只有一个差事,就是站在孩子和世界中间。"]]},{"t":"Feeling and Standing","s":[["Nostalgia is missing a time rather than a place, and being homesick is missing the place itself.","乡愁是想念一段时间而不是一个地方,想家是想念那个地方本身。"],["A celebrity is known by everybody and knows nobody, and status is what a village gives you for staying.","名人人人认识,却谁也不认识;地位是村子给你留下来的那份。"],["Her background was three generations of farmers, and her experience was the market on a Saturday.","她的背景是三代农民,她的阅历是星期六的集市。"],["One anecdote explains a whole decade better than a table can.","一段轶事比一张表更能说明整整十年。"],["An accident is nobody to blame, and an incident is one that somebody will have to explain.","意外是没人该负责的,事件是有人得出来解释的。"],["The town thrived for forty years, and its prosperity was built on one road.","镇子兴旺了四十年,它的繁荣就建在一条路上。"],["A setback is a bad year, adversity is ten of them, and the difference is what people remember.","挫折是坏了一年,逆境是连着坏十年,区别就在人们记住的是什么。"]]}],"8":[{"t":"Marks on a Page","s":[["Language is what we say, and a symbol is anything that stands for something else.","语言是我们说的话,而符号是任何代表别的东西的东西。"],["A sign on the door means the shop is shut, and a sign in the sky means rain.","门上的牌子说明店关了,天上的迹象说明要下雨。"],["A gesture can say more than a sentence, and half of what we mean is in the hands.","一个手势能比一句话说得更多,我们想说的一半在手上。"],["Her handwriting is small and upright, and I can read it only if I already know the word.","她的字又小又正,只有我本来就知道那个词,才认得出来。"],["A pictograph is a picture of the thing itself, and the oldest ones are pictures of water and sun.","象形文字画的就是东西本身,最老的那些画的是水和太阳。"],["The wedge was the first tool for writing on clay, and it left a mark like a nail.","楔子是第一个在泥板上写字的工具,留下的印子像钉子。"],["A knot in a rope was how one people kept a count, and one knot meant one day.","有一个民族靠绳上的结记数,一个结就是一天。"]]},{"t":"The Study of It","s":[["Linguistics looks at language as a thing in itself, and it does not tell you what is correct.","语言把语言本身当作对象来研究,它不告诉你什么是对的。"],["A semantic question is what a word means, and a question of syntax is where it goes in the sentence.","语义问题问一个词是什么意思,句法问题问它放在句子的哪儿。"],["Grammar is the set of rules you followed before you knew they existed.","语法是你还不知道有规则时就照着做的那套规则。"],["Phonetics studies the sounds themselves, which is why it begins with the mouth.","语音学研究声音本身,所以它从嘴开始。"],["You pronounce the first syllable and the rest follows, and the intonation tells me it is a question.","你念出第一个音节,后面就跟着来;语调告诉我这是个问句。"],["An inflection changes the shape of a word, and English has very little of it left.","屈折变化改变一个词的形状,英语里剩下的已经很少。"],["A dialect is a whole system, an accent is only the sound of it, and you can keep one and lose the other.","方言是一整套系统,口音只是它的声音;你可以留着一样,丢掉另一样。"],["An utterance is one thing said once, and oral history is a hundred years of them, kept without paper.","话语是说出口的一次;口述历史是这样一百年的话,不靠纸记下来。"],["A verbal promise is one you did not sign, and in court it counts if somebody heard it.","口头承诺是没签字的那种,在法庭上只要有人听见,就算数。"]]},{"t":"Sounds and Letters","s":[["A syllable is one beat, and every word has at least one.","一个音节是一拍,每个词至少有一拍。"],["A phoneme is the smallest sound that changes the meaning, and English has about forty four of them.","音位是能改变意思的最小声音,英语里大约有四十四个。"],["A vowel is open and a consonant closes it off, and the difference is only where the tongue is.","元音是开的,辅音把它堵住,区别只在于舌头在哪儿。"],["The alphabet came from the Phoenicians, and the logogram never left China.","字母表来自腓尼基人,而表意符号在中国一直没走。"],["Your vocabulary is all the words you can use, and a dictionary is all the words somebody else could.","词汇量是你能用的词,而词典是别人能用的全部词。"],["An idiom m
