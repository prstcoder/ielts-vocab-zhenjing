","你没地图就漫游，没理由也逗留。"],["A tired child lags behind, and a strong one climbs ahead.","累的孩子落在后头，壮的孩子往上爬。"],["You pull a door and drag a bag, and both are harder than they look.","你拉门，拖包，两样都比看着费劲。"],["You bend at the knee and bow at the waist.","你在膝盖那儿弯，在腰那儿鞠躬。"]]}],"10":[{"t":"Stuff and Things","s":[["Stuff is anything you cannot name, and an item is one thing on a list.","东西是你叫不出名字的那些，一项是清单上的那一个。"],["Merchandise is stock with a price on it, and a souvenir is a thing you carry home.","商品是标了价的存货，纪念品是你带回家的那个玩意儿。"],["An artefact is what a hand made, and a souvenir is what a shop sold.","手工艺品是手做出来的，纪念品是店里卖出去的。"]]},{"t":"Raw Material","s":[["Raw wool goes to a mill, and the material that comes back is cloth.","生羊毛送进纺织厂，出来的材料就是布。"],["Crude oil is thick and black, and a barrel of it is worth a day of wages.","原油又稠又黑，一桶能换一天的工钱。"]]},{"t":"What You Need","s":[["A necessity is what you cannot do without, and a kit is what you carry it in.","必需品是你少不了的东西，一套工具是装它的那个包。"],["An outfit is what you wear, and a utensil is what you eat with.","一套衣服是你穿在身上的，一件用具是你拿来吃饭的。"]]},{"t":"What You Throw Away","s":[["Garbage and rubbish and trash are the same thing in three countries.","垃圾、废物、破烂，在三个国家里说的是同一样东西。"],["You recycle a bottle and reuse a jar, and both take less oil than making new.","瓶子回收，罐子再用，两样都比重新做省油。"],["Litter is what falls from a pocket, and waste is what a factory cannot sell.","零星垃圾是从口袋里掉出来的，废料是工厂卖不掉的那部分。"],["Junk is a chair with one leg, and it goes to the landfill with everything else.","废旧杂物就是缺一条腿的椅子，它和别的破烂一起进垃圾填埋场。"],["Sewerage runs under the street and carries the waste of a whole city.","下水道从街底下走，把一整座城的污水带走。"]]},{"t":"Water In, Water Out","s":[["Detergent cuts grease, and soap does the same job more slowly.","洗涤剂能去油，肥皂干同样的活，只是慢一点。"],["Lotion goes on the skin, shampoo goes on the hair, and both smell of the same factory.","乳液涂在皮肤上，洗发水用在头发上，两样闻着都像出自同一家厂。"],["A tub holds the water, and a plug decides whether it stays.","浴缸装着水，塞子决定这水留不留得住。"],["A tap lets the water in, a pipe carries it, and a tube takes it away.","水龙头把水放进来，水管把它送过去，一根细管把它排走。"]]},{"t":"Cleaning Up","s":[["A broom sweeps a dry floor, and a mop washes a wet one.","扫帚扫干的地面，拖把洗湿的那一块。"],["You sweep the dust out of a corner and mop what is left.","你把灰从角落里扫出去，剩下的再拖一遍。"]]},{"t":"What You Sleep On","s":[["A mattress is the soft part, and a sheet is what you wash.","床垫是软的那一层，床单是你拿去洗的那一件。"],["A blanket keeps you warm, and a quilt is a blanket with a pattern.","毯子让你暖和，被子是带花纹的毯子。"],["A pillow is for the head, and a cushion is for the back.","枕头是给头的，靠垫是给背的。"],["A carpet covers a room, a rug covers a corner, and a mat covers the step.","地毯盖住一间屋，小地毯盖住一个角，门垫盖住一级台阶。"],["A pad goes under a chair, and a sponge goes in the bath.","垫子垫在椅子底下，海绵放在浴缸边上。"],["A towel dries you, and a sponge does the same job wet.","毛巾把你擦干，海绵湿着干同样的活。"]]},{"t":"Small Hard Things","s":[["A staple holds paper, a nail holds wood, and a razor takes hair off.","订书钉夹住纸，钉子钉住木头，剃刀把毛去掉。"],["You shave with a razor and cut yourself about once a month.","你用剃刀刮脸，大概一个月割破自己一次。"],["A fuse burns out before the cable does, and the cord survives.","保险丝在电缆之前烧断，电线就保住了。"],["One strand of a cord holds nothing, and a hundred hold a bridge.","一股线什么也吊不住，一百股能吊起一座桥。"],["A match lights a candle, and the wax keeps it burning.","一根火柴点着蜡烛，蜡让它一直烧下去。"]]},{"t":"Paper","s":[["A portfolio holds your work, and a paperback fits in a pocket.","作品集装你的活儿，平装书塞得进口袋。"],["A pamphlet has eight pages, and a paperback has two hundred.","小册子八页，平装书两百页。"],["A tissue is thin paper for the face, and a cover is thick paper for a book.","纸巾是擦脸用的薄纸，封面是包书用的厚纸。"]]},{"t":"The Office Desk","s":[["A Xerox makes a duplicate, and a duplicate is never quite as good.","复印机印出一份复制件，复制件总归差一点。"],["A memorandum is short, and stationery is what you write it on.","备忘录很短，文具就是你写它用的那些东西。"],["Glue holds the paper, ink marks it, and a rubber takes the ink away.","胶水粘住纸，墨水在纸上留字，橡皮把字擦掉。"],["Scissors cut a straight line, and a shear cuts a whole fleece.","剪刀剪一条直线，大剪刀一次剪下一整张羊毛。"]]},{"t":"Parts of a Whole","s":[["An edge is where a thing stops, and a rim is the edge of a round thing.","边是一个东西到头的地方，边沿是圆东西的那个边。"],["An element is one part of a whole, and a factor is one cause of a result.","要素是整体里的一部分，因素是结果的一个原因。"],["A section is a part you can cut out, and a tag is a label you tie on.","一部分是能切下来的那截，标签是你系上去的那张纸。"],["A badge is a small label that makes a large claim.","一枚徽章是一张小标签，说的是一个大话。"]]},{"t":"Door and Window","s":[["A bolt locks a door, and a knob opens it.","门闩把门锁上，门把手把门打开。"],["A handle is for pulling, and a shutter keeps the light out.","把手是用来拉的，百叶窗把光挡在外头。"],["A curtain hangs inside, and a pane of glass sits in the frame.","窗帘挂在里面，一块窗玻璃嵌在框子里。"],["Opacity is how much light a thing stops, and a curtain has plenty.","不透明度是一个东西挡掉多少光，窗帘挡得可不少。"]]},{"t":"What Holds Things","s":[["A jar holds jam, a barrel holds oil, and a bucket holds water.","罐子装果酱，木桶装油，桶装水。"],["A pail is a bucket with a handle, and it holds the same amount.","提桶就是带把手的桶，装的一样多。"]]},{"t":"Light and Sound","s":[["A phone rings in a pocket, and a bell rings in a tower.","电话在口袋里响，钟在塔上响。"],["A camera keeps what it sees, and a phone forgets nothing either.","相机把它看见的留下来，电话其实也什么都没忘。"],["A portable lamp goes where a wire cannot, and a lantern does the same for a tent.","能带走的灯去电线到不了的地方，灯笼在帐篷里干同样的事。"],["A spotlight points at one face, and a bulb lights the whole room.","聚光灯只照一张脸，灯泡照亮整间屋。"],["A flashlight has one bulb, and when it goes you are in the dark.","手电筒只有一个灯泡，它一坏你就在黑里。"]]},{"t":"The Kitchen","s":[["A refrigerator keeps food cold for a week, and a fridge does it in a smaller box.","冰箱能让食物冷一整个礼拜，小冰箱用一个小点的箱子做同一件事。"],["A vacuum takes the dust off a floor, and a fan moves air around a room.","吸尘器把地上的灰吸走，风扇让空气在屋里转。"],["A switch turns a fan on, and a fuse turns it off.","开关把风扇打开，保险丝把它关掉。"]]},{"t":"Around the House","s":[["A fence keeps a dog in, and a hurdle keeps a horse out of the wrong field.","篱笆把狗圈住，栅栏让马进不了不该进的田。"],["A pedal turns a wheel, and a shelf holds what you cannot reach.","踏板转动轮子，架子放你够不着的东西。"],["A ladder goes up a wall, and a lift goes up a building.","梯子沿着一堵墙往上，电梯沿着一栋楼往上。"],["A stool has no back, and a drawer has no front.","凳子没有靠背，抽屉没有正面。"],["An umbrella is for rain you can see coming, and a raincoat is for the rest.","雨伞是给看得见的雨用的，雨衣是给剩下的那种雨用的。"]]},{"t":"Metal","s":[["A dredge lifts mud from a river, and a mine lifts ore from a hill.","挖泥船从河里挖泥，矿从山里挖矿石。"],["A can is thin metal with a tin coat, and it keeps food for a year.","罐头是薄金属外面镀一层锡，能把食物存一年。"],["A mill rolls hot metal into sheet, and a forge hammers it into shape.","轧机把热金属轧成板，锻炉把它锤成形状。"],["An alloy is two metals mixed, and steel is iron with carbon in it.","合金是两种金属混在一起，钢就是含碳的铁。"],["Lead is heavy and soft, and brass is copper with zinc in it.","铅又重又软，黄铜是加了锌的铜。"],["Bronze came before iron in the story of tools.","在工具的历史上，青铜比铁早。"]]},{"t":"Building and Cloth","s":[["Cement sets under water, and lime sets in the air.","水泥在水下也能凝固，石灰靠空气凝固。"],["Plaster covers a wall, and leather covers a foot.","灰泥抹在墙上，皮革包在脚上。"],["Plastic is cheap, and a plastic fibre lasts for centuries.","塑料便宜，一根塑料纤维能撑几百年。"],["A fabric is woven or knitted, and a knit stretches where a weave does not.","布料是织出来或编出来的，针织的会伸，梭织的不会。"],["Canvas is heavy cotton, and linen is a cooler one.","帆布是厚棉，亚麻是凉一点的那种。"],["Nylon dries fast, and cotton takes a day in the sun.","尼龙干得快，棉布得晒一天。"]]},{"t":"Wood and Fuel","s":[["Lumber is wood cut to size, and a wooden box is what it becomes.","木材是切好尺寸的木料，木箱子就是它的成品。"],["A mine goes sideways into a hill, and a pit goes straight down.","矿井横着打进山里，坑是直着往下挖。"],["Fuel burns in the engine, and oil lubricates what the fuel moves.","燃料在发动机里烧，机油给燃料推动的那些零件上油。"]]},{"t":"Good and Bad Copies","s":[["A diamond is hard and clear, and a crystal is neither.","钻石又硬又透，水晶两样都不是。"],["Inferior steel bends, and a counterfeit watch stops within a year.","劣质钢材会弯，仿冒的表一年之内就停。"],["A fake diamond costs a tenth and fools nobody twice.","假钻石只值十分之一，也骗不了人第二次。"],["A fragile thing travels in a box, and a durable one travels in a bag.","易碎的东西装箱走，耐用的东西装袋走。"],["A miniature is small, and it is available in every museum shop.","缩微模型很小，每家博物馆的商店里都买得到。"],["A thing is available when you can have it today, and durable ten years later.","一个东西今天能拿到，就叫有货；十年后还能用，就叫耐用。"]]}],"11":[{"t":"This Year's Shape","s":[["Fashion is what everyone wears this year, and style is what one person wears for ten.","时尚是今年大家都穿的，风格是一个人穿了十年的。"],["A trend is a direction, and a tendency is a habit that pulls the same way.","趋势是一个方向，倾向是往同一个方向使劲的习惯。"],["Popularity rises fast and falls faster, and a vogue lasts one season.","流行起来得快，落得更快，一阵风只刮一季。"],["Good sense prevails in the end, but fashion rarely waits for it.","明白道理最后总会占上风，可时尚很少等它。"]]},{"t":"Who They Copy","s":[["A model wears what a designer made, and an icon wears what she chose.","模特穿设计师做的那件，偶像穿自己挑的那件。"],["An idol is a model a crowd copies, and nobody asks what it costs.","偶像是大家都照着学的那个样板，没人问这要花多少钱。"]]},{"t":"What Costs Money","s":[["A luxury is something you want and do not need, and an extravagant one costs a month.","奢侈品是你想要又用不上的东西，奢侈到极致的那件要花一个月的钱。"],["Jewellery is the box, and a jewel is the thing inside it.","首饰是那个盒子，宝石是里面那颗东西。"],["A gem is cut to sparkle, and jade is polished to look soft.","宝石切出来是为了闪，玉磨出来是为了看着温润。"],["You adorn a coat with a pin and an ornament with a stone.","你给一件外套别上一枚别针，给一件饰物镶上一颗石头。"],["They embroider a plain cloth and embellish it with flowers.","他们在一块素布上绣花，再拿花把它装点起来。"]]},{"t":"Hair and Disguise","s":[["Hairdressing is a trade, and a dye is a bottle of colour.","美发是一门手艺，染剂是一瓶颜色。"],["A pigment sits on the surface, and a dye goes into the fibre.","颜料停在表面，染料钻进纤维里。"],["A masquerade needs a mask, and a costume needs a reason.","化装舞会要一张面具，一身戏服要一个理由。"],["A veil hides a face, and a costume hides a person.","面纱挡住一张脸，戏服挡住一个人。"],["A magician can fascinate a room, and a costume can do the same.","魔术师能让一屋子人着迷，一身衣裳也能。"]]},{"t":"A Good Look","s":[["A decent coat keeps you warm, and an exquisite one keeps you quiet.","一件像样的外套让你暖和，一件精致的外套让你安静。"],["Grace is how a body moves, and elegance is how a room is arranged.","优雅是身子怎么动，雅致是一间屋怎么摆。"],["A perfect appearance costs an hour every morning and is forgotten by noon.","一副完美的外表每天早上花一个小时，到中午就没人记得。"],["Cosmetics are bought in a shop, and make-up changes an appearance in ten minutes.","化妆品是在店里买的，妆在十分钟里换掉一张脸。"],["A handsome face is regular, and a charming one is not.","好看的脸是端正的，迷人的脸不是。"],["A pretty dress is not a beautiful face, and an ugly one is nobody's fault.","一条好看的裙子不等于一张美的脸，长得不好看也不是谁的错。"]]},{"t":"What You Wear","s":[["You dress in the morning and clothe a child in the same five minutes.","你早上穿衣服，顺便用那五分钟给孩子也穿上。"],["A uniform saves a decision, and a garment saves an argument.","制服省掉一个决定，一件成衣省掉一场争论。"],["Laundry is a pile, and a wardrobe is where the clean half goes.","待洗的衣服是一堆，衣柜是干净那一半去的地方。"],["An overall keeps the paint off, and an overcoat keeps the wind out.","工作服把油漆挡在外头，大衣把风挡在外头。"],["A robe is for the house, and a gown is for an evening.","长袍是家里穿的，礼服是晚上穿的。"],["A sweater goes over the head, and a jacket goes over the shoulders.","毛衣从头上套下去，外套从肩上披上去。"],["A skirt swings, trousers divide, and jeans go with everything.","裙子会摆，裤子把腿分开，牛仔裤什么都配得上。"]]},{"t":"Pockets and Hands","s":[["A clasp holds a cloak, and a button holds a coat.","扣钩扣住斗篷，纽扣扣住外套。"],["A glove fits a hand, a hat fits a head, and a cap fits a team.","手套合一只手，帽子合一个头，队帽合一支队。"],["A brim shades the eyes, and a scarf warms the neck.","帽檐给眼睛遮光，围巾给脖子保暖。"],["A handkerchief goes in a pocket, a purse in a hand, and a wallet in a coat.","手帕放口袋，钱包握在手里，皮夹放在外套里。"],["A vest has no sleeves, and a wrap has no shape.","背心没有袖子，披肩没有形状。"],["A cloak covers everything, and a collar covers the neck.","斗篷把什么都盖住，领子只盖住脖子。"],["A sleeve ends at the wrist, a sock at the ankle, and a stocking at the knee.","袖子到手腕为止，短袜到脚踝为止，长袜到膝盖为止。"],["A slipper is for indoors, a boot for the snow, and a lace ties both.","拖鞋在屋里穿，靴子在雪里穿，鞋带两样都系。"]]},{"t":"Needle and Thread","s":[["A tailor sews by hand, and a factory sews by the thousand.","裁缝用手缝，工厂一缝就是几千件。"],["You spin wool into thread and push it through a needle.","你把羊毛纺成线，再把线穿过针眼。"],["A stitch holds two pieces, and a pin holds them until you sew.","一针把两片布连住，别针在缝好之前把它们别住。"],["A string is thin, a strap is wide, and both hold something up.","细绳是细的，带子是宽的，两样都是把什么吊住。"],["A stripe is printed on, and a ribbon is tied on.","条纹是印上去的，缎带是系上去的。"],["A belt holds trousers, a chain holds a watch, and a bracelet holds nothing.","腰带系裤子，链子挂表，手镯什么也不挂。"],["A necklace is a chain with one bead worth more than the rest.","项链是一条链子，上面有一颗珠子比别处都值钱。"]]},{"t":"Cloth","s":[["A textile is any cloth made from fibre, and velvet is the softest one.","织物是任何用纤维做的布，天鹅绒是最软的那种。"],["Wool comes off a sheep, and a patch covers the hole it made.","羊毛从羊身上剪下来，一块补丁盖住它磨出的洞。"],["A rag is a shirt that has given up, and a shabby coat is one that has not.","破布是一件认输的衬衫，褴褛的外套是还没认输的那种。"],["A tight fit looks sharp and feels wrong, and a shabby one feels right.","紧衣服看着利落、穿着难受，破衣服穿着倒是舒服。"]]},{"t":"Colour","s":[["A white wall throws the light back, and colour is what it throws.","白墙把光反回来，颜色就是它反出来的那样东西。"],["Yellow fades first, and brown is what yellow becomes.","黄色最先褪，棕色就是黄褪成的那样。"],["Grey is a colour with the life taken out, and tan is a summer brown.","灰色是被抽掉了生气的颜色，棕褐是夏天的棕。"],["Pink and purple sit next to red on a wheel nobody uses.","粉和紫在色轮上挨着红，可没人真去用那个轮子。"],["One stain ruins a shirt, and one blot ruins a page.","一处污渍毁一件衬衫，一个墨点毁一页纸。"]]},{"t":"The Shape of a Person","s":[["A slender figure looks taller in a long coat, and a slight one looks younger.","修长的身形穿长大衣显高，瘦小的身形看着年轻。"]]}],"12":[{"t":"What You Eat","s":[["Food is what you eat, and a diet is what you eat every week.","食物是你吃的东西，饮食是你每个礼拜吃的东西。"],["Appetite is wanting it, and hunger is needing it.","食欲是你想吃，饿是你需要吃。"],["You treat a guest to dinner, and you cater for a wedding.","你请客人吃一顿饭，你给一场婚礼承办酒席。"],["A provision is bought ahead of time, and an edible one keeps a month.","储备粮是提前买好的，能吃的那种能放一个月。"],["A recipe tells you what to buy, and the oven tells you when it is done.","菜谱告诉你要买什么，烤箱告诉你什么时候熟了。"]]},{"t":"Where You Eat","s":[["A restaurant takes your order, and a refectory takes your tray.","餐馆记下你点的菜，食堂收走你的托盘。"],["A cafeteria is cheap and loud, and a buffet lets you choose twice.","自助餐厅便宜又吵，自助餐让你挑两回。"],["A barbecue is cooked outdoors, and a banquet is eaten indoors.","烧烤在屋外做，宴席在屋里吃。"],["Supper is the last meal, and a snack is not a meal at all.","晚饭是最后一顿，点心根本不算一顿。"],["A refreshment stops the talking for a minute, and an appetiser starts it.","茶点让谈话停一分钟，开胃菜让谈话开始。"],["A cuisine belongs to a country, and a menu belongs to a kitchen.","菜系属于一个国家，菜单属于一个厨房。"],["A takeaway comes in a box, and a chef comes out to say hello.","外卖装在盒子里来，厨师走出来打个招呼。"],["A gourmet eats little and talks much, and a vegetarian eats no meat.","美食家吃得少说得多，素食者不吃肉。"]]},{"t":"On the Table","s":[["Cutlery is the metal kind, and silver is the expensive one.","餐具说的是金属那一套，银器是贵的那一种。"],["Ceramic is baked clay, and porcelain is the thin white kind.","陶瓷是烧过的黏土，瓷器是薄而白的那种。"],["A bowl holds soup, a dish holds a roast, and a saucer holds a cup.","碗装汤，盘子装烤肉，茶碟托着杯子。"],["A tray carries six plates, and a fork carries one pea.","托盘端六个盘子，叉子叉一颗豌豆。"],["A knife cuts, a spoon lifts, and a glass holds what you drink.","刀切，勺舀，玻璃杯装你喝的东西。"],["A mug has a handle and holds twice what a glass does.","马克杯有个把手，装的是玻璃杯的两倍。"]]},{"t":"On the Fire","s":[["A kettle boils water, and a pan fries an egg.","水壶烧水，平底锅煎蛋。"],["A pot is deep and a pan is shallow, and both sit on the stove.","锅深，平底锅浅，两样都坐在炉子上。"],["A furnace heats a house, and an oven bakes a loaf.","炉子给房子供暖，烤箱烤一条面包。"],["A tin keeps the biscuits dry, and a lid keeps the tin shut.","铁盒让饼干保持干燥，盖子让铁盒盖得住。"]]},{"t":"What You Drink","s":[["A drink is any liquid, and a beverage is the same word on a menu.","饮料是任何液体，菜单上的饮品说的是同一样东西。"],["Juice comes from fruit, and soda comes from a factory.","果汁从水果里来，汽水从工厂里来。"],["Coffee wakes you up, and alcohol puts you down.","咖啡把你叫醒，酒把你放倒。"],["Liquor is strong, whisky is brown, and brandy is older than both.","烈酒是烈的，威士忌是棕的，白兰地比两样都老。"],["A drunk man repeats himself, and a sober one remembers for him.","喝醉的人反复说同一句，清醒的人替他记着。"],["Tobacco is smoked, and a cigarette is one of them.","烟草是拿来抽的，香烟是其中一支。"]]},{"t":"From the Garden","s":[["A vegetable grows in a row, and a tomato is a fruit that pretends.","蔬菜是一行一行种出来的，西红柿是假装成蔬菜的水果。"],["A potato lives underground, a pea lives in a pod, and a bean lives in another.","土豆长在地下，豌豆住在豆荚里，豆子住在另一个荚里。"],["A cucumber is cool, a cabbage is tight, and an onion makes you cry.","黄瓜是凉的，卷心菜是紧的，洋葱让你流泪。"],["A mushroom is not a plant, and an eggplant is not an egg.","蘑菇不是植物，茄子也不是蛋。"],["A carrot is orange, a turnip is white, and a radish is both.","胡萝卜是橙的，萝卜是白的，小萝卜两样都是。"],["You peel a potato, strip a leaf, and hull a berry.","你给土豆削皮，把叶子撸下来，给浆果去蒂。"]]},{"t":"From the Tree","s":[["A cherry has a stone, a berry has seeds, and a grape has both.","樱桃有核，浆果有籽，葡萄两样都有。"],["A papaya grows in the tropics, and a peach grows on a wall.","木瓜长在热带，桃子长在墙边。"],["A pear is soft at the neck, and a plum is soft all over.","梨是脖颈那儿软，李子全身都软。"],["An orange is peeled, a melon is cut, and a lemon is squeezed.","橙子剥皮，甜瓜切开，柠檬挤汁。"],["A kiwi is brown outside, green inside, and dearer than an orange.","猕猴桃外面棕、里面绿，还比橙子贵。"]]},{"t":"From the Field","s":[["A crop is what a field gives once a year, and corn is one kind.","庄稼是一块地一年交出来的东西，玉米是其中一种。"],["Grain is the seed, and wheat is the grain bread is made of.","谷物是种子，小麦是做面包用的那种谷物。"],["You reap in August and grind in September.","你八月收割，九月磨面。"],["Flour is ground wheat, and porridge is boiled grain.","面粉是磨碎的小麦，粥是煮开的谷物。"],["A paste is flour and water, and it holds a pie together.","面糊是面粉加水，它把一个派粘在一起。"]]},{"t":"From the Farm","s":[["Livestock is what a farm keeps, and a chicken is the easiest of it.","牲畜是农场养的东西，鸡是其中最省事的。"],["Turkey is for a feast, beef is for a Sunday, and pork is for breakfast.","火鸡是过节吃的，牛肉是礼拜天吃的，猪肉是早饭吃的。"],["Mutton is old sheep, and a sausage is what is left after the good cuts.","羊肉是老羊的肉，香肠是好肉切走之后剩下的那部分。"],["A fish comes from a pond or a river, and a rod brings it in.","鱼从池塘或河里来，一根钓竿把它弄上来。"]]},{"t":"From the Cow","s":[["Dairy is everything a cow gives, and milk is the first of it.","奶制品是牛身上出的所有东西，牛奶是其中第一样。"],["Yogurt is milk with a culture in it, and cream is milk with the water taken out.","酸奶是加了菌的牛奶，奶油是抽掉水的牛奶。"],["Cheese keeps for a year, and butter keeps for a month.","奶酪能放一年，黄油能放一个月。"]]},{"t":"A Plate of Something","s":[["A salad is cold, a sandwich is closed, and a hamburger is both with meat.","沙拉是凉的，三明治是合上的，汉堡是两样加肉。"],["A loaf is sliced, a pie is cut, and a pizza is pulled apart.","面包切片，派切块，比萨用手撕开。"],["Pasta is made from flour and water, and spaghetti is one shape of it.","意大利面是面粉加水做的，细长面条是它的一种形状。"],["Soup is eaten with a spoon, and pudding with a smaller one.","汤用勺子喝，布丁用更小的一把。"]]},{"t":"Sweet and Sharp","s":[["A biscuit is dry, a cake is not, and jam makes a biscuit worth eating.","饼干是干的，蛋糕不是，果酱让饼干值得一吃。"],["A nut is hard outside, and a chocolate is soft inside.","坚果外面硬，巧克力里面软。"],["Ice cream melts, and vanilla is the safest flavour to order.","冰淇淋会化，香草是最保险的口味。"],["Mustard is sharp, wasabi is sharper, and pepper is quiet until you grind it.","芥末冲，山葵更冲，胡椒在磨之前很安静。"],["Ginger is hot, garlic is stronger, and a scallion is green on top.","姜是热的，蒜更冲，葱上面是绿的。"],["Vinegar is sour, salt is not, and sugar hides in everything.","醋是酸的，盐不是，糖藏在所有东西里。"],["Candy is sugar with colour, and honey is sugar with a bee in it.","糖果是加了颜色的糖，蜂蜜是蜜蜂做的糖。"]]},{"t":"How It Tastes","s":[["Flavour is what the tongue reports, and sour and sweet are the first two.","味道是舌头报告的东西，酸和甜是最早的两样。"],["Bitter is the taste of medicine, and spicy is the taste of pain.","苦是药的味道，辣是疼的味道。"],["A delicious meal is remembered for years, and a tasty one for a day.","一顿美味的饭能被记好几年，一顿只是好吃的饭记一天。"],["A yummy cake is one a child finishes, and a tasty one is one he asks for again.","一块好吃的蛋糕是孩子能吃完的，一块香的蛋糕是孩子还要的。"],["Hunger comes at noon, and a thirsty man drinks before he eats.","饿是中午来的，渴的人先喝再吃。"],["A spice is a seed or a bark, and a sauce is spice plus liquid.","香料是一颗籽或一块树皮，酱汁是香料加液体。"],["Ketchup is sweet tomato sauce, and perfume is a sauce nobody eats.","番茄酱是甜的番茄汁，香水是没人吃的酱。"]]},{"t":"In the Kitchen","s":[["An ingredient is one of the things in a dish, and a supplement is added after.","一种配料是菜里的一个东西，补充剂是后来才加的。"],["You cook a meal and digest it, and the second takes longer.","你做一顿饭，再把它消化掉，第二件事花的时间更长。"],["You bake bread, fry an egg, and roast a bird.","你烤面包，煎鸡蛋，烤一只鸡。"],["You toast bread until it is brown, and you slice it before that.","你把面包烤到发棕，在那之前先切片。"],["You suck a sweet, lick a spoon, and chew a piece of gum.","你含一颗糖，舔一下勺子，嚼一块口香糖。"],["You soak a bean, dip bread in soup, and squeeze a lemon.","你把豆子泡上，把面包蘸进汤里，把柠檬挤一下。"],["You stir a pot and grind pepper, and both take longer than they should.","你搅一搅锅，磨一点胡椒，两样都比该花的久。"]]}],"13":[{"t":"Raising a Building","s":[["Architecture is the plan drawn first, and an erection is the frame going up.","建筑是先画出来的那张图，竖起来的是那个架子。"],["A structure holds a load, and you construct it from the ground up.","结构要承住重量，你从地面一层层把它建起来。"],["A structure can obstruct a road, and a plan must answer for it.","一座建筑能把路堵住，图纸得为这件事负责。"],["You establish a rule, build a house, and found a city.","你定下一条规矩，盖一栋房子，建起一座城。"]]},{"t":"Concrete and Steel","s":[["Concrete takes any shape, and steel takes the weight.","混凝土能做成任何形状，钢来承担重量。"],["Concrete and steel give a tower its stability, and a bad plan takes it away.","混凝土和钢给一座塔稳定，一个坏设计把它拿走。"]]},{"t":"Where It Stands","s":[["A site is the ground, and a venue is the ground with a purpose.","场地是那块地，会场是那块地加一个用途。"],["A landmark is seen from a distance and located on every map.","地标从远处就看得见，每张地图上都标着它。"],["The house is situated on a hill, and a site on a hill costs more.","这房子坐落在一座小山上，山上的地皮也更贵。"]]},{"t":"Who Lives There","s":[["You reside in a house and inhabit a country, and both are formal words.","你居住在一栋房子里，栖居在一个国家里，两个都是书面词。"],["Birds migrate in October, and people settle where the water is.","鸟十月迁徙，人在有水的地方定居下来。"]]},{"t":"Kinds of Home","s":[["A dwelling is any place you live, from a hut to a skyscraper.","住所是你住的任何地方，从一间小屋到一栋摩天楼。"],["A villa has a garden, and a mansion has a staff.","别墅有个花园，豪宅有一班仆人。"],["An apartment is one floor, and a hostel is one bed.","公寓是一层楼，青年旅舍是一张床。"],["A lodge is for a season, and a cabin is for a weekend.","小屋是住一季的，木屋是过一个周末的。"]]},{"t":"Smaller Rooms","s":[["A cellar is under the house, and a shed is behind it.","地窖在房子底下，棚子在房子后头。"],["A cottage is small and old, and a shelter is anything with a roof.","村舍又小又旧，遮蔽处是任何有顶的地方。"],["A nursery is a room for a child, and a cradle is a bed for one.","育婴室是给孩子的房间，摇篮是给孩子的床。"]]},{"t":"Streets and Passages","s":[["A block is a square of buildings, and a grid is the streets between them.","街区是一方建筑，路网是它们之间的那些街。"],["An aisle runs between the seats, and a corridor runs between the rooms.","过道在座位之间，走廊在房间之间。"],["A porch is outside the door, and a corridor is inside it.","门廊在门外面，走廊在门里面。"]]},{"t":"Up and Down","s":[["A stair is one step, and a staircase is all of them.","一级是踏步，楼梯是所有的踏步。"],["A storey is one floor, and a layer of brick makes one.","一层是一层楼，一层砖就把它砌出来。"],["An elevator lifts, an escalator carries you up slowly, and a handrail keeps you upright.","电梯往上升，扶梯慢慢把人送上去，扶手让你站得住。"]]},{"t":"Pillars and Arches","s":[["A pillar holds a roof, and a column holds it in a nicer way.","柱子撑住屋顶，圆柱撑得更体面一点。"],["A beam lies across, and an arch carries the weight around a gap.","横梁横着架过去，拱把重量绕着空当送走。"],["A vault is an arch with a room behind it.","拱顶就是后面带一个房间的拱。"]]},{"t":"Roof and Chimney","s":[["The ceiling is above you, the eaves are outside, and the chimney goes through both.","天花板在你头上，屋檐在屋外，烟囱从两样中间穿过去。"]]},{"t":"The Front Room","s":[["Reception is a desk, and a lobby is the space in front of it.","前台是一张桌子，大堂是桌子前面那块地方。"],["A bench seats three, and a parlour seats a family.","长凳坐三个人，客厅坐一家人。"],["A fireplace burns wood, and a radiator burns nothing at all.","壁炉烧木头，暖气片什么也不烧。"],["A living room has a sofa, and a cabinet hides the mess.","客厅里有沙发，柜子把乱的东西藏起来。"],["A balcony hangs off a wall, and a parlour sits behind one.","阳台从墙上挂出去，客厅在墙里面。"]]},{"t":"Water and Kitchen","s":[["A kitchen has a stove, and a lavatory has a basin.","厨房有炉灶，厕所有一个洗手盆。"],["A toilet is the fixture, and the room around it is the lavatory.","马桶是那个器具，围着它的房间叫厕所。"],["A bath is for soaking, and a basin is for washing your face.","浴缸是泡的，盆是洗脸的。"]]},{"t":"Shops and Public Places","s":[["A store sells one kind of thing, and a supermarket sells all of them.","商店卖一类东西，超市什么种类的都卖。"],["A mall is many stores under one roof, and a booth is one counter.","商场是一个屋顶下很多店，摊位是一个柜台。"],["A casino has no clocks, and a studio has no windows.","赌场不挂钟，摄影棚不开窗。"],["A reserve is a site kept empty on purpose.","保护区是一块故意空着的地。"]]},{"t":"Town and Edge","s":[["Downtown is where the offices are, and the urban edge is where the houses start.","市中心是办公楼集中的地方，城市边缘是住宅开始的地方。"],["A peripheral road goes around, and the vicinity is what is near.","外围的路绕着走，附近就是挨得近的那些地方。"]]},{"t":"Space","s":[["A room is a space with walls, and a void is a space with none.","房间是有墙的一块空间，空处是一块没墙的空间。"],["A spacious hall feels generous, and an airtight one feels wrong.","宽敞的厅让人觉得大方，密不透风的厅让人觉得不对。"],["An expanse is a wide open thing, and a plaza is a wide open square.","一片开阔是一片大空地，广场是一块开阔的方形地。"]]},{"t":"Old Walls","s":[["A castle is a house built to be attacked, and a cottage is not.","城堡是照挨打来盖的房子，村舍不是。"],["A carpenter works in wood, and a mason works in stone.","木匠跟木头打交道，石匠跟石头打交道。"],["A tile covers a roof, and brickwork holds a wall together.","瓦盖住屋顶，砖砌把一堵墙连成一体。"]]},{"t":"Lifting and Holding","s":[["A suspension bridge hangs from cables, and a hook holds what is lifted.","悬索桥挂在钢索上，钩子吊住要提起来的东西。"],["A lever multiplies a force, and a scaffold puts a man in the air.","杠杆把力气放大，脚手架把人送到半空。"]]},{"t":"Machines","s":[["Infrastructure is the roads and pipes, and apparatus is the machine that repairs them.","基础设施是那些路和管道，器械是修它们的那台机器。"],["A crane lifts what a man cannot, and a malfunction stops the whole site.","起重机吊人吊不动的东西，一处故障让整个工地停下。"]]},{"t":"Keeping It Working","s":[["You maintain a thing before it breaks and fix it after.","东西坏之前你保养它，坏了之后你修它。"],["You mend a hole, modify a plan, and trim a hedge.","你补一个洞，改一份计划，剪一道树篱。"],["You weld steel, saw wood, screw a shelf to a wall, and drill a hole.","你焊钢，锯木，把架子拧到墙上，再钻一个孔。"],["You plumb a wall before you tile it, and you weld a joint before you test it.","贴砖之前你先吊线看墙正不正，试压之前你先把接口焊好。"]]},{"t":"Bridges and Water","s":[["A viaduct carries a road over a valley, and a span is the gap it crosses.","高架桥把路架过山谷，跨度是它跨过去的那个空当。"],["A dam holds a river back, and a viaduct carries a road over the same valley.","水坝把河拦在后面，高架桥把路架过同一个山谷。"]]},{"t":"Planning Inside","s":[["You install a machine, furnish a room, and settle the placement of every chair.","你装一台机器，给一间屋配家具，把每把椅子的位置定下来。"],["A layout is where things go, and a design is why.","布局是东西放在哪儿，设计是为什么这么放。"]]},{"t":"In and Out","s":[["An entrance is a door, and an entry is the act of going in.","入口是一道门，进入是走进去那个动作。"],["You enter through an entrance and leave by an exit.","你从一个入口进去，从一个出口出来。"],["The exit is not always where the entrance was, and the sign points one way.","出口不总在入口那儿，牌子只指一个方向。"],["The outside is what you see, and the exterior is what the architect drew.","外面是你看见的那样，外观是建筑师画出来的那样。"],["An external wall faces the weather, and an internal one faces a room.","外墙对着天气，内墙对着一个房间。"],["An outward door opens away from you, and an inward one opens toward you.","向外开的门朝你反方向开，向内开的门朝你这边开。"],["The inner room has no window, and the interior of the house stays cool.","里间没有窗，屋子内部一直凉着。"]]}],"14":[{"t":"The Journey","s":[["You navigate by a star, and a voyage is long enough to need one.","你靠一颗星导航，一次远航长得非靠它不可。"],["Aviation made the journey shorter, and travel cheaper for everyone.","航空让旅程短了，也让每个人出门更便宜。"],["A safari is travel with a guide, and a parade is travel with a band.","游猎是带着向导的旅行，游行是带着乐队的行进。"],["A haunted house is an attraction, and a memorial is a place that stops you talking.","闹鬼的房子是个景点，纪念碑是让你停下不说话的地方。"]]},{"t":"Borders","s":[["A pyramid is a tomb shaped like a hill, and a port is a town shaped by ships.","金字塔是一座像山一样的墓，港口是一座被船塑造出来的城。"],["A visa is a stamp of permission, and traffic is the price of a city.","签证是一枚准许的印章，交通是一座城市要付的代价。"]]},{"t":"In the Air","s":[["An airline owns the planes, and an airplane does the flying.","航空公司拥有飞机，飞机负责飞。"],["A helicopter needs no runway, and a jet needs a long one.","直升机不用跑道，喷气机要一条长跑道。"],["A parachute makes a fall look slow, and a flight is a fall you survive.","降落伞让下坠看着慢，一次飞行是你活下来的那次下坠。"],["A pilot sits in front, and a passenger sits behind and complains.","飞行员坐前面，乘客坐后面发牢骚。"]]},{"t":"What You Carry","s":[["Baggage is what you check, and luggage is what you carry.","行李是托运的那些，随身行李是你提着走的那些。"],["A suitcase has a handle, and every luggage tag has a name on it.","行李箱有个提手，每张行李牌上都写着一个名字。"],["A carry-on goes in the rack above your head, and a suitcase goes in the hold.","随身行李放在头顶的架子上，行李箱放进货舱。"],["Freight pays for the trip, and a passenger pays for the seat.","货运替这趟行程买单，乘客为那个座位付钱。"],["A fare is what you pay, and an atlas is a book of maps.","票价是你付的钱，地图册是一本装着地图的书。"]]},{"t":"Lines on a Map","s":[["A route is the line you take, and an itinerary is the plan in writing.","路线是你走的那条线，行程是写下来的那份计划。"],["A passage is narrow, and an intersection is where two ways cross.","通道是窄的，路口是两条路交叉的地方。"],["A way is any direction, and a path is one you can walk.","方向是随便哪个走向，小径是你能走的那一条。"]]},{"t":"The Road Itself","s":[["A lane holds one car, an avenue is lined with trees, and a highway goes around.","车道只容一辆车，大道两旁种着树，公路绕着城走。"],["A curb marks the edge, and a signpost tells you where you are.","路缘标出边界，路标告诉你自己在哪儿。"],["They pave a lane and put a signpost at the end of it.","他们把一条小路铺上硬面，在尽头立一块路牌。"]]},{"t":"On Wheels","s":[["A vehicle carries you, and an auto carries you without a horse.","车辆把你运走，汽车不用马拉就能把你运走。"],["An express stops at nothing, and a tram stops every block.","快车什么都不停，有轨电车每个街区都停。"],["A coach carries forty people, and an ambulance carries one.","长途客车载四十个人，救护车只载一个。"],["A truck is big, a lorry is the same thing, and a van is a truck with windows.","卡车大，货车就是同一个东西，厢式车是带窗的货车。"],["A wagon is pulled, a carriage is pulled by a horse, and a tractor pulls both.","货车是被拖的，马车是被马拖的，拖拉机两样都拖。"],["A cart has two wheels, a pedicab has three, and a cycle has two and no engine.","手推车两个轮子，三轮车三个，自行车两个轮子还没发动机。"],["A garage is a room for a car, and a workshop is a room for a truck.","车库是放小汽车的房间，车间是修卡车的房间。"]]},{"t":"Under the Bonnet","s":[["A motor makes the power, and horsepower is how much of it there is.","发动机产生动力，马力是这动力有多少。"],["A wheel turns, a brake stops it, and a tyre is what touches the road.","轮子转，刹车让它停，轮胎是碰地面的那部分。"]]},{"t":"On Board","s":[["A car honks outside, and the crew looks up from the deck.","外面一辆车按喇叭，船员从甲板上抬起头。"],["A captain gives the order, and a steward brings the tea.","船长下命令，乘务员端茶。"],["An emergency makes everyone quiet, and a steward knows where the door is.","紧急情况让所有人安静，乘务员知道门在哪儿。"]]},{"t":"When It Goes Wrong","s":[["A wreck is what is left, a crash is the moment, and a crush is a crowd.","残骸是剩下的东西，撞车是那一瞬间，挤压是人群干的事。"],["You dash for a train, and it vanishes while you watch.","你冲过去赶一趟车，它就在你眼前消失了。"],["A hazard is what makes a ship disappear, and ice is the oldest one.","危险是让一条船消失的东西，冰是最老的那一种。"],["A harbour is sheltered water, and a dock is where you tie up.","港湾是避风的水面，码头是你把船拴住的地方。"],["A heavy anchor holds the boat, and a submarine can submerge and stay down.","沉重的锚把船固定住，潜艇能沉下去待着。"]]},{"t":"On the Water","s":[["A sailor works a boat, and a seaman is the same man on a form.","水手在船上干活，海员是表格上对同一个人的说法。"],["A carrier carries goods, and a liner carries people who pay.","货船运货，邮轮载付了钱的人。"],["A steamer burns coal, and a vessel is any ship at all.","蒸汽船烧煤，船只就是随便哪条船。"],["A ferry crosses the same water twice a day, and the crew knows every wave.","渡船一天两次过同一片水，船员认得每一道浪。"]]},{"t":"Wind and Oars","s":[["A sail catches the wind, and a raft catches whatever floats.","帆兜住风，木筏兜住任何漂着的东西。"],["A canoe is narrow, and an oar is its engine.","独木舟很窄，一支桨就是它的发动机。"],["A deck is the floor of a boat, and a turbine is the engine under it.","甲板是船的地板，涡轮机是它底下的发动机。"]]},{"t":"Back and Front","s":[["A propeller pushes, a stern is the back, and you embark at the front.","螺旋桨往后推，船尾是后面，你在前面上船。"],["You climb aboard a boat and find a seat on the deck.","你爬上一条船，在甲板上找个位子。"]]},{"t":"Rails and Waterways","s":[["A channel is deep enough for ships, and a ditch is not.","水道深得能过船，沟不行。"],["A canal is a ditch made by hand, with locks at both ends.","运河是人手挖出来的沟，两头都有船闸。"],["A railroad is the track, and a railway is the company that runs it.","铁路是那条轨道，铁路公司是经营它的那家。"],["A locomotive pulls the cars, and a subway runs under the city.","机车拉着车厢，地铁在城市底下跑。"]]},{"t":"Underground and On Time","s":[["An underground line needs a tunnel, and a rail needs a bed of stone.","地下线路要挖隧道，铁轨要一层碎石垫着。"],["A train departs on time, and the delay is announced after it leaves.","火车准点开走，晚点的通知在它开走之后才广播。"]]},{"t":"Late and Soon","s":[["You arrive when the train stops, and your destination is why you came.","车停了你就到了，目的地是你来的原因。"],["A delay costs an hour, and they postpone the rest for a week.","一次延误损失一个小时，剩下的他们往后推一个礼拜。"],["You defer a decision and hope the answer arrives without you.","你把一个决定往后拖，指望答案自己找上来。"],["A lull in the traffic lets you cross, and then it ends.","车流里空出一小会儿，让你过马路，然后就没了。"],["A ticket expires at midnight, and a bill is due at nine.","票到午夜作废，账单九点到期。"],["Postage pays for the journey of a letter, not for the letter.","邮资付的是信走这一趟的钱，不是信本身的钱。"]]},{"t":"Letters and Parcels","s":[["A stamp goes in the corner, and the mail goes in a bag.","邮票贴在角上，邮件装进袋子里。"],["A packet is flat, a package is not, and both need string.","小包是扁的，包裹不是，两样都要绳子。"],["You bind a parcel with tape and hope it holds.","你用胶带把一个包裹缠好，指望它别散。"],["A parcel is a box, and a load is what a truck can hold.","包裹是一个盒子，载荷是一辆卡车能装的东西。"],["A burden is a load that hurts, and a light one is a pleasure.","负担是压得人疼的那份重量，轻的就成了乐事。"],["You transfer a file, and a tower transmits a signal.","你转存一个文件，一座塔发射一个信号。"]]},{"t":"How Fast","s":[["Goods in transit are on their way, and a van delivers them at the door.","在途的货物还在路上，厢式车把它们送到门口。"],["A car can convey you at speed, and a letter cannot.","汽车能快速把你送到，一封信做不到。"],["Speed is how fast, and velocity is how fast in one direction.","速度是多快，速率是朝一个方向有多快。"],["A swift horse and a swift reply have the same speed.","一匹快马和一个快回复，快的是同一样东西。"]]}],"15":[{"t":"How a Country Is Run","s":[["A republic has a president, and a kingdom has a crown.","共和国有总统，王国有一顶王冠。"],["Socialism runs the factory for the town, and communism runs it for everyone.","社会主义替这座城管工厂，共产主义替所有人管。"],["Marxism is the book, and the regime is what was built on it.","马克思主义是那本书，政权是照着它建起来的东西。"],["A government holds authority, and a political party wants it.","政府手里有权，一个政党想要这份权。"],["A hierarchy puts one office above another, and a democracy puts a vote above both.","等级制把一个职位放在另一个上面，民主把一张选票放在两者之上。"]]},{"t":"Changing It","s":[["A bureaucracy loves a form, and an egalitarian hates one.","官僚机构爱表格，平等主义者恨表格。"],["A revolution changes the owners, and materialism stays exactly the same.","革命换掉的是主人，物质主义一点没变。"],["A reform changes a rule, and a process changes a habit.","改革改的是一条规矩，过程改的是一个习惯。"],["A conservative keeps what works, and a meltdown takes it away.","保守派保住还能用的东西，一场崩盘把它拿走。"],["A municipal council fixes the drains, and a neutral country fixes nothing.","市政委员会修下水道，中立国什么也不修。"]]},{"t":"In the Chamber","s":[["A bilateral deal needs two signatures, and an arena needs a crowd.","双边协议要两个签名，竞技场要一群人。"],["A flag is cloth with a meaning, and a banner is cloth with a slogan.","国旗是有含义的布，横幅是写着口号的布。"],["A president leads a republic, and a premier leads a government.","总统领导一个共和国，总理领导一个政府。"],["A minister runs a department, and a secretary writes down what was decided.","部长管一个部门，秘书把决定了的事写下来。"],["A parliament argues, and a senate cools it down.","议会吵，参议院把它晾凉。"]]},{"t":"Meetings","s":[["A conference is a week, and a meeting is an hour.","大会是一个礼拜，会议是一个小时。"],["Headquarters is where the decisions are made, and a delegation is who goes to hear them.","总部是作决定的地方，代表团是去听决定的那几个人。"],["A lawyer speaks on behalf of a client, and the police speak for nobody.","律师替当事人说话，警察不替谁说话。"],["A statesman thinks in decades, and a mayor thinks in drains.","政治家按十年想事，市长按下水道想事。"],["A service is what a public office does for the town.","一项服务就是一个公共部门替这座城做的事。"]]},{"t":"The Office","s":[["A bureau is a desk and an office, and a department is a floor of them.","局是一张桌子和一间办公室，部门是装满这些的一层楼。"],["An administration runs the country for four years, and the civil service stays.","一届政府管这个国家四年，公务员留下来。"],["A big country can dominate a small one, and power is why.","大国能压住小国，靠的就是实力。"],["Influence persuades and power compels, and the second is cheaper.","影响力靠说服，权力靠强迫，后一样更省钱。"],["A tax can affect a million people, and its significance is argued for years.","一项税能影响一百万人，它的意义要吵好几年。"],["An organisation measures its importance by the size of its building.","一个组织用楼的大小来衡量自己的重要性。"]]},{"t":"Groups of People","s":[["An association is people who share a trade, and a union is people who share a wage.","协会是干同一行的人，工会是拿同一份工钱的人。"],["A community is where you live, and a consortium is who pays for it.","社区是你住的地方，财团是替它出钱的那几家。"],["A league is teams, and an institution is a habit with a building.","联赛是一批球队，机构是有了房子的一种习惯。"],["A cause can unite a nation and divide a family.","一个目标能把一个国家合起来，也能把一个家分开。"],["A unique thing has no second one, and a global one is sold everywhere.","独特的东西没有第二件，全球的东西到处都在卖。"]]},{"t":"Beyond the Border","s":[["A worldwide market opens at every hour, and a federal state has two governments.","全球市场每个钟点都开着，联邦制国家有两套政府。"],["A foreign minister looks outward, and a domestic one looks at the bills.","外交部长往外看，内政部长看着账单。"],["Overseas trade crosses water, and a trip abroad crosses a border.","海外贸易过的是水，出国旅行过的是边境。"],["A civil servant keeps the office running while the minister changes.","部长换了人，公务员让办公室照常运转。"],["You emigrate from one country, and you immigrate into another.","你从一国移出，再移入另一国。"],["A king reigns for forty years, and a puppet government lasts one.","国王能统治四十年，傀儡政府只撑一年。"]]},{"t":"Crowns and Colonies","s":[["A throne is a chair with a history, and a crown is a hat with one.","王座是一把带着历史的椅子，王冠是一顶带着历史的帽子。"],["A wreath is laid at a stone, and a colony is kept at a distance.","花圈放在一块石头前，殖民地被放在很远的地方。"],["Liberty is doing as you like, and independence is doing it without asking.","自由是想干什么干什么，独立是干的时候不用问谁。"],["A slum is a street the city forgot, and a refuge is where its people go.","贫民区是城市忘了的那条街，庇护所是那里的人去的地方。"],["An asylum is a country that takes you in, and a population is what it counts.","避难是一个国家把你收下来，人口是它数出来的那个数。"]]},{"t":"Counting the People","s":[["A demographic is a count of people by age, and a citizen is one of them.","人口结构是按年龄数人，公民是其中的一个。"],["A resident lives there, and a citizen may vote.","居民住在那里，公民可以投票。"],["An ethnic group shares a history, and a racial one shares a look.","族群共享一段历史，种族共享一副长相。"],["A clan is a family that remembers, and a franchise is a right you can use.","宗族是把事情记着的家族，选举权是你能用的一项权利。"],["A law can entitle a man to a pension, and a preference decides who asks first.","法律能赋予一个人领养老金的权利，偏好决定谁先开口。"]]},{"t":"Votes","s":[["You elect a man, and a poll tells you whether you were right.","你把一个人选上去，民调告诉你选对没有。"],["A respondent answers a question, and a poll counts the answers.","受访者回答一个问题，民调把答案数起来。"],["Ambition wants the office, and a party has to nominate you first.","野心想要那个位子，可先得有一个党提名你。"],["A checklist keeps a plan honest, and a succession keeps a party calm.","清单让计划老实，接班安排让一个党安静。"],["Safety is a rule about other people, and welfare is a payment to them.","安全是关于别人的一条规矩，福利是付给别人的一笔钱。"],["Well-being is what a government says it measures, and a citizen measures his own.","福祉是政府说它在衡量的东西，公民自己另有一套算法。"]]},{"t":"Hoping Well","s":[["Harmony is quiet agreement, and a steady hand keeps it.","和谐是安静的一致，一只稳的手把它维持住。"],["A town can flourish for a century and succeed at nothing else.","一座城能繁荣一百年，别的什么也没成。"],["A prospect is what might happen, and a perspective is where you stand to see it.","前景是可能发生的事，视角是你站在哪儿看它。"],["A viewpoint belongs to one person, and a standpoint belongs to an argument.","观点属于一个人，立场属于一场争论。"],["An outlook is how you expect the year to go, and a guideline is how you plan it.","展望是你估计这一年会怎样，准则是你打算怎么安排它。"]]},{"t":"Saying It","s":[["An ethic is a private rule, and a guideline is a public one.","伦理是一条私下的规矩，准则是一条公开的。"],["You suggest an idea and advise a friend, and only one of them is welcome.","你提一个想法，给朋友一个建议，只有一样受欢迎。"],["A proposal is written, and a hint is not.","提案是写下来的，暗示不是。"],["You declare a fact, affirm a belief, and claim a right.","你声明一个事实，确认一个信念，主张一项权利。"],["They proclaim a republic and state the date in the same breath.","他们宣布成立共和国，一口气把日期也说了。"]]},{"t":"Getting It Done","s":[["You announce a result, clarify a rule, and admit a mistake.","你公布一个结果，澄清一条规则，承认一个错误。"],["You assist a colleague and aid a stranger, and both are help.","你协助同事，帮助陌生人，两样都是帮。"],["You encourage a child, implement a plan, and monitor what happens.","你鼓励一个孩子，执行一份计划，再盯着后来发生了什么。"]]},{"t":"Where They Come From","s":[["An African country, a European union and a Latin American city sit on one map.","一个非洲国家、一个欧洲联盟、一座拉美城市，摊在同一张地图上。"],["A Jewish custom, an Arabian horse and a Portuguese ship cross the same sea.","一种犹太习俗、一匹阿拉伯马、一条葡萄牙船，过的是同一片海。"],["A Roman road, a Greek column and a Russian winter are all older than the border.","一条罗马大道、一根希腊柱子、一个俄罗斯的冬天，都比这条边界老。"],["A Spanish guitar, a Swiss watch and an Italian kitchen fill one street.","一把西班牙吉他、一块瑞士表、一个意大利厨房，挤满一条街。"],["The soviet system, an Indian railway and Australia all had to cross a distance.","苏联的体制、印度的铁路、澳大利亚，都得跨过一段距离。"],["New Zealand, Canada, Britain, France and Germany each keep a flag and a story.","新西兰、加拿大、英国、法国、德国，各留着一面旗和一个故事。"]]}],"16":[{"t":"The Economy","s":[["Trade makes an economy, and a market is where it happens.","贸易造出一个经济体，市场是它发生的地方。"],["An industry makes things, and a merchant moves them.","一个行业造东西，商人把东西运走。"],["A financial year ends in March, and a fund is money put aside for later.","财政年度三月结束，基金是留给以后的那笔钱。"],["You donate what you can, and a rich man endows a chair at a university.","你捐出你拿得出的，有钱人捐一个大学教席。"],["A merchant works for a commercial house and sleeps at the back of it.","商人在一家商行里做事，睡在商行后头。"]]},{"t":"Selling It","s":[["You advertise a thing, and a slogan says it in four words.","你做广告宣传一个东西，广告语用四个字说完它。"],["You purchase a thing once, and you lease it every month.","一样东西你买一次，租的话每个月都要付。"],["A retail price is what you can afford, and a wholesale one is what a shop pays.","零售价是你付得起的那个价，批发价是商店付的那个价。"],["A grocery sells food, and a discount sells it faster.","杂货店卖吃的，打折卖得更快。"],["A promotion is a week of low prices, and a voucher is the paper that proves it.","促销是低价的一个礼拜，代金券是证明这事的纸。"]]},{"t":"Paying for It","s":[["A coupon is cut from a paper, and a voucher is handed to you.","优惠券是从纸上剪下来的，代金券是别人递给你的。"],["A currency is what a country counts in, and exchange is what it costs to change.","货币是一个国家拿来算钱的，兑换是换钱要付的代价。"],["You swap a coat for a coat, and both sides call it a fair deal.","你拿一件外套换一件外套，两边都说这是笔公平的买卖。"],["A receipt proves you paid, and an invoice asks you to.","收据证明你付过了，发票是请你付。"],["A tax is general, a levy is for one purpose, and a tariff is charged at the border.","税是普遍的，征收是为某一个用途，关税在边境上收。"],["A duty is paid on goods that cross, and it is imposed at the port.","货物过境要交税，这笔税在港口上收。"]]},{"t":"Money In, Money Out","s":[["You consume what you buy and spend what you earn.","你消耗买来的东西，花掉挣来的钱。"],["A cost is one price, and an expense is a month of them.","成本是一个价钱，开销是一个月的价钱。"],["Revenue comes in, and gross means before anything is taken out.","收入是进来的钱，毛额是还没扣掉任何东西的那个数。"],["A recession lasts a year, a depression lasts five, and a crisis lasts a weekend.","衰退持续一年，萧条持续五年，危机只持续一个周末。"]]},{"t":"When It Turns","s":[["A security is a promise you can sell, and a bond is one kind.","证券是一张能卖出去的承诺，债券是其中一种。"],["Debt is money you have, and a deficit is money you do not.","债务是你已经拿到的钱，赤字是你没拿到的那部分。"],["Inflation makes money smaller, and deflation makes it heavier.","通胀让钱变小，通缩让钱变重。"],["A market can dwindle, a company can downsize, and both mean fewer people.","市场会萎缩，公司会裁员，两样都意味着人更少。"],["Sales decrease in a bad year, and orders decline with them.","行情差的一年销量下降，订单跟着减少。"]]},{"t":"More and Less","s":[["Profits diminish in a bad year, and a manager reduces the rest.","行情差的一年利润变小，经理把剩下的都削减。"],["Sales increase in a good year, and an increment is one step of it.","行情好的一年销量增加，一次增量是其中的一步。"],["Growth is slow for years, and then it escalates in a month.","增长慢了好几年，然后一个月里猛地上去。"],["A firm can expand into a new market and meet an influx of rivals.","一家公司能扩张到新市场，迎头碰上一批涌进来的对手。"],["An affluent street has two cars, and a poor one enriches nobody.","富裕的街上每家两辆车，穷街上谁也富不起来。"]]},{"t":"Enough","s":[["Sufficient means enough, and adequate means just enough.","sufficient 是够，adequate 是刚够。"],["A spare key is a good habit, and a saving is a good year.","多配一把钥匙是个好习惯，省下来的钱是好年景。"],["A redundant worker is one a firm no longer needs, and a lack of orders is why.","冗员是公司不再需要的那个人，原因是订单不够。"],["A company has shares, a firm has partners, and an enterprise has an idea.","公司有股份，商行有合伙人，企业有一个想法。"],["An agent acts for you, and an entity can be sued.","代理人替你办事，法人能被起诉。"]]},{"t":"Making and Moving","s":[["You invest money now to have more later, and the input is what you put in.","你现在投钱是为了以后多拿，投入就是你放进去的那些。"],["A new product needs a market, and an acquisition buys one.","新产品需要一个市场，收购直接买一个。"],["Goods go by road, and cargo goes by sea.","货物走公路，船货走海路。"],["You insure the ship against storms and guarantee the date.","你给船投保防风暴，还担保到货的日期。"],["A reliable supplier is worth more than a cheap one.","可靠的供应商比便宜的更值钱。"]]},{"t":"The Deal","s":[["A negotiation takes a week, and both sides attend.","一场谈判要一个礼拜，两边都到场。"],["One side is absent, and the deal waits a month.","有一边没来，这笔生意就得等一个月。"],["A sale is one price cut, and wholesale is the trade behind it.","促销是一次降价，批发是它背后那门生意。"],["An auction sells to the highest bid, and a bid is a promise.","拍卖卖给出价最高的那个，出价就是一句承诺。"],["A transaction is done in a minute, and the turnover takes a year.","一笔交易一分钟就完成，周转要一年才算完。"]]},{"t":"Across the Border","s":[["They dump goods below cost to empty a warehouse before winter.","他们把货压到成本以下甩出去，好在冬天前清空仓库。"],["You export what you make and import what you cannot.","你出口自己做的东西，进口自己做不了的东西。"],["A quota limits how much comes in, and a share limits who gets it.","配额限制进来多少，份额限制谁能拿到。"],["A benefit is what you gain, and an interest is what you pay for waiting.","收益是你得到的好处，利息是你为等待付的钱。"],["Stock sits in a warehouse, and an account records what it cost.","存货堆在仓库里，账目记下它花了多少钱。"]]},{"t":"Coins and Paper","s":[["An instalment splits a payment into twelve, and the last one hurts.","分期把一笔付款分成十二份，最后一份最难受。"],["A cheque is paper with a promise on it, and cash is the promise.","支票是写着承诺的纸，现金就是那个承诺本身。"],["You deposit money in a bank, and an account records what arrives.","你把钱存进银行，账户记下收到的每一笔。"],["A coin is small and heavy, and a shilling was one of them.","硬币又小又沉，先令曾经是其中一种。"],["Copper is worth little, and a copper coin lasts for centuries.","铜不值钱，一枚铜板能留几百年。"],["A treasure is buried, and wealth is counted.","宝藏是埋起来的，财富是数出来的。"],["An estate is land and a house, and you possess both until the tax comes.","地产是地和房子，在税来之前两样都归你。"]]},{"t":"What It Is Worth","s":[["A legacy is what a grandfather leaves, and it descends with the house.","遗产是祖父留下的东西，它跟着房子一起传下来。"],["A worthy cause gets the money, and a valuable one gets it twice.","值得的事业能拿到钱，有价值的事业能拿到两回。"],["A cheap price is not a saving, and a valuable thing keeps its value.","便宜的价格不算省，值钱的东西保得住价值。"],["An incentive is money to make you move, and it can accelerate a slow plan.","激励是让你动起来的钱，它能把一个慢计划加速。"],["A prompt reply earns the contract, and a slow one loses it.","回复快能挣来合同，慢一步就丢了。"],["A salary is fixed, and income is whatever arrives.","薪水是固定的，收入是实际到手的那些。"]]},{"t":"What You Are Paid","s":[["A wage is paid by the hour, and a salary by the year.","工资按小时给，薪水按年给。"],["A payment is one of them, and a payroll is all of them at once.","一笔付款是其中的一次，工资单是全部一起发。"],["A refund gives your money back, and a firm may reimburse your travel.","退款把钱还给你，公司也可能报销你的差旅。"],["A subsidy keeps a price down, and remuneration is what the work is worth.","补贴把价格压住，报酬是这份活值多少。"],["You earn what someone will pay, and an undertaking is what you promised.","你挣的是别人愿意给的钱，承诺是你答应了的那件事。"],["A career is forty years, and it starts with one bad job.","一份事业是四十年，开头是一份不怎么样的工作。"]]},{"t":"What You Do","s":[["A profession has a rule, an occupation has a wage, and a job has a boss.","职业有行规，营生有工钱，工作有老板。"],["A vocation is what you would do unpaid, and labour is what you are paid for.","天职是你不给钱也愿意干的，劳动是你拿了钱才干的。"],["A workforce is a number, and personnel is a department.","劳动力是一个数字，人事是一个部门。"],["A workaholic stays late, and a clerk leaves at five.","工作狂待到很晚，职员五点就走。"],["An interview is twenty minutes, and a firm decides a year in them.","面试是二十分钟，一家公司在这二十分钟里定下一年。"]]},{"t":"Hiring and Firing","s":[["A résumé is one page of a career, and it decides the interview.","简历是一份事业的一页纸，它决定有没有面试。"],["You recommend a friend, employ a stranger, and hire whoever is left.","你推荐朋友，雇用陌生人，把剩下那个也招进来。"],["They fire a man in an afternoon, and a lay-off costs less than a dismissal.","开除一个人只要一个下午，临时下岗比正式辞退便宜。"],["You resign in a letter, and you are discharged by one.","辞职是你写一封信，被解职是收到一封信。"],["A man retires at sixty, and a clerk replaces him at twenty-five.","一个人六十岁退休，一个二十五岁的职员接他的位子。"],["You sack a man for stealing, and dismiss one for being late.","有人偷东西你开除他，有人老迟到你就辞退他。"]]},{"t":"How It Ends","s":[["A result is what happened, and a failure is a result you did not want.","结果是发生了的事，失败是你不想要的那个结果。"],["An abortion is a plan stopped early, and a loss is money gone.","中止是提前叫停的计划，亏损是没了的钱。"],["An opportunity is a door, and a chance is the same door with less warning.","机会是一扇门，运气是同一扇门，只是没提前打招呼。"],["You choose one, change your mind, and solve what is left.","你挑一个，改主意，再把剩下的解决掉。"]]},{"t":"Running It","s":[["You develop a product and improve it for ten years.","你开发一个产品，再花十年把它做好。"],["A sustainable business lasts, and a cheap one is bought and closed.","可持续的生意能撑下去，便宜的生意被人买走再关掉。"],["You manage a team, and a board regulates the market.","你管一个团队，董事会管这个市场。"],["A sanction punishes a firm, and a fine is how.","制裁惩罚一家公司，罚款是它的手段。"],["You coordinate two offices, cooperate with a rival, and collaborate on a standard.","你协调两个办公室，跟对手合作，还一起定一个标准。"]]}],"17":[{"t":"The Rule and the Law","s":[["A law is written down, and it takes a parliament to change it; a rule is written on the wall, and it takes a manager.","法律是写下来的，改它要议会。规则写在墙上，改它只要一个经理。"],["Legal advice is expensive because the words are old, and the old words mean something exact.","法律意见贵，因为那些词都老。而老词，意思分毫不差。"],["A regulation is a rule made by an office, and it can be changed on a Tuesday afternoon.","条例，是某个机关自己定的规矩。一个周二下午，就能改。"],["A treaty is between countries, an agreement can be between two people, and a charter is the oldest of the three.","条约，是国家之间的。协议，两个人之间也能有。而宪章，是三个里最老的。"],["Protocol is the order you do things in, and in some rooms it matters more than the thing itself.","礼节，是办事的先后顺序。在某些屋子里，它比事情本身还重要。"],["A norm is what people expect, a benchmark is what you measure against, and a standard is what you must meet.","准则，是人们的期望。基准，是你拿来比照的。而标准，是你必须达到的。"],["The criteria are written before the judging, which is the only way they mean anything.","评判的标准，要在评之前就写好。只有这样，它才算数。"]]},{"t":"Making It Stick","s":[["The rules allow one guest and the sign says two, and nobody enforces either.","规定只允许一位客人，牌子上写两位。两个，都没人执行。"],["Admission is free but admission of guilt costs you the case.","进门免费。可承认自己有罪，这官司就输了。"],["If you default on the payment, the machine goes back to the shop.","一旦拖欠付款，机器就退回店里。"],["They will reject the plan in June and approve the same one in September.","六月，他们否掉这个方案。九月，又批准了同一个。"],["The constraint is not money, it is the two-metre rule about the window.","卡住的不是钱。是窗户那条两米的规定。"],["An official answer comes in writing, and a real one comes on the phone.","官方的答复，是写在纸上的。真正的答复，在电话里。"],["A mandatory training day is one you are paid for and still resent.","强制培训日，是给钱的。可大家还是不满。"],["The argument was potent enough to change three votes, which is all it needed.","这个论证够有力，改了三票。而三票，就够了。"],["You are bound by the contract whether you read it or not, and that is an obligation.","不管读没读，你都被这份合同捆住。这就叫义务。"]]},{"t":"The Court","s":[["The court sits at ten, the supreme court sits when it likes, and neither waits for anybody.","法院十点开庭。最高法院想什么时候开就什么时候开。两个，都不等人。"],["Parliament will enact the bill in March and legislate on the detail later.","三月，议会通过法案。细节，以后再立法。"],["Equity is fairness written into the rules, and it is also what you own in a company.","衡平法，是把公平写进规则里。而这个词，也是你在公司里占的那一份。"],["A fair trial and a just one are not the same, and the difference keeps lawyers employed.","公平的审判和公正的审判，不是一回事。这个区别，养活了律师。"],["Prejudice needs no evidence, and discrimination needs an excuse.","偏见不需要证据。而歧视，要一个借口。"],["They will accuse him on Monday, sue the company on Tuesday, and prosecute nobody.","周一，他们指控他。周二，他们告那家公司。而谁也没被刑事追究。"],["The newspaper will condemn the decision and complain about the cost of it in the same paragraph.","同一段里，报纸既谴责这个决定，又抱怨它的花费。"],["They boycotted the meeting, which is a way of attending it loudly.","他们抵制了会议。这是一种很大声的出席。"]]},{"t":"In Session","s":[["The session lasts three weeks and the last one lasts a day.","这一期开庭，三个星期。上一期，一天。"],["A neighbour will mediate, and both sides will leave angrier than they came.","一个邻居来调停。两边走的时候，比来时更生气。"],["His plea was guilty, and his plea to the court for mercy was longer.","他认了罪。而他向法庭求情的那些话，更长。"],["They will appeal in June, and the appeal will be heard in November.","六月，他们上诉。而上诉，要到十一月才审。"],["Two witnesses will contradict each other, and the truth is somewhere between them.","两个证人，说法互相矛盾。而真相，在他们中间某处。"],["Nobody could persuade him, and the controversy outlived the case by ten years.","没人说得动他。而那场争论，比案子多活了十年。"],["They whispered in the corridor, muttered in the lift and murmured all through the afternoon.","他们在走廊里低语，在电梯里嘀咕。整个下午，都在小声议论。"],["The room went silent, and the one man who could not speak stayed mute for an hour.","屋里静下来。那个说不出话的人，一个小时都没开口。"]]},{"t":"The Case","s":[["They will investigate for a month and find nothing that a witness did not already say.","他们查了一个月。查出来的东西，证人早就说过了。"],["You can justify almost anything afterwards, which is why the reason is asked for first.","事后，几乎什么都能说成有理。所以才要先把理由讲清楚。"],["A reasonable doubt is enough, and a suitable excuse is not.","合理的怀疑，就够了。而合适的借口，不算。"],["The judge listens, the jury decides, and the trial takes four days.","法官听，陪审团定。审判，持续四天。"],["They suspect the man at the gate, and suspicion is not evidence.","他们怀疑门口那个人。而怀疑，不是证据。"],["The sentence was two years, and the sentence in the newspaper was one line.","判决是两年。而报纸上那句话，只有一行。"],["They will arrest him on Friday and jail him on Monday, and the prison is forty miles away.","周五逮捕，周一送监。监狱，在四十英里外。"],["A child is confined to the house for a week, and the word is the same one used for a prisoner.","孩子被关在家里一个星期。用的那个词，和关犯人一样。"]]},{"t":"Watching and Restraining","s":[["One man will oversee the whole site and another will supervise the wiring.","一个人管整个工地。另一个人，管布线。"],["They restrict the hours and restrain nobody, because a rule is cheaper than a guard.","他们限制营业时间，却不拦人。因为一条规定，比一个保安便宜。"],["He will commit the crime in March and confess in April, and nobody is surprised.","三月犯案，四月认罪。没人意外。"],["A sin is against a god and a crime is against a state, and a vice is against yourself.","罪，是对神犯的。罪行，是对国家犯的。而恶习，是对自己犯的。"],["He tried to bribe the clerk with twenty pounds and was reported before he left the room.","他想用二十镑贿赂那个职员。还没出屋，就被举报了。"],["They will rob the shop, steal the van, and be caught because the van was too small.","他们抢了店，偷了车。被抓，是因为车太小。"],["A pirate copies the film, and a thief takes the disc; one is worse and neither is rare.","盗版的人复制电影，小偷拿走碟片。一个更糟，两个都不少见。"],["The murder was never solved, and the suicide beside it was never explained.","那桩谋杀，一直没破。旁边那桩自杀，也一直没解释。"]]},{"t":"Tricks","s":[["He will deceive the buyer and cheat at cards, and the fraud is the same trick twice.","他骗买家，也在牌上做手脚。而诈骗，是同一个把戏做两遍。"],["A liar needs a good memory, which is why the story changed by Thursday.","说谎的人要好记性。所以他那个说法，到周四就变了。"],["It was a trap and everybody could see it, and he walked in anyway.","那是个圈套，谁都看得出来。他还是走了进去。"],["The trick is to pretend you are not in a hurry, and it fools most people.","诀窍是装作不着急。这一招，能骗过大多数人。"],["There is a stigma to the word, and it outlives the sentence by twenty years.","这个词带着污名。而污名，比刑期多活二十年。"],["He will confess on the second day and conform for the rest of his life.","第二天，他就认了。之后一辈子，循规蹈矩。"],["The two brothers were reconciled in 2011, and neither will say what changed.","两兄弟二〇一一年和解了。谁都不肯说，是哪一点变了。"],["Most people obey the rule and a few succumb to the fine, and the penalty is the same either way.","大多数人守规矩，少数人认罚交钱。两种情况下，处罚是一样的。"],["It was a fine, in both senses, and he paid it with a fine.","这笔钱叫罚款，事也算件好事。他掏的时候，神色还挺好。"]]},{"t":"What Is Yours","s":[["The mortgage runs for twenty five years and the ownership never feels real until the last payment.","按揭要还二十五年。所有权，要到最后一笔付完，才觉得是真的。"],["Copyright lasts seventy years after the writer dies, which is longer than the paper lasts.","版权在作者去世后还有七十年。比纸的寿命，长得多。"],["It is a privilege to be asked, and it is also unpaid work.","被请去做，是种荣幸。也是白干。"],["The school is accredited by an office nobody has heard of.","这所学校的认证，来自一个没人听说过的机构。"],["The clue was in the first paragraph, and it was not much of one.","线索在第一段。而且，算不上什么线索。"],["Access to the file is restricted, so you need a reason and a name.","这份档案不是谁都能看。你得有理由，还得有个名字。"],["The letter was anonymous, and anonymous letters are false about half the time.","那封信是匿名的。而匿名信，有一半是假的。"],["A genuine signature is worth more than a false stamp, and everybody in the room knew it.","真签名，比假印章值钱。屋里每个人，都知道。"]]},{"t":"Procedure and Asking","s":[["The procedure is four steps and the routine is the same four steps every Monday.","程序，是四个步骤。而常规，是每个周一都走这四个步骤。"],["The consequence of being late is a letter, and the consequence of ignoring the letter is a fine.","迟到的后果，是一封信。不管那封信的后果，是罚款。"],["They demand an answer and request a meeting, and they require both by Friday.","他们要求答复，请求会面。而且两件，都要求周五前办完。"],["Three hundred people signed the petition, which is more than the office expected.","三百人在请愿书上签了名。比那个机关预想的，多。"],["A command is an order from above, and to instruct somebody is to write the same order down politely.","命令，是上面直接下来的话。而指示，是把同样的话客气地写下来。"]]}],"18":[{"t":"The First Room","s":[["The first room is about violence, and the sign says so without any decoration.","第一个展厅讲的是暴力。牌子就这么写着，一个字也没修饰。"],["A conflict begins with two people who will not move, and it ends when one of them does.","冲突，从两个都不肯让的人开始。其中一个让了，它才结束。"],["A raid is short and a campaign is long, and both are planned by people who never go.","突袭短，战役长。两个，都是不去的人策划的。"],["There was a battle here in 1415, and the field is a car park now.","一四一五年，这里打过一仗。那片地，现在是停车场。"],["The struggle lasted nine years, and the museum gives it one wall.","那场斗争持续了九年。博物馆，给了它一面墙。"],["An explosion is loud for a second and quiet for fifty years.","爆炸响一秒钟。然后，安静五十年。"],["The enormity of it is not in the noise, and that is what the room is trying to say.","这件事的可怕，不在响声里。这个展厅想说的，正是这句。"]]},{"t":"What Flew and What Fell","s":[["They bombarded the town for three days, and a bomb is the thing that does it.","他们炮轰那座城，轰了三天。炸弹，就是干这件事的东西。"],["A blast breaks the windows two streets away, and a burst of it is what the witness remembers.","一次爆炸，震碎两条街外的窗子。而目击者记住的，是那一下炸开。"],["A spark set off the gunpowder, and the whole store went up at once.","一点火星引着了火药。整个仓库，一次就上了天。"],["A tank came down the road and a cannon came behind it, and both were slower than the men on foot.","坦克沿路开来，后面跟着一门大炮。两个，都比走着的人慢。"],["A missile is fired from far away, and a rifle is fired from a hundred paces.","导弹从很远的地方放出去。步枪，从一百步外打。"],["A bullet will deflect off a stone and hit the man beside you, which is why nobody stands behind one.","子弹打在石头上会偏，偏到旁边那个人身上。所以，没人站在石头后面。"],["A pistol fits in a pocket, a weapon is any of them, and the target is whoever is in front.","手枪装得进口袋。武器，是这全部的统称。而目标，是站在前面的那个人。"],["The flame of a match will flare up twice and then glow, and the glitter in the glass is only a reflection, and the twinkle of it is only the light.","火柴的火苗先旺两下，然后暗下去。玻璃里那点闪光，只是反光。一闪一闪的，也只是光。"]]},{"t":"Blades and Armour","s":[["A blade, a sword and an ax are all edge, and the difference is how you hold them.","刀刃、剑、斧，都是刃。区别，在你怎么握。"],["A hammer was a tool before it was a weapon, and an arrow was a hunting thing first.","锤子先是工具，后来才成了武器。箭，先是打猎用的。"],["A spear is older than the wheel and simpler than either.","矛比轮子老。也比这两个都简单。"],["The helmet is dented on the left, and the shield beside it has a hole you could put a thumb through.","头盔左边凹了一块。旁边那面盾上有个洞，大拇指伸得过去。"],["Every army is equipped by somebody, prepared in a month and provided for by people who never see it.","每支军队，都有人给它装备。一个月内准备妥当。供养它的，是从没见过它的人。"],["They will deploy on the ridge at dawn, and the map on the wall shows the ridge.","天亮时，他们部署在山脊上。墙上那张地图，画的就是那道山脊。"],["You hit with the flat, beat with the handle, strike with the edge and punch with the fist.","用平面打，用柄敲。用刃劈，用拳头揍。"],["A chop is a blow downwards, a stab is one forwards, and a mission is the reason for both.","砍，是往下。刺，是往前。而任务，是这两下的理由。"]]},{"t":"The Hard Choice","s":[["The dilemma is that both roads are wrong, and the plight of the people on them is worse.","两难在于，两条路都是错的。而走在上面那些人的处境，更糟。"],["There is a pitfall in every plan, and the one nobody saw is the one that matters.","每个计划里都有个坑。要紧的，偏偏是没人看见的那个。"],["A conspiracy needs three people and one of them will talk.","阴谋要三个人。而其中一个，一定会说出去。"],["The refugees arrived destitute, with nothing but what they could carry.","难民到的时候一无所有。只有身上拿得动的那点东西。"],["A famine is not one bad harvest, it is three.","饥荒，不是一次歉收。是三次。"],["The village was starved out in the second winter, and the word is exact.","第二个冬天，村子被饿垮了。这个词，用得很准。"],["They were deprived of water for four days, and a man will trade anything for a cup.","他们断了四天水。而一个人，会为一杯水换掉任何东西。"],["One side will seize the bridge, and the other will pursue them to the river.","一边，会去夺那座桥。另一边，会把他们追到河边。"],["A threat does not have to be carried out to work, and that is the whole point of it.","威胁不必真做出来就有效。它的用处，就在这儿。"],["He did not mean to offend anyone, and he offended the whole room.","他没想冒犯谁。结果，冒犯了满屋子人。"]]},{"t":"Crossing the Line","s":[["An aggressive move is one you make before the other side is ready, and it works once.","侵略性的一步，是在对方没准备好的时候走的。而且，只灵一次。"],["They invaded in June and were gone by December, and nobody has forgotten either date.","六月，他们打了进来。十二月，就走了。两个日子，都没人忘。"],["To trespass is to walk on it without permission, and to intrude is to walk in.","非法侵入，是没经允许就走上那块地。而闯入，是走进屋里。"],["The treaty was violated twice before anybody wrote it down.","条约还没写下来，就已经被违反过两次。"],["An attack can be a word, an assault is always a hand, and a challenge is a question.","攻击，可以是一句话。袭击，一定是动手。而挑战，是一个问题。"],["The siege lasted four months, and the city was surrounded by the third week.","围城围了四个月。到第三周，城就被围住了。"],["They enclosed the field with a wall, and the wall is still there.","他们用一道墙把那块地围起来。墙，如今还在。"]]},{"t":"Stopping It","s":[["A pause lasts a minute and a halt lasts a day, and a cease lasts until somebody breaks it.","暂停，一分钟。停顿，一天。而停止，一直持续到有人打破它。"],["They will oppose the plan in public and support it in the corridor.","公开场合，他们反对这个计划。走廊里，他们支持。"],["A regime that oppresses its own people is doing the work of its enemies.","压迫自己人的政权，干的是敌人的活。"],["He countered with an argument nobody understood, and it worked.","他用一个谁也没听懂的论点反驳。居然，管用。"],["A wall will deter a thief and a sign will not.","一堵墙能吓住小偷。一块牌子，不能。"],["The rules forbid it, the law prohibits it, and people do it on Sundays.","规定禁止它，法律禁止它。而人们，周日照做。"],["A fence prevents nothing and a guard prevents a little, and both are cheaper than a wall.","一道篱笆什么也拦不住，一个守卫能拦一点。两个，都比墙便宜。"]]},{"t":"Turning","s":[["A revolt begins in a market and ends in a palace, and the market always remembers it longer.","叛乱从集市开始，在宫殿结束。而集市，记得更久。"],["He will betray the plan to the other side, and the treason is in the word he used.","他把计划卖给了另一边。而叛国的罪，就藏在他用的那个词里。"],["A rebel is a patriot from the other side of the line, and both words are on the same wall.","造反的人，是界线另一边的爱国者。两个词，挂在同一面墙上。"],["A traitor is what the winners call him, and a patriot is what the losers call him.","赢的人叫他叛徒。输的人，叫他爱国者。"],["Nobody blamed the officer and everybody reproached the clerk, which is how it usually goes.","没人怪军官，人人都责备那个职员。事情，通常就是这样。"],["There is evidence of a meeting and proof of nothing, and the two are not the same word.","有开过会的证据。却什么也证明不了。这两个，不是一回事。"]]},{"t":"Fear","s":[["Terror is a night, and a terror is a thing you cannot name.","恐惧，是一个夜晚。而可怕的东西，是你叫不出名字的那样。"],["The film was terrible in the old sense and terrific in the new one, and it was also horrible.","那部电影，在旧义上是“可怕”，在新义上是“极好”。同时，还“很糟”。"],["The alarm went at three, and everybody stood in the street in a coat.","三点，警报响了。大家都披着外套，站在街上。"],["She dreaded the letter and read it anyway, because not knowing is worse.","她怕那封信。还是读了。因为不知道，更糟。"],["The noise will frighten a horse and not a man, and the man is the one who runs.","这声音，能吓着马，吓不着人。而跑的，偏偏是人。"],["The tension in the room was worse than the argument, and it lasted longer.","屋里的紧张，比争吵本身更难受。也持续得更久。"],["It was a turbulent year and a time of turmoil, and the two words describe the same weather.","那是动荡的一年，混乱的一段。两个词，说的是同一种天气。"],["The scenario they planned for was not the one that happened, which is normal.","他们设想过的情况，不是实际发生的那个。这是常事。"],["It was an occasion for a speech, and nobody could think of one.","那是个适合讲话的场合。而谁，也想不出讲什么。"],["There is a limit to what a person will carry, and a boundary beyond which nobody follows.","一个人能扛的，有上限。也有一条界线，过了，就没人跟。"],["He kept a rein on his temper for two hours and then lost it in a minute.","他把脾气勒了两个小时。然后，一分钟里全放了。"]]},{"t":"Rivals","s":[["Two shops will compete for the same street and both will blame the other for the rent.","两家店会为同一条街争生意。然后，互相把房租怪到对方头上。"],["A contest has a winner, a dispute has a loser, and the second one lasts longer.","比赛有赢家，争执有输家。而后者，拖得更久。"],["They contend that the road is theirs, and the map says otherwise.","他们主张这条路是他们的。地图上，不是这么画的。"],["A rival is the one you know, and a competitor is the one you do not.","对手，是你认识的那个。竞争者，是你还不认识的那个。"],["An enemy is a rival you have stopped talking to.","敌人，是已经不再跟你说话的对手。"],["The strategy is four pages and the tactic is one sentence.","战略，四页。战术，一句话。"],["The manoeuvre worked twice and then everybody had seen it.","这个动作，灵了两次。然后，所有人都看过了。"],["The blueprint was drawn in 1962, and the building is still not finished.","蓝图一九六二年就画好了。而楼，至今没盖完。"],["They warned him twice, compelled him once and obliged him in the end.","他们警告他两次，强迫他一次。最后，逼得他不得不做。"],["Three hundred people came to protest, and the speech refuted nothing.","三百人来抗议。而那番讲话，什么也没驳倒。"]]},{"t":"Force","s":[["Might is what you have and force is what you use, and neither lasts after the last soldier.","实力，是你有的。武力，是你用的。两个，都撑不过最后一个兵。"],["They reinforced the wall in March and impaired the road in doing it.","三月，他们加固了那道墙。顺手，把路弄坏了。"],["Nothing can mitigate a bad decision except a better one.","除了一个更好的决定，没什么能减轻一个坏决定。"],["The only comfort was that it could not get worse, and it did.","唯一的安慰，是不会更糟。结果，更糟了。"]]},{"t":"What Happens","s":[["An event is on the calendar, and what happens is not.","事件，是写在日程上的。真正发生的事，不是。"],["It does not matter who fired first, and it mattered to everybody for fifty years.","谁先开的枪，并不要紧。可在五十年里，它对每个人都紧要。"],["The same thing will happen again, and it will occur in the same month.","同样的事，还会再来。而且，会落在同一个月。"],["The attack was savage and the retreat was worse, and both were reckless.","进攻很凶，撤退更糟。两个，都鲁莽。"],["A fierce fight lasts ten minutes and a foul one lasts in the memory.","激烈的打斗，十分钟就完。而卑劣的那种，留在记忆里。"],["Evil is a word people use when they have stopped explaining, and the devil is the same word with a face.","邪恶，是人们不再解释时才用的词。而魔鬼，是同一个词，添了一张脸。"]]},{"t":"After","s":[["The punishment was a year and the crime was an afternoon, and nobody thought it was fair.","惩罚是一年，罪是一个下午。没人觉得公平。"],["They will execute one man and hang nobody, and the square is a car park now.","他们处死了一个人，没绞死谁。而那片广场，如今是停车场。"],["A sacrifice is only a sacrifice if it was not necessary, and that is the argument.","只有本来不必的，才叫牺牲。争论，就在这里。"],["The casualty figures were released in 1998, and they were higher than the ones in 1918.","伤亡数字，一九九八年才公布。比一九一八年那个，还高。"],["They buried him in the field and put a stone there in 1950.","他们把他葬在那片地里。一九五〇年，又立了一块石头。"],["The funeral was on a Tuesday and the grave is still tended.","葬礼在周二。而那座墓，至今有人照看。"],["The tomb is empty, and the story of what happened to him has three versions.","墓是空的。而他的遭遇，有三个版本。"],["The prisoner said he had been in hell for two years, and nobody argued.","那个囚犯说，他在里头过了两年地狱。没人反驳。"]]},{"t":"At Sea and in the Air","s":[["The maritime museum is in the old dock, and the naval one is next door.","海事博物馆在旧码头。海军那个，在隔壁。"],["The fleet left in May and came back with half of it.","舰队五月出发。回来的时候，只剩一半。"],["A troop of soldiers walked through the town at six, and nobody looked out of the window.","六点，一队士兵穿过镇子。没人往窗外看。"],["The landing was at night and the beach was empty by morning.","登陆在夜里。到早上，滩上已经没人。"],["A helicopter will hover over the field for an hour and then leave.","直升机会在田上盘旋一个小时。然后，走。"],["They will proceed along the coast and make little progress in the first week.","他们会沿着海岸推进。第一周，几乎没什么进展。"],["Military spending is a third of the budget, and the nuclear programme is most of that.","军费占预算三分之一。而核计划，占了其中大半。"]]},{"t":"The Cost","s":[["The water was poisoned for a hundred years, and the field still grows nothing.","水被毒了一百年。那块田，至今什么都不长。"],["The storm will devastate the coast and nobody will rebuild it twice.","风暴会毁掉海岸。而没人会重建第二次。"],["The risk was worth it to them and not to the men underneath.","这个险，对他们值得。对底下那些人，不值。"],["It was an adventure for the first week and a peril after that.","第一周是冒险。之后，就是险境。"],["A catastrophe is a disaster with paperwork, and the paperwork takes ten years.","大灾难，是带着公文手续的灾难。而手续，要办十年。"],["The roof will collapse under snow, and the wall beside it will not fall.","屋顶会在雪底下塌掉。旁边那道墙，不会倒。"],["They tortured him for two days to humiliate him, and got nothing, and the shame outlasted the bruises.","他们拷问他两天，为的是让他丢脸。什么也没得到。而羞辱，比伤留得久。"],["The damage was to the windows, and the noise was more harmful than the glass.","坏的是窗子。而噪音，比玻璃更伤人。"],["The report did not mislead anybody who read the second page.","读过第二页的人，都不会被这份报告误导。"],["Do not disturb the meeting and do not interfere with the vote.","别打扰会议。也别干预投票。"],["A dog will interrupt a conversation and a phone will end one.","狗会打断谈话。而一通电话，会把它结束掉。"]]},{"t":"Backwards","s":[["They began to shrink the line in March and to withdraw in June.","三月，他们开始收缩战线。六月，开始撤。"],["The wall was built to withstand a flood, and it withstood one in 1998.","那道墙，是照着抗洪修的。一九九八年，它真扛住了一次。"],["A compromise is what you call it when you have given away half.","妥协，是你让掉一半之后，给这件事起的名字。"],["They surrendered at four in the afternoon, and the town was quiet by five.","下午四点，他们投降。到五点，镇上就安静了。"],["Two men escaped over the wall, and the third could not avoid the dogs.","两个人翻墙逃了。第三个，躲不过那些狗。"],["He quit in June, abandoned the house in July and forgot it by August.","六月，他不干了。七月，弃了那栋房子。到八月，就忘了。"],["She will forgo the fee, discard the plan and be rid of the whole thing by Friday.","那笔钱她不要，计划扔掉。到周五，整件事就甩干净了。"]]},{"t":"Holding","s":[["They defended the bridge for six days and then blew it up themselves.","他们守了那座桥六天。然后，自己把它炸了。"],["A rule is there to safeguard the weakest, and it does not always.","规则摆在那儿，是为护住最弱的人。而它，并不总做到。"],["The first attack was defeated and the second was not resisted at all.","第一次进攻被打退。第二次，根本没被抵抗。"],["One side will capture the hill in the morning and lose it before dark.","一方早上夺下山头。天黑前，又丢了。"],["The victory took four hours, and the triumph took a week of parades.","胜利用了四个钟头。而凯旋，用了一个星期的游行。"],["You can conquer a city in a month and never conquer the people in it.","一座城，一个月能征服。里面的人，永远征服不了。"],["There is a monument at the corner and a tablet with forty names on it.","街角有一座碑。碑上刻着四十个名字。"],["There is a statue of him in the square, and a medal in a drawer at home.","广场上立着他的像。家里抽屉里，有一枚勋章。"],["The honour was the parade, and the week was glorious, and by the next one nobody mentioned it.","荣誉，是那场游行。那一周，也确实光辉。再下一周，就没人提了。"]]},{"t":"Given and Owed","s":[["Everybody contributed something, and two families gave more than the rest.","每个人都出了点东西。有两家，比别家出得多。"],["She devoted thirty years to the archive and never asked for a room with a window.","她把三十年投在档案上。从没要过一间有窗的屋子。"],["The town owes him nothing and remembers him anyway.","镇子不欠他什么。却还是记得他。"],["A patrol goes out at six and a guard stays at the gate all night.","六点，巡逻队出去。守卫，在门口站一整夜。"],["The netting was camouflage for the gun, and everybody could see the gun.","那张网，是给炮做伪装的。而所有人，都看得见那门炮。"],["The obstacle was not the river, it was the paperwork for the bridge.","挡住的不是那条河。是修桥要办的手续。"],["A rabbit will burrow under the wire and be gone by morning.","兔子会在铁丝底下打洞。到早上，就没影了。"],["A spy sends one message a month, and a scout goes out and comes back.","间谍一个月发一次消息。而侦察兵，出去，再回来。"],["The general arrived in June and left the soldier to explain it.","将军六月到了。然后走了，留下士兵来解释。"],["The veteran comes on Sundays and tells the same story to whoever is standing there.","那位老兵每周日来。把同一个故事，讲给站在那儿的人听。"]]}],"19":[{"t":"The First and the Last","s":[["A pioneer is the one who goes first and the one who pays for it.","拓荒者，是先走的那一个。也是为这个“先”付代价的那一个。"],["A prophet is never believed at home, and a herald is only believed after the fact.","先知在家乡没人信。而传令官，要等事情发生了才有人信。"],["The heir gets the house and the successor gets the job, and the second one has to work.","继承人，拿到房子。接班人，拿到位子。而后者，得干活。"],["Three generations have lived in this house, and the surname on the door has not changed.","这栋房子住过三代人。门上那个姓，一直没变。"]]},{"t":"Men and Women","s":[["Gender is what the form asks and sex is what the doctor wrote, and the two are not always the same.","性别，是表格上问的那一栏。也是医生写下的那一栏。两个，并不总是一致。"],["A female fox is a vixen and a female of our own kind is simply a woman.","母狐有专门的叫法。而我们自己这一类的雌性，就叫女人。"],["A couple can be two people or one married pair, and the word does not decide which.","一对，可以是两个人。也可以是一对夫妻。这个词，不负责区分。"],["A spouse is the person you file taxes with, and a husband is the one who fixes the tap.","配偶，是跟你一起报税的那个人。丈夫，是修水龙头的那个人。"],["Her grandfather came in 1948, and her father-in-law came in 1970, and neither ever went back.","她祖父一九四八年来，她公公一九七〇年来。两个，都没回去过。"],["The word gay means cheerful in the old books and something else in the new ones.","这个词，在旧书里是“快活”。在新书里，是另一个意思。"]]},{"t":"The Family","s":[["A sibling is a brother or a sister, and a cousin is the same thing one house further out.","兄弟姐妹，是同屋的。而堂表亲，是再隔一层的。"],["A nephew is your sister's son, a niece is your brother's daughter, and both remember your name.","侄子，是你姐妹的儿子。侄女，是你兄弟的女儿。两个，都记得你的名字。"],["The twins are not identical, and nobody has ever had trouble telling them apart.","这对双胞胎不像。从来没人分不出来。"],["An embryo becomes an infant in nine months, and the infant becomes a person in about thirty years.","胚胎九个月，成婴儿。而婴儿长成一个人，大约要三十年。"],["An orphan has no parents, and in the old records the word is used for a child with one.","孤儿，是没有父母的孩子。而在旧档案里，只剩一个父母的孩子也这么叫。"],["A juvenile is a young person in the eyes of the law, and the law is not sure where it ends.","在法律眼里，少年就是年纪小的人。而法律，说不准这到几岁为止。"],["A youngster is louder than a youth, and a teenager is a number rather than a person.","小伙子，比青年吵。而青少年，是按岁数算的，不按人算。"],["A gang is a group with a name, and the name is usually the problem.","一伙人，总有个名号。而问题，往往就出在这个名号上。"],["Adolescence is the ten years when nothing is settled, and everybody remembers it.","青春期，是那十年，什么都没定下来。而每个人，都记得。"]]},{"t":"Relatives","s":[["Kin is the old word for who you are related to, and folk is the word for all of them together.","亲属，是个老词，指跟你有关的人。而乡亲，是把他们全算在一起的说法。"],["A relative is anyone you see at a funeral, and an intimate friend is one you would call at three.","亲戚，是葬礼上会见到的任何人。而密友，是你凌晨三点会打电话的那个。"],["Dear is what you write at the top, and darling is what you say at the door.","“亲爱的”，写在信头上。“宝贝”，是在门口说的。"],["A lover is not a beloved, and the difference is whether the other person knows.","情人，不等于被爱的人。区别在于，对方知不知道。"],["Madam is a word for a customer you cannot see, and a hostess is the one who meets you at the door.","“夫人”，是对看不见脸的客人说的。而女主人，是在门口接你的那位。"],["The landlady owns the building, the mistress ran the household, and the housewife runs it now.","女房东，有这栋楼。从前女主人当家。如今，是家庭主妇当家。"],["The widow has lived alone since 1998 and knows every dog in the street by name.","那位寡妇从一九九八年就一个人住。街上每条狗的名字，她都知道。"]]},{"t":"Servants and Guests","s":[["A maid cleaned the rooms and a maiden in the old stories never did any cleaning at all.","女仆打扫房间。而旧故事里的少女，从来不打扫。"],["The household is four people and eleven chores, and the chores win.","这一家，四口人，十一件家务。而家务，赢了。"],["The host stands at the door, the landlord stands at the bank, and the tenant stands in the hall with a box.","主人在门口，房东在银行。而房客抱着个箱子，站在门厅。"],["A guest is invited, a customer pays once, and a client comes back.","客人，是被请来的。顾客，付一次钱。而委托人，会再来。"]]},{"t":"Meeting and Marrying","s":[["They met by encounter on a train and by appointment in a bank, and only one of those became a marriage.","他们在火车上偶遇，在银行里约见。只有一次，变成了婚姻。"],["He chased her for a year and then missed the wedding because of a train.","他追了她一年。然后，因为一趟火车错过了婚礼。"],["She was accompanied by her sister, which is how it was done then.","她由姐姐陪着来。那时候，就是这么办的。"],["A dependent is somebody the household pays for, and the word is older than the benefit.","受赡养的人，是由这个家养着的。这个词，比那笔补贴老。"],["He proposed in June, the engagement lasted a year, and the wedding was in a field.","六月，他求了婚。订婚持续一年。婚礼，在一片田里办的。"],["They went to the coast for the honeymoon and came back with a dog.","他们去海边度的蜜月。回来，带了一条狗。"],["A kiss at the station is not the same as a kiss at the door, and everybody knows which is which.","站台上的吻，和门口的吻不一样。谁都分得清，哪个是哪个。"],["They separated in 2004 and divorced in 2007, and the house was sold in between.","二〇〇四年，他们分居。二〇〇七年，离婚。房子是中间卖掉的。"]]},{"t":"Ones and All","s":[["A single ticket, a single bed and a single person all use the word in different ways.","单程票、单人床、单身的人。同一个词，三样用法。"],["The sole survivor is the only one, and the sole of a shoe is something else again.","唯一的生还者，是那一个。而鞋底，又是另一回事。"],["They went their respective ways, and each of them pretended not to look back.","他们各走各的路。而每个人，都装作没回头。"],["An individual is one person, and the word is used when the number is being made.","个人，就是一个人。而这个说法，常用在要拿人数说话的时候。"],["A commuter spends two hours a day going nowhere in particular.","通勤的人，每天花两个钟头，去一个没什么特别的地方。"],["The neighbourhood is nine streets and one shop, and everybody knows the shop.","街区，是九条街加一家店。那家店，人人都知道。"],["A member pays, an acquaintance nods, and a stranger asks the way.","会员交钱，熟人点头。而陌生人，问路。"]]},{"t":"At Work","s":[["The boss decides, the manager explains, and the supervisor is the one who is actually there.","老板决定，经理解释。而主管，才是真在场的那个人。"],["A subordinate takes the blame and a partner takes half the money, and both call it teamwork.","下属担责，合伙人分走一半钱。两个，都管这叫团队合作。"],["A colleague shares the office, a comrade shares the cause, and an acquaintance shares nothing.","同事，共用一个办公室。同志，共一个事业。而熟人，什么都不共。"],["Friendship takes a year and affection takes longer, and both can end in an afternoon.","友谊，要一年。感情，要更久。而两个，都能在一个下午结束。"],["An apprentice is paid nothing and learns everything, which is the deal.","学徒，不给钱，学一切。交易就是这样。"],["A deputy does the job when the other one is away, and is never thanked for it.","副手，在正职不在的时候干活。而且，从来不被谢。"]]},{"t":"Titles","s":[["A hero gets a statue and a heroine gets a plaque, and the actress gets a photograph on the wall.","男主角，有雕像。女主角，有一块牌子。而女演员，在墙上有一张照片。"],["The chancellor runs the university, the commander runs the army, and the director runs the film.","校长管大学，司令管军队。导演，管电影。"],["A proponent argues for it, a committee decides it, and a council pays for it.","支持者替它说话，委员会决定它。而理事会，出钱。"],["A delegate speaks for the group and is not allowed to say anything else.","代表，替一群人说话。别的话，不许说。"],["A specialist knows one thing well, a consultant is paid to say it, and a counsellor is paid to listen.","专家，把一件事弄透。顾问，被付钱说它。而辅导员，被付钱听。"],["The veterinary practice is next to the solicitor, and the attorney across the road handles the other kind of case.","兽医诊所，在事务律师隔壁。马路对面那位辩护律师，管另一种案子。"],["The umpire decides, the cashier
