<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>分章短文 · 雅思词汇真经</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1f2328;--ink2:#5b6470;--line:#e6e2da;--chip:#efece6;
 --accent:#b4442e;--acc-soft:#fdf1ec;--mark:#ffe9a8;--green:#2f7d4f;--warn:#c0392b;
 --serif:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC",serif}
html.dark{color-scheme:dark;--bg:#16181c;--panel:#1d2025;--ink:#e8eaed;--ink2:#9aa3ad;--line:#2c3037;
 --chip:#242830;--acc-soft:#2a211f;--mark:#5a4718;--green:#6cc38b;--warn:#f0776a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,
 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;padding-bottom:80px;
 -webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
header{padding:26px 0 8px}
h1{margin:0;font-size:24px;font-weight:750;letter-spacing:-.3px}
.sub{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.65}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;border:1px solid var(--line);
 border-radius:999px;padding:3px 12px;margin-bottom:14px;background:var(--panel)}
.back:hover{color:var(--accent);border-color:var(--accent)}
#chs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}
.cb{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line);background:var(--panel);
 color:var(--ink2);border-radius:9px;padding:5px 9px;display:flex;gap:5px;align-items:baseline;line-height:1.2}
.cb b{font-variant-numeric:tabular-nums;font-weight:700;font-size:11px;opacity:.7}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cb.on b{color:#fff;opacity:.9}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px;
 border-top:1px solid var(--line);padding-top:13px}
.ttl{font-size:17px;font-weight:700;letter-spacing:-.2px}
.ttl em{font-style:normal;color:var(--ink2);font-weight:500;font-size:13px;margin-left:7px}
.acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button{font:inherit;font-size:12.5px;font-weight:650;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 11px}
.acts button:hover{border-color:var(--accent);color:var(--accent)}
.acts button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cov{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.cv1{display:flex;align-items:baseline;gap:8px;font-size:12.8px;color:var(--ink2);flex-wrap:wrap}
.cv1 b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.cvp{height:5px;border-radius:3px;background:var(--chip);margin-top:8px;overflow:hidden}
.cvp i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cov details{margin-top:4px}
.cov summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;outline:none}
.cov summary::-webkit-details-marker{display:none}
.cov summary:hover{color:var(--accent)}
.left{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.left span{font-size:12px;background:var(--chip);color:var(--ink2);border-radius:6px;padding:2px 7px;cursor:help}
.pass{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px 11px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pn{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:var(--acc-soft);
 border-radius:5px;padding:2px 6px;font-variant-numeric:tabular-nums}
.pt{font-size:14.5px;font-weight:700}
.ph .say{margin-left:auto}
.ps{margin:0}
.ps .pen{margin:0;font:16.4px/1.78 var(--serif);letter-spacing:.1px;color:var(--ink)}
.ps .pzh{margin:9px 0 0;font-size:13px;line-height:1.8;color:var(--ink2);
 padding-top:9px;border-top:1px dashed var(--line)}
.sn{padding:0;border-radius:3px;transition:background .15s}
.sn .en{color:inherit}
/* 段落版 */
body.para .ps .pen{text-align:justify;text-justify:inter-word;hyphens:auto}
body.para .sn{display:inline}
body.para .sn .zh{display:none}
body.para .ps .pzh{display:block;text-align:justify}
/* 逐句版 */
body.sent .sn{display:block;margin:0 0 12px;padding:1px 4px}
body.sent .sn:last-of-type{margin-bottom:0}
body.sent .sn .en{display:block;font:16.4px/1.62 var(--serif)}
body.sent .sn .zh{display:block;font-size:12.6px;line-height:1.55;color:var(--ink2);margin-top:2px}
body.sent .ps .pzh{display:none}
.ps .zh b,.ps .pzh b{font-weight:800;color:var(--ink)}
body.nozh .ps .pzh,body.nozh .sn .zh{display:none}
.sn.cur{background:var(--acc-soft);box-shadow:none;border-radius:3px}
.sn.cur .en{color:var(--accent)}
mark.pv{background:none;color:inherit;cursor:pointer;padding:0 1px;border-radius:2px;font-weight:680;
 box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--accent) 30%,transparent)}
mark.pv:hover{background:var(--mark);box-shadow:none}
mark.pv.on{background:var(--accent);color:#fff;box-shadow:none}
mark.pv.dv{background:none;font-weight:500;font-style:italic;box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--accent) 30%,transparent)}
body.blurred mark.pv{color:transparent;background:var(--chip);box-shadow:none;border-radius:3px}
body.blurred mark.pv.on{color:inherit;background:var(--mark);box-shadow:none}
body.para.blind .ps .pen{filter:blur(4.5px);cursor:pointer;user-select:none}
body.para.blind .ps.rev .pen{filter:none}
body.sent.blind .sn .en{filter:blur(4.5px);cursor:pointer;user-select:none}
body.sent.blind .sn.rev .en{filter:none}
.say{border:0;background:none;cursor:pointer;color:var(--ink2);padding:2px;line-height:0;border-radius:6px}
.say:hover{color:var(--accent);background:var(--acc-soft)}
.say svg{width:15px;height:15px}
.wlist{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.wlist span{font-size:11.5px;color:var(--ink2);background:var(--chip);border-radius:5px;padding:1px 6px;cursor:pointer}
.wlist span:hover{color:var(--accent)}
#pop{position:fixed;z-index:90;min-width:170px;max-width:310px;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:11px 13px;display:none}
#pop.on{display:block}
#pop .pw{font:700 16px/1.3 var(--serif)}
#pop .pm{font-size:12.8px;color:var(--ink2);margin-top:4px;line-height:1.6}
#pop .pa{display:flex;gap:6px;margin-top:9px}
#pop .pa button{font:inherit;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--panel);
 color:var(--ink);border-radius:7px;padding:4px 10px;cursor:pointer}
#pop .pa button:hover{border-color:var(--accent);color:var(--accent)}
#pop .pa button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--ink);color:var(--bg);
 font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:.22s;pointer-events:none;z-index:99;
 max-width:80vw;text-align:center}
#toast.on{opacity:.95;transform:translate(-50%,0)}
@media (max-width:620px){.wrap{padding:0 12px}h1{font-size:21px}.pass{padding:13px 13px 9px}
 .sn .en{font-size:16px;line-height:1.8}.sn .zh{font-size:12.5px}.ttl{font-size:15.5px;width:100%}
 .acts{margin-left:0;width:100%}.cb{font-size:11.8px;padding:4px 7px}}
/* ---- 本篇小测 ---- */
.qz{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.qbb{font:inherit;font-size:12px;font-weight:650;color:var(--accent);background:var(--acc-soft);
 border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);border-radius:7px;padding:3px 10px;cursor:pointer}
.qbb:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.qsc{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qsc b{color:var(--accent);font-weight:700}
.qzbox{margin-top:10px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
 border-radius:11px;padding:11px 13px 12px}
.qh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink2);margin-bottom:7px}
.qh .qn2{font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.qh .qclose{margin-left:auto;font:inherit;font-size:11.5px;background:none;border:0;color:var(--ink2);
 cursor:pointer;padding:1px 3px}
.qh .qclose:hover{color:var(--accent);text-decoration:underline}
.qq{font:15.5px/1.62 var(--serif);color:var(--ink)}
.qq .qw{font-family:var(--serif);font-size:17px;font-weight:700}
.qq .blank{display:inline-block;min-width:66px;height:1.02em;margin:0 3px;vertical-align:-3px;
 border-bottom:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
.qzh{display:block;font-size:12.4px;line-height:1.55;color:var(--ink2);margin-top:3px;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.qo button{font:inherit;font-size:13px;line-height:1.5;text-align:left;background:var(--panel);color:var(--ink);
 border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;transition:.12s}
.qo button:hover{border-color:var(--accent);color:var(--accent)}
.qo button .oi{font-size:10.5px;color:var(--ink2);margin-right:6px;font-variant-numeric:tabular-nums}
.qo button.ok{background:var(--panel);border-color:var(--green);color:var(--green);font-weight:650}
.qo button.ok .oi{color:var(--green)}
.qo button.no{border-color:var(--warn);color:var(--warn)}
.qo button.no .oi{color:var(--warn)}
.qo button.dim{opacity:.5}
.qf{font-size:12.4px;line-height:1.6;color:var(--ink2);margin-top:10px;min-height:20px}
.qf:after{content:"";display:block;clear:both}
.qf b{color:var(--ink)}
.qf i{font-style:normal;opacity:.75}
.qf .qy{color:var(--green);font-weight:700}
.qf .qn{color:var(--warn);font-weight:700}
.qf button{font:inherit;font-size:12px;font-weight:650;border-radius:7px;padding:4px 12px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink);float:right;margin-left:8px}
.qf button.prim{background:var(--accent);border-color:var(--accent);color:#fff}
.qf button:hover{filter:brightness(1.05)}
.qdone{font-size:13.4px;line-height:1.6}
.qdone b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.qbad{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.qbad span{font-size:11.5px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);
 border-radius:5px;padding:1px 7px;cursor:pointer}
.qbad span:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:620px){.qo{grid-template-columns:1fr}.qzbox{padding:10px 11px 11px}}
</style>

<script>
var TXT={"1":[{"t":"The Air We Share","s":[["The atmosphere is a thin shell of gas.","大气层是一层薄薄的气体。"],["It holds oxygen, carbon dioxide, hydrogen and a little vapour.","里面有氧、二氧化碳、氢，还有一点水蒸气。"],["Oxygen with another element forms an oxide, as it does in rust.","氧和别的元素结合就生成氧化物，铁锈就是一例。"],["Vapour evaporates from a warm road and precipitates as rain.","水蒸气从暖路面上蒸发，又凝成雨落下来。"],["Warm air rises, cool air moves in, and the whole shell circulates.","暖空气上升，冷空气补进来，整层空气就这样流动。"],["The forecast gives fifteen degrees Celsius, and the temperature matches.","预报说十五摄氏度，温度计上一分不差。"],["A mild winter needs moderate heating, a thermal shirt and a warm coat.","不冷的冬天只要适度供暖、一件保暖内衣和一件暖外套。"]]},{"t":"The Water World","s":[["Most of the globe is water, and all of it is the hydrosphere.","地球表面大半是水，这些水合起来就是水圈。"],["The ocean is one body, but a gulf is sea almost closed by land.","海洋是一整片，而海湾是几乎被陆地围住的一片海。"],["The beach, the coast and the shore all face the tide.","沙滩、海岸、岸线，都朝着潮水。"],["A warm current carries ships across the Atlantic and helps navigation.","一股暖流带着船横渡大西洋，帮着导航。"],["The Mediterranean is warm and still, and the Pacific is the deepest ocean.","地中海暖而静，太平洋是最深的大洋。"],["A brook is narrow, a stream is wider, and both rise from a cold spring.","小溪窄，小河宽，两条都发源于一眼凉泉。"],["In the rocks that spring is the source of our river.","岩缝里那眼泉，就是我们这条河的源头。"],["The water is shallow here and deep enough to drown a cow below.","这里水浅，再往下就深得能淹死牛。"],["Behind the dam a reservoir, a waterfall and a fountain throw water into the air.","坝后是水库，瀑布和喷泉把水抛到空中。"],["By morning there is dew on the grass, and a dripping tap will drain the tank.","到早上草上结了露水，龙头一直滴就能把水箱放干。"],["Marine animals live in the ocean, and rain pours onto the land.","海洋动物住在海里，雨则往陆上倒。"]]},{"t":"What Lies Under Our Feet","s":[["The lithosphere is the rocky shell, and the crust is the thin skin above it.","岩石圈是外面那层石头壳，地壳是它上面那一层薄皮。"],["Under the crust the mantle is hot, and the core is hotter still.","地壳下面地幔是热的，地核还要更热。"],["Rock melts into magma, and this volcano last erupted in 1963.","岩石熔成岩浆，这座火山上一回喷发是一九六三年。"],["A volcano is where magma finds a way out of the ground.","岩浆找到出口的地方，就是火山。"],["Seismic stations record every shake, but an earthquake is hard to predict.","地震台把每次震动都记下来，可地震还是难预料。"],["Two plates slide past each other, and the rock may crack into a gap.","两块板块互相错动，岩石就可能裂开一道缝。"],["A piece of ore from the old mine is full of mineral.","老矿里捡的矿石，里面全是矿物。"],["Quartz is clear, granite has spots, and a church floor is one slab of marble.","石英是透的，花岗岩带斑点，教堂地面是一整块大理石。"],["A pebble fits in your hand, but a magnet will not lift it.","鹅卵石刚好握手心，磁铁却吸不起来。"],["Geology begins with a handful of sediment from the bank.","地质学就是从河岸上抓一把沉积物开始的。"]]},{"t":"Lines on a Map","s":[["Lines running up and down give the longitude, and those across the latitude.","竖着走的线给出经度，横着走的给出纬度。"],["Latitude tells you how far you are from the equator.","纬度告诉你离赤道有多远。"],["The round globe is cut in two, and each half is a hemisphere.","圆的地球被切成两半，每一半叫一个半球。"],["From the hill the horizon is far off, and the altitude is on the map.","站在山上地平线很远，山有多高地图上印着。"],["Between the tropics the sun stands overhead, while the arctic and the Antarctic stay cold.","热带地区太阳直射，北极和南极则一直冷着。"],["The polar ice is thick, and the axis comes out at the pole.","极地的冰很厚，地轴从极点钻出地面。"],["Asia is the largest continent, and China fills much of the mainland.","亚洲是最大的洲，中国大陆占了很大一块。"],["Oceania is only a name for the islands of the Pacific.","大洋洲只是太平洋上那些岛的名字。"],["Italy is a peninsula, and its delta spreads where the river meets the sea.","意大利是半岛，河入海的地方摊开成三角洲。"],["A plateau is high and flat, and a plain is low and flat.","高原又高又平，平原又低又平。"],["An oasis is the only green thing in the desert.","绿洲是沙漠里唯一的绿。"],["Past the last field the land turns into wilderness, swamp and cave.","过了最后一块田，就是荒野、沼泽和山洞。"],["The cliff drops straight into the sea, and a glacier moves too slowly to see.","悬崖笔直落进海里，冰川慢得看不出来。"],["The southern coast is wet and the eastern hills are dry.","南边海岸多雨，东边山上干燥。"],["The southeast gets the most sun, and the southwest the wind.","东南日照最多，西南风最大。"],["The northeast has snowy Aprils, and the northwest keeps snow till May.","东北的四月还下雪，西北的雪要到五月才化。"]]},{"t":"Wind and Rain","s":[["Meteorology is the science of weather and climate.","气象学研究天气，也研究气候。"],["In summer the monsoon comes in from the sea and brings the rainfall.","夏天季风从海上过来，带来雨水。"],["A breeze lifts the curtains, a gust slams the gate, a gale takes the roof.","微风吹起窗帘，狂风拍上院门，大风掀了棚顶。"],["A hurricane, a typhoon and a tornado are all spinning storms.","飓风、台风、龙卷风都是打着转的风暴。"],["On a stormy night the wind will puff and drop and then blow again.","暴风雨的夜里，风一阵一阵地吹，停一下又吹。"],["Water gushes out of the broken pipe, the sky turns grey, and lightning flashes.","水从破管子涌出来，天色转灰，闪电亮了一下。"],["The thunder comes a few seconds later, and then the downpour starts.","雷声几秒后才到，接着暴雨就下来了。"],["A downpour brings more rainfall in an hour than the whole of last month.","一场暴雨一小时的雨量，比上个月一整月还多。"],["Then it began to sprinkle, and a shower left a rainbow.","接着下起零星小雨，一阵雨过去还留下彩虹。"]]},{"t":"A Dry Year","s":[["Three dry summers made this arid country worse than any drought before.","三个旱夏，让这块本来就地旱的地方比从前任何一次干旱都糟。"],["The flooding last year was hard to believe: a torrent took the bridge.","去年的洪水让人难以相信：一股急流把桥都带走了。"],["The tsunami reached the coast twenty minutes after the earthquake.","地震过后二十分钟，海啸就到了岸边。"],["Higher up, an avalanche closed the road three days after the torrent.","再往高处，急流之后的雪崩又把路封了三天。"],["A disaster of that size is not a mishap, and the damage is catastrophic.","那么大的灾难不算小意外，破坏是灾难性的。"],["The flood was a calamity for the farmers and destructive far beyond the valley.","洪水对农民是场大祸，破坏远远超出这个山谷。"],["Storms like that endanger the villages and jeopardise the fishing.","这样的风暴危及沿岸的村子，也危及渔业。"],["El Niño, warm water in the Pacific, changes the weather of half the world.","厄尔尼诺是太平洋上那片暖水，它改变了半个世界的天气。"],["A rainbow is a phenomenon you can explain, but a run of dry years is harder.","彩虹这种自然现象你能解释，连着几年干旱就难说了。"]]},{"t":"The Shape of the Land","s":[["The terrain of the north is rough, the landscape of the south soft and green.","北方地形崎岖，南方风景柔和，到处是绿。"],["The road across the plain is flat and smooth.","穿过平原的路又平又顺。"],["Then the ground turns sandy, and after that it is stony to the pass.","再往前地面变成沙土，之后一路到山口都是石头。"],["The slope is steep and almost vertical, and the path is narrow.","坡很陡，几处几乎垂直，小路也窄。"],["Two ridges run parallel to the river, and the valley between them is deep.","两道山脊跟河平行，中间的山谷很深。"],["Sheep work their way up the hillside, and the peak keeps its snow until May.","羊群慢慢往山坡上走，山峰到五月还留着雪。"],["We began to mount at four, and from the top we overlooked the mountain range.","四点我们开始爬，到了顶上整条山脉都在脚下。"],["It was a splendid view, too grand for photographs, and magnificent in the evening light.","景色极好，壮阔得照片拍不出来，傍晚更显辉煌。"],["My brother thought it was super, and I found it interesting.","我弟弟觉得棒极了，我倒觉得这一切很有意思。"],["The light changed fast, and the shadow moved in a dramatic way.","光线变得很快，山影戏剧性地扫过田野。"]]},{"t":"Cold and Damp","s":[["Frost on the window and ice in the bucket: the pond had begun to freeze.","窗上结霜，桶里结冰，池塘也已经冻上了。"],["By noon it began to hail, and by evening the lane had frozen.","到中午下起冰雹，到傍晚小路都冻住了。"],["Then the wind turned warm, the ice began to thaw, and the lane turned to mud.","后来风变暖，冰开始化，小路成了泥。"],["A chill was in the air, and I began to shiver at the gate.","空气里有寒意，我在门口站着开始发抖。"],["My hands began to tremble with the cold in that frigid place.","在那种刺骨的地方，我冻得手直抖。"],["In summer the air is humid, the walls damp, and everything outside moist by morning.","夏天空气潮，墙是湿的，放在外面的东西到早上也潮了。"],["A mist came off the river at dusk and hung in the streets.","黄昏时河面起雾，在街上挂着不散。"],["The smog is worse in winter, and the dense fume hides the houses.","冬天的烟雾更重，浓得挡住对面的房子。"]]},{"t":"A Slow Change","s":[["They deforested the slope, two wet winters came, and the surface began to erode.","山坡上的树一砍，又来了两个多雨的冬天，路面就开始侵蚀了。"],["Left alone, the damage will aggravate and the slope will deteriorate.","放着不管，损坏会加剧，坡也会一年年坏下去。"],["For now the harm is superficial, but some of the change is irreversible.","眼下坏还只在表面，可有些变化不可逆。"],["It was inevitable that the field would degrade once the hedges were cut.","树篱一砍，这块地退化就是必然的。"],["The plan is to upgrade the drainage and the hedges, but rain comes irregularly.","计划是把排水和树篱都修整一遍，可雨下得没准。"],["Cutting the trees was an inappropriate thing to do, and the result is plainly abnormal.","在那儿砍树本就不合适，结果明显不正常。"],["The hills behind the village are barren now, and the fields below are no longer fertile.","村后的山坡光秃秃的，下面的田也不肥了。"],["Nobody is left to fertilise them.","没人再给它们施肥。"],["Nature does not hurry, and what looks natural is often the work of a hundred years.","大自然不着急，看着自然的样子往往是上百年的工夫。"],["The new grass by the gate is artificial, and the flowers are synthetic.","门口新铺的草是人造的，花也是假的。"]]},{"t":"Near and Far","s":[["They left the city for a rural district.","他们离开城市，搬到乡下。"],["Now they live in a suburb with a garden.","如今住在一个带花园的郊区。"],["The rural district thins out on the outskirts, and beyond that only fields.","乡下的房子到市郊边上就稀了，再过去只剩田地。"],["The place is remote, and the nearest shop is a distant light across the valley.","那地方很偏，最近的商店是山谷对面一点远远的灯光。"],["The remote land around it is desolate, empty of everything but stone.","四周的地一片荒凉，除了石头什么都没有。"],["Our field is adjacent to the wood, and the border is a low wall.","我家那块地紧挨树林，界是一道矮墙。"],["A margin of grass runs along the wall, and a fringe of reeds lines the water.","墙边留着一条草，水边长着一排芦苇。"],["After the storm there was debris in every ditch and silt on the clay.","暴风雨过后，每条沟里都是碎枝烂叶，黏土上盖着一层淤泥。"],["The stream ran muddy for a week while the silt settled on the clay.","溪水浑了一个星期，淤泥沉在黏土上。"],["The yard was covered in dirt, and the waste from the factory was toxic.","院子里全是泥，工厂排的废物还有毒。"],["It began to contaminate the brook.","它把小溪污染了。"],["Now the pollution is measured and every pollutant written down.","如今污染能测出来，每种污染物都记在本上。"],["The environment is tested twice a year, and the surrounding villages are in the same condition.","环境一年测两次，周围的村子处境相同。"],["The situation is better than it was, though nobody calls it good.","情况比从前好些，可没人说它好。"]]},{"t":"Light Through the Day","s":[["Solar panels on the roof give us hot water from April to October.","屋顶的太阳能板从四月到十月给我们热水。"],["The lunar calendar still fixes the festivals.","过节的日子还按农历算。"],["The old people keep the calendar in their heads.","老人们把历法记在脑子里。"],["They know sunrise is at half past five, and by six the street is in sunshine.","他们知道五点半日出，六点整条街都是阳光。"],["At dusk the light goes soft, and the shadow of the church reaches the bridge.","到黄昏光线变柔，教堂的影子伸到桥上。"],["We sat in the shade of the tree until sunset.","我们在树荫里坐到日落。"],["There was an eclipse of the sun that spring, and for two minutes the birds went quiet.","那年春天有一次日食，整整两分钟鸟都不叫了。"],["At night the desert sky is a heaven of stars.","沙漠的夜空满天星斗。"],["The people there call it a paradise.","那里的人管它叫天堂。"],["The oriental garden by the lake is small and quiet.","湖边的东方园林小而安静。"]]},{"t":"Fuel for the Road","s":[["My uncle sells petrol, gas and gasoline, which all mean the same thing.","我叔叔卖汽油，这三个词说的是一样东西。"],["Petroleum is what comes out of the ground before it is refined.","石油是从地里出来、还没炼过的那个。"],["A greenhouse stays warm because the glass holds the heat in.","温室暖，是因为玻璃把热留在里面。"],["The gases from a car do much the same to the earth.","汽车排的气对地球做的差不多是同一件事。"],["A thermodynamic engine turns heat into work.","热力学发动机把热变成功。"],["The intensity of the smell told him the pipe was leaking.","气味那么冲，他就知道管子漏了。"],["By evening the garage needed an intensive clean.","到晚上铺子得彻底擦一遍。"],["Smoke began to emerge from under the bonnet.","烟从引擎盖下面冒出来。"],["A thin line of it floated past the window.","细细一缕，从窗边飘上去。"]]}],"2":[{"t":"How a Leaf Works","s":[["A leaf makes food by photosynthesis and burns it by respiring.","叶子靠光合作用造食物，又靠呼吸把食物烧掉。"],["It absorbs sunlight and carbon dioxide, releasing oxygen: a wood is a counterbalance to a city.","它吸收阳光和二氧化碳，放出氧气，一片林子对一座城就像一种抵消。"],["Water and nutrient salts come up from the root.","水和营养盐从根往上走。"],["The circulation of sap carries them up, though in winter the uptake is slow.","树液一循环就把它们送上去，只是冬天吸收也慢。"],["An enzyme acts as a catalyst, so a reaction that takes years happens in a second.","酶起催化剂的作用，本该几年才走完的反应一秒钟就成了。"],["Nobody designed this mechanism; it was found by experiment.","这个机制不是谁设计的，是实验找出来的。"],["The emission of oxygen from a single wood is considerable, and so is its energy.","一片林子放出的氧相当可观，存下的能量也一样。"]]},{"t":"Naming the Green World","s":[["Botany studies plants, and ecology studies how they live with everything else.","植物学研究植物，生态学研究它们怎么和别的东西一起活。"],["A wood, a pond and its animals make up one ecosystem, and every organism has a place.","一片林子、一个池塘和里面的动物凑成一个生态系统，里面每个生物都有自己的位置。"],["Genetics explains why an oak grows from an acorn, and variation why no two leaves match.","遗传学解释了橡树为什么只从橡子里长出来，变异则解释了没有两片叶子一样。"],["A little is mutation, and diversity is why one crop dies of one disease.","一小部分是突变，多样性则决定了只种一样庄稼会一场病全毁。"],["Gardeners use hybridisation, and botanists classify the result by flower, leaf and gene.","园艺的人用杂交，植物学家再按花、按叶、按基因归类。"],["Plants reproduce in their own time and evolve over thousands of years.","植物按自己的节奏繁殖，进化要几千年。"],["A perennial comes back every spring, so the numbers fluctuate and mean little.","多年生的植物每年春天都回来，所以数字上下浮动，说明不了什么。"]]},{"t":"The Vegetable Patch","s":[["Horticulture is the work of a garden, and the soil there is arable, deep and dark.","园艺就是园子里的活儿，那块地能耕，又深又黑。"],["She cultivates the same strip, sows the seed in April, and the harvest is a week of work.","她年年种同一条地，四月撒种，收成要忙一个星期。"],["In March a plough turns it over.","三月里用犁翻一遍。"],["A spade goes where the tractor will not fit.","拖拉机进不去的地方就换铁锹。"],["Then a rake makes it flat.","再用耙子耙平。"],["The dry grass goes into a heap by the wall.","干草堆在墙根下。"],["Behind the village the fields are cut into a terrace, one above another.","村后的山坡上，田被切成一层层梯田。"],["She plucks the herbs and picks the beans while they are still small.","她掐香草，豆子还嫩就摘。"],["The yield is more than the two of us can eat.","收成多得我们俩吃不完。"],["The onions go into a bundle and the flowers into a bunch.","洋葱捆成一捆，花扎成一束。"],["The best of them go in a vase on the table.","最好的几枝插在桌上的瓶里。"],["Salt will preserve the rest through the winter.","剩下的用盐腌着，能过一冬。"],["In a good year the beans alone can exceed a hundred kilos.","年景好的时候，光豆子就能超过一百公斤。"],["In a good year the beans alone exceed a hundred kilos, and they rear chickens too.","年景好时光豆子就超过一百公斤，院子里还养着鸡。"]]},{"t":"From Bud to Rot","s":[["In March the buds on the apple tree begin to burgeon.","三月，苹果树的芽开始鼓起来。"],["By April the tree is in blossom.","到四月满树是花。"],["The scent carries far enough for the bees to find it.","香味飘得很远，蜜蜂顺着就找来了。"],["Some herbs are aromatic, and some flowers bloom for a week at most.","有些香草气味重，有些花最多开一个星期。"],["Pollen from one flower has to reach another, and only then does the seed germinate.","一朵花的花粉得落到另一朵上，到那时候种子才发芽。"],["The fruit ripens slowly through August, and the wasps know before we do.","果子在八月里慢慢熟，黄蜂比我们更早发现。"],["By October the leaves wither and the last fruit falls.","到十月叶子枯了，最后几个果子也掉了。"],["Then the whole thing begins to decompose.","然后一切开始分解。"],["What is left rots into the soil, with a mould or a fungus doing the work.","剩下的烂进土里，霉菌也好，真菌也好，总有东西来干这活儿。"],["A tomato left on the windowsill goes stale in three days: the same decay, only faster.","窗台上搁着的番茄三天就不新鲜了，那是同一个腐烂过程，只是快些。"]]},{"t":"Wood and Grass","s":[["In the rainforest the trees are so tall that the ground stays in shade all day.","雨林里的树太高了，地面整天都在阴影里。"],["Only a shade-tolerant plant can live down there.","能在底下活的只有耐阴的植物。"],["A short-day plant waits for the nights to lengthen before it flowers.","短日照的植物要等夜变长才开花。"],["Further out the jungle gives way to a plantation.","再往外，丛林让位给种植园。"],["There one kind of tree is grown in straight lines for timber.","那里只种一种树，排成直行，为的是木材。"],["The logs are cut into charcoal, and the forestry office marks every trunk that falls.","原木烧成木炭，林务局把每一棵倒下的树都记上账。"],["It puts its logo on the stack.","在木堆上盖自己的标志。"],["A branch may break in the wind, and the bough above it still holds the nest.","风可能刮断一根树枝，上面那根粗枝上鸟窝还在。"],["Below, the grass in the meadow is cut for hay.","下面草甸的草割下来晒成干草。"],["The dry straw is kept for the animals.","干草留着喂牲口。"],["Reeds stand at the water, and a thorn hedge keeps the goats out of the field.","水边长着芦苇，一道荆棘篱笆把羊挡在田外。"],["The lawn needs cutting twice a month, and the weeds need pulling all summer.","草坪一个月要剪两回，杂草整个夏天都得拔。"],["Every tree has a root, and every root is looking for water.","每棵树都有根，每条根都在找水。"]]},{"t":"Six Plants and a Reef","s":[["The olive tree by the gate is older than the house.","门口那棵橄榄树比房子还老。"],["On the hill the pines hold the soil, and the wind through them sounds like the sea.","山坡上松树把土抓住，风穿过松林听着像海。"],["A vine climbs the wall, and by September it is heavy with grapes.","一株藤爬满墙，到九月沉甸甸地挂满葡萄。"],["A violet and a row of tulips come up every April.","一丛紫罗兰和一排郁金香每年四月都冒出来。"],["Mint grows where nothing else will, and it grows fast.","薄荷长在别的东西都长不了的地方，而且长得飞快。"],["Past the reef the water turns dark.","过了礁石水色就深了。"],["The alga on the rocks is where the food chain begins.","岩上的藻类正是食物链的起点。"],["A fungus is neither plant nor animal, and it lives by breaking things down.","真菌既不算植物也不算动物，它靠把东西分解开来过日子。"]]},{"t":"Fire, Axe and After","s":[["A bush fire started on the ridge in February and burned for four days.","二月里山脊上起了林火，烧了四天。"],["It took that long to extinguish it, and it had time to destruct a whole wood.","扑灭花了这么久，它有足够时间烧光一整片林子。"],["Fire can ruin a hundred years of growth in an afternoon.","一场火一个下午就能毁掉一百年的生长。"],["Animals that cannot run perish where they stand.","跑不掉的动物，就死在自己站的地方。"],["Afterwards the team came to demolish what was left and clear the burnt logs.","火过了，队里来拆掉剩下的东西，把烧焦的木头清走。"],["Cutting the trees would infringe the protection order and undermine twenty years of work.","在那儿砍树就是违反保护令，二十年的活儿也一点点白费。"],["Hunting once drove the wolf here close to extinction.","从前打猎，确实把这里的狼逼到过灭绝边上。"],["The pattern of the seasons has changed, and nobody can say what the outcome will be.","季节的规律变了，谁也说不准最后会怎样。"],["The impact of one dry summer is small, but the impact of five is not.","一个旱夏影响不大，连着五个就不是这么回事。"],["Conservation is cheap when it works, and far more efficient than repairing the damage.","保护做对了花不了多少钱，比起事后修补省力得多。"],["An experimental plot was fenced off, and the result was effective within two years.","他们围起一块试验地，两年就见出效果。"],["They went on to reclaim the old quarry, and the change was considerable.","接着又把废石场复垦，变化相当大。"],["In places it was massive, and the effect on the soil immense.","有些地方是巨大的，对土的影响也深。"],["It was done with maximal care and minimal cost.","这件事用的是最大的心思、最小的花费。"],["By any measure that is the optimal way to keep a wood alive.","怎么算，这都是让一片林子活下去最妥当的办法。"],["A seasonal worker knows the difference, and a productive field pays for itself.","季节工最懂这个差别，一块多产的田自己养得起自己。"],["Conditions here are favourable and the soil is protected.","这里条件好，土也保住了。"],["The surroundings are as they were before we came, which is an eco-friendly result.","周围还是我们来之前的样子，这对环境是友好的。"],["After ten years the vegetation has come back on its own.","十年之后，草木自己长回来了。"]]}],"3":[{"t":"Who Studies Animals","s":[["A biologist studies life, a zoologist animals, an ecologist how they live together.","生物学家研究生命，动物学家研究动物，生态学家研究它们怎么一起活。"],["A botanist stays with plants: the flora of a place, not its fauna.","植物学家守着植物，管的是一个地方的植物区系，不是动物区系。"],["Wildlife means all of them, and each one belongs to a species.","野生生物是这两样的统称，里面每一个都属于某个物种。"],["A creature with a backbone is a vertebrate, and a mammal feeds its young on milk.","背上有脊梁的动物是脊椎动物，其中用奶喂幼崽的是哺乳动物。"],["A primate has hands, a reptile scales, an amphibian half a life in water.","灵长类有手，爬行动物有鳞，两栖动物一半的日子在水里。"],["A carnivore eats meat and a herbivore plants; the teeth tell you which.","食肉动物吃肉，食草动物吃草，看牙就知道是哪种。"]]},{"t":"A Herd, a Flock, a Swarm","s":[["Sheep move in a flock, cattle in a herd, bees in a swarm.","羊成群，牛成群，蜜蜂也成群。"],["In summer the swarm leaves the hive and looks for a new tree.","夏天这群蜂离开蜂箱，另找一棵树。"],["At the market a throng stood by the gate and a crowd round the fruit.","集市上门边站着一大群人，水果摊前又围了一圈。"],["A beast is big; a brute will hurt you; beating a donkey is cruel.","野兽只是个头大，畜生会伤你，而打驴是狠心。"]]},{"t":"Family Lines","s":[["Every breed originates in the wolf, and the word itself stems from an old name.","每一种狗都源自狼，连这个词也是从一个古名来的。"],["All of them derive from one ancestor and run down to the descendants we keep.","它们都出自同一个祖先，一直传到我们今天养的后代。"],["Farmers breed the offspring of two kinds into a subgroup of their own.","农人把两种的后代配成一个自己的亚群。"],["Two close species interbreed where their ranges meet, and garden plants hybridise the same way.","两个近缘物种在地盘相接处杂交，园子里的植物也一样。"],["Left alone, a group will proliferate until food runs out, then sterility and disease stop it.","不去管它，一群会越繁殖越多，直到吃光食物，再被不育和疾病拦住。"],["A male finds a mate by display, and the courtship may last a week.","雄性靠展示找伴侣，求偶能拖一个星期。"],["A hen will lay and hatch her eggs in three weeks.","母鸡下蛋，三个星期一窝孵出来。"],["A fish will spawn in thousands, and the brood is not mature for a year.","鱼一次产几千个卵，而幼崽要一年才成年。"]]},{"t":"Skin, Claw and Wing","s":[["A mammal wears fur, a bird feather, a fish scales; the skin under it is thin.","哺乳动物一身毛，鸟一身羽，鱼一身鳞，底下那层皮都很薄。"],["A cat holds what it catches with a claw, a dog gives you its paw.","猫用爪子按住逮住的东西，狗会把爪子递给你。"],["A beak takes food, a fin steers, a wing lifts.","喙叼食，鳍转向，翅膀把身体带起来。"],["A pig bristle is stiff enough for a brush, but a heron plume is soft.","猪鬃硬得能做刷子，苍鹭的羽毛却是软的。"],["The hair on a lamb will curl by itself.","羊羔的毛自己就打卷。"]]},{"t":"Small Things","s":[["An insect has six legs, and a spider has eight.","昆虫六条腿，蜘蛛八条。"],["A worm comes up when it rains, and a spider builds in the shed.","一下雨蚯蚓就爬上来，蜘蛛在棚角结网。"],["A butterfly crosses the garden, a mosquito finds you at dusk, a cricket sings till midnight.","蝴蝶飞过园子，黄昏蚊子找到你，蟋蟀叫到半夜。"],["Some insects are a pest on crops, and a parasite gives nothing back.","有些昆虫是庄稼上的害虫，寄生虫则一点东西也不还。"],["A mouse lives in the wall, a rat in the drain, a squirrel in the tree.","老鼠住墙里，大老鼠在下水道，松鼠在树上。"],["A hare sits still until you are close, and only a frog likes pond and grass.","野兔蹲着不动直到你走近，只有青蛙水里草里都自在。"]]},{"t":"In the Aviary","s":[["A falcon dives faster than a hawk, and an eagle is bigger than either.","俯冲时猎隼比鹰快，论个头雕又比它们都大。"],["An owl hunts at night, a swallow all day, a sparrow on the table.","猫头鹰夜里捕食，燕子白天抓虫，麻雀在桌上捡渣。"],["Pigeons live under the bridge and crows on the roof.","鸽子住桥下，乌鸦待屋顶。"],["A swan is whiter than a goose, and a penguin cannot fly at all.","天鹅比鹅还白，公鸡四点打鸣，企鹅不会飞。"]]},{"t":"At the Zoo","s":[["A seal swims in circles while a tortoise does not move.","海豹一圈圈地游，乌龟一动不动。"],["The turtle in the tank outlives the keeper, and the whale is only a model.","缸里那只海龟比饲养员活得还久，墙上那头鲸只是个模型。"],["A kangaroo carries its young in a pocket, a camel goes a week without water.","袋鼠把孩子装口袋里，骆驼一星期不喝水。"],["The panda eats bamboo, the elephant hay and fruit.","熊猫吃竹子，大象吃干草和水果。"],["Its ivory and horn are worth more than the animal alive, so it is hunted.","象牙和角比活着的它更值钱，所以总有人打。"],["A horn is bone, and a bear coat is thick enough for snow.","角是骨头，熊的毛厚得挡得住雪。"],["The wolf walks its cage and back, while the cock in the yard calls at four.","狼在笼里走到头再走回来，院里公鸡四点打鸣。"],["The fox sleeps all afternoon; a dragon, red and gold, is on the shop wall.","狐狸睡一下午，店墙上画着一条红金的龙。"]]},{"t":"On the Farm","s":[["The cub was born in March and the calf a week later, both by the barn.","幼兽三月出生，小牛晚一星期，都在谷仓边。"],["The pup follows the shepherd, the lamb stays with the herd.","小狗跟着牧羊人，羊羔只跟羊群。"],["They keep cattle on the low field and a buffalo by the water.","低处那块地养牛，水边拴一头水牛。"],["The ox pulls the cart when the tractor breaks, and the bull is kept apart.","拖拉机一坏就靠公牛拉车，公牛单独关着。"],["A horse is saddled, a donkey harnessed, and both sleep in the stable.","马备上鞍，驴套上车，两个都睡在马厩里。"],["A zebra will never be tame, and the keeper knows it.","斑马永远驯不服，饲养员清楚。"]]},{"t":"How They Live","s":[["The behaviour of a fox is easy to watch and hard to explain.","狐狸的行为看着容易，解释起来难。"],["A cat rubs your hand, a dog barks at the gate, a lion roars at nothing.","猫蹭你的手，狗冲大门叫，狮子没来由地吼。"],["A snake will bite, and a wasp can sting more than once.","蛇会咬人，黄蜂能蜇好几下。"],["A beetle creeps under a stone and a baby crawls across the floor.","甲虫钻到石头底下，娃娃在地板上爬。"],["Its habitat is the wood and the hedge, and its nest sits in a fork.","它的栖息地是林子和树篱，窝搭在树杈上。"],["A cell is the smallest living thing, and a hive is a city of bees.","细胞是生物最小的单位，一个蜂箱则是一座蜂的城市。"],["A barrier of wire and a bar across the gate keep the rabbits out.","一道铁丝网和门上一根横木把兔子挡在外面。"]]},{"t":"Inside the Body","s":[["Anatomy begins with the bone, and a gene with the cell.","解剖学从骨头开始，基因从细胞开始。"],["An epidemic crosses a town in weeks, carried by a germ too small to see.","流行病几星期传遍全镇，带它跑的病菌小得看不见。"],["A gene passes from parent to young, but a virus is not alive at all.","基因由父母传给孩子，病毒却根本不算活的。"],["Bacteria and other microbes live on the skin and most do no harm.","细菌和其他微生物住在皮肤上，大多数不伤人。"],["Metabolism is how fast the body burns the protein and vitamin it is given.","新陈代谢是身体烧掉吃进来的蛋白质和维生素的速度。"],["A gland secretes what is needed and the kidney excretes the rest.","腺体分泌要用的，剩下的由肾排掉。"],["A wolf devours a rabbit in two minutes, and instinct tells it to.","狼两分钟吞掉一只兔子，这是本能叫它做的。"],["An intuitive jump is often right, but instinct is not knowledge.","凭直觉的一跳常是对的，可本能不算知识。"]]},{"t":"Senses and Sleep","s":[["Intelligence is what an animal does with the potential its body allows.","智力看的是动物拿身体给的那点潜力做出了什么。"],["A functional wing flies, a sensitive nose finds food in the dark.","有用的翅膀能飞，灵敏的鼻子黑夜里也找得到食。"],["A flexible body fits through a gap, and an acoustic signal carries further than light.","柔软的身体钻得过缝，声音的信号比光传得远。"],["An optical nerve carries sight to the brain; an acoustic one carries sound.","视神经把看见的送到脑子，听得见的由另一条神经送。"],["A nocturnal animal sleeps by day, a dormant one all season, and hibernation does the rest.","夜里活动的动物白天睡，休眠的能睡一整季，靠的就是冬眠。"]]},{"t":"Hunter and Prey","s":[["A hunter reads a track in the mud and a trace on a leaf.","猎人看得懂泥里的脚印和叶上的痕迹。"],["The prey listens, the predator waits, and their turns alternate.","猎物在听，捕食者在等，一年里轮流占上风。"],["The victim is usually old or young, and the young are vulnerable.","被猎杀的通常是老的或小的，幼崽本就脆弱。"],["A captive animal is fed and safe; a defensive one fights for ground.","关起来的动物有吃有安全，摆出守势的会为一块地拼命。"],["Every animal must undergo hardship and suffer cold, and that is existing.","每个动物都得经历艰难、受些冻，活着就是这样。"],["Most live at subsistence level, and a bad year hits every species.","它们大多只够糊口，年景一坏哪个物种都难。"],["We have exterminated more species than we can count.","被我们消灭的物种多得数不清。"]]}],"4":[{"t":"Looking Up","s":[["The cosmos is everything there is, and the universe is the same thing seen whole.","宇宙就是存在的一切，把它当成一个整体看，还是宇宙。"],["Our galaxy is one of billions, and interstellar space is full of dust and gas.","我们的银河系只是几十亿个里的一个，星际空间也不空，到处是尘埃和气体。"],["A celestial body is anything up there, and a terrestrial planet is rock under your feet.","天上任何一样东西都叫天体，类地行星说的则是脚下踩着石头的这种。"],["Astronomy studies all of it, and astrology only pretends to.","天文学研究的就是这些，占星术只是装作能研究。"],["On a clear night a telescope at the observatory shows a spectacle no photograph keeps.","晴朗的夜里，天文台那台望远镜给你看的景象，照片一张也留不住。"],["A planet goes round the sun in an orbit close to the ecliptic.","行星绕着太阳走，走的那条道叫轨道，离黄道很近。"],["The diameter of the earth is about twelve thousand kilometres, and the radius half of that.","地球的直径约一万二千公里，半径正好是一半。"]]},{"t":"Out There","s":[["An astronaut in orbit sees the curve of the earth below him.","轨道上的宇航员往下看，看见的是地球的弧线。"],["A comet drags a tail behind it, and the tail always points away from the sun.","彗星拖着自己的尾巴，那尾巴永远背对太阳。"],["A meteorite makes a crater, and the dust and ash stay in the air for months.","陨石落下来砸出一个坑，扬起的尘土和灰在空中要待好几个月。"],["A spacecraft is sent up in a module, and the propulsion comes from a vent.","航天器装在一个舱段里送上天，推力从尾部的喷口出来。"],["The pressure inside is one atmosphere, and the dynamics are worked out first.","舱里的压力保持在一个大气压，整个东西的动力学先在纸上算清楚。"],["Motion in space is simple, since there is no friction and nothing slows you down.","太空里的运动简单，因为没有摩擦，也没有东西让你慢下来。"],["A spaceship carries a probe for a flyby, and the sample is worth the cost.","飞船带上一个探测器，路过时掠一下，它带回来的样品值这个价钱。"],["Exploration began with somebody looking up, and an expedition needs a crew.","探索是从某个人抬头看天开始的，一次远征要带上整队人。"]]},{"t":"What Things Are Made Of","s":[["Every substance is a solid, a liquid or a fluid that flows.","物质不是固体、液体，就是会流动的流体。"],["Its composition tells you what is in it, and a compound is two elements joined.","成分告诉你里面有什么，两种元素连在一起就是化合物。"],["A particle is a small piece, a molecule a group of atoms, an atom the smallest part.","微粒是很小的一块，分子是一组原子，原子是最小的一份。"],["An ion carries a charge, an electron is part of it, and a quantum is the smallest amount.","离子带电，电子是它的一部分，量子是你能拿到的最小的一份。"],["Chemists synthesise a compound by a method they invent, and watch its formation.","化学家用自己发明的办法合成化合物，晶体的生成就趴在镜片下看。"],["A fossil is a specimen of life long ago, and the moon sample is kept in a box.","化石是远古生命留下的一件标本，月球带回来的样品则锁在盒子里。"]]},{"t":"Light and Signals","s":[["A spectrum is white light spread out in order.","光谱就是把白光按顺序摊开。"],["A dimension is one way of measuring, and frequency is how often a wave comes.","维度是量一样东西的一种方式，频率是波隔多久来一次。"],["The signal is picked up by an antenna, and a circuit turns the wave into a number.","信号由天线接住，后面的电路再把波变成一个数字。"],["Refraction bends that light as it passes from air into glass.","折射让这束光从空气进到玻璃里时拐个弯。"],["Ultraviolet light is invisible, and anything radioactive gives off what we cannot see.","紫外线我们看不见，放射性物质放出来的东西我们也看不见。"],["Two stars are distinct if you can tell them apart, and discernible if you just make them out.","两颗星分得清是一回事，勉强看得出那儿有东西是另一回事。"]]},{"t":"When It Goes Wrong","s":[["A collision at that speed would squash anything we build, and the envelope is thin metal.","那个速度撞上来，我们造得出的一切都得压扁，而舱壳不过是层薄金属。"],["A chunk of rock the size of a house came down and broke into fragments.","一块房子那么大的岩石落下来，碎成了千百片。"],["An event that size is cataclysmic, and the dust it lifts is overwhelming.","那么大的一件事是灾难性的，它扬起的尘埃压得住整整一季。"],["They do not despair and are not desperate, though it is hopeless to plan for everything.","他们不绝望，也没有走投无路，尽管想给所有情况都做准备是没指望的。"]]}],"5":[{"t":"From Primary to University","s":[["A child begins with primary education, goes on to secondary, and then to university.","孩子先受初等教育，再上中等，然后进大学。"],["A university has colleges, institutes and an academy on one campus.","一所大学里有学院、研究所，还有一座研究院，都在一个校园里。"],["People come there to learn, and some of them study engineering.","人来这里是为了学，其中有些学工程。"]]},{"t":"The First Week","s":[["A fresher enrols and registers, and the office puts a name on the roster.","新生报到注册，办公室把名字记进名册。"],["Matriculation comes before the course, and an orientation shows you where to go.","注册入学在开课之前，迎新活动告诉你该去哪。"],["Sophomores, juniors and seniors help, and alumni come back to talk.","二年级、三年级、四年级的学生来帮忙，校友也回来讲两句。"],["Accommodation means a dorm, and meals are in the dining hall or the canteen.","住宿就是宿舍，吃饭在食堂或小餐厅。"],["A tutor sorts out any problem in the first week.","第一周里有什么问题，导师帮你理清。"]]},{"t":"Learning and Teaching","s":[["You learn a subject, study for a degree, and acquire knowledge over years.","你学一门科目，为学位读书，几年下来才得到知识。"],["An expert has expertise, while a novice is only a recruit.","行家有专门的本事，新手只是刚招进来的人。"],["A literate person reads, illiteracy is the lack, and a numerate one handles numbers.","识字的人读得懂，不识字就是缺这个，会算的人拿得起数字。"],["Teachers instil habits, emphasise the basics, and cram before an exam.","老师培养习惯，强调基础，考试前再突击。"],["Good teaching enhances a skill and enables a student, and it can inspire a whole class.","好的教学提升技能、让学生学得下去，也能带动整班人。"]]},{"t":"Why Anyone Bothers","s":[["A motive is why you do something, and a problem is what stops you.","动机是你为什么做，问题是什么拦住了你。"],["Praise can motivate a class and stimulate interest, and a deadline is a spur.","夸奖能激励一个班、激起兴趣，截止日期也是一根鞭子。"],["The impetus comes from the first success.","最初的推力，来自第一次成功。"],["A system that indulges students spoils them, and that is an abuse of it.","一味纵容学生的制度会把学生惯坏，那就是滥用。"]]},{"t":"Clever, Brilliant, Notorious","s":[["An intelligent student is clever in class, and a smart one learns fast.","聪明的学生在课上机灵，伶俐的那个学得快。"],["An all-round student is good at everything, and a genius has rare ability.","全面发展的学生样样都行，天才则有一种少见的本事。"],["The elite are the best few, and an idiot is at the other end.","精英是最好的那一小撮，白痴在另一头。"],["Wisdom comes with age, and wit is a quick answer.","智慧随年纪来，机智是答得快。"],["Aptitude is natural ability, and a capable student has it.","天资是天生的一点本事，能干的学生有这个。"],["Excellent, outstanding and brilliant all mean very good.","优秀的、杰出的、卓越的，说的都是很好。"],["Prestige and reputation are what others think of you, and an eminent scholar has both.","威望和名声是别人怎么看你，有名望的学者两样都有。"],["A notorious one is famous for the wrong reason, and esteem and respect are for the right one.","名声不好的人因坏事出名，敬重和尊重则给该给的人。"],["A diligent student is painstaking, and skill comes from practice.","勤勉的学生肯下细功夫，技能是练出来的。"],["An approach is a way of doing it, and a scheme is a plan.","路子是做事的一种办法，方案则是一份计划。"]]},{"t":"The People in the Building","s":[["A headmaster runs a school, and a principal or a dean runs a college.","校长管一所学校，院长管一个学院。"],["The faculty are the teachers, and a professor sits at the top.","全体教师叫师资，教授在最上面。"],["A scholar and a scientist both research, and a mentor guides one student.","学者和科学家都做研究，导师带的是某一个学生。"],["A tutor and a lecturer teach, and a lecturer may have an assistant.","导师和讲师都上课，讲师可以带助手。"],["A candidate works for a degree, and a pupil is still at school.","读学位的人是候选人，小学生还在学校里。"],["A graduate takes a subject, a paper and a mark, and leaves the laboratory and the library behind.","毕业生拿一门科目、一份卷子、一个分数，把实验室和图书馆留在身后。"]]},{"t":"Paper That Says You Can","s":[["You qualify for a degree, and the university certifies it.","你修满条件拿到学位，学校给你出证明。"],["A license and a permit both say you may do the work.","执照和许可证都说明你可以干这行。"],["A diploma is the paper, and a ceremony hands it over.","文凭是那张纸，毕业典礼把它交到你手上。"],["A bachelor, a master and a doctor are the three degrees.","学士、硕士、博士是三级学位。"],["A diplomat speaks for a country, and an ambassador lives abroad for it.","外交官替国家说话，大使常驻国外代表国家。"],["Your credit, score, mark and grade all measure the same thing.","学分、分数、评点和等级，量的其实是同一样东西。"],["A rank puts you in order, and a course ends with a paper that proves it.","排名把你排进顺序里，一门课最后用一篇论文来证明。"]]},{"t":"The Shape of a Term","s":[["A term is half a year, a semester the same, and the timetable maps the weeks.","一个学期是半年，课程表把周次排出来。"],["The syllabus lists the lessons, and the curriculum lists the courses.","教学大纲列每一课，培养方案列各门课。"],["A seminar and a forum are for discussion, and the deadline ends an assignment.","研讨课和论坛是用来说话的，作业到截止日期为止。"],["Knowledge rests on theory, and a doctrine is a set of principles.","知识建立在理论上，教义则是一套原则。"],["A discipline has its own method, and a rudimentary level is a basic one.","一门学科有自己的一套方法，入门水平就是基础水平。"],["Fundamental and elementary mean profound at the base, not on the surface.","根本的和初等的，说的是底子上的深，不是表面上的。"],["A compulsory course is required, a selective or elective one is not, and a prerequisite comes first.","必修课是必须上的，选修课不必，先修课则要排在前面。"],["The whole system runs on a schedule fixed at the outset.","整个体系按一开始定下的日程走。"]]},{"t":"Reading for a Degree","s":[["Before a lecture you preview the chapter, and after it you review your notes.","上课前先看一遍这一章，下课后把笔记再过一遍。"],["You revise by going over it again, and inspect it closely.","复习是再过一遍，检查是凑近了看。"],["You consult a book, skim a page, and scan it for one word.","你查一本书，略过一页，再扫一遍找某个词。"],["You scrutinise every line, and recite it aloud.","细读是每一行都看，背诵是出声说出来。"],["A teacher dictates notes, and an examination, a test and a quiz all ask questions.","老师念学生记；考试、测验、小测都是在问问题。"],["A presentation is spoken, and to plagiarise is to copy the work of others.","陈述是要开口讲的，抄袭是把别人的东西复制过来。"],["You submit an essay before the deadline, and print it out.","截止日期前把文章交上去，再打印出来。"],["You learn the data for a degree.","为了一个学位，你得把数据记下来。"]]},{"t":"The Library","s":[["Literature includes the tale, the fiction and the story.","文学里有故事、小说和短篇。"],["An author writes an article for a magazine or a journal.","作者给杂志或期刊写文章。"],["A diary and poetry sit on the same shelf.","日记和诗集摆在同一个架子上。"],["A bibliography lists the sources, and the coverage tells you how wide it goes.","参考书目列出处，覆盖面告诉你它铺得多宽。"],["An encyclopedia and a biography answer different questions, and a documentary is filmed.","百科和传记回答的不是一个问题，纪录片是拍出来的。"],["A series, a record and a file keep the past in order.","一套丛书、一份记录、一个档案，把过去理成顺序。"],["A draft, a sketch and a profile are early versions, while a brochure explains.","草稿、速写、小传都是早先的版本，小册子用来说明。"],["A manual tells you how to use it.","手册告诉你这东西怎么用。"],["A frame holds a picture, and an index, a catalogue and a category sort it.","画框装画，索引、目录和类别把它分好。"],["The inventory lists the content, and the context tells you where it sits.","清单列内容，语境告诉你它在什么位置。"],["A list has chapters, a volume is one book, and a reel is film.","一份清单分章，一卷是一本书，一盘是胶片。"],["The library keeps all of it, and an experiment adds to it.","图书馆把这些都收着，一次实验再往上添一点。"]]},{"t":"Bits and Pieces of a Course","s":[["An issue and an affair are things people argue about.","议题和事务，都是人们会争论的东西。"],["A controversial question is a puzzle or a riddle, and an obscure one is hard to read.","有争议的问题像谜语，晦涩的那种则难读。"],["A platform is where you stand, and a coed campus has both sexes.","讲台是你站的地方，男女同校的校园里两种学生都有。"],["A subject is what you study, and an object is what you look at.","科目是你学的东西，对象是你看着的东西。"],["A major is your main subject, and a minor is a small one.","主修是你主要学的，副修是次要的那门。"],["A word means what you intend, and a deliberate choice is no accident.","一句话的意思是你要表达的那个，有意的选择不是偶然。"]]},{"t":"Choosing a Subject","s":[["Sociology, politics, economics, marketing, accounting and audit are all subjects.","社会学、政治、经济、市场、会计和审计，都是科目。"],["Statistics and psychology study people, and philosophy and logic study argument.","统计和心理学研究人，哲学和逻辑研究论证。"],["Biology, physics and chemistry are the sciences, and agriculture feeds us.","生物、物理、化学是理科，农业养活我们。"],["Logistics moves goods, geography maps the land, and history records the past.","物流运货，地理画地，历史记过去。"],["Engineering builds, mechanics explains motion, and electronics handles current.","工程造东西，力学解释运动，电子处理电流。"],["Maths covers arithmetic, geometry, algebra and calculus.","数学包括算术、几何、代数和微积分。"]]},{"t":"Sums and Numbers","s":[["Plus, minus, multiply and divide are the four operations.","加、减、乘、除是四种运算。"],["The sum and the total are the same, and a merger joins two into one.","和与总数是一回事，合并把两个并成一个。"],["An equation is balanced, and two identical sides are equal.","方程式是平衡的，两边一样就相等。"],["In a division the dividend is split, and the remainder is what is left over.","除法里被除数被分开，余数是剩下的那点。"],["You subtract to find the difference between two numbers.","你相减，求出两个数的差。"],["A rational number has a fraction, and a parameter is fixed while a variable changes.","有理数带分数，参数是定的，变量是变的。"],["Even and odd alternate, and the mean is the average.","偶数和奇数交替，均值就是平均数。"],["Double, triple, quadruple and multiple are all more than one.","两倍、三倍、四倍和倍数，说的都是不止一个。"],["The maximum is the most and the minimum the least, approximately.","最大值是最多，最小值是最少，大约如此。"]]},{"t":"Charts and Shapes","s":[["A chart, a graph and a diagram show numbers as a picture.","图表、曲线图、示意图，都是把数字画成图。"],["A table and a matrix keep them in rows.","表格和矩阵把数字排成行。"],["A rectangle, a cube and a triangle are shapes, and an angle sits between two lines.","长方形、立方体、三角形都是形状，角夹在两条线之间。"],["A diagonal crosses a rectangle, and a straight line is the shortest way.","对角线横穿长方形，直线是最短的路。"],["A circle is round, a dot is small, and a sphere and a cone are solid.","圆是圆的，点很小，球和锥是立体的。"],["The extent is how far it goes, and the width and length give its size.","范围是它延伸多远，宽和长给出它的大小。"],["A decimal, a fraction and a ratio give a proportion, and per cent is one in a hundred.","小数、分数和比率给出的都是比例，百分比是一百里的几。"],["The rate is how fast, and the scale sets the size.","比率讲多快，比例尺定大小。"],["An ounce measures weight, and density measures how heavy a volume is.","盎司量重量，密度量一份体积有多重。"]]},{"t":"The Bench","s":[["A quantity is how much, and quality is how good.","数量是多少，质量是好不好。"],["Mercury is a metal, and a battery gives a volt; a thermometer reads Fahrenheit.","水银是一种金属，电池给出一伏，温度计上读的是华氏度。"],["Warm objects radiate heat and emit light.","热的物体辐射热，也发光。"],["Glass is transparent, and water will displace the air in a hollow tube.","玻璃是透明的，水会把空心管里的空气顶出去。"],["Ozone sits high up, and gravity pulls things down.","臭氧在高处，重力把东西往下拉。"],["Friction slows a slide, and an eccentric wheel is off centre.","摩擦让滑动慢下来，偏心轮不在正中间。"],["Water will boil, ice will melt, and salt will dissolve.","水会开，冰会化，盐会溶。"],["Iron will rust, milk will ferment, and acid will dilute.","铁会锈，奶会发，酸会稀释。"],["A noxious gas is harmful, and a static charge does not move.","有毒的气体伤人，静电不流动。"],["An inert substance does nothing, and an inherent property is built in.","惰性的东西不起反应，固有的性质是长在里面的。"],["A component and a formula are parts, and you blend them into a mixture.","成分和配方都是部分，混合物由它们掺成。"],["Empirical work is practical, not theoretical.","实证的工作是动手的，不是空谈。"]]},{"t":"Thinking It Through","s":[["You presume, suppose or assume when you are not sure.","拿不准的时候，你就假定、设想、假设。"],["A hypothesis and a postulate are starting guesses, and to speculate is to reason on them.","假说和公设是开头的猜测，推测是拿它们往下想。"],["From them you predict what comes, and you perceive what is there.","靠它们你预判后面的事，也察觉眼前的事。"],["You detect a change, discern a pattern, and recognise a face.","你发现变化，辨出规律，认出人脸。"],["You are conscious of what you notice, and you reckon or deem by judging.","你意识到自己留意到什么，估计和认为则是下判断。"],["A sign may imply something, and a picture represents it.","一个迹象暗示着什么，一幅画则把它表现出来。"],["If you insist you will not stop, and if you persist you keep going.","坚持是不肯停，持续是一直做下去。"],["You understand an idea and comprehend the whole of it.","你懂得一个想法，也理解它的全部。"]]},{"t":"Analysing and Concluding","s":[["You analyse the parts, diagnose the fault, and infer what follows.","你拆开分析各部分，诊断出毛病，再推断后面是什么。"],["From the evidence you deduce a rule and conclude.","凭证据你推出规律，然后下结论。"],["An analogy says two things are alike, so you compare them and contrast the difference.","类比说两样东西像，于是你比较，也对照差别。"],["Where two claims overlap they agree, and a contradiction disagrees.","两个说法重合的地方是一致的，矛盾的地方则相反。"],["Two views may differ, and diverse ones add a nuance.","两种看法可以不同，多样的看法还添一点细微的差别。"],["Inductive reasoning goes from detail to rule, and a thorough study uses every example.","归纳从细节走到规律，周全的研究把每个例子都用上。"],["One instance can confirm a rule and demonstrate it, and a case may illustrate it.","一个实例能证实规律、演示它，一个案例还能说明它。"],["A symptom can manifest a cause, and a test will prove it.","症状能把病因显出来，检验则证明它。"],["You determine the answer, decide, and resolve the rest.","你定下答案，做出决定，再把剩下的解决掉。"]]},{"t":"Writing It Up","s":[["A thesis and a dissertation are long papers, and a project is smaller.","论文和学位论文都是长文章，项目则小一些。"],["A heading marks a part, and the outset is the beginning.","标题标出一部分，开头就是开始的地方。"],["An outline gives the shape, and the gist is the point.","提纲给出骨架，要点是那句话本身。"],["Your opinion goes in, and you introduce the subject.","你的看法写进去，还要把题目引出来。"],["You cite a reference, quote a line, and extract the part you need.","你引一处出处，抄一行原文，再把要的那段摘出来。"],["An abstract and a summary say it all in a page.","摘要和概要，一页就把话说完了。"],["You compose a thesis from an outline and a draft.","提纲和草稿，合成一篇论文。"],["A question may elicit an answer.","一个问题能引出回答。"]]},{"t":"Research and Money","s":[["A survey asks many people, and a questionnaire is the form.","调查问很多人，问卷是那张表。"],["You research a question, observe the result, and inquire or query when unsure.","你研究一个问题，观察结果，不确定就问、就质询。"],["You achieve and accomplish a goal, and so attain it.","达成、完成，都是把目标拿到手。"],["Credit, score, mark and grade say how good it was.","学分、分数、评点和等级，说的都是有多好。"],["A rank puts you in a row, and a queue is a row of people.","排名把你放进顺序，队列是一排人。"],["A grant pays for the work, and a fellowship or a scholarship pays for study.","拨款养研究，助研金和奖学金养读书。"],["Praise and a reward are welcome, and an award or a prize is public.","夸奖和报酬让人高兴，奖项和奖金则是公开的。"],["You appreciate the feedback, and neither underestimate nor overestimate it.","你领受这些反馈，既不高估也不低估。"],["You apply for the money and pay the fee.","你申请这笔钱，也交那笔费用。"]]}],"6":[{"t":"From the Workshop","s":[["Technology is what we can do, and a technique is how one person does it.","技术是我们能做的事，而一个人做事的具体办法叫技巧。"],["He left a polytechnic an engineer, and his friend became a mechanic.","他从理工学院出来是工程师，他朋友留在修车铺成了机修工。"],["Every advance starts with someone who innovates in a different way.","每一次进步，都从一个人用不同办法创新开始。"],["A breakthrough is when that different way turns out to work.","那条不同的路真走通了，就叫突破。"],["The first version was a gizmo the size of a shoebox, and he took out a patent.","第一版是个鞋盒大小的玩意儿，他为它申请了专利。"],["You devise a thing on paper, invent it in metal, and discover what it does.","在纸上设计出来，用金属造出来，再发现它到底能干什么。"]]},{"t":"Finding Out","s":[["A company discloses what it wants known, and reveals the rest by accident.","公司公开它想让你知道的，其余的靠意外泄露。"],["Two reporters uncovered the file, and the story exposed what had gone on.","两个记者挖出了那份文件，报道把事情揭了出来。"],["Each science has its own domain: the realm of the very small is physics.","每门学科有自己的领域：极小之物那一块属于物理。"],["The foundation of physics is one experiment in 1908.","物理的基础是一九〇八年的一次实验。"],["You specialise late, and concentrate on the basics first.","专攻要晚一点，先把基础集中打牢。"],["The lens brings light to a focus, and they utilise the waste heat.","透镜把光聚到一个焦点，他们则利用废热。"],["The lens focuses the light, and the usage of water has fallen by half.","透镜把光聚起来，用水量也已减半。"]]},{"t":"The Kit","s":[["A tester says whether it works, and a gauge says how much.","测试器说明它能不能用，计量表说明有多少。"],["A device does one job, an appliance does it in the kitchen, and equipment is the whole set.","装置干一件事，器具是厨房里那件，设备则是整套。"],["The facility has a workshop, a clean room and a tester.","这个场地有车间、洁净室，还有一台测试器。"],["An instrument measures and a tool makes; a thermometer measures, a hammer makes.","仪器是量的，工具是做的；温度计量，锤子做。"],["You calculate, a machine computes faster, and a child counts on his fingers.","你算，机器算得更快，小孩则掰手指头数。"],["You estimate with numbers, assess what you found, and evaluate what it is worth.","用数字估个大概，评估你找到的东西，再判断它值多少。"]]},{"t":"Bits and Pieces","s":[["An accessory is not needed, and a byproduct is what you get without trying.","配件不是必需的，副产品是你没打算要却得到的东西。"],["An auxiliary pump starts when the main one fails, and a versatile tool does four jobs.","主泵一坏，辅助泵就启动；万用的工具能干四样活。"],["You add the parts one at a time, and the total accumulates by Friday.","零件一件件加上去，到星期五总数就堆起来了。"],["Two men assemble the frame while a third gathers the screws.","两个人装架子，第三个人把螺丝收齐。"],["He attaches the panel, because every part belongs to a set.","他把面板装上，因为每个零件都属于某一套。"]]},{"t":"Seeing Small, Hearing Far","s":[["Optics studies light, and a microscope with a good lens shows a whole fly.","光学研究光，一台上好透镜的显微镜能把一只苍蝇整个看清。"],["Radar sends a pulse and listens for the echo, and a sensor does it quietly.","雷达发一个脉冲，听回声，传感器则悄悄做同样的事。"],["Multimedia is sound and picture, and the network carries both to the screen.","多媒体是声音加画面，网络把两样送到屏幕上。"],["You open a browser on a microcomputer or a laptop, and the software does the rest.","在微型机或笔记本上打开浏览器，剩下的交给软件。"],["The keyboard clicks, the screen lights up, and the loudspeaker repeats the microphone.","键盘响，屏幕亮，扬声器把话筒收的声音放出来。"],["An old cassette and a reel of tape kept the sound, and a dial found the station.","从前用盒式磁带和一卷带子存声音，靠旋钮找台。"],["Everything inside is binary, so the signal is digital.","里面一切都是二进制的，所以信号是数字的。"],["Wireless means no cable, and high-definition means you can count the hairs.","无线就是没有线，高清就是你数得清毛发。"],["Audio is what you hear and vision is what you see.","音频是你听到的，视觉是你看到的。"],["A fantasy film puts audio and vision in a place that never existed.","幻想片把声音和画面放进一个从不存在的地方。"],["Science fiction was right about the telephone and wrong about almost all the rest.","科幻小说猜对了电话，其余几乎全错。"]]},{"t":"Water, Air and Steam","s":[["A pump moves water up, and a generator turns the fall into power.","泵把水往上送，发电机把落下来的水变回电。"],["The gear turns the shaft, and the shaft turns on a pivot.","齿轮带动轴，轴在一根枢轴上转。"],["A pump feeds the hydraulic lift, which holds a car at any height.","泵给液压升降机供压，能把车停在任意高度。"],["Drainage was put in before the houses, and the sewage goes the other way.","排水管在盖房子之前就埋好了，污水则走另一条路。"],["Ventilation lets air in, and drainage lets water out.","通风让空气进来，排水让水出去。"],["Compress the gas and it warms; condense it and you have liquid again.","把气体压缩它就热，冷凝下来又成了液体。"],["They refine the oil, purify the water and filter the air.","他们炼油、净水、滤气。"],["You distil by boiling and catching what comes off, and simplify the pipe.","蒸馏是把东西烧开，接住冒出来的部分；再把管子简化。"],["The machine has three modes, and the prototype had two.","这台机器有三种模式，样机那时只有两种。"],["A prototype is built to fail, and the framework is what you keep.","样机就是造来出毛病的，留下的那个框架才是你的。"],["Every aspect was checked in the first phase, and the second changed it all.","第一阶段的每个方面都查过，第二阶段又全改了。"],["One person operates it while two watch, and a handle facilitates the lift, which transforms the job.","一个人操作，两个人在旁看，一个把手让抬起容易，把活儿整个改了。"],["You can convert it to gas, alter the speed, shift the weight and turn it round.","可以把它改成烧气，改速度，挪重心，再转个方向。"],["You cannot adapt it to salt water, and every new owner adjusts something.","它没法改成用海水，每个新主人也都会调点什么。"]]},{"t":"When It Goes Wrong","s":[["She could pinpoint the fault in a minute, and she was accurate every time.","她一分钟就能指出故障在哪，而且每次都准。"],["The figure has to be precise, because a rough estimate is worse than none.","数字必须精确，马马虎虎的估计还不如没有。"],["The correct reading is on the left, and the one on the right is wrong.","正确的读数在左边，右边那个是错的。"],["An error in the third line made the table useless, and it was a mistake anyone could make.","第三行一个错误让整张表没用了，而这是谁都会犯的错。"],["There is a flaw in the metal, and the fault is not in the design.","金属里有瑕疵，毛病不在设计上。"],["He stumbled on the step and dropped the box, and the fault was his own.","他在台阶上绊了一下，把箱子摔了，毛病出在他自己。"],["We keep a spare part for a contingency, because the circumstance will come up.","我们留一个备件应付意外，因为那种情形早晚会来。"]]}],"7":[{"t":"What a People Leaves Behind","s":[["Culture is what a people does without thinking, and civilisation is what it writes down.","文化是一群人不用想就做的事，文明是他们把它写下来的样子。"],["The renaissance was a century of old books, when Europe read its own epic again.","文艺复兴是旧书的一个世纪，那时候欧洲又重新读起自己的史诗。"],["An epic is a long poem about one hero, and every nation keeps one in its tradition.","史诗是讲一个英雄的长诗，每个民族的传统里都留着一首。"],["An ideology is a set of ideas that explains everything, and it soon becomes a tradition.","意识形态是一套什么都解释得通的想法，它很快就会变成一种传统。"],["A tradition is what your grandmother did, and a convention is what everyone does.","传统是你奶奶做过的事，惯例是大家都在做的事。"],["A custom belongs to one village, and a foreigner meets it as a strange habit.","风俗只属于一个村子，外来的人碰上它，会觉得是个古怪的习惯。"]]},{"t":"Orders Old and New","s":[["Under feudalism the land belonged to one family, and the tribe became a village.","封建制度下，土地属于一个家族，部落慢慢变成了村庄。"],["Slavery was older than feudalism and lasted longer than any empire.","奴隶制比封建制度更早，也比任何一个帝国活得都久。"],["An ethical rule asks what is right, and a moral one asks who is hurt.","伦理的规矩问的是什么算对，道德的规矩问的是谁受了伤。"],["Every tribe has an ethical code, and every empire writes it down as law.","每个部落都有一套伦理，每个帝国都把它写成法律。"]]},{"t":"Who Was Here First","s":[["The aboriginal inhabitants were here first, and every native plant is theirs by right.","土著居民最早住在这里，本地每一种植物按道理都是他们的。"],["An inhabitant of the coast eats fish, and a local market sells what the sea gives.","住在海边的人吃鱼，本地市场卖的就是海里给的东西。"],["An exotic plant arrives from another country and pushes the native ones out.","外来的植物从别的国家进来，把本地的植物挤出去。"],["A foreigner is a stranger with a passport, and an alien is a stranger with no welcome.","外国人是拿着护照的陌生人，外侨是没人欢迎的陌生人。"],["The aboriginal people keep their own names for the hills, and the local map ignores them.","土著给每座山都取了自己的名字，本地的地图不理这些名字。"]]},{"t":"Reading the Past","s":[["An anthropologist lives with a tribe for a year and writes down its customs.","人类学家跟一个部落住上一年，把它的风俗记下来。"],["A humanitarian gives food and medicine, and asks nothing about belief.","人道主义者送粮食和药，不问对方信的是什么。"],["Heritage is what a generation inherits and must hand on.","遗产是一代人继承下来、还得再交下去的东西。"],["A son inherits the house, the land and a box of antique tools.","儿子继承房子、土地，还有一箱古董工具。"],["Archaeology reads a city from its rubbish, and a museum keeps what it finds.","考古学从垃圾里读一座城，博物馆把它挖出来的东西收着。"],["They excavate a grave, lift the pottery out, and label every piece.","他们挖开一座墓，把陶器取出来，一件一件贴上标签。"],["A name is engraved on the bowl, and a pattern decorates the rim.","碗上刻着一个名字，碗沿上装饰着花纹。"],["Pottery is the cheapest antique in the museum and the easiest to date.","陶器是博物馆里最便宜的古董，也最好断年代。"]]},{"t":"Faith and Ritual","s":[["Religion answers where the soul goes, and ritual says what to do before it goes.","宗教回答灵魂去哪儿，仪式说的是走之前该做什么。"],["Etiquette is ritual with the god taken out and the guests left in.","礼仪是把神拿掉、把客人留下的那种仪式。"],["A belief needs no proof, and a spirit needs no body.","信仰不需要证据，灵魂不需要身体。"],["A sacred hill is hallowed ground, and holy water is water that has been blessed.","一座神圣的山是受崇敬的地方，圣水是祝过福的水。"],["The soul is what a religion says survives the body.","灵魂是宗教说能活过身体的那一部分。"]]},{"t":"The Church and Its People","s":[["The pope sits in Rome, and a bishop runs one city under him.","教皇坐在罗马，主教替他管一座城。"],["A missionary travels with a bible and no money, and a priest stays with his church.","传教士带着一本《圣经》上路，身上没钱；神父留在自己的教堂里。"],["A monk copies books in a cold room and sings in the choir on Sunday.","僧侣在冷屋子里抄书，礼拜天在唱诗班里唱。"],["A cathedral is a church built to be taller than the town.","大教堂是盖得比全城都高的教堂。"],["A temple holds many gods, and a pagoda holds one bell.","庙里供着很多神，塔里挂着一口钟。"],["A small church has one priest, and a cathedral has a bishop and a choir.","小教堂只有一个神父，大教堂有主教，还有唱诗班。"]]},{"t":"Crowns and Dynasties","s":[["An empire is many countries under one emperor, and a dynasty is one family in a row.","帝国是很多国家归一个皇帝管，王朝是连着坐龙椅的一家人。"],["An imperial road runs from the capital to the edge of the empire.","御道从都城一直通到帝国的边界。"],["A king rules by blood, a queen by blood or marriage, and a royal wedding ends a war.","国王靠血统当王，女王靠血统或婚姻，一场王室的婚礼能了结一场战争。"],["A prince waits for the throne, and a princess is married to a stranger.","王子等着王位，公主被嫁到一个陌生人家里。"],["Majesty is the word you use to a king, and nobility is the class behind him.","“陛下”是对国王用的称呼，贵族是站在他身后的那个阶层。"],["A lord owns the village, and a knight owns a horse and a sword.","领主拥有这个村子，骑士拥有一匹马和一把剑。"],["Chronology puts the kings in order and the empire into a line of dates.","年代学把国王们排好顺序，把帝国排进一串日期里。"]]},{"t":"Old Homes, New Lives","s":[["A guardian is the adult who signs, whatever the child has in his background.","监护人是在表格上签字的那个大人，不管这孩子背景如何。"],["Nostalgia is a soft ache for the past, and a homesick child wants the old kitchen.","怀旧是对过去一种轻轻的疼，想家的孩子要的是那间老厨房。"],["A celebrity has status and no privacy, and a neighbour has neither.","名人有地位，没有隐私；邻居两样都没有。"],["Status buys a better table, and background decides who is asked to dinner.","地位换来一张好桌子，背景决定谁被请去吃饭。"],["Experience is what an old man has instead of a diploma, and he tells it as an anecdote.","阅历是老人没有文凭却有的东西，他把它讲成一段趣闻。"]]},{"t":"Accident and Fortune","s":[["An accident is an incident nobody planned, and both end up in the same report.","意外是没人计划过的事件，两样最后都写进同一份报告。"],["A family thrives in good years and keeps its prosperity for three generations.","一家人在好年景里兴旺，把这份繁荣留了三代。"],["A setback costs a year, and adversity costs a man his confidence.","一次挫折让人损失一年，逆境让人损失信心。"],["Trade brings prosperity, war brings setback, and a bad harvest brings both.","贸易带来繁荣，战争带来挫折，一场坏收成两样都带来。"],["A town thrives on a river, and the river decides when the adversity comes.","城镇靠一条河兴旺，什么时候来逆境也由这条河决定。"]]}],"8":[{"t":"Marks and Signs","s":[["Language is a system of signs, and a symbol stands for something it does not look like.","语言是一套符号，一个象征代表的东西，长得并不像它。"],["A sign on a door tells you where to go, and a gesture tells you without words.","门上的牌子告诉你往哪走，手势不用词也能告诉你。"],["Handwriting is a person's own sign, and no two are quite alike.","笔迹是一个人自己的标记，没有两个人的笔迹一样。"],["A pictograph is a small drawing of the thing, and a wedge is a mark pressed into clay.","象形文字就是那个东西的一张小画，楔形字是压进泥板里的一道痕。"],["A knot in a string can carry a sign, and a knot in a rope carries a weight.","绳子上打个结能带一个信儿，粗绳上的结承的是重量。"]]},{"t":"The Science of Language","s":[["Linguistics studies language as a system, not as a list of words.","语言学研究的是把语言当成一套系统，不是当成一串词。"],["Semantic change moves the meaning of a word, and syntax moves its place.","语义的变化挪动一个词的意思，句法挪动它站的位置。"],["Grammar is the rule, and syntax is the order the rule works in.","语法是那条规矩，句法是这条规矩起作用的顺序。"],["Phonetics measures the sound, and you pronounce a word the way the sound allows.","语音学量的是声音，一个词怎么念，要看这个音允许你怎么念。"],["Intonation rises at the end of a question, and inflection changes the shape of a word.","问句末尾的语调是升的，屈折变化改的是一个词的形状。"]]},{"t":"Sounds and Accents","s":[["A dialect belongs to a place, and an accent belongs to a mouth.","方言属于一个地方，口音属于一张嘴。"],["An utterance is one stretch of speech, and oral language is older than writing.","一句话是一段连着说出来的话，口头语言比文字更老。"],["A verbal agreement is oral and unwritten, so nobody can prove it later.","口头的约定是嘴上说的、没写下来的，所以后来谁也证明不了。"],["A syllable is one beat, and a phoneme is one sound that changes meaning.","一个音节是一下拍子，一个音位是能改变意思的一个音。"],["A vowel is open, a consonant is closed, and English writes five vowels.","元音是张开的，辅音是闭住的，英语只写五个元音字母。"],["The alphabet is a short list of letters, and a logogram is one sign for one word.","字母表是一张短短的字母清单，词符是一个符号管一个词。"]]},{"t":"Words and Their Parts","s":[["Vocabulary is the words you know, and a dictionary is the words you could know.","词汇量是你已经知道的词，词典是你可以知道的词。"],["An idiom means something other than its words, and a phrase is just a group of them.","成语的意思不在字面上，短语就是一组词凑在一起。"],["A clause has a verb in it, and a phrase has none of its own.","从句里有一个动词，短语自己没有动词。"],["An expression is a phrase with a face behind it.","一个说法是一个短语，后面还站着一张脸。"],["Tense puts an action in time, and a prefix puts a word in front.","时态把动作放进时间里，前缀把词放在前头。"],["A suffix ends a word, and an abbreviation cuts it short.","后缀收住一个词，缩写把它截短。"],["A synonym means the same, and an antonym means the opposite.","同义词意思一样，反义词意思相反。"]]},{"t":"Parts of Speech","s":[["A noun names a thing, and a pronoun takes its place.","名词给一个东西命名，代词替它站那个位置。"],["Singular means one, plural means more, and English marks the difference on the noun.","单数是一个，复数是更多，英语把这个区别标在名词上。"],["A verb says what happens, and an adjective says what it is like.","动词说发生了什么，形容词说它是什么样。"],["An adverb says how, and a preposition says where.","副词说怎么，介词说在哪儿。"],["A conjunction joins two clauses, and a comma is not a conjunction.","连词把两个从句连起来，逗号不是连词。"]]},{"t":"Talking About Language","s":[["English spelling is not consistent, and its rules are more complicated than they look.","英语拼写前后不一致，它的规则也比看上去复杂。"],["A complex sentence has more than one clause, and a complicated one hides its meaning.","复杂句不止一个从句，讲得绕的句子把意思藏起来。"],["They compile a dictionary over twenty years and publish a new version every ten.","他们用二十年编一本词典，每十年出一个新版本。"],["You translate by carrying meaning across, and you paraphrase by carrying it in other words.","翻译是把意思搬到另一种语言，改述是换一套话把意思搬过去。"],["You interpret a speech as it is spoken, and you narrate a film after it is made.","口译是话一出口就跟着译，旁白是片子拍完了再讲。"],["A good example illuminates a rule better than a page of grammar.","一个好例子把一条规则照亮，比一整页语法管用。"],["They decipher a broken tablet and find a language nobody has spoken for years.","他们破译一块碎了的泥板，找出一门多年没人说的语言。"],["Eloquence wins a hall, but the side that can negotiate wins the deal.","口才在礼堂里能赢，可真正谈成生意的是会谈判的那一边。"]]},{"t":"In Conversation","s":[["You communicate a fact in one line, and a discussion takes an hour.","一个事实一句话就说清了，一场讨论要花一个小时。"],["They brainstorm for an hour, then negotiate the shortlist down to two.","他们集思广益一个小时，再把候选名单谈到只剩两个。"],["A commentary follows the game, and a debate follows the commentary.","解说跟在比赛后面，辩论跟在解说后面。"],["A contention is a claim you defend, and a debate is where you defend it.","一个论点是你要守住的主张，辩论就是你守它的地方。"],["Talking is not a discussion, and shouting is not a debate.","说话不等于讨论，喊叫不等于辩论。"]]}],"9":[{"t":"The Press","s":[["A medium carries a message, and the press carries it to a million people.","媒介把一条消息带出去，新闻界把它带给一百万人。"],["A journalist goes and looks, and a correspondent stays in one city and sends the news back.","记者是自己跑去看，通讯记者守在一座城里，把消息发回去。"],["A critic says what he thinks and signs his name; a commentator just talks.","评论家说出他怎么想，还署上名字；评论员只是说。"],["An exponent of a style can explain it, and a critic can only explain.","一种风格的阐述者讲得清它，也还做得出；评论家只会讲。"],["An announcer reads the names out, and a messenger runs with a page.","广播员把名字念出来，送信的人拿着一页纸跑。"],["An editor cuts the piece, and a typist types what the editor cut.","编辑把稿子删一遍，打字员把编辑删完的稿子打出来。"]]},{"t":"Handing It Out","s":[["A handout is free, a leaflet is thin, and both end up in a bin.","讲义是白送的，传单是薄薄一张，两样最后都进了垃圾桶。"],["Propaganda tells one story until nobody checks it, and then it is published everywhere.","宣传是把一个说法讲到没人去核实，然后到处发表。"],["You publish a report and disseminate it to every office in the country.","你把一份报告发表出来，再散发到全国每一个办公室。"]]},{"t":"Waiting for It","s":[["You foresee a storm and anticipate the damage, but you prevent neither.","你预见到一场风暴，预料到损失，可两样都拦不住。"],["You expect a letter and await the post, and the post comes at four.","你盼着一封信，等着邮差，邮差四点来。"]]},{"t":"A Good Evening","s":[["A pastime fills an hour, and a recreation fills a Sunday.","消遣填满一个小时，娱乐填满一个礼拜天。"],["You entertain guests and amuse a child, and neither wants to be taught anything.","你款待客人，逗孩子乐，两边都不想被教什么。"],["Gossip is a rumour with names in it, and both travel faster than the news.","流言是带着名字的谣言，两样都比正经消息传得快。"],["A consensus is quieter than gossip and slower than a rumour.","共识比流言安静，也比谣言慢。"]]},{"t":"Festival Night","s":[["A festival lasts a week, and a feast lasts one evening.","节日过一整个礼拜，一顿盛宴只有一个晚上。"],["A programme lists what happens, and a rehearsal makes sure it happens.","节目单列出要演什么，排练保证它真能演出来。"],["They perform on Saturday, and a rehearsal on Friday makes it look easy.","他们礼拜六演出，礼拜五的排练让这事看着不难。"],["A child imitates what he sees, and a comic mimics a man in the same room.","孩子模仿他看见的东西，滑稽演员模仿的是同屋里的那个人。"],["A machine can simulate a voice, and a bad actor can only imitate one.","机器能模拟一个声音，蹩脚演员只能照着学一个。"],["A circus has three rings, and magic needs a sleeve.","马戏团有三个场子，变魔术得有一只袖子。"]]},{"t":"Stage and Screen","s":[["A drama is spoken, an opera is sung, and a ballet says it without either.","戏剧是说出来的，歌剧是唱出来的，芭蕾两样都不用就说了。"],["A concert fills a hall, and a symphony needs an orchestra to fill it.","一场音乐会坐满一个厅，一部交响乐得靠一个乐团才坐得满。"],["A comedy ends with a wedding, and a tragedy ends with a body.","喜剧以一场婚礼收场，悲剧以一具尸体收场。"],["A film is shot in pieces, and a movie is what you sit through.","电影是一段一段拍出来的，片子是你坐着看完的那个东西。"],["Animation draws every frame, and an X-rated film draws a line at the door.","动画一帧一帧画出来，X 级电影在门口划一道线。"]]},{"t":"Made by Hand","s":[["An artist wants an idea, and a craftsman wants a good joint.","艺术家要的是一个想法，工匠要的是一个好接口。"],["A painter mixes colour, and a craftsman measures twice.","画家调颜色，工匠量两遍。"],["A play gives each actor one role and each room one scene.","一出戏给每个演员一个角色，给每个房间一场。"],["A painter works in a gallery, and an actor works on a stage.","画家在画廊里干活，演员在舞台上干活。"],["A gallery hangs what it owns, and an exhibition borrows what it does not.","画廊挂自己有的东西，展览借自己没有的东西。"],["You collect what you like, select what you can afford, and opt for the cheaper frame.","你收集喜欢的，挑买得起的，最后选那个便宜点的画框。"],["An aesthetic rule cannot be written down, and a gallery rarely tries.","审美的规矩写不下来，画廊也很少去写。"]]},{"t":"Pictures","s":[["A photograph catches a second, and a portrait takes a week.","照片抓住一秒钟，肖像要画一个礼拜。"],["A painting is flat, and a sculpture has a back you must finish.","画是平的，雕塑有个背面，你非做完不可。"],["You draw a line and carve a groove, and both are ways of finding an edge.","你画一条线，刻一道槽，两样都是在找一条边。"],["A good picture depicts a person, and a good caption describes him.","好画描绘一个人，好说明写清楚他。"],["A jazz band improvises, and an orchestra reads what is written.","爵士乐队即兴，管弦乐队照着写好的来。"]]},{"t":"The Band","s":[["A musical family keeps a piano in the hall and a guitar in the kitchen.","一个懂音乐的家，客厅放钢琴，厨房放吉他。"],["Classical music needs a score, and jazz needs a night.","古典音乐要一份谱子，爵士要一个晚上。"],["Rock fills a stadium, hip-hop fills a street, and pop fills both.","摇滚坐满体育场，嘻哈挤满一条街，流行两样都满。"],["A lyric is the words, and a melody is the line they sit on.","歌词是那些词，旋律是这些词坐着的那条线。"],["Rhythm is what your foot does, and tone is what your ear notices first.","节奏是你脚在做的事，音色是你耳朵先注意到的。"],["A band has five players, and a solo has one.","乐队有五个人，独奏只有一个人。"],["The tone is the colour of a note, and the tune is the order of the notes.","音色是一个音的颜色，曲调是这些音排的顺序。"],["A disc holds twelve songs from one band, and a scratch ruins all twelve.","一张唱片装一支乐队的十二首歌，一道划痕全毁。"]]},{"t":"Instruments","s":[["A piano has eighty-eight keys, and a violin has four strings.","钢琴有八十八个键，小提琴有四根弦。"],["A cello is a violin that grew up, and a guitar is what you take to a party.","大提琴是长大了的小提琴，吉他你带去聚会上弹。"],["A harmonica fits in a pocket, a flute fits in a bag, and a drum fits nowhere.","口琴装得进口袋，长笛装得进包，鼓哪儿都装不下。"],["A trumpet is loud, a flute is soft, and the drum decides when both stop.","小号响，长笛轻，什么时候停由鼓说了算。"]]},{"t":"The Games","s":[["A competition is one afternoon, and a tournament is two weeks.","一场比赛是一个下午，一次锦标赛是两个礼拜。"],["The Olympic Games need a sponsor, a stadium and ten thousand volunteers.","奥运会要一个赞助商、一座体育场，还要一万个志愿者。"],["A patron pays for the hall, and a sponsor pays for the shirt.","赞助人付场地的钱，赞助商付球衣的钱。"],["An athlete trains for four years, and a champion is the one who sleeps well.","运动员练四年，冠军是那个睡得着的人。"],["A spectator buys a ticket, and a volunteer gets in free.","观众买票进场，志愿者不用买票。"]]},{"t":"Famous and Fit","s":[["A champion is famous for a year, and a well-known face for ten.","冠军出名一年，一张人人都认得的脸能出名十年。"],["An energetic child runs all day, and a vigorous man is still running at sixty.","精力旺的孩子跑一整天，健旺的人六十岁还在跑。"],["A stadium seats fifty thousand, and a gym seats nobody.","体育场能坐五万人，健身房一个座位也没有。"],["Training is boring, and exercise is what you do when training is too boring.","训练很闷，训练闷到受不了的时候，你就去锻炼。"],["An indoor court costs money to light, and an outdoor one costs money when it rains.","室内场馆花钱点灯，室外场地一下雨就花钱。"]]},{"t":"Body Work","s":[["A mobile joint moves freely, and a movement is one clear line of the body.","能动的关节转得开，一个动作是身上一条干净的线。"],["Yoga is slow, and a sprawl on a sofa is slower.","瑜伽慢，摊在沙发上比它更慢。"],["You stretch before a run and strain a muscle after it.","跑之前你拉伸，跑之后你拉伤。"]]},{"t":"Balls and Rackets","s":[["Chess has no ball, billiards has sixteen, and golf has one you lose.","国际象棋没有球，台球有十六个，高尔夫有一个，还会丢。"],["Soccer needs a goal, hockey needs a stick, and volleyball needs six hands.","足球要一个球门，曲棍球要一根棍，排球要六只手。"],["Tennis needs a racket, badminton needs a lighter one, and baseball needs a bat.","网球要球拍，羽毛球要轻一点的球拍，棒球要一根球棒。"]]},{"t":"Kick and Toss","s":[["You kick a ball, knock on a door, and flip a coin.","你踢球，敲门，抛硬币。"],["You pitch a ball underhand, throw it overhand, and toss it to a child.","你低手投球，上手扔球，随手抛给孩子。"]]},{"t":"On Ice","s":[["You slide on ice, slip on a wet floor, and glide when you do it well.","你在冰上滑，在湿地板上滑倒，滑得好的时候叫滑行。"],["You ski downhill, skate on a rink, and tumble when you try both at once.","你往山下滑雪，在冰场上溜冰，两样一起来就摔。"],["Cycling is faster than walking, and a dive is faster than both.","骑车比走路快，跳水比两样都快。"],["A boat can drift for a week, and a leaf glides down a stream in an hour.","船能漂一个礼拜，一片叶子顺水滑一个钟头就到头。"]]},{"t":"Jumping","s":[["You jump over a puddle and leap over a wall.","你跳过一摊水，跃过一堵墙。"],["You hop on one leg, and a ball bounces off a wall.","你单腿跳，球从墙上弹回来。"],["A stone plunges to the bottom, and a leaf bounces on the top.","石头一下沉到底，叶子在水面上弹。"]]},{"t":"On the Move","s":[["You camp under a tent for a week and learn what rain is.","你在帐篷底下露营一个礼拜，就知道雨是什么了。"],["A picnic needs a blanket, and a hunt needs a dog.","野餐要一块毯子，打猎要一条狗。"],["A race is short, a marathon is long, and a pedestrian crosses both.","赛跑短，马拉松长，行人两样都得穿过去。"],["A slow pace is a walk, and a quick step is a hurry.","慢的步速是散步，快的一步是赶路。"],["An excursion lasts a day, a trip lasts a week, and a vacation lasts a month.","远足一天，旅行一个礼拜，假期一个月。"],["A cruise stops at four ports, and a hike stops at the top.","航游停四个港口，远足停在山顶上。"]]},{"t":"Slow Walking","s":[["You jog to stay fit and stride to get somewhere.","慢跑是为了身体，大步走是为了到地方。"],["You wander without a map and linger without a reason.
