counts, and the fireman is the only one running towards it.","裁判决定，出纳数钱。而消防员，是唯一往那边跑的人。"],["The nurse works nights, the gardener comes on Thursdays, and the barber gives the same haircut to everybody.","护士上夜班，园丁周四来。而理发师，给每个人剪同一个发型。"],["The fisherman is out at four, the butcher opens at six, and the groom is the only one in a suit.","渔夫四点出海，屠夫六点开门。而新郎，是唯一穿西装的。"]]},{"t":"The Bottom","s":[["The hostage was kept for nine days and released without a word.","人质被扣了九天。一句话没说，就放了。"],["Years of toil in the same field will break a man quietly.","在同一块地里苦干多年，会把人悄悄磨垮。"],["A beggar asks and a slave is not asked, and the second one is the older arrangement.","乞丐，是求人。奴隶，是没得求。而后者，是更老的安排。"],["A coward runs and lives, and the word was written by the ones who stayed.","懦夫跑了，活了下来。而这个词，是留下的人写的。"]]}],"20":[{"t":"The First Day","s":[["On his first day at the office, Tom had no idea how to act.","上班第一天，汤姆完全不知道该怎么做。"],["He watched the others and tried to behave in the same quiet way.","他观察别人，学着用同样安静的方式举止做事。"],["A small deed often stays in the mind longer than a big speech.","一件小小的好事，往往比一场大演讲在脑子里留得更久。"],["It takes about a month to accustom yourself to a new workplace.","大概要一个月，才能让自己习惯一个新的工作地方。"],["When the printer stopped, everyone waited to see how he would react.","打印机一停，所有人都等着看他有什么反应。"],["His boss asked a question, and he responded in two short sentences.","上司问了一个问题，他用两句话就回应了。"],["That night, on the bus home, he began to reflect on the whole day.","那天晚上在回家的公交车上，他开始回想这一整天。"]]},{"t":"Looking at Things","s":[["In the museum, a guard will glare at anyone who leans too close to a painting.","在博物馆里，谁靠画太近，保安就会瞪他。"],["I only caught a glimpse of the famous picture before the crowd pushed me on.","人潮把我往前推，那幅名画我只瞥见一眼。"],["A quick glance told me the room was empty, so I went in.","随手扫了一眼，我就知道房间是空的，于是走了进去。"],["The child tried to peep through the keyhole of the old door.","小孩想从旧门的钥匙孔往里偷看。"],["Her mother stood at the window and gazed at the snow for a long time.","她妈妈站在窗边，久久凝视着雪。"],["My father peered at the map because the light in the car was poor.","车里光线不好，我爸凑近了去看地图。"],["People say it is rude to stare, but on a train everyone stares at strangers.","人们说盯着人看不礼貌，可火车上谁都会盯着陌生人看。"],["He sat down to contemplate the offer and said nothing for ten minutes.","他坐下来考虑这份工作，十分钟一句话都没说。"]]},{"t":"The Garden Behind the House","s":[["We adopted a thin grey cat from the street last winter.","去年冬天，我们从街上收养了一只瘦瘦的灰猫。"],["My grandfather mows the small lawn behind the house every Sunday.","每个星期天，爷爷都会修剪屋后那块小草坪。"],["The old fence needs one more post to support it.","旧篱笆还得再加一根柱子才撑得住。"],["He waters the roses, and a little water can revive a plant that looks dead.","他给玫瑰浇水，一点点水就能让看着枯了的植物活过来。"],["Good soil will nourish them better than any powder from a box.","好土比盒子里的任何肥粉都更能滋养它们。"],["After he pulls the weeds, he stands still and exhales slowly.","拔完草，他会站一会儿，慢慢把气呼出来。"],["Few plants survive a cold night without some kind of cover.","没有点遮盖，很少有植物能熬过寒冷的夜。"],["His doctor also told him to watch his intake of salt.","医生还让他注意盐的摄入量。"]]},{"t":"A Promise and a Signature","s":[["Before the wedding, the couple made a vow in front of both families.","婚礼前，两个人在两家人面前立下誓言。"],["An oath is the same thing, only it is spoken in a court or before a judge.","宣誓也是同一件事，只不过要在法庭上或法官面前说。"],["They also gave a pledge to look after each other in the bad years.","他们还做出保证，说日子难过的年份也要互相照看。"],["The referee blew his whistle, and the game began.","裁判吹响哨子，比赛开始了。"],["I sent a message at nine and got no reply until noon.","我九点发了消息，一直到中午都没有回复。"],["Please notify the office if you change your address.","地址变了请通知办公室。"],["He likes to assert that he was right, even when the numbers disagree.","他总爱断言自己是对的，哪怕数字摆着不同意。"],["She explained the rule twice, and after that nobody asked again.","这条规矩她解释了两遍，之后就没人再问了。"]]},{"t":"A Hot Kitchen","s":[["That evening my parents had a quarrel about the gas bill.","那天晚上，我爸妈为了燃气费吵了一架。"],["They never dispute each other in front of guests, so this one waited until eight.","有客人在时他们从不争执，所以这一架一直等到八点。"],["An argument always starts with something small, and this time it was a window.","争论总是从一件小事开始，这次是那扇窗。"],["My mother mentioned the broken glass for the third time that week.","我妈一周里第三次提到那块碎玻璃。"],["My father was in a hurry to cook, so he tried to hasten the fire with more oil.","我爸急着做饭，想多倒点油让火快起来。"],["I urged him to slow down, but he never listens when he is busy.","我劝他慢一点，可他忙起来谁的话都不听。"],["Then he scolded the cat, and the cat did not care at all.","然后他骂了猫，猫一点都不在乎。"],["He cursed under his breath, and later I heard him swear at the pan.","他压着嗓子诅咒了一句，后来我又听见他对着那口锅骂脏话。"]]},{"t":"The Uncle at Dinner","s":[["My uncle likes to provoke people at dinner and then call it a joke.","我叔叔吃饭时总爱挑人上火，然后说这只是玩笑。"],["He will preach about healthy food while eating his third piece of cake.","他一边大谈健康饮食，一边吃第三块蛋糕。"],["He also boasts about an old car that has not moved for two years.","他还夸耀一辆两年没动过的旧车。"],["His brothers tease him about it, and he pretends not to hear a word.","兄弟们拿这事打趣他，他假装一个字都没听见。"],["When they mock his singing, he simply sings louder.","他们嘲笑他唱歌，他就唱得更大声。"],["The young ones laugh, and the old ones look at the clock.","小辈在笑，长辈在看钟。"],["Nobody asks him to leave, because he is family and the food is good.","没人赶他走，因为他是一家人，而且菜确实好吃。"]]},{"t":"In the Concert Hall","s":[["The hall was silent until the last note, and then everyone began to clap.","大厅一直很安静，直到最后一个音落下，大家才开始鼓掌。"],["Some people stood up to applaud, and the singer bowed twice.","有人站起来鼓掌，歌手鞠了两次躬。"],["My sister was so happy that she hugged the stranger beside her.","我妹妹高兴得抱住了旁边的陌生人。"],["The old man in front of us had to kneel down to look for his glasses.","我们前面那位老人只好跪下来找眼镜。"],["He did not touch them for a minute, as if they might break.","他拿起眼镜时一分钟都没敢碰，好像一碰就会碎。"],["A woman behind us laughed and said it happened to her every week.","后面一位女士笑着说，她每个星期都要来一次。"]]},{"t":"The Morning Market","s":[["The market at seven in the morning is never a quiet place.","早上七点的市场从来不是安静的地方。"],["A boy ran after the bus and just managed to catch the door.","一个男孩追着公交跑，好不容易才抓住车门。"],["Someone snatched the last bag of oranges before I could reach it.","我还没伸手，最后一袋橙子就被人抢走了。"],["I grabbed a smaller bag and held it against my chest.","我抓了一小袋，紧紧抱在胸前。"],["The old woman could not grasp the coin with her cold fingers.","那位老太太手指冻得僵，硬币怎么也抓不住。"],["A man on a bike tried to overtake the crowd and almost hit a cart.","一个骑车的人想从人群里超过去，差点撞上一辆推车。"],["My little brother followed me between the tables and said nothing.","我弟弟在摊位之间跟着我，一句话也不说。"],["I kept a firm grip on his hand so that we would not be pulled apart.","我紧紧握住他的手，免得被人群冲散。"]]},{"t":"After the Party","s":[["After the party the kitchen was a real mess.","聚会结束以后，厨房乱得一塌糊涂。"],["I had to wipe every table twice before the sticky marks came off.","每张桌子我都得擦两遍，黏手印才下去。"],["Someone had burned a pan, and I scraped it for ten minutes.","有人把锅烧糊了，我刮了十分钟。"],["Then I polished the glass until I could see my face in it.","然后我把玻璃擦得能照出自己的脸。"],["A knife had scratched the new wood, and that mark will stay.","有把刀在新木头上刮了一道，这道痕怕是要留下了。"],["Two plates had fallen, and one of them was smashed on the floor.","两个盘子掉了，其中一个在地上摔碎了。"],["The bin bag split, so the rubbish went all over the floor again.","垃圾袋裂了，垃圾又撒了一地。"]]},{"t":"A Good Knot","s":[["You twist the rope one way to make it hold better.","把绳子朝一个方向拧，它才更吃得住。"],["Then you fold the end back and push it under the loop.","然后把绳头折回来，从圈底下塞过去。"],["Fasten it to the post with two tight knots.","用两个紧结把它拴在柱子上。"],["If the wind pulls hard, loosen the top knot first.","要是风太大，先松开上面那个结。"],["My grandmother does this with string every winter, and her parcels never open.","每年冬天我奶奶都用细绳这么绑，她寄的包裹从来没散过。"],["She says a good knot should be easy to undo and hard to shake off.","她说好结子该是解起来容易，晃起来不掉。"],["When the paper bag broke, the beans scattered across the whole floor.","纸袋破了，豆子撒了满满一地。"]]},{"t":"The Train at Six","s":[["The train began to sway as it came out of the tunnel.","火车出隧道的时候，车厢开始左右摇晃。"],["The old windows shake whenever another train goes past.","每次有列车开过，旧车窗就跟着抖。"],["My cup vibrated on the little table and then fell over.","我的杯子在小桌上颤动，然后就倒了。"],["Outside, the fields seemed to whirl past the glass.","窗外，田野像是绕着玻璃打转。"],["In the city, the wheels rotate more slowly as the train climbs.","进了城，列车爬坡，轮子转得慢下来。"],["The queue at the door began to shuffle forward with all its bags.","门口的队伍提着大包小包，一点一点往前挪。"],["Two men collided at the corner and both said sorry.","两个人在拐角撞在一起，都说了声对不起。"],["When the doors closed, my arm was still in contact with the frame.","门关上时，我的胳膊还贴着门框。"]]},{"t":"Fixing the Lamp","s":[["First connect the two wires at the back of the lamp.","先把灯后面的两根线接上。"],["Then combine the white one with the blue one so the switch works.","再把白线和蓝线合在一起，开关才有反应。"],["It takes a while to integrate the new part into the old frame.","要把新零件装进旧灯架，得花点时间。"],["Push the plug in until the pins penetrate the socket.","把插头往里推，让插脚插进插座。"],["Be careful not to pierce the thin plastic cover with the screw.","当心别用螺丝把薄薄的塑料壳扎穿。"],["Insert the bulb at the end and turn it once.","最后把灯泡插进去，转一下。"],["My father did all this on Sunday with a torch in his mouth.","星期天这些活都是我爸干的，嘴里还叼着个手电。"],["When the light came on, he looked happier than a child.","灯亮起来的时候，他高兴得像个孩子。"]]},{"t":"Out of the Mud","s":[["A small truck had to tow the car out of the mud.","得靠一辆小卡车把那辆车从泥里拖出来。"],["The driver tilted the mirror to see what was behind him.","司机把后视镜掰斜一点，好看清后面。"],["A line of dark water trailed behind the boat all morning.","一整个上午，船后面都拖着一条黑水痕。"],["He arranged the chairs in two rows before the meeting.","开会前他把椅子摆成两排。"],["She can manipulate the small parts with one hand and still talk to you.","她能一只手摆弄那些小零件，一边还跟你说话。"],["You steer with your left hand and hold the map with your right.","左手把方向，右手拿地图。"],["The baby was baptised in the old church by the river.","孩子在河边那座老教堂受了洗礼。"]]},{"t":"A Small Bet","s":[["My cousin likes to bet on horses, but only with small amounts.","我表哥喜欢赌马，不过每次下注都很小。"],["Last Saturday he put a stake of ten pounds on a grey horse.","上周六他押了十镑在一匹灰马上。"],["He says he does not gamble, and then he goes back the next week.","他说自己不是赌博，然后下星期又去了。"],["Before every race he promises his wife that this will be the last time.","每场比赛之前，他都向妻子保证这是最后一次。"],["My aunt does not believe him, so she keeps the bank card.","我舅妈不信他，银行卡一直收在自己手里。"],["He watched the screen with both hands flat on the table.","他两只手平放在桌上，眼睛盯着屏幕。"],["The grey horse came last, and he laughed louder than the winners.","那匹灰马跑了最后一名，他笑得比赢的人还响。"]]},{"t":"The Shop with Blue Lights","s":[["The new shop on the corner attracts people with its blue lights.","拐角那家新店用蓝灯把人都吸引过去了。"],["A woman inside seems to mesmerise everyone who walks past the window.","店里的一个女人好像能把路过橱窗的人都看呆。"],["Children stop there as if the toys had become a marvel.","孩子们站在那里，好像那些玩具成了什么奇观。"],["One little boy was amazed by a train that ran around a glass hill.","一个小男孩看呆了，那列小火车绕着玻璃山跑。"],["His father was astonished at the price of it.","他爸爸则被价钱吓了一跳。"],["The owner is obsessed with small details and checks every shelf twice.","老板娘对细节着迷，每个货架都要查两遍。"],["She says the first week was a nightmare, because nothing worked.","她说第一周简直是噩梦，什么都出问题。"],["The job also involves lifting boxes until midnight.","这份活还得搬箱子搬到半夜。"],["It annoys the neighbours when the lights stay on all night.","灯整夜不关，邻居很烦。"],["One of them was so upset about the noise that she wrote a letter.","其中一位被吵得受不了，写了封信投诉。"],["The rules printed on the door bewilder most people, and few read them.","门上印的规矩让大部分人看不明白，也没几个人读。"]]},{"t":"The Report","s":[["The report was full of irony: it praised the plan and then listed its costs.","这份报告写得很讽刺：先夸这个计划，再把成本一条条列出来。"],["At fifty, he had to accept the indignity of a smaller office.","五十岁那年，他不得不接受被换到更小的办公室这种屈辱。"],["She looked at the old rules with contempt and threw them in the bin.","她轻蔑地看了看那套旧规矩，直接扔进了垃圾桶。"],["Years of neglect had left the school with broken windows and no heating.","多年无人过问，学校窗户破了，暖气也没有。"],["He chose to disregard the warning and went out into the storm.","他不理会警告，还是走进了暴风雨里。"],["Ignorance is not a crime, but it is often expensive.","无知不算罪，但往往很贵。"],["The judge had a clear bias against young drivers.","这位法官对年轻司机明显有偏见。"],["One page of the report deviates from the facts, and everyone noticed it.","报告里有一页偏离了事实，所有人都看出来了。"]]},{"t":"The Boy at the Back","s":[["For a month, three boys bullied the new student at the back of the class.","整整一个月，三个男生欺负班里后排那个新来的同学。"],["The teacher did not see it, and the boy told nobody at home.","老师没看见，那男孩回家也一个字没说。"],["One afternoon a small panic sent him running out of the room.","一天下午他慌了，跑出了教室。"],["He tried to flee down the stairs and sat in the car park until dark.","他一路逃下楼梯，在停车场坐到天黑。"],["That evening his father came to the school, and the three were expelled.","那天晚上他父亲来了学校，那三个人被开除了。"],["They said they wanted revenge, but nothing happened after that.","他们说想报复，可后来什么也没发生。"],["The sight of them had terrified him for weeks, and it took a long time to stop.","一看见他们他就害怕，这种怕持续了好几周才慢慢过去。"]]},{"t":"Three Short Reports","s":[["On the same page there were three short reports from the courts.","同一版上有三条短短的法庭消息。"],["One man was convicted of trying to smuggle gold through the airport.","一个人因为想从机场走私黄金被定了罪。"],["Another had helped to hijack a truck full of medicine two years before.","另一个两年前参与劫持了一辆装满药品的卡车。"],["A third was arrested for a plan to kidnap the son of a trader.","第三个因为策划绑架一个商人的儿子被抓。"],["In the war, the village suffered a massacre that no court has ever examined.","战争期间，那个村子遭了一场屠杀，至今没有法庭查过。"],["Historians say the decimation of the town took two generations to repair.","历史学家说，这座城被大批杀戮之后，过了两代人才缓过来。"],["The government refused to intervene, and the families were left alone.","政府拒绝介入，那些家庭只能自己扛。"],["Delay impeded the case for years, and some of the papers were lost.","案子被拖延了好多年，有些卷宗都丢了。"],["One guard was said to have strangled a prisoner, but nobody could prove it.","据说有个看守勒死过一名犯人，可谁也证明不了。"]]},{"t":"The Job Offer","s":[["The salary was the bait, and the free flat was the real allure.","薪水是饵，那套免费的房子才是真正的诱惑。"],["They tried to induce him to sign before he had read the whole contract.","他们想诱使他在读完整份合同之前就签字。"],["He was tempted by the title, even though the work was the same.","那个头衔让他动了心，尽管活还是那些活。"],["On the first day the company designated him head of the new team.","第一天公司就指定他做新团队的负责人。"],["They assigned two assistants to him, and both were younger than his son.","给他派了两个助手，两个都比他儿子小。"],["He had to distribute the work among eight people by Friday.","他得在周五之前把工作分给八个人。"],["On Monday morning he was despatched to a small office near the airport.","周一早上他被派到机场附近一间小办公室去了。"]]},{"t":"Read the Small Print","s":[["Detach the form from the letter before you send it back.","把表格从信上撕下来，再寄回去。"],["He tried to disguise his voice on the phone, but I knew him at once.","他在电话里想装成别人，可我一下就听出来了。"],["She could not conceal her surprise when she saw the price.","看到价钱的时候，她掩不住惊讶。"],["They agreed to exclude the last page from the final report.","他们同意把最后一页从终稿里去掉。"],["Two days later they had to reverse that decision.","两天之后，他们又不得不把那个决定反过来。"],["He assured me that the money had already been paid.","他向我保证钱已经付过了。"],["She agreed to undertake the work and finish it by the end of March.","她答应接下这份活，三月底之前做完。"],["The contract stipulates that nobody may leave the site before noon.","合同里规定，中午之前谁都不能离开工地。"],["It took an hour to convince my father that the old car was safe.","我花了一个小时才让我爸相信那辆旧车是安全的。"],["I called him again to reassure him, and at last he laughed.","我又打了电话让他安心，他终于笑了。"]]},{"t":"One Wish","s":[["My aunt has only one wish: to see the sea again before she turns eighty.","我姑姑只有一个愿望：八十岁之前再看一次海。"],["She never aspired to a big house or a new car.","她从没向往过大房子或者新车。"],["Her one desire is a room with a window that faces water.","她唯一的渴望是一间窗子朝水的房间。"],["She has yearned for it since she left the coast at nineteen.","十九岁离开海边以后，她一直渴着这个。"],["When the wind turns warm, she invokes the name of her old village.","风一暖起来，她就念起老村子的名字。"],["Her feet itch whenever she hears a ship whistle on the radio.","广播里一有轮船的汽笛声，她的脚就痒。"],["Twice she made an attempt to go, and twice the trains stopped her.","她试过两次要走，两次都被火车拦住了。"],["She goes on to strive for it in her own quiet way.","她仍用自己的方式慢慢努力着。"],["It took years of effort to save the money for one ticket.","为了一张票的钱，她攒了好几年。"],["She hopes to fulfil it this summer, when her son has a week off.","她盼着今年夏天能实现，那时儿子正好有一周假。"]]},{"t":"The Project","s":[["We spent Monday sorting the old files into three piles.","星期一我们都在把旧档案分成三堆。"],["By Friday the deadline began to loom over the whole team.","到了周五，截止日期像影子一样压在整组人头上。"],["They will launch the new site on the first of May.","新网站五月一号上线。"],["Work will commence at eight, and the doors open at nine.","八点开工，九点开门。"],["The company wants to exploit the cheap land beside the river.","公司想用河边那块便宜的地。"],["Two engineers went to explore the empty factory first.","两名工程师先去看那间空厂房。"],["They had to exert a lot of pressure to move the old machine.","他们费了很大劲才把那台旧机器推动。"],["It was hard to tackle the roof problem in the rain.","雨里处理屋顶的毛病实在难。"],["We could not cope with the water and called for help.","水我们实在应付不了，只好喊人来。"],["That week we had to dispose of forty kilos of old paper.","那个星期我们处理掉了四十公斤旧纸。"],["One manager conducted the whole thing from a phone in his car.","整件事由一个经理在车里打电话指挥。"]]},{"t":"Ten Minutes of Editing","s":[["Half of that paragraph can be omitted without any loss.","那一段砍掉一半也不损失什么。"],["Delete the second line, and the sentence reads much better.","删掉第二行，这句话就顺多了。"],["They had to cancel the trip because of the snow on the pass.","因为山口下雪，他们只好取消行程。"],["I tried to erase the old name from the form, but the ink had dried.","我想把表上的旧名字擦掉，可墨水早干了。"],["Nothing could restore the page after the file had gone.","文件没了之后，那页再也恢复不出来。"],["We should rectify the mistake before the customer writes again.","趁客户还没再写信来，我们该把错误改过来。"],["He worked two weekends to redeem the lost time.","他加了两个周末，想把耽误的时间补回来。"],["A later success offset the early loss, and nobody mentioned it again.","后来的一次成功抵掉了早先的损失，就没人再提那回事了。"],["We had to replenish the water bottles before we set off.","出发前得把水壶重新灌满。"]]},{"t":"The Flooded House","s":[["Two men were rescued from the roof of the flooded house.","两个人从被淹房子的屋顶上被救了下来。"],["As a last resort, the family called the fire station at two in the morning.","实在没别的办法，那家人凌晨两点打给了消防站。"],["It took the older man a week to recover from the cold water.","年纪大的那个泡了冷水，过了一个星期才缓过来。"],["Crews worked all night to restore the power to the street.","抢修队干了一整夜，才把这条街的电恢复。"],["Without a backup, the shop lost six years of records.","店里没有备份，六年的账目全没了。"],["The water had reached the second step by ten o'clock.","到十点，水已经漫到第二级台阶。"],["Their neighbour kept the children in her kitchen until morning.","邻居把孩子们留在自家厨房里，一直到天亮。"]]},{"t":"Under the Sink","s":[["For weeks a small leak under the sink went unnoticed.","水槽下面有个小漏水，好几个星期没人发现。"],["Then one morning the pipe broke and water spilled across the floor.","后来有一天早上管子裂了，水泼了一地。"],["It began to seep into the flat below and stain the ceiling.","水开始往楼下渗，把天花板洇出一片黄。"],["Thick brown water oozed out of the wall for two days.","浓稠的黄水从墙里往外渗，渗了两天。"],["The family had to evacuate the building at midnight.","那家人半夜里被疏散出了楼。"],["Workers dug a trench along the road to reach the old pipe.","工人沿着马路挖了一条沟，才够到旧管子。"],["By then the ground was saturated, and part of the road gave way.","那时地已经泡透了，路面塌了一块。"]]},{"t":"The New Branch","s":[["The shop had to obtain a new licence before it could sell medicine.","这家店得先拿到新的执照，才能卖药。"],["In the first year it gained about four hundred regular customers.","第一年它就多了四百来个常客。"],["A farm nearby supplies fresh eggs every morning at six.","附近一个农场每天早上六点供应新鲜鸡蛋。"],["The back hall was rendered useless by a leak in the roof.","屋顶漏水，后面那间厅就废了。"],["They plan to enlarge it and add six small tables.","他们打算把它扩一下，摆六张小桌子。"],["A second van would augment the morning round, but nobody wants to drive it.","再来一辆车能把早班送货补上，可没人愿意开。"],["So the plan waits, and the hall stays empty for now.","于是计划先搁着，那间厅眼下还空着。"]]},{"t":"The New Sign","s":[["First they magnified the drawing so that everyone could read the small letters.","他们先把图纸放大，让每个人都看得清那些小字。"],["Two speakers amplify the voice of the woman at the front.","两只音箱把前面那位女士的声音放大。"],["She tends to exaggerate, and a short delay becomes a disaster in her telling.","她说话爱夸张，一点小耽误到她嘴里就成了大祸。"],["Rain prolonged the work on the sign by three weeks.","下雨让招牌的活多拖了三个星期。"],["The family upholds one rule: nobody works on Sunday.","这家有个规矩一直守着：星期天谁都不干活。"],["A small motor propels the letters around the frame, which children love.","一个小马达推着字母在框里转，孩子们特别喜欢。"],["The website is updated every Monday with a new photo of the shop.","网站每个星期一更新，换一张店里的新照片。"],["In the end they had to raise the price of the sign, because the metal cost more.","最后招牌的价钱还是涨了，因为那块金属贵了。"]]},{"t":"The Letter Afterwards","s":[["Nothing can excuse what he said at the table that night.","那天晚上他在饭桌上说的那些话，怎么都找不来借口。"],["His mother will forgive him, because she always does.","他母亲会原谅他的，她一向如此。"],["He could not contain his anger when his brother laughed.","他哥一笑，他的火就压不住了。"],["People in the village regard him as a quiet, careful man.","村里人把他看成一个安静又仔细的人。"],["He does not flatter anyone, and for that some people dislike him.","他从不奉承谁，因此有些人不喜欢他。"],["His students worship him, though he teaches the dullest subject in school.","他的学生却崇拜他，尽管他教的是全校最闷的科目。"],["The letter he wrote the next day was two pages long.","第二天他写了一封信，整整两页。"],["It said the same thing four different ways, and none of them worked.","同一件事他说了四遍不同的说法，一句都没管用。"]]},{"t":"Why the River Rose","s":[["The cause of the flood was a blocked drain behind the school.","这场水灾的原因是学校后面那条下水道堵了。"],["For the sake of the children, the council closed the road.","为了孩子，居委会把那条路封了。"],["Our main objective this year is to finish the wall before June.","今年我们的主要目标是在六月前把墙砌好。"],["The smell of the wet earth aroused a memory of the last flood.","湿土的气味勾起了上一场水灾的记忆。"],["One broken pipe can trigger a whole chain of problems.","一根破管子就能引起一连串麻烦。"],["After that, people began to seek help from the council every week.","从那以后，人们开始每个星期去找居委会帮忙。"],["Divers went down to retrieve the boxes from the cellar.","潜水员下去，把地窖里的箱子取了回来。"],["Two neighbours came to testify about the noise at night.","两个邻居来作证，说夜里一直有响声。"],["Officers will verify the address before any money is paid.","付钱之前，工作人员会核实地址。"]]},{"t":"The Old Cook","s":[["The recipe does not specify how much salt to use.","这份菜谱没写明要放多少盐。"],["The old cook was happy to enlighten us about the fire.","那位老厨师很乐意给我们讲讲火候。"],["She likes to impart small tricks that no book has.","她喜欢传授一些书里没有的小窍门。"],["Anyone who has cooked for forty years deserves some respect.","做了四十年饭的人，总该得到点尊重。"],["She never writes anything down, and her daughter has tried for years.","她什么都不写下来，她女儿劝了好多年。"],["We stood in her kitchen with a notebook and two pens.","我们站在她的厨房里，拿着一个本子和两支笔。"],["By the end of the morning we had ten pages of notes and no exact amounts.","一个上午过去，我们记了十页，却没有一个准确的量。"]]},{"t":"The Wedding in the Village","s":[["The purpose of the party was to thank the neighbours, not to show off.","这场聚会的目的是谢邻居，不是显摆。"],["They invited sixty people, and eighty came.","他们请了六十个人，来了八十个。"],["The bride stood at the door to welcome each guest by name.","新娘站在门口，一个个叫名字迎客人。"],["Old friends greeted each other with both hands.","老朋友见面，两只手都握上。"],["The soldiers saluted the flag, and then the music started.","士兵向旗子敬礼，然后音乐就起来了。"],["Everyone stayed until midnight to celebrate.","所有人都留到半夜庆祝。"],["We queued for ten minutes to congratulate the couple.","我们排了十分钟队，就为向新人道喜。"],["The priest blessed the house before the meal.","吃饭前，神父给这栋房子祝了福。"],["The children were allowed to participate in the dancing.","孩子们也被允许参加跳舞。"],["At the gate there was a long farewell, and two women cried.","门口的道别拖得很长，两个女人哭了。"]]},{"t":"Two Letters","s":[["Those two colours do not assort well, so she changed the curtains.","那两种颜色不搭，她把窗帘换了。"],["For years the two sisters corresponded by letter once a month.","两姐妹通信通了好多年，每月一封。"],["His account of the night does not accord with the one his brother gave.","他对那天晚上的说法，跟他哥说的对不上。"],["They attribute the success of the shop to the woman at the door.","他们把这家店的好生意归功于门口那个女人。"],["The letters are kept in a box under the bed.","那些信收在床底下的一个盒子里。"],["Nobody in the family has ever read them all.","家里没人把它们全读完过。"],["Her version and his are close, but never quite the same.","她说的和他说的很接近，却从来不完全一样。"]]},{"t":"The Price of Oil","s":[["The price of oil dropped by a third in one week.","油价一个星期掉了三分之一。"],["Share prices plummeted the next morning.","第二天早上股价暴跌。"],["Heavy curtains muffle the sound of the road outside.","厚窗帘把外面马路的声音压下去了。"],["One mistake can overshadow a whole year of good work.","一个错就能让一整年的好活儿都暗下去。"],["My uncle had sold his shares the day before, which he calls luck.","我叔叔前一天就把股票卖了，他说这叫运气。"],["Now he sits with the newspaper on the kitchen table and says nothing.","现在他坐在那儿，报纸摊在餐桌上，一句话不说。"],["My aunt puts a hand on his shoulder and turns the page.","我婶婶把手放在他肩上，替他把报纸翻了一页。"]]},{"t":"Remembering the Street","s":[["I cannot recall the name of the street where we lived.","我们住过的那条街叫什么，我记不起来了。"],["My mother can recollect every shop on it, and what each one sold.","我妈却记得街上的每一家店，连卖什么都记得。"],["One photo reminds her of the winter the river froze.","有张照片让她想起河水结冰的那个冬天。"],["She will retell that story at every family meal.","每次家里吃饭，她都要把那件事重讲一遍。"],["We have heard it so often that we can repeat it word for word.","我们听得太熟，能一字不差地重复。"],["In retrospect, those years look easier than they really were.","回头看去，那些年显得比实际上轻松。"],["What impressed me most was how quiet the city was at six in the morning.","最让我记住的，是早上六点这座城市有多安静。"],["She had to surmount a hundred small problems before she could leave.","她得先克服一百个小麻烦，才走得成。"],["One cold remark at the table mortified him for a week.","饭桌上一句冷话，让他难受了一个星期。"],["A smell of coal pervaded the whole building in winter.","冬天，整栋楼都弥漫着煤味。"]]},{"t":"The Old Chair","s":[["We had to replace the old chair because one leg was cracked.","那把旧椅子得换了，一条腿裂了。"],["For a week a wooden box served as a substitute.","有一个星期，一只木箱充当了替身。"],["It is hard to distinguish the two brothers on the phone.","电话里很难分辨出这两兄弟谁是谁。"],["Few people can differentiate between the two kinds of tea by taste.","靠味道能分出这两种茶的人不多。"],["The road inclines slightly as it comes into the village.","路进村的时候会微微倾斜。"],["He likes to lean on the gate and watch the cars go by.","他爱靠在门上，看车一辆辆过去。"],["The picture on the wall hangs sideways, and nobody has ever fixed it.","墙上那幅画歪着挂，从来没人去扶正。"]]}],"21":[{"t":"A Man of Few Words","s":[["My grandfather has a quiet manner that makes people listen.","我爷爷举止安静，反而让人愿意听他说。"],["His temper is short in the morning and long in the evening.","他早上的脾气短，到了晚上就长了。"],["He says his mood depends on the weather and on the radio.","他说自己的心情全看天气和广播。"],["You can hear every emotion in his voice, though his face shows nothing.","他脸上什么也没有，可声音里什么情绪都听得出来。"],["People say I have his character and the attitude of my mother.","人家说我的性格像他，对钱的态度像我妈。"],["His best trait is that he never promises too much.","他最好的一点是，从不把话说满。"],["Patience is a virtue he learned on the boats.","耐心是他在船上学会的一种美德。"],["The main feature of the old house is the long kitchen.","那栋老房子最显眼的地方，是那间很长的厨房。"],["His personality fills the room before he says a word.","他还没开口，他的性情就已经把整个屋子填满了。"],["He is not tall in stature, but he stands very straight.","他个子不高，却站得笔直。"],["When he sits down, you can feel the whole room slow down.","他一坐下，你就觉得整间屋子都慢了下来。"]]},{"t":"Under the Skin","s":[["Under the skin there is flesh, and under the flesh there is bone.","皮肤下面是肉，肉下面是骨头。"],["A human body has about two hundred bones, and a child has more.","人的身体大约有两百块骨头，小孩还要多一些。"],["The backbone holds you up, and the skull protects the brain.","脊柱把你撑起来，颅骨护着脑子。"],["In a museum in Cairo there is the skeleton of a whale.","开罗的博物馆里有一副鲸的骨架。"],["Mankind has been asking how the mind works for a very long time.","人类问“心是怎么想的”已经问了几千年。"],["Physical work makes you hungry, and mental work makes you tired in another way.","体力活让人饿，脑力活让人累，累法不一样。"],["The brain uses about a fifth of the energy we take in.","脑子要用掉我们摄入能量的五分之一。"],["Her mind was still sharp at ninety, though her body had slowed down.","她九十岁时脑子还很清楚，只是身子慢了。"]]},{"t":"The Face","s":[["My father has a small scar on his left cheek.","我爸左边脸颊上有块小疤。"],["He wipes his forehead with the back of his hand when he is thinking.","他想事情的时候，用手背擦一下前额。"],["His brow goes up when he does not believe a word you say.","你说的话他一个字都不信时，眉毛就抬起来了。"],["One eyelash fell on the page, and my sister made a wish.","一根睫毛落在书页上，我妹妹许了个愿。"],["He keeps his lip still when he is angry, and that is worse than shouting.","他生气的时候嘴唇一动不动，那比喊出来还吓人。"],["Hot soup burned his tongue, and he said nothing for a minute.","热汤烫了他的舌头，他一分钟都没说话。"],["A cold went to his throat, and he lost his voice for three days.","感冒窜到嗓子，他三天说不出话。"],["When he was young he could fill his gorge and still ask for more.","他年轻时能吃下一大堆，吃完还要再来。"],["He shaves his chin every second day, and trims his jaw once a week.","他两天刮一次下巴，一星期修一次颌边的胡子。"],["A red scarf around his neck is the only colour he ever wears.","脖子上那条红围巾，是他身上唯一的颜色。"],["His beard went white before the hair on his head did.","他的胡子比头发先白。"]]},{"t":"The Baker","s":[["A baker works with his arms, and one shoulder is always a little higher.","做面包的人靠胳膊吃饭，两个肩膀总有一个略高一点。"],["Years of lifting have made his left limb weaker than the right.","搬了这么多年，他左边那条胳膊比右边弱。"],["He rests his elbow on the counter and talks to the queue.","他把手肘搁在柜台上，跟排队的人说话。"],["Flour gets into the fold of his wrist and stays there all day.","面粉钻进他手腕的褶子里，一整天都在那儿。"],["He presses the dough with his thumb to see if it is ready.","他用拇指按一下面团，看发好没有。"],["The palm of his hand is as hard as the sole of a shoe.","他手心硬得像鞋底。"],["One finger is bent from a machine he used at twenty.","他一根手指是弯的，二十岁时被一台机器夹的。"],["He bangs his fist on the table when the oven is too slow.","炉子慢了，他就用拳头敲桌子。"],["His chest is wide, and he breathes like a man who has been running.","他胸膛很宽，喘气像刚跑过步的人。"],["He never opens his mouth while the bread is in the oven.","面包在炉子里的时候，他嘴上一句不说。"]]},{"t":"The Torso","s":[["A rib broke when he fell off the ladder, and it hurt when he laughed.","他从梯子上摔下来断了一根肋骨，笑起来都疼。"],["The doctor pressed his abdomen and asked whether it hurt.","医生按了按他的腹部，问疼不疼。"],["His waist has grown two inches since he stopped cycling.","他不骑车以后，腰围大了两寸。"],["Every organ has its own job, and most of them work without being asked.","每个器官都有自己的活，而且大多不用人吩咐。"],["The liver cleans the blood, and the kidney carries the waste away.","肝把血滤干净，肾把废物带走。"],["His stomach complains if he eats after nine at night.","他晚上九点以后吃东西，胃就要抗议。"],["Smoke from the fire went into his lung, and he coughed for a week.","烟进了他的肺，他咳了一个星期。"],["A child grows in the womb for nine months before it is born.","孩子在子宫里长九个月才出生。"]]},{"t":"The Body Has Its Own Clock","s":[["The heart is a muscle, and its pulse can be felt at the wrist.","心脏是一块肌肉，它的脉搏在手腕上摸得到。"],["Blood leaves the heart through an artery and comes back another way.","血从动脉离开心脏，再从另一条路回来。"],["A gland sends hormones into the blood, and they change how the body works.","腺体把激素送进血里，身体的运作就跟着变。"],["A nerve carries a message faster than you can think about it.","神经传消息，比你反应过来还快。"],["Every chamber of the heart fills and empties about seventy times a minute.","心脏每个腔室一分钟大约装满再排空七十次。"],["The intestine takes what it needs from food, and the rest moves on.","肠子从食物里拿走需要的，剩下的继续往前走。"],["Water leaves the body through every pore of the skin.","水从皮肤上每一个毛孔离开身体。"],["A small stimulus can keep the immune system busy for days.","一点点刺激，就能让免疫系统忙上好几天。"],["The biorhythm of a night worker never quite fits the daylight.","上夜班的人，生物节律总跟白天对不上。"],["A healthy lifestyle is easier to describe than to keep.","健康的生活方式说起来容易，守起来难。"],["A habit is a decision you stop making after about a month.","习惯就是一个你坚持一个月以后不用再做的决定。"]]},{"t":"On the Stairs","s":[["She fell on the stairs and hurt her knee.","她在楼梯上摔了一跤，伤了膝盖。"],["The joint was swollen for a week, and she could not bend it.","那个关节肿了一个星期，弯都弯不了。"],["Her thigh was black and blue from the hip down to the knee.","她从胯到膝的大腿青了一大片。"],["She twisted her ankle on the last step.","她在最后一级台阶上崴了脚踝。"],["The heel of her shoe came off, and that is how it started.","鞋跟掉了，事情就是从这儿开始的。"],["For two days she could not put any weight on her toe.","有两天她脚趾一点劲都使不上。"],["Now she keeps a warm cloth on her lap and reads.","现在她腿上搭着一块热毛巾，坐着看书。"]]},{"t":"The Eye Test","s":[["My grandmother lost most of her sight at eighty, but her hearing stayed sharp.","我奶奶八十岁那年视力去了大半，耳朵却一直很灵。"],["Her eyesight had been poor for years, and she never told anyone.","她的视力差了好多年，却一直没跟人说。"],["From her window there is a fine view of the river.","从她窗口看出去，河上的景色很好。"],["A visual test showed that she needed stronger glass.","做了个视觉检查，才知道她得换更厚的镜片。"],["Now the far bank is barely visible through it.","现在透过镜片，对岸只是模模糊糊一片。"],["Her answers were vague, so the doctor asked the same question again.","她答得含糊，医生只好把同一个问题再问一遍。"],["One neighbour is almost blind and still walks to the shop each day.","有个邻居几乎看不见了，还是每天走到店里去。"],["For a moment he was dumb with surprise and could not answer.","有一瞬间他惊得说不出话，答不上来。"],["The aural test was harder: she had to say which side the sound came from.","听觉测试更难，她得说出声音是从哪边来的。"],["A dental check found nothing wrong, which surprised her.","牙科检查什么都没查出来，她倒有点意外。"],["Of the five senses, touch was the one she trusted most.","五种感觉里，她最信的是触觉。"]]},{"t":"Sunday Afternoon","s":[["The house is quiet at two in the afternoon on a Sunday.","星期天下午两点，家里很安静。"],["My father is asleep in the chair with the paper on his knees.","我爸在椅子上睡着了，报纸摊在膝盖上。"],["He stays awake until midnight, so he needs a nap after lunch.","他熬到半夜才睡，所以午饭后得补一小觉。"],["He will yawn twice, close his eyes, and doze for twenty minutes.","他会打两个呵欠，闭上眼，打二十分钟的瞌睡。"],["If the phone rings, he wakes at once and pretends he was reading.","电话一响，他立刻醒来，还装作刚才在看书。"],["My mother says a short nap is better than a second cup of tea.","我妈说，眯一会儿比再喝一杯茶管用。"],["The cat does the same thing on the warm step outside.","外面的猫在暖台阶上做同样的事。"]]},{"t":"The Clinic on the Hill","s":[["An old man with a lame leg comes to the clinic every Tuesday.","有个腿瘸的老人每个星期二都来诊所。"],["He was born with one hip out of place, and it never mended.","他出生时一边胯骨就错着位，一直没好。"],["A young woman was crippled by a fall from a horse last spring.","去年春天，一个年轻女人从马上摔下来，落下了残疾。"],["She is expecting a baby, and the pregnancy has been difficult.","她现在怀着孩子，孕期一直不太顺。"],["The clinic hands out condoms free at the desk by the door.","诊所门口那张桌子免费发避孕套。"],["A dwarf apple tree grows against the warm wall of the garden.","花园暖墙边种着一棵矮苹果树。"],["The doctor refuses to discuss clone work, because it is not legal here.","医生不肯谈克隆的事，因为在这儿不合法。"]]},{"t":"The Waiting Room","s":[["The waiting room smells of soap and old paper, and nobody talks.","候诊室里是肥皂和旧纸的味道，没人说话。"],["The first symptom was a cough that would not go away.","最早的征兆是一声停不下来的咳嗽。"],["The doctor asked what illness he had had as a child.","医生问他小时候得过什么病。"],["Some diseases run in families, and some come from the water.","有些病是家里传下来的，有些是从水里来的。"],["An old man moaned in the corner and held his side.","角落里一个老人捂着腰侧低声哼。"],["The infection had spread from a bad tooth to his ear.","感染从一颗坏牙蔓延到了耳朵。"],["One patient had been waiting since seven in the morning.","有个病人从早上七点就等着了。"],["The label on his file said invalid, an old word for a sick man.","他病历上写着一个旧词，意思是病弱者。"]]},{"t":"The Numbers on the Screen","s":[["Too much salt is a detriment to the heart.","盐吃多了对心脏有害。"],["The X-ray showed a broken wrist from a fall in the garden.","片子显示他手腕断了，是在花园里摔的。"],["The accident disabled him for two years.","那场事故让他两年不能干活。"],["The report says obesity among children has doubled in ten years.","报告说，儿童肥胖十年里翻了一倍。"],["His doctor told him he was overweight and should walk every day.","医生说他超重了，得每天走路。"],["Diabetes and hypertension are common in his family.","他家糖尿病和高血压都常见。"],["A dysfunction of the kidney was found in the blood test.","血液检查发现他的肾功能有障碍。"]]},{"t":"The Bad Year","s":[["His father had a heart attack at fifty and stopped smoking that day.","他父亲五十岁心脏病发作，当天就把烟戒了。"],["A stroke left his uncle without the use of one arm.","他叔叔中风以后，一条胳膊不能动了。"],["The illness paralysed one side of her face for three months.","那场病让她半边脸麻了三个月。"],["Her mother has arthritis in both hands and cannot open a jar.","他母亲两只手都有风湿，瓶子都拧不开。"],["He was treated for cancer two years ago and now works in the garden.","他两年前治过癌症，现在在园子里干活。"],["In the old records, a plague killed a third of the town.","旧档案里记着，一场瘟疫带走了全城三分之一的人。"],["The heat that summer was insane, and people slept on the roofs.","那年夏天热得离谱，人们都睡到屋顶上去了。"]]},{"t":"The Student Week","s":[["For a week he had a headache that no pill would touch.","他头疼了一个星期，什么药都压不住。"],["The flu came with a fever of thirty-nine and a dry cough.","流感来了，烧到三十九度，还干咳。"],["His throat began to swell, and once he nearly choked on his own breath.","他喉咙开始肿，有一次差点被自己的气噎住。"],["He moaned in his sleep, and his mother sat by the bed all night.","他睡着时直哼哼，他母亲在床边坐了一夜。"],["He could not sleep at all, and the insomnia made everything worse.","他完全睡不着，失眠又把别的都弄得更糟。"],["In the morning he felt dizzy when he stood up.","早上一起身，他就头晕。"],["An allergy to dust did not help, and his nose ran all day.","他还对灰尘过敏，鼻子整天流。"],["By Friday a pimple on his chin had turned into a small red map.","到星期五，他下巴上一颗小疱变成了一小片红。"]]},{"t":"The Football Match","s":[["Two players were injured in the first ten minutes of the match.","比赛头十分钟就有两名球员受伤。"],["One had a cut on his knee that would not stop bleeding.","一个膝盖上划了个口子，血止不住。"],["The other had a bruise the size of a hand on his thigh.","另一个大腿上一块手掌大的淤青。"],["The injury kept him out of the team for six weeks.","这一伤让他六个星期没能上场。"],["The wound was clean, and the nurse closed it with three stitches.","伤口很干净，护士缝了三针。"],["There was a lump on his shin that took a month to go down.","他小腿上肿起一块，一个月才消。"],["He said the pain was worse at night than during the game.","他说夜里比踢球时还疼。"],["The trauma of the fall stayed with him much longer than the cut.","摔那一下留下的惊吓，比那道口子跟他跟得久。"]]},{"t":"The Last Winter","s":[["He talked about death as if it were a neighbour he had not met.","他说起死亡，像在说一个还没见过面的邻居。"],["Every mortal thing wears out, he said, and that includes the boat.","他说凡是有命的东西都会旧，船也一样。"],["His demise was reported in the paper in four short lines.","他的死讯在报上只占了四行。"],["The village had long expected doom from the mine on the hill.","村里人早就觉得山上那个矿迟早要闯大祸。"],["One fall on the wet stones could be fatal at his age.","他这个年纪，在湿石头上摔一下就可能是致命的。"],["The gas from the mine was lethal to birds and to men.","矿里的气对鸟和人都能要命。"],["He had outlived three doctors and one priest.","他送走了三个医生和一个神父。"],["At the funeral nobody could think of a story that was not true.","葬礼上，谁也想不出一件不是真的往事来讲。"]]},{"t":"Six Months in the Attic","s":[["The team built a corpus of two million words from old newspapers.","这个小组用旧报纸建了一个两百万词的语料库。"],["Six months of overwork left them pale and short-tempered.","半年的过度劳累让他们脸色发白，脾气也短了。"],["The work exhausted him by Thursday every week.","这活每个星期都能把他累到周四就撑不住。"],["Fatigue made small mistakes look like big ones.","疲乏让一个小错看起来像大错。"],["One afternoon a young woman fainted at her desk.","一天下午，一个年轻姑娘在桌前昏了过去。"],["Her pulse was feeble, and the doctor sent her home for a week.","她脉搏很弱，医生让她回家休息一周。"],["By the end of it they were too weary to celebrate.","到最后，他们累得连庆祝都懒得。"],["Two years in that room weakened his eyes and his back.","在那间屋子里待了两年，他的眼睛和背都弱了。"]]},{"t":"The Long Ward","s":[["The bed was hard, and the light above it made everyone uncomfortable.","床很硬，头顶的灯让每个人都觉得不舒服。"],["He was unconscious for two days after the fall.","摔下来以后，他昏迷了两天。"],["Her cough was chronic, and it came back every winter.","她的咳嗽是慢性的，每到冬天就回来。"],["The acute pain lasted three days and then faded to an ache.","剧痛持续了三天，然后淡成一种钝痛。"],["His throat was sore, so he drank only warm water.","他嗓子疼，只喝温水。"],["There was a sorrow in the room that no visitor could lift.","屋里有种悲伤，来多少客人都驱不散。"],["His suffering was quiet, which made it harder to watch.","他疼得安静，反倒更让人看不下去。"],["The old women lament the young men who never came home.","老太太们为那些再没回家的年轻人叹息。"]]},{"t":"The Hospital at Five","s":[["The hospital is quiet at five in the morning, and only the kitchen is bright.","早上五点，医院很静，只有厨房亮着灯。"],["She works there as a cleaner, and her job is to keep the ward sanitary.","她在那里做清洁，活儿就是让病房保持干净卫生。"],["Hygiene is not a small thing in a place like this.","在这种地方，卫生不是小事。"],["Medical waste goes into yellow bags, and nothing else goes in them.","医疗垃圾丢进黄袋子，别的东西一律不许放。"],["The therapy room is on the second floor, next to the stairs.","治疗室在二楼，靠着楼梯。"],["Health care here is free, but the waiting list is long.","这儿的医疗是免费的，可排队排得很长。"],["A warm bath and a short walk are the whole curative plan for one old man.","对一位老人来说，整个治疗方案就是热水澡加散一会儿步。"],["He was once a runner, and his fitness is the only thing that saved him.","他以前是跑长跑的，救他的就是他这副好身板。"]]},{"t":"The Surgeon","s":[["The physician listened for a full minute before he said anything.","那位内科医生听了整整一分钟才开口。"],["The surgeon washed her hands for three minutes, then came in.","外科医生洗了三分钟手，才走进来。"],["The operation took four hours and left a line of six stitches.","手术做了四个小时，留下一道缝了六针的线。"],["There is no cure for his knee, only a treatment that keeps it quiet.","他的膝盖治不好，只能靠治疗让它安静下来。"],["The wound healed more slowly than anyone had expected.","伤口好得比谁预料的都慢。"],["She wrote a prescription for two weeks of tablets.","她开了一张两周的药方。"],["He has a check every six months, and it has been clean for three years.","他每半年查一次，已经三年没查出问题。"]]},{"t":"The Letter from the Council","s":[["A transplant is only possible if a family says yes at the worst moment of their lives.","器官移植能不能成，只看一家人在最难的时候愿不愿意点头。"],["The injection went into his arm and hurt less than the blood test.","针打在他胳膊上，比抽血还不疼。"],["As a precaution, the clinic came to vaccinate every child under ten.","为防万一，诊所来给十岁以下的每个孩子打了疫苗。"],["Travellers from the infected area were held in quarantine for two weeks.","从疫区来的人被隔离了两个星期。"],["In the old hospital they would segregate the sick from the well.","在老医院里，病人和健康人是分开的。"],["They had to isolate the one boy who had the fever.","他们只好把唯一发烧的那个男孩单独隔开。"],["Nobody liked the rules, and everybody obeyed them.","没人喜欢这些规矩，可人人都照着做。"],["Two months later the ward was empty again.","两个月后，那间病房又空了。"]]},{"t":"The Pharmacy on the Corner","s":[["The pharmacy on the corner opens at eight and closes at ten.","拐角的药房八点开门，十点关门。"],["Behind the counter are boxes of medicine with names nobody can say.","柜台后面是一盒盒药，名字没人念得出来。"],["For a sore throat the old remedy is honey and hot water.","嗓子疼，老办法就是蜂蜜加热水。"],["The drug that helped him most was the cheapest one on the shelf.","最管用的那种药，是货架上最便宜的。"],["He takes one pill in the morning and two at night.","他早上吃一片，晚上吃两片。"],["The antibiotic worked in four days, which is fast.","抗生素四天就见效，算是快的。"],["Penicillin saved his grandfather in 1944.","一九四四年，青霉素救了他爷爷的命。"],["Morphine was given only in the last week.","吗啡只在最后一周用过。"],["The dose on the box is for adults, so half of it is enough for a child.","盒上的剂量是给大人的，孩子一半就够。"],["His recovery took a month, and he slept badly for most of it.","他养了一个月，大半时间睡不好。"],["A cold shower will refresh you better than a second coffee.","冲个冷水澡，比再喝一杯咖啡还提神。"],["She has acupuncture once a week for her back.","她每个星期做一次针灸，治背。"]]},{"t":"Back on Your Feet","s":[["The injection gave him some relief within an hour.","打完针一个小时，他就松快了些。"],["A warm cloth will relieve the pain in your jaw.","一块热毛巾能减轻颌边的疼。"],["These tablets alleviate the swelling but do not cure it.","这些药片能消一点肿，但治不了根。"],["She eased herself into the chair and said nothing.","她慢慢挪进椅子里，一句话没说。"],["For the first time in a week he could relax his shoulders.","一个星期以来，他第一次能把肩膀放松下来。"],["He will resume work on Monday if the cough has gone.","咳要是好了，他星期一再上班。"],["It took a month before his breathing was normal again.","过了一个月，他的呼吸才恢复正常。"],["Colds are common in winter, and this one was worse than usual.","冬天感冒很常见，这一场比平常重。"]]},{"t":"Two Brothers","s":[["One brother is optimistic about everything, and the other always expects rain.","一个兄弟对什么都乐观，另一个总在等下雨。"],["The optimistic one buys the tickets before he has a job.","乐观的那个还没找到工作就先买了票。"],["The pessimistic one saves money for a winter that never comes.","悲观的那个一直存钱，等一个永远不来的冬天。"],["One has a positive view of people, and the other a negative one.","一个看人总是往好处看，另一个总往坏处看。"],["At work the quiet one is passive and waits to be told what to do.","上班时话少的那个很被动，等人吩咐才动。"],["The loud one is enthusiastic about every new plan, and about nothing after a month.","话多的那个对每个新计划都热情，一个月后就没兴趣了。"],["Both are indifferent to money, which annoys their mother.","两个人都对钱无所谓，这让他们的妈很着急。"],["The neighbours are apathetic about the state of the road.","邻居们对这条路的好坏漠不关心。"],["The difference in their pay is negligible, and neither of them cares.","两人的工资差得微不足道，谁都不在意。"]]},{"t":"The Birthday","s":[["The whole family came for her eightieth birthday, and there was laughter in the kitchen.","全家人都来给她过八十岁生日，厨房里全是笑声。"],["Her happiness was quiet, and she kept touching the table as if it were new.","她的高兴是安静的，手一直摸着桌子，好像那是新买的。"],["The children made a joke about her age, and she laughed first.","孩子们拿她的年纪开玩笑，她第一个笑。"],["It was fun to watch four people try to light eighty candles.","四个人点八十根蜡烛，看着真好玩。"],["A merry song came on the radio, and two of them danced by the sink.","收音机里响起一支欢快的歌，两个人在水池边跳了几步。"],["Her delight at the cake was worth more than the cake.","她看见蛋糕时的那份欢喜，比蛋糕本身值钱。"],["She said the pleasure was in the noise, not in the food.","她说，快乐在热闹里，不在菜里。"],["The grandchildren cheered when she cut it.","她切蛋糕的时候，孙子们一片欢呼。"],["Someone shouted that we should rejoice while we still can.","有人喊了一句：趁还能高兴，就高兴吧。"],["The little ones were thrilled by the candles and the dark.","小的们被蜡烛和黑屋子激得又叫又跳。"],["It is hard to please a room of twelve, and she did it with soup.","让一屋子十二个人都满意很难，她一锅汤就做到了。"]]},{"t":"The New Job","s":[["The first month was agreeable, and the second was better.","第一个月还算愉快，第二个月更好。"],["The pay is not exciting, but the work is.","工资不激动人心，活儿倒是。"],["Her manager is keen on detail and short with mistakes.","她的经理对细节很在意，对错误没耐性。"],["He works with a zeal that makes the rest of us tired.","他干活那股热情，把我们都看累了。"],["The office is lively at ten and dead after four.","办公室十点很热闹，过了四点就死气沉沉。"],["There is a lovely view of the car park from the window, which is a joke.","窗外的风景是停车场，这话本身是个笑话。"],["She is fond of the older woman who sits by the door.","她喜欢坐在门边那位年长的女士。"],["The manager favours people who arrive early.","经理偏爱早到的人。"],["The result was satisfactory, and nobody was surprised.","结果还过得去，也没人意外。"],["A quieter desk would be desirable, but not at this price.","能有个安静点的位子当然好，只是这个价钱换不来。"]]},{"t":"The Man at the Door","s":[["He brings a kind of joy into a room that nobody can explain.","他一进屋，就带进一种说不清的欢喜。"],["A walk in the cold air exhilarates him, and he comes back talking fast.","在冷空气里走一圈就让他振奋，回来话特别多。"],["The noise of the city startled her at first.","城里的声音一开始把她惊着了。"],["It is amazing how quickly people get used to a new view.","人对新的风景习惯得快，快得让人吃惊。"],["The size of the station will astound anyone who comes from a village.","从村子里来的人，看见车站那么大都要震一下。"],["His days are hectic, and he likes them that way.","他每天都忙乱，而且他就喜欢这样。"],["He is generous with his time and careful with his money.","他花时间很大方，花钱很小心。"]]},{"t":"The Teacher","s":[["She is liberal in her views and strict about homework.","她想法开明，对作业却很严。"],["Her voice is gentle, and that is why nobody argues with her.","她声音温和，所以没人跟她争。"],["She is humble about her own writing, though it has won prizes.","她对自己的文章很谦虚，尽管得过奖。"],["Her flat is modest: two chairs and a thousand books.","她的住处很朴素：两把椅子，一千本书。"],["She is humorous without telling jokes, which is harder.","她不讲笑话也让人觉得好笑，这更难。"],["The students are polite to her because she is polite first.","学生对她客气，因为她先客气。"],["She is frank about their chances and never promises a good mark.","她实话实说他们的把握，从不保证给好分。"],["She takes their work seriously, even when it is bad.","她认真对待他们的作业，哪怕写得很差。"]]},{"t":"The Stranger Upstairs","s":[["The man upstairs is mysterious: he never says what he does.","楼上那个人很神秘，从不说自己是干什么的。"],["The children are curious about the boxes he carries at night.","孩子们对他夜里搬的箱子很好奇。"],["One of them was daring enough to ask him.","其中一个胆子大，真去问了。"],["He answered in a direct way that surprised her.","他答得很直接，反倒让她吃了一惊。"],["He said he was an earnest student of old maps.","他说自己在很认真地研究旧地图。"],["His honesty about his age made her laugh.","他对自己年纪那么坦白，把她逗笑了。"],["He is proud of a boat he has not finished in nine years.","他为一艘九年都没造完的船感到自豪。"],["Nobody thought it was a manly thing to say, and he said it anyway.","没人觉得这话多有男子气，他还是说了。"]]},{"t":"The Guest House","s":[["The guest house is small, and the owners are almost too friendly.","这家小旅店不大，老板夫妇热情得几乎过头。"],["They are hospitable in the old way: tea first, questions later.","他们待客是老派做法：先上茶，再问话。"],["The room has a romantic view of the harbour at night.","房间夜里看港口，景色很浪漫。"],["What the guests love most is the freedom to come in at any hour.","客人最喜欢的是几点回来都行。"],["The owner is careful with the keys and counts them every night.","老板对钥匙很仔细，每晚都要数一遍。"],["Her main concern is the boiler, which is older than she is.","她最操心的是那台锅炉，比她还老。"],["She has great confidence in her son, who does all the repairs.","她特别信得过儿子，所有修补都是他干。"],["He is considerate enough to leave a note when he goes out.","他很体贴，出去都会留张字条。"]]},{"t":"The Thank-You Letter","s":[["It was a thoughtful present, and it arrived on the right day.","那份礼送得很用心，而且正好赶在那天到。"],["Her letter was sympathetic without being sad.","她那封信满是体谅，却不显得悲伤。"],["He was ready to help before anyone asked him.","还没人开口，他就已经准备好帮忙了。"],["She had to apologise for losing the book.","她为弄丢了那本书道了歉。"],["Her apology was two lines long and completely honest.","她的道歉只有两行，却句句是真话。"],["The old judge showed mercy and gave him a fine instead of a month.","老法官手下留情，罚了钱，没关他一个月。"],["I admire people who can admit a mistake that fast.","我佩服能这么快认错的人。"],["For a man of his age, his memory is remarkable.","他这个年纪，记性算得上了不起。"]]},{"t":"The Climb","s":[["The path was arduous, and two of us turned back at the first stream.","那条路很艰难，我们当中有两个人在第一条小溪就折回去了。"],["It was a tough climb for anyone over sixty.","对六十岁以上的人来说，这段爬升很吃力。"],["The guide was robust and carried two bags without complaint.","向导身体结实，背两个包也不抱怨。"],["His boots were sturdy, and that made the difference on the wet rock.","他的靴子很结实，在湿石头上这就是关键。"],["We were eager to reach the top before the clouds came.","我们急着想在云上来之前到顶。"],["The last hour was strenuous, and nobody spoke.","最后那一小时特别费力，谁都不说话。"],["We were grateful for the tea at the hut.","小屋里那壶茶，让我们很感激。"],["Our gratitude went to the woman who had lent us the map.","我们要谢的是那位借我们地图的女士。"]]},{"t":"The Village on the Postcard","s":[["The village is picturesque in every direction, which is why the buses stop here.","这个村子四面都像画，所以大巴才会在这儿停。"],["A prominent white church stands above the roofs.","一座显眼的白教堂立在屋顶之上。"],["The view from the bridge is awesome in the old sense of the word.","从桥上望出去，那种壮观还是老词里的那个意思。"],["Behind the postcard there is a mundane life of queues and repairs.","明信片背后，是排队和修修补补的平凡日子。"],["The climate is temperate, so the gardens stay green until December.","气候温和，园子到十二月还是绿的。"],["The wall paintings are delicate, and visitors are asked not to touch them.","墙上的画很脆弱，提醒客人不要碰。"],["The young man is a promising painter, and he has sold nothing yet.","那个年轻人画得有前途，可一幅都还没卖出去。"]]},{"t":"The Old Boat","s":[["He has been steadfast in his plan for eleven years.","这个计划他坚持了十一年，一直没动摇。"],["His manner is tender with the boat and short with people.","他对那条船很温柔，对人却没耐性。"],["It was naive of him to think the wood would last.","他以为那木头能撑住，想得太天真了。"],["His friends call the plan childish, and he does not mind.","朋友说这计划幼稚，他也不在意。"],["He is sincere when he says he will finish it this summer.","他说今年夏天能完工，这话是真心的。"],["Anyone who works in the rain is liable to get ill.","在雨里干活的人，容易生病。"],["The man who sells him wood is trustworthy, which is rare.","卖他木头的那个人靠得住，这挺难得。"],["His daughter is the enterprising one: she has already found buyers.","有闯劲的是他女儿，她已经找好了买家。"]]},{"t":"The Photograph","s":[["The only sane thing to do was to wait for the light.","唯一明智的做法就是等光。"],["Her method is rigorous: two shots, one place, every morning.","她的方法很严格：每天早上，同一个地方，拍两张。"],["The rules of the competition are strict about editing.","比赛规则对修图管得很严。"],["The winter there is severe, and the roads close for weeks.","那儿冬天很严酷，路一关就是几个星期。"],["Their friendship is based on mutual silence.","他们的交情建立在彼此不说话上。"],["The two sisters resemble each other in the voice, not the face.","这两姐妹像的是声音，不是脸。"],["Their houses are similar, and both have a bare wall facing north.","两家的房子差不多，朝北都有一面光墙。"],["The branch looks naked in December and familiar by March.","那根树枝十二月看着光秃秃的，到三月又眼熟了。"],["A private garden is behind the wall, and nobody photographs it.","墙后是个私家花园，没人去拍它。"],["Her intuition about weather is better than the forecast.","她对天气的直觉，比预报还准。"]]},{"t":"What You Think You Saw","s":[["The best photo was spontaneous: a child ran into the frame.","最好的一张是抢来的：一个孩子跑进了画面。"],["There was an implicit agreement that we would not publish it.","大家心里有个默契，这张不发。"],["The lake in the picture is an illusion made by salt.","照片里的湖，是盐做出来的错觉。"],["He writes about an imaginary town that looks exactly like this one.","他写一个虚构的镇子，跟这个一模一样。"],["She has a fancy that the house is watching her.","她总觉得这房子在看着她。"],["The salt flat looks like water from a distance.","远处看，盐滩就像一片水。"],["Nobody believed her until they walked out on it.","没人信她，直到自己走上去。"]]},{"t":"The Bad News","s":[["He heard the news on a Tuesday and did not speak until Friday.","他星期二听到消息，一直到星期五都没开口。"],["Losing the farm was a blow that he later called fate.","失去农场那一击，他后来管它叫命。"],["The family had made a fortune in those years, and lost it in a month.","那几年他们家挣下了一份家业，一个月就没了。"],["The old man was in agony for a week and hid it badly.","老人疼了一个星期，还硬撑着不让人看出来。"],["Her grief was quiet, and she went back to work on Monday.","她的悲痛是安静的，星期一照常去上班。"],["He grieved for the dog longer than for the house.","他为那条狗难过的时间，比为一栋房子还长。"],["Those were miserable years, and nobody wants to talk about them.","那几年过得很苦，谁也不愿提。"],["The letter brought distress to everyone in the village.","那封信让村里每个人都难受。"]]},{"t":"Three Grey Days","s":[["There was a sadness in the house that food could not lift.","屋里那股愁，拿什么都压不下去。"],["The sky was gloomy for three days, as if it agreed with us.","天阴了三天，好像也在附和我们。"],["I do not want to disappoint you, but the money is gone.","我不想让你失望，可钱确实没了。"],["One bad season should not discourage him for good.","一个坏季不该让他从此灰心。"],["Their room was wretched: one window, no heat, and a floor that moved.","他们那间屋子惨得很：一扇窗，没暖气，地板还会动。"],["The delays were frustrating for everyone in the queue.","这一拖再拖，排队的人都给憋坏了。"],["She went to mourn with the family and stayed for the meal.","她去陪那家人一起哀悼，还留下吃了饭。"]]},{"t":"The Argument in the Car","s":[["His anger comes fast and leaves just as fast.","他的火来得快，去得也快。"],["She was furious about the ticket and said so for ten minutes.","她为那张罚单气坏了，说了整整十分钟。"],["He frowned at the map, then at the road, then at me.","他先皱眉看地图，再皱眉看路，最后皱眉看我。"],["For a moment he was in a rage about a wrong turning.","有一阵他为一个拐错的路口大发雷霆。"],["The noise of the radio began to irritate him.","收音机的声音开始让他烦躁。"],["He hates being late more than he hates traffic.","他讨厌迟到，比讨厌堵车还厉害。"],["There is an old hatred between the two families about a wall.","两家为一堵墙，结了很多年的仇。"],["The flies were a nuisance at every stop.","每到一站，苍蝇都烦人得很。"],["The smell of the engine made her feel disgust.","发动机的味道让她一阵恶心。"]]},{"t":"The Neighbour Dog","s":[["The dog next door began to vex the whole street at five each morning.","隔壁那条狗每天早上五点就开始惹得全街人心烦。"],["It would harass the postman and then sit in the middle of the road.","它追着邮递员骚扰，然后往路中间一坐。"],["A long meeting can bore even a patient man.","会开得长了，再有耐性的人也厌。"],["The noise did not bother the owner, who was deaf in one ear.","这声音烦不到主人，他一只耳朵听不见。"],["It was a troublesome animal, and the letters began to arrive.","这条狗实在麻烦，投诉信开始来了。"],["The weather that winter was awful, which did not help.","那年冬天天气糟透了，更是雪上加霜。"],["There was an unpleasant smell from the yard behind the house.","屋后院子里有一股难闻的味。"],["The cold had an adverse effect on the old pipes.","严寒对旧管子有不好的影响。"]]},{"t":"The Strike","s":[["The meeting turned hostile after about twenty minutes.","会开了二十分钟左右，气氛就变成敌对了。"],["The older workers were indignant about the new hours.","老工人对新的工时很愤慨。"],["One young man had radical ideas and said them very loudly.","一个年轻想法很激进，还说得特别大声。"],["The manager was mad, and everybody in the room knew it.","经理疯了，屋里每个人都知道。"],["It was a crazy plan, and it very nearly worked.","这计划荒唐得很，可差一点就成了。"],["Someone had played a wicked trick on the night shift.","有人对夜班的人使了个坏招。"],["There was a vicious note left on the board by the door.","门边的板子上被人留了张恶毒的字条。"],["One man shouted something vulgar and was asked to leave.","一个人喊了句粗话，被请了出去。"],["In the end the whole argument was about ego, not money.","说到底，这场争吵争的是面子，不是钱。"],["He was too selfish to see that the others had children too.","他太自私，想不到别人也有孩子。"]]},{"t":"The New Manager","s":[["The new manager can be nasty when he is tired.","新经理累的时候会很难听。"],["His first decision was rash, and he knew it by lunch.","他第一个决定做得鲁莽，吃午饭时他自己就知道了。"],["His mood is volatile, so nobody plans a meeting for Monday morning.","他情绪不稳，所以没人把会排在星期一早上。"],["There is a weird rule about the second lift.","关于第二部电梯，有条规定怪得很。"],["His control over very small things is excessive.","他对极小的事都要管，管得过分。"],["Her anxiety grew every time the phone rang.","电话每响一次，她的焦虑就重一分。"],["The team was restless by the end of the month.","到了月底，整个组都坐不住了。"],["Everyone felt uneasy about the Friday meeting.","星期五那个会，人人心里都不踏实。"],["His fear was not of losing the job but of the interview.","他怕的不是丢工作，是那场面试。"],["The quietest one was too timid to ask for a raise.","最安静的那个太胆小，连加薪都不敢提。"]]},{"t":"The Neighbours Downstairs","s":[["There was a great fuss about a broken window that nobody had broken.","为一扇谁也没打破的窗户，闹了好大一场。"],["Her remark was an insult, though she called it advice.","她那句话是侮辱，她却说这是建议。"],["It was unkind, and everybody at the table knew it.","那话刻薄，桌上每个人都知道。"],["I envy her garden, and she envies my quiet street.","我羡慕她的园子，她羡慕我这条安静的街。"],["Her husband is jealous of the time she spends out there.","她丈夫妒忌她在园子里待的那些时间。"],["I doubt that the fence was ever on their land.","我怀疑那道篱笆从来就不在他们的地上。"],["Her suspicion began with a letter that was never sent.","她的猜疑是从一封没寄出的信开始的。"],["The builder was sceptical about the cost and said so.","施工的人对造价很怀疑，而且直接说了。"]]},{"t":"The Interview","s":[["The first interview was unsatisfactory, and the second was worse.","第一场面试不尽如人意，第二场更差。"],["The company is unstable, and the pay arrives late every month.","这家公司不稳当，工资每个月都晚到。"],["The job was unsuitable for someone with two small children.","这份活对带着两个小孩的人来说不合适。"],["He was unwilling to move, and they were unwilling to wait.","他不愿搬，他们也不愿等。"],["She was reluctant to explain why she had left the last place.","她不太愿意解释上一家为什么离开。"],["He hesitated before answering, and that was his answer.","他答之前犹豫了一下，那一下就是答案。"],["Two of the questions were written to confuse him.","有两个问题是故意写得让他糊涂的。"],["The mistake embarrassed him more than it cost him.","那个错让他难堪，比它带来的损失还重。"]]},{"t":"In the Car Afterwards","s":[["He felt guilty about the way he had left the last job.","上一份工作他是那样走的，心里一直有愧。"],["He regrets the year he spent there, and he says so.","他后悔在那儿待的那一年，而且他承认。"],["He repented nothing, which surprised her more than an apology would.","他一点也不悔，这比道歉还让她意外。"],["She was ashamed of how relieved she felt.","她为自己心里那股轻松感到羞愧。"],["He sighed and opened the door of the car.","他叹了口气，推开车门。"],["She began to weep in the car, quietly, with the radio on.","她在车里哭了起来，很轻，收音机还开着。"],["Her tolerance for that kind of talk was gone.","那种话，她一点都忍不了了。"],["She could endure the noise, but not the waiting.","吵她能忍，等不了。"]]},{"t":"The Village Expert","s":[["He is not ignorant; he simply stopped reading in 1985.","他不是无知，只是从一九八五年起就不读书了。"],["The sly old man knew the answer and said nothing.","那个精明的老头知道答案，却什么也不说。"],["His cunning plan was to let the others speak first.","他狡猾的地方就是让别人先开口。"],["The rule about the gate was arbitrary, and everyone ignored it.","关于大门的规矩是随手定的，没人理。"],["The story he told was ridiculous, and half of it was true.","他讲的那件事荒唐，可有一半是真的。"],["It was a stupid mistake, and he made it twice.","那是个愚蠢的错误，他还犯了两次。"],["There was an awkward silence when the bill arrived.","账单来的时候，桌上静得尴尬。"],["His clumsy fingers could not open the small box.","他手笨，那个小盒子怎么也打不开。"],["One careless remark cost him three years of friendship.","一句大意的话，让他丢了三年的交情。"],["He was oblivious to the fact that everyone had left.","人都走光了，他一点没察觉。"]]},{"t":"The Children","s":[["The two boys are naughty in a way that makes people laugh.","那两个男孩淘气，可淘得让人想笑。"],["The younger one is greedy with sweets and generous with everything else.","小的那个见了糖就贪，别的东西倒大方。"],["His questions are obtrusive, and he asks them at the worst moment.","他问话太扎眼，还总挑最不合适的时机。"],["His brother is slothful in the morning and busy at night.","他哥早上懒得很，晚上倒忙。"],["Everything about him is sluggish until the football starts.","他整个人都慢吞吞的，球一开就变了。"],["On an impulse he sold his bike and bought a guitar.","他一时冲动，把自行车卖了换了把吉他。"],["Their father is rigid about bedtime and easy about everything else.","他们的爸爸睡觉时间卡得很死，别的都随便。"],["The little one is stubborn: he will stand in the rain rather than come in.","小的那个很倔，宁可站在雨里也不进屋。"],["People say the eldest is the quiet one, but that is only a stereotype.","人家说老大都安静，那不过是个刻板印象。"]]}],"22":[{"t":"How Often the Paper Comes","s":[["The daily paper comes at six, and my father reads it before he stands up.","日报六点到，我爸坐着看完才起身。"],["The monthly magazine arrives on the third Thursday and stays in its plastic for a week.","月刊在每个月的第三个星期四到，塑料膜一个星期都没拆。"],["The quarterly report is the only one that nobody reads.","季报是唯一没人看的那种报告。"],["The annual meeting is held in the same hall every March.","年度会议每年三月都在同一个礼堂开。"],["Their yearly trip to the coast has happened for nineteen years.","他们一年一次去海边，已经去了十九年。"],["On their anniversary they go back to the same small restaurant.","结婚纪念日，他们总回到那家小馆子。"],["The bus is punctual to the minute, which is rare in this town.","这趟公交准到分，在这镇上很难得。"],["He has not missed a day of work for three consecutive years.","他连着三年一天班都没缺过。"],["The boiler is checked periodically, whatever that means in practice.","锅炉是定期检查的，至于实际多久查一次，没人说得清。"],["The duration of the meeting depends on how much coffee is left.","会开多久，全看还剩多少咖啡。"]]},{"t":"The Age of the Building","s":[["The building belongs to another era, and everyone can see it.","这栋楼属于另一个时代，谁都看得出来。"],["At present it holds forty families and one very old lift.","现在里面住着四十户人家，还有一部很老的电梯。"],["The contemporary part at the back was added in 2003.","后面那截现代风格的部分是二〇〇三年加的。"],["There is a medieval wall under the car park, which nobody mentions.","停车场底下有一道中世纪的墙，没人提这事。"],["The tower has stood for a century and survived two fires.","那座塔站了一百年，过了两场火。"],["People say the town will still be here in another millennium.","人们说，再过一千年这镇子还在。"],["A million small repairs have kept it standing.","是一百万次小修补让它一直立着。"],["A billion is a thousand million, which nobody can really picture.","十亿就是一千个百万，这个数没人真能想象。"],["A dozen families share one washing line on the roof.","十几户人家合用在楼顶的一根晾衣绳。"]]},{"t":"From Dawn to Midnight","s":[["He leaves at dawn, when the street lights are still on.","他天亮就走，那时路灯还亮着。"],["At midday the market is at its loudest, and he eats standing up.","中午市场最吵，他站着就把饭吃了。"],["He is back after midnight, and the dog does not even wake.","他过了午夜才回，狗都不醒。"],["Some of the work can be done overnight, which saves a whole day.","有些活可以夜里做，能省出一整天。"],["The night shift is quieter, and he prefers it.","夜班清静，他更喜欢夜班。"],["The modern machines do in a minute what took an hour in 1980.","现在的机器一分钟就干完一九八〇年要一小时的活。"],["A recent change in the law made all the old papers useless.","最近一次法律修改，让所有旧文件都没用了。"],["He keeps an up-to-date list of every address in the district.","他手里有一份全区地址的最新清单。"],["For a moment he could not remember the name of the street.","有一瞬间他想不起那条街的名字。"],["In an instant the lights went out across the whole block.","一眨眼，整片街区的灯都灭了。"],["When the call came, he left immediately.","电话一来，他马上就走了。"]]},{"t":"The Order of Things","s":[["First the forms, then the money, and after that the keys.","先填表，再交钱，最后拿钥匙。"],["Secondly, nobody has checked the roof since 1998.","其次，一九九八年以后就没人查过屋顶。"],["Finally the whole thing was finished in June, two years late.","最后这事儿在六月完了，晚了两年。"],["Prior to that, the office had been a back room with one window.","在那之前，办公室就是一间只有一扇窗的后屋。"],["The former manager left a note that nobody could read.","前任经理留了张字条，谁也看不懂。"],["The preceding page explains the rules, if you can find it.","前一页讲了规矩，前提是你找得到。"],["There is no precedent for a case like this one.","这样的案子没有先例。"],["Her foremost concern is the safety of the stairs.","她最看重的是楼梯的安全。"],["The opening of the new wing was cancelled twice.","新侧楼的开张取消了两次。"],["Initially they planned four floors and built three.","起初他们打算盖四层，结果盖了三层。"],["An intermediate floor was added later, without a window.","后来加了一个中间层，连窗都没有。"],["In the midst of all this, the lift stopped working.","就在这一堆事中间，电梯又停了。"]]},{"t":"Two Jobs at Once","s":[["In the meantime, the old office stayed open.","与此同时，老办公室照常开着。"],["Meanwhile, two families were living in one room.","也是那阵子，两家人挤在一间屋里住。"],["The two repairs were simultaneous, which is why the water stopped.","两处维修是同时做的，水才停了下来。"],["The ongoing work on the road has lasted a year.","路上这项一直在做的工程已经做了一年。"],["Nothing in this building is everlasting, especially the paint.","这栋楼里没有什么是永久的，尤其是油漆。"],["He was offered a permanent job and said he would think about it.","有人给他一份长期的活，他说要考虑考虑。"],["The decision is imminent, according to the letter.","照信里的说法，决定马上就要下来了。"],["Incidentally, the same man built both bridges.","顺便说一句，两座桥是同一个人修的。"]]}]}, CHS={"1":[["atmosphere","n. 大气；气氛；氛围"],["atmospheric","adj. · atmosphere 的衍生词",1],["hydrosphere","n. 水圈"],["lithosphere","n. 岩石圈"],["oxygen","n. 氧；氧气"],["oxide","n. 氧化物"],["carbon dioxide","phrase. 二氧化碳"],["hydrogen","n. 氢"],["core","n. 核；核心；重点；v. 去 (果)核"],["crust","n. 外壳；硬壳；面包皮； 地壳"],["mantle","n. 披⻛；斗篷； 覆盖物； 地幔；v. 覆盖；遮盖"],["longitude","n. 经度"],["latitude","n. 纬度；行动或言论的程 度"],["horizon","n. 地平线；(思想等的) 范围；眼界"],["altitude","n. 海拔；高度"],["disaster","n. 灾害；灾难"],["mishap","n. 不幸之事；灾祸；恶运"],["catastrophic","adj. 灾难性的"],["calamity","n. 大灾祸；灾难"],["endanger","v. 使遭危险或伤害；危 害；危及"],["endangerment","n. · endanger 的衍生词",1],["endangering","v. · endanger 的衍生词",1],["jeopardise","v. 危及；使受危险"],["destructive","adj. 破坏的；毁灭性的"],["destructively","adv. · destructive 的衍生词",1],["destructiveness","n. · destructive 的衍生词",1],["El Niño","el niño n. 厄尔尼诺现象"],["greenhouse","n. 温室；玻璃暖房"],["phenomenon","n. 现象；杰出的人(pl. phenomena)"],["pebble","n. 鹅卵石；小圆石"],["magnet","n. 磁体；磁铁"],["magnetic","adj. · magnet 的衍生词",1],["magnetism","n. · magnet 的衍生词",1],[ function forms(w){
 var f=[w,w+'s',w+'es',w+"'s",w+'ed',w+'ing',w+'ly'];
 if(/e$/.test(w)) f.push(w+'d', w.slice(0,-1)+'ing');
 if(/y$/.test(w)) f.push(w.slice(0,-1)+'ies', w.slice(0,-1)+'ied');
 if(/a$/.test(w)) f.push(w+'e');
 f.push(w+w.slice(-1)+'ing', w+w.slice(-1)+'ed');
 return f;
}
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') }
var RE={};
function build(ch){
 if(RE[ch]) return RE[ch];
 var list=CHS[ch]||[], fm=[], map={};
 for(var i=0;i<list.length;i++){
  var w=list[i][0], ws=forms(w);
  for(var j=0;j<ws.length;j++){
   var k=ws[j].toLowerCase();
   if(!map[k]){ map[k]={b:w, d:list[i][2]||0}; fm.push(ws[j]) }
  }
 }
 fm.sort(function(a,b){ return b.length-a.length });
 RE[ch]={re:new RegExp('(?<![A-Za-z])('+fm.map(esc).join('|')+')(?![A-Za-z])','gi'), map:map};
 return RE[ch];
}

  var best=null;
  for(j=0;j<fr.length;j++){
   var f=fr[j], cands=[f];
   if(f.length>2){ cands.push(f.slice(0,2)); cands.push(f.slice(-2)); }

    var c=cands[k];

    var p=zh.indexOf(c);
    if(p>=0 && (!best || c.length>best.sc)) best={s:p,e:p+c.length,sc:c.length};
   }
  }
  if(best) spans.push(best);
  else if(fr.length && !/[的地性化度者]$/.test(fr[0])){

      && zh.split(ch0).length===2){ spans.push({s:zh.indexOf(ch0),e:zh.indexOf(ch0)+1,sc:1}); }
  }

 if(!spans.length) return zh;
 spans.sort(function(x,y){ return y.sc-x.sc || x.s-y.s });

  var sp=spans[i], ok=1;

  out+=zh.slice(last,keep[i].s)+'<b class="zw">'+zh.slice(keep[i].s,keep[i].e)+'</b>';
  last=keep[i].e;
