eans something other than its words, and a phrase simply holds together.","习语的意思不等于它的字面,而短语只是连在一起说。"],["A clause has a verb in it, and a clause in a contract is a different animal entirely.","从句里有动词,而合同里的条款完全是另一回事。"],["A look can be an expression, and so can an expression like this one.","一个眼神可以是一种表情,而\"说法\"也可以是这样一个说法。"]]},{"t":"Pieces of Words","s":[["Tense is the time of it, and a tense teacher is a different word with the same spelling.","时态说的是时间,而\"紧张的\"老师是同一个拼法的另一个词。"],["A prefix goes in front and a suffix goes behind, and both change what the word can do.","前缀在前面,后缀在后面,两个都改变这个词能干什么。"],["An abbreviation saves you four letters and costs you an explanation.","缩写省下四个字母,代价是多解释一句。"],["A synonym is close enough to use, and an antonym is the one you want when you are being polite.","同义词近得可以替换,反义词是你想客气时用的那个。"],["A noun names it, a pronoun stands in for it, and a verb is what it does.","名词给它命名,代词替它出场,而动词是它做的事。"],["Singular is one and plural is more than one, and English is inconsistent about the rest.","单数是一个,复数是多于一个,英语在别的方面并不一致。"],["An adjective describes the noun, an adverb describes the verb, and a preposition tells you where.","形容词描写名词,副词描写动词,介词告诉你位置。"],["A conjunction joins two halves, and the whole sentence holds because of it.","连词把两半连起来,整句话靠它站住。"]]},{"t":"Saying It Another Way","s":[["A consistent account is one that does not change, and a complicated one is not necessarily wrong.","前后一致的说法是不变的那种,而复杂的说法不一定就是错的。"],["The problem is complex, which means it has many parts, and it is complicated, which means the parts fight.","问题是复杂的,意思是它有很多部分;而它是难缠的,意思是这些部分互相打架。"],["You compile a list, and the version you send is the third one.","你编一份清单,寄出去的那版是第三版。"],["To translate is to carry it across, and to paraphrase is to say it again in your own words.","翻译是把它搬过去,改写是用自己的话再说一遍。"],["To interpret is to say it across, and an interpreter stands between two people who cannot understand each other and says both halves twice.","口译是把它说过去;口译员站在两个听不懂对方的人中间,把两半各说一遍。"],["To narrate a film is to tell people what they are already seeing.","给电影做旁白,就是告诉人们他们正看着的东西。"],["A good example will illuminate the rule, and a good teacher will decipher the exam question first.","好例子能照亮规则,好老师会先破译考题到底在问什么。"],["Eloquence is not many words; it is the right one in the right place.","雄辩不是话多,是在对的地方用对的那个词。"]]},{"t":"Talking It Over","s":[["To communicate is to make yourself understood, which is not the same as being right.","沟通是让人听懂你,这跟说得对不是一回事。"],["A discussion has no winner, a debate has one, and both are better than silence.","讨论没有赢家,辩论有;而两样都比沉默强。"],["We brainstorm for an hour and get forty ideas, of which two are worth keeping.","我们花一小时头脑风暴,得到四十个想法,其中两个值得留下。"],["The commentary on the radio is better than the match, because the man doing it can see the whole field.","电台的解说比比赛本身好听,因为说话的人看得见全场。"],["You negotiate when neither side can walk away, and the first thing you give up is the tone.","谈判是在两边都走不掉的时候进行的,你最先放弃的是语气。"],["Their contention was that the word had changed meaning, and nobody could prove it either way.","他们的论点是这个词的意思变了,而两边都没法证明。"]]}],"9":[{"t":"The Press","s":[["Television is still the medium most people turn to first, and the press is what they read afterwards.","电视仍是大多数人先打开的媒介,报纸和新闻界是他们之后才看的。"],["A journalist goes and looks, a correspondent stays in one city and sends it back, and a messenger runs between them with a page.","记者自己去看;通讯记者待在一个城市把稿子发回来;送信的在他们之间跑腿送一页纸。"],["A critic writes what he thinks and signs his name, and that is the whole difference.","评论家写出他的看法,签上自己的名字,区别全在这里。"],["A commentator talks while the game is on, and an announcer tells you what is coming next.","解说员在比赛进行时说话,播音员告诉你下面是什么节目。"],["An exponent of a style is the person who can explain it and still do it.","一个流派的代表人物,是那种既解释得清、又做得出来的人。"],["The editor cuts the piece in half, and the typist retypes it in an hour.","编辑把稿子砍掉一半,打字员一个小时重新打一遍。"]]},{"t":"Handing It Out","s":[["They gave out a handout at the door and a leaflet at the corner, and both went in the bin.","门口发讲义,街角发传单,两样最后都进了垃圾桶。"],["Propaganda is when the same story is told a hundred times and nobody checks it.","宣传是同一个故事讲一百遍,没人去核对。"],["To publish is to make it public, and to disseminate it is to make sure it reaches people who did not ask.","出版是把它公开,传播是确保它送到没要它的人手里。"],["Nobody could foresee the change, though a few had anticipated it for years.","没人预料到这个变化,尽管有几个人盼了好几年。"],["We expect a decision by Friday, and we await the letter that will explain it.","我们指望周五之前有个决定,也在等着那封解释它的信。"],["A consensus is not the same as a vote, and it takes longer.","共识不等于投票,而且要更久。"],["A rumour travels faster than a fact, and gossip is the version with names in it.","谣言比事实跑得快,而闲话是加了人名的那一版。"]]},{"t":"A Good Evening","s":[["Every pastime is a way of not working, and the best ones feel like work at first.","每种消遣都是不干活的办法,而最好的那些起初干着像干活。"],["A film will entertain you for two hours, a book will amuse you for a week, and neither is called recreation.","电影让你高兴两个小时,书让你高兴一个星期,可两样都不叫娱乐休闲。"],["The festival begins on Friday, and the feast that opens it takes four hours.","节从周五开始,开场那顿盛宴要吃四个小时。"],["The programme is printed a month ahead, and every rehearsal is worse than the last.","节目单提前一个月印,每次排练都比上一次更糟。"],["On the night they perform to eight hundred people, and it works because nobody can see their hands shaking.","当晚他们演给八百人看,成了,因为没人看得见他们的手在抖。"],["A child will imitate what he sees, a comic will mimic the way you walk, and a machine can simulate both.","孩子模仿他看见的,滑稽演员模仿你走路的样子,而机器两样都能模拟。"],["The circus came with two elephants, and the magic was the part nobody could work out.","马戏团带着两头大象来,只有魔术那部分谁都看不明白。"]]},{"t":"On the Stage","s":[["Drama began in the street and moved indoors, and the stage is where it stopped.","戏剧从街上开始,搬进屋里,而舞台就是它停下的地方。"],["A concert is one evening, a symphony is one piece, and an orchestra is forty people who must agree for an hour.","音乐会是一个晚上,交响乐是一首曲子,管弦乐队是四十个人得在一个小时里保持一致。"],["The ballet has no words at all, and the opera has nothing but.","芭蕾一个词都没有,歌剧除了词什么都没有。"],["A comedy ends with a wedding and a tragedy ends with a body, and both are about the same thing.","喜剧以婚礼结束,悲剧以尸体结束,两者说的是同一件事。"],["Animation is twenty four drawings a second, and a film is the same trick with people.","动画是一秒钟二十四张画,而电影是拿真人做同一个把戏。"],["The movie was X-rated, which means nobody in the room was under eighteen.","那部电影是成人级,意思是屋里没人未满十八岁。"],["She has the role of the sister, and she is on the scene for four minutes.","她演姐姐那个角色,在台上出现了四分钟。"],["The gallery is free on Sundays, and the exhibition of his early work closes in June.","美术馆周日免费,他早期作品的展览六月结束。"],["It is an aesthetic question, not a technical one, and nobody can settle it.","这是审美的问题,不是技术问题,没人能定下来。"]]},{"t":"Made by Hand","s":[["An artist signs it, a craftsman sells it, and a painter does one and then the other.","艺术家给它签名,工匠把它卖掉,而画家先签名,再卖掉。"],["She will collect almost anything and select four things to keep, and then opt for none of them.","她几乎什么都收,挑出四样留着,最后一样也不留。"],["A photograph is a second, a portrait is a week, and a painting can be a year.","照片是一秒钟,肖像是—个星期,而一幅油画可以是一年。"],["The sculpture took two men and a crane, and it still leans a little.","那件雕塑用了两个人和一台吊车,如今还是有点歪。"],["You draw what you see, depict what you remember, and describe what you cannot do either of.","看见什么就画下来,记得什么就描绘出来,两样都做不到的就用话描述。"],["He carves the wood with a knife and improvises the rest.","他用刀在木头上刻,剩下的部分即兴来。"]]},{"t":"The Band","s":[["Musical taste splits at about fourteen, and after that nobody changes their mind.","音乐口味十四岁左右就定下来了,之后没人再改主意。"],["Classical is older than the building, jazz is older than the audience, and rock is older than the band.","古典比这栋楼还老,爵士比听众还老,摇滚比乐队还老。"],["Hip-hop began with two turntables, and pop is whatever was on the radio when you were fifteen.","嘻哈从两台唱机开始;而流行就是十五岁时收音机里放的那些。"],["The lyric is the words, the melody is the line they sit on, and the rhythm is what your foot does.","歌词是词,旋律是词坐的那条线,而节奏是你脚做的事。"],["A band is four people and one argument, and a solo is the same four people being polite.","乐队是四个人加一场争吵,独奏是同样四个人客客气气。"],["The tone of the room changes when the tune changes, and nobody can say why.","调子一变,屋里的气氛就变了,没人说得出为什么。"],["There is a disc in the machine, a piano in the corner, and a violin that nobody has played since 1998.","机器里有张唱片,角落有架钢琴,还有一把从 1998 年起就没人拉过的小提琴。"],["A cello is a violin that grew up, a guitar is what you take to a party, and a harmonica fits in a pocket.","大提琴是长大了的小提琴,吉他是你带去聚会的那种,口琴能装进口袋。"],["The trumpet is the loudest and the flute the quietest, and the drum decides when it stops.","小号最响,长笛最轻,而鼓决定什么时候停。"]]},{"t":"The Games","s":[["A competition is anyone against anyone, and a tournament is the same thing with a draw and a date.","比赛是人和人对着来,锦标赛则是同样的事,只是多了抽签和日期。"],["The Olympic games come every four years, and a city will spend ten years paying for two weeks.","奥运会四年一次,而一座城市要用十年来还那两个星期的账。"],["A sponsor puts money in and a patron puts money in and asks for nothing back, and both get their name on the wall.","赞助商掏钱,资助人掏钱还不要回报,两个都把名字挂在墙上。"],["An athlete trains six days a week, and a champion is the one who does it for ten years.","运动员一周练六天,而冠军是那个练了十年的人。"],["A spectator pays to watch and a volunteer pays nothing to carry the water.","观众花钱来看,志愿者不花钱,还负责搬水。"],["She became famous in one afternoon and well-known by the end of the week, and neither made her faster.","她一个下午就出名了,一个星期内人尽皆知,而两样都没让她跑得更快。"],["An energetic runner will beat a vigorous one over a mile, because energetic lasts and vigorous only starts well.","一英里跑下来,有干劲的会赢过气势猛的,因为干劲撑得久,气势只在开头好看。"],["The stadium holds sixty thousand, and the gym under it is empty on Sundays.","体育场能坐六万,底下的健身房周日空着。"],["Training is what you do in the rain, and exercise is what you do when somebody else is watching.","训练是你在雨里做的,锻炼是有别人看着时做的。"],["Indoor courts are booked three weeks ahead, and outdoor ones are free and full of wind.","室内场地要提前三周订,室外的不收费,也满是风。"]]},{"t":"Balls and Rackets","s":[["Chess is the only game where nobody has to move at all.","国际象棋是唯一一种谁都不用动身体的游戏。"],["Badminton is fast and golf is slow, and both are ruined by the wind.","羽毛球快,高尔夫慢,两个都被风毁了。"],["Billiards is played in a dark room and soccer in the rain, and the crowd prefers the second.","台球在暗屋子里打,足球在雨里踢,而观众更喜欢后者。"],["Tennis needs one racket, volleyball needs two hands, and hockey needs a stick and a bad temper.","网球要一把球拍,排球要两只手,曲棍球要一根棍和一副坏脾气。"],["The goal is the thing you aim at and the thing you score, which is why the word does two jobs.","球门既是你打的目标,也是你得的那个分,所以这个词干两件事。"],["You bat with a bat, which is a stick, and you hit with a racket, which has strings.","用球棒击球,球棒是根棍;用球拍打,球拍有弦。"],["He will kick the ball, knock it past one man, flip it over another and pitch it into the box.","他踢球,把球从一个人身边捅过去,再从另一个人头上挑过去,最后吊进禁区。"],["Then he will throw it, or toss it, and it comes down where nobody expected.","然后他把球扔出去,或者随手一抛,球落在谁也没想到的地方。"]]},{"t":"On the Move","s":[["A mobile phone is the only thing here that moves more than the children.","这里唯一比孩子动得更多的东西,是手机。"],["Movement is the word for all of it, from a wave of the hand to a crowd going home.","动作这个词泛指所有这类动,从挥一下手到一群人回家。"],["Yoga is slow on purpose, and the first thing it teaches is that you cannot sprawl and stretch at the same time.","瑜伽是故意慢的,它教的第一件事就是:你不能一边摊着一边伸展。"],["A long stretch will strain the muscle, and the strain lasts a week.","拉得太久会拉伤肌肉,而那一伤要疼一个星期。"],["You slide on ice, slip on a wet step, and glide across a frozen lake without a sound.","你在冰上打滑,在湿台阶上滑一跤,在冻住的湖面上无声地滑过去。"],["He will tumble down the last three steps and laugh about it.","他会从最后三级台阶上摔下来,还笑。"],["We ski in February, skate in January, and go cycling in between.","二月滑雪,一月溜冰,中间那段时间骑车。"],["She will dive off the rock, drift out with the current, and then jump back in for a second go.","她从岩石上跳下去,随水流漂出去,然后又跳回来再来一次。"],["A leap is longer than a jump, a plunge is straight down, and a hop is on one foot.","跃比跳更远,扎下去是直着往下,而单脚跳只用一只脚。"],["The ball will bounce twice and then stop, and that is the end of the game.","球弹两下就停了,比赛也就到此为止。"]]},{"t":"A Day Out","s":[["We put up the tent in the dark and camped beside the river, and it rained at four.","我们摸黑支起帐篷,在河边扎营,四点下起雨来。"],["The picnic was eaten in the car, which is not what anyone had planned.","野餐最后在车里吃的,这不在任何人的计划里。"],["They hunt in the autumn and walk the rest of the year, and the race is in April.","他们秋天打猎,其余时候走路,比赛在四月。"],["The marathon is twenty six miles, and the last six are the ones people talk about.","马拉松二十六英里,人们谈论的是最后那六英里。"],["A pedestrian has no pace of his own and takes the step the crossing gives him.","行人没有自己的步速,过街时走的是斑马线给他的那一步。"],["The excursion is a short one, the cruise is a slow one, and the trip is the one that goes wrong.","短途游是短短的一趟,航游是慢慢的航行,而旅行是会出岔子的那一趟。"],["The vacation is two weeks and the hike is one day of it.","假期是两个星期,徒步是其中一天。"],["I jog to the gate, stride up the hill, and then wander along the top with nowhere to be.","我慢跑到大门,大步上山,然后在顶上闲逛,哪儿也不去。"],["Some of us linger by the water, and the last two lag half a mile behind.","我们里有几个人在水边磨蹭,最后两个落后了半英里。"],["You climb the last part with your hands, pull yourself over the top, and drag the bag after you.","最后一段你得手脚并用爬上去,把自己拉过顶,再把包拖上来。"],["Then you bend down, pick it up, and bow to nobody in particular.","然后你弯腰把东西捡起来,朝谁也不算地鞠了个躬。"]]}],"10":[{"t":"Moving Out","s":[["We packed everything into boxes and found out how much stuff two people can own.","我们把东西都装进箱子,才发现两个人能有这么多东西。"],["Every item had to be decided on, and half of them went out of the door.","每一样东西都得做个决定,一半被搬出了门。"],["The shop downstairs sells merchandise nobody needs and souvenirs nobody keeps.","楼下那家店卖没人需要的商品,和没人留着的纪念品。"],["A clay pot from the site is an artefact, and the plastic copy in the shop is not.","从遗址里挖出的陶罐是人工制品,店里那个塑料仿的就不是。"],["Material is what things are made of, and the raw material for all of it came out of the ground.","材料是东西的构成,而所有东西的原材料都从地里出来。"],["Crude oil is oil before anybody has done anything to it, and the word also means rude.","原油是还没被人加工过的油,而这个字也有粗鲁的意思。"],["Water is a necessity during the move, and a corkscrew is not.","搬家时水是必需品,开瓶器不是。"],["She wore the same outfit for three days, and her kit for the new flat was one bag.","她一套衣服穿了三天,给新家备的那套东西只有一个包。"],["A knife is a utensil, and so is a spoon, and both were in the wrong box.","刀是器具,勺子也是,两个都装错了箱子。"]]},{"t":"The Bin","s":[["Half of what we threw out was garbage, and the other half was rubbish we could have sold.","我们扔出去的一半是垃圾,另一半是本可以卖掉的东西。"],["Anything in the trash on Tuesday is gone by Wednesday, and nobody asks where.","周二丢进垃圾桶的东西,周三就没了,没人问去了哪儿。"],["We recycle the glass and reuse the jars, and the rest goes to the landfill.","玻璃回收,罐子重复用,剩下的进填埋场。"],["Litter is what people drop, and a litter of puppies is what a dog has, and the two are not related.","垃圾是人随手丢的东西,也是一窝小狗崽,两个意思不相干。"],["It is a waste of money to buy it and a waste of space to keep it.","买它是浪费钱,留着是浪费地方。"],["The shed is full of junk that belonged to the people before us.","棚子里塞满了前一任住户留下的废旧杂物。"],["The sewerage was rebuilt in 1998, and it still smells in August.","排水系统 1998 年重修的,八月还是有味。"]]},{"t":"Washing Up","s":[["A little detergent in hot water will do more than an hour of scrubbing.","热水里放一点洗涤剂,比刷一个小时都管用。"],["She keeps a lotion by the sink and shampoo in the shower, and both are almost finished.","她在水池边放一瓶乳液,淋浴间放着洗发水,两瓶都快用完了。"],["The soap is a hard bar, and it lasts a month.","肥皂是硬块的那种,能用一个月。"],["Fill the tub, put the plug in, and turn the tap the other way.","把浴盆放满,塞上塞子,水龙头往另一边拧。"],["The pipe under the sink leaks, and the tube behind it is worse.","水池下面的管子漏水,后面那根还更糟。"],["Take the mop to the floor and the broom to the step, and sweep the rest out of the door.","地上用拖把,台阶用扫帚,剩下的扫出门去。"]]},{"t":"The Bedroom","s":[["The mattress is ten years old and the carpet is older, and neither has ever been turned.","床垫十年了,地毯更老,两样从来没翻过面。"],["There is a rug by the bed and a mat at the door, and both are there to save the floor.","床边一块小毯,门口一块垫子,两个都是为了护地板。"],["A cushion makes a hard chair bearable, and a pad under a chair saves the carpet.","靠垫让硬椅子能坐,椅子脚下的垫子救地毯。"],["In winter there are two blankets and a quilt, and in summer only a sheet.","冬天两条毯子加一床被,夏天只有一条床单。"],["The pillow is flat because somebody slept on it for twenty years.","枕头是扁的,因为有人在上面睡了二十年。"],["A sponge will take the mark off the wall, and a dry towel will take the water off the window.","海绵能把墙上的印子擦掉,干毛巾能把窗上的水抹掉。"]]},{"t":"The Drawer","s":[["A staple holds four pages together, and a nail holds a shelf to a wall.","订书钉把四页纸订在一起,钉子把架子钉在墙上。"],["The razor is blunt, so he will shave in the evening and cut himself anyway.","剃须刀钝了,于是他晚上刮,还是把自己刮破了。"],["A fuse goes before the wire does, which is the whole point of it.","保险丝会在电线之前断,这就是它的用处。"],["The cable runs round the room and the cord reaches the lamp, and the two are tied with a strand of string.","电缆绕着屋子走,细绳接到灯上,两个用一根线系住。"],["A match will light the candle, and the wax will hold it in place.","火柴点蜡烛,蜡把它固定住。"]]},{"t":"Paper and Print","s":[["He keeps his drawings in a portfolio and his paperbacks in a box.","他把画收在文件夹里,平装书放在箱子里。"],["A pamphlet is thin, a tissue is thinner, and both are thrown away by Friday.","小册子薄,纸巾更薄,两个到周五都进了垃圾桶。"],["The cover is the only part anybody reads, and it is the part the publisher pays for.","封面是唯一每个人都看的部分,也是出版社肯花钱的部分。"],["Xerox the page and duplicate the file, and keep one of the copies in the drawer.","把这一页复印,文件再复一份,其中一份放抽屉里。"],["A memorandum is a note that will be read by six people and quoted by none.","备忘录是一条便笺,六个人会读,没人会引用。"],["All the stationery is in the second drawer, with the glue, the ink and the rubber.","文具都在第二个抽屉,和胶水、墨水、橡皮放一起。"],["The scissors are for paper and the shears are for the hedge, and nobody remembers which is which.","剪刀剪纸张,大剪子剪树篱,没人记得清哪个是哪个。"]]},{"t":"Bits of the Whole","s":[["The edge of the table is sharp, and the rim of the cup is not.","桌子的边是锋利的,杯子的沿不是。"],["Every element of the design matters, and the cost is the factor that decides it.","设计的每个要素都重要,而成本是决定它的那个因素。"],["Read the first section and then the last, because the middle is padding.","先读第一节再读最后一节,中间那段是凑数的。"],["There is a tag on the handle and a label on the lid, and a badge on the front of the box.","把手上挂着标签,盖子上贴着标签,箱子正面还有一枚徽章。"],["A bolt holds the door, and a knob lets you open it.","插销把门闩住,球形把手让你能拉开。"],["You handle it carefully, because the handle itself is loose.","你小心地搬它,因为把手本身就松了。"],["Pull the shutter down and the curtain across, and the room is dark by three.","把百叶窗放下、窗帘拉上,三点钟屋里就黑了。"],["One pane is cracked, and the opacity of the glass is why nobody noticed.","一块窗玻璃裂了,而玻璃本身不透明,所以谁都没发现。"]]},{"t":"Containers and Lights","s":[["There is a jar of honey, a barrel of rain water, a bucket and a pail, and the last two are the same thing.","一罐蜂蜜、一桶雨水、一个提桶和一个木桶,后两个其实是同一样东西。"],["The phone rings twice and stops, and the bell at the door does the same.","电话响两声就停了,门口的铃也一样。"],["The camera is small enough to be portable, and it takes better pictures than the big one.","这台相机小得可以随身带,拍出来比大的还好。"],["The spotlight is on the singer and the lantern is by the door, and one of them is for the power cut.","聚光灯打在歌手身上,灯笼挂在门边,其中一个是为停电准备的。"],["The bulb went at nine, and the flashlight was where it always is, which is not where we looked.","九点灯泡炸了,手电筒在它一向在的地方,而那不是我们找的地方。"],["The refrigerator hums, the fridge door does not shut, and the vacuum has not been out since March.","冰箱嗡嗡响,冰箱门关不严,吸尘器从三月起就没拿出来过。"],["The fan turns all night, and the switch by the door turns it off.","风扇转一整夜,门边的开关把它关掉。"]]},{"t":"Furniture and Fixings","s":[["The hurdle in the field is a fence you can jump, and the hurdle in the office is a fence you cannot.","田里的跨栏是能跳过去的围栏,办公室里的难处是跳不过去的那种。"],["Fence the garden before you plant it, or the rabbits will decide for you.","种之前先把园子围起来,不然兔子替你做决定。"],["The pedal is stiff, and the ladder is one rung short.","踏板很硬,梯子少一级。"],["The shelf holds forty books, and the lift holds four people.","架子放四十本书,电梯装四个人。"],["He stood on a stool to reach the top drawer, and it came out in his hand.","他踩在凳子上够最上面的抽屉,抽屉跟着他的手出来了。"],["Take the umbrella and the raincoat, because the forecast is wrong half the time.","带上伞和雨衣,因为预报有一半是错的。"],["They dredge the river every spring, and the mud goes to the brick mill.","他们每年春天疏浚河道,泥送到砖厂。"],["A can of paint, a can of beans, and a can of worms, and only one of them is a metal can.","一罐油漆、一罐豆子、一罐麻烦,只有一个是铁皮罐。"]]},{"t":"Metal and Cloth","s":[["A forge is where the metal is heated and beaten, and it is also a verb meaning to make a false thing look real.","锻造车间是加热、捶打金属的地方,而\"锻造\"也是动词,意思是把假东西做得像真的。"],["An alloy is two metals mixed, and brass and bronze are the two oldest ones.","合金是两种金属混在一起,黄铜和青铜是最老的两种。"],["Iron is heavy and cheap, lead is heavy and soft, and both were used before anybody worried about it.","铁重而便宜,铅重而软,两样都在有人担心之前被大量用过。"],["Cement, lime and plaster all come out of the same hole in the ground, and they set in different ways.","水泥、石灰、灰泥都出自地上同一个坑,而凝结的方式各不相同。"],["Leather lasts, plastic does not, and the cheap one looks right for a year.","皮革耐用,塑料不耐用,而便宜的那种头一年看着还行。"],["The fibre decides how the fabric hangs, and the fabric decides how the coat looks.","纤维决定布料怎么垂,布料决定外套好不好看。"],["She will knit a scarf and weave a mat, and both take longer than the shop.","她织一条围巾、编一张席子,两样都比去店里花时间。"],["Canvas is for sails, linen is for tables, cotton is for everything, and nylon is for the rain.","帆布做帆,亚麻布铺桌子,棉布什么都能做,尼龙用来挡雨。"],["The lumber came from the yard, and the wooden frame is the only thing in the room that is not plastic.","木料来自料场,而屋里唯一不是塑料的东西就是那个木框。"]]},{"t":"Digging It Out","s":[["The mine closed in 1981, and the pit behind it is full of water.","矿 1981 年关了,后面的矿坑积满了水。"],["Fuel costs more than it did, so they lubricate everything twice a year and hope.","燃料比从前贵,所以他们一年润滑两次,然后指望它没事。"],["A diamond is a crystal that was squeezed for a million years, and the word also means the shape on a card.","钻石是压了一百万年的结晶体,这个词也指牌上的那个形状。"],["The copy is inferior, and it is counterfeit, and the shop calls it a fake.","那个仿品质量差,是伪造的,店里管它叫假货。"],["A fragile thing has to be packed twice, and a miniature one three times.","易碎的东西得包两层,微型的得包三层。"],["Nothing in that shop is available before June, and nothing in it is durable either.","那店里的东西六月前都没有货,而且没有一样耐用。"]]}],"11":[{"t":"What Is Worn This Year","s":[["Fashion is what everyone is wearing, and style is what you wear when nobody is looking.","时尚是大家都在穿的,风格是没人看的时候你穿的。"],["A trend is a direction, and a tendency is a gentler word for the same thing.","潮流是一个方向,倾向是同一件事更温和的说法。"],["The popularity of a colour lasts one season, and then it looks like a mistake.","一种颜色的流行只撑一季,之后就看着像个错误。"],["In the 1990s big shoulders were the vogue, and they may prevail again, because nothing is ever finished.","九十年代流行大垫肩,说不定又会盛行,因为什么都完不了。"],["A model wears it first, an icon wears it once, and an idol is the one teenagers copy.","模特先穿,偶像穿一次,而青春偶像是青少年照着学的那位。"]]},{"t":"Gold and Jade","s":[["Luxury is a thing you do not need and cannot quite afford, and an extravagant one is that twice over.","奢侈品是你不需要、也正好买不起的东西;再奢侈一点,就是两样都占。"],["She keeps her jewellery in a box, and the jewel in it came from her grandmother.","她把首饰收在盒子里,里面那颗宝石是她奶奶留下的。"],["A gem is cut and a stone is not, and jade is the one that is carved instead.","宝石是切过的,原石没切;而玉是那种拿来雕的。"],["They adorn the wall with a paper ornament and embellish the story until it is not true.","他们在墙上挂一张纸做的装饰,把故事说得越来越花,直到不是真的。"],["She will embroider flowers on the collar, and the hairdressing on the day takes two hours.","她在领子上绣花,那天的发型要做两个小时。"],["The pigment in the cloth is a dye, and it will run in the wash.","布上的色素是染料,一洗就掉色。"],["At the masquerade everybody wore a costume and a veil, and nobody was who they said.","化妆舞会上人人穿着戏服、蒙着面纱,谁都不是他说的那个人。"]]},{"t":"Beautiful and Otherwise","s":[["The dress in the window will fascinate a child and bore a man in a hurry.","橱窗里那条裙子能让孩子着迷,让赶路的人无聊。"],["It is a decent coat, which means it is not beautiful and will last ten years.","那是件体面的外套,意思是它不好看,但能穿十年。"],["The embroidery is exquisite, and the work on the sleeve is finer still.","刺绣很精美,袖子上的活儿还要细。"],["She moves with grace, and the whole room calls it elegance, though it is only practice.","她走起路来很优雅,满屋子的人称之为高雅,其实只是练出来的。"],["Nobody looks perfect at seven in the morning, and the appearance you see at nine has been worked on.","早上七点没人好看,你九点看到的那张脸是收拾过的。"],["Cosmetics and make-up are the same thing, and one word sells better than the other.","化妆品和化妆是一回事,只是一个词比另一个好卖。"],["He is handsome in the way a building is, and she is charming in the way a cat is.","他好看得像一栋楼,她迷人得像一只猫。"],["Pretty is a small word for a small thing, beautiful is the large one, and ugly is the honest one.","漂亮是给小事的小词,美是大词,而丑是老实的那个。"]]},{"t":"In the Wardrobe","s":[["A dress is one piece and a garment is any piece, and both are what you clothe yourself in.","连衣裙是一件,除此之外的衣服都叫外衣,两样都是你穿在身上的。"],["The uniform is grey and everyone hates it, which is the point of a uniform.","校服是灰的,所有人都讨厌它,而这正是制服的意义。"],["The laundry comes back on Thursday, and half of it is not ours.","星期四洗衣店把衣服送回来,一半不是我们的。"],["The wardrobe is full and there is nothing to wear, and that has been true for thirty years.","衣柜满了,却没得穿,这句话三十年来都成立。"],["An overall is for painting, an overcoat is for the cold, and a robe is for the bathroom.","罩衣是刷墙穿的,大衣是挡冷的,长袍是浴室里穿的。"],["She wore a gown to the dinner and a sweater to the market, and the same shoes to both.","她晚宴穿长礼服,去集市穿毛衣,两处穿同一双鞋。"],["The jacket is too small, the skirt is too long, and the jeans have never fitted anybody.","外套太小,裙子太长,那条牛仔裤谁穿都不合。"],["Trousers are plural because there used to be two pieces, and nobody has told the word.","裤子是复数,因为从前它是两片,而这个词一直没被告知这件事。"]]},{"t":"Small Things","s":[["The clasp on the bag is broken, so she holds it shut with a button.","包上的扣坏了,她用一颗纽扣把它别住。"],["A glove for each hand, and one of them has been missing since January.","一只手一只手套,其中一只从一月起就不见了。"],["A hat has a brim and a cap does not, and both keep the rain off your face.","有帽檐的才叫帽子,没檐的只是小帽,两个都能替你挡雨。"],["The scarf is wool and the handkerchief is cotton, and neither has been washed since Sunday.","围巾是羊毛的,手帕是棉的,两个从周日就没洗过。"],["She keeps the purse in her bag and the wallet in her coat, and the money in neither.","她把小包放在手袋里,钱包放在大衣里,钱两处都不放。"],["A vest goes under and a wrap goes over, and a cloak covers all of it.","背心穿里面,披肩披外面,斗篷把这一切都盖住。"],["The collar is frayed, the sleeve is short, and the sock has a hole in the heel.","领子磨毛了,袖子短了,袜子在脚后跟破了个洞。"],["One stocking, one slipper, one boot, and the lace on the boot is not the original.","一只长袜、一只拖鞋、一只靴子,而靴子上的鞋带不是原来的。"]]},{"t":"With a Needle","s":[["The tailor will take it in at the waist, and he does it without a measurement.","裁缝会在腰上收紧一点,他连尺子都不用。"],["She can sew a hem and spin wool, though nobody spins at home any more.","她会缝下摆,也会纺羊毛,虽然如今没人在家纺线了。"],["One stitch holds a hundred threads, and the whole coat is nothing but stitches.","一针串起百根线,而整件外套不过是无数个针脚。"],["Thread the needle, put in a pin, and keep the string on the table.","穿针、别上别针,把线留在桌上。"],["The strap is leather and the stripe down the leg is silk, and the ribbon is from a box of chocolates.","带子是皮的,裤腿的钱条是丝的,缎带是巧克力盒上的。"],["A belt holds the trousers, a chain holds the gate, and a bracelet holds nothing at all.","腰带固定裤子,链子锁门,而手镯什么都不固定。"],["The necklace is beads and the beads came off a broken rosary.","项链是串珠的,珠子来自一串坏了的念珠。"],["The textile mill made velvet and wool in the same year, and the patch on the elbow is older than the coat.","纺织厂那年又做天鹅绒又做羊毛;肘上那块补丁比外套还老。"],["A rag will do for the dust, and the shabby chair is the one everybody wants.","一块破布就能擦灰,而那张破旧的椅子是人人都想坐的。"],["The coat is too tight across the shoulders, and that is what he says about everything.","这件外套肩太紧,而他对什么都这么说。"]]},{"t":"Colour","s":[["The colour of the wall is white, and the light makes it yellow by four.","墙是白的,四点钟的光把它照成黄的。"],["The floor is brown, the door is grey, and the curtain is a pink nobody chose.","地板是棕的,门是灰的,窗帘是那种没人主动会选的粉。"],["She dyed the cloth purple in June, and by September it had faded to a dull tan.","她六月把布染成紫的,到九月已经褪成暗褐。"],["A stain on the sleeve and a blot on the page are the same accident in two places.","袖子上的污渍和纸上的墨渍,是同一场意外发生在两处。"],["She has a slender figure and a slight limp, and only one of them is noticed.","她身材苗条,走路有点瘸,而只有一样被人注意到。"]]}],"12":[{"t":"At the Table","s":[["Food is what you eat, and your diet is what you eat every week, which is a different question.","食物是你吃的东西,而日常饮食是你每个星期吃的东西,这是两个问题。"],["Appetite is wanting it and hunger is needing it, and the second one always wins.","胃口是想要,饥饿是需要,而后者总是赢。"],["A treat is something you did not earn, and a birthday cake is the usual example.","款待是你不该得的东西,生日蛋糕就是常见的例子。"],["The hotel will cater for eighty people, and the provision for the winter fills one cupboard.","旅馆能供应八十人的饭,而过冬的储备装满一个柜子。"],["Anything edible goes in the pot, and the recipe for the rest is in her head.","能吃的东西都下锅,剩下的配方在她脑子里。"],["A supplement is for what the diet is missing, and most people take it without asking.","补充剂是补饮食里缺的那些,而大多数人根本不问就吃。"],["You chew it, you digest it, and the body does the rest in its own time.","你嚼它、消化它,剩下的身体按自己的节奏做。"],["He was thirsty all afternoon, and the water was in the other room.","他一下午都渴,而水在另一个房间。"]]},{"t":"Eating Out","s":[["A restaurant has a menu, a refectory has one dish, and a cafeteria lets you choose and carry it yourself.","饭店有菜单,食堂只有一样菜,自助餐厅让你自己挑、自己端。"],["A buffet is a table you go back to, and a barbecue is one you stand around.","自助餐是你来回走的桌子,烧烤是你站在旁边的那个。"],["Supper is at eight and the banquet is at nine, and both are longer than they should be.","晚饭八点开始,宴会九点开始,两个都比该有的时间长。"],["Refreshments are served at four, which means tea and two kinds of biscuit.","四点供应茶点,意思是茶和两种饼干。"],["A snack is what you eat standing up, and an appetiser is what you eat before you sit down.","小吃是你站着吃的,开胃菜是你坐下之前吃的。"],["The cuisine here is simple and the chef has been in the same kitchen for twenty years.","这里的菜式简单,主厨在同一个厨房里待了二十年。"],["A gourmet will pay for the smell alone, and a vegetarian will ask what is in the soup.","美食家光为一个香味就肯付钱,而素食者会先问汤里有什么。"],["You order at the counter and take it away, and the takeaway box is hotter than the plate.","你在柜台点单、带走,外卖盒比盘子还烫。"]]},{"t":"The Kitchen","s":[["The cutlery is silver and the plates are ceramic, and the good ones are porcelain and never used.","餐具是银的,盘子是陶瓷的,好的那套是瓷的,从来不用。"],["A bowl holds soup, a dish holds the rest, and a saucer is only there for the cup.","碗盛汤,盘盛别的,而茶托只是给杯子垫着。"],["Bring the tray in, put a fork and a knife on the right, and a spoon where it belongs.","把托盘端进来,叉子和刀放右边,勺子放它该在的地方。"],["A glass for water, a mug for tea, and the kettle has not been off since six.","水用玻璃杯,茶用大杯,水壶从六点起就没停过。"],["The pan is on the stove and the pot is in the oven, and the furnace below keeps the whole place warm.","平底锅在灶上,锅在烤箱里,下面的炉子把整间屋子烘暖。"],["Open a tin, take off the lid, and there is dinner.","开一个罐头,掀开盖子,晚饭就有了。"]]},{"t":"Something to Drink","s":[["A drink can be water, and a beverage is the word you use on a menu.","喝的东西可以是水,而饮料是菜单上用的那个词。"],["The juice is fresh, the soda is cold, and the coffee has been on since seven.","果汁是鲜的,苏打水是冰的,咖啡从七点就煮着。"],["Alcohol is in all three of those bottles, and liquor is the one that is forty per cent.","那三个瓶子里都有酒精,而烈酒是四十度那种。"],["The whisky is older than the brandy and costs twice as much, and nobody can tell them apart.","威士忌比白兰地陈,价钱是两倍,而没人分得出来。"],["He was drunk by nine and sober by two, and he remembers none of it.","他九点就醉了,两点清醒过来,什么都不记得。"],["Tobacco is grown here, and a cigarette costs less than a loaf of bread.","这里种烟草,一支香烟比一条面包还便宜。"]]},{"t":"Vegetables","s":[["A vegetable can be a tomato, a potato, a pea or a bean, and only one of those is a fruit.","蔬菜可以是西红柿、土豆、豌豆或豆子,而其中只有一样是水果。"],["The cucumber is watery, the cabbage is heavy, and both are cheap in September.","黄瓜水多,卷心菜沉,两个在九月都便宜。"],["An onion makes you cry, a mushroom grows in a week, and an eggplant is purple and soft.","洋葱让你流泪,蘑菇一星期就长成,茄子是紫的、软的。"],["A carrot is orange, a turnip is white, and a radish is the small red one that bites back.","胡萝卜是橙的,芜菁是白的,小萝卜是那种小的红的,还辣嘴。"],["You peel the potato, strip the leaves from the stem, and hull the peas one by one.","你削土豆皮、把叶子从茎上撸下来、一颗一颗剥豌豆。"]]},{"t":"Fruit","s":[["A cherry is small and a melon is not, and both are in season for a month.","樱桃小,甜瓜不小,两个的当季都只有一个月。"],["A berry is soft, a grape is soft and sour, and a papaya is soft and orange.","浆果软,葡萄又软又酸,木瓜软而且是橙色的。"],["A peach has a stone, a pear has a core, and a plum is the one that stains your hand.","桃子有核,梨有芯,而李子会把手染上颜色。"],["An orange is worth the trouble, a lemon is worth a little, and a kiwi is worth two minutes with a spoon.","橙子值得费那个劲,柠檬值得费一点,而猕猴桃值得花两分钟拿勺子挖。"]]},{"t":"From the Field","s":[["A crop is what you planted, a harvest is what you got, and the two are never the same number.","庄稼是你种下的,收成是你得到的,两个数从来不一样。"],["The corn is taller than the wheat, and the grain from both goes to the mill.","玉米比小麦高,两者的谷粒都送进磨坊。"],["You reap in August, the flour comes back in September, and the porridge lasts all winter.","八月收割,九月面粉回来,粥能吃一冬天。"],["The paste is flour and water, and that is also what the glue is made of.","面团是面粉加水,而胶水也是这两样做的。"],["They keep livestock behind the house, and the chicken is the only one with a name.","他们在屋后养牲畜,只有那只鸡有名字。"],["A turkey is for December, beef and pork are for the weekend, and mutton is for the people who grew up with it.","火鸡留给十二月,牛肉猪肉留给周末,羊肉留给从小吃它的人。"],["A sausage is what is left over, and a good one hides it well.","香肠是剩下的东西做的,好的香肠藏得很好。"],["The fish came out of the pond this morning, and the rod is still by the door.","鱼是今早从池塘里捞的,鱼竿还在门边。"]]},{"t":"Dairy and Bread","s":[["The dairy sends milk twice a week, and the yogurt is made in the same shed.","奶场一周送两次奶,酸奶在同一间棚子里做。"],["Cream goes in the coffee, cheese goes on the bread, and butter goes on both.","奶油放进咖啡,奶酪放在面包上,黄油两样都涂。"],["A salad is what you eat in January, a sandwich is what you take to work, and a hamburger is what you eat instead.","一月份吃沙拉,上班带三明治,而汉堡是你改吃的东西。"],["A loaf lasts three days, a pie lasts two, and a pizza does not last the evening.","一条面包吃三天,一个馅饼两天,而披萨熬不过一个晚上。"],["The pasta and the spaghetti are the same thing in two shapes, and the soup is what you have when there is nothing else.","意面和细面是同一样东西的两种形状,而汤是没别的可吃时才做的。"],["Pudding, a biscuit and jam, a handful of nuts, and a square of chocolate at the end.","布丁、一块饼干抹果酱、一把坚果,最后再来一块巧克力。"],["The ice cream is vanilla because nobody agrees on anything else.","冰淇淋是香草味的,因为别的口味谁都说不到一块。"]]},{"t":"Salt and Spice","s":[["Mustard is yellow and sharp, wasabi is green and worse, and both are there to hide the fish.","芥末酱是黄的、冲的,山葵是绿的、更冲,两个都是为了盖住鱼味。"],["Pepper, ginger, garlic and scallion go in first, and the vinegar goes in last.","胡椒、姜、蒜、葱先下锅,醋最后放。"],["Salt is what makes it taste like something, and sugar is what makes children eat it.","盐让菜有味道,糖让孩子肯吃。"],["Candy and honey are both sweet, and the honey is the one with a flavour of its own.","糖果和蜂蜜都甜,而蜂蜜是自带风味的那种。"],["A sour note, a sweet one and a bitter one make a dish, and a spicy one makes it memorable.","酸、甜、苦凑成一道菜,而辣让它被记住。"],["It was delicious, and the children said it was yummy, and it was neither tasty nor hot.","那菜很好吃,孩子们说好吃极了,而它既不鲜美也不辣。"],["A spice is a seed and a sauce is a liquid, and the ketchup on the table is neither.","香料是种子,酱汁是液体,而桌上那瓶番茄酱两样都不是。"],["The perfume in the kitchen is only the onion, and the ingredient nobody lists is the time.","厨房里的香味只是洋葱,而没人写进配料表的那一样是时间。"]]},{"t":"In the Pan","s":[["A cook works with what is there, and a chef decides what is there.","厨子用手边有的东西做菜,主厨决定手边有什么。"],["You bake bread, fry an egg, roast a chicken and toast the slice that is left.","烤面包、煎蛋、烤鸡,把剩下那片也烤一下。"],["A child will suck the ice and lick the spoon, and then chew the same spoon for a minute.","孩子会吮冰块、舔勺子,然后啃那只勺子一分钟。"],["Chewing gum is for the car, and nobody chews it at the table.","口香糖是车上用的,饭桌上没人嚼。"],["Soak the beans overnight, dip the bread in the oil, and squeeze the lemon over the top.","豆子泡一夜,面包蘸油,柠檬汁挤在上面。"],["Stir it once, grind the pepper, and slice it thin.","搅一下,磨点胡椒,切薄片。"]]}],"13":[{"t":"Building Something","s":[["Architecture is the whole art of it, and an erection of this size takes two years.","建筑学是这门手艺的总称,而这么大一栋楼立起来要两年。"],["The structure is steel and the floors are concrete, and neither will move in a hundred years.","结构是钢的,楼板是混凝土,一百年里两样都不会动。"],["They construct the frame first, and everything else is hung on it.","他们先造框架,别的东西都挂在它上面。"],["A fallen tree will obstruct the road for a day, and a bad design will obstruct the light for fifty years.","倒下的树挡路一天,糟糕的设计挡光五十年。"],["The firm was established in 1890 and has built nothing since 1990.","这家公司 1890 年成立,1990 年以后什么也没建。"],["The city was founded where two rivers meet, and it has been building ever since.","这座城市建在两条河交汇的地方,从那以后一直在盖。"],["Stability is what you pay for, and it is the part nobody notices.","稳定性是你花钱买的东西,也是唯一没人会注意的部分。"]]},{"t":"Where It Stands","s":[["The site was a car park, and the venue will hold four thousand.","这块地原先是停车场,而会场能容纳四千人。"],["It is now a landmark, and people give directions by it instead of by the street.","它现在是地标,人们指路用它,不用街名。"],["The house is situated on the north side, and the view is the reason it cost so much.","房子坐落在北侧,而风景就是它这么贵的原因。"],["We could not locate the entrance, because it is behind the building.","我们找不到入口,因为它在楼后面。"],["His family has resided here since 1850, and nobody has ever asked why.","他家从 1850 年就住在这里,从来没人问过为什么。"],["Two hundred people inhabit the village in winter and a thousand in August.","冬天村里住着两百人,八月有一千。"],["The birds migrate in October, and the ones that stay have nowhere else to go.","鸟十月迁徙,留下的那些是没别处可去。"],["They settled here after the war, in a dwelling that had no roof.","战后他们在这里定居,住进一处没屋顶的房子。"]]},{"t":"Where People Live","s":[["A skyscraper is a block of flats standing on its end, and a villa is the same money spread out flat.","摩天大楼是竖起来的公寓楼,而别墅是同样的钱摊平了铺在地上。"],["The mansion has eleven bedrooms and nobody sleeps in nine of them.","那座宅邸有十一间卧室,其中九间没人睡。"],["An apartment in the city costs what a house costs outside it, and the hostel costs nothing at all.","城里一套公寓的价钱,等于城外一栋房子;而青年旅社几乎不要钱。"],["The lodge at the gate is one room and a stove, and it has been empty since 2011.","门口那间小屋是一个房间加一个炉子,2011 年以后就空着。"],["A hut is made of what is lying around, a cabin is made of wood, and a cottage is made to look old.","棚屋是手边有什么就用什么搭的,小木屋是木头做的,而村舍是特意做成旧样子的。"],["The cellar is cold all year, which is why the wine is kept there.","地窖全年都凉,所以酒放在那儿。"],["The shed leans to the left, and the ladder behind it is holding it up.","棚子往左歪,后面的梯子正在撑着它。"],["The nursery is on the ground floor, and the cradle by the window is older than the building.","托儿所在一层,窗边那只摇篮比这栋楼还老。"],["The shelter is for the night, and it holds twelve beds and no names.","避难所只过一夜,里头十二张床,不问姓名。"]]},{"t":"Getting Around Inside","s":[["The city is laid out on a grid, so a block is always the same size.","城市按网格铺开,所以每个街区大小都一样。"],["Walk down the aisle, through the porch, and along the corridor to the end.","沿着过道走,穿过门廊,再沿走廊走到头。"],["The stair is narrow and the staircase is wider, and both are dangerous in the dark.","台阶说的是那一级,楼梯是整道,两样在暗处都危险。"],["The building has nine storeys, and each storey is one layer of the same plan.","这楼有九层,每一层都是同一张图的一层。"],["Take the elevator to the fifth floor and the escalator back down, because the handrail is the only thing that works.","坐电梯到五楼,再坐扶梯下来,因为这儿只有扶手是好的。"],["A pillar holds the roof and a column holds the pillar, and both are only for show.","柱子撑着屋顶,圆柱撑着柱子,两个其实都只是装饰。"],["A steel beam runs the length of the room, and the vault above it is brick.","一根钢梁横贯整个房间,上面那个拱顶是砖的。"],["The arch over the door is older than the door, and the ceiling is lower than it looks.","门上的拱比门还老,而天花板比看上去矮。"],["Water comes off the eaves and down the chimney, which is the wrong way round.","水从屋檐下来,又顺着烟囱下去,这是反的。"]]},{"t":"Inside a House","s":[["Reception is at the front, and the lobby behind it is bigger than the office.","接待处在前面,后面的大厅比办公室还大。"],["There is a bench by the door and a parlour on the left, and the parlour is never used.","门边一条长凳,左边一间客厅,而那客厅从来不用。"],["The fireplace is blocked up and the radiator does the work now.","壁炉封了,现在靠暖气片干活。"],["The living room faces south and the kitchen faces north, and that is the whole design.","客厅朝南,厨房朝北,设计就这么回事。"],["The cabinet in the corner holds the plates nobody uses.","角落那口柜子装着没人用的盘子。"],["The balcony holds two chairs and a plant, and in summer it holds four people.","阳台上放两把椅子一盆花,夏天能站四个人。"],["The lavatory is upstairs and the toilet downstairs, and the difference is only the word.","盥洗室在楼上,厕所在楼下,区别只在用词。"],["The bath is in the corner, the basin is under the window, and the water takes five minutes to run hot.","浴缸在角落,脸盆在窗下,水要放五分钟才热。"]]},{"t":"Shops and the City","s":[["You can reserve it online and collect it at the store, which saves an hour.","可以在网上预订,到店里取,省一个钟头。"],["The mall is a street with a roof, and the supermarket at the end is the only shop that matters.","购物中心是一条加了顶的街,尽头那家超市是唯一要紧的店。"],["There is a booth at the corner selling tickets, and a casino above it that nobody mentions.","街角有个卖票的小亭,上面还有一家没人提的赌场。"],["The studio is on the third floor, and the light in it is the reason it costs what it does.","工作室在三楼,里面的光就是它值这个价的原因。"],["Downtown is empty after six, and the urban ring outside it is full of people.","市中心六点以后就空了,而外面那一圈城区挤满了人。"],["The peripheral roads are wider and go nowhere, and the vicinity of the station is all car parks.","外围的路更宽,却哪儿也不通;车站附近全是停车场。"],["There is room for four tables in the corner, and a void where the piano used to be.","角落里放得下四张桌子,钢琴原来的位置空着一块。"],["The flat is spacious and airtight, which is another way of saying it is hot in July.","这套房子宽敞又密封,换个说法就是七月很热。"],["Beyond the last house there is an expanse of field, and a plaza where the market used to be.","最后一栋房子外面是一大片田,还有一块从前是集市的广场。"],["The castle on the hill is a ruin, and the town has grown around it.","山上的城堡成了废墟,镇子绕着它长了出来。"]]},{"t":"The Trades","s":[["A carpenter works in wood and a mason works in stone, and neither will touch the other job.","木匠做木头,石匠做石头,谁的活谁都不碰。"],["The tile on the roof is red, and the brickwork under it is the reason it has stood for a century.","屋顶的瓦是红的,下面的砌砖才是它站了一百年的原因。"],["The bridge is a suspension one, which means the road hangs from two cables.","那座桥是悬索桥,意思是路面吊在两根缆上。"],["Hang the coat on the hook, and use the lever to lift the lid.","外套挂在钩子上,用撬杆把盖子抬起来。"],["The scaffold goes up in a morning and comes down in an afternoon, and the building takes a year.","脚手架一个上午搭起来,一个下午拆掉;而楼要盖一年。"],["Infrastructure is the part of the city nobody photographs, and it is the part that fails first.","基础设施是城市里没人拍照的部分,也是最先坏的部分。"],["The apparatus on the roof measures the wind, and the crane beside it lifts the steel.","屋顶上的装置测风,旁边的起重机吊钢。"],["A malfunction in the lift closed the building for a day, and the man who came to fix it was here for an hour.","电梯一次故障让整栋楼关了一天,来修的人只待了一个小时。"],["Maintain it every year and it will last fifty; leave it and it will last five.","每年维护,它能用五十年;放着不管,五年。"]]},{"t":"Fixing It","s":[["You fix what is broken and mend what is worn, and the second job takes longer.","坏了的修,磨破了的补,而第二个活儿更花时间。"],["They had to modify the plan when the ground turned out to be wet.","发现地下是湿的,他们只好改方案。"],["Trim the hedge, weld the gate, saw the plank and screw the hinge back on.","剪树篱、焊大门、锯木板、把合页拧回去。"],["Drill the hole first and check it with a plumb line, or the shelf will lean.","先钻孔,再用铅垂线校一下,不然架子会歪。"],["The viaduct carries the road over the valley, and its longest span is ninety metres.","高架桥把路架过山谷,最长的一跨有九十米。"],["The dam was built in 1958 and the village under it was moved in 1957.","大坝 1958 年建成,坝下的村子 1957 年就搬走了。"],["They install the heating in September and furnish the flat in October.","他们九月装暖气,十月给房子配家具。"],["The placement of the door decides the whole layout, and the layout decides how you live in it.","门的位置决定了整个布局,而布局决定你怎么在里面过日子。"],["She will design it herself, and then change it twice before the builder arrives.","她要自己设计,然后在施工队来之前改两次。"]]},{"t":"Ways In and Out","s":[["The entrance is round the back and the exit is where you came in, which is a fire risk.","入口在后面,出口是你进来的地方,这是消防隐患。"],["Entry is free on Sunday, and the competition is open for entries until June.","周日免费入场,比赛征稿到六月。"],["You enter through the side door, and nobody will stop you.","你从侧门进去,没人会拦。"],["Outside the wall there is a bench, and outside the town there is nothing.","墙外有一条长凳,镇外什么都没有。"],["The outward face is brick and the inner one is plaster, and nobody has seen both.","朝外那面是砖,朝里那面是灰泥,没人两面都见过。"],["The exterior was repainted last year, and the interior has not been touched since 1980.","外墙去年重刷过,内部从 1980 年就没动过。"],["An external door has to open outwards, and an internal one usually opens in.","外门必须向外开,内门一般向内开。"],["She turned her inward anger on the wall, and the wall did not mind.","她把心里的火撒在墙上,墙并不在意。"]]}],"14":[{"t":"Getting There","s":[["You navigate by the stars in the old books and by a phone now, and neither tells you the road is closed.","旧书里靠星星导航,现在靠手机,可两个都不告诉你路封了。"],["The voyage took eleven days and nobody was sick after the third.","这趟远航走了十一天,第三天之后没人再晕船。"],["Aviation is a hundred years old, which is younger than most of the roads it flies over.","航空只有一百年,比它飞过的大多数路都年轻。"],["The journey is four hours by train and six by bus, and both feel longer.","坐火车四个小时,坐大巴六个小时,两个都感觉更久。"],["She travels for work and I travel for the sake of it, and we never agree about anything.","她出差,我纯粹是为了走而走,我们从来没意见一致过。"],["They went on safari in February and came back with four hundred photographs.","他们二月去非洲看野生动物,带回来四百张照片。"],["The parade goes down the avenue at ten, and the whole town stands on the curb.","游行十点沿着大街走,全城人都站在路缘上看。"],["The old house is said to be haunted, which is why it is now an attraction.","据说那座老宅闹鬼,所以它现在成了景点。"],["There is a memorial at the port, and a pyramid of stones on the hill behind it.","港口有一座纪念碑,后面山上有一座石头堆成的金字塔。"],["You need a visa for that country and a stamp for this one, and neither office opens before ten.","去那个国家要签证,来这个国家要盖章,两个办公室都不在十点前开门。"]]},{"t":"At the Airport","s":[["The traffic to the airport is worse than the flight itself.","去机场的路上比飞机还难受。"],["The airline sends a message at six, and the airplane is already late.","航空公司六点发消息,而飞机已经晚了。"],["A helicopter can land anywhere and a jet needs three kilometres, so neither is useful in the same place.","直升机哪儿都能落,喷气机要三公里跑道,所以两个不在同一个地方有用。"],["The parachute is checked twice and the flight is checked once, which is the wrong way round.","降落伞检查两遍,航班只检查一遍,这是反的。"],["The pilot walks past and says nothing, and the passenger beside me says everything.","机长走过去,一句没说;旁边那位乘客什么都说了。"],["Baggage goes in the hold and luggage goes on the rack, and both words mean the same thing in the end.","行李进舱底,随身行李上架子,两个词最后说的是一回事。"],["My suitcase is the blue one and my carry-on is the small bag that does not fit under the seat.","箱子是蓝的那个,手提的小包塞不到座位底下。"],["Freight goes by night and passengers go by day, and the fare is the same for both.","货运走夜班,客运走白天,而两边的价钱一样。"]]},{"t":"On the Road","s":[["Open the atlas at the page with two roads and pick the one that is not straight.","把地图册翻到有两路的那一页,挑不直的那条。"],["The route is longer but the itinerary is shorter, which nobody believes until they drive it.","走的路线更长,行程反而更短,没人信,直到自己开一遍。"],["This passage is narrow enough for one car, and there is a sign at the far end that says so.","这段通道窄得只容一辆车,尽头还有个牌子写着这句话。"],["At the intersection you can cross, but you cannot turn, and that is the whole problem.","到了十字路口你能直穿,却不能转弯,问题就出在这儿。"],["The way to the station goes through the market, and there is no other way.","去车站的路穿集市,没有别的走法。"],["A path is for feet, a lane is for one car, and an avenue has trees on both sides.","小路走人,车道只容一辆车,大街两边有树。"],["The highway is fast and dull, and the old road beside it is slow and not.","高速公路快而无聊,旁边那条老路慢,但不无聊。"],["They paved the lane in 1998 and put a signpost at the corner, and now it is on every map.","这条路 1998 年才铺上,街角又立了路标,如今它出现在每张地图上。"]]},{"t":"What Moves","s":[["A vehicle is anything that carries you, from a tractor to a pedicab.","交通工具是任何能载你的东西,从拖拉机到人力三轮。"],["An auto is a car, and the prefix means self, which is the whole history of the thing.","汽车就是汽车,而那个前缀意思是\"自己\",整部历史都装在这个词里。"],["The express stops at three towns and the coach stops at nine, so take the first.","特快停三个镇,长途客车停九个,所以坐前者。"],["An ambulance goes through and a truck does not, and the difference is the sound.","救护车能一路穿过去,卡车不能,区别在声音。"],["A lorry and a van carry the same weight and one of them is taller.","载重卡车和厢式车拉的一样重,其中一辆更高。"],["A wagon was pulled by horses and a carriage carried people, and both words are now only in museums.","四轮货车是马拉的,四轮马车载人,两个词如今只在博物馆里。"],["A cart has two wheels, a cycle has two and no motor, and the tram runs on rails down the middle of the avenue.","大车两个轮,自行车两个轮还没马达,而电车沿着大街中间的轨道跑。"],["The garage smells of oil, and the motor inside has more horsepower than the car needs.","车库一股油味,里面那台发动机的马力比车需要的还多。"],["Check the tyre, test the brake, honk once, and put both hands on the wheel.","看轮胎、试刹车、按一声喇叭,两只手放到方向盘上。"]]},{"t":"The Crew","s":[["The crew is six people and the captain is the only one who sleeps.","机组六个人,机长是唯一睡得着的那位。"],["A steward brings the water and a sailor ties the rope, and neither is paid to be polite.","乘务员送水,水手系绳,两个的工资都不含客气。"],["In an emergency you have ninety seconds, and the plan is printed on the card.","紧急情况下你只有九十秒,而那套办法印在卡片上。"],["The wreck was found in 1962, forty years after the crash, and the crash was nobody's fault.","残骸 1962 年才找到,离那次坠毁已经四十年,而坠毁不怪任何人。"],["The crowd began to crush towards the gate, and then to dash for the last train.","人群开始往门口挤,接着又为末班车狂奔。"],["The ship seemed to vanish in the fog and then to disappear from the radio as well.","船在雾里好像一下没了,接着也从无线电里消失。"],["Ice on the road is a hazard that nobody respects until the second winter.","路面结冰是一种危险,没人当回事,直到第二个冬天。"]]},{"t":"In the Water","s":[["The harbour is deep enough for one ship at a time, and the dock was rebuilt in 2004.","港口深得一次只进一条船,码头 2004 年重修过。"],["Drop the anchor, let the tide turn, and wait for the morning.","抛下锚,等潮水转向,等到早上。"],["The lower deck will submerge at high water, which is why nobody sleeps there.","下层甲板涨潮时会没入水里,所以没人睡那儿。"],["A sailor knows the wind and a seaman knows the rope, and the navy wants both.","水手懂风,海员懂绳,海军两样都要。"],["The carrier brings the mail and the steamer brings the people, and the liner brings both and a band.","运输船带邮件,汽船带人,而邮轮两样都带,还带一支乐队。"],["A vessel is any ship, a ferry goes back and forth, and a raft is what you build when there is nothing else.","船是统称,渡轮来回摆渡,而木筏是实在没别的办法时才扎的。"],["You can sail it, row it with an oar, or paddle a canoe, and the last one is the oldest.","你可以扬帆、用桨划,或者划独木舟,最后一种最古老。"],["Below the deck the turbine turns the propeller, and the stern is where the flag goes.","甲板下面涡轮带动螺旋桨,船尾是挂旗的地方。"],["Everybody aboard by six, and we embark at seven.","六点人都得上船,七点开船。"]]},{"t":"Channels and Lines","s":[["The channel between the two islands is deep, and the canal across the neck is not.","两岛之间的水道很深,而穿过地峡的那条运河不深。"],["A ditch carries the water away from the field and into the river.","一条沟把水从田里带走,送进河里。"],["The railroad came in 1870 and the railway closed in 1965, and the line is a path now.","铁路 1870 年通,1965 年停,如今那条线成了一条小路。"],["A locomotive is the engine and nothing else, and it pulled eleven carriages.","机车只是那个车头,它拉了十一节车厢。"],["The subway is above ground here, and the underground is what everybody calls it anyway.","这条地铁在这里是走地上的,而大家还是叫它地下铁。"],["They dug the tunnel for nine years and the rail inside it took two more.","隧道挖了九年,里面铺轨又花了两年。"]]},{"t":"Times and Parcels","s":[["The train departs at seven and arrives at eleven, and you will be tired at both ends.","火车七点开、十一点到,两头你都累。"],["The destination is the same for everybody, which is why nobody talks.","大家的目的地一样,所以没人说话。"],["A delay of twenty minutes becomes an hour, and then they postpone the whole thing.","晚点二十分钟变成一个钟头,然后他们干脆把整件事往后推。"],["They will defer the decision to June, and by June nobody remembers it.","他们要把决定推到六月,到六月就没人记得了。"],["There is a lull after lunch when nothing moves and nobody minds.","午饭后有一小段空档,什么都不动,也没人在意。"],["The ticket expires in March and the passport is due for renewal in April.","票三月到期,护照四月该换了。"],["The postage went up again, and a stamp costs more than the card.","邮资又涨了,一张邮票比明信片还贵。"],["The mail comes at ten, and she will bind the packet for you with string.","邮件十点到,她会把你那个小包用绳子捆好。"],["He wrapped the package twice and wrote the address on the parcel in pencil.","他把包裹包了两层,用铅笔在包上写了地址。"]]},{"t":"Carrying Things","s":[["The load is what the truck carries and the burden is what the driver feels.","负荷是车拉着的东西,负担是司机心里的东西。"],["You transfer at the second stop and transmit the message when you get there.","你在第二站换乘,到了那儿再把消息发出去。"],["The goods are in transit for three days and nobody signs for them until the fourth.","货在路上走三天,到第四天才有人签收。"],["They deliver on Tuesday and convey the apology on Wednesday.","他们周二送货,周三转达歉意。"],["Speed is how fast you go and velocity is that plus a direction, which is the only difference.","速度只讲快慢,而速率还带方向,区别就这一个。"],["The answer came back swift and short, and that was the end of it.","回信来得又快又短,事情就到此为止。"]]}],"15":[{"t":"How a Country Is Run","s":[["A republic has a president instead of a king, and that is the only thing the word promises.","共和国用总统代替国王,这个词只保证这一件事。"],["A government is the people in charge this year, and the authority behind them lasts longer.","政府是今年掌权的那批人,而他们背后的权威活得比他们久。"],["Political life runs down a hierarchy, from the ministry to the office to the man at the desk.","政治生活顺着等级往下走,从部到办事处,再到桌边那个人。"],["A democracy counts heads, a bureaucracy counts forms, and the second one always wins on a Friday.","民主数人头,官僚数表格,而星期五总是后者赢。"],["An egalitarian wants everyone level, and a regime that says so rarely is.","平等主义者希望人人一样高,而这么说的政权很少真是。"],["A revolution changes who is in charge, and a reform changes how they do it, which takes longer.","革命换掉掌权的人,改革换他们做事的方法,而后者更花时间。"],["The whole process takes ten years, and the conservative half of the room wants it to take twenty.","整个进程要十年,而屋里保守的那一半希望它花二十年。"]]},{"t":"Names and Flags","s":[["Marxism came first, socialism came next, and communism was the name for the end of it.","马克思主义在先,社会主义在后,共产主义是它终点的名字。"],["Materialism says the world is matter, and in ordinary speech it means wanting things.","唯物主义说世界是物质的,而在日常说法里它指想要东西。"],["A meltdown is not a crash; it is the whole thing going soft and running away.","熔毁不是撞毁,而是整个东西软下去、流走。"],["The municipal council meets on the first Monday, and the arena is hired for the parade.","市政委员会每月第一个周一开会,游行租的是那个体育场。"],["They stayed neutral for two years, which is a way of choosing a side later.","他们中立了两年,这其实是晚点再选边的一种办法。"],["The two countries signed a bilateral deal, and the flag on the banner was the same one.","两国签了一份双边协议,横幅上的旗也是同一面。"]]},{"t":"The People at the Top","s":[["The president opens it, the premier speaks at it, and the minister answers for it.","总统开幕,总理讲话,部长负责答问。"],["A secretary keeps the minutes, and a secretary of state runs the department.","秘书管会议记录,而国务卿管一个部。"],["Parliament sits for two hundred days, and the senate sits for a hundred.","议会一年开两百天,参议院开一百天。"],["The conference is in June and the meeting is on Thursday, and only one of them matters.","大会在六月,会议在周四,只有一个是真要紧的。"],["The headquarters is in the capital, and the delegation from the north stays on the third floor.","总部在首都,北方来的代表团住三楼。"],["He spoke on behalf of the whole group, which is why nobody else was allowed to speak.","他代表整组人发言,所以别人都不许说话。"],["The police answer to the mayor, and the mayor answers to nobody until May.","警察归市长管,而市长在五月之前谁都不归。"],["A statesman thinks about the next generation, and a politician thinks about the next election.","政治家想下一代,政客想下一次选举。"]]},{"t":"The Office","s":[["The service is free at the point of use, and somebody still pays for it.","这项服务在用的时候不要钱,可总有人在付账。"],["The office is on the second floor, the bureau is across the road, and the department is in another city.","办公室在二楼,办事处在马路对面,而部门在另一座城市。"],["Administration is the part nobody votes for and everybody notices when it stops.","行政是没人投票选的那部分,可它一停大家都发现。"],["One firm will dominate the market for ten years and then vanish in two.","一家公司能主导市场十年,然后用两年消失。"],["Power is the ability to make it happen, and influence is the ability to make somebody else want it.","权力是能让事情发生,而影响力是能让别人也想要它。"],["A bad speech will affect the room before it changes a single mind.","一场糟糕的演讲先影响屋里的气氛,还没改变任何人的想法。"],["Importance is what the newspaper gives it, and significance is what it has after the newspaper is gone.","重要性是报纸给它的,而意义是报纸没了之后它还剩的东西。"]]},{"t":"Bodies and Unions","s":[["An organisation is any group with a name, and an association is one you join.","机构是任何有名字的团体,而协会是你加入的那种。"],["A union speaks for the workers, a league speaks for the clubs, and a consortium speaks for the money.","工会替工人说话,联盟替俱乐部说话,而财团替钱说话。"],["The community here is four streets and one school, and everybody knows the school.","这里的社区是四条街加一所学校,而那所学校人人都知道。"],["An institution is older than the people in it, and it will outlast them.","机构比里面的人老,也会比他们活得久。"],["The two parties united for one year and then remembered why they had split.","两派联合了一年,然后又想起当初为什么分开。"],["Every nation thinks it is unique, and every one of them is right.","每个国家都觉得自己独特,而每一个都说对了。"]]},{"t":"At Home and Abroad","s":[["A global company has an office everywhere and a home nowhere.","全球公司在哪儿都有办事处,而在哪儿都不是家。"],["The shortage was worldwide, and the price rose in every country that could pay.","短缺是全球性的,凡是付得起钱的国家都涨了价。"],["A federal system has two levels of law, and the two of them argue for a living.","联邦制有两级法律,而这两级靠吵架过日子。"],["Foreign policy looks outwards, and overseas means across the sea.","外交政策是朝外看的,而海外的意思是在海那边。"],["He went abroad at nineteen and came back at forty with an accent.","他十九岁出国,四十岁带着口音回来。"],["Civil law is not the army, and a civil servant is not a soldier.","民法不是军队,而公务员也不是兵。"],["Her family emigrated in 1956, and another family immigrated into the same house a year later.","她家在 1956 年移居国外,一年后另一家人搬进了同一栋房子。"]]},{"t":"Crowns and Colonies","s":[["The old king reigned for forty years and ruled for none of them.","老国王在位四十年,真正管事的日子一天也没有。"],["A puppet government does what it is told, and the throne behind it belongs to somebody else.","傀儡政府照吩咐办事,它背后的王位属于别人。"],["The crown was kept in a box, and a wreath was laid at the gate every spring.","王冠收在盒子里,每年春天门口会放一个花环。"],["The colony became independent in 1962, and the slum by the port is older than both dates.","这块殖民地 1962 年独立,而港口边的贫民窟比这两个年份都老。"],["Liberty is what they asked for, and independence is what they got, and the two are not the same.","他们要的是自由,拿到的是独立,两个并不是一回事。"],["The refuge took in forty families, and the asylum cases are still being heard.","收容所收了四十户人家,而庇护的案子还在审。"]]},{"t":"Who Counts","s":[["The population is falling, and the demographic report says why in three graphs.","人口在下降,人口统计报告用三张图说明了原因。"],["A citizen has a passport, a resident has a lease, and the second one can be sent home.","公民有护照,居民有租约,而后者可以被送回原籍。"],["The country has eleven ethnic groups and two racial categories on the form, which is not enough.","这个国家有十一个民族,而表格上只有两个种族选项,这不够用。"],["A clan is a family that remembers further back than most.","宗族是一个记得比大多数人都远的家族。"],["The franchise was given to women in 1918 and to everyone else in 1948.","选举权 1918 年给了女性,1948 年才给了所有人。"],["The law entitles you to a hearing, and in practice you get a form.","法律给你听证的权利,而实际上你拿到一张表格。"],["A preference for local produce is cheap to have and hard to act on.","偏爱本地农产品不花钱,就是很难做到。"]]},{"t":"The Vote","s":[["You vote on Thursday and the result is known by midnight.","周四投票,到半夜结果就出来了。"],["They will elect eleven people and then argue about which eleven.","他们要选出十一个人,然后再为是哪十一个吵。"],["Half the respondents said yes, and a quarter said nothing at all.","一半的回答者说好,四分之一什么都没说。"],["The poll was wrong in 2016 and nobody trusts it now.","民调在 2016 年错了一次,如今没人信它。"],["Her ambition is the seat, and she will nominate herself if nobody else does.","她的野心是那个位子,如果没人提名她,她就自己提。"],["There is a checklist for the day, and the succession is written down in case.","那天有一张清单,接班的顺序也写下来备着。"],["Safety and welfare are two different budgets, and well-being is neither.","安全和福利是两笔预算,而安乐两样都不是。"],["The town has grown in harmony with the river, and the trade has been steady for a century.","镇子和河一起长,和和气气;生意稳了一百年。"],["The market began to flourish in 1994, and the man who started it did not succeed at anything else.","市场 1994 年开始兴旺,而开办它的那个人别的事一件都没成。"]]},{"t":"Points of View","s":[["The prospect is good, and the prospect from the hill is better.","前景不错,而从山上看到的景更好。"],["Perspective is what distance gives you, and a viewpoint is where you stand.","视角是距离给你的,而观点是你站的位置。"],["From her standpoint the rule is fair, and from his it is not.","从她的立场看这条规则公平,从他的立场看不是。"],["His outlook changed after the second winter, and the guideline did not.","第二个冬天之后他的看法变了,而指导方针没有。"],["An ethic is what you do when nobody is watching, and a rule is what you do when somebody is.","道德是你没人看着时做的事,而规则是有人看着时做的事。"],["I suggest we wait, I advise you to leave, and neither is an order.","我建议再等等,我劝你走,两个都不是命令。"],["The proposal is nine pages and the hint is in the last line.","提案九页,暗示在最后一行。"]]},{"t":"Saying It Out Loud","s":[["To declare is to say it in public, and to affirm is to say it again under oath.","宣布是当众说,而确认是宣誓之后再说一遍。"],["He claims the money is his, and the other side claims it is theirs.","他声称这钱是他的,另一边声称是他们的。"],["They proclaimed a republic at noon and had lost it by evening.","他们中午宣布成立共和国,到晚上就丢了。"],["The report states the facts, announces the findings and then clarifies what it means.","报告陈述事实、公布结论,然后澄清它到底什么意思。"],["Two neighbours came to assist, and one of them brought aid in the form of a ladder.","两个邻居来帮忙,其中一个带的援助是一把梯子。"],["The council will encourage the scheme and then implement it badly.","议会会鼓励这个方案,然后执行得很糟。"],["They monitor the air, admit the fault, and promise to try again.","他们监测空气、承认错误,然后保证再试一次。"]]},{"t":"Where People Come From","s":[["The African collection is on the first floor and the European one above it.","非洲的藏品在一楼,欧洲的在上面。"],["Latin was the language of the whole thing, and it is still on the stones.","拉丁语曾是这一切的语言,如今还刻在石头上。"],["The Jewish quarter is small, and the Arabian one beside it is smaller.","犹太区很小,旁边的阿拉伯区更小。"],["A Portuguese sailor, a Spanish map and a Roman road all meet in that museum.","一个葡萄牙水手、一张西班牙地图和一条罗马大道,在那座博物馆里碰头。"],["The Russian names on the wall are older than the Swiss ones.","墙上俄文的名字比瑞士的名字老。"],["Greek is on the left of the door and Italian on the right.","门上左边是希腊文,右边是意大利文。"],["The old Soviet sign is still up, and nobody has been paid to take it down.","那块苏联时期的牌子还挂着,没人出钱把它拆下来。"],["An Indian family moved in next door, and their eldest went to Australia in 2019.","一家印度人搬到隔壁,他们家老大 2019 年去了澳大利亚。"],["Her sister is in New Zealand, her brother in Canada, and her mother has never left Britain.","她姐姐在新西兰,哥哥在加拿大,而她母亲从没离开过英国。"],["The wine is from France and the engine is from Germany, and the label says neither.","酒是法国的,发动机是德国的,而标签上两样都没写。"]]}],"16":[{"t":"The Shop on the Corner","s":[["The economy of this street is four shops and a bank, and the bank is the only one that survives.","这条街的经济是四家店加一家银行,而活下来的只有银行。"],["Trade began with salt and cloth, and it is still about moving things from where they are cheap to where they are not.","贸易从盐和布开始,到现在还是把东西从便宜的地方运到不便宜的地方。"],["The market is on Saturday, and the merchants come in on Friday night.","集市在周六,商人们周五晚上就到。"],["The whole industry is three factories, and the financial side of it is one man with a calculator.","整个产业就是三家厂,而它的财务那一面,是一个拿计算器的人。"],["A fund was set up in 1998, and people still donate to it without asking what it does.","1998 年设了一项基金,如今人们还在往里捐钱,也不问它做什么。"],["An old man endowed the school with the land, and the school has never thanked him properly.","一位老人把这块地捐给了学校,学校从没好好谢过他。"]]},{"t":"Selling It","s":[["The commercial side of the business is the part that talks, and the workshop is the part that works.","生意里说话的那部分是商业,干活的那部分是作坊。"],["They advertise on the radio because it is cheap, and the slogan is four words long.","他们在电台做广告,因为便宜,而口号只有四个字。"],["A purchase over fifty pounds comes with a gift, and nobody has ever worked out why.","满五十镑的购买送一份礼物,没人算清过这是什么道理。"],["They lease the building and own nothing in it, which is why they can leave in a month.","楼是租的,里面没有一样东西是他们的,所以一个月就能搬走。"],["I cannot afford the good one, so I will buy the one that is on sale.","好的那个我买不起,所以要买打折的那个。"],["Retail is what happens in the shop, and the grocery at the end of the street is the last one left.","零售是店里发生的事,而街尾那家杂货店是仅剩的一家。"],["There is a discount on the second one and a promotion on the third, and both end on Sunday.","第二件打折,第三件有推广价,两个周日都结束。"],["The voucher is worth five pounds and the coupon is worth two, and neither can be used together.","代金券值五镑,优惠券值两镑,两张不能一起用。"]]},{"t":"Money","s":[["Every country has its own currency, and the exchange rate changes before lunch.","每个国家有自己的货币,而汇率午饭前就变了。"],["You can swap the old one for the new one at the desk, and they will not charge you.","你可以在柜台把旧的换成新的,他们不收手续费。"],["Keep the receipt, because the invoice will come a week later and the numbers will not match.","收据留着,因为发票一个星期后才到,而数字对不上。"],["The tax is on the income, the levy is on the property, and the tariff is on the goods coming in.","税是对收入征的,征收款是对房产征的,而关税是对进来的货征的。"],["A duty is on one thing, and it is also what you owe your neighbour.","一种税是对某一件东西征的,而它也是你对邻居欠的那份情。"],["The government will impose a new charge in April and call it something else.","政府四月会加一项新收费,然后给它起个别的名字。"]]},{"t":"Paying for It","s":[["A household will consume three hundred units in a winter and half that in July.","一户人家一个冬天要用掉三百个单位,七月只要一半。"],["We spend too much on the car and too little on the roof, and the roof is the one that leaks.","我们在车上花太多,在屋顶上花太少,而漏的是屋顶。"],["The cost of the repair was twice the cost of the thing.","修理的费用是这东西本身价钱的两倍。"],["The expense is not the machine, it is the man who comes to fix it.","花销不在机器上,而在来修它的那个人身上。"],["The revenue for the year was good, and the gross figure was better than the net one.","这一年收入不错,而总额那个数比净额好看。"]]},{"t":"When It Turns","s":[["A recession lasts a year, a depression lasts five, and a crisis lasts a weekend.","不景气持续一年,萧条持续五年,而危机只持续一个周末。"],["Security is what people buy when they are frightened, and a bond is what they buy instead.","安全感是害怕时买的东西,而债券是他们退而求其次买的。"],["The debt was small in 2005 and the deficit was small in 2006, and both were enormous by 2009.","2005 年债务不大,2006 年赤字不大,到 2009 年两个都变得巨大。"],["Inflation makes the money smaller and deflation makes the debt bigger, and neither is comfortable.","通胀让钱变小,通缩让债变大,两个都不好受。"]]},{"t":"Up and Down","s":[["The numbers dwindle every year, and nobody will decrease the budget to match.","数字一年年缩小,却没人肯相应削减预算。"],["The firm will downsize in March, which is a polite word for letting people go.","公司三月要缩减规模,这是个客气的说法,意思是让人走。"],["Sales decline in the autumn and diminish further in the winter, and the shop reduces its hours.","秋天销量下滑,冬天更少,于是店把营业时间缩短。"],["Prices increase every year, and the increment is always a little more than the year before.","价格每年都涨,而涨幅总比前一年大一点。"],["Growth was three per cent, and then the cost of fuel began to escalate.","增长是百分之三,接着燃料成本开始一步步往上蹿。"],["They will expand the yard and take in an influx of orders from the north.","他们要把场地扩大,接下一批从北方涌来的订单。"]]},{"t":"Rich and Thin","s":[["The affluent part of town is uphill, and the air is better there for a reason.","城里富裕的那片在坡上,那里的空气更好,是有原因的。"],["A new road will enrich the village and ruin the valley, and both will happen in five years.","一条新路会让村子富起来,也会毁掉山谷,两样都会在五年内发生。"],["There is sufficient food and adequate shelter, which is more than the word \"enough\" suggests.","食物够,住处也还行,比\"够\"这个字给人的感觉要多。"],["Keep a spare key and a little saving, because the boiler always goes in January.","留一把备用钥匙和一点存款,因为锅炉总在一月坏。"],["Two of the staff were made redundant in June, and the lack of them is felt in August.","六月有两个员工被裁,到八月才感觉到人手不够。"]]},{"t":"The Company","s":[["A company has a name on the door and a firm has a reputation, and the second takes longer to build.","公司门上有名字,而商号有的是名声,后者要更长时间才攒起来。"],["An enterprise is the whole undertaking, and an entity is the thing the law can sue.","企业是整件事,而法人实体是法律能起诉的那个东西。"],["An agent sells on your behalf and takes a cut, and he is never the one who loses.","代理人替你卖、抽一笔,而他从来不是亏的那个。"],["They will invest four million and expect it back in seven years.","他们要投四百万,指望七年收回。"],["The input is cheap and the product is not, and that gap is the whole business.","投入便宜,产品不便宜,整个生意就在这个差价里。"],["The acquisition was announced in May, and by June two of the three founders had left.","收购五月宣布,到六月三个创始人里走了两个。"],["The goods go by rail and the cargo goes by sea, and the second one is insured twice.","货物走铁路,船货走海运,而后者投了两次保。"]]},{"t":"Promises and Papers","s":[["You insure the building, not the business, which is a lesson people learn once.","你给楼投保,不给生意投保,这个教训人们只要学一次。"],["A guarantee is worth what the man behind it is worth, and that is why the reliable one costs more.","保证值多少,看担保它的人值多少,所以可靠的那家要价更高。"],["The negotiation lasted nine hours and the deal was signed at two in the morning.","谈判进行了九个小时,协议在凌晨两点签的。"],["Eleven people were asked to attend and four were absent, which is normal in August.","请了十一个人出席,四个没到,八月这是常态。"],["The sale runs for a week, the wholesale price is half the retail one, and the auction is in June.","促销持续一周,批发价是零售价的一半,而拍卖在六月。"],["Three people will bid and only one will pay, and the other two will say it went too high.","三个人出价,只有一个人付钱,另外两个会说价钱抬得太高。"],["Every transaction is written down, and the turnover at the end of the year surprises everybody.","每笔交易都记下来,到年底的营业额让所有人都意外。"],["They dump what does not sell behind the yard, and somebody always takes it.","卖不掉的他们倒在院子后面,总有人会捡走。"]]},{"t":"Across the Border","s":[["They export the machine and import the parts, and the tariff is paid twice.","他们出口整机、进口零件,关税交了两遍。"],["The quota is two thousand a year, and last year they shipped two thousand and one.","配额是一年两千,去年他们发了两千零一台。"],["A share of the profit is better than a share of the work, and everybody knows it.","分利润比分活儿好,这谁都知道。"],["The benefit is small and the interest is lower than the inflation, and neither is a reason to keep the money there.","收益很小,利息还低于通胀,两个都不构成把钱放在那儿的理由。"],["The stock in the back is worth more than the shop, and the account has not been checked since 2019.","后面的库存比店还值钱,而账目从 2019 年就没查过。"],["You pay a deposit in March and the rest in instalments over two years.","三月付定金,剩下的两年分期。"],["A cheque takes three days and cash takes none, and the coin in the tin is worth more than both.","支票要三天,现金不用,而铁罐里的硬币比两个都值钱。"],["A shilling was twelve pence and a penny was copper, and neither exists now.","一先令是十二便士,一便士是铜的,两个如今都不存在了。"]]},{"t":"What You Own","s":[["The treasure in the attic was a box of letters, and nobody had looked at it for forty years.","阁楼上的宝贝是一箱信,四十年没人看过。"],["Wealth is what you could sell, and it is not the same as what you would sell.","财富是你能卖掉的东西,而那不等于你愿意卖的东西。"],["The estate went to the eldest son, and the house went with it.","这份地产归了长子,房子也跟着过去。"],["They possess nothing and owe nothing, which is a kind of freedom.","他们一无所有,也不欠人钱,这也是一种自由。"],["The legacy was a library and a debt, and the two were about the same size.","留下的遗产是一间书房和一笔债,两个大小差不多。"],["The family descends from a line of printers, and the name still means paper in this town.","这家人是印刷匠的后代,这个姓在镇上还意味着纸。"],["It is a worthy cause, a valuable lesson and a cheap price, and all three are true at once.","这是值得的事、宝贵的教训和便宜的价钱,三样同时成立。"],["The incentive is a tax break, and it will accelerate nothing.","激励措施是减税,而它什么也加速不了。"],["A prompt reply is worth more than a long one, and this one was both.","及时的回复比长篇的更有用,而这封两样都占。"]]},{"t":"The Pay Packet","s":[["A salary comes once a month and a wage comes once a week, and the second one is easier to spend.","薪水一月发一次,工钱一周发一次,而后者更容易花掉。"],["The income is enough and the payment is late, which is the same as not enough.","收入是够的,只是付款拖了,那等于不够。"],["They will refund the ticket and reimburse the taxi, and neither will arrive before June.","他们会退票款、报销打车钱,而两笔都要到六月以后才到。"],["The payroll is forty names and the remuneration is the same for thirty nine of them.","工资册上有四十个名字,其中三十九个人的报酬一样。"],["There is a subsidy for the first year and nothing after that, which is the usual arrangement.","第一年有补贴,之后就没有,这是常见的安排。"],["She earns less than her father did and works more hours than he ever did.","她挣得比她父亲少,干的时辰比他多。"],["The whole undertaking took four years, and everybody involved said it would take two.","整件事花了四年,而参与的每个人当初都说两年。"],["A career is a lifetime, a profession has a licence, and an occupation is what you say at a party.","事业是一辈子的事,专业是要执照的,而职业是你在聚会上说的那个。"],["A job pays the rent and a vocation does not, which is why most people have the first.","工作付得起房租,天职付不起,所以大多数人选前者。"],["Labour is what the workforce sells, and the workaholic gives it away.","劳动是劳动力卖的东西,而工作狂把它白送。"],["Personnel keeps the files, the clerk keeps the diary, and the interview keeps everybody awake.","人事管档案,职员管日程,而面试让所有人都睡不着。"],["Send the résumé in March and ask them to recommend you to somebody else in April.","三月把简历寄出去,四月请他们把你推荐给别人。"],["They employ forty people, hire six in the spring, and fire four in the autumn.","他们雇了四十个人,春天招六个,秋天开四个。"],["The lay-off was announced on a Friday, and eleven people were dismissed by Monday.","裁员在周五宣布,到周一有十一个人被解雇。"],["Two were discharged for theft, one resigned, and one was sacked for something nobody will name.","两个因偷窃被开除,一个辞职,还有一个因为没人肯说的事被解雇。"],["He will retire in June after thirty years, and nobody has been trained to take his place.","他六月退休,干了三十年,而没人被培训来接他的位置。"]]},{"t":"Ends and Means","s":[["The result was good and the failure was worse, and both came out of the same week.","结果不错,失误更糟,两个都出在同一周。"],["The loss was small, the abortion of the project was not, and nobody has been blamed.","损失不大,项目中途下马这件事不小,而没人被追责。"],["An opportunity comes once and a chance comes every week, and people confuse the two.","机会只来一次,而运气每周都有,人们常把两个搞混。"],["You choose one and change your mind in the morning, and that is allowed.","你选了一个,早上又改主意,这是允许的。"],["Nobody could solve the second problem, so they developed a way round it.","第二个问题谁也没解开,于是他们想出了一条绕过去的路。"],["The plan is sustainable only if the water lasts, and the water is not measured.","这个方案只有在有水的情况下才撑得住,而水没人测。"],["They will improve the road, manage the traffic and regulate the parking, in that order.","他们要修路、管交通、管停车,顺序就是这样。"],["The council will sanction the plan in May and coordinate the work with the county.","议会五月会批准这个计划,并和郡里协调施工。"],["Two firms agreed to cooperate and then spent a year failing to collaborate.","两家公司说好合作,然后花了一年没能真正配合。"]]}],"17":[{"t":"The Rule and the Law","s":[["A law is written down, and it takes a parliament to change it; a rule is written on the wall, and it takes a manager.","法律是写下来的,改它要议会;规则写在墙上,改它只要一个经理。"],["Legal advice is expensive because the words are old, and the old words mean something exact.","法律意见贵,因为那些词都很老,而老词的意思很精确。"],["A regulation is a rule made by an office, and it can be changed on a Tuesday afternoon.","条例是某个机关定的规则,一个周二下午就能改。"],["A treaty is between countries, an agreement can be between two people, and a charter is the oldest of the three.","条约是国家之间的,协议可以是两个人之间的,而宪章是三个里最老的。"],["Protocol is the order you do things in, and in some rooms it matters more than the thing itself.","礼节是办事的顺序,而在某些屋子里,它比事情本身还重要。"],["A norm is what people expect, a benchmark is what you measure against, and a standard is what you must meet.","准则是人们的期望,基准是拿来比照的东西,而标准是你必须达到的。"],["The criteria are written before the judging, which is the only way they mean anything.","评判标准在评之前就写好了,只有这样它才算数。"]]},{"t":"Making It Stick","s":[["The rules allow one guest and the sign says two, and nobody enforces either.","规定允许一位客人,牌子上写两位,两个都没人执行。"],["Admission is free but admission of guilt costs you the case.","入场免费,可承认自己有罪会让你输掉官司。"],["If you default on the payment, the machine goes back to the shop.","如果你拖欠付款,机器就退回店里。"],["They will reject the plan in June and approve the same one in September.","他们六月否掉这个方案,九月又批准同一个。"],["The constraint is not money, it is the two-metre rule about the window.","限制不在钱上,而在窗户那条两米的规定。"],["An official answer comes in writing, and a real one comes on the phone.","官方的答复是书面的,而真实的答复在电话里。"],["A mandatory training day is one you are paid for and still resent.","强制培训日是给钱的,可大家还是不满。"],["The argument was potent enough to change three votes, which is all it needed.","这个论证有力到改了三票,而它只需要这么多。"],["You are bound by the contract whether you read it or not, and that is an obligation.","不管读没读,你都被这份合同约束,这就叫义务。"]]},{"t":"The Court","s":[["The court sits at ten, the supreme court sits when it likes, and neither waits for anybody.","法院十点开庭,最高法院想什么时候开就什么时候开,两个都不等人。"],["Parliament will enact the bill in March and legislate on the detail later.","议会三月通过法案,细节以后再立法。"],["Equity is fairness written into the rules, and it is also what you own in a company.","衡平法是把公平写进规则里,而它也是你在公司里持有的那份。"],["A fair trial and a just one are not the same, and the difference keeps lawyers employed.","公平的审判和公正的审判不是一回事,这个区别养活了律师。"],["Prejudice needs no evidence, and discrimination needs an excuse.","偏见不需要证据,而歧视需要一个借口。"],["They will accuse him on Monday, sue the company on Tuesday, and prosecute nobody.","他们周一起诉他,周二起诉那家公司,而谁也没被刑事追究。"],["The newspaper will condemn the decision and complain about the cost of it in the same paragraph.","报纸会在同一段里谴责这个决定,又抱怨它的花费。"],["They boycotted the meeting, which is a way of attending it loudly.","他们抵制了会议,这是一种很大声的出席方式。"]]},{"t":"In Session","s":[["The session lasts three weeks and the last one lasts a day.","这期开庭三个星期,上一期只有一天。"],["A neighbour will mediate, and both sides will leave angrier than they came.","一个邻居来调停,两边走的时候比来时更生气。"],["His plea was guilty, and his plea to the court for mercy was longer.","他认罪,而他向法庭求情的那些话更长。"],["They will appeal in June, and the appeal will be heard in November.","他们六月上诉,而上诉要到十一月才审。"],["Two witnesses will contradict each other, and the truth is somewhere between them.","两个证人会互相矛盾,而真相在他们中间某处。"],["Nobody could persuade him, and the controversy outlived the case by ten years.","没人能说服他,而那场争论比案子多活了十年。"],["They whispered in the corridor, muttered in the lift and murmured all through the afternoon.","他们在走廊里低语,在电梯里嘀咕,整个下午都在小声议论。"],["The room went silent, and the one man who could not speak stayed mute for an hour.","屋里静下来,那个说不出话的人一个小时都没开口。"]]},{"t":"The Case","s":[["They will investigate for a month and find nothing that a witness did not already say.","他们查了一个月,查出的东西证人早就说过了。"],["You can justify almost anything afterwards, which is why the reason is asked for first.","事后几乎什么都能说成有理,所以才要先把理由讲清楚。"],["A reasonable doubt is enough, and a suitable excuse is not.","合理的怀疑就够了,而合适的借口不算。"],["The judge listens, the jury decides, and the trial takes four days.","法官听,陪审团定,审判持续四天。"],["They suspect the man at the gate, and suspicion is not evidence.","他们怀疑门口那个人,而怀疑不是证据。"],["The sentence was two years, and the sentence in the newspaper was one line.","判决是两年,而报纸上那句话只有一行。"],["They will arrest him on Friday and jail him on Monday, and the prison is forty miles away.","他们周五逮捕他,周一送监,监狱在四十英里外。"],["A child is confined to the house for a week, and the word is the same one used for a prisoner.","孩子被关在家里一个星期,而用的词和关犯人是一样的。"]]},{"t":"Watching and Restraining","s":[["One man will oversee the whole site and another will supervise the wiring.","一个人管整个工地,另一个人管布线。"],["They restrict the hours and restrain nobody, because a rule is cheaper than a guard.","他们限制营业时间,却不拦人,因为一条规定比一个保安便宜。"],["He will commit the crime in March and confess in April, and nobody is surprised.","他三月犯案,四月认罪,没人意外。"],["A sin is against a god and a crime is against a state, and a vice is against yourself.","罪是对神犯的,罪行是对国家犯的,而恶习是对自己犯的。"],["He tried to bribe the clerk with twenty pounds and was reported before he left the room.","他想用二十镑贿赂那个职员,还没出屋就被举报了。"],["They will rob the shop, steal the van, and be caught because the van was too small.","他们抢了店、偷了车,被抓是因为车太小。"],["A pirate copies the film, and a thief takes the disc; one is worse and neither is rare.","盗版的人复制电影,小偷拿走碟片;一个更糟,两个都不少见。"],["The murder was never solved, and the suicide beside it was never explained.","那桩谋杀一直没破,旁边的自杀也一直没解释。"]]},{"t":"Tricks","s":[["He will deceive the buyer and cheat at cards, and the fraud is the same trick twice.","他骗买家,也在牌上作弊,而诈骗是同一个把戏做两遍。"],["A liar needs a good memory, which is why the story changed by Thursday.","说谎的人要好记性,所以那个说法到周四就变了。"],["It was a trap and everybody could see it, and he walked in anyway.","那是个圈套,谁都看得出来,他还是走了进去。"],["The trick is to pretend you are not in a hurry, and it fools most people.","诀窍是装作你不着急,这一招能骗过大多数人。"],["There is a stigma to the word, and it outlives the sentence by twenty years.","这个词带着污名,而污名比刑期多活二十年。"],["He will confess on the second day and conform for the rest of his life.","他第二天就认了,之后一辈子循规蹈矩。"],["The two brothers were reco
