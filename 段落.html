 <h1>分章短文</h1>
 <p class="sub">每章十几篇小短文，把本章的词放进语境里背：每篇一段英文，连着读下来是一个完整的意思，下面配一整段中文。加粗带底色的是本章词，点一下看释义、收进生词本。每篇底下有「小测」：看句子填词、选中文释义、选英文单词，几个小题当堂检验。</p>

<script>
var TXT={"1":[{"t":"The Air We Share","s":[["On a clear morning the sky looks empty, and yet everything that keeps us alive is packed into the thin shell of gas above our heads, the atmosphere.","晴朗的早晨,天看着空空的,可养活我们的东西全挤在头顶那层薄薄的气体里,那就是大气层。"],["My daughter asked me what it was made of, so I told her that most of it is nitrogen, that oxygen is the part we breathe in, and that the carbon dioxide we breathe out is what the trees take back.","女儿问我里面装的是什么,我说大部分是氮,我们吸进去的是氧,呼出来的二氧化碳树又收回去。"],["Hydrogen is the lightest gas there is, and it does not stay on its own for long: the moment it meets oxygen the two of them make water, and the same thing happens whenever oxygen joins another element to form an oxide, which is all that rust is.","氢是最轻的气体,可它单独待不久:一碰上氧,两者就合成水;氧和别的元素结合也是这个道理,生成的东西叫氧化物,铁锈就是。"],["Water in the air is vapour. On a hot afternoon it evaporates off the road, and when the vapour rises and cools it precipitates as rain and comes back down on us.","空气里的水是水蒸气。炎热的下午它从路面蒸发上去,升到高处一凉,又凝成雨落回我们身上。"],["Warm air rises and cool air moves in to take its place, which is why the air in a closed room keeps circulating even with the windows shut.","暖空气往上走,冷空气补进来,所以关着窗的屋子里空气照样在动。"],["That morning the temperature sat near fifteen degrees Celsius, just as the forecast had said, and because the winter was mild we left the heating off; a moderate coat was enough for the walk to school.","那天早上温度一直在十五摄氏度上下,跟预报说的一样。那个冬天不冷,我们没开暖气,一件不厚不薄的外套就够走到学校。"],["Under her shirt she had a thermal vest that holds the heat close to the skin, and by the time we reached the gate she was warm again.","她衬衫里面套着一件保暖内衣,把热气留在皮肤边上,走到门口的时候身上已经暖过来了。"]]},{"t":"The Water World","s":[["Most of the globe is covered by water, and all of that water put together is what we call the hydrosphere.","地球表面大部分都是水,这些水加在一起,就叫水圈。"],["The ocean is really one body, but we have given its corners names of their own: a gulf is a piece of sea that land almost closes off.","海洋其实是一整片,可我们给它每个角落都起了名字:海湾,就是几乎被陆地围起来的那一块。"],["Our boat left the beach where the children were still playing and followed the coast north for miles, close enough to the shore that we could watch the tide come in.","我们的船离开沙滩的时候,孩子们还在那儿玩。船沿着海岸往北开了好几英里,离岸很近,近得能看见潮水一点点涨上来。"],["A warm current runs north past the islands, and sailors have used it for navigation across the Atlantic for centuries; the Mediterranean, by contrast, is warm and almost still.","一股暖流从岛边往北流,水手靠它横渡大西洋,已经靠了几百年;地中海就不一样,水是暖的,却几乎不动。"],["The next day we walked inland, where a brook is small enough to jump across and a stream is wider, and both of them start at a cold spring in the rocks that is the source of the river running through our town.","第二天我们往内陆走。小溪窄得一步就能跨过去,小河宽一些,可两条都发源于岩缝里一眼冰凉的泉水,那眼泉就是流过我们镇子的河的源头。"],["The water there is shallow enough to walk across, but a hundred metres further down it is deep enough to drown a cow.","那里的水浅,人走得过;再往下走一百米,就深得能淹死一头牛。"],["Behind the dam they built a reservoir, and in spring the overflow falls over the waterfall in a white line; at home, in the square, a fountain throws water into the air all day.","他们在坝后修了一座水库,春天水满出来,从瀑布上泻下去,拉成一道白线;而在我们那儿,广场上的喷泉整天把水往空中抛。"],["By morning there is dew on the grass, and a tap that keeps dripping will drain the tank before the sun is up.","到早上草上就结了露水;水龙头要是一直那么滴,太阳出来之前就能把水箱放干。"],["She poured the last of the tea away and stood looking at the water in the sink, while out at sea the marine animals went on with their morning.","她把最后一点茶倒掉,站着看水槽里的水,而远海里的那些海洋动物,照旧过着它们的早晨。"]]},{"t":"What Lies Under Our Feet","s":[["The rocky shell of the earth is the lithosphere, and the thin skin we stand on is the crust.","地球外面那层石头壳叫岩石圈,我们脚踩的这层薄皮叫地壳。"],["Beneath the crust the mantle is hot enough to flow, and at the centre the core is hotter still, so the rock down there melts and becomes magma.","地壳下面,地幔热得能流动;最中间的地核还要更热,所以那里的岩石会熔成岩浆。"],["Where the magma finds a way out we get a volcano, and this one last erupted in 1963, so the island has been quiet ever since.","岩浆一旦找到出口,就成了火山。这一座上回喷发是一九六三年,从那以后岛上一直很安静。"],["An earthquake is harder to see coming. The seismic stations along the coast record every shake, because the two plates are always moving past each other.","地震就难预料得多。沿岸的地震台把每一次震动都记下来,因为那两块板块一直在互相错动。"],["Where they pull apart, the ground can crack open into a wide gap, and in the old mine you can still pick up a piece of ore.","它们分开的地方,地面会裂开一道很宽的缝;老矿里现在还能捡到矿石。"],["The mineral in it shines like glass: quartz is clear, granite is speckled, and the floor of the church is a single slab of marble.","里面的矿物亮得像玻璃:石英是透的,花岗岩带斑点,教堂的地面是一整块大理石。"],["A pebble from the river fits in your hand and a magnet will not lift it, and yet geology begins with a handful of sediment from the bank.","河里的鹅卵石刚好握在手心,磁铁吸不起来;可地质学就是从河岸上抓一把沉积物开始的。"]]},{"t":"Lines on a Map","s":[["A map is covered with thin lines: the ones running up and down give the longitude of a place, and the ones running across give its latitude.","地图上画满细线:竖着走的那几条,给出一个地方的经度;横着走的,给出纬度。"],["Latitude tells you how far you are from the equator, and since the globe is round we cut it in two and call each half a hemisphere.","纬度告诉你离赤道有多远。地球是圆的,我们把它切成两半,每一半叫一个半球。"],["From the hill the horizon is a long way off, and the altitude of the hill itself is printed on the map.","站在山上,地平线离得很远;那座山本身有多高,地图上也印着。"],["Between the tropics the sun stands overhead at least once a year; the arctic stays cold all winter, and even the Antarctic summer is cold.","热带地区一年里太阳至少直射一次;北极圈整个冬天都冷,南极的夏天也冷。"],["The polar ice is thick, and at the pole the axis of the earth comes out of the ground.","极地的冰很厚,地轴就从极点那儿钻出地面。"],["Asia is the largest continent and the mainland of China takes up a good part of it, while Oceania is only a name for the islands of the Pacific.","亚洲是最大的洲,中国大陆占了很大一块;大洋洲不过是太平洋上那些岛的名字。"],["Italy is a peninsula, and where the river reaches the sea its delta spreads out as a fan of mud and reeds. Further south the land lifts into a plateau, high and flat, and then drops again into a plain. In the desert beyond, an oasis is the only green thing for a hundred miles.","意大利是个半岛,河入海的地方,三角洲摊成一把泥沙和芦苇做的扇子。再往南,地慢慢抬起来,成了又高又平的高原,然后又落下去,成了平原。更远处的沙漠里,一百英里之内唯一的绿色就是那片绿洲。"],["Past the last field the land turns into wilderness, with a swamp on one side and a cave in the rock on the other.","过了最后一块田,地就荒了:一边是沼泽,另一边的岩石里有个山洞。"],["The southern coast is wet and the eastern hills are dry; the southeast gets the most sun, and in the northwest it can snow in April.","南边的海岸多雨,东边的山上干燥;东南日照最多,西北四月里还能下雪。"],["The cliff drops straight into the sea, and above it a glacier moves so slowly that you cannot see it move.","悬崖笔直地落进海里,崖上一条冰川移得极慢,慢到你看不出来。"]]},{"t":"Wind and Rain","s":[["Weather changes from day to day, but the climate of a place stays much the same for a lifetime, and meteorology is the science of both.","天气一天一个样,可一个地方的气候,几十年都差不多;气象学把这两样一起研究。"],["In summer the monsoon comes in off the sea and brings weeks of rain, and by August the river is full.","夏天季风从海上过来,带来好几个星期的雨,到八月河就满了。"],["A breeze lifts the curtains, a gust slams the gate, and a gale takes the roof off the shed.","微风吹起窗帘,一阵狂风把院门拍上,再大一点,连棚子的顶都掀了。"],["That morning the wind came from the northeast, had swung round to the southwest by noon, and by evening was blowing in from the sea.","那天早上风从东北来,中午转到了西南,到傍晚,又从海上吹过来。"],["A hurricane, a typhoon and a tornado are all spinning storms, and only the sea they are born in decides which name we use.","飓风、台风、龙卷风,都是打着转的风暴;叫什么名字,只看它们生在哪个海上。"],["On a stormy night the wind will puff and drop and then blow again, and water gushes out of the broken pipe and runs down the street.","暴风雨的夜里,风一阵一阵地吹,停一下,又吹起来;水从破管子里涌出来,顺着街往下流。"],["The sky turned grey, there was a flash of lightning, and the thunder came a few seconds later.","天一下子灰了,闪电亮了一下,几秒钟后雷声才跟上来。"],["A downpour like that brings more rainfall in an hour than the whole of last month, and afterwards it began to sprinkle, just enough to spot the dust.","那样一场暴雨,一个小时的雨量比上个月一整月都多;后来就只剩零星小雨,刚够把地上的土打出点印子。"],["A shower passed over in the afternoon and left a rainbow, and by six the clouds were gone.","下午一阵雨过去,留下一条彩虹;到六点,云就散了。"]]},{"t":"A Dry Year","s":[["The third summer without rain was the worst drought the village had known, and the river shrank to a line of stones.","连着第三个没雨的夏天,是村里人见过最厉害的干旱;河缩成了一条石头线。"],["It is an arid country at the best of times, which is why the flooding last year was so hard to believe.","这地方最好的年景也是旱的,所以去年那场洪水,谁听了都不太信。"],["A torrent came down the valley that night and took the bridge with it, and the tsunami that followed the earthquake reached the coast twenty minutes later.","那天夜里一股急流冲下山谷,把桥一起带走了;地震引来的海啸,二十分钟后就到了岸边。"],["Higher up, an avalanche closed the road for three days, so nobody came down from the pass.","再往高处,一场雪崩把路封了三天,山口上一个人也没下来。"],["A disaster of that size is not a mishap, and the damage it does is catastrophic.","那么大的灾难,不能算小意外;它造成的破坏,是灾难性的。"],["The flood was a calamity for the farmers, and it was destructive far beyond the valley, because storms like that endanger the villages on the coast and jeopardise the fishing that feeds them.","那场洪水对农民是场大祸,破坏力远远超出那个山谷:这样的风暴会危及沿岸的村子,也危及养活他们的渔业。"],["El Niño is the name we give the warm water in the Pacific, and it changes the weather of half the world.","太平洋上那片暖水,我们叫它厄尔尼诺;半个世界的天气都被它改写过。"],["A rainbow is a phenomenon you can explain, but a run of dry years is another matter.","彩虹这样的自然现象,你解释得清;连着几年不下雨,就不是一句话能说清的了。"]]},{"t":"The Shape of the Land","s":[["The terrain of the north is rough, while the landscape of the south is soft and green.","北方的地形崎岖,南方的风景却是柔的,到处都是绿。"],["The road across the plain is flat and smooth, so you can drive for an hour without turning the wheel; then the ground turns sandy, and after that it is stony all the way to the pass.","穿过平原的路又平又顺,开一个小时都不用打方向盘;再往前,地面变成了沙土,之后就一路都是石头,直到山口。"],["The slope is steep here, almost vertical in places, and the path is narrow enough for one person.","这里的坡很陡,有几处几乎是直上直下;小路窄得只容一个人走。"],["Two ridges run parallel to the river, and the valley between them is deep and quiet.","两道山脊顺着河平行伸出去,中间那条山谷又深又静。"],["On the hillside a few sheep work their way up, and the peak above them keeps its snow until May.","山坡上几只羊慢慢往上走;它们头顶的那座山峰,到五月还留着雪。"],["We began to mount the last stretch at four, and from the top we could overlook the whole range.","四点,我们开始爬最后一段;到了顶上,整条山脉都在脚底下。"],["It was a splendid view, grand in a way that photographs never catch, and magnificent in the evening light.","景色好得没话说,那种壮阔照片拍不出来,傍晚的光一照,更是辉煌。"],["My brother thought it was super; I found the whole thing interesting in a way I had not expected.","我弟弟说棒极了;我倒没想到,这一趟会让我觉得这么有意思。"],["The light changed fast, so the shadow of the mountain moved across the field in a dramatic way, and by dusk the whole valley was blue.","光线变得很快,山的影子从田上一寸寸扫过去,像有人推着走;到黄昏,整个山谷都蓝了。"]]},{"t":"Cold and Damp","s":[["In the morning there was frost on the window and a thin sheet of ice in the bucket, and by noon it began to hail.","早上窗上结了霜,桶里冻了一层薄冰;到中午,又下起冰雹,小硬球在屋顶上直弹。"],["Then the wind turned warm, the ice began to thaw, and the lane turned to mud.","后来风变暖了,冰开始化,小路成了泥。"],["There was a chill in the air all day, and I stood shivering at the gate until I gave up and went back inside.","一整天空气里都带着寒意,我在门口抖了半天,最后还是回屋了。"],["My hands began to tremble with the cold, and a snowy January like that keeps everyone indoors.","冻得我手直抖;那样一个下雪的一月,谁都愿意待在家里。"],["It is a frigid place in winter: the pond freezes over before January, and the snow lies on the fields until March.","这地方冬天冷得刺骨:还不到一月,池塘就冻实了;田里的雪,一直躺到三月。"],["In summer the air is humid and the walls feel damp, so anything left out gets moist by morning.","到了夏天,空气潮,墙摸上去是湿的;放在外头的东西,到早上都返潮。"],["A mist came off the river at dusk and hung in the streets until the sun was up.","黄昏时河面起了薄雾,挂在街上,一直挂到太阳出来。"],["The smog over the city is worse in winter, when the fume from a thousand chimneys has nowhere to go and grows dense enough to hide the houses across the road.","城里的烟雾,冬天更重:上千个烟囱冒的烟没处去,浓得连路对面的房子都看不见。"]]},{"t":"A Slow Change","s":[["Two wet winters washed the old road away, so the surface began to erode, and now there is a gully along the edge.","两个多雨的冬天把老路冲坏了,路面开始一点点被侵蚀;如今边上有了一道沟。"],["Left alone the damage will aggravate, and the slope above it will deteriorate year by year.","放着不管,损坏会加剧,上面那道坡也会一年不如一年。"],["Some of the change is irreversible, and that is the part that worries the council, though for now the harm is only superficial.","有些变化是不可逆的,镇议会愁的正是这一块;不过眼下,坏还只坏在表面。"],["It was inevitable that the field would degrade once the hedges were cut and the wood was left to deforest itself.","树篱一砍、林子没人管,那块地退化是迟早的事。"],["The plan is to upgrade the drainage and put the hedges back, but rain has come irregularly for years, so the work is hard to schedule.","计划是把排水修好,再把树篱种回去;可这些年雨下得没个准,活儿不好安排。"],["Cutting the trees on that soil was an inappropriate thing to do, and the result is plainly abnormal.","在那样的土上砍树,本来就不合适;现在的样子,明显不正常。"],["The hills behind the village are barren now and the fields below are no longer fertile, because nobody is left to fertilise them.","村后的山坡如今光秃秃的,下面的田也不肥了,因为再没人给它们施肥。"],["Nature does not hurry: what looks natural to us is often the work of a hundred years, while the new grass by the gate is artificial and the flowers are synthetic.","大自然不着急。我们看着最自然的样子,往往是上百年的工夫;而门口新铺的草是人造的,花也是假的。"]]},{"t":"Near and Far","s":[["They moved out of the city to a rural district, and now they live in a suburb with a garden.","他们从城里搬到了乡下,如今住在一个带花园的郊区。"],["On the outskirts the houses thin out, and after that there are only fields, so the place is remote; in winter the nearest shop is a distant light across the valley.","到了市郊边上,房子就稀了,再过去只剩田,所以那地方偏得很;冬天最近的商店,是山谷对面远远的一点灯光。"],["The land around it is desolate, empty of everything but stone.","四周的地一片荒凉,除了石头什么都没有。"],["Our field is adjacent to the wood, and the border between them is a low wall.","我家那块地紧挨着树林,两边的界是一道矮墙。"],["There is a margin of grass along the wall and a fringe of reeds at the water, and after the storm there was debris in every ditch.","墙边留着一条草,水边长着一排芦苇;暴风雨过后,每条沟里都是断枝碎叶。"],["The stream ran muddy for a week while the silt settled on the beds of clay, and the yard was covered in dirt.","溪水浑了一个星期,淤泥沉到黏土上;院子里也全是泥。"],["The waste from the factory was toxic, and within a month it had begun to contaminate the brook, so now the pollution can be measured and every pollutant in the water is written down.","工厂排的废物有毒,一个月就把小溪污染了;现在污染能测出来,水里每一种污染物都记在本子上。"],["The environment here is tested twice a year and the surrounding villages are in the same condition, so the situation is better than it was, though nobody calls it good.","这里的环境一年测两次,周围的村子处境一样;情况比从前好些,可没人说它好。"]]},{"t":"Light Through the Day","s":[["The solar panels on the roof give us hot water from April to October, and the lunar calendar is still used for the festivals.","屋顶的太阳能板从四月到十月给我们热水;过节的日子,照样按农历算。"],["The old people keep the calendar in their heads, and they know that sunrise is at half past five in June.","老人们把历法记在脑子里,他们知道六月里五点半日出。"],["By six the whole street is in sunshine, and at dusk the light goes soft and the shadow of the church reaches the bridge.","六点,整条街都是阳光;到黄昏,光变柔了,教堂的影子一直伸到桥上。"],["We sat in the shade of the tree until sunset, and then it was too cold to stay.","我们在树荫里坐到日落,之后就冷得坐不住了。"],["There was an eclipse of the sun that spring, and for two minutes the birds went quiet.","那年春天有一次日食,有整整两分钟,鸟都不叫了。"],["At night the desert sky is a heaven of stars, and the people who live there call it a paradise; the oriental garden by the lake, by contrast, is small and quiet.","沙漠的夜空满天星斗,住在那里的人管它叫天堂;湖边的东方园林就不一样了,小而安静。"],["I lay on my back and looked up, and the whole thing was dramatic in a way I had never seen.","我躺下来往上看,那种壮阔,我从没见过。"]]},{"t":"Fuel for the Road","s":[["My uncle runs a small garage, and he sells petrol, gas and gasoline, which are three names for the same thing.","我叔叔开了个小修车铺,卖汽油;三个叫法,说的都是同一样东西。"],["Petroleum is what comes out of the ground before it is refined, so all three of them come from it.","石油是从地里出来、还没炼过的那个东西,所以这三种都出自它。"],["A greenhouse stays warm because the glass holds the heat in, and the gases from a car do much the same thing to the earth.","温室暖,是因为玻璃把热关在了里面;汽车排的气,对地球做的差不多是同一件事。"],["A thermodynamic engine turns heat into work, and that is all a car engine really does.","热力学的发动机把热变成功;汽车发动机真正做的,也就是这件事。"],["The intensity of the smell told him the pipe was leaking, and by evening the garage needed an intensive clean.","气味那么冲,他就知道管子漏了;到晚上,铺子得从上到下擦一遍。"],["Smoke began to emerge from under the bonnet, and a thin line of it floated up past the window.","烟从引擎盖下面冒出来,细细一缕,从窗边飘上去。"]]}],"2":[{"t":"How a Leaf Works","s":[["A leaf does two things at once, and we have two long names for them: it makes food by photosynthesis, and it burns that food by respiring.","一片叶子同时干两件事,我们给它们起了两个长名字:靠光合作用造食物,靠呼吸把食物烧掉。"],["Sunlight falls on it, the green parts absorb the energy, and oxygen is released into the air.","阳光落上去,绿色的部分把能量吸收下来,氧气就释放到空气里。"],["The tree takes carbon dioxide in through tiny holes and gives back the oxygen we need, which is why a wood works as a kind of counterbalance to a city.","树从细孔里吸进二氧化碳,把我们要的氧气还回来;所以一片林子对一座城,像是一种抵消。"],["Water and nutrient salts come up from the root, and the circulation of sap carries them to the highest branch.","水和营养盐从根往上走,树液一循环,就把它们送到了最高的那根枝上。"],["In winter, when the leaves are gone, the tree is only waiting, and the uptake is slow.","到了冬天,叶子落光,树只是在等,吸收也慢下来。"],["Inside the leaf an enzyme acts as a catalyst, so a reaction that would take years happens in a second.","叶子里的酶起催化剂的作用,本该几年才走完的反应,一秒钟就成了。"],["Nobody designed this mechanism; it was found by experiment, and it is still the most efficient way we know of turning light into food.","这个机制不是谁设计出来的,是实验一点点找出来的;可直到今天,把光变成食物,还没有比它更省力的办法。"],["The energy one tree stores in a summer is considerable, and the emission of oxygen from a single wood can be measured.","一棵树一个夏天存下的能量相当可观;一片林子能放出多少氧,也是测得的。"]]},{"t":"Naming the Green World","s":[["Botany is the study of plants, and ecology is the study of how they live with everything else.","植物学研究植物;生态学研究的是,植物怎么和别的东西一起活。"],["A wood, a pond and the animals in them make up one ecosystem, and every organism in it has a place.","一片林子、一个池塘,加上里面的动物,凑成一个生态系统;里面每个生物都有自己的位置。"],["Genetics explains why an oak grows from an acorn and never from a pine cone, and why no two leaves are quite the same.","遗传学解释了,为什么橡树只从橡子里长出来,不会长在松果上;也解释了,为什么没有两片叶子完全一样。"],["Most of that difference is variation. A little of it is mutation, which is a change in the message itself.","这些差别,大半是变异;一小部分是突变,而突变,是那条信息本身变了。"],["Diversity is the whole point, because a field with only one crop dies of one disease.","多样性恰恰是关键:只种一样庄稼的地,一场病就能全毁。"],["Gardeners use hybridisation to join two good plants into one, and botanists then classify the result by its flowers, its leaves and its genes.","园艺的人用杂交,把两种好植物并成一种;植物学家再按花、按叶、按基因,把它归到该去的地方。"],["Plants reproduce in their own time and evolve over thousands of years, so the numbers for any single year fluctuate and mean very little.","植物按自己的节奏繁殖,进化要几千年;所以单独看一年的数字,上下浮动,说明不了什么。"],["A perennial comes back every spring, which is why it is worth waiting for.","多年生的植物,每年春天都会回来;这才值得等。"]]},{"t":"The Vegetable Patch","s":[["My grandmother calls her work horticulture; to us it is just the garden behind the house.","我奶奶管她那点活儿叫园艺;对我们来说,那就是屋后的菜园。"],["She cultivates the same strip every year, and sows the seed in April, when the ground has warmed.","她年年种同一条地,四月地一暖,就撒下种子。"],["The soil there is arable, deep and dark. In March she turns it over with a plough, or with a spade where the tractor will not fit; in the hills behind the village the fields are cut into a terrace, one above another.","那块地能耕,又深又黑。三月里她用犁翻一遍,拖拉机进不去的地方就换铁锹;村后的山坡上,田被切成一层层梯田,一级叠着一级。"],["Then she rakes it flat and stacks the dry grass in a heap by the wall.","翻完再把地耙平,干草堆在墙根下。"],["She plucks the herbs for soup and picks the beans while they are still small, and the yield is more than the two of us can eat.","做汤的时候她去掐香草,豆子还嫩就摘;收成多得我们俩吃不完。"],["The onions she ties into a bundle and the flowers into a bunch, and the best of them go in a vase on the table, because salt will preserve the rest through the winter.","洋葱她捆成一捆,花扎成一束;最好的几枝插在桌上的瓶里,剩下的用盐腌着,能过一冬。"],["They rear chickens in the yard, and every year one of them is kept back for the winter.","院子里还养着鸡,每年留一只,留着过冬。"],["The harvest is a week of work and the whole family comes for it; in a good year the beans alone can exceed a hundred kilos.","收成要忙一个星期,全家都回来帮忙;年景好的时候,光豆子就能超过一百公斤。"]]},{"t":"From Bud to Rot","s":[["In March the buds on the apple tree begin to burgeon, and by April the whole tree is in blossom.","三月,苹果树的芽开始鼓起来;到四月,满树都是花。"],["The blossom smells sweet, and the scent carries far enough for the bees to find it.","花开得香,那股味儿飘得很远,蜜蜂顺着就找来了。"],["Some herbs are aromatic and some flowers bloom for a week at most, so the garden changes every seven days.","有些香草气味重,有些花最多开一个星期;园子就这么七天换一个样。"],["Pollen from one flower has to reach another, and only then does the seed germinate.","一朵花的花粉,得落到另一朵花上;到那时候,种子才发芽。"],["The fruit ripens slowly through August, and the wasps know before we do.","果子在八月里慢慢熟;黄蜂比我们更早发现。"],["By October the leaves wither and the last of the fruit falls, and the whole thing begins to decompose.","到十月,叶子枯了,最后几个果子也掉了,一切开始分解。"],["What is left rots into the soil, with a mould or a fungus doing the work, so nothing is wasted.","剩下的烂进土里,霉菌也好,真菌也好,总有东西来干这活儿,一点都不糟蹋。"],["A tomato left on the windowsill goes stale in three days; that is the same decay, only faster.","窗台上搁着的番茄,三天就不新鲜了;那是同一个腐烂的过程,只是快一些。"]]},{"t":"Wood and Grass","s":[["In the rainforest the trees are so tall that the ground stays in shade all day, and only a shade-tolerant plant can live down there.","雨林里的树太高了,地面整天都在阴影里;能在底下活的,只有耐阴的植物。"],["A short-day plant waits for the nights to lengthen before it flowers, and sunlight is the only clock it has.","短日照的植物要等夜变长才开花;它唯一的钟,就是阳光。"],["Further out the jungle gives way to a plantation, where one kind of tree is grown in straight lines for timber.","再往外,丛林让位给种植园:那里只种一种树,排成直行,为的是木材。"],["The logs are cut into charcoal, and the forestry office marks every trunk that falls and puts its logo on the stack.","原木烧成木炭;林务局把每一棵倒下的树都记上账,在木堆上盖自己的标志。"],["A branch breaks off in the wind, and the bough above it still holds the nest.","风刮断了一根树枝;上面那根粗枝上,鸟窝还在。"],["Below, the grass in the meadow is cut for hay, and the dry straw is kept for the animals.","下面草甸的草割下来晒成干草;干草留着喂牲口。"],["Reeds stand at the water, and a thorn hedge keeps the goats out of the vegetable field.","水边长着芦苇;一道荆棘篱笆,把羊挡在菜地外面。"],["The lawn needs cutting twice a month, and the weeds need pulling all summer.","草坪一个月要剪两回;杂草,整个夏天都得拔。"],["Every tree has a root, and every root is looking for water.","每棵树都有根;每条根,都在找水。"]]},{"t":"Six Plants and a Reef","s":[["The olive tree by the gate is older than the house, and nobody remembers who planted it.","门口那棵橄榄树,比房子还老;谁种的,没人记得了。"],["On the hill the pines hold the soil, and the wind through them sounds like the sea.","山坡上,松树把土抓住;风穿过松林,听着像海。"],["A vine climbs the wall, and by September it is heavy with grapes.","一株藤爬满了墙;到九月,沉甸甸地挂满葡萄。"],["In the corner there is a violet and a row of tulips that come up every April.","角落里有一丛紫罗兰,还有一排郁金香,每年四月都冒出来。"],["Mint grows where nothing else will, and it grows there fast.","薄荷长在别的东西都长不了的地方,而且长得飞快。"],["Past the reef the water turns dark, and the alga on the rocks is where the whole food chain begins.","过了礁石,水色就深了;岩上的藻类,正是整条食物链的起点。"],["A fungus is neither plant nor animal, and it lives by breaking things down.","真菌既不算植物,也不算动物;它靠把东西分解开来过日子。"]]},{"t":"Fire, Axe and After","s":[["A bush fire started on the ridge in February and burned for four days before anyone could extinguish it.","二月里,山脊上起了林火,烧了四天,才被扑灭。"],["Fire can ruin a hundred years of growth in an afternoon. A fire that hot will destruct a wood in an hour, and the animals that cannot run perish where they stand.","一场火,一个下午就能毁掉一百年的生长;这么热的火,一个小时就能把一片林子烧光,跑不掉的动物,就死在自己站的地方。"],["Afterwards the forestry team came to demolish what was left and clear the burnt logs.","火过了,林务队来拆掉剩下的东西,把烧焦的木头清走。"],["Cutting the trees there would infringe the protection order and undermine twenty years of work.","要在那儿砍树,就是违反保护令,二十年的活儿也就一点点白费了。"],["The pattern of the seasons has changed and nobody can say what the outcome will be, though hunting once drove the wolf here close to extinction.","季节的规律已经变了,谁也说不准最后会怎样;不过从前打猎,确实把这里的狼逼到过灭绝边上。"],["The impact of one dry summer is small; the impact of five is not.","一个旱夏,影响不大;连着五个,就不是这么回事了。"],["Conservation is cheap when it works, and far more efficient than repairing the damage afterwards.","保护做对了,花不了多少钱;比起事后修补,省力得多。"],["An experimental plot was fenced off, the result was effective within two years, and they went on to reclaim the old quarry and plant it with pines.","他们先围起一块试验地,两年就见出效果;接着又把废石场复垦,种上松树。"],["The change was considerable. In places it was massive, and the effect on the soil immense.","变化相当大;有些地方是巨大的,对土的影响也深。"],["It was done with maximal care and minimal cost, and by any measure that is the optimal way to keep a wood alive.","这件事,用的是最大的心思、最小的花费;怎么算,这都是让一片林子活下去最妥当的办法。"],["A seasonal worker knows the difference, and a productive field pays for itself.","季节工最懂这个差别;一块多产的田,自己养得起自己。"],["Conditions here are favourable, the soil is protected, and the surroundings are as they were before we came.","这里条件好,土保住了;周围也还是我们来之前的样子。"],["It is an eco-friendly way to farm, and after ten years the vegetation has come back on its own.","这是对环境友好的种法;十年之后,草木自己长回来了。"]]}],"3":[{"t":"Who Studies Animals","s":[["A biologist studies life itself, a zoologist studies animals, and an ecologist asks how they live together.","生物学家研究生命本身,动物学家研究动物;生态学家问的,是它们怎么一起活。"],["A botanist stays with the plants. The plants of a place are its flora, just as its animals are its fauna.","植物学家守着植物。一个地方的植物,叫植物区系;动物,叫动物区系。"],["Wildlife is the word we use for all of them at once, and every one of them belongs to a species.","这些合起来,我们叫野生生物;里面的每一个,都属于某个物种。"],["A creature with a backbone is a vertebrate, and among those a mammal feeds its young on milk.","背上有脊梁的,是脊椎动物;里面有一类用奶喂幼崽,叫哺乳动物。"],["A primate has hands that can hold things, a reptile has scales, and an amphibian spends half its life in water.","灵长类有一双能抓东西的手,爬行动物一身鳞,两栖动物有一半日子泡在水里。"],["A carnivore eats meat and a herbivore eats plants, and the teeth of each will tell you which it is.","吃肉的叫食肉动物,吃草的叫食草动物;不用问,看牙就知道。"]]},{"t":"A Herd, a Flock, a Swarm","s":[["Sheep move in a flock and cattle in a herd, and in summer a swarm of bees leaves the hive for a new tree.","羊成群地走,牛也成群地走;到了夏天,一群蜜蜂离开蜂箱,去找一棵新树。"],["At the market a throng of people stood by the gate and a crowd pressed round the fruit, and nobody could move.","集市上门边站着一大群人,水果摊前也围了一圈;谁也动不了。"],["A beast is simply a big animal, but a brute is one that will hurt you, and the man who beat the donkey was cruel.","野兽,不过是个头大的动物;畜生,是会伤人的那一种;打驴的那个人,心是狠的。"]]},{"t":"Family Lines","s":[["Every breed of dog is said to originate in the wolf, and they all derive from one ancestor that lived long ago.","据说每一种狗都源自狼;它们都出自很久以前的同一个祖先。"],["The word dog itself stems from an old English name, and the line runs down to the descendants we keep today.","连\"狗\"这个词,也是从一个古英语的名字来的;这条线一直传到我们今天养的这些后代。"],["The offspring of two kinds may form a subgroup of their own, and farmers will breed them for a better coat.","两种动物的后代,可能自成一个亚群;农人为了皮毛好,会特意让它们配。"],["Two close species may interbreed where their ranges meet, and in a garden two plants hybridise in the same way.","两个近缘物种,在地盘相接的地方会杂交;园子里的两株植物,也一样。"],["Leave a small group alone and it will proliferate until the food runs out; sterility and disease then do the rest.","不去管它,一小群会越繁殖越多,直到把食物吃光;剩下的事,交给不育和疾病。"],["A male finds a mate by display, and the courtship can last a week before she lets him near.","雄性靠展示自己找伴侣;求偶能拖上一个星期,她才肯让他靠近。"],["A hen will lay an egg a day in spring, and the eggs hatch after three weeks, while a fish will spawn in thousands and then leave them.","春天母鸡一天下一个蛋,三个星期后孵出来;鱼就不一样,一次产下几千个卵,然后掉头就走。"],["The young are not mature for a year, and until then the brood stays close.","幼崽要一年才成年;在那之前,一窝都挤在一块儿,不散开。"]]},{"t":"Skin, Claw and Wing","s":[["A mammal is covered in fur, a bird in feather, and a fish in scales that shine like a coin.","哺乳动物一身毛,鸟一身羽,鱼一身鳞,亮得像硬币。"],["Under the fur the skin is thin, and a cat will use a claw to hold what it has caught.","毛底下那层皮很薄;猫逮住什么,就用爪子按住。"],["A dog gives you its paw, and a bird takes food with its beak.","狗会把爪子递到你手里;鸟用喙把食物叼走。"],["A fish steers with a fin and a bird with a wing, and the plume on the heron is longer than the rest.","鱼靠鳍转向,鸟靠翅膀;苍鹭头上那根羽毛,比身上任何一根都长。"],["The bristle on a pig is stiff enough to make a brush, and the hair on a lamb will curl by itself.","猪鬃硬得能做刷子;羊羔身上的毛,自己就打卷。"]]},{"t":"Small Things","s":[["An insect has six legs, and in summer the air is full of them.","昆虫六条腿;夏天一到,空气里全是它们。"],["A worm comes up when it rains, and a spider builds in the corner of the shed.","一下雨,蚯蚓就爬上来;蜘蛛在棚子角上结网。"],["A butterfly crosses the garden, a mosquito finds you at dusk, and a cricket sings until midnight.","蝴蝶从园子上头飞过去;黄昏时蚊子总能找到你;蟋蟀一直叫到半夜。"],["Some of them are a pest on the crops, and a parasite lives on another animal and gives nothing back.","其中有些是庄稼上的害虫;寄生虫住在别的动物身上,一点东西也不还。"],["A mouse lives in the wall and a rat in the drain, a squirrel takes the nuts we put out, and a hare sits still in the field until you are close.","老鼠住在墙里,大老鼠在下水道;松鼠把我们放在那儿的坚果搬走;野兔蹲在田里一动不动,直到你走到跟前。"],["Only a frog is at home in both the pond and the grass.","只有青蛙,水里和草里都待得自在。"]]},{"t":"In the Aviary","s":[["A falcon is faster than a hawk in a dive, and an eagle is bigger than either.","俯冲的时候,猎隼比鹰快;论个头,雕又比它们都大。"],["An owl hunts at night, a swallow catches flies all day, and a sparrow takes the crumbs off the table.","猫头鹰夜里捕食,燕子白天抓飞虫;麻雀捡桌上的面包屑。"],["Pigeons live under the bridge and crows on the roof, and both are always there.","鸽子住在桥底下,乌鸦待在屋顶上;两边都一直在。"],["A swan on the river is whiter than a goose, and the cock in the yard calls at four.","河上的天鹅,比鹅还白;院里那只公鸡,四点就开始打鸣。"],["The penguin cannot fly at all, and swims instead.","企鹅根本不会飞;它改游泳了。"]]},{"t":"At the Zoo","s":[["At the zoo a seal swims in a circle and a tortoise does not move for an hour.","动物园里,海豹一圈一圈地游;乌龟一个小时没动。"],["The turtle in the big tank is older than the keeper, and the whale on the wall is only a model.","大缸里那只海龟,比饲养员年纪还大;墙上那头鲸,只是个模型。"],["A kangaroo carries its young in a pocket, and a camel can go a week without water.","袋鼠把孩子装在口袋里;骆驼能一个星期不喝水。"],["The panda eats nothing but bamboo, and the elephant is given hay and fruit.","熊猫只吃竹子;大象那份是干草和水果。"],["Its ivory is worth more than the animal alive, which is why it is hunted.","它的象牙,比活着的它更值钱;所以总有人追着它打。"],["A horn is bone, and the coat of a bear is thick enough for the snow.","角是骨头;熊的毛厚得能挡住雪。"],["The wolf walks the length of its cage and back, and the fox sleeps through the afternoon.","狼在笼子里走到这头,再走回去;狐狸一觉睡过整个下午。"],["On the wall of the shop there is a dragon, red and gold, and nobody asks why.","店墙上画着一条龙,红金两色;没人问为什么。"]]},{"t":"On the Farm","s":[["The cub was born in March and the calf a week later, and both stayed close to the barn door.","那只幼兽三月出生,小牛晚一个星期;两个都守在谷仓门口,不肯走远。"],["The pup follows the shepherd everywhere, and the lamb stays with the flock.","小狗跟着牧羊人,走到哪儿跟到哪儿;羊羔只跟羊群。"],["They keep cattle on the low field and a buffalo by the water, and the ox pulls the cart when the tractor is broken.","低处那块地养牛,水边拴着一头水牛;拖拉机坏了,就靠公牛拉车。"],["The bull is kept apart, because he is not safe with strangers.","公牛单独关着,因为它见了生人不安全。"],["A horse is saddled in the morning and a donkey is harnessed to the cart, and both are back in the stable by dark.","早上给马备鞍,给驴套上车;天黑之前,两个都回了马厩。"],["A zebra will never be tame, and a child soon learns the difference.","斑马是永远驯不服的;这一点,孩子很快就看出来了。"],["The keeper comes at six and the shepherd at seven, and the animals know both.","饲养员六点来,牧羊人七点来;动物认得他们两个人。"]]},{"t":"How They Live","s":[["The behaviour of a fox is easy to watch and hard to explain, and a cat will rub its head on your hand for no reason.","狐狸的行为,看着容易,解释起来难;猫会无缘无故地用头蹭你的手。"],["A dog will bark at the gate and a lion will roar at nothing, and a snake will bite if you step on it.","狗冲着大门叫;狮子没来由地吼一声;你踩着蛇,它就咬你。"],["A wasp can sting more than once, and a bee only once.","黄蜂能蜇好几下;蜜蜂只蜇一次。"],["A beetle will creep under a stone and a baby will crawl across the floor, and neither is in a hurry.","甲虫慢慢钻到石头底下,娃娃在地板上爬;两个都不着急。"],["The habitat of a bird is the wood and the hedge, and its nest is built in the fork of a branch.","鸟的栖息地,是林子和树篱;它的窝,搭在树杈上。"],["A hive holds ten thousand bees and a cage holds one bird, and the difference is not lost on anyone.","一个蜂箱装一万只蜂,一个笼子只装一只鸟;这个差别,谁都看得出来。"],["A cell is the smallest part of a living thing, and a barrier of wire keeps the rabbits out of the field.","细胞是生物身上最小的单位;一道铁丝屏障,把兔子挡在田外。"],["There is a bar across the gate, and the gate is shut at night.","门上横着一根木闩;夜里,门就关上了。"]]},{"t":"Inside the Body","s":[["Anatomy is the study of what is inside, and it begins with the bone.","解剖学研究里面有什么;要从骨头开始。"],["An epidemic moves through a town in weeks, and it is carried by a germ too small to see.","流行病几个星期就能传遍一个镇子;带它跑的,是看不见的病菌。"],["A gene is passed from parent to young, and a virus is not a living thing at all.","基因由父母传给孩子;病毒呢,根本不算活的东西。"],["Bacteria and other microbes live on the skin and in the mouth, and most of them do no harm.","细菌和其他微生物住在皮肤上、嘴里;大多数并不伤人。"],["Metabolism is the rate at which the body burns what it is given, and protein and vitamin are what it builds with.","新陈代谢,是身体烧掉吃进来那些东西的速度;而蛋白质和维生素,是它用来建造自己的材料。"],["A gland will secrete what the body needs, and the rest is excreted by the kidney.","身体要用的,腺体分泌出来;剩下的,由肾排掉。"],["A wolf will devour a rabbit in two minutes, and instinct tells it to.","狼两分钟就能吞掉一只兔子;这是本能叫它做的。"],["An intuitive jump is often right, but it is not knowledge.","凭直觉的一跳,常常是对的;可那不算知识。"]]},{"t":"Senses and Sleep","s":[["Every animal has the potential its body allows and no more, and a fish will never learn to climb.","每个动物都有潜力,可潜力到头,也就到身体允许的地方;鱼永远学不会爬树。"],["Intelligence is measured by what an animal does with what it has, and a crow does a great deal.","智力看的是,动物拿手里的东西做出了什么;照这个算,乌鸦做的就很多。"],["A functional wing is one that works, and a sensitive nose is one that finds food in the dark.","有用的翅膀,是能飞的;灵敏的鼻子,是黑夜里也找得到食的。"],["A flexible body fits through a gap, and an acoustic signal carries further than a light.","柔软的身体,钻得过缝;声音的信号,比光传得远。"],["An optical nerve tells the brain what the eye sees, and the ear does the same for sound.","视神经把眼睛看见的告诉脑子;耳朵对声音,做的是同一件事。"],["A nocturnal animal sleeps by day, and a dormant one may sleep through a whole season.","夜里活动的动物,白天睡;休眠的动物,能一觉睡过一整季。"],["Hibernation is how a hedgehog gets through the winter, and it wakes in March thin and hungry.","刺猬靠冬眠过冬;三月醒来的时候,又瘦又饿。"]]},{"t":"Hunter and Prey","s":[["A hunter reads a track in the mud and a trace on a leaf, and both tell him what passed in the night.","猎人看得懂泥里的脚印,也看得懂叶子上留下的痕迹;两样都告诉他,夜里有什么东西走过。"],["The prey is always listening and the predator always waits, and their turns alternate through the year.","猎物一直在听,捕食者一直在等;一年里头,它们轮流占上风。"],["The victim of a hunt is usually old or young, and the young are vulnerable for a reason.","被猎杀的那一只,通常是老的或小的;幼崽脆弱,不是没有道理。"],["A captive animal is fed and safe and has no life of its own, and a defensive one will fight for a corner of ground.","关起来的动物,有吃的、有安全,却没有自己的生活;摆出守势的动物,会为一块地拼命。"],["Every animal will undergo some hardship and suffer some cold, and that is part of existing at all.","每个动物都得经历些艰难,受些冻;活着本来就是这样。"],["Most of them live at subsistence level, and a bad year is a bad year for everything.","它们大多只够糊口;年景一坏,对谁都是坏年头。"],["We have exterminated more species than we can count, and each one was the only one of its kind.","被我们消灭掉的物种,多得数不清;而每一种,都是它那一类里唯一的一种。"]]}],"4":[{"t":"Looking Up","s":[["The cosmos is everything there is, and the universe is the same thing, only seen as a whole.","宇宙就是存在的一切;把这一切当成一个整体来看,还是宇宙。"],["Our galaxy is one among billions, and interstellar space is not empty, because dust and gas drift between the stars.","我们的银河系,只是几十亿个里头的一个;星际空间也不是空的,尘埃和气体在星星之间飘。"],["A celestial body is anything up there, while a terrestrial planet is one like ours, with rock under your feet.","天上任何一样东西,都叫天体;类地行星说的则是我们这种,脚下踩着石头的。"],["Astronomy studies all of it; astrology only pretends to.","天文学研究的就是这些;占星术只是装作能研究。"],["On a clear night the telescope at the observatory shows a spectacle that no photograph keeps.","晴朗的夜里,天文台那台望远镜给你看的景象,照片一张也留不住。"],["A planet goes round the sun in an orbit, and that path lies close to the ecliptic.","行星绕着太阳走,走的那条道叫轨道;而这条道,离黄道很近。"],["The diameter of the earth is about twelve thousand kilometres, and its radius is half of that.","地球的直径约一万二千公里;半径,正好是一半。"]]},{"t":"Out There","s":[["An astronaut in orbit sees the curve of the earth below him, and from up there the whole thing looks small.","轨道上的宇航员往下看,看见的是地球的弧线;从那么高的地方看,这一切都显得小。"],["A comet drags its tail behind it, and the tail always points away from the sun.","彗星拖着自己的尾巴;那尾巴,永远背对着太阳。"],["A meteorite that lands makes a crater, and the dust and ash it throws up stay in the air for months.","陨石落下来,砸出一个坑;扬起的尘土和灰,在空中要待好几个月。"],["A spacecraft is sent up in a module, and the propulsion comes from a vent at the back.","航天器装在一个舱段里送上天;推力,从尾部的喷口出来。"],["The pressure inside is kept at one atmosphere, and the dynamics of the whole thing are worked out on paper first.","舱里的压力,保持在一个大气压;而整个东西的动力学,是先在纸上算清楚的。"],["Motion in space is simple, because nothing slows you down.","太空里的运动简单得很:没有什么东西会让你慢下来。"],["A spaceship on a long expedition carries a probe for a flyby, and the sample it brings back is worth the cost.","远航的飞船带上一个探测器,路过时掠一下;它带回来的样品,值这个价钱。"],["Exploration is the word for all of it, and it began with somebody looking up.","这一切,都叫探索;而探索,是从某个人抬头看天开始的。"]]},{"t":"What Things Are Made Of","s":[["Every substance is either a solid, a liquid or a fluid that flows, and water can be all three in one day.","物质不是固体、液体,就是会流动的流体;水在一天里,三样都能当。"],["Its composition tells you what is in it, and a compound is two elements joined together.","它的成分,告诉你里面有什么;两种元素连在一起,就是化合物。"],["A particle is a very small piece, a molecule is a group of atoms, and an atom is the smallest part of an element.","微粒是很小的一块;分子是一组原子;原子,是元素能分到的最小一份。"],["An ion carries a charge, an electron is one of its parts, and a quantum is the smallest amount you can have.","离子带电;电子是它的一部分;量子,是你能拿到的最小的一份。"],["Chemists synthesise a new compound by a method they invent, and the formation of the crystal is watched under a lens.","化学家用自己发明的办法合成新化合物;晶体怎么长起来的,就趴在镜片下看。"],["A fossil is a specimen of something that lived long ago, and the sample from the moon is kept in a box.","化石,是远古生物留下的一件标本;月球带回来的样品,则锁在盒子里。"]]},{"t":"Light and Signals","s":[["White light holds every colour, and a spectrum is that light spread out in order.","白光里含着所有的颜色;把这光按顺序摊开,就是光谱。"],["A dimension is one way of measuring a thing, and the frequency of a wave is how often it comes.","维度是量一样东西的一种方式;波的频率,是它隔多久来一次。"],["The signal from the probe is picked up by an antenna, and the circuit behind it turns the wave into a number.","探测器发回来的信号,由天线接住;后面的电路,再把波变成一个数字。"],["Refraction bends light as it passes from air into glass, which is why a straw looks broken in a glass of water.","折射让光从空气进到玻璃里时拐个弯;所以插在水杯里的吸管,看着是断的。"],["Ultraviolet light is invisible to us, and anything radioactive gives off something we cannot see either.","紫外线,我们看不见;放射性物质放出来的东西,我们也看不见。"],["Two stars are distinct if you can tell them apart, and discernible if you can just make them out.","两颗星分得清,是一回事;勉强看得出那儿有东西,是另一回事。"]]},{"t":"When It Goes Wrong","s":[["A collision at that speed would squash anything we could build, and the envelope of the capsule is only thin metal.","那个速度撞上来,我们造得出的一切都得压扁;而舱的外壳,不过是层薄金属。"],["A chunk of rock the size of a house came down over the desert last spring, and it broke into a thousand fragments.","去年春天,一块房子那么大的岩石落在沙漠上,碎成了千百片。"],["An event that size is cataclysmic, and the dust it lifts is overwhelming for a whole season.","那么大的一件事,是灾难性的;它扬起的尘埃,压得住整整一季。"],["The people who study it do not despair, and they are not desperate either, because the numbers are on their side.","研究它的人不绝望,也没有走投无路;数字站在他们那边。"],["It would be hopeless to plan for everything, so they plan for what is likely.","想给所有情况都做准备,是没指望的;他们只准备可能发生的那几种。"]]}],"5":[{"t":"From Primary to University","s":[["Education begins at home and then at a primary school, where a child learns to read and to sit still.","教育从家里开始,然后进小学。孩子在那儿学认字,也学坐得住。"],["Secondary school comes next, and after that some go on to a university or a college in another town.","接下来是中学;中学读完,有人就去外地念大学,或者念学院。"],["A college is often smaller than a university, and an institute may teach only one thing, such as engineering.","学院通常比大学小;而理工学院可能只教一样东西,比如工程。"],["An academy is the oldest word of the three, and it still sounds grander than the others.","专科学校这个说法,是三个里最老的;听起来,也还是它最气派。"],["The campus here is one long street with a lawn at each end, and in summer it is full of people who have nowhere to be.","这里的校园就是一条长街,两头各一块草坪;夏天一到,满街都是没地方去的人。"]]},{"t":"The First Week","s":[["In the first week you register at the office, and then you enrol in four courses and hope they do not clash.","开学第一周先去办公室注册,然后选四门课,心里盼着别撞时间。"],["Your name goes on a roster that the tutor reads out on the first morning.","你的名字被写进花名册;第一天早上,导师从头念一遍。"],["Matriculation is the old word for being let in, and it still appears on the letter they send you.","\"录取入学\"是\"准许你进来\"的老说法;如今那封寄给你的信上,印的还是这个词。"],["A fresher knows nothing, a sophomore thinks he knows everything, and by the third year a student is junior and quiet.","大一新生什么都不懂;大二那位以为自己全懂了;到三年级,人就沉下来,话也少了。"],["In the last year you are a senior, and after that you are one of the alumni, whether you come back or not.","最后一年,你是毕业班;再往后,不管你回不回来,都算校友了。"],["Orientation week is three days of being shown buildings you will never enter again.","入学介绍那一周,三天里带你看的楼,你以后大概一次也不会再进。"],["Accommodation is the first real problem, because the dorm holds six and there are seven of you.","住处是第一个真问题:宿舍住六个,你们却有七个人。"],["The dining hall is cheap and the canteen is cheaper, and both close at eight.","食堂不贵,小餐厅更便宜;两个都八点关门。"]]},{"t":"Learning and Teaching","s":[["You learn a language by using it, and you study a subject by sitting down with it for years.","语言是用出来的;一门学问,是坐下来磨上好几年磨出来的。"],["Either way you acquire something that stays, and that is what knowledge means.","两条路,都是把一样留得住的东西拿到手;这就叫知识。"],["Expertise is narrower and deeper, and it takes a novice ten years to get there.","专门的本事更窄,也更深;一个新手要走上十年。"],["The department will recruit two more teachers this year, because the classes are too big.","系里今年要再招两个老师,因为班太大了。"],["A person who can read and write is literate, and illiteracy is still common in the countryside.","能读能写的,叫识字;乡下不识字的人,还不少。"],["To be numerate is to be at home with numbers, and it matters as much as the other.","会算数,就是跟数字处得来;这跟识字一样要紧。"],["Some students cram the night before and forget it by Friday, which is not learning at all.","有些学生考前一晚猛塞,到周五就忘了;这根本不算学。"],["A good teacher will instil a habit rather than a fact, and will emphasise the method more than the answer.","好老师留下的是习惯,不是知识点;他强调方法,多过强调答案。"],["That is what enhances a class and enables a shy student to speak.","一节课好在哪里,就在这儿;害羞的学生能开口,也靠这个。"],["A single question can inspire a whole year of work.","一个问题,能撑起一整年的用功。"]]},{"t":"Why Anyone Bothers","s":[["The motive is rarely money, and the students who last are the ones who were motivated by something else.","动机很少是钱;能撑下来的学生,都是被别的东西推着的。"],["A good lecture stimulates an interest that was not there before, and a hard problem spurs people on.","一堂好课,能把本来没有的兴趣勾起来;一个难题,会推着人往前。"],["The impetus often comes from a teacher who took the trouble, and it lasts for years.","那股劲儿,常常来自一个肯费心的老师;而且能管很多年。"],["Parents who indulge a child will spoil him, and a school that indulges a class spoils the whole year.","父母一味纵容,孩子就宠坏了;学校一味纵容一个班,一整年都毁了。"],["The abuse of a system is what ruins it, not the system itself.","毁掉一套办法的,是滥用它的人,不是办法本身。"]]},{"t":"Clever, Brilliant, Notorious","s":[["An intelligent student works things out, a clever one finds a shortcut, and a smart one does both and looks good doing it.","聪明的学生能把事情想通;机灵的那个总能找到捷径;而精明的两样都会,还做得挺好看。"],["An all-round student is good at three things, and a genius is good at one thing nobody else can do at all.","全能的学生,三样都好;天才只做好一样,而那样别人根本做不了。"],["The elite of a school are not always the ones with the best marks, and an idiot can pass an exam.","学校里的精英,不一定是分最高的;而笨蛋,也有能考过的。"],["Wisdom is slower than wit, and it lasts longer.","智慧比机敏慢,可它耐用。"],["Aptitude is what you start with, and a capable student will get somewhere with very little of it.","天资是你起步时手里的东西;而有本事的学生,天资不多也能走出来。"],["An excellent essay is careful, an outstanding one is brave, and a brilliant one is both and reads easily.","优秀的文章,胜在仔细;杰出的,胜在敢;而出色的两样都有,读起来还轻松。"],["Prestige takes a hundred years to build, and a reputation takes one afternoon to lose.","声望要一百年才立起来;名声,一个下午就能丢。"],["An eminent professor may be dull in class, and a notorious one is remembered for the wrong reason.","有名望的教授,课上可能很闷;而声名狼藉的那位,是被人记岔了地方。"],["Students esteem the teachers who respect them, and it is that simple.","学生敬重的,是尊重他们的老师;就这么简单。"],["A diligent student does the work, a painstaking one does it twice, and both end up with the skill.","勤勉的学生把活干了;肯下笨功夫的干了两遍;最后,两个人都学到了本事。"],["The approach matters more than the hours, and a scheme that looks clever on paper often fails in a classroom.","方法比时长要紧;纸上看着聪明的方案,进了教室常常不灵。"]]},{"t":"The People in the Building","s":[["The headmaster runs the school and the principal runs the college, and both are called the head by everyone.","校长管中学,院长管学院;可人人张口,都叫他们\"头儿\"。"],["A dean looks after one faculty, and the faculty is both the teachers and the subject they teach.","院长照看一个学院;而\"学院\"这个词,既指全体教员,也指他们教的那门学问。"],["A professor has a chair, a scholar has a library card, and a scientist has a laboratory and no time.","教授有一把教席;学者有一张借书证;科学家有一间实验室,和一点空都没有。"],["A mentor answers the questions you did not know how to ask, and a tutor is paid by the hour to do the same.","导师回答的是你不知道怎么问的问题;家教按小时收钱,做的是同一件事。"],["A lecturer stands at the front, and an assistant stands at the side and marks the papers.","讲师站在前面讲;助教站在旁边,低头改卷子。"],["Every candidate wants the same thing, and only half of them will get it.","每个应试的人,想要的东西都一样;可只有一半拿得到。"],["A pupil is still at school, and a graduate has a degree and no idea what to do next.","小学生还在学校里;毕业生手里有了学位,却不知道下一步干什么。"]]},{"t":"Paper That Says You Can","s":[["A degree is a piece of paper that says you studied something for three years.","学位是一张纸,上面写着:你研究过某样东西,研究了三年。"],["To qualify you have to pass the exams, and to be certified you have to prove it again to somebody else.","要拿到资格,得过考试;要拿到证明,还得再向别人证明一遍。"],["A license and a permit are both permission, but a license is for a trade and a permit is for one act.","执照和许可,都是一种准许;差别在于,前者给一门手艺,后者给一件事。"],["A diploma is what you hang on the wall, and a diplomat is the one who gets sent abroad with it.","文凭是挂在墙上的那一张;外交官,则是带着它被派到国外去的人。"],["An ambassador outranks the diplomat, and the ceremony at the end of the year outranks both in memory.","大使比外交官高一级;可在记忆里,年底那场典礼比这两个都重。"],["A bachelor has three years behind him, a master two more, and a doctor at least three after that.","学士身后是三年;硕士再加两年;博士,之后至少还得三年。"],["You earn credit for each course, and a score of sixty is enough to pass.","每门课都挣学分;六十分,就够及格。"],["The mark on the paper matters less than the grade at the end of the year, and the rank in the class matters least of all.","卷面上的分数,不如学年总评要紧;而班里的名次,最不要紧。"]]},{"t":"The Shape of a Term","s":[["A course lasts one semester, and a term is the old word for the same thing.","一门课上一个学期;学期这个说法还有个更老的词,说的是同一件事。"],["The timetable is fixed in September and the schedule changes by October, and the deadline never moves.","课表九月定下来,日程到十月就变了;只有截止日期,从来不动。"],["A lesson is fifty minutes, and the curriculum is what the whole year has to contain.","一节课五十分钟;而课程体系,是一整年必须装进去的东西。"],["There is a seminar on Tuesday and a forum on Thursday, and both are worse than they sound.","周二有研讨课,周四有讨论会;两个都比听着更难熬。"],["The syllabus tells you what will be covered, and the system behind it decides what you may take.","教学大纲告诉你讲什么;但它背后那套制度,决定你能选什么。"],["A rudimentary knowledge of the language is enough for the first year, but the basic course assumes nothing at all.","语言有个入门的底子,第一年就够用;而基础课,则假设你什么都不会。"],["The fundamental ideas are taught first, and the elementary ones are taught again in October to whoever forgot them.","先讲根本的道理;到十月,再把最浅的那些,给忘了的人重讲一遍。"],["Two lectures go deep and one only skims the surface, and the profound one is usually optional.","两堂课讲得深,一堂只在水面上滑过去;而深的那一堂,通常是可以不去的。"],["The compulsory courses are the ones nobody chooses, and a prerequisite is what you must pass before you may start.","必修课,就是没人会主动选的那些;先修条件,是你开始之前必须先过的那一门。"],["A selective course is hard to get into, and an elective is the one you take because it fits on a Tuesday.","选拔性的课难进;而选修课,是你因为它排在周二才选的那门。"],["Every assignment has to be submitted online, and the printer in the library jams at least once a day.","每份作业都得在线提交;图书馆那台打印机,一天至少卡一次。"],["Discipline is what gets you to the nine o clock lecture, and it has nothing to do with punishment.","纪律,是让你赶上九点那堂课的东西;它跟惩罚没有关系。"],["A principle is a rule you can argue from, a doctrine is one you are told to accept, and a theory is one that may still be wrong.","原则,是你能拿来论证的规则;教义,是别人要你接受的;而理论,是可能还错着的那一种。"]]},{"t":"Reading for a Degree","s":[["Before a lecture you preview the chapter, and after it you review your notes while they still make sense.","上课前,先把这一章预习一遍;下课后,趁笔记还看得懂,赶紧复习。"],["In May you revise everything again, which is a different verb and a worse job.","到五月,所有东西再温一遍;那是另一个词,也是更苦的活。"],["You inspect the data first, then you consult the handbook when the numbers look wrong.","先检查数据;数字看着不对,再去翻手册。"],["Learn to skim a report in two minutes and to scan a page for one name, because nobody reads every word.","学会两分钟略读一份报告,也学会在一页上扫出一个名字;因为没人会逐字读。"],["A good examiner will scrutinise the argument, not the handwriting.","好考官细看的是论证,不是字迹。"],["You recite the poem in class and dictate a paragraph to the class, and both are more frightening than the examination itself.","你要在课上背诗,还要给全班做听写;这两样,都比考试本身吓人。"],["A test is short and a quiz is shorter, and a presentation is the only one where they look at you.","测验短,小测更短;而展示,是唯一他们要抬眼看你的那一种。"],["To plagiarise is to copy a sentence and hope, and it is the one thing that will end a degree.","抄袭,就是抄一句,然后祈祷;这是唯一能把一个学位了结掉的事。"],["Print it twice, keep one copy, and hand in the other.","打两份:一份留着,一份交上去。"]]},{"t":"The Library","s":[["Literature is what people wrote, and the library keeps it on three floors.","文学是人们写下来的东西;图书馆把它放在三层楼里。"],["An article is short, an author is whoever wrote it, and a tale is what your grandmother told you.","文章短;作者是写它的那个人;而故事,是你奶奶讲给你听的那种。"],["Fiction is invented, and a story can be either, and a diary is true and dull.","小说是编出来的;故事可以是编的,也可以是真事;而日记是真的,也很闷。"],["Poetry takes a page to say what a sentence could, and a magazine takes a week to say nothing.","诗用一页,说一句就能说完的事;杂志用一个星期,什么也没说。"],["A journal is where the work is published, and the coverage of a subject is how much of it has been written about.","期刊是发表研究的地方;一个题目被覆盖得多广,看的是它被写过多少。"],["The bibliography at the end is longer than the chapter, and the encyclopedia on the shelf is older than the building.","书末的参考书目,比那一章还长;架上那套百科全书,比这栋楼还老。"],["A biography is one life, a documentary is one year, and a series is one subject spread over twelve evenings.","传记写的是一生;纪录片拍的是一年;系列片,是一个题目摊在十二个晚上。"],["Every experiment goes into a record, and every record goes into a file.","每次实验都进一份记录;每份记录,都进一个档案。"],["A profile is a page about a person, and a draft is a page that is not finished.","简介是写人的一页;草稿,是还没写完的那一页。"],["He sketched the plan on a brochure, and the manual for the machine is three pages of drawings.","他把计划画在一本小册子背面;那台机器的说明书,是三页图。"],["A frame holds a picture and also holds an argument, and an index tells you where to look.","画框装画;框架也装论证;而索引告诉你该往哪儿看。"],["The catalogue lists every book by category, and the inventory counts what is actually on the shelf.","目录按类别列出每本书;清单,数的则是架上真正有几本。"],["The content of a course is not the same as its context, and a list of chapters is not a book.","一门课的内容,不等于它的语境;一串章名,也不等于一本书。"],["Volume one is on the desk, volume two is lost, and the reel of film has not been shown since 1974.","第一卷在桌上,第二卷丢了;那卷胶片,从一九七四年起就没再放过。"]]},{"t":"Bits and Pieces of a Course","s":[["A platform is where you stand to speak, and it is also where the course materials are put online.","讲台,是你站着讲话的地方;课程资料放到网上的那个地方,也叫平台。"],["The college went coed in 1972, which means it began to take women as well as men.","这所学院一九七二年开始男女同校,意思是除了男生,它也收女生了。"],["The issue was never the money, and the whole affair was settled in a week.","问题从来不在钱上;整件事,一个星期就了了。"],["It became a controversial decision, and the argument turned into a puzzle nobody could solve and a riddle nobody could answer.","这个决定引来争议;争论最后变成一个谁也解不开的谜,一个谁也说不出答案的谜语。"],["The reason was obscure, and the letter they sent was deliberately unclear.","原因很含糊;他们寄来的那封信,也故意写得不清不楚。"],["The object of the course is not the same as the subject of the course, and both are on the first page.","课程的目标,和课程的主题不是一回事;两样都印在第一页上。"],["You choose a major in the second year and a minor in the third, and neither is easy to change.","二年级选主修,三年级选辅修;两个都不好改。"]]},{"t":"Choosing a Subject","s":[["Sociology looks at people in groups, politics looks at who decides, and economics looks at what things cost.","社会学看的是聚在一起的人;政治学看谁说了算;经济学看东西值多少钱。"],["Marketing is how a company sells, accounting is how it counts, and an audit is when somebody else counts again.","营销讲一家公司怎么卖;会计讲它怎么记;而审计,是别人再来数一遍。"],["Statistics turns a crowd into a number, and psychology asks why the crowd did that.","统计学把一群人变成一个数字;心理学问,这群人为什么这么做。"],["Philosophy asks what a question means, and logic tells you whether the answer follows.","哲学问一个问题的意思究竟是什么;逻辑告诉你,答案能不能推得出来。"],["Biology is about living things, physics about how they move, and chemistry about what they are made of.","生物学管活物;物理学管它们怎么动;化学管它们是什么做的。"],["Agriculture feeds everyone, logistics gets the food to the shop, and geography explains why the shop is there.","农业养活所有人;物流把吃的送到店里;地理学解释,店为什么开在那儿。"],["History is what happened, and mechanics is why the machine will not start.","历史是发生过的事;力学,是机器为什么打不着火。"],["Electronics is what is inside the radio, and maths is what you need before you may touch either.","电子学是收音机里面的东西;而在碰这两样之前,你得先会数学。"],["Arithmetic is the four operations, geometry is shapes, algebra is letters for numbers, and calculus is what comes after.","算术是四则运算;几何是形状;代数是拿字母代替数字;微积分,是后面的事。"]]},{"t":"Sums and Numbers","s":[["Three plus four is seven, and the sum of a column is what you get when you add it up.","三加四等于七;一列数加起来得到的那个结果,叫和。"],["The total is the whole thing, and after the merger the two companies had one total.","总数是整体;两家公司合并之后,就只有一个总数了。"],["An equation says two things are the same, and identical means they really are the same.","方程式说的是两样东西相等;而完全相同,是说它们真的一样。"],["Take away is minus, and subtract is the same word for grown ups.","\"拿掉\"就是减;而\"减去\",只是大人用的那个说法。"],["Multiply by two and divide by four, and you are back where you started.","乘以二,再除以四,你就回到原处。"],["The dividend is the number being divided and the remainder is what is left over.","被除数,是那个等着被除的数;余数,是除完剩下的。"],["A rational answer is one another person can follow, and a variable is the part that keeps changing.","合理的答案,别人能跟着走一遍;而变量,是那个一直在变的部分。"],["A parameter is fixed for the experiment, even though nobody can say why.","参数在实验里是固定的;尽管没人说得出,为什么是它。"],["Two, four and six are even, and one, three and five are odd, and that is all there is to it.","二、四、六是偶数,一、三、五是奇数;就这么回事。"],["Double it, then triple it, and if you are brave, quadruple it, and the answer is a multiple of the first number.","翻一倍,再翻两倍,胆大的话翻四倍;答案总是原来那个数的倍数。"],["The maximum is what the machine can do, and the minimum is what it needs to start.","最大值,是这台机器能干到的极限;最小值,是它启动所需的那个数。"],["There are approximately forty students, which means thirty eight or forty one, and nobody counts.","大约四十个学生;意思是三十八,或者四十一;反正没人真去数。"]]},{"t":"Charts and Shapes","s":[["A chart shows the numbers as a picture, a graph draws a line through them, and a diagram shows how the parts fit.","图表把数字画成图;曲线图在它们之间连一条线;示意图说明各部分怎么拼。"],["A table puts them in rows, and a matrix puts numbers in both rows and columns.","表格把数字排成行;矩阵,则把它们排成行和列。"],["A rectangle has four straight sides, a triangle has three, and a cube is a box with six faces.","长方形四条直边,三角形三条;立方体是六个面的盒子。"],["An angle of ninety degrees is a corner, and the diagonal runs from one corner to the other.","九十度的角,就是一个直角;对角线,从一个角一直连到另一个角。"],["A circle is round, a sphere is round in every direction, and a cone is round at the bottom and pointed at the top.","圆是平面的圆;球是每个方向都圆;圆锥底下圆,上面尖。"],["A dot marks one point on the line, and a straight line is the shortest way between two.","点在线上的某处留个记号;直线,是两点之间最短的路。"],["The extent of the field is a hundred metres, and its width is half its length.","这块地有多大,量出来是一百米;宽度,是长度的一半。"],["Write it as a decimal and then as a per cent, because a proportion is easier to see that way.","先写成小数,再写成百分数;比例这样看着清楚。"],["The rate is how fast, the ratio is how much to how much, and a fraction is one number over another.","速率讲多快;比率讲多少比多少;分数,是一个数压在另一个数上面。"],["On a scale of one to ten the machine is a seven, and one ounce of it is enough to sink a boat.","按一到十分算,这台机器算七分;而一盎司这种东西,就够把一条船弄沉。"],["Density is how much fits in a space, and that is all the word means.","密度,是一个空间里能装多少;这个词,就这个意思。"]]},{"t":"The Bench","s":[["The quantity matters less than the quality, and a small jar of the pure thing is worth a barrel of the other.","数量不如质量要紧;一小罐纯的,值一大桶不纯的。"],["The thermometer on the wall is in Fahrenheit, and the one in the drawer is in Celsius, so nobody knows what the weather is.","墙上的温度计是华氏,抽屉里那支是摄氏;于是没人知道天气到底怎么样。"],["Mercury rises with the heat, and a battery holds the charge that the volt measures.","水银一热就往上走;电池存着那份电,由伏特来量。"],["A fire will radiate heat across a room, and a lamp will emit just enough light to read by.","火把热辐射到整个屋子;灯放出的光,刚够看书。"],["Glass is transparent, so you can see the hollow inside, and the tube is hollow all the way down.","玻璃是透的,你能看见里面是空的;那根管子,从头到尾都是空的。"],["Ozone high up protects us, and ozone at street level does not.","高处的臭氧护着我们;街面上的臭氧,不护。"],["Gravity pulls everything down, and friction is why nothing slides for ever.","重力把一切往下拉;摩擦,解释了为什么没有东西能一直滑下去。"],["The old man was eccentric, and he would displace a whole shelf of books to find one.","那老头脾气古怪;为了找一本书,他能把一整个书架都挪开。"],["Water will boil at a hundred, melt ice at nought, and dissolve sugar without a sound.","水到一百度就沸;零度时冰化了;糖扔进去,一声不响就没了。"],["Iron will rust in the rain, and milk will ferment in the heat.","铁在雨里会锈;牛奶在热里会发酵。"],["Dilute the acid before you touch it, because the strong one is noxious and will burn through a glove.","碰酸之前先稀释;浓的那瓶有毒,能把一只手套烧穿。"],["A static charge will lift a hair, and an inert gas will do nothing at all.","静电能把一根头发吸起来;惰性气体,什么也不做。"],["Nothing inherent in the metal makes it weak; the fault is in how it was made.","这金属本身并不弱;毛病出在它是怎么造出来的。"],["The formula tells you the proportions, and each component goes in by weight.","配方告诉你比例;每种成分,按重量放进去。"],["Compose the mixture slowly, blend it until it is even, and do not stir a blend once it is set.","慢慢把混合物配好,搅到均匀;一旦凝住了,就别再搅。"],["Empirical work means you tried it, and practical means it worked in the kitchen and not only on paper.","\"经验的\",是说你真试过;\"实用的\",是说它在厨房里也管用,不只是在纸上。"]]},{"t":"Thinking It Through","s":[["You presume the bus will come, you suppose it will be on time, and you are wrong about one of them.","你假定公交会来,你猜想它会准点;其中一样,你猜错了。"],["A hypothesis is a guess you can test, and a postulate is one you agree not to test.","假说,是你能检验的猜想;公设,是大家说好不去检验的那一种。"],["We can only speculate about the rest, and predict what happens next with the same numbers.","剩下的事,我们只能推测;再拿同一批数字,预测下一步。"],["You perceive a change before you can name it, and a good instrument will detect what the eye cannot.","你能察觉到变化,却还说不出是什么;好的仪器,能测出眼睛测不到的东西。"],["To discern a pattern is to see it and be sure, and to recognise it is to have seen it before.","辨认出规律,是看见,而且确定;认出它,是以前见过。"],["A conscious choice is one you knew you were making, and most of them are not.","有意识的选择,是你知道自己正在做的那个;而大多数选择,都不是。"],["I reckon it will rain, and I deem the plan unwise, and neither is a promise.","我估计会下雨;我认为这个计划不明智;两个,都不是保证。"],["A silence can imply more than a sentence, and a nod can represent agreement you do not feel.","沉默能暗示的,比一句话还多;一个点头,也能代表你并不真有的同意。"],["She will insist on paying and persist in walking home, and both are a kind of pride.","她坚持付钱,也坚持走回家;两样,都是某种骄傲。"],["You can understand a word and still not comprehend the sentence it sits in.","你可能认识一个词;可它所在的那句话,你还是不明白。"]]},{"t":"Analysing and Concluding","s":[["To analyse is to take it apart, and to diagnose is to say what is wrong with it.","分析,是把它拆开;诊断,是说出它哪儿坏了。"],["From two facts you may infer a third, and from a rule you may deduce a case.","从两件事,可以推想第三件;从一条规则,可以推出一个具体情形。"],["You conclude only when the evidence stops, and not before.","证据用完,才下结论;早一步都不行。"],["An analogy is a comparison that helps, and a contrast is a comparison that separates, so compare the two cases before you use either word.","类比,是帮你把事想通的比较;对照,是把两样分开的比较;用这两个词之前,先比一比那两个例子。"],["Where two accounts overlap they agree, and where one is in contradiction with the other, one of them is wrong.","两份说法重叠的地方,是一致的;互相矛盾的地方,必有一份是错的。"],["Two people can disagree and still differ in nothing else, and a diverse group will disagree more often and think better.","两个人可以意见不同,别处却完全一样;一群人越多样,分歧越多,想得也越好。"],["The nuance is the small difference that decides the case, and it is always in the detail.","细微的差别,就是决定胜负的那点小不同;而它,总在细节里。"],["An inductive argument goes from many cases to one rule, and it can never be certain.","归纳的论证,从许多事例走到一条规则;它永远不能确定。"],["A thorough check takes an afternoon, and it turns up the one thing an example would have hidden.","彻底的检查要花一个下午;它能找出那个,一个例子本来会遮住的东西。"],["For instance, the second reading confirms what the first one suggested, and the third demonstrates it.","举例来说,第二次读数证实了第一次的猜测;第三次,把它演示出来了。"],["The fault will manifest itself as a noise, and a diagram will illustrate where it comes from.","故障会以一种响声的形式出来;一张图,能说明它是从哪儿来的。"],["Then you must determine the cause, decide what to do, and resolve the thing before Friday.","然后你得确定原因,决定怎么办,在周五之前把它解决掉。"]]},{"t":"Writing It Up","s":[["A thesis is one argument held for a hundred pages, and a dissertation is the same thing with more footnotes.","论文,是一个论点撑起一百页;学位论文,是同样的东西,脚注更多。"],["A project is smaller and a report is shorter, and both have a heading on every page.","项目小一些;报告短一些;两样,每页都有标题。"],["From the outset you should know the outline, even if the middle of it changes.","从一开始,你就该知道纲要;哪怕中间会变。"],["The gist is what you would say if somebody stopped you in the street, and the opinion is what you think of it.","要点,是别人在街上拦住你时你会说的那几句;看法,是你对它的评价。"],["Introduce the question in the first paragraph, and do not introduce yourself.","第一段引出问题;别引出你自己。"],["Every reference has to be a real book, and every claim has to cite one.","每条参考文献都得是真书;每个论断,都得引一条。"],["A good question will elicit an answer the writer did not plan, and a good quotation will do the same in fewer words.","好问题能引出写的人没准备过的答案;好的引文,用更少的字做到同样的事。"],["You extract one sentence from a page, quote it exactly, and put the rest back on the shelf.","你从一页里摘出一句,原样引用;剩下的,放回架上。"],["The abstract is written last, because it summarises what you found out.","摘要最后写;因为它总结的,是你发现了什么。"],["A summary of a summary is a title.","摘要的摘要,就是标题。"]]},{"t":"Research and Money","s":[["A survey asks many people the same thing, and a questionnaire is the paper you hand them.","调查,是问很多人同一件事;问卷,是你递到他们手里的那张纸。"],["Research begins with a question, and you have to observe before you can answer it, which mostly means sitting still.","研究从一个问题开始;要回答,就得先观察;而观察,多半就是坐着不动。"],["If you inquire politely you will get an answer, and if you query the number you may get a better one.","客气地问,会得到回答;对那个数字提出疑问,也许能得到更好的回答。"],["You will not achieve much in a week, and you cannot accomplish it alone.","一个星期,做不成什么;一个人,也完成不了。"],["It takes years to attain that level, and a morning to lose the habit.","到那个水平,要几年;丢掉习惯,只要一个早上。"],["There is a queue outside the office from eight, and a row of chairs for the ones who wait.","八点起,办公室外就排起队;还有一排椅子,给等的人坐。"],["The grant pays the fees, and a scholarship pays them and a little more, while a fellowship is the one that also buys the coffee.","助学金付学费;奖学金付学费,还多一点;而研究员津贴那种,连咖啡也管得起。"],["They will praise the work in public and criticise it in the corridor, and both are useful.","他们会在公开场合称赞这份工作,在走廊里批评它;两样都有用。"],["I appreciate the feedback even when it is wrong, because a wrong note still tells you something.","即使是错的反馈,我也领情;错的意见,也能告诉你点什么。"],["Do not underestimate the reading, and do not overestimate the writing.","别低估读的量;也别高估写的难。"],["You apply in January and hear nothing until April, and then a letter arrives.","一月申请,四月之前没有音信;然后,信来了。"],["The reward for the best paper is a prize and a small award, and the fee for the conference is your own.","最佳论文的回报,是一个奖和一笔小奖金;而会议注册费,得你自己出。"]]}],"6":[{"t":"From the Workshop","s":[["Technology is what we can do with what we know, and a technique is the way one person does it.","科技,是凭我们知道的东西能做到的事;而技巧,是某一个人动手时的做法。"],["My cousin went to a polytechnic and came out an engineer, and his friend stayed in the garage and became a mechanic.","我表哥念的是工学院,出来就是工程师;他朋友留在修车铺,成了机修工。"],["Every advance starts with somebody who is annoyed enough to try something else.","每一次进步,都从一个人被烦得受不了、决定换个办法开始。"],["To innovate is to do it differently, and a breakthrough is when the different way turns out to work.","创新,就是换个做法;而突破,是那个换法居然成了。"],["The first version was a gizmo the size of a shoebox, and it did one thing badly.","最早那版,是个鞋盒大小的玩意儿;只干一件事,还干不好。"],["He took out a patent, so nobody else could sell it, and then he spent ten years defending it.","他申请了专利,别人就卖不了;之后十年,他都在守这个专利。"],["To devise something is to work it out on paper, to invent it is to build it, and to discover it is to find that it was there all along.","设计,是在纸上把它想出来;发明,是把它造出来;而发现,是发现它本来就在那儿。"]]},{"t":"Finding Out","s":[["A company will disclose what it wants you to know and reveal the rest by accident.","公司只会透露它想让你知道的;剩下的,靠意外漏出来。"],["Two reporters uncovered the file, and the story exposed what had been going on for years.","两个记者挖出了那份档案;报道一登,做了好些年的事就被揭了出来。"],["Each science has its own domain, and the realm of the very small belongs to physics.","每门科学都有自己的地盘;极小极小的那个地盘,归物理。"],["The foundation of the whole thing was one experiment in 1908, and nobody expected it to work.","整件事的基础,是一九〇八年的一个实验;当时没人觉得它能成。"],["You specialise late, and until then you concentrate on the basics.","专精要晚一点;在那之前,先专心把底子打好。"],["The lens brings the light to a focus, and the whole design focuses on that one point.","透镜把光收到一个焦点上;整个设计,也都压在那一点上。"],["They utilise the waste heat, and the usage of water has fallen by half.","他们把废热利用起来;用水量,降了一半。"]]},{"t":"The Kit","s":[["A tester tells you whether it works, and a gauge tells you how much.","测试仪告诉你它行不行;计量器告诉你,有多少。"],["A device does one job, an appliance does it in the kitchen, and equipment is the whole set.","装置只管干一件事;器具,是厨房里干那件事的;而设备,是一整套。"],["The facility has a workshop and a clean room, which is more than the lab next door has.","这个地方有车间,还有一间洁净室;隔壁实验室没这么全。"],["An instrument measures, and a tool makes; a hammer is the second and a thermometer the first.","仪器用来量,工具用来做;锤子属于后者,温度计属于前者。"],["You calculate the answer, a machine will compute it faster, and a child can count it on his fingers.","你算出答案;机器算得更快;而孩子掰着手指头,也能数出来。"],["To estimate is to guess with numbers, to assess is to judge what you found, and to evaluate is to decide what it is worth.","估算,是带着数字去猜;评定,是对着结果做判断;评价,是定它值多少。"]]},{"t":"Bits and Pieces","s":[["An accessory is not needed but is sold with it, and a byproduct is what you get without trying.","配件不是必需品,却跟着一起卖;副产品,是你没打算要、却还是得到的东西。"],["An auxiliary pump starts when the main one fails, and it is tested once a year.","主泵一坏,辅助泵就起来干活;它一年测一次。"],["A versatile tool will do four jobs, and a good mechanic is versatile in the same way.","多用的工具,四样活都能干;好的机修工,也是这么个什么都会一点。"],["You add the parts one at a time and the total accumulates, so by Friday the box is full.","零件一个一个往上加,总数慢慢积累;到周五,箱子就满了。"],["Two men assemble the frame while a third gathers the screws and attaches the panel.","两个人装框架;第三个人收拢螺丝,把面板固定上去。"],["Every part belongs to a set, and the set has a number stamped on the box.","每个零件都属于一套;那一套,箱子上印着编号。"]]},{"t":"Seeing Small, Hearing Far","s":[["Optics is the study of light, and a microscope with a good lens will show you the whole of a fly.","光学研究的是光;配一副好镜片,显微镜能把一只苍蝇整个看清。"],["Radar sends out a pulse and listens for the echo, and a sensor does the same thing quietly.","雷达发一个脉冲出去,等回声回来;传感器做的是同一件事,只是不出声。"],["Multimedia is sound and picture together, and the network carries both to the screen.","多媒体,是声音加画面;网络把两样一起送到屏幕上。"],["You open a browser on a microcomputer or a laptop, and the software does the rest.","你在微型机或者笔记本上打开浏览器;剩下的,交给软件。"],["The keyboard clicks, the screen lights up, and the loudspeaker says what the microphone heard.","键盘咔哒响,屏幕亮起来;扬声器把麦克风听见的东西说出来。"],["An old cassette and a reel of tape were how we kept sound, and the dial was how we found the station.","从前我们用盒式磁带、用一卷带子存声音;找台,靠的是那个刻度盘。"],["Everything inside works in binary, which is why the signal is called digital.","里面的一切都按二进制走;所以这个信号,叫数字信号。"],["Wireless means no cable, and high-definition means you can count the hairs.","无线,就是没有线;高清,就是连头发都数得清。"],["Audio is what you hear and vision is what you see, and a fantasy film puts both in a place that never existed.","声音是听的,画面是看的;而奇幻电影,把两样都放进一个从来没有过的地方。"],["Science fiction has been right about the telephone and wrong about almost everything else.","科幻猜对了电话;别的,几乎全猜错。"]]},{"t":"Water, Air and Steam","s":[["A pump moves water up, and a generator turns the fall of it back into power.","泵把水往上送;发电机,再让水落下来,把那份力变回电。"],["The gear turns the shaft, and the shaft turns on a pivot that has not been oiled since March.","齿轮带动轴;那根轴,转在一个从三月起就没上过油的枢轴上。"],["The hydraulic lift works on water pressure, and it will hold a car at any height.","液压升降机靠水压干活;一辆车,它能把住任何一个高度。"],["The drainage was put in before the houses, and the sewage goes the other way.","排水系统比房子先修好;污水,走的是另一条路。"],["Ventilation is the whole art of letting air in without letting the rain in.","通风这门手艺,说到底,就是让空气进来,别让雨进来。"],["Compress the gas and it warms, let it expand and it cools, and condense it and you have liquid again.","气体一压就热,一放就冷;再冷凝一下,又是液体。"],["They refine the oil, simplify the pipe, purify the water and filter the air.","他们炼油、把管道改简单、把水弄干净、把空气滤一遍。"],["To distil is to boil it and catch what comes off, which is how the strong spirit is made.","蒸馏,就是把它煮开,接住跑出来的东西;烈酒就是这么来的。"]]},{"t":"How It Works","s":[["The machine has three modes, and the quiet one is the only one worth using.","这台机器有三种模式;只有安静的那个,值得用。"],["A prototype is built to fail, and the framework is what you keep after it does.","原型本来就是造来失败的;它失败之后留下的那个骨架,才是收获。"],["Every aspect of the design was checked in the first phase, and the second phase changed all of it.","设计的每个方面,第一阶段都查过;到第二阶段,又全部改了。"],["One person operates it and two people watch, and that is how a factory works.","一个人操作,两个人看着;工厂就是这么转的。"],["A handle on the side facilitates the lift, and it transforms a two man job into a one man job.","侧面的把手,让抬起来省力;一个两人活,就这么变成一人活。"],["You can convert it to gas, alter the speed, shift the weight and turn it round, but you cannot adapt it to salt water.","你可以把它改成烧气,改速度,挪重心,转方向;可你没法让它适应海水。"],["Every new owner will adjust something, and half of them adjust it wrong.","每个新主人都会调点什么;一半人,调错了。"]]},{"t":"When It Goes Wrong","s":[["The engineer could pinpoint the fault in a minute, and she was accurate every time.","工程师一分钟就能指出毛病在哪儿;而且每一次都准。"],["The figure has to be precise, because a rough number is worse than none.","这个数字必须精确;粗粗一个数,比没有还糟。"],["The correct reading is on the left, and the one on the right is wrong.","对的读数在左边;右边那个,是错的。"],["An error in the third line made the whole table useless, and it was a mistake anyone could make.","第三行错了一个数,整张表就废了;这个错,谁都可能犯。"],["There is a flaw in the metal, and the fault is not in the design.","金属里有一处缺陷;毛病不在设计上。"],["He stumbled on the step and dropped the box, and that is how the corner got broken.","他在台阶上绊了一下,箱子掉了;那个角,就是这么磕坏的。"],["We keep a spare part for a contingency, because the circumstance will come up sooner or later.","我们留一个备件,以防万一;那种情况,迟早会碰上。"]]}],"7":[{"t":"What a People Leaves Behind","s":[["Culture is everything a people does without thinking about it, and civilisation is what happens when they begin to write it down.","文化,是一群人想都不想就在做的事;文明,是他们开始把这些记下来之后的样子。"],["The renaissance was a hundred years when Europe read its own old books again.","文艺复兴,就是欧洲重新读自己那些旧书的一百年。"],["An epic is a long poem about one man, and every country has one it is proud of.","史诗是讲一个人的长诗;每个国家,都有一首拿得出手的。"],["An ideology is a set of ideas that explains everything and forgives itself.","意识形态,是一套什么都解释得通、也什么都宽恕得了的想法。"],["A tradition is what your grandmother did, a convention is what everyone does, and a custom is what this village does and the next one does not.","传统,是你奶奶做的事;惯例,是大家都做的事;而风俗,是这个村子做、隔壁村子不做的那件事。"]]},{"t":"Orders Old and New","s":[["Under feudalism the land belonged to one man and the people on it belonged to the land.","封建制度下,地是一个人的;地上的人,属于这块地。"],["Slavery is older than any of that, and it is not finished yet.","奴隶制比这些名堂都老;而且,到今天也没完。"],["An ethical question is what you should do, and a moral one is what you owe to the person in front of you.","伦理问题问的是你该做什么;道德问题问的,是你对面那个人,你欠他什么。"],["A tribe is a group that knows its own names back seven generations.","部落,是一群能把自家名字往上数七代的人。"],["The aboriginal people here were the first inhabitants, and they were native to this coast long before anyone wrote it down.","这里的原住民,是最早的住户;在有人把它写下来之前很久,他们就属于这片海岸。"],["The local school teaches the local language, and the books are printed twenty miles away.","本地学校教本地话;书,却在二十英里外印。"],["To a villager the fruit is ordinary, and to a foreigner it is exotic.","对村里人,这果子平常得很;对外来的人,它就是件新奇的外国货。"],["An alien is not from here, and in the old books the word meant a stranger, not a creature from another world.","\"外来的\",就是不是本地的;在旧书里,这个词指陌生人,不是外星生物。"],["An anthropologist lives with a tribe for a year, and a humanitarian stays for ten.","人类学家跟一个部落住一年;人道主义者,住十年。"]]},{"t":"The Past in the Ground","s":[["Heritage is what you inherit without signing anything, and a house is the part of it you can touch.","遗产,是你不签任何字就继承下来的东西;房子,是其中你摸得着的那部分。"],["An antique is a chair nobody may sit on, and the museum keeps three of them behind glass.","古董,是一把谁都不许坐的椅子;博物馆在玻璃后面,摆了三把。"],["Archaeology is careful digging, and to excavate a site takes a summer and a hundred forms.","考古,是小心地挖;发掘一处遗址,要一个夏天,和一百张表格。"],["The pottery they found was engraved with a line of birds, and the bowl was decorated inside as well.","他们找到的陶器上,刻着一行鸟;碗里面,也画了花。"]]},{"t":"What People Believe","s":[["Religion answers the questions that nothing else answers, and ritual is how the answer is repeated every year.","宗教回答的,是别的东西回答不了的问题;仪式,就是每年把那个回答再说一遍。"],["Etiquette is the small rules of a belief, and it matters more at the table than in the church.","礼节,是信仰里的小规矩;它在饭桌上,比在教堂里更要紧。"],["A belief is what you hold when the evidence stops, and the soul is the part of you that a belief says will not stop.","信念,是证据用完之后你还握着的那个东西;而灵魂,是信仰说不会结束的那一部分。"],["The spirit of a place is not its ghost; it is the mood the street puts you in.","一个地方的精神,不是它的鬼;是那条街给你的那点心情。"],["A sacred stone, a hallowed ground and a holy day all mean set apart, and the three words come from the same idea.","神圣的石头、受崇敬的地方、圣洁的日子,说的都是\"被单独划出来\";三个词,出自同一个念头。"],["The Pope is in Rome, a bishop runs a diocese, and a missionary is sent where nobody asked him to come.","教皇在罗马;主教管一个教区;而传教士,是被派到没人请他去的地方去的。"],["A priest says the service, the Bible is read from the front, and the church is cold in winter.","神父主持礼拜;圣经在前面念;教堂里,冬天很冷。"],["The cathedral took two hundred years, and the choir has been singing in it since 1503.","这座大教堂修了两百年;唱诗班从一五〇三年起,就在里面唱。"],["A monk keeps the hours, a temple keeps the incense, and a pagoda keeps nothing but the view.","修士守的是时辰;庙里守的是香火;而塔上什么也不守,只有一片风景。"]]},{"t":"Crowns and Titles","s":[["An empire is what one country calls another country after it takes it.","帝国,是一个国家把另一个国家拿下之后,对它的叫法。"],["The imperial palace is open to the public now, and the royal family lives in a smaller house.","皇宫如今对公众开放;王室,住在一处小些的房子里。"],["A dynasty lasts while the money lasts, and the chronology of the last one fills a whole shelf.","王朝能撑多久,看钱能撑多久;上一个王朝的年表,占了整整一格书架。"],["The emperor had the last word, the king had the army, and the queen had neither and kept the throne anyway.","皇帝说了算;国王手里有军队;女王两样都没有,王位却还是坐住了。"],["A prince is taught to wait, and a princess is taught to smile while she waits.","王子从小学的是等;公主从小学的,是一边等一边笑。"],["Their majesties is what you call them, and majesty is also what a mountain has at sunset.","称呼他们,要用\"陛下\";而威严,也是日落时一座山身上有的那种东西。"],["The nobility had the land and the titles, and the lord at the top of the hill owned the road.","贵族有地,也有头衔;山顶上那位老爷,连那条路都是他的。"],["A knight had a horse and a code, and a guardian had only the job of standing between a child and the world.","骑士有马,也有一套规矩;而监护人只有一个差事,就是站在孩子和世界中间。"]]},{"t":"Feeling and Standing","s":[["Nostalgia is missing a time rather than a place, and being homesick is missing the place itself.","乡愁,想的是那段时间,不是那个地方;而想家,想的就是那个地方。"],["A celebrity is known by everybody and knows nobody, and status is what a village gives you for staying.","名人,人人认得他,他谁也不认得;而地位,是一个村子因为你留下来才给你的。"],["Her background was three generations of farmers, and her experience was the market on a Saturday.","她的背景,是三代农民;她的阅历,是星期六的那个集市。"],["One anecdote explains a whole decade better than a table can.","一段轶事,比一张表更能说明整整十年。"],["An accident is nobody to blame, and an incident is one that somebody will have to explain.","意外,是没人该负责的那种;事件,是有人得出来解释的那种。"],["The town thrived for forty years, and its prosperity was built on one road.","镇子兴旺了四十年;它的繁荣,就压在一条路上。"],["A setback is a bad year, adversity is ten of them, and the difference is what people remember.","挫折,是坏了的一年;逆境,是连着坏十年;差别就在于,人们记住的是哪一样。"]]}],"8":[{"t":"Marks on a Page","s":[["Language is what we say, and a symbol is anything that stands for something else.","语言,是我们说出口的话;而符号,是任何代表另一样东西的东西。"],["A sign on the door means the shop is shut, and a sign in the sky means rain.","门上的牌子,意思是店关了;天上的迹象,意思是快下雨了。"],["A gesture can say more than a sentence, and half of what we mean is in the han
