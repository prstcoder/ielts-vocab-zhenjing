on lasts three weeks and the last one lasts a day.","这期开庭三个星期,上一期只有一天。"],["A neighbour will mediate, and both sides will leave angrier than they came.","一个邻居来调停,两边走的时候比来时更生气。"],["His plea was guilty, and his plea to the court for mercy was longer.","他认罪,而他向法庭求情的那些话更长。"],["They will appeal in June, and the appeal will be heard in November.","他们六月上诉,而上诉要到十一月才审。"],["Two witnesses will contradict each other, and the truth is somewhere between them.","两个证人会互相矛盾,而真相在他们中间某处。"],["Nobody could persuade him, and the controversy outlived the case by ten years.","没人能说服他,而那场争论比案子多活了十年。"],["They whispered in the corridor, muttered in the lift and murmured all through the afternoon.","他们在走廊里低语,在电梯里嘀咕,整个下午都在小声议论。"],["The room went silent, and the one man who could not speak stayed mute for an hour.","屋里静下来,那个说不出话的人一个小时都没开口。"]]},{"t":"The Case","s":[["They will investigate for a month and find nothing that a witness did not already say.","他们查了一个月,查出的东西证人早就说过了。"],["You can justify almost anything afterwards, which is why the reason is asked for first.","事后几乎什么都能说成有理,所以才要先把理由讲清楚。"],["A reasonable doubt is enough, and a suitable excuse is not.","合理的怀疑就够了,而合适的借口不算。"],["The judge listens, the jury decides, and the trial takes four days.","法官听,陪审团定,审判持续四天。"],["They suspect the man at the gate, and suspicion is not evidence.","他们怀疑门口那个人,而怀疑不是证据。"],["The sentence was two years, and the sentence in the newspaper was one line.","判决是两年,而报纸上那句话只有一行。"],["They will arrest him on Friday and jail him on Monday, and the prison is forty miles away.","他们周五逮捕他,周一送监,监狱在四十英里外。"],["A child is confined to the house for a week, and the word is the same one used for a prisoner.","孩子被关在家里一个星期,而用的词和关犯人是一样的。"]]},{"t":"Watching and Restraining","s":[["One man will oversee the whole site and another will supervise the wiring.","一个人管整个工地,另一个人管布线。"],["They restrict the hours and restrain nobody, because a rule is cheaper than a guard.","他们限制营业时间,却不拦人,因为一条规定比一个保安便宜。"],["He will commit the crime in March and confess in April, and nobody is surprised.","他三月犯案,四月认罪,没人意外。"],["A sin is against a god and a crime is against a state, and a vice is against yourself.","罪是对神犯的,罪行是对国家犯的,而恶习是对自己犯的。"],["He tried to bribe the clerk with twenty pounds and was reported before he left the room.","他想用二十镑贿赂那个职员,还没出屋就被举报了。"],["They will rob the shop, steal the van, and be caught because the van was too small.","他们抢了店、偷了车,被抓是因为车太小。"],["A pirate copies the film, and a thief takes the disc; one is worse and neither is rare.","盗版的人复制电影,小偷拿走碟片;一个更糟,两个都不少见。"],["The murder was never solved, and the suicide beside it was never explained.","那桩谋杀一直没破,旁边的自杀也一直没解释。"]]},{"t":"Tricks","s":[["He will deceive the buyer and cheat at cards, and the fraud is the same trick twice.","他骗买家,也在牌上作弊,而诈骗是同一个把戏做两遍。"],["A liar needs a good memory, which is why the story changed by Thursday.","说谎的人要好记性,所以那个说法到周四就变了。"],["It was a trap and everybody could see it, and he walked in anyway.","那是个圈套,谁都看得出来,他还是走了进去。"],["The trick is to pretend you are not in a hurry, and it fools most people.","诀窍是装作你不着急,这一招能骗过大多数人。"],["There is a stigma to the word, and it outlives the sentence by twenty years.","这个词带着污名,而污名比刑期多活二十年。"],["He will confess on the second day and conform for the rest of his life.","他第二天就认了,之后一辈子循规蹈矩。"],["The two brothers were reconciled in 2011, and neither will say what changed.","两兄弟 2011 年和解了,谁都不肯说是哪一点变了。"],["Most people obey the rule and a few succumb to the fine, and the penalty is the same either way.","大多数人守规矩,少数人认罚交钱了事,而两种情况下处罚是一样的。"],["It was a fine, in both senses, and he paid it with a fine.","这是一笔罚款,也是一件挺好的事,他交得挺爽快。"]]},{"t":"What Is Yours","s":[["The mortgage runs for twenty five years and the ownership never feels real until the last payment.","按揭要还二十五年,而所有权要到最后一笔付完才觉得是真的。"],["Copyright lasts seventy years after the writer dies, which is longer than the paper lasts.","版权在作者去世后还有七十年,比纸的寿命长。"],["It is a privilege to be asked, and it is also unpaid work.","被请去做是种荣幸,也是白干。"],["The school is accredited by an office nobody has heard of.","这所学校由一个没人听说过的机构认证。"],["The clue was in the first paragraph, and it was not much of one.","线索在第一段,而且算不上什么线索。"],["Access to the file is restricted, so you need a reason and a name.","这份档案不是谁都能看,你得有理由,还得有个名字。"],["The letter was anonymous, and anonymous letters are false about half the time.","那封信是匿名的,而匿名信有一半是假的。"],["A genuine signature is worth more than a false stamp, and everybody in the room knew it.","真签名比假印章值钱,屋里每个人都知道。"]]},{"t":"Procedure and Asking","s":[["The procedure is four steps and the routine is the same four steps every Monday.","程序是四个步骤,而常规是每个周一都走这四个步骤。"],["The consequence of being late is a letter, and the consequence of ignoring the letter is a fine.","迟到的后果是一封信,而不管那封信的后果是罚款。"],["They demand an answer and request a meeting, and they require both by Friday.","他们要求答复,请求会面,而且两件都要求周五前办完。"],["Three hundred people signed the petition, which is more than the office expected.","三百人在请愿书上签了名,比那个机关预想的多。"],["A command is an order from above, and to instruct somebody is to write the same order down politely.","命令是上面直接下来的话,而指示是把同样的话客气地写下来。"]]}],"18":[{"t":"The First Room","s":[["The first room is about violence, and the sign says so without any decoration.","第一个展厅讲的是暴力,牌子就这么写着,没有任何修饰。"],["A conflict begins with two people who will not move, and it ends when one of them does.","冲突从两个都不肯动的人开始,其中一个动了,它才结束。"],["A raid is short and a campaign is long, and both are planned by people who never go.","突袭很短,战役很长,两个都由不去的人策划。"],["There was a battle here in 1415, and the field is a car park now.","1415 年这里打过一场仗,那片地现在是停车场。"],["The struggle lasted nine years, and the museum gives it one wall.","那场斗争持续九年,博物馆给了它一面墙。"],["An explosion is loud for a second and quiet for fifty years.","爆炸响一秒钟,然后安静五十年。"],["The enormity of it is not in the noise, and that is what the room is trying to say.","这件事的可怕之处不在响声里,而这正是这个展厅想说的。"]]},{"t":"What Flew and What Fell","s":[["They bombarded the town for three days, and a bomb is the thing that does it.","他们炮轰那座城三天,炸弹就是干这件事的东西。"],["A blast breaks the windows two streets away, and a burst of it is what the witness remembers.","一次爆炸震碎两条街外的窗子,而目击者记住的是那一下爆开。"],["A spark set off the gunpowder, and the whole store went up at once.","一点火星引着了火药,整个仓库一次炸光。"],["A tank came down the road and a cannon came behind it, and both were slower than the men on foot.","坦克沿路开来,后面跟着一门大炮,两个都比走着的人慢。"],["A missile is fired from far away, and a rifle is fired from a hundred paces.","导弹从很远的地方发射,步枪从一百步外打。"],["A bullet will deflect off a stone and hit the man beside you, which is why nobody stands behind one.","子弹会打石头弹开,击中你旁边的人,所以没人站在石头后面。"],["A pistol fits in a pocket, a weapon is any of them, and the target is whoever is in front.","手枪能装口袋,武器是这全部的统称,而目标是站在前面的那个人。"],["The flame of a match will flare up twice and then glow, and the glitter in the glass is only a reflection, and the twinkle of it is only the light.","火柴的火苗先旺两下,然后变成暗红;玻璃里那点闪光只是反光。"]]},{"t":"Blades and Armour","s":[["A blade, a sword and an ax are all edge, and the difference is how you hold them.","刀刃、剑、斧,都是刃,区别在你怎么握着它。"],["A hammer was a tool before it was a weapon, and an arrow was a hunting thing first.","锤子先是工具,后来才是武器;箭先是打猎的东西。"],["A spear is older than the wheel and simpler than either.","矛比轮子老,也比两个都简单。"],["The helmet is dented on the left, and the shield beside it has a hole you could put a thumb through.","头盔左边凹了一块,旁边的盾上有个洞,大拇指能伸过去。"],["Every army is equipped by somebody, prepared in a month and provided for by people who never see it.","每支军队都有人给装备,一个月内准备妥当,由从没见过它的人供养。"],["They will deploy on the ridge at dawn, and the map on the wall shows the ridge.","他们天亮时部署在山脊上,墙上的地图就画着那道山脊。"],["You hit with the flat, beat with the handle, strike with the edge and punch with the fist.","用平面打,用柄敲,用刃劈,用拳头揍。"],["A chop is a blow downwards, a stab is one forwards, and a mission is the reason for both.","砍是往下,刺是往前,而任务就是这两下的理由。"]]},{"t":"The Hard Choice","s":[["The dilemma is that both roads are wrong, and the plight of the people on them is worse.","两难在于两条路都错,而路上那些人的处境更糟。"],["There is a pitfall in every plan, and the one nobody saw is the one that matters.","每个计划都有个坑,而没人看见的那个才要紧。"],["A conspiracy needs three people and one of them will talk.","阴谋要三个人,而其中一个一定会说出去。"],["The refugees arrived destitute, with nothing but what they could carry.","难民到时一无所有,只有身上拿得动的那点东西。"],["A famine is not one bad harvest, it is three.","饥荒不是一次歉收,是三次。"],["The village was starved out in the second winter, and the word is exact.","村子在第二个冬天被饿垮了,这个词用得很准。"],["They were deprived of water for four days, and a man will trade anything for a cup.","他们断了四天水,而一个人会为一杯水换掉任何东西。"],["One side will seize the bridge, and the other will pursue them to the river.","一边会夺取那座桥,另一边会把他们追到河边。"],["A threat does not have to be carried out to work, and that is the whole point of it.","威胁不必真的实施就有效,这正是它的用处。"],["He did not mean to offend anyone, and he offended the whole room.","他没想冒犯谁,结果冒犯了满屋子人。"]]},{"t":"Crossing the Line","s":[["An aggressive move is one you make before the other side is ready, and it works once.","侵略性的一步是在对方没准备好的时候走的,而且只灵一次。"],["They invaded in June and were gone by December, and nobody has forgotten either date.","他们六月入侵,十二月就撤了,两个日子都没人忘。"],["To trespass is to walk on it without permission, and to intrude is to walk in.","非法侵入是没经允许就走上那块地,而闯入是走进屋里。"],["The treaty was violated twice before anybody wrote it down.","条约在被记录之前就被违反过两次。"],["An attack can be a word, an assault is always a hand, and a challenge is a question.","攻击可以是一句话,袭击一定是动手,而挑战是一个问题。"],["The siege lasted four months, and the city was surrounded by the third week.","围城持续四个月,到第三周城就被围住了。"],["They enclosed the field with a wall, and the wall is still there.","他们用墙把那块地围了起来,墙如今还在。"]]},{"t":"Stopping It","s":[["A pause lasts a minute and a halt lasts a day, and a cease lasts until somebody breaks it.","暂停一分钟,停顿一天,而停止一直持续到有人打破它。"],["They will oppose the plan in public and support it in the corridor.","他们公开反对这个计划,在走廊里却支持。"],["A regime that oppresses its own people is doing the work of its enemies.","压迫自己人的政权,干的是敌人的活。"],["He countered with an argument nobody understood, and it worked.","他用一个谁也没听懂的论点反驳,居然管用。"],["A wall will deter a thief and a sign will not.","一堵墙能吓阻小偷,一块牌子不能。"],["The rules forbid it, the law prohibits it, and people do it on Sundays.","规定禁止它,法律禁止它,而人们周日照做。"],["A fence prevents nothing and a guard prevents a little, and both are cheaper than a wall.","一道篱笆什么也拦不住,一个守卫能拦一点,两个都比墙便宜。"]]},{"t":"Turning","s":[["A revolt begins in a market and ends in a palace, and the market always remembers it longer.","叛乱从集市开始,在宫殿结束,而集市记得更久。"],["He will betray the plan to the other side, and the treason is in the word he used.","他把计划出卖给了另一边,而叛国罪就藏在他用的那个词里。"],["A rebel is a patriot from the other side of the line, and both words are on the same wall.","造反的人,是界线另一边的爱国者,而两个词挂在同一面墙上。"],["A traitor is what the winners call him, and a patriot is what the losers call him.","赢的人叫他叛徒,输的人叫他爱国者。"],["Nobody blamed the officer and everybody reproached the clerk, which is how it usually goes.","没人责怪军官,人人都责备那个职员,事情通常是这样的。"],["There is evidence of a meeting and proof of nothing, and the two are not the same word.","有开过会的证据,却什么也证明不了,这两个不是一回事。"]]},{"t":"Fear","s":[["Terror is a night, and a terror is a thing you cannot name.","恐惧是一个夜晚,而可怕的东西是你叫不出名字的那样。"],["The film was terrible in the old sense and terrific in the new one, and it was also horrible.","那部电影是旧义上的\"可怕\",也是新义上的\"极好\",同时还\"很糟\"。"],["The alarm went at three, and everybody stood in the street in a coat.","警报三点响,大家都披着外套站在街上。"],["She dreaded the letter and read it anyway, because not knowing is worse.","她怕那封信,还是读了,因为不知道更糟。"],["The noise will frighten a horse and not a man, and the man is the one who runs.","这声音会吓到马,不会吓到人,而跑的是人。"],["The tension in the room was worse than the argument, and it lasted longer.","屋里的紧张比争吵本身更难受,也持续得更久。"],["It was a turbulent year and a time of turmoil, and the two words describe the same weather.","那是动荡的一年、混乱的一段,两个词说的是同一种天气。"],["The scenario they planned for was not the one that happened, which is normal.","他们设想过的情况不是实际发生的那个,这是常事。"],["It was an occasion for a speech, and nobody could think of one.","那是个适合讲话的场合,而谁也想不出讲什么。"],["There is a limit to what a person will carry, and a boundary beyond which nobody follows.","一个人能扛的有上限,也有一条界线,过了就没人跟。"],["He kept a rein on his temper for two hours and then lost it in a minute.","他把脾气勒了两个小时,然后一分钟里全放了。"]]},{"t":"Rivals","s":[["Two shops will compete for the same street and both will blame the other for the rent.","两家店会为同一条街竞争,然后互相把房租怪到对方头上。"],["A contest has a winner, a dispute has a loser, and the second one lasts longer.","比赛有赢家,争执有输家,而后者拖得更久。"],["They contend that the road is theirs, and the map says otherwise.","他们主张这条路是他们的,而地图上不是这么画的。"],["A rival is the one you know, and a competitor is the one you do not.","对手是你认识的那个,而竞争者是你还不认识的那个。"],["An enemy is a rival you have stopped talking to.","敌人是已经不再说话的对手。"],["The strategy is four pages and the tactic is one sentence.","战略四页,战术一句话。"],["The manoeuvre worked twice and then everybody had seen it.","这个动作灵了两次,然后所有人都看过了。"],["The blueprint was drawn in 1962, and the building is still not finished.","蓝图 1962 年就画好了,而楼至今没盖完。"],["They warned him twice, compelled him once and obliged him in the end.","他们警告他两次,强迫他一次,最后逼得他不得不做。"],["Three hundred people came to protest, and the speech refuted nothing.","三百人来抗议,而那番讲话什么也没驳倒。"]]},{"t":"Force","s":[["Might is what you have and force is what you use, and neither lasts after the last soldier.","实力是你有的,武力是你用的,两个都撑不过最后一个兵。"],["They reinforced the wall in March and impaired the road in doing it.","他们三月加固了墙,顺手把路弄坏了。"],["Nothing can mitigate a bad decision except a better one.","除了一个更好的决定,没什么能减轻一个坏决定。"],["The only comfort was that it could not get worse, and it did.","唯一的安慰是不会更糟,结果更糟了。"]]},{"t":"What Happens","s":[["An event is on the calendar, and what happens is not.","事件是写在日程上的,而真正发生的事不是。"],["It does not matter who fired first, and it mattered to everybody for fifty years.","谁先开的枪并不要紧,而在五十年里对每个人都要紧。"],["The same thing will happen again, and it will occur in the same month.","同样的事还会发生,而且会在同一个月发生。"],["The attack was savage and the retreat was worse, and both were reckless.","进攻很凶,撤退更糟,两个都鲁莽。"],["A fierce fight lasts ten minutes and a foul one lasts in the memory.","激烈的打斗十分钟就完,而卑劣的那种会留在记忆里。"],["Evil is a word people use when they have stopped explaining, and the devil is the same word with a face.","邪恶是人们不再解释时才用的词,而魔鬼是同一个词加上一张脸。"]]},{"t":"After","s":[["The punishment was a year and the crime was an afternoon, and nobody thought it was fair.","惩罚是一年,罪是一个下午,没人觉得公平。"],["They will execute one man and hang nobody, and the square is a car park now.","他们处死一个人,没有绞死谁,而那片广场现在是个停车场。"],["A sacrifice is only a sacrifice if it was not necessary, and that is the argument.","只有本来不必的才叫牺牲,争论就在这里。"],["The casualty figures were released in 1998, and they were higher than the ones in 1918.","伤亡数字 1998 年才公布,比 1918 年公布的那个还高。"],["They buried him in the field and put a stone there in 1950.","他们把他葬在那片地里,1950 年又立了一块石头。"],["The funeral was on a Tuesday and the grave is still tended.","葬礼在周二,而墓至今有人照看。"],["The tomb is empty, and the story of what happened to him has three versions.","墓是空的,而关于他遭遇的说法有三个版本。"],["The prisoner said he had been in hell for two years, and nobody argued.","那个囚犯说他在里头待了两年地狱,没人反驳。"]]},{"t":"At Sea and in the Air","s":[["The maritime museum is in the old dock, and the naval one is next door.","海事博物馆在旧码头,海军那个在隔壁。"],["The fleet left in May and came back with half of it.","舰队五月出发,回来时只剩一半。"],["A troop of soldiers walked through the town at six, and nobody looked out of the window.","一队士兵六点穿过镇子,没人往窗外看。"],["The landing was at night and the beach was empty by morning.","登陆在夜里,到早上滩上已经没人。"],["A helicopter will hover over the field for an hour and then leave.","直升机会在田上盘旋一个小时,然后走。"],["They will proceed along the coast and make little progress in the first week.","他们会沿着海岸推进,第一周几乎没什么进展。"],["Military spending is a third of the budget, and the nuclear programme is most of that.","军费占预算三分之一,而核计划占了其中大部分。"]]},{"t":"The Cost","s":[["The water was poisoned for a hundred years, and the field still grows nothing.","水被毒了一百年,那块田至今什么都不长。"],["The storm will devastate the coast and nobody will rebuild it twice.","风暴会毁掉海岸,而没人会重建第二次。"],["The risk was worth it to them and not to the men underneath.","这个风险对他们值得,对底下那些人不是。"],["It was an adventure for the first week and a peril after that.","第一周是冒险,之后就是险境。"],["A catastrophe is a disaster with paperwork, and the paperwork takes ten years.","大灾难是带公文手续的灾难,而手续要办十年。"],["The roof will collapse under snow, and the wall beside it will not fall.","屋顶会在雪下塌掉,旁边的墙不会倒。"],["They tortured him for two days to humiliate him, and got nothing, and the shame outlasted the bruises.","他们拷问他两天,为的是让他丢脸,结果什么也没得到,而羞辱比伤留得久。"],["The damage was to the windows, and the noise was more harmful than the glass.","损坏在窗上,而噪音比玻璃更伤人。"],["The report did not mislead anybody who read the second page.","读过第二页的人,都不会被这份报告误导。"],["Do not disturb the meeting and do not interfere with the vote.","别打扰会议,也别干预投票。"],["A dog will interrupt a conversation and a phone will end one.","狗会打断谈话,而一通电话会结束它。"]]},{"t":"Backwards","s":[["They began to shrink the line in March and to withdraw in June.","他们三月开始收缩战线,六月开始撤。"],["The wall was built to withstand a flood, and it withstood one in 1998.","那道墙是照着抗洪修的,1998 年它扛住了一次。"],["A compromise is what you call it when you have given away half.","妥协是你让掉一半之后给这件事起的名字。"],["They surrendered at four in the afternoon, and the town was quiet by five.","他们下午四点投降,到五点镇上就安静了。"],["Two men escaped over the wall, and the third could not avoid the dogs.","两个人翻墙逃了,第三个躲不过那些狗。"],["He quit in June, abandoned the house in July and forgot it by August.","他六月不干了,七月弃了那栋房子,到八月就忘了。"],["She will forgo the fee, discard the plan and be rid of the whole thing by Friday.","她不要那笔钱,扔掉那个计划,到周五就把整件事甩干净。"]]},{"t":"Holding","s":[["They defended the bridge for six days and then blew it up themselves.","他们守了那座桥六天,然后自己把它炸了。"],["A rule is there to safeguard the weakest, and it does not always.","规则是为了保护最弱的人,而它并不总做到。"],["The first attack was defeated and the second was not resisted at all.","第一次进攻被打退,第二次根本没被抵抗。"],["One side will capture the hill in the morning and lose it before dark.","一方早上夺下山头,天黑前又丢了。"],["The victory took four hours, and the triumph took a week of parades.","胜利用了四个钟头,而凯旋用了一个星期的游行。"],["You can conquer a city in a month and never conquer the people in it.","一座城一个月能征服,里面的人永远征服不了。"],["There is a monument at the corner and a tablet with forty names on it.","街角有一座纪念碑,碑上刻着四十个名字。"],["There is a statue of him in the square, and a medal in a drawer at home.","广场上有他的雕像,家里抽屉里有一枚勋章。"],["The honour was the parade, and the week was glorious, and by the next one nobody mentioned it.","荣誉是那场游行,那个星期也确实光辉,到再下一个星期就没人提了。"]]},{"t":"Given and Owed","s":[["Everybody contributed something, and two families gave more than the rest.","每个人都出了点东西,有两家比别人多。"],["She devoted thirty years to the archive and never asked for a room with a window.","她把三十年投在档案上,从没要过一间有窗的屋子。"],["The town owes him nothing and remembers him anyway.","镇子不欠他什么,却还是记得他。"],["A patrol goes out at six and a guard stays at the gate all night.","巡逻队六点出去,守卫在门口站一整夜。"],["The netting was camouflage for the gun, and everybody could see the gun.","那张网是给炮做伪装的,而所有人都看得见那门炮。"],["The obstacle was not the river, it was the paperwork for the bridge.","障碍不是那条河,而是修桥要办的手续。"],["A rabbit will burrow under the wire and be gone by morning.","兔子会在铁丝底下打洞,到早上就没影了。"],["A spy sends one message a month, and a scout goes out and comes back.","间谍一个月发一次消息,而侦察兵出去再回来。"],["The general arrived in June and left the soldier to explain it.","将军六月到了,又走了,留下士兵来解释。"],["The veteran comes on Sundays and tells the same story to whoever is standing there.","那位老兵每周日来,把同一个故事讲给站在那儿的人听。"]]}],"19":[{"t":"The First and the Last","s":[["A pioneer is the one who goes first and the one who pays for it.","拓荒者是先走的那一个,也是为这个先付代价的那一个。"],["A prophet is never believed at home, and a herald is only believed after the fact.","先知在家乡没人信,而传令官只有在事情发生之后才被相信。"],["The heir gets the house and the successor gets the job, and the second one has to work.","继承人拿到房子,接班人拿到位子,而后者得干活。"],["Three generations have lived in this house, and the surname on the door has not changed.","这栋房子住过三代人,而门上的姓一直没变。"]]},{"t":"Men and Women","s":[["Gender is what the form asks and sex is what the doctor wrote, and the two are not always the same.","性别是表格上问的那一栏,也是医生写下的那一栏,两个并不总是一致。"],["A female fox is a vixen and a female of our own kind is simply a woman.","母狐有专门的叫法,而我们自己这一类的雌性,就叫女人。"],["A couple can be two people or one married pair, and the word does not decide which.","一对可以是两个人,也可以是一对夫妻,这个词不负责区分。"],["A spouse is the person you file taxes with, and a husband is the one who fixes the tap.","配偶是跟你一起报税的那个人,丈夫是修水龙头的那个人。"],["Her grandfather came in 1948, and her father-in-law came in 1970, and neither ever went back.","她祖父 1948 年来,她公公 1970 年来,两个都没回去过。"],["The word gay means cheerful in the old books and something else in the new ones.","这个词在旧书里是\"快活\",在新书里是另一个意思。"]]},{"t":"The Family","s":[["A sibling is a brother or a sister, and a cousin is the same thing one house further out.","兄弟姐妹是同屋的,而堂表亲是再隔一层的。"],["A nephew is your sister son, a niece is your brother daughter, and both remember your name.","侄子是你姐妹的儿子,侄女是你兄弟的女儿,两个都记得你的名字。"],["The twins are not identical, and nobody has ever had trouble telling them apart.","这对双胞胎不像,从来没人分不出来。"],["An embryo becomes an infant in nine months, and the infant becomes a person in about thirty years.","胚胎九个月成婴儿,而婴儿长成一个人大约要三十年。"],["An orphan has no parents, and in the old records the word is used for a child with one.","孤儿是没有父母的孩子,而在旧档案里,只剩一个父母的孩子也这么叫。"],["A juvenile is a young person in the eyes of the law, and the law is not sure where it ends.","在法律眼里少年就是年纪小的人,而法律说不准这到几岁为止。"],["A youngster is louder than a youth, and a teenager is a number rather than a person.","小伙子比青年吵,而青少年按岁数算,不按人算。"],["A gang is a group with a name, and the name is usually the problem.","一伙人有个名号,而问题往往就在这个名号上。"],["Adolescence is the ten years when nothing is settled, and everybody remembers it.","青春期是那十年,什么都没定下来,而每个人都记得。"]]},{"t":"Relatives","s":[["Kin is the old word for who you are related to, and folk is the word for all of them together.","亲属是个老词,指跟你有关的人;而乡亲是把他们全算在一起的说法。"],["A relative is anyone you see at a funeral, and an intimate friend is one you would call at three.","亲戚是在葬礼上会见到的任何人,而密友是你凌晨三点会打电话的那个。"],["Dear is what you write at the top, and darling is what you say at the door.","亲爱的写在信头上,而宝贝是在门口说的。"],["A lover is not a beloved, and the difference is whether the other person knows.","情人不是被爱的人,区别在于对方知不知道。"],["Madam is a word for a customer you cannot see, and a hostess is the one who meets you at the door.","夫人是对看不见脸的客人的称呼,而女主人是在门口接你的那位。"],["The landlady owns the building, the mistress ran the household, and the housewife runs it now.","女房东有这栋楼,从前女主人当家,如今是家庭主妇当家。"],["The widow has lived alone since 1998 and knows every dog in the street by name.","那位寡妇从 1998 年就一个人住,街上每条狗的名字她都知道。"]]},{"t":"Servants and Guests","s":[["A maid cleaned the rooms and a maiden in the old stories never did any cleaning at all.","女仆打扫房间,而旧故事里的少女从来不打扫。"],["The household is four people and eleven chores, and the chores win.","这一家四口人、十一件家务,而家务赢了。"],["The host stands at the door, the landlord stands at the bank, and the tenant stands in the hall with a box.","主人在门口,房东在银行,房客抱个箱子站在门厅。"],["A guest is invited, a customer pays once, and a client comes back.","客人是被请来的,顾客付一次钱,而委托人会再来。"]]},{"t":"Meeting and Marrying","s":[["They met by encounter on a train and by appointment in a bank, and only one of those became a marriage.","他们在火车上偶遇,在银行里约见,只有一次变成了婚姻。"],["He chased her for a year and then missed the wedding because of a train.","他追了她一年,然后因为一趟火车错过了婚礼。"],["She was accompanied by her sister, which is how it was done then.","她由姐姐陪着来,那时候就是这么办的。"],["A dependent is somebody the household pays for, and the word is older than the benefit.","受赡养的人是由这个家养着的,这个词比那笔补贴老。"],["He proposed in June, the engagement lasted a year, and the wedding was in a field.","他六月求婚,订婚持续一年,婚礼在一片田里办的。"],["They went to the coast for the honeymoon and came back with a dog.","他们去海边度的蜜月,回来带了一条狗。"],["A kiss at the station is not the same as a kiss at the door, and everybody knows which is which.","站台上的吻和门口的吻不一样,谁都分得清。"],["They separated in 2004 and divorced in 2007, and the house was sold in between.","他们 2004 年分居,2007 年离婚,房子是中间卖掉的。"]]},{"t":"Ones and All","s":[["A single ticket, a single bed and a single person all use the word in different ways.","单程票、单人床、单身的人,这个词用法各不相同。"],["The sole survivor is the only one, and the sole of a shoe is something else again.","唯一的生还者是那一个,而鞋底又是另一回事。"],["They went their respective ways, and each of them pretended not to look back.","他们各走各的路,而每个人都装作没回头。"],["An individual is one person, and the word is used when the number is being made.","个人就是一个人,而这个说法常用在要把人当数字的时候。"],["A commuter spends two hours a day going nowhere in particular.","通勤者每天花两个钟头,去一个没什么特别的地方。"],["The neighbourhood is nine streets and one shop, and everybody knows the shop.","街区是九条街加一家店,那家店人人都知道。"],["A member pays, an acquaintance nods, and a stranger asks the way.","会员交钱,熟人点头,陌生人问路。"]]},{"t":"At Work","s":[["The boss decides, the manager explains, and the supervisor is the one who is actually there.","老板决定,经理解释,而主管才是真在场的那个人。"],["A subordinate takes the blame and a partner takes half the money, and both call it teamwork.","下属担责,合伙人分一半钱,两个都管这叫团队合作。"],["A colleague shares the office, a comrade shares the cause, and an acquaintance shares nothing.","同事共用办公室,同志共一个事业,而熟人什么都不共。"],["Friendship takes a year and affection takes longer, and both can end in an afternoon.","友谊要一年,感情要更久,而两个都能在一个下午结束。"],["An apprentice is paid nothing and learns everything, which is the deal.","学徒不给钱,学一切,交易就是这样。"],["A deputy does the job when the other one is away, and is never thanked for it.","副手在正职不在时干活,而且从来不被感谢。"]]},{"t":"Titles","s":[["A hero gets a statue and a heroine gets a plaque, and the actress gets a photograph on the wall.","男主角有雕像,女主角有一块牌子,而女演员在墙上有一张照片。"],["The chancellor runs the university, the commander runs the army, and the director runs the film.","校长管大学,司令管军队,导演管电影。"],["A proponent argues for it, a committee decides it, and a council pays for it.","支持者为它辩护,委员会决定它,而理事会出钱。"],["A delegate speaks for the group and is not allowed to say anything else.","代表替一群人说话,别的话不许说。"],["A specialist knows one thing well, a consultant is paid to say it, and a counsellor is paid to listen.","专家把一件事弄透,顾问被付钱说它,而辅导员被付钱听。"],["The veterinary practice is next to the solicitor, and the attorney across the road handles the other kind of case.","兽医诊所在事务律师隔壁,马路对面的辩护律师管另一种案子。"],["The umpire decides, the cashier counts, and the fireman is the only one running towards it.","裁判决定,出纳数钱,而消防员是唯一往那边跑的人。"],["The nurse works nights, the gardener comes on Thursdays, and the barber gives the same haircut to everybody.","护士上夜班,园丁周四来,理发师给每个人剪同一个发型。"],["The fisherman is out at four, the butcher opens at six, and the groom is the only one in a suit.","渔夫四点出海,屠夫六点开门,而新郎是唯一穿西装的。"]]},{"t":"The Bottom","s":[["The hostage was kept for nine days and released without a word.","人质被扣了九天,一句话没说就放了。"],["Years of toil in the same field will break a man quietly.","在同一块地里苦干多年,会把人悄悄磨垮。"],["A beggar asks and a slave is not asked, and the second one is the older arrangement.","乞丐是求人,奴隶是没得求,而后者是更老的安排。"],["A coward runs and lives, and the word was written by the ones who stayed.","懦夫跑了,活了下来,而这个词是留下的人写的。"]]}],"20":[{"t":"The First Day","s":[["On his first day at the office, Tom had no idea how to act.","上班第一天,汤姆完全不知道该怎么做。"],["He watched the others and tried to behave in the same quiet way.","他观察别人,学着用同样安静的方式举止做事。"],["A small deed often stays in the mind longer than a big speech.","一件小小的好事,往往比一场大演讲在脑子里留得更久。"],["It takes about a month to accustom yourself to a new workplace.","大概要一个月,才能让自己习惯一个新的工作地方。"],["When the printer stopped, everyone waited to see how he would react.","打印机一停,所有人都等着看他有什么反应。"],["His boss asked a question, and he responded in two short sentences.","上司问了一个问题,他用两句话就回应了。"],["That night, on the bus home, he began to reflect on the whole day.","那天晚上在回家的公交车上,他开始回想这一整天。"]]},{"t":"Looking at Things","s":[["In the museum, a guard will glare at anyone who leans too close to a painting.","在博物馆里,谁靠画太近,保安就会瞪他。"],["I only caught a glimpse of the famous picture before the crowd pushed me on.","人潮把我往前推,那幅名画我只瞥见一眼。"],["A quick glance told me the room was empty, so I went in.","随手扫了一眼,我就知道房间是空的,于是走了进去。"],["The child tried to peep through the keyhole of the old door.","小孩想从旧门的钥匙孔往里偷看。"],["Her mother stood at the window and gazed at the snow for a long time.","她妈妈站在窗边,久久凝视着雪。"],["My father peered at the map because the light in the car was poor.","车里光线不好,我爸凑近了去看地图。"],["People say it is rude to stare, but on a train everyone stares at strangers.","人们说盯着人看不礼貌,可火车上谁都会盯着陌生人看。"],["He sat down to contemplate the offer and said nothing for ten minutes.","他坐下来考虑这份工作,十分钟一句话都没说。"]]},{"t":"The Garden Behind the House","s":[["We adopted a thin grey cat from the street last winter.","去年冬天,我们从街上收养了一只瘦瘦的灰猫。"],["My grandfather mows the small lawn behind the house every Sunday.","每个星期天,爷爷都会修剪屋后那块小草坪。"],["The old fence needs one more post to support it.","旧篱笆还得再加一根柱子才撑得住。"],["He waters the roses, and a little water can revive a plant that looks dead.","他给玫瑰浇水,一点点水就能让看着枯了的植物活过来。"],["Good soil will nourish them better than any powder from a box.","好土比盒子里的任何肥粉都更能滋养它们。"],["After he pulls the weeds, he stands still and exhales slowly.","拔完草,他会站一会儿,慢慢把气呼出来。"],["Few plants survive a cold night without some kind of cover.","没有点遮盖,很少有植物能熬过寒冷的夜。"],["His doctor also told him to watch his intake of salt.","医生还让他注意盐的摄入量。"]]},{"t":"A Promise and a Signature","s":[["Before the wedding, the couple made a vow in front of both families.","婚礼前,两个人在两家人面前立下誓言。"],["An oath is the same thing, only it is spoken in a court or before a judge.","宣誓也是同一件事,只不过要在法庭上或法官面前说。"],["They also gave a pledge to look after each other in the bad years.","他们还做出保证,说日子难过的年份也要互相照看。"],["The referee blew his whistle, and the game began.","裁判吹响哨子,比赛开始了。"],["I sent a message at nine and got no reply until noon.","我九点发了消息,一直到中午都没有回复。"],["Please notify the office if you change your address.","地址变了请通知办公室。"],["He likes to assert that he was right, even when the numbers disagree.","他总爱断言自己是对的,哪怕数字摆着不同意。"],["She explained the rule twice, and after that nobody asked again.","这条规矩她解释了两遍,之后就没人再问了。"]]},{"t":"A Hot Kitchen","s":[["That evening my parents had a quarrel about the gas bill.","那天晚上,我爸妈为了燃气费吵了一架。"],["They never dispute each other in front of guests, so this one waited until eight.","有客人在时他们从不争执,所以这一架一直等到八点。"],["An argument always starts with something small, and this time it was a window.","争论总是从一件小事开始,这次是那扇窗。"],["My mother mentioned the broken glass for the third time that week.","我妈一周里第三次提到那块碎玻璃。"],["My father was in a hurry to cook, so he tried to hasten the fire with more oil.","我爸急着做饭,想多倒点油让火快起来。"],["I urged him to slow down, but he never listens when he is busy.","我劝他慢一点,可他忙起来谁的话都不听。"],["Then he scolded the cat, and the cat did not care at all.","然后他骂了猫,猫一点都不在乎。"],["He cursed under his breath, and later I heard him swear at the pan.","他压着嗓子诅咒了一句,后来我又听见他对着那口锅骂脏话。"]]},{"t":"The Uncle at Dinner","s":[["My uncle likes to provoke people at dinner and then call it a joke.","我叔叔吃饭时总爱挑人上火,然后说这只是玩笑。"],["He will preach about healthy food while eating his third piece of cake.","他一边大谈健康饮食,一边吃第三块蛋糕。"],["He also boasts about an old car that has not moved for two years.","他还夸耀一辆两年没动过的旧车。"],["His brothers tease him about it, and he pretends not to hear a word.","兄弟们拿这事打趣他,他假装一个字都没听见。"],["When they mock his singing, he simply sings louder.","他们嘲笑他唱歌,他就唱得更大声。"],["The young ones laugh, and the old ones look at the clock.","小辈在笑,长辈在看钟。"],["Nobody asks him to leave, because he is family and the food is good.","没人赶他走,因为他是一家人,而且菜确实好吃。"]]},{"t":"In the Concert Hall","s":[["The hall was silent until the last note, and then everyone began to clap.","大厅一直很安静,直到最后一个音落下,大家才开始鼓掌。"],["Some people stood up to applaud, and the singer bowed twice.","有人站起来鼓掌,歌手鞠了两次躬。"],["My sister was so happy that she hugged the stranger beside her.","我妹妹高兴得抱住了旁边的陌生人。"],["The old man in front of us had to kneel down to look for his glasses.","我们前面那位老人只好跪下来找眼镜。"],["He did not touch them for a minute, as if they might break.","他拿起眼镜时一分钟都没敢碰,好像一碰就会碎。"],["A woman behind us laughed and said it happened to her every week.","后面一位女士笑着说,她每个星期都要来一次。"]]},{"t":"The Morning Market","s":[["The market at seven in the morning is never a quiet place.","早上七点的市场从来不是安静的地方。"],["A boy ran after the bus and just managed to catch the door.","一个男孩追着公交跑,好不容易才抓住车门。"],["Someone snatched the last bag of oranges before I could reach it.","我还没伸手,最后一袋橙子就被人抢走了。"],["I grabbed a smaller bag and held it against my chest.","我抓了一小袋,紧紧抱在胸前。"],["The old woman could not grasp the coin with her cold fingers.","那位老太太手指冻得僵,硬币怎么也抓不住。"],["A man on a bike tried to overtake the crowd and almost hit a cart.","一个骑车的人想从人群里超过去,差点撞上一辆推车。"],["My little brother followed me between the tables and said nothing.","我弟弟在摊位之间跟着我,一句话也不说。"],["I kept a firm grip on his hand so that we would not be pulled apart.","我紧紧握住他的手,免得被人群冲散。"]]},{"t":"After the Party","s":[["After the party the kitchen was a real mess.","聚会结束以后,厨房乱得一塌糊涂。"],["I had to wipe every table twice before the sticky marks came off.","每张桌子我都得擦两遍,黏手印才下去。"],["Someone had burned a pan, and I scraped it for ten minutes.","有人把锅烧糊了,我刮了十分钟。"],["Then I polished the glass until I could see my face in it.","然后我把玻璃擦得能照出自己的脸。"],["A knife had scratched the new wood, and that mark will stay.","有把刀在新木头上刮了一道,这道痕怕是要留下了。"],["Two plates had fallen, and one of them was smashed on the floor.","两个盘子掉了,其中一个在地上摔碎了。"],["The bin bag split, so the rubbish went all over the floor again.","垃圾袋裂了,垃圾又撒了一地。"]]},{"t":"A Good Knot","s":[["You twist the rope one way to make it hold better.","把绳子朝一个方向拧,它才更吃得住。"],["Then you fold the end back and push it under the loop.","然后把绳头折回来,从圈底下塞过去。"],["Fasten it to the post with two tight knots.","用两个紧结把它拴在柱子上。"],["If the wind pulls hard, loosen the top knot first.","要是风太大,先松开上面那个结。"],["My grandmother does this with string every winter, and her parcels never open.","每年冬天我奶奶都用细绳这么绑,她寄的包裹从来没散过。"],["She says a good knot should be easy to undo and hard to shake off.","她说好结子该是解起来容易,晃起来不掉。"],["When the paper bag broke, the beans scattered across the whole floor.","纸袋破了,豆子撒了满满一地。"]]},{"t":"The Train at Six","s":[["The train began to sway as it came out of the tunnel.","火车出隧道的时候,车厢开始左右摇晃。"],["The old windows shake whenever another train goes past.","每次有列车开过,旧车窗就跟着抖。"],["My cup vibrated on the little table and then fell over.","我的杯子在小桌上颤动,然后就倒了。"],["Outside, the fields seemed to whirl past the glass.","窗外,田野像是绕着玻璃打转。"],["In the city, the wheels rotate more slowly as the train climbs.","进了城,列车爬坡,轮子转得慢下来。"],["The queue at the door began to shuffle forward with all its bags.","门口的队伍提着大包小包,一点一点往前挪。"],["Two men collided at the corner and both said sorry.","两个人在拐角撞在一起,都说了声对不起。"],["When the doors closed, my arm was still in contact with the frame.","门关上时,我的胳膊还贴着门框。"]]},{"t":"Fixing the Lamp","s":[["First connect the two wires at the back of the lamp.","先把灯后面的两根线接上。"],["Then combine the white one with the blue one so the switch works.","再把白线和蓝线合在一起,开关才有反应。"],["It takes a while to integrate the new part into the old frame.","要把新零件装进旧灯架,得花点时间。"],["Push the plug in until the pins penetrate the socket.","把插头往里推,让插脚插进插座。"],["Be careful not to pierce the thin plastic cover with the screw.","当心别用螺丝把薄薄的塑料壳扎穿。"],["Insert the bulb at the end and turn it once.","最后把灯泡插进去,转一下。"],["My father did all this on Sunday with a torch in his mouth.","星期天这些活都是我爸干的,嘴里还叼着个手电。"],["When the light came on, he looked happier than a child.","灯亮起来的时候,他高兴得像个孩子。"]]},{"t":"Out of the Mud","s":[["A small truck had to tow the car out of the mud.","得靠一辆小卡车把那辆车从泥里拖出来。"],["The driver tilted the mirror to see what was behind him.","司机把后视镜掰斜一点,好看清后面。"],["A line of dark water trailed behind the boat all morning.","一整个上午,船后面都拖着一条黑水痕。"],["He arranged the chairs in two rows before the meeting.","开会前他把椅子摆成两排。"],["She can manipulate the small parts with one hand and still talk to you.","她能一只手摆弄那些小零件,一边还跟你说话。"],["You steer with your left hand and hold the map with your right.","左手把方向,右手拿地图。"],["The baby was baptised in the old church by the river.","孩子在河边那座老教堂受了洗礼。"]]},{"t":"A Small Bet","s":[["My cousin likes to bet on horses, but only with small amounts.","我表哥喜欢赌马,不过每次下注都很小。"],["Last Saturday he put a stake of ten pounds on a grey horse.","上周六他押了十镑在一匹灰马上。"],["He says he does not gamble, and then he goes back the next week.","他说自己不是赌博,然后下星期又去了。"],["Before every race he promises his wife that this will be the last time.","每场比赛之前,他都向妻子保证这是最后一次。"],["My aunt does not believe him, so she keeps the bank card.","我舅妈不信他,银行卡一直收在自己手里。"],["He watched the screen with both hands flat on the table.","他两只手平放在桌上,眼睛盯着屏幕。"],["The grey horse came last, and he laughed louder than the winners.","那匹灰马跑了最后一名,他笑得比赢的人还响。"]]},{"t":"The Shop with Blue Lights","s":[["The new shop on the corner attracts people with its blue lights.","拐角那家新店用蓝灯把人都吸引过去了。"],["A woman inside seems to mesmerise everyone who walks past the window.","店里的一个女人好像能把路过橱窗的人都看呆。"],["Children stop there as if the toys had become a marvel.","孩子们站在那里,好像那些玩具成了什么奇观。"],["One little boy was amazed by a train that ran around a glass hill.","一个小男孩看呆了,那列小火车绕着玻璃山跑。"],["His father was astonished at the price of it.","他爸爸则被价钱吓了一跳。"],["The owner is obsessed with small details and checks every shelf twice.","老板娘对细节着迷,每个货架都要查两遍。"],["She says the first week was a nightmare, because nothing worked.","她说第一周简直是噩梦,什么都出问题。"],["The job also involves lifting boxes until midnight.","这份活还得搬箱子搬到半夜。"],["It annoys the neighbours when the lights stay on all night.","灯整夜不关,邻居很烦。"],["One of them was so upset about the noise that she wrote a letter.","其中一位被吵得受不了,写了封信投诉。"],["The rules printed on the door bewilder most people, and few read them.","门上印的规矩让大部分人看不明白,也没几个人读。"]]},{"t":"The Report","s":[["The report was full of irony: it praised the plan and then listed its costs.","这份报告写得很讽刺:先夸这个计划,再把成本一条条列出来。"],["At fifty, he had to accept the indignity of a smaller office.","五十岁那年,他不得不接受被换到更小的办公室这种屈辱。"],["She looked at the old rules with contempt and threw them in the bin.","她轻蔑地看了看那套旧规矩,直接扔进了垃圾桶。"],["Years of neglect had left the school with broken windows and no heating.","多年无人过问,学校窗户破了,暖气也没有。"],["He chose to disregard the warning and went out into the storm.","他不理会警告,还是走进了暴风雨里。"],["Ignorance is not a crime, but it is often expensive.","无知不算罪,但往往很贵。"],["The judge had a clear bias against young drivers.","这位法官对年轻司机明显有偏见。"],["One page of the report deviates from the facts, and everyone noticed it.","报告里有一页偏离了事实,所有人都看出来了。"]]},{"t":"The Boy at the Back","s":[["For a month, three boys bullied the new student at the back of the class.","整整一个月,三个男生欺负班里后排那个新来的同学。"],["The teacher did not see it, and the boy told nobody at home.","老师没看见,那男孩回家也一个字没说。"],["One afternoon a small panic sent him running out of the room.","一天下午他慌了,跑出了教室。"],["He tried to flee down the stairs and sat in the car park until dark.","他一路逃下楼梯,在停车场坐到天黑。"],["That evening his father came to the school, and the three were expelled.","那天晚上他父亲来了学校,那三个人被开除了。"],["They said they wanted revenge, but nothing happened after that.","他们说想报复,可后来什么也没发生。"],["The sight of them had terrified him for weeks, and it took a long time to stop.","一看见他们他就害怕,这种怕持续了好几周才慢慢过去。"]]},{"t":"Three Short Reports","s":[["On the same page there were three short reports from the courts.","同一版上有三条短短的法庭消息。"],["One man was convicted of trying to smuggle gold through the airport.","一个人因为想从机场走私黄金被定了罪。"],["Another had helped to hijack a truck full of medicine two years before.","另一个两年前参与劫持了一辆装满药品的卡车。"],["A third was arrested for a plan to kidnap the son of a trader.","第三个因为策划绑架一个商人的儿子被抓。"],["In the war, the village suffered a massacre that no court has ever examined.","战争期间,那个村子遭了一场屠杀,至今没有法庭查过。"],["Historians say the decimation of the town took two generations to repair.","历史学家说,这座城被大批杀戮之后,过了两代人才缓过来。"],["The government refused to intervene, and the families were left alone.","政府拒绝介入,那些家庭只能自己扛。"],["Delay impeded the case for years, and some of the papers were lost.","案子被拖延了好多年,有些卷宗都丢了。"],["One guard was said to have strangled a prisoner, but nobody could prove it.","据说有个看守勒死过一名犯人,可谁也证明不了。"]]},{"t":"The Job Offer","s":[["The salary was the bait, and the free flat was the real allure.","薪水是饵,那套免费的房子才是真正的诱惑。"],["They tried to induce him to sign before he had read the whole contract.","他们想诱使他在读完整份合同之前就签字。"],["He was tempted by the title, even though the work was the same.","那个头衔让他动了心,尽管活还是那些活。"],["On the first day the company designated him head of the new team.","第一天公司就指定他做新团队的负责人。"],["They assigned two assistants to him, and both were younger than his son.","给他派了两个助手,两个都比他儿子小。"],["He had to distribute the work among eight people by Friday.","他得在周五之前把工作分给八个人。"],["On Monday morning he was despatched to a small office near the airport.","周一早上他被派到机场附近一间小办公室去了。"]]},{"t":"Read the Small Print","s":[["Detach the form from the letter before you send it back.","把表格从信上撕下来,再寄回去。"],["He tried to disguise his voice on the phone, but I knew him at once.","他在电话里想装成别人,可我一下就听出来了。"],["She could not conceal her surprise when she saw the price.","看到价钱的时候,她掩不住惊讶。"],["They agreed to exclude the last page from the final report.","他们同意把最后一页从终稿里去掉。"],["Two days later they had to reverse that decision.","两天之后,他们又不得不把那个决定反过来。"],["He assured me that the money had already been paid.","他向我保证钱已经付过了。"],["She agreed to undertake the work and finish it by the end of March.","她答应接下这份活,三月底之前做完。"],["The contract stipulates that nobody may leave the site before noon.","合同里规定,中午之前谁都不能离开工地。"],["It took an hour to convince my father that the old car was safe.","我花了一个小时才让我爸相信那辆旧车是安全的。"],["I called him again to reassure him, and at last he laughed.","我又打了电话让他安心,他终于笑了。"]]},{"t":"One Wish","s":[["My aunt has only one wish: to see the sea again before she turns eighty.","我姑姑只有一个愿望:八十岁之前再看一次海。"],["She never aspired to a big house or a new car.","她从没向往过大房子或者新车。"],["Her one desire is a room with a window that faces water.","她唯一的渴望是一间窗子朝水的房间。"],["She has yearned for it since she left the coast at nineteen.","十九岁离开海边以后,她一直渴着这个。"],["When the wind turns warm, she invokes the name of her old village.","风一暖起来,她就念起老村子的名字。"],["Her feet itch whenever she hears a ship whistle on the radio.","广播里一有轮船的汽笛声,她的脚就痒。"],["Twice she made an attempt to go, and twice the trains stopped her.","她试过两次要走,两次都被火车拦住了。"],["She goes on to strive for it in her own quiet way.","她仍用自己的方式慢慢努力着。"],["It took years of effort to save the money for one ticket.","为了一张票的钱,她攒了好几年。"],["She hopes to fulfil it this summer, when her son has a week off.","她盼着今年夏天能实现,那时儿子正好有一周假。"]]},{"t":"The Project","s":[["We spent Monday sorting the old files into three piles.","星期一我们都在把旧档案分成三堆。"],["By Friday the deadline began to loom over the whole team.","到了周五,截止日期像影子一样压在整组人头上。"],["They will launch the new site on the first of May.","新网站五月一号上线。"],["Work will commence at eight, and the doors open at nine.","八点开工,九点开门。"],["The company wants to exploit the cheap land beside the river.","公司想用河边那块便宜的地。"],["Two engineers went to explore the empty factory first.","两名工程师先去看那间空厂房。"],["They had to exert a lot of pressure to move the old machine.","他们费了很大劲才把那台旧机器推动。"],["It was hard to tackle the roof problem in the rain.","雨里处理屋顶的毛病实在难。"],["We could not cope with the water and called for help.","水我们实在应付不了,只好喊人来。"],["That week we had to dispose of forty kilos of old paper.","那个星期我们处理掉了四十公斤旧纸。"],["One manager conducted the whole thing from a phone in his car.","整件事由一个经理在车里打电话指挥。"]]},{"t":"Ten Minutes of Editing","s":[["Half of that paragraph can be omitted without any loss.","那一段砍掉一半也不损失什么。"],["Delete the second line, and the sentence reads much better.","删掉第二行,这句话就顺多了。"],["They had to cancel the trip because of the snow on the pass.","因为山口下雪,他们只好取消行程。"],["I tried to erase the old name from the form, but the ink had dried.","我想把表上的旧名字擦掉,可墨水早干了。"],["Nothing could restore the page after the file had gone.","文件没了之后,那页再也恢复不出来。"],["We should rectify the mistake before the customer writes again.","趁客户还没再写信来,我们该把错误改过来。"],["He worked two weekends to redeem the lost time.","他加了两个周末,想把耽误的时间补回来。"],["A later success offset the early loss, and nobody mentioned it again.","后来的一次成功抵掉了早先的损失,就没人再提那回事了。"],["We had to replenish the water bottles before we set off.","出发前得把水壶重新灌满。"]]},{"t":"The Flooded House","s":[["Two men were rescued from the roof of the flooded house.","两个人从被淹房子的屋顶上被救了下来。"],["As a last resort, the family called the fire station at two in the morning.","实在没别的办法,那家人凌晨两点打给了消防站。"],["It took the older man a week to recover from the cold water.","年纪大的那个泡了冷水,过了一个星期才缓过来。"],["Crews worked all night to restore the power to the street.","抢修队干了一整夜,才把这条街的电恢复。"],["Without a backup, the shop lost six years of records.","店里没有备份,六年的账目全没了。"],["The water had reached the second step by ten o'clock.","到十点,水已经漫到第二级台阶。"],["Their neighbour kept the children in her kitchen until morning.","邻居把孩子们留在自家厨房里,一直到天亮。"]]},{"t":"Under the Sink","s":[["For weeks a small leak under the sink went unnoticed.","水槽下面有个小漏水,好几个星期没人发现。"],["Then one morning the pipe broke and water spilled across the floor.","后来有一天早上管子裂了,水泼了一地。"],["It began to seep into the flat below and stain the ceiling.","水开始往楼下渗,把天花板洇出一片黄。"],["Thick brown water oozed out of the wall for two days.","浓稠的黄水从墙里往外渗,渗了两天。"],["The family had to evacuate the building at midnight.","那家人半夜里被疏散出了楼。"],["Workers dug a trench along the road to reach the old pipe.","工人沿着马路挖了一条沟,才够到旧管子。"],["By then the ground was saturated, and part of the road gave way.","那时地已经泡透了,路面塌了一块。"]]},{"t":"The New Branch","s":[["The shop had to obtain a new licence before it could sell medicine.","这家店得先拿到新的执照,才能卖药。"],["In the first year it gained about four hundred regular customers.","第一年它就多了四百来个常客。"],["A farm nearby supplies fresh eggs every morning at six.","附近一个农场每天早上六点供应新鲜鸡蛋。"],["The back hall was rendered useless by a leak in the roof.","屋顶漏水,后面那间厅就废了。"],["They plan to enlarge it and add six small tables.","他们打算把它扩一下,摆六张小桌子。"],["A second van would augment the morning round, but nobody wants to drive it.","再来一辆车能把早班送货补上,可没人愿意开。"],["So the plan waits, and the hall stays empty for now.","于是计划先搁着,那间厅眼下还空着。"]]},{"t":"The New Sign","s":[["First they magnified the drawing so that everyone could read the small letters.","他们先把图纸放大,让每个人都看得清那些小字。"],["Two speakers amplify the voice of the woman at the front.","两只音箱把前面那位女士的声音放大。"],["She tends to exaggerate, and a short delay becomes a disaster in her telling.","她说话爱夸张,一点小耽误到她嘴里就成了大祸。"],["Rain prolonged the work on the sign by three weeks.","下雨让招牌的活多拖了三个星期。"],["The family upholds one rule: nobody works on Sunday.","这家有个规矩一直守着:星期天谁都不干活。"],["A small motor propels the letters around the frame, which children love.","一个小马达推着字母在框里转,孩子们特别喜欢。"],["The website is updated every Monday with a new photo of the shop.","网站每个星期一更新,换一张店里的新照片。"],["In the end they had to raise the price of the sign, because the metal cost more.","最后招牌的价钱还是涨了,因为那块金属贵了。"]]},{"t":"The Letter Afterwards","s":[["Nothing can excuse what he said at the table that night.","那天晚上他在饭桌上说的那些话,怎么都找不来借口。"],["His mother will forgive him, because she always does.","他母亲会原谅他的,她一向如此。"],["He could not contain his anger when his brother laughed.","他哥一笑,他的火就压不住了。"],["People in the village regard him as a quiet, careful man.","村里人把他看成一个安静又仔细的人。"],["He does not flatter anyone, and for that some people dislike him.","他从不奉承谁,因此有些人不喜欢他。"],["His students worship him, though he teaches the dullest subject in school.","他的学生却崇拜他,尽管他教的是全校最闷的科目。"],["The letter he wrote the next day was two pages long.","第二天他写了一封信,整整两页。"],["It said the same thing four different ways, and none of them worked.","同一件事他说了四遍不同的说法,一句都没管用。"]]},{"t":"Why the River Rose","s":[["The cause of the flood was a blocked drain behind the school.","这场水灾的原因是学校后面那条下水道堵了。"],["For the sake of the children, the council closed the road.","为了孩子,居委会把那条路封了。"],["Our main objective this year is to finish the wall before June.","今年我们的主要目标是在六月前把墙砌好。"],["The smell of the wet earth aroused a memory of the last flood.","湿土的气味勾起了上一场水灾的记忆。"],["One broken pipe can trigger a whole chain of problems.","一根破管子就能引起一连串麻烦。"],["After that, people began to seek help from the council every week.","从那以后,人们开始每个星期去找居委会帮忙。"],["Divers went down to retrieve the boxes from the cellar.","潜水员下去,把地窖里的箱子取了回来。"],["Two neighbours came to testify about the noise at night.","两个邻居来作证,说夜里一直有响声。"],["Officers will verify the address before any money is paid.","付钱之前,工作人员会核实地址。"]]},{"t":"The Old Cook","s":[["The recipe does not specify how much salt to use.","这份菜谱没写明要放多少盐。"],["The old cook was happy to enlighten us about the fire.","那位老厨师很乐意给我们讲讲火候。"],["She likes to impart small tricks that no book has.","她喜欢传授一些书里没有的小窍门。"],["Anyone who has cooked for forty years deserves some respect.","做了四十年饭的人,总该得到点尊重。"],["She never writes anything down, and her daughter has tried for years.","她什么都不写下来,她女儿劝了好多年。"],["We stood in her kitchen with a notebook and two pens.","我们站在她的厨房里,拿着一个本子和两支笔。"],["By the end of the morning we had ten pages of notes and no exact amounts.","一个上午过去,我们记了十页,却没有一个准确的量。"]]},{"t":"The Wedding in the Village","s":[["The purpose of the party was to thank the neighbours, not to show off.","这场聚会的目的是谢邻居,不是显摆。"],["They invited sixty people, and eighty came.","他们请了六十个人,来了八十个。"],["The bride stood at the door to welcome each guest by name.","新娘站在门口,一个个叫名字迎客人。"],["Old friends greeted each other with both hands.","老朋友见面,两只手都握上。"],["The soldiers saluted the flag, and then the music started.","士兵向旗子敬礼,然后音乐就起来了。"],["Everyone stayed until midnight to celebrate.","所有人都留到半夜庆祝。"],["We queued for ten minutes to congratulate the couple.","我们排了十分钟队,就为向新人道喜。"],["The priest blessed the house before the meal.","吃饭前,神父给这栋房子祝了福。"],["The children were allowed to participate in the dancing.","孩子们也被允许参加跳舞。"],["At the gate there was a long farewell, and two women cried.","门口的道别拖得很长,两个女人哭了。"]]},{"t":"Two Letters","s":[["Those two colours do not assort well, so she changed the curtains.","那两种颜色不搭,她把窗帘换了。"],["For years the two sisters corresponded by letter once a month.","两姐妹通信通了好多年,每月一封。"],["His account of the night does not accord with the one his brother gave.","他对那天晚上的说法,跟他哥说的对不上。"],["They attribute the success of the shop to the woman at the door.","他们把这家店的好生意归功于门口那个女人。"],["The letters are kept in a box under the bed.","那些信收在床底下的一个盒子里。"],["Nobody in the family has ever read them all.","家里没人把它们全读完过。"],["Her version and his are close, but never quite the same.","她说的和他说的很接近,却从来不完全一样。"]]},{"t":"The Price of Oil","s":[["The price of oil dropped by a third in one week.","油价一个星期掉了三分之一。"],["Share prices plummeted the next morning.","第二天早上股价暴跌。"],["Heavy curtains muffle the sound of the road outside.","厚窗帘把外面马路的声音压下去了。"],["One mistake can overshadow a whole year of good work.","一个错就能让一整年的好活儿都暗下去。"],["My uncle had sold his shares the day before, which he calls luck.","我叔叔前一天就把股票卖了,他说这叫运气。"],["Now he sits with the newspaper on the kitchen table and says nothing.","现在他坐在那儿,报纸摊在餐桌上,一句话不说。"],["My aunt puts a hand on his shoulder and turns the page.","我婶婶把手放在他肩上,替他把报纸翻了一页。"]]},{"t":"Remembering the Street","s":[["I cannot recall the name of the street where we lived.","我们住过的那条街叫什么,我记不起来了。"],["My mother can recollect every shop on it, and what each one sold.","我妈却记得街上的每一家店,连卖什么都记得。"],["One photo reminds her of the winter the river froze.","有张照片让她想起河水结冰的那个冬天。"],["She will retell that story at every family meal.","每次家里吃饭,她都要把那件事重讲一遍。"],["We have heard it so often that we can repeat it word for word.","我们听得太熟,能一字不差地重复。"],["In retrospect, those years look easier than they really were.","回头看去,那些年显得比实际上轻松。"],["What impressed me most was how quiet the city was at six in the morning.","最让我记住的,是早上六点这座城市有多安静。"],["She had to surmount a hundred small problems before she could leave.","她得先克服一百个小麻烦,才走得成。"],["One cold remark at the table mortified him for a week.","饭桌上一句冷话,让他难受了一个星期。"],["A smell of coal pervaded the whole building in winter.","冬天,整栋楼都弥漫着煤味。"]]},{"t":"The Old Chair","s":[["We had to replace the old chair because one leg was cracked.","那把旧椅子得换了,一条腿裂了。"],["For a week a wooden box served as a substitute.","有一个星期,一只木箱充当了替身。"],["It is hard to distinguish the two brothers on the phone.","电话里很难分辨出这两兄弟谁是谁。"],["Few people can differentiate between the two kinds of tea by taste.","靠味道能分出这两种茶的人不多。"],["The road inclines slightly as it comes into the village.","路进村的时候会微微倾斜。"],["He likes to lean on the gate and watch the cars go by.","他爱靠在门上,看车一辆辆过去。"],["The picture on the wall hangs sideways, and nobody has ever fixed it.","墙上那幅画歪着挂,从来没人去扶正。"]]}],"21":[{"t":"A Man of Few Words","s":[["My grandfather has a quiet manner that makes people listen.","我爷爷举止安静,反而让人愿意听他说。"],["His temper is short in the morning and long in the evening.","他早上的脾气短,到了晚上就长了。"],["He says his mood depends on the weather and on the radio.","他说自己的心情全看天气和广播。"],["You can hear every emotion in his voice, though his face shows nothing.","他脸上什么也没有,可声音里什么情绪都听得出来。"],["People say I have his character and the attitude of my mother.","人家说我的性格像他,对钱的态度像我妈。"],["His best trait is that he never promises too much.","他最好的一点是,从不把话说满。"],["Patience is a virtue he learned on the boats.","耐心是他在船上学会的一种美德。"],["The main feature of the old house is the long kitchen.","那栋老房子最显眼的地方,是那间很长的厨房。"],["His personality fills the room before he says a word.","他还没开口,他的性情就已经把整个屋子填满了。"],["He is not tall in stature, but he stands very straight.","他个子不高,却站得笔直。"],["When he sits down, you can feel the whole room slow down.","他一坐下,你就觉得整间屋子都慢了下来。"]]},{"t":"Under the Skin","s":[["Under the skin there is flesh, and under the flesh there is bone.","皮肤下面是肉,肉下面是骨头。"],["A human body has about two hundred bones, and a child has more.","人的身体大约有两百块骨头,小孩还要多一些。"],["The backbone holds you up, and the skull protects the brain.","脊柱把你撑起来,颅骨护着脑子。"],["In a museum in Cairo there is the skeleton of a whale.","开罗的博物馆里有一副鲸的骨架。"],["Mankind has been asking how the mind works for a very long time.","人类问“心是怎么想的”已经问了几千年。"],["Physical work makes you hungry, and mental work makes you tired in another way.","体力活让人饿,脑力活让人累,累法不一样。"],["The brain uses about a fifth of the energy we take in.","脑子要用掉我们摄入能量的五分之一。"],["Her mind was still sharp at ninety, though her body had slowed down.","她九十岁时脑子还很清楚,只是身子慢了。"]]},{"t":"The Face","s":[["My father has a small scar on his left cheek.","我爸左边脸颊上有块小疤。"],["He wipes his forehead with the back of his hand when he is thinking.","他想事情的时候,用手背擦一下前额。"],["His brow goes up when he does not believe a word you say.","你说的话他一个字都不信时,眉毛就抬起来了。"],["One eyelash fell on the page, and my sister made a wish.","一根睫毛落在书页上,我妹妹许了个愿。"],["He keeps his lip still when he is angry, and that is worse than shouting.","他生气的时候嘴唇一动不动,那比喊出来还吓人。"],["Hot soup burned his tongue, and he said nothing for a minute.","热汤烫了他的舌头,他一分钟都没说话。"],["A cold went to his throat, and he lost his voice for three days.","感冒窜到嗓子,他三天说不出话。"],["When he was young he could fill his gorge and still ask for more.","他年轻时能吃下一大堆,吃完还要再来。"],["He shaves his chin every second day, and trims his jaw once a week.","他两天刮一次下巴,一星期修一次颌边的胡子。"],["A red scarf around his neck is the only colour he ever wears.","脖子上那条红围巾,是他身上唯一的颜色。"],["His beard went white before the hair on his head did.","他的胡子比头发先白。"]]},{"t":"The Baker","s":[["A baker works with his arms, and one shoulder is always a little higher.","做面包的人靠胳膊吃饭,两个肩膀总有一个略高一点。"],["Years of lifting have made his left limb weaker than the right.","搬了这么多年,他左边那条胳膊比右边弱。"],["He rests his elbow on the counter and talks to the queue.","他把手肘搁在柜台上,跟排队的人说话。"],["Flour gets into the fold of his wrist and stays there all day.","面粉钻进他手腕的褶子里,一整天都在那儿。"],["He presses the dough with his thumb to see if it is ready.","他用拇指按一下面团,看发好没有。"],["The palm of his hand is as hard as the sole of a shoe.","他手心硬得像鞋底。"],["One finger is bent from a machine he used at twenty.","他一根手指是弯的,二十岁时被一台机器夹的。"],["He bangs his fist on the table when the oven is too slow.","炉子慢了,他就用拳头敲桌子。"],["His chest is wide, and he breathes like a man who has been running.","他胸膛很宽,喘气像刚跑过步的人。"],["He never opens his mouth while the bread is in the oven.","面包在炉子里的时候,他嘴上一句不说。"]]},{"t":"The Torso","s":[["A rib broke when he fell off the ladder, and it hurt when he laughed.","他从梯子上摔下来断了一根肋骨,笑起来都疼。"],["The doctor pressed his abdomen and asked whether it hurt.","医生按了按他的腹部,问疼不疼。"],["His waist has grown two inches since he stopped cycling.","他不骑车以后,腰围大了两寸。"],["Every organ has its own job, and most of them work without being asked.","每个器官都有自己的活,而且大多不用人吩咐。"],["The liver cleans the blood, and the kidney carries the waste away.","肝把血滤干净,肾把废物带走。"],["His stomach complains if he eats after nine at night.","他晚上九点以后吃东西,胃就要抗议。"],["Smoke from the fire went into his lung, and he coughed for a week.","烟进了他的肺,他咳了一个星期。"],["A child grows in the womb for nine months before it is born.","孩子在子宫里长九个月才出生。"]]},{"t":"The Body Has Its Own Clock","s":[["The heart is a muscle, and its pulse can be felt at the wrist.","心脏是一块肌肉,它的脉搏在手腕上摸得到。"],["Blood leaves the heart through an artery and comes back another way.","血从动脉离开心脏,再从另一条路回来。"],["A gland sends hormones into the blood, and they change how the body works.","腺体把激素送进血里,身体的运作就跟着变。"],["A nerve carries a message faster than you can think about it.","神经传消息,比你反应过来还快。"],["Every chamber of the heart fills and empties about seventy times a minute.","心脏每个腔室一分钟大约装满再排空七十次。"],["The intestine takes what it needs from food, and the rest moves on.","肠子从食物里拿走需要的,剩下的继续往前走。"],["Water leaves the body through every pore of the skin.","水从皮肤上每一个毛孔离开身体。"],["A small stimulus can keep the immune system busy for days.","一点点刺激,就能让免疫系统忙上好几天。"],["The biorhythm of a night worker never quite fits the daylight.","上夜班的人,生物节律总跟白天对不上。"],["A healthy lifestyle is easier to describe than to keep.","健康的生活方式说起来容易,守起来难。"],["A habit is a decision you stop making after about a month.","习惯就是一个你坚持一个月以后不用再做的决定。"]]},{"t":"On the Stairs","s":[["She fell on the stairs and hurt her knee.","她在楼梯上摔了一跤,伤了膝盖。"],["The joint was swollen for a week, and she could not bend it.","那个关节肿了一个星期,弯都弯不了。"],["Her thigh was black and blue from the hip down to the knee.","她从胯到膝的大腿青了一大片。"],["She twisted her ankle on the last step.","她在最后一级台阶上崴了脚踝。"],["The heel of her shoe came off, and that is how it started.","鞋跟掉了,事情就是从这儿开始的。"],["For two days she could not put any weight on her toe.","有两天她脚趾一点劲都使不上。"],["Now she keeps a warm cloth on her lap and reads.","现在她腿上搭着一块热毛巾,坐着看书。"]]},{"t":"The Eye Test","s":[["My grandmother lost most of her sight at eighty, but her hearing stayed sharp.","我奶奶八十岁那年视力去了大半,耳朵却一直很灵。"],["Her eyesight had been poor for years, and she never told anyone.","她的视力差了好多年,却一直没跟人说。"],["From her window there is a fine view of the river.","从她窗口看出去,河上的景色很好。"],["A visual test showed that she needed stronger glass.","做了个视觉检查,才知道她得换更厚的镜片。"],["Now the far bank is barely visible through it.","现在透过镜片,对岸只是模模糊糊一片。"],["Her answers were vague, so the doctor asked the same question again.","她答得含糊,医生只好把同一个问题再问一遍。"],["One neighbour is almost blind and still walks to the shop each day.","有个邻居几乎看不见了,还是每天走到店里去。"],["For a moment he was dumb with surprise and could not answer.","有一瞬间他惊得说不出话,答不上来。"],["The aural test was harder: she had to say which side the sound came from.","听觉测试更难,她得说出声音是从哪边来的。"],["A dental check found nothing wrong, which surprised her.","牙科检查什么都没查出来,她倒有点意外。"],["Of the five senses, touch was the one she trusted most.","五种感觉里,她最信的是触觉。"]]},{"t":"Sunday Afternoon","s":[["The house is quiet at two in the afternoon on a Sunday.","星期天下午两点,家里很安静。"],["My father is asleep in the chair with the paper on his knees.","我爸在椅子上睡着了,报纸摊在膝盖上。"],["He stays awake until midnight, so he needs a nap after lunch.","他熬到半夜才睡,所以午饭后得补一小觉。"],["He will yawn twice, close his eyes, and doze for twenty minutes.","他会打两个呵欠,闭上眼,打二十分钟的瞌睡。"],["If the phone rings, he wakes at once and pretends he was reading.","电话一响,他立刻醒来,还装作刚才在看书。"],["My mother says a short nap is better than a second cup of tea.","我妈说,眯一会儿比再喝一杯茶管用。"],["The cat does the same thing on the warm step outside.","外面的猫在暖台阶上做同样的事。"]]},{"t":"The Clinic on the Hill","s":[["An old man with a lame leg comes to the clinic every Tuesday.","有个腿瘸的老人每个星期二都来诊所。"],["He was born with one hip out of place, and it never mended.","他出生时一边胯骨就错着位,一直没好。"],["A young woman was crippled by a fall from a horse last spring.","去年春天,一个年轻女人从马上摔下来,落下了残疾。"],["She is expecting a baby, and the pregnancy has been difficult.","她现在怀着孩子,孕期一直不太顺。"],["The clinic hands out condoms free at the desk by the door.","诊所门口那张桌子免费发避孕套。"],["A dwarf apple tree grows against the warm wall of the garden.","花园暖墙边种着一棵矮苹果树。"],["The doctor refuses to discuss clone work, because it is not legal here.","医生不肯谈克隆的事,因为在这儿不合法。"]]},{"t":"The Waiting Room","s":[["The waiting room smells of soap and old paper, and nobody talks.","候诊室里是肥皂和旧纸的味道,没人说话。"],["The first symptom was a cough that would not go away.","最早的征兆是一声停不下来的咳嗽。"],["The doctor asked what illness he had had as a child.","医生问他小时候得过什么病。"],["Some diseases run in families, and some come from the water.","有些病是家里传下来的,有些是从水里来的。"],["An old man moaned in the corner and held his side.","角落里一个老人捂着腰侧低声哼。"],["The infection had spread from a bad tooth to his ear.","感染从一颗坏牙蔓延到了耳朵。"],["One patient had been waiting since seven in the morning.","有个病人从早上七点就等着了。"],["The label on his file said invalid, an old word for a sick man.","他病历上写着一个旧词,意思是病弱者。"]]},{"t":"The Numbers on the Screen","s":[["Too much salt is a detriment to the heart.","盐吃多了对心脏有害。"],["The X-ray showed a broken wrist from a fall in the garden.","片子显示他手腕断了,是在花园里摔的。"],["The accident disabled him for two years.","那场事故让他两年不能干活。"],["The report says obesity among children has doubled in ten years.","报告说,儿童肥胖十年里翻了一倍。"],["His doctor told him he was overweight and should walk every day.","医生说他超重了,得每天走路。"],["Diabetes and hypertension are common in his family.","他家糖尿病和高血压都常见。"],["A dysfunction of the kidney was found in the blood test.","血液检查发现他的肾功能有障碍。"]]},{"t":"The Bad Year","s":[["His father had a heart attack at fifty and stopped smoking that day.","他父亲五十岁心脏病发作,当天就把烟戒了。"],["A stroke left his uncle without the use of one arm.","他叔叔中风以后,一条胳膊不能动了。"],["The illness paralysed one side of her face for three months.","那场病让她半边脸麻了三个月。"],["Her mother has arthritis in both hands and cannot open a jar.","他母亲两只手都有风湿,瓶子都拧不开。"],["He was treated for cancer two years ago and now works in the garden.","他两年前治过癌症,现在在园子里干活。"],["In the old records, a plague killed a third of the town.","旧档案里记着,一场瘟疫带走了全城三分之一的人。"],["The heat that summer was insane, and people slept on the roofs.","那年夏天热得离谱,人们都睡到屋顶上去了。"]]},{"t":"The Student Week","s":[["For a week he had a headache that no pill would touch.","他头疼了一个星期,什么药都压不住。"],["The flu came with a fever of thirty-nine and a dry cough.","流感来了,烧到三十九度,还干咳。"],["His throat began to swell, and once he nearly choked on his own breath.","他喉咙开始肿,有一次差点被自己的气噎住。"],["He moaned in his sleep, and his mother sat by the bed all night.","他睡着时直哼哼,他母亲在床边坐了一夜。"],["He could not sleep at all, and the insomnia made everything worse.","他完全睡不着,失眠又把别的都弄得更糟。"],["In the morning he felt dizzy when he stood up.","早上一起身,他就头晕。"],["An allergy to dust did not help, and his nose ran all day.","他还对灰尘过敏,鼻子整天流。"],["By Friday a pimple on his chin had turned into a small red map.","到星期五,他下巴上一颗小疱变成了一小片红。"]]},{"t":"The Football Match","s":[["Two players were injured in the first ten minutes of the match.","比赛头十分钟就有两名球员受伤。"],["One had a cut on his knee that would not stop bleeding.","一个膝盖上划了个口子,血止不住。"],["The other had a bruise the size of a hand on his thigh.","另一个大腿上一块手掌大的淤青。"],["The injury kept him out of the team for six weeks.","这一伤让他六个星期没能上场。"],["The wound was clean, and the nurse closed it with three stitches.","伤口很干净,护士缝了三针。"],["There was a lump on his shin that took a month to go down.","他小腿上肿起一块,一个月才消。"],["He said the pain was worse at night than during the game.","他说夜里比踢球时还疼。"],["The trauma of the fall stayed with him much longer than the cut.","摔那一下留下的惊吓,比那道口子跟他跟得久。"]]},{"t":"The Last Winter","s":[["He talked about death as if it were a neighbour he had not met.","他说起死亡,像在说一个还没见过面的邻居。"],["Every mortal thing wears out, he said, and that includes the boat.","他说凡是有命的东西都会旧,船也一样。"],["His demise was reported in the paper in four short lines.","他的死讯在报上只占了四行。"],["The village had long expected doom from the mine on the hill.","村里人早就觉得山上那个矿迟早要闯大祸。"],["One fall on the wet stones could be fatal at his age.","他这个年纪,在湿石头上摔一下就可能是致命的。"],["The gas from the mine was lethal to birds and to men.","矿里的气对鸟和人都能要命。"],["He had outlived three doctors and one priest.","他送走了三个医生和一个神父。"],["At the funeral nobody could think of a story that was not true.","葬礼上,谁也想不出一件不是真的往事来讲。"]]},{"t":"Six Months in the Attic","s":[["The team built a corpus of two million words from old newspapers.","这个小组用旧报纸建了一个两百万词的语料库。"],["Six months of overwork left them pale and short-tempered.","半年的过度劳累让他们脸色发白,脾气也短了。"],["The work exhausted him by Thursday every week.","这活每个星期都能把他累到周四就撑不住。"],["Fatigue made small mistakes look like big ones.","疲乏让一个小错看起来像大错。"],["One afternoon a young woman fainted at her desk.","一天下午,一个年轻姑娘在桌前昏了过去。"],["Her pulse was feeble, and the doctor sent her home for a week.","她脉搏很弱,医生让她回家休息一周。"],["By the end of it they were too weary to celebrate.","到最后,他们累得连庆祝都懒得。"],["Two years in that room weakened his eyes and his back.","在那间屋子里待了两年,他的眼睛和背都弱了。"]]},{"t":"The Long Ward","s":[["The bed was hard, and the light above it made everyone uncomfortable.","床很硬,头顶的灯让每个人都觉得不舒服。"],["He was unconscious for two days after the fall.","摔下来以后,他昏迷了两天。"],["Her cough was chronic, and it came back every winter.","她的咳嗽是慢性的,每到冬天就回来。"],["The acute pain lasted three days and then faded to an ache.","剧痛持续了三天,然后淡成一种钝痛。"],["His throat was sore, so he drank only warm water.","他嗓子疼,只喝温水。"],["There was a sorrow in the room that no visitor could lift.","屋里有种悲伤,来多少客人都驱不散。"],["His suffering was quiet, which made it harder to watch.","他疼得安静,反倒更让人看不下去。"],["The old women lament the young men who never came home.","老太太们为那些再没回家的年轻人叹息。"]]},{"t":"The Hospital at Five","s":[["The hospital is quiet at five in the morning, and only the kitchen is bright.","早上五点,医院很静,只有厨房亮着灯。"],["She works there as a cleaner, and her job is to keep the ward sanitary.","她在那里做清洁,活儿就是让病房保持干净卫生。"],["Hygiene is not a small thing in a place like this.","在这种地方,卫生不是小事。"],["Medical waste goes into yellow bags, and nothing else goes in them.","医疗垃圾丢进黄袋子,别的东西一律不许放。"],["The therapy room is on the second floor, next to the stairs.","治疗室在二楼,靠着楼梯。"],["Health care here is free, but the waiting list is long.","这儿的医疗是免费的,可排队排得很长。"],["A warm bath and a short walk are the whole curative plan for one old man.","对一位老人来说,整个治疗方案就是热水澡加散一会儿步。"],["He was once a runner, and his fitness is the only thing that saved him.","他以前是跑长跑的,救他的就是他这副好身板。"]]},{"t":"The Surgeon","s":[["The physician listened for a full minute before he said anything.","那位内科医生听了整整一分钟才开口。"],["The surgeon washed her hands for three minutes, then came in.","外科医生洗了三分钟手,才走进来。"],["The operation took four hours and left a line of six stitches.","手术做了四个小时,留下一道缝了六针的线。"],["There is no cure for his knee, only a treatment that keeps it quiet.","他的膝盖治不好,只能靠治疗让它安静下来。"],["The wound healed more slowly than anyone had expected.","伤口好得比谁预料的都慢。"],["She wrote a prescription for two weeks of tablets.","她开了一张两周的药方。"],["He has a check every six months, and it has been clean for three years.","他每半年查一次,已经三年没查出问题。"]]},{"t":"The Letter from the Council","s":[["A transplant is only possible if a family says yes at the worst moment of their lives.","器官移植能不能成,只看一家人在最难的时候愿不愿意点头。"],["The injection went into his arm and hurt less than the blood test.","针打在他胳膊上,比抽血还不疼。"],["As a precaution, the clinic came to vaccinate every child under ten.","为防万一,诊所来给十岁以下的每个孩子打了疫苗。"],["Travellers from the infected area were held in quarantine for two weeks.","从疫区来的人被隔离了两个星期。"],["In the old hospital they would segregate the sick from the well.","在老医院里,病人和健康人是分开的。"],["They had to isolate the one boy who had the fever.","他们只好把唯一发烧的那个男孩单独隔开。"],["Nobody liked the rules, and everybody obeyed them.","没人喜欢这些规矩,可人人都照着做。"],["Two months later the ward was empty again.","两个月后,那间病房又空了。"]]},{"t":"The Pharmacy on the Corner","s":[["The pharmacy on the corner opens at eight and closes at ten.","拐角的药房八点开门,十点关门。"],["Behind the counter are boxes of medicine with names nobody can say.","柜台后面是一盒盒药,名字没人念得出来。"],["For a sore throat the old remedy is honey and hot water.","嗓子疼,老办法就是蜂蜜加热水。"],["The drug that helped him most was the cheapest one on the shelf.","最管用的那种药,是货架上最便宜的。"],["He takes one pill in the morning and two at night.","他早上吃一片,晚上吃两片。"],["The antibiotic worked in four days, which is fast.","抗生素四天就见效,算是快的。"],["Penicillin saved his grandfather in 1944.","一九四四年,青霉素救了他爷爷的命。"],["Morphine was given only in the last week.","吗啡只在最后一周用过。"],["The dose on the box is for adults, so half of it is enough for a child.","盒上的剂量是给大人的,孩子一半就够。"],["His recovery took a month, and he slept badly for most of it.","他养了一个月,大半时间睡不好。"],["A cold shower will refresh you better than a second coffee.","冲个冷水澡,比再喝一杯咖啡还提神。"],["She has acupuncture once a week for her back.","她每个星期做一次针灸,治背。"]]},{"t":"Back on Your Feet","s":[["The injection gave him some relief within an hour.","打完针一个小时,他就松快了些。"],["A warm cloth will relieve the pain in your jaw.","一块热毛巾能减轻颌边的疼。"],["These tablets alleviate the swelling but do not cure it.","这些药片能消一点肿,但治不了根。"],["She eased herself into the chair and said nothing.","她慢慢挪进椅子里,一句话没说。"],["For the first time in a week he could relax his shoulders.","一个星期以来,他第一次能把肩膀放松下来。"],["He will resume work on Monday if the cough has gone.","咳要是好了,他星期一再上班。"],["It took a month before his breathing was normal again.","过了一个月,他的呼吸才恢复正常。"],["Colds are common in winter, and this one was worse than usual.","冬天感冒很常见,这一场比平常重。"]]},{"t":"Two Brothers","s":[["One brother is optimistic about everything, and the other always expects rain.","一个兄弟对什么都乐观,另一个总在等下雨。"],["The optimistic one buys the tickets before he has a job.","乐观的那个还没找到工作就先买了票。"],["The pessimistic one saves money for a winter that never comes.","悲观的那个一直存钱,等一个永远不来的冬天。"],["One has a positive view of people, and the other a negative one.","一个看人总是往好处看,另一个总往坏处看。"],["At work the quiet one is passive and waits to be told what to do.","上班时话少的那个很被动,等人吩咐才动。"],["The loud one is enthusiastic about every new plan, and about nothing after a month.","话多的那个对每个新计划都热情,一个月后就没兴趣了。"],["Both are indifferent to money, which annoys their mother.","两个人都对钱无所谓,这让他们的妈很着急。"],["The neighbours are apathetic about the state of the road.","邻居们对这条路的好坏漠不关心。"],["The difference in their pay is negligible, and neither of them cares.","两人的工资差得微不足道,谁都不在意。"]]},{"t":"The Birthday","s":[["The whole family came for her eightieth birthday, and there was laughter in the kitchen.","全家人都来给她过八十岁生日,厨房里全是笑声。"],["Her happiness was quiet, and she kept touching the table as if it were new.","她的高兴是安静的,手一直摸着桌子,好像那是新买的。"],["The children made a joke about her age, and she laughed first.","孩子们拿她的年纪开玩笑,她第一个笑。"],["It was fun to watch four people try to light eighty candles.","四个人点八十根蜡烛,看着真好玩。"],["A merry song came on the radio, and two of them danced by the sink.","收音机里响起一支欢快的歌,两个人在水池边跳了几步。"],["Her delight at the cake was worth more than the cake.","她看见蛋糕时的那份欢喜,比蛋糕本身值钱。"],["She said the pleasure was in the noise, not in the food.","她说,快乐在热闹里,不在菜里。"],["The grandchildren cheered when she cut it.","她切蛋糕的时候,孙子们一片欢呼。"],["Someone shouted that we should rejoice while we still can.","有人喊了一句:趁还能高兴,就高兴吧。"],["The little ones were thrilled by the candles and the dark.","小的们被蜡烛和黑屋子激得又叫又跳。"],["It is hard to please a room of twelve, and she did it with soup.","让一屋子十二个人都满意很难,她一锅汤就做到了。"]]},{"t":"The New Job","s":[["The first month was agreeable, and the second was better.","第一个月还算愉快,第二个月更好。"],["The pay is not exciting, but the work is.","工资不激动人心,活儿倒是。"],["Her manager is keen on detail and short with mistakes.","她的经理对细节很在意,对错误没耐性。"],["He works with a zeal that makes the rest of us tired.","他干活那股热情,把我们都看累了。"],["The office is lively at ten and dead after four.","办公室十点很热闹,过了四点就死气沉沉。"],["There is a lovely view of the car park from the window, which is a joke.","窗外的风景是停车场,这话本身是个笑话。"],["She is fond of the older woman who sits by the door.","她喜欢坐在门边那位年长的女士。"],["The manager favours people who arrive early.","经理偏爱早到的人。"],["The result was satisfactory, and nobody was surprised.","结果还过得去,也没人意外。"],["A quieter desk would be desirable, but not at this price.","能有个安静点的位子当然好,只是这个价钱换不来。"]]},{"t":"The Man at the Door","s":[["He brings a kind of joy into a room that nobody can explain.","他一进屋,就带进一种说不清的欢喜。"],["A walk in the cold air exhilarates him, and he comes back talking fast.","在冷空气里走一圈就让他振奋,回来话特别多。"],["The noise of the city startled her at first.","城里的声音一开始把她惊着了。"],["It is amazing how quickly people get used to a new view.","人对新的风景习惯得快,快得让人吃惊。"],["The size of the station will astound anyone who comes from a village.","从村子里来的人,看见车站那么大都要震一下。"],["His days are hectic, and he likes them that way.","他每天都忙乱,而且他就喜欢这样。"],["He is generous with his time and careful with his money.","他花时间很大方,花钱很小心。"]]},{"t":"The Teacher","s":[["She is liberal in her views and strict about homework.","她想法开明,对作业却很严。"],["Her voice is gentle, and that is why nobody argues with her.","她声音温和,所以没人跟她争。"],["She is humble about her own writing, though it has won prizes.","她对自己的文章很谦虚,尽管得过奖。"],["Her flat is modest: two chairs and a thousand books.","她的住处很朴素:两把椅子,一千本书。"],["She is humorous without telling jokes, which is harder.","她不讲笑话也让人觉得好笑,这更难。"],["The students are polite to her because she is polite first.","学生对她客气,因为她先客气。"],["She is frank about their chances and never promises a good mark.","她实话实说他们的把握,从不保证给好分。"],["She takes their work seriously, even when it is bad.","她认真对待他们的作业,哪怕写得很差。"]]},{"t":"The Stranger Upstairs","s":[["The man upstairs is mysterious: he never says what he does.","楼上那个人很神秘,从不说自己是干什么的。"],["The children are curious about the boxes he carries at night.","孩子们对他夜里搬的箱子很好奇。"],["One of them was daring enough to ask him.","其中一个胆子大,真去问了。"],["He answered in a direct way that surprised her.","他答得很直接,反倒让她吃了一惊。"],["He said he was an earnest student of old maps.","他说自己在很认真地研究旧地图。"],["His honesty about his age made her laugh.","他对自己年纪那么坦白,把她逗笑了。"],["He is proud of a boat he has not finished in nine years.","他为一艘九年都没造完的船感到自豪。"],["Nobody thought it was a manly thing to say, and he said it anyway.","没人觉得这话多有男子气,他还是说了。"]]},{"t":"The Guest House","s":[["The guest house is small, and the owners are almost too friendly.","这家小旅店不大,老板夫妇热情得几乎过头。"],["They are hospitable in the old way: tea first, questions later.","他们待客是老派做法:先上茶,再问话。"],["The room has a romantic view of the harbour at night.","房间夜里看港口,景色很浪漫。"],["What the guests love most is the freedom to come in at any hour.","客人最喜欢的是几点回来都行。"],["The owner is careful with the keys and counts them every night.","老板对钥匙很仔细,每晚都要数一遍。"],["Her main concern is the boiler, which is older than she is.","她最操心的是那台锅炉,比她还老。"],["She has great confidence in her son, who does all the repairs.","她特别信得过儿子,所有修补都是他干。"],["He is considerate enough to leave a note when he goes out.","他很体贴,出去都会留张字条。"]]},{"t":"The Thank-You Letter","s":[["It was a thoughtful present, and it arrived on the right day.","那份礼送得很用心,而且正好赶在那天到。"],["Her letter was sympathetic without being sad.","她那封信满是体谅,却不显得悲伤。"],["He was ready to help before anyone asked him.","还没人开口,他就已经准备好帮忙了。"],["She had to apologise for losing the book.","她为弄丢了那本书道了歉。"],["Her apology was two lines long and completely honest.","她的道歉只有两行,却句句是真话。"],["The old judge showed mercy and gave him a fine instead of a month.","老法官手下留情,罚了钱,没关他一个月。"],["I admire people who can admit a mistake that fast.","我佩服能这么快认错的人。"],["For a man of his age, his memory is remarkable.","他这个年纪,记性算得上了不起。"]]},{"t":"The Climb","s":[["The path was arduous, and two of us turned back at the first stream.","那条路很艰难,我们当中有两个人在第一条小溪就折回去了。"],["It was a tough climb for anyone over sixty.","对六十岁以上的人来说,这段爬升很吃力。"],["The guide was robust and carried two bags without complaint.","向导身体结实,背两个包也不抱怨。"],["His boots were sturdy, and that made the difference on the wet rock.","他的靴子很结实,在湿石头上这就是关键。"],["We were eager to reach the top before the clouds came.","我们急着想在云上来之前到顶。"],["The last hour was strenuous, and nobody spoke.","最后那一小时特别费力,谁都不说话。"],["We were grateful for the tea at the hut.","小屋里那壶茶,让我们很感激。"],["Our gratitude went to the woman who had lent us the map.","我们要谢的是那位借我们地图的女士。"]]},{"t":"The Village on the Postcard","s":[["The village is picturesque in every direction, which is why the buses stop here.","这个村子四面都像画,所以大巴才会在这儿停。"],["A prominent white church stands above the roofs.","一座显眼的白教堂立在屋顶之上。"],["The view from the bridge is awesome in the old sense of the word.","从桥上望出去,那种壮观还是老词里的那个意思。"],["Behind the postcard there is a mundane life of queues and repairs.","明信片背后,是排队和修修补补的平凡日子。"],["The climate is temperate, so the gardens stay green until December.","气候温和,园子到十二月还是绿的。"],["The wall paintings are delicate, and visitors are asked not to touch them.","墙上的画很脆弱,提醒客人不要碰。"],["The young man is a promising painter, and he has sold nothing yet.","那个年轻人画得有前途,可一幅都还没卖出去。"]]},{"t":"The Old Boat","s":[["He has been steadfast in his plan for eleven years.","这个计划他坚持了十一年,一直没动摇。"],["His manner is tender with the boat and short with people.","他对那条船很温柔,对人却没耐性。"],["It was naive of him to think the wood would last.","他以为那木头能撑住,想得太天真了。"],["His friends call the plan childish, and he does not mind.","朋友说这计划幼稚,他也不在意。"],["He is sincere when he says he will finish it this summer.","他说今年夏天能完工,这话是真心的。"],["Anyone who works in the rain is liable to get ill.","在雨里干活的人,容易生病。"],["The man who sells him wood is trustworthy, which is rare.","卖他木头的那个人靠得住,这挺难得。"],["His daughter is the enterprising one: she has already found buyers.","有闯劲的是他女儿,她已经找好了买家。"]]},{"t":"The Photograph","s":[["The only sane thing to do was to wait for the light.","唯一明智的做法就是等光。"],["Her method is rigorous: two shots, one place, every morning.","她的方法很严格:每天早上,同一个地方,拍两张。"],["The rules of the competition are strict about editing.","比赛规则对修图管得很严。"],["The winter there is severe, and the roads close for weeks.","那儿冬天很严酷,路一关就是几个星期。"],["Their friendship is based on mutual silence.","他们的交情建立在彼此不说话上。"],["The two sisters resemble each other in the voice, not the face.","这两姐妹像的是声音,不是脸。"],["Their houses are similar, and both have a bare wall facing north.","两家的房子差不多,朝北都有一面光墙。"],["The branch looks naked in December and familiar by March.","那根树枝十二月看着光秃秃的,到三月又眼熟了。"],["A private garden is behind the wall, and nobody photographs it.","墙后是个私家花园,没人去拍它。"],["Her intuition about weather is better than the forecast.","她对天气的直觉,比预报还准。"]]},{"t":"What You Think You Saw","s":[["The best photo was spontaneous: a child ran into the frame.","最好的一张是抢来的:一个孩子跑进了画面。"],["There was an implicit agreement that we would not publish it.","大家心里有个默契,这张不发。"],["The lake in the picture is an illusion made by salt.","照片里的湖,是盐做出来的错觉。"],["He writes about an imaginary town that looks exactly like this one.","他写一个虚构的镇子,跟这个一模一样。"],["She has a fancy that the house is watching her.","她总觉得这房子在看着她。"],["The salt flat looks like water from a distance.","远处看,盐滩就像一片水。"],["Nobody believed her until they walked out on it.","没人信她,直到自己走上去。"]]},{"t":"The Bad News","s":[["He heard the news on a Tuesday and did not speak until Friday.","他星期二听到消息,一直到星期五都没开口。"],["Losing the farm was a blow that he later called fate.","失去农场那一击,他后来管它叫命。"],["The family had made a fortune in those years, and lost it in a month.","那几年他们家挣下了一份家业,一个月就没了。"],["The old man was in agony for a week and hid it badly.","老人疼了一个星期,还硬撑着不让人看出来。"],["Her grief was quiet, and she went back to work on Monday.","她的悲痛是安静的,星期一照常去上班。"],["He grieved for the dog longer than for the house.","他为那条狗难过的时间,比为一栋房子还长。"],["Those were miserable years, and nobody wants to talk about them.","那几年过得很苦,谁也不
