愿提。"],["The letter brought distress to everyone in the village.","那封信让村里每个人都难受。"]]},{"t":"Three Grey Days","s":[["There was a sadness in the house that food could not lift.","屋里那股愁,拿什么都压不下去。"],["The sky was gloomy for three days, as if it agreed with us.","天阴了三天,好像也在附和我们。"],["I do not want to disappoint you, but the money is gone.","我不想让你失望,可钱确实没了。"],["One bad season should not discourage him for good.","一个坏季不该让他从此灰心。"],["Their room was wretched: one window, no heat, and a floor that moved.","他们那间屋子惨得很:一扇窗,没暖气,地板还会动。"],["The delays were frustrating for everyone in the queue.","这一拖再拖,排队的人都给憋坏了。"],["She went to mourn with the family and stayed for the meal.","她去陪那家人一起哀悼,还留下吃了饭。"]]},{"t":"The Argument in the Car","s":[["His anger comes fast and leaves just as fast.","他的火来得快,去得也快。"],["She was furious about the ticket and said so for ten minutes.","她为那张罚单气坏了,说了整整十分钟。"],["He frowned at the map, then at the road, then at me.","他先皱眉看地图,再皱眉看路,最后皱眉看我。"],["For a moment he was in a rage about a wrong turning.","有一阵他为一个拐错的路口大发雷霆。"],["The noise of the radio began to irritate him.","收音机的声音开始让他烦躁。"],["He hates being late more than he hates traffic.","他讨厌迟到,比讨厌堵车还厉害。"],["There is an old hatred between the two families about a wall.","两家为一堵墙,结了很多年的仇。"],["The flies were a nuisance at every stop.","每到一站,苍蝇都烦人得很。"],["The smell of the engine made her feel disgust.","发动机的味道让她一阵恶心。"]]},{"t":"The Neighbour Dog","s":[["The dog next door began to vex the whole street at five each morning.","隔壁那条狗每天早上五点就开始惹得全街人心烦。"],["It would harass the postman and then sit in the middle of the road.","它追着邮递员骚扰,然后往路中间一坐。"],["A long meeting can bore even a patient man.","会开得长了,再有耐性的人也厌。"],["The noise did not bother the owner, who was deaf in one ear.","这声音烦不到主人,他一只耳朵听不见。"],["It was a troublesome animal, and the letters began to arrive.","这条狗实在麻烦,投诉信开始来了。"],["The weather that winter was awful, which did not help.","那年冬天天气糟透了,更是雪上加霜。"],["There was an unpleasant smell from the yard behind the house.","屋后院子里有一股难闻的味。"],["The cold had an adverse effect on the old pipes.","严寒对旧管子有不好的影响。"]]},{"t":"The Strike","s":[["The meeting turned hostile after about twenty minutes.","会开了二十分钟左右,气氛就变成敌对了。"],["The older workers were indignant about the new hours.","老工人对新的工时很愤慨。"],["One young man had radical ideas and said them very loudly.","一个年轻想法很激进,还说得特别大声。"],["The manager was mad, and everybody in the room knew it.","经理疯了,屋里每个人都知道。"],["It was a crazy plan, and it very nearly worked.","这计划荒唐得很,可差一点就成了。"],["Someone had played a wicked trick on the night shift.","有人对夜班的人使了个坏招。"],["There was a vicious note left on the board by the door.","门边的板子上被人留了张恶毒的字条。"],["One man shouted something vulgar and was asked to leave.","一个人喊了句粗话,被请了出去。"],["In the end the whole argument was about ego, not money.","说到底,这场争吵争的是面子,不是钱。"],["He was too selfish to see that the others had children too.","他太自私,想不到别人也有孩子。"]]},{"t":"The New Manager","s":[["The new manager can be nasty when he is tired.","新经理累的时候会很难听。"],["His first decision was rash, and he knew it by lunch.","他第一个决定做得鲁莽,吃午饭时他自己就知道了。"],["His mood is volatile, so nobody plans a meeting for Monday morning.","他情绪不稳,所以没人把会排在星期一早上。"],["There is a weird rule about the second lift.","关于第二部电梯,有条规定怪得很。"],["His control over very small things is excessive.","他对极小的事都要管,管得过分。"],["Her anxiety grew every time the phone rang.","电话每响一次,她的焦虑就重一分。"],["The team was restless by the end of the month.","到了月底,整个组都坐不住了。"],["Everyone felt uneasy about the Friday meeting.","星期五那个会,人人心里都不踏实。"],["His fear was not of losing the job but of the interview.","他怕的不是丢工作,是那场面试。"],["The quietest one was too timid to ask for a raise.","最安静的那个太胆小,连加薪都不敢提。"]]},{"t":"The Neighbours Downstairs","s":[["There was a great fuss about a broken window that nobody had broken.","为一扇谁也没打破的窗户,闹了好大一场。"],["Her remark was an insult, though she called it advice.","她那句话是侮辱,她却说这是建议。"],["It was unkind, and everybody at the table knew it.","那话刻薄,桌上每个人都知道。"],["I envy her garden, and she envies my quiet street.","我羡慕她的园子,她羡慕我这条安静的街。"],["Her husband is jealous of the time she spends out there.","她丈夫妒忌她在园子里待的那些时间。"],["I doubt that the fence was ever on their land.","我怀疑那道篱笆从来就不在他们的地上。"],["Her suspicion began with a letter that was never sent.","她的猜疑是从一封没寄出的信开始的。"],["The builder was sceptical about the cost and said so.","施工的人对造价很怀疑,而且直接说了。"]]},{"t":"The Interview","s":[["The first interview was unsatisfactory, and the second was worse.","第一场面试不尽如人意,第二场更差。"],["The company is unstable, and the pay arrives late every month.","这家公司不稳当,工资每个月都晚到。"],["The job was unsuitable for someone with two small children.","这份活对带着两个小孩的人来说不合适。"],["He was unwilling to move, and they were unwilling to wait.","他不愿搬,他们也不愿等。"],["She was reluctant to explain why she had left the last place.","她不太愿意解释上一家为什么离开。"],["He hesitated before answering, and that was his answer.","他答之前犹豫了一下,那一下就是答案。"],["Two of the questions were written to confuse him.","有两个问题是故意写得让他糊涂的。"],["The mistake embarrassed him more than it cost him.","那个错让他难堪,比它带来的损失还重。"]]},{"t":"In the Car Afterwards","s":[["He felt guilty about the way he had left the last job.","上一份工作他是那样走的,心里一直有愧。"],["He regrets the year he spent there, and he says so.","他后悔在那儿待的那一年,而且他承认。"],["He repented nothing, which surprised her more than an apology would.","他一点也不悔,这比道歉还让她意外。"],["She was ashamed of how relieved she felt.","她为自己心里那股轻松感到羞愧。"],["He sighed and opened the door of the car.","他叹了口气,推开车门。"],["She began to weep in the car, quietly, with the radio on.","她在车里哭了起来,很轻,收音机还开着。"],["Her tolerance for that kind of talk was gone.","那种话,她一点都忍不了了。"],["She could endure the noise, but not the waiting.","吵她能忍,等不了。"]]},{"t":"The Village Expert","s":[["He is not ignorant; he simply stopped reading in 1985.","他不是无知,只是从一九八五年起就不读书了。"],["The sly old man knew the answer and said nothing.","那个精明的老头知道答案,却什么也不说。"],["His cunning plan was to let the others speak first.","他狡猾的地方就是让别人先开口。"],["The rule about the gate was arbitrary, and everyone ignored it.","关于大门的规矩是随手定的,没人理。"],["The story he told was ridiculous, and half of it was true.","他讲的那件事荒唐,可有一半是真的。"],["It was a stupid mistake, and he made it twice.","那是个愚蠢的错误,他还犯了两次。"],["There was an awkward silence when the bill arrived.","账单来的时候,桌上静得尴尬。"],["His clumsy fingers could not open the small box.","他手笨,那个小盒子怎么也打不开。"],["One careless remark cost him three years of friendship.","一句大意的话,让他丢了三年的交情。"],["He was oblivious to the fact that everyone had left.","人都走光了,他一点没察觉。"]]},{"t":"The Children","s":[["The two boys are naughty in a way that makes people laugh.","那两个男孩淘气,可淘得让人想笑。"],["The younger one is greedy with sweets and generous with everything else.","小的那个见了糖就贪,别的东西倒大方。"],["His questions are obtrusive, and he asks them at the worst moment.","他问话太扎眼,还总挑最不合适的时机。"],["His brother is slothful in the morning and busy at night.","他哥早上懒得很,晚上倒忙。"],["Everything about him is sluggish until the football starts.","他整个人都慢吞吞的,球一开就变了。"],["On an impulse he sold his bike and bought a guitar.","他一时冲动,把自行车卖了换了把吉他。"],["Their father is rigid about bedtime and easy about everything else.","他们的爸爸睡觉时间卡得很死,别的都随便。"],["The little one is stubborn: he will stand in the rain rather than come in.","小的那个很倔,宁可站在雨里也不进屋。"],["People say the eldest is the quiet one, but that is only a stereotype.","人家说老大都安静,那不过是个刻板印象。"]]}],"22":[{"t":"How Often the Paper Comes","s":[["The daily paper comes at six, and my father reads it before he stands up.","日报六点到,我爸坐着看完才起身。"],["The monthly magazine arrives on the third Thursday and stays in its plastic for a week.","月刊在每个月的第三个星期四到,塑料膜一个星期都没拆。"],["The quarterly report is the only one that nobody reads.","季报是唯一没人看的那种报告。"],["The annual meeting is held in the same hall every March.","年度会议每年三月都在同一个礼堂开。"],["Their yearly trip to the coast has happened for nineteen years.","他们一年一次去海边,已经去了十九年。"],["On their anniversary they go back to the same small restaurant.","结婚纪念日,他们总回到那家小馆子。"],["The bus is punctual to the minute, which is rare in this town.","这趟公交准到分,在这镇上很难得。"],["He has not missed a day of work for three consecutive years.","他连着三年一天班都没缺过。"],["The boiler is checked periodically, whatever that means in practice.","锅炉是定期检查的,至于实际多久查一次,没人说得清。"],["The duration of the meeting depends on how much coffee is left.","会开多久,全看还剩多少咖啡。"]]},{"t":"The Age of the Building","s":[["The building belongs to another era, and everyone can see it.","这栋楼属于另一个时代,谁都看得出来。"],["At present it holds forty families and one very old lift.","现在里面住着四十户人家,还有一部很老的电梯。"],["The contemporary part at the back was added in 2003.","后面那截现代风格的部分是二〇〇三年加的。"],["There is a medieval wall under the car park, which nobody mentions.","停车场底下有一道中世纪的墙,没人提这事。"],["The tower has stood for a century and survived two fires.","那座塔站了一百年,过了两场火。"],["People say the town will still be here in another millennium.","人们说,再过一千年这镇子还在。"],["A million small repairs have kept it standing.","是一百万次小修补让它一直立着。"],["A billion is a thousand million, which nobody can really picture.","十亿就是一千个百万,这个数没人真能想象。"],["A dozen families share one washing line on the roof.","十几户人家合用在楼顶的一根晾衣绳。"]]},{"t":"From Dawn to Midnight","s":[["He leaves at dawn, when the street lights are still on.","他天亮就走,那时路灯还亮着。"],["At midday the market is at its loudest, and he eats standing up.","中午市场最吵,他站着就把饭吃了。"],["He is back after midnight, and the dog does not even wake.","他过了午夜才回,狗都不醒。"],["Some of the work can be done overnight, which saves a whole day.","有些活可以夜里做,能省出一整天。"],["The night shift is quieter, and he prefers it.","夜班清静,他更喜欢夜班。"],["The modern machines do in a minute what took an hour in 1980.","现在的机器一分钟就干完一九八〇年要一小时的活。"],["A recent change in the law made all the old papers useless.","最近一次法律修改,让所有旧文件都没用了。"],["He keeps an up-to-date list of every address in the district.","他手里有一份全区地址的最新清单。"],["For a moment he could not remember the name of the street.","有一瞬间他想不起那条街的名字。"],["In an instant the lights went out across the whole block.","一眨眼,整片街区的灯都灭了。"],["When the call came, he left immediately.","电话一来,他马上就走了。"]]},{"t":"The Order of Things","s":[["First the forms, then the money, and after that the keys.","先填表,再交钱,最后拿钥匙。"],["Secondly, nobody has checked the roof since 1998.","其次,一九九八年以后就没人查过屋顶。"],["Finally the whole thing was finished in June, two years late.","最后这事儿在六月完了,晚了两年。"],["Prior to that, the office had been a back room with one window.","在那之前,办公室就是一间只有一扇窗的后屋。"],["The former manager left a note that nobody could read.","前任经理留了张字条,谁也看不懂。"],["The preceding page explains the rules, if you can find it.","前一页讲了规矩,前提是你找得到。"],["There is no precedent for a case like this one.","这样的案子没有先例。"],["Her foremost concern is the safety of the stairs.","她最看重的是楼梯的安全。"],["The opening of the new wing was cancelled twice.","新侧楼的开张取消了两次。"],["Initially they planned four floors and built three.","起初他们打算盖四层,结果盖了三层。"],["An intermediate floor was added later, without a window.","后来加了一个中间层,连窗都没有。"],["In the midst of all this, the lift stopped working.","就在这一堆事中间,电梯又停了。"]]},{"t":"Two Jobs at Once","s":[["In the meantime, the old office stayed open.","与此同时,老办公室照常开着。"],["Meanwhile, two families were living in one room.","也是那阵子,两家人挤在一间屋里住。"],["The two repairs were simultaneous, which is why the water stopped.","两处维修是同时做的,水才停了下来。"],["The ongoing work on the road has lasted a year.","路上这项一直在做的工程已经做了一年。"],["Nothing in this building is everlasting, especially the paint.","这栋楼里没有什么是永久的,尤其是油漆。"],["He was offered a permanent job and said he would think about it.","有人给他一份长期的活,他说要考虑考虑。"],["The decision is imminent, according to the letter.","照信里的说法,决定马上就要下来了。"],["Incidentally, the same man built both bridges.","顺便说一句,两座桥是同一个人修的。"]]}]}, CHS={"1":[["atmosphere","n. 大气；气氛；氛围"],["atmospheric","adj. · atmosphere 的衍生词",1],["hydrosphere","n. 水圈"],["lithosphere","n. 岩石圈"],["oxygen","n. 氧；氧气"],["oxide","n. 氧化物"],["carbon dioxide","phrase. 二氧化碳"],["hydrogen","n. 氢"],["core","n. 核；核心；重点；v. 去 (果)核"],["crust","n. 外壳；硬壳；面包皮； 地壳"],["mantle","n. 披⻛；斗篷； 覆盖物； 地幔；v. 覆盖；遮盖"],["longitude","n. 经度"],["latitude","n. 纬度；行动或言论的程 度"],["horizon","n. 地平线；(思想等的) 范围；眼界"],["altitude","n. 海拔；高度"],["disast /* ---- 变形与匹配 ---- */
function forms(w){
 var f=[w,w+'s',w+'es',w+"'s",w+'ed',w+'ing',w+'ly'];
 if(/e$/.test(w)) f.push(w+'d', w.slice(0,-1)+'ing');
 if(/y$/.test(w)) f.push(w.slice(0,-1)+'ies', w.slice(0,-1)+'ied');
 if(/a$/.test(w)) f.push(w+'e');
 f.push(w+w.slice(-1)+'ing', w+w.slice(-1)+'ed');
 return f;
}
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') }
var RE={};
function build(ch){
 if(RE[ch]) return RE[ch];
 var list=CHS[ch]||[], fm=[], map={};
 for(var i=0;i<list.length;i++){
  var w=list[i][0], ws=forms(w);
  for(var j=0;j<ws.length;j++){
   var k=ws[j].toLowerCase();
   if(!map[k]){ map[k]={b:w, d:list[i][2]||0}; fm.push(ws[j]) }
  }
 }
 fm.sort(function(a,b){ return b.length-a.length });
 RE[ch]={re:new RegExp('(?<![A-Za-z])('+fm.map(esc).join('|')+')(?![A-Za-z])','gi'), map:map};
 return RE[ch];
}

/* ---- 渲染 ---- */
var used={};
function render(){
 var r=build(ch), ps=TXT[ch]||[], h='', i, k;
 used={};
 for(i=0;i<ps.length;i++){
  var p=ps[i], body='', bag={};
  var zh='';
  for(k=0;k<p.s.length;k++){
   var hz=[];
   var en=mark(p.s[k][0], r, bag, hz);
   var zz=zhMark(p.s[k][1], hz, gl(ch));
   body+='<span class="sn"><span class="en">'+en+'</span> <span class="zh">'+zz+'</span></span>';
   zh+=zz;
  }
  body='<div class="ps"><p class="pen">'+body+'</p><p class="pzh">'+zh+'</p></div>';
  var ws=Object.keys(bag);
  h+='<div class="pass" data-i="'+i+'" data-ws="'+ws.join('|')+'"><div class="ph"><span class="pn">'+('0'+(i+1)).slice(-2)+
     '</span><span class="pt">'+p.t+'</span><button class="say" data-say="'+i+'" title="朗读这一篇">'+
     ICON+'</button></div>'+body+
     (ws.length?'<div class="wlist">'+ws.map(function(w){ return '<span data-ww="'+w+'">'+w+'</span>' }).join('')+'</div>':'')+
     '<div class="qz"><button class="qbb" data-i="'+i+'">本篇小测</button>'+
     '<span class="qsc" data-q="'+i+'"></span></div>'+
     '</div>';
 }
 document.getElementById('list').innerHTML=h;
 cov();
}
function mark(t, r, bag, hits){
 return t.replace(r.re, function(m){
  var o=r.map[m.toLowerCase()];
  if(!o) return m;
  used[o.b]=1; bag[o.b]=1;
  if(hits && hits.indexOf(o.b)<0) hits.push(o.b);
  return '<mark class="pv'+(o.d?' dv':'')+'" data-w="'+o.b+'">'+m+'</mark>';
 });
}
/* ---- 中文里把对应的词也加粗 ---- */
var RAD={'\u2ecb':'车','\u2ed3':'长','\u2edb':'风','\u2edd':'食','\u2ee2':'马','\u2ec4':'西',
 '\u2ec5':'见','\u2ec6':'角','\u2ea0':'民','\u2ee3':'骨','\u2ed8':'青','\u2edc':'飞','\u2ee9':'黄',
 '\u2ed4':'门','\u2ee8':'麦','\u2ee5':'鱼','\u2ef0':'龙','\u2ee6':'鸟','\u2eec':'齐','\u2ec1':'虎',
 '\u2ee4':'鬼','\u2eee':'齿','\u2eda':'页','\u2ec9':'贝'};
function normCJK(s){ return s.replace(/[\u2E80-\u2FDF]/g, function(c){ return RAD[c]||c }) }
function glossFrags(mean){
 if(!mean) return [];
 var t=normCJK(String(mean)).replace(/[（(][^）)]*[）)]/g,' ').replace(/(v|n|adj|adv|prep|conj|int|num|pron|vt|vi|phrase|aux|art|abbr)\./g,' ');
 var out=[], segs=t.split(/[；;，,、\/|]/);
 for(var i=0;i<segs.length;i++){
  var s=segs[i].replace(/[\s.…]/g,'').replace(/某人|某物|某事/g,'');
  if(s.length>=2 && /[\u4e00-\u9fff]/.test(s)) out.push(s);
 }
 return out;
}
var GLM={};
function gl(ch){
 if(GLM[ch]) return GLM[ch];
 var m={}, L=CHS[ch]||[];
 for(var i=0;i<L.length;i++){ if(!L[i][2]) m[L[i][0]]=glossFrags(L[i][1]); }
 GLM[ch]=m; return m;
}
function zhMark(zh, hits, G){
 if(!zh||!hits||!hits.length) return zh;
 var spans=[], i, j, k;
 for(i=0;i<hits.length;i++){
  var fr=G[hits[i]]||[];
  var best=null;
  for(j=0;j<fr.length;j++){
   var f=fr[j], cands=[f];
   if(f.length>2){ cands.push(f.slice(0,2)); cands.push(f.slice(-2)); }
   for(k=0;k<cands.length;k++){
    var c=cands[k];
    if(c.length<2) continue;
    var p=zh.indexOf(c);
    if(p>=0 && (!best || c.length>best.sc)) best={s:p,e:p+c.length,sc:c.length};
   }
  }
  if(best) spans.push(best);
  else if(fr.length && !/[的地性化度者]$/.test(fr[0])){
   var ch0=fr[0].charAt(0);
   if(ch0 && '而就都也又还在是有把被让使对给从向跟和与或的地得着了过们'.indexOf(ch0)<0
      && zh.split(ch0).length===2){ spans.push({s:zh.indexOf(ch0),e:zh.indexOf(ch0)+1,sc:1}); }
  }
 }
 if(!spans.length) return zh;
 spans.sort(function(x,y){ return y.sc-x.sc || x.s-y.s });
 var keep=[];
 for(i=0;i<spans.length;i++){
  var sp=spans[i], ok=1;
  for(j=0;j<keep.length;j++){ if(sp.s<keep[j].e && keep[j].s<sp.e){ ok=0; break; } }
  if(ok) keep.push(sp);
 }
 keep.sort(function(x,y){ return x.s-y.s });
 var out='', last=0;
 for(i=0;i<keep.length;i++){
  out+=zh.slice(last,keep[i].s)+'<b class="zw">'+zh.slice(keep[i].s,keep[i].e)+'</b>';
  last=keep[i].e;
 }
 return out+zh.slice(last);
}
function cov(){
 var heads=(CHS[ch]||[]).filter(function(e){ return !e[2] });
 var tot=heads.length, u=0, i;
 for(i=0;i<heads.length;i++) if(used[heads[i][0]]) u++;
 var pct=tot?Math.round(u*100/tot):0;
 var miss=heads.filter(function(e){ return !used[e[0]] });
 document.getElementById('cov').innerHTML=
  '<div class="cv1"><span>本章 <b>'+tot+'</b> 词 · 短文里用到了 <b>'+u+'</b> 个（'+pct+'%）</span>'+
  '<span id="qsum" style="margin-left:auto;color:var(--ink2)"></span>'+
  '<span>共 '+(TXT[ch]||[]).length+' 篇</span></div>'+
  '<div class="cvp"><i style="width:'+pct+'%"></i></div>'+
  (miss.length?'<details><summary>还有 '+miss.length+' 个词没进短文，点开看</summary><div class="left">'+
   miss.map(function(e){ return '<span title="'+e[1].replace(/"/g,'&quot;')+'">'+e[0]+'</span>' }).join('')+
   '</div></details>':'');
 if(typeof qstat==='function') qstat();
}

var RT={on:false, q:[], n:0, b:null};
function canSpeak(){ return typeof speechSynthesis!=='undefined' }
function stop(){ if(RT.on&&canSpeak()) speechSynthesis.cancel();
 RT.on=false; var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.b){ RT.b.classList.remove('on') } RT.b=null; paintRead() }
function paintRead(){ var b=document.querySelector('.acts button[data-a="read"]');
 if(b&&!RT.on) b.textContent='朗读' }
function step(){
 if(!RT.on) return;
 var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.n>=RT.q.length){ stop(); return }
 var node=RT.q[RT.n]; node.classList.add('cur');
 var y=node.getBoundingClientRect().top;
 if(y<70||y>innerHeight-100) node.scrollIntoView({block:'center',behavior:'smooth'});
 var u=new SpeechSynthesisUtterance(node.querySelector('.en').textContent);
 u.lang='en-GB'; u.rate=parseFloat(get(RATE,'0.95'))||0.95;
 u.onend=function(){ RT.n++; step() };

}

var QK='vj-quiz';
var QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};

function qrec(){ return J(QK,{}) }
function usable(w){ var m=TT.m[w]||''; return !!m && !/的衍生词$/.test(m) }
function posOf(m){ var x=(m||'').match(/^([a-z]+)\./); return x?x[1]:'' }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
function hesc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

function qPool(word, mean){
 var list=CHS[ch]||[], same=[], all=[], i, e;
 for(i=0;i<list.length;i++){
  e=list[i];
  if(e[0]===word||!usable(e[0])) continue;
  all.push(e[0]);
  if(posOf(e[1])===posOf(mean)) same.push(e[0]);
 }
 return same.length>=3? same : all;
}

function findSent(p, w){
 var fs=forms(w).map(function(x){ return x.toLowerCase() }), k, j;
 for(k=0;k<p.s.length;k++){
  var t=p.s[k][0], m=t.match(/[A-Za-z][A-Za-z'’-]*/g)||[];
  for(j=0;j<m.length;j++){
   if(fs.indexOf(m[j].toLowerCase())>-1) return {t:t, zh:p.s[k][1], form:m[j]};
  }
 }
 return null;
}

function inText(w, text){
 var fs=forms(w), i;
 for(i=0;i<fs.length;i++){
  if(new RegExp('(?<![A-Za-z])'+esc(fs[i])+'(?![A-Za-z])','i').test(text)) return true;
 }
 return false;
}
function optsFor(word, mean, type, ban){
 var pool=shuffle(qPool(word, mean)), out=[], seen={}, i, txt, pass;
 var right=(type==='e2z')? mean : word;
 out.push(right); seen[right]=1;
 for(pass=0;pass<2&&out.length<4;pass++){
  for(i=0;i<pool.length&&out.length<4;i++){
   if(pass===0 && ban && type!=='e2z' && inText(pool[i], ban)) continue;
   txt=(type==='e2z')? (TT.m[pool[i]]||'') : pool[i];
   if(!txt||seen[txt]) continue;
   seen[txt]=1; out.push(txt);
  }
 }
 return shuffle(out);
}

function qStart(i){
 var pass=document.querySelector('.pass[data-i="'+i+'"]');
 if(!pass) return;
 qClose();
 var ps=TXT[ch][i]; if(!ps) return;
 var ws=(pass.getAttribute('data-ws')||'').split('|').filter(function(w){ return w&&usable(w) });
 if(!ws.length){ toast('这一篇没有可以测的词'); return }
 shuffle(ws);
 var cnt = ws.length<=3? ws.length : (ws.length>=10?5:4);
 ws=ws.slice(0, cnt);
 var pat=['c','e2z','z2e','c','z2e'], qs=[];
 for(var k=0;k<ws.length;k++){
  var w=ws[k], mean=TT.m[w]||'';
  var s=(w.indexOf(' ')>=0)? null : findSent(ps, w);
  var type=pat[k]||'e2z';
  if(type==='c'&&!s) type='e2z';
  var q={w:w, m:mean, type:type, sent:s, picked:-1};
  if(type==='c'){
   q.zh=s.zh; q.form=s.form;
   q.blank=hesc(s.t).replace(new RegExp('(?<![A-Za-z])'+esc(s.form)+'(?![A-Za-z])'),
     '\u0001').replace('\u0001','<span class="blank"></span>');
   if(q.blank.indexOf('class="blank"')<0) type='e2z';
   q.fill=hesc(s.t).replace(new RegExp('(?<![A-Za-z])('+esc(s.form)+')(?![A-Za-z])'), '<b>$1</b>');
  }
  q.type=type;
  q.ans=(type==='e2z')? mean : w;
  q.opts=optsFor(w, mean, type, type==='c'? s.t : null);
  if(q.opts.indexOf(q.ans)<0) q.opts[0]=q.ans;
  qs.push(q);
 }
 QZ={p:i, qs:qs, n:0, ok:0, bad:[], done:false};
 var box=document.createElement('div'); box.className='qzbox';
 pass.appendChild(box);
 qRender();
}

function qRender(){
 if(QZ.p<0) return;
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox');
 if(!box) return;
 var total=QZ.qs.length, head;
 if(QZ.done){
  var tip = QZ.bad.length? ('不太熟的 <b>'+QZ.bad.length+'</b> 个词已经收进生词本，复习时会再见到')
                        : '全对，这一篇的词基本认住了';
  box.innerHTML='<div class="qh"><span class="qn2">完成</span><span>本篇小测</span>'+
   '<button class="qclose">收起</button></div>'+
   '<div class="qdone">答对 <b>'+QZ.ok+'</b> / '+total+' · '+tip+'</div>'+
   (QZ.bad.length? '<div class="qbad">'+QZ.bad.map(function(w){
     return '<span data-ww="'+w+'">'+w+'</span>' }).join('')+'</div>' : '')+
   '<div class="qf"><button class="prim qagain">再测一遍</button><button class="qclose">收起</button></div>';
  return;
 }
 var q=QZ.qs[QZ.n];
 var tags={c:'看句子填词', e2z:'选中文释义', z2e:'选英文单词'};
 head='<div class="qh"><span class="qn2">'+(QZ.n+1)+'/'+total+'</span><span>'+tags[q.type]+'</span>'+
  '<button class="qclose">收起</button></div>';
 var body;
 if(q.type==='c'){
  body='<div class="qq">'+q.blank+
   (document.body.classList.contains('nozh')?'':'<span class="qzh">'+hesc(q.zh)+'</span>')+'</div>';
 } else if(q.type==='e2z'){
  body='<div class="qq"><b class="qw">'+hesc(q.w)+'</b></div>';
 } else {
  body='<div class="qq"><b class="qw">'+hesc(q.m)+'</b></div>';
 }
 var opts='<div class="qo">'+q.opts.map(function(x,k){
  return '<button data-o="'+k+'"><span class="oi">'+'ABCD'.charAt(k)+'</span>'+hesc(x)+'</button>' }).join('')+'</div>';
 box.innerHTML=head+body+opts+'<div class="qf"></div>';
}

function qAnswer(btn){
 if(QZ.p<0||QZ.done) return;
 var q=QZ.qs[QZ.n]; if(!q||q.picked>=0) return;
 var k=+btn.getAttribute('data-o');
 var ok=(q.opts[k]===q.ans);
 q.picked=k;
 if(ok) QZ.ok++; else { QZ.bad.push(q.w); addBook(q.w) }
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox'); if(!box) return;
 var bs=box.querySelectorAll('.qo button');
 for(var i=0;i<bs.length;i++){
  if(q.opts[i]===q.ans) bs[i].classList.add('ok');
  else if(i===k) bs[i].classList.add('no');
  else bs[i].classList.add('dim');
 }
 var sy=(TT.s&&TT.s[q.w])||'';
 var fb=(ok?'<span class="qy">✓ 对了</span>':'<span class="qn">✗ 错了</span>');
 if(q.type==='c'){
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
  if(q.sent.form.toLowerCase()!==q.w.toLowerCase())
   fb+='<i>（原句用的是 '+hesc(q.sent.form)+'）</i>';
  if(!ok) fb+='<span class="qzh">'+(q.fill||hesc(q.sent.t))+'<br>'+hesc(q.sent.zh)+'</span>';
 } else {
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
 }

 if(sy) fb+='<span class="qzh">同义替换：'+hesc(sy)+'</span>';
 fb+='<button class="prim qnext">'+(QZ.n+1<QZ.qs.length?'下一题':'看结果')+'</button>';
 box.querySelector('.qf').innerHTML=fb;
}

function qNext(){
 if(QZ.p<0||QZ.done) return;
 QZ.n++;
 if(QZ.n>=QZ.qs.length){
  QZ.done=true;
  qsave(QZ.p, QZ.ok, QZ.qs.length);
  qRender(); qstat();
  if(QZ.bad.length) toast('答错 '+QZ.bad.length+' 个，已收进生词本');
  return;
 }
 qRender();
}

function qsave(i,r,n){
 var o=qrec(); if(!o[ch]) o[ch]={};
 o[ch][i]={r:r, n:n, t:Date.now()};
 set(QK, JSON.stringify(o));
}

function qstat(){
 var o=(qrec()[ch])||{}, k=0, r=0, n=0, i;
 for(i in o){
  if(!o[i]) continue;
  k++; r+=o[i].r||0; n+=o[i].n||0;
  var e=document.querySelector('.qsc[data-q="'+i+'"]');
  if(e) e.innerHTML='<b>'+o[i].r+'/'+o[i].n+'</b> 正确';
  var b=document.querySelector('.qbb[data-i="'+i+'"]');
  if(b) b.textContent='再测';
 }
 var sum=document.getElementById('qsum');
 if(sum) sum.innerHTML = k? ('已测 <b>'+k+'</b>/'+(TXT[ch]||[]).length+' 篇 · 平均 '+
   Math.round(r*100/Math.max(1,n))+'%') : '';
}

function qClose(){
 var b=document.querySelector('.qzbox');
 if(b&&b.parentNode) b.parentNode.removeChild(b);
 QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};
}
document.getElementById('zhbtn').classList.add('on');
chips();
document.getElementById('cttl').innerHTML='Unit '+('0'+ch).slice(-2)+' <em>'+TT[ch]+'</em>';
render();
</script>
</body></html>
