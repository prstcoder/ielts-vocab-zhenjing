nciled in 2011, and neither will say what changed.","两兄弟 2011 年和解了,谁都不肯说是哪一点变了。"],["Most people obey the rule and a few succumb to the fine, and the penalty is the same either way.","大多数人守规矩,少数人认罚交钱了事,而两种情况下处罚是一样的。"],["It was a fine, in both senses, and he paid it with a fine.","这是一笔罚款,也是一件挺好的事,他交得挺爽快。"]]},{"t":"What Is Yours","s":[["The mortgage runs for twenty five years and the ownership never feels real until the last payment.","按揭要还二十五年,而所有权要到最后一笔付完才觉得是真的。"],["Copyright lasts seventy years after the writer dies, which is longer than the paper lasts.","版权在作者去世后还有七十年,比纸的寿命长。"],["It is a privilege to be asked, and it is also unpaid work.","被请去做是种荣幸,也是白干。"],["The school is accredited by an office nobody has heard of.","这所学校由一个没人听说过的机构认证。"],["The clue was in the first paragraph, and it was not much of one.","线索在第一段,而且算不上什么线索。"],["Access to the file is restricted, so you need a reason and a name.","这份档案不是谁都能看,你得有理由,还得有个名字。"],["The letter was anonymous, and anonymous letters are false about half the time.","那封信是匿名的,而匿名信有一半是假的。"],["A genuine signature is worth more than a false stamp, and everybody in the room knew it.","真签名比假印章值钱,屋里每个人都知道。"]]},{"t":"Procedure and Asking","s":[["The procedure is four steps and the routine is the same four steps every Monday.","程序是四个步骤,而常规是每个周一都走这四个步骤。"],["The consequence of being late is a letter, and the consequence of ignoring the letter is a fine.","迟到的后果是一封信,而不管那封信的后果是罚款。"],["They demand an answer and request a meeting, and they require both by Friday.","他们要求答复,请求会面,而且两件都要求周五前办完。"],["Three hundred people signed the petition, which is more than the office expected.","三百人在请愿书上签了名,比那个机关预想的多。"],["A command is an order from above, and to instruct somebody is to write the same order down politely.","命令是上面直接下来的话,而指示是把同样的话客气地写下来。"]]}],"18":[{"t":"The First Room","s":[["The first room is about violence, and the sign says so without any decoration.","第一个展厅讲的是暴力,牌子就这么写着,没有任何修饰。"],["A conflict begins with two people who will not move, and it ends when one of them does.","冲突从两个都不肯动的人开始,其中一个动了,它才结束。"],["A raid is short and a campaign is long, and both are planned by people who never go.","突袭很短,战役很长,两个都由不去的人策划。"],["There was a battle here in 1415, and the field is a car park now.","1415 年这里打过一场仗,那片地现在是停车场。"],["The struggle lasted nine years, and the museum gives it one wall.","那场斗争持续九年,博物馆给了它一面墙。"],["An explosion is loud for a second and quiet for fifty years.","爆炸响一秒钟,然后安静五十年。"],["The enormity of it is not in the noise, and that is what the room is trying to say.","这件事的可怕之处不在响声里,而这正是这个展厅想说的。"]]},{"t":"What Flew and What Fell","s":[["They bombarded the town for three days, and a bomb is the thing that does it.","他们炮轰那座城三天,炸弹就是干这件事的东西。"],["A blast breaks the windows two streets away, and a burst of it is what the witness remembers.","一次爆炸震碎两条街外的窗子,而目击者记住的是那一下爆开。"],["A spark set off the gunpowder, and the whole store went up at once.","一点火星引着了火药,整个仓库一次炸光。"],["A tank came down the road and a cannon came behind it, and both were slower than the men on foot.","坦克沿路开来,后面跟着一门大炮,两个都比走着的人慢。"],["A missile is fired from far away, and a rifle is fired from a hundred paces.","导弹从很远的地方发射,步枪从一百步外打。"],["A bullet will deflect off a stone and hit the man beside you, which is why nobody stands behind one.","子弹会打石头弹开,击中你旁边的人,所以没人站在石头后面。"],["A pistol fits in a pocket, a weapon is any of them, and the target is whoever is in front.","手枪能装口袋,武器是这全部的统称,而目标是站在前面的那个人。"],["The flame of a match will flare up twice and then glow, and the glitter in the glass is only a reflection, and the twinkle of it is only the light.","火柴的火苗先旺两下,然后变成暗红;玻璃里那点闪光只是反光。"]]},{"t":"Blades and Armour","s":[["A blade, a sword and an ax are all edge, and the difference is how you hold them.","刀刃、剑、斧,都是刃,区别在你怎么握着它。"],["A hammer was a tool before it was a weapon, and an arrow was a hunting thing first.","锤子先是工具,后来才是武器;箭先是打猎的东西。"],["A spear is older than the wheel and simpler than either.","矛比轮子老,也比两个都简单。"],["The helmet is dented on the left, and the shield beside it has a hole you could put a thumb through.","头盔左边凹了一块,旁边的盾上有个洞,大拇指能伸过去。"],["Every army is equipped by somebody, prepared in a month and provided for by people who never see it.","每支军队都有人给装备,一个月内准备妥当,由从没见过它的人供养。"],["They will deploy on the ridge at dawn, and the map on the wall shows the ridge.","他们天亮时部署在山脊上,墙上的地图就画着那道山脊。"],["You hit with the flat, beat with the handle, strike with the edge and punch with the fist.","用平面打,用柄敲,用刃劈,用拳头揍。"],["A chop is a blow downwards, a stab is one forwards, and a mission is the reason for both.","砍是往下,刺是往前,而任务就是这两下的理由。"]]},{"t":"The Hard Choice","s":[["The dilemma is that both roads are wrong, and the plight of the people on them is worse.","两难在于两条路都错,而路上那些人的处境更糟。"],["There is a pitfall in every plan, and the one nobody saw is the one that matters.","每个计划都有个坑,而没人看见的那个才要紧。"],["A conspiracy needs three people and one of them will talk.","阴谋要三个人,而其中一个一定会说出去。"],["The refugees arrived destitute, with nothing but what they could carry.","难民到时一无所有,只有身上拿得动的那点东西。"],["A famine is not one bad harvest, it is three.","饥荒不是一次歉收,是三次。"],["The village was starved out in the second winter, and the word is exact.","村子在第二个冬天被饿垮了,这个词用得很准。"],["They were deprived of water for four days, and a man will trade anything for a cup.","他们断了四天水,而一个人会为一杯水换掉任何东西。"],["One side will seize the bridge, and the other will pursue them to the river.","一边会夺取那座桥,另一边会把他们追到河边。"],["A threat does not have to be carried out to work, and that is the whole point of it.","威胁不必真的实施就有效,这正是它的用处。"],["He did not mean to offend anyone, and he offended the whole room.","他没想冒犯谁,结果冒犯了满屋子人。"]]},{"t":"Crossing the Line","s":[["An aggressive move is one you make before the other side is ready, and it works once.","侵略性的一步是在对方没准备好的时候走的,而且只灵一次。"],["They invaded in June and were gone by December, and nobody has forgotten either date.","他们六月入侵,十二月就撤了,两个日子都没人忘。"],["To trespass is to walk on it without permission, and to intrude is to walk in.","非法侵入是没经允许就走上那块地,而闯入是走进屋里。"],["The treaty was violated twice before anybody wrote it down.","条约在被记录之前就被违反过两次。"],["An attack can be a word, an assault is always a hand, and a challenge is a question.","攻击可以是一句话,袭击一定是动手,而挑战是一个问题。"],["The siege lasted four months, and the city was surrounded by the third week.","围城持续四个月,到第三周城就被围住了。"],["They enclosed the field with a wall, and the wall is still there.","他们用墙把那块地围了起来,墙如今还在。"]]},{"t":"Stopping It","s":[["A pause lasts a minute and a halt lasts a day, and a cease lasts until somebody breaks it.","暂停一分钟,停顿一天,而停止一直持续到有人打破它。"],["They will oppose the plan in public and support it in the corridor.","他们公开反对这个计划,在走廊里却支持。"],["A regime that oppresses its own people is doing the work of its enemies.","压迫自己人的政权,干的是敌人的活。"],["He countered with an argument nobody understood, and it worked.","他用一个谁也没听懂的论点反驳,居然管用。"],["A wall will deter a thief and a sign will not.","一堵墙能吓阻小偷,一块牌子不能。"],["The rules forbid it, the law prohibits it, and people do it on Sundays.","规定禁止它,法律禁止它,而人们周日照做。"],["A fence prevents nothing and a guard prevents a little, and both are cheaper than a wall.","一道篱笆什么也拦不住,一个守卫能拦一点,两个都比墙便宜。"]]},{"t":"Turning","s":[["A revolt begins in a market and ends in a palace, and the market always remembers it longer.","叛乱从集市开始,在宫殿结束,而集市记得更久。"],["He will betray the plan to the other side, and the treason is in the word he used.","他把计划出卖给了另一边,而叛国罪就藏在他用的那个词里。"],["A rebel is a patriot from the other side of the line, and both words are on the same wall.","造反的人,是界线另一边的爱国者,而两个词挂在同一面墙上。"],["A traitor is what the winners call him, and a patriot is what the losers call him.","赢的人叫他叛徒,输的人叫他爱国者。"],["Nobody blamed the officer and everybody reproached the clerk, which is how it usually goes.","没人责怪军官,人人都责备那个职员,事情通常是这样的。"],["There is evidence of a meeting and proof of nothing, and the two are not the same word.","有开过会的证据,却什么也证明不了,这两个不是一回事。"]]},{"t":"Fear","s":[["Terror is a night, and a terror is a thing you cannot name.","恐惧是一个夜晚,而可怕的东西是你叫不出名字的那样。"],["The film was terrible in the old sense and terrific in the new one, and it was also horrible.","那部电影是旧义上的\"可怕\",也是新义上的\"极好\",同时还\"很糟\"。"],["The alarm went at three, and everybody stood in the street in a coat.","警报三点响,大家都披着外套站在街上。"],["She dreaded the letter and read it anyway, because not knowing is worse.","她怕那封信,还是读了,因为不知道更糟。"],["The noise will frighten a horse and not a man, and the man is the one who runs.","这声音会吓到马,不会吓到人,而跑的是人。"],["The tension in the room was worse than the argument, and it lasted longer.","屋里的紧张比争吵本身更难受,也持续得更久。"],["It was a turbulent year and a time of turmoil, and the two words describe the same weather.","那是动荡的一年、混乱的一段,两个词说的是同一种天气。"],["The scenario they planned for was not the one that happened, which is normal.","他们设想过的情况不是实际发生的那个,这是常事。"],["It was an occasion for a speech, and nobody could think of one.","那是个适合讲话的场合,而谁也想不出讲什么。"],["There is a limit to what a person will carry, and a boundary beyond which nobody follows.","一个人能扛的有上限,也有一条界线,过了就没人跟。"],["He kept a rein on his temper for two hours and then lost it in a minute.","他把脾气勒了两个小时,然后一分钟里全放了。"]]},{"t":"Rivals","s":[["Two shops will compete for the same street and both will blame the other for the rent.","两家店会为同一条街竞争,然后互相把房租怪到对方头上。"],["A contest has a winner, a dispute has a loser, and the second one lasts longer.","比赛有赢家,争执有输家,而后者拖得更久。"],["They contend that the road is theirs, and the map says otherwise.","他们主张这条路是他们的,而地图上不是这么画的。"],["A rival is the one you know, and a competitor is the one you do not.","对手是你认识的那个,而竞争者是你还不认识的那个。"],["An enemy is a rival you have stopped talking to.","敌人是已经不再说话的对手。"],["The strategy is four pages and the tactic is one sentence.","战略四页,战术一句话。"],["The manoeuvre worked twice and then everybody had seen it.","这个动作灵了两次,然后所有人都看过了。"],["The blueprint was drawn in 1962, and the building is still not finished.","蓝图 1962 年就画好了,而楼至今没盖完。"],["They warned him twice, compelled him once and obliged him in the end.","他们警告他两次,强迫他一次,最后逼得他不得不做。"],["Three hundred people came to protest, and the speech refuted nothing.","三百人来抗议,而那番讲话什么也没驳倒。"]]},{"t":"Force","s":[["Might is what you have and force is what you use, and neither lasts after the last soldier.","实力是你有的,武力是你用的,两个都撑不过最后一个兵。"],["They reinforced the wall in March and impaired the road in doing it.","他们三月加固了墙,顺手把路弄坏了。"],["Nothing can mitigate a bad decision except a better one.","除了一个更好的决定,没什么能减轻一个坏决定。"],["The only comfort was that it could not get worse, and it did.","唯一的安慰是不会更糟,结果更糟了。"]]},{"t":"What Happens","s":[["An event is on the calendar, and what happens is not.","事件是写在日程上的,而真正发生的事不是。"],["It does not matter who fired first, and it mattered to everybody for fifty years.","谁先开的枪并不要紧,而在五十年里对每个人都要紧。"],["The same thing will happen again, and it will occur in the same month.","同样的事还会发生,而且会在同一个月发生。"],["The attack was savage and the retreat was worse, and both were reckless.","进攻很凶,撤退更糟,两个都鲁莽。"],["A fierce fight lasts ten minutes and a foul one lasts in the memory.","激烈的打斗十分钟就完,而卑劣的那种会留在记忆里。"],["Evil is a word people use when they have stopped explaining, and the devil is the same word with a face.","邪恶是人们不再解释时才用的词,而魔鬼是同一个词加上一张脸。"]]},{"t":"After","s":[["The punishment was a year and the crime was an afternoon, and nobody thought it was fair.","惩罚是一年,罪是一个下午,没人觉得公平。"],["They will execute one man and hang nobody, and the square is a car park now.","他们处死一个人,没有绞死谁,而那片广场现在是个停车场。"],["A sacrifice is only a sacrifice if it was not necessary, and that is the argument.","只有本来不必的才叫牺牲,争论就在这里。"],["The casualty figures were released in 1998, and they were higher than the ones in 1918.","伤亡数字 1998 年才公布,比 1918 年公布的那个还高。"],["They buried him in the field and put a stone there in 1950.","他们把他葬在那片地里,1950 年又立了一块石头。"],["The funeral was on a Tuesday and the grave is still tended.","葬礼在周二,而墓至今有人照看。"],["The tomb is empty, and the story of what happened to him has three versions.","墓是空的,而关于他遭遇的说法有三个版本。"],["The prisoner said he had been in hell for two years, and nobody argued.","那个囚犯说他在里头待了两年地狱,没人反驳。"]]},{"t":"At Sea and in the Air","s":[["The maritime museum is in the old dock, and the naval one is next door.","海事博物馆在旧码头,海军那个在隔壁。"],["The fleet left in May and came back with half of it.","舰队五月出发,回来时只剩一半。"],["A troop of soldiers walked through the town at six, and nobody looked out of the window.","一队士兵六点穿过镇子,没人往窗外看。"],["The landing was at night and the beach was empty by morning.","登陆在夜里,到早上滩上已经没人。"],["A helicopter will hover over the field for an hour and then leave.","直升机会在田上盘旋一个小时,然后走。"],["They will proceed along the coast and make little progress in the first week.","他们会沿着海岸推进,第一周几乎没什么进展。"],["Military spending is a third of the budget, and the nuclear programme is most of that.","军费占预算三分之一,而核计划占了其中大部分。"]]},{"t":"The Cost","s":[["The water was poisoned for a hundred years, and the field still grows nothing.","水被毒了一百年,那块田至今什么都不长。"],["The storm will devastate the coast and nobody will rebuild it twice.","风暴会毁掉海岸,而没人会重建第二次。"],["The risk was worth it to them and not to the men underneath.","这个风险对他们值得,对底下那些人不是。"],["It was an adventure for the first week and a peril after that.","第一周是冒险,之后就是险境。"],["A catastrophe is a disaster with paperwork, and the paperwork takes ten years.","大灾难是带公文手续的灾难,而手续要办十年。"],["The roof will collapse under snow, and the wall beside it will not fall.","屋顶会在雪下塌掉,旁边的墙不会倒。"],["They tortured him for two days to humiliate him, and got nothing, and the shame outlasted the bruises.","他们拷问他两天,为的是让他丢脸,结果什么也没得到,而羞辱比伤留得久。"],["The damage was to the windows, and the noise was more harmful than the glass.","损坏在窗上,而噪音比玻璃更伤人。"],["The report did not mislead anybody who read the second page.","读过第二页的人,都不会被这份报告误导。"],["Do not disturb the meeting and do not interfere with the vote.","别打扰会议,也别干预投票。"],["A dog will interrupt a conversation and a phone will end one.","狗会打断谈话,而一通电话会结束它。"]]},{"t":"Backwards","s":[["They began to shrink the line in March and to withdraw in June.","他们三月开始收缩战线,六月开始撤。"],["The wall was built to withstand a flood, and it withstood one in 1998.","那道墙是照着抗洪修的,1998 年它扛住了一次。"],["A compromise is what you call it when you have given away half.","妥协是你让掉一半之后给这件事起的名字。"],["They surrendered at four in the afternoon, and the town was quiet by five.","他们下午四点投降,到五点镇上就安静了。"],["Two men escaped over the wall, and the third could not avoid the dogs.","两个人翻墙逃了,第三个躲不过那些狗。"],["He quit in June, abandoned the house in July and forgot it by August.","他六月不干了,七月弃了那栋房子,到八月就忘了。"],["She will forgo the fee, discard the plan and be rid of the whole thing by Friday.","她不要那笔钱,扔掉那个计划,到周五就把整件事甩干净。"]]},{"t":"Holding","s":[["They defended the bridge for six days and then blew it up themselves.","他们守了那座桥六天,然后自己把它炸了。"],["A rule is there to safeguard the weakest, and it does not always.","规则是为了保护最弱的人,而它并不总做到。"],["The first attack was defeated and the second was not resisted at all.","第一次进攻被打退,第二次根本没被抵抗。"],["One side will capture the hill in the morning and lose it before dark.","一方早上夺下山头,天黑前又丢了。"],["The victory took four hours, and the triumph took a week of parades.","胜利用了四个钟头,而凯旋用了一个星期的游行。"],["You can conquer a city in a month and never conquer the people in it.","一座城一个月能征服,里面的人永远征服不了。"],["There is a monument at the corner and a tablet with forty names on it.","街角有一座纪念碑,碑上刻着四十个名字。"],["There is a statue of him in the square, and a medal in a drawer at home.","广场上有他的雕像,家里抽屉里有一枚勋章。"],["The honour was the parade, and the week was glorious, and by the next one nobody mentioned it.","荣誉是那场游行,那个星期也确实光辉,到再下一个星期就没人提了。"]]},{"t":"Given and Owed","s":[["Everybody contributed something, and two families gave more than the rest.","每个人都出了点东西,有两家比别人多。"],["She devoted thirty years to the archive and never asked for a room with a window.","她把三十年投在档案上,从没要过一间有窗的屋子。"],["The town owes him nothing and remembers him anyway.","镇子不欠他什么,却还是记得他。"],["A patrol goes out at six and a guard stays at the gate all night.","巡逻队六点出去,守卫在门口站一整夜。"],["The netting was camouflage for the gun, and everybody could see the gun.","那张网是给炮做伪装的,而所有人都看得见那门炮。"],["The obstacle was not the river, it was the paperwork for the bridge.","障碍不是那条河,而是修桥要办的手续。"],["A rabbit will burrow under the wire and be gone by morning.","兔子会在铁丝底下打洞,到早上就没影了。"],["A spy sends one message a month, and a scout goes out and comes back.","间谍一个月发一次消息,而侦察兵出去再回来。"],["The general arrived in June and left the soldier to explain it.","将军六月到了,又走了,留下士兵来解释。"],["The veteran comes on Sundays and tells the same story to whoever is standing there.","那位老兵每周日来,把同一个故事讲给站在那儿的人听。"]]}],"19":[{"t":"First and Next","s":[["A pioneer goes first and takes the risk.","先驱走在最前面,承担风险。"],["A prophet says what will happen, and is not believed.","先知说出将要发生的事,却没人信。"],["A herald only announces it.","传令官只负责宣布。"],["An heir waits for the money, and a successor waits for the job.","继承人等的钱,继任者等的位子。"],["A generation waits for the rest of them to stop.","一代人等着其余的人停下来。"]]},{"t":"Family Names","s":[["A surname is shared; a gender is not chosen.","姓氏是共有的;性别不是选的。"],["Sex is the body, and female is one side of it.","sex 是身体,而 female 是其中的一边。"],["A couple lives together; a spouse is the word a form uses.","一对伴侣住在一起;而配偶是表格上用的词。"],["A husband, a grandfather and a father-in-law are three different relations.","丈夫、祖父和岳父,是三种不同的关系。"],["A sibling is a brother or a sister; a cousin is further out.","sibling 是兄弟姐妹;表亲更远一层。"],["A nephew and a niece are one generation down.","侄子和侄女是往下一辈。"]]},{"t":"The Very Young","s":[["Twins begin as an embryo and arrive as an infant.","双胞胎从胚胎开始,以婴儿到来。"],["An orphan has no parents, and a juvenile is young in the eyes of the law.","孤儿没有父母,而 juvenile 在法律眼里是年幼的。"],["A youngster, a youth and a teenager are the same age with different patience.","少年、青年和青少年,是同一年龄,耐心不同。"],["Adolescence is the decade that feels like a week.","青春期是感觉像一周的十年。"],["A gang is a group that will not let you out.","帮派是一个不让你出去的群体。"]]},{"t":"Kin and Folk","s":[["Kin are the ones you cannot avoid.","亲属是你躲不开的那些人。"],["Folk is a warmer word for a lot of them.","folk 是更暖的说法,指一大堆这样的人。"],["A relative is anyone on the family tree.","亲戚是家谱上的任何人。"]]},{"t":"Close to You","s":[["To be intimate is to know the small things.","亲密是知道那些小事。"],["A dear friend is old, and a darling is new.","dear 的朋友是旧的,而 darling 是新的。"],["A lover and a beloved are the same person seen from two sides.","爱人和被爱的人,是同一个人从两面看。"],["Madam is a title, and a hostess is a job.","madam 是称呼,而女主人是一份活儿。"],["A landlady owns the rooms, and a mistress owns the secrets.","女房东拥有房间,而情妇拥有秘密。"],["A housewife works where nobody clocks in.","家庭主妇在没有打卡机的地方工作。"],["A widow has outlived; a maid and a maiden are old words for being young and unmarried.","寡妇活过了他;而女仆和少女是“年轻未婚”的旧说法。"]]},{"t":"In the House","s":[["A household is everyone under one roof.","一家人是同一个屋顶下的所有人。"],["A chore is small, repeated and nobody's idea.","家务琐事是很小、不断重复、没人想出来的事。"],["A host gives, and a guest receives.","主人给,客人受。"],["A landlord owns it, and a tenant pays for it.","房东拥有它,而房客为它付钱。"],["A customer buys once; a client comes back.","顾客买一次;客户会回来。"]]},{"t":"Meeting and Missing","s":[["An encounter is not planned; an appointment is.","相遇不是计划好的;约会是的。"],["To chase is to run after it, and to miss is to arrive late.","追是在后面跑,而错过是到晚了。"],["To accompany is to walk beside.","陪同是走在旁边。"],["A dependent cannot manage alone.","受抚养的人无法独自应付。"]]},{"t":"The Wedding","s":[["To propose is to ask the question, and an engagement is the wait for the answer to become a date.","求婚是问那个问题,而订婚是等答案变成日期。"],["To marry is one day; a wedding is the same day with guests.","结婚是一天;婚礼是同一天加上客人。"],["A honeymoon is the week you do not answer the phone.","蜜月是你不接电话的那一周。"],["To kiss is the shortest ceremony.","亲吻是最短的仪式。"],["To divorce is to undo it; to separate is to stop before undoing it.","离婚是把它撤销;分居是撤销之前先停住。"]]},{"t":"One and Only","s":[["Single means not married; sole means only one.","single 指未婚;sole 指只有一个。"],["Respective means each in their own order.","各自的指按各自的顺序。"],["Each is one by one, and an individual is one on their own.","each 是一个一个,而个人是单独的一个。"]]},{"t":"Around You","s":[["A commuter goes there and back every day.","通勤者每天来回。"],["A neighbourhood is what you call a place when you live in it.","街区是你住进去之后对那个地方的称呼。"],["A member belongs, and a boss decides.","成员属于,而老板决定。"],["A manager runs it, a supervisor watches it, and a subordinate does it.","经理管它,主管盯它,而下属做它。"],["A partner shares it, a colleague works beside you, and a comrade shares the fight.","合伙人分享它,同事在你旁边干活,而同志共担这场仗。"],["An acquaintance knows your name, and a friendship knows your habits.","熟人知道你名字,而友谊知道你的习惯。"],["Affection is quieter than love and lasts longer.","喜爱比爱安静,也活得更久。"],["A stranger knows neither.","陌生人两样都不知道。"]]},{"t":"Titles","s":[["An apprentice learns by doing, and a deputy does when the other cannot.","学徒边做边学,而副手在别人不能时顶上。"],["A hero and a heroine are the same courage with two spellings.","男英雄和女英雄,是同一种勇气,两种拼法。"],["An actress acts, a director decides, and a proponent argues for it.","女演员演,导演决定,而支持者替它争辩。"],["A committee talks, and a council decides.","委员会讨论,而理事会决定。"],["A delegate speaks for others, and a specialist knows one thing well.","代表替别人说话,而专家把一件事知道得很透。"],["A consultant is paid for the opinion.","顾问是靠意见拿钱的。"],["A veterinary treats animals, and a counsellor treats the rest.","兽医治动物,而咨询师治其余。"],["A solicitor writes, and an attorney speaks in court.","事务律师写,而辩护律师在庭上说。"]]},{"t":"Jobs and Hands","s":[["An umpire has no side.","裁判不站边。"],["A cashier counts, a fireman runs in, and a nurse stays.","收银员数钱,消防员跑进去,而护士留下。"],["A gardener waits a season; a barber waits a month.","园丁等一季;理发师等一个月。"],["A haircut is the result, and the barber is the cause.","发型是结果,而理发师是原因。"],["A fisherman works at night, and a butcher works in the cold.","渔夫夜里干活,屠夫在冷里干活。"],["A groom waits at the front, and a hostage waits in a room.","新郎在前面等,而人质在房间里等。"]]},{"t":"The Bottom","s":[["To toil is to work without reward.","苦干是没有回报地干。"],["A beggar asks, a slave cannot refuse, and a coward does neither.","乞丐开口要,奴隶不能拒绝,而懦夫两样都不做。"]]},{"s":[["A gay couple may marry in more countries than a decade ago.","同性伴侣如今能结婚的国家比十年前多。"],["A chancellor runs a university; a commander runs an army.","校长管一所大学;指挥官管一支军队。"]],"t":"Three Titles"}],"20":[{"t":"Act and React","s":[["To act is to do something; to behave is to do it in a certain way.","行动是做一件事;而举止是以某种方式做。"],["A deed is the act after it is done.","行为是做过之后的那个行动。"],["To accustom yourself is to do it until it is normal.","使自己习惯就是做到它变成正常。"],["To react is to answer at once; to respond is to answer with thought.","反应是立刻回应;而回应是带着思考回答。"],["To reflect is to turn it over afterwards.","反思是事后把它翻过来看。"]]},{"t":"Keep It Going","s":[["To adopt is to take it as your own.","采纳是把它当成自己的。"],["To nourish is to feed it so it grows.","滋养是喂它让它长。"],["To mow is to cut the grass, and to support is to hold it up.","割草是剪草,而支撑是把它托住。"],["To exhale is to let the air out, and intake is what goes in.","呼气是把气放出去,而摄入是进去的东西。"],["To revive is to bring it back; to survive is to never quite stop.","复苏是把它带回来;而幸存是从来没完全停下。"]]},{"t":"Look at It","s":[["To glare is to look with anger.","怒视是带着怒气看。"],["To glimpse is to see it for a second, and a glance is the look you give.","瞥见是看到一秒钟,而一瞥是你给的那一眼。"],["To peep is to look when you should not.","偷看是不该看的时候看。"],["To gaze is to look for a long time and enjoy it; to stare is to look too long and not enjoy it.","凝视是看很久且享受;而盯着是看太久且不享受。"],["To peer is to look hard because it is dark or far.","费力看是因为暗或远。"],["To contemplate is to look with the mind as well as the eyes.","沉思是用脑子一起看。"]]},{"t":"Promises","s":[["A vow is the strongest promise you can make out loud.","誓言是你能大声做出的最强承诺。"],["An oath is a vow with something holy in it.","誓词是带着神圣成分的誓言。"],["A pledge is a promise with something given as proof.","保证是带着抵押作证的承诺。"]]},{"t":"Say Something","s":[["To whistle is to speak without words.","吹口哨是不用词地说话。"],["To reply is to answer, and to notify is to make sure they know.","回复是回答,而通知是确保他们知道。"],["To assert is to say it as a fact, and to explain is to make it clear.","断言是当作事实说,而解释是把它说清。"],["A quarrel is loud and short, a dispute is long, and an argument has reasons in it.","争吵又响又短,纠纷很长,而论证里面有理由。"],["To mention is to say it in passing.","提及是顺口说到。"]]},{"t":"Push and Provoke","s":[["To hurry is to move fast because you must; to hasten is to make it happen sooner.","匆忙是不得不快;而加快是让它更早发生。"],["To urge is to push with words, and to scold is to push with blame.","催促用话推,而责骂用责备推。"],["To curse and to swear are the words you use when words fail.","诅咒和骂脏话,是词穷时用的话。"],["To provoke is to make a reaction on purpose.","挑衅是故意制造反应。"],["To preach is to tell others how to live.","说教是告诉别人该怎么活。"],["To boast is to tell everyone what you did; to tease and to mock are what they do back.","吹嘘是告诉大家你做了什么;而取笑和嘲弄是他们回敬的。"]]},{"t":"Touch and Greet","s":[["To touch is the smallest contact.","触摸是最小的接触。"],["To hug is with both arms, and to clap or to applaud is with both hands.","拥抱用两只手臂,而拍手或鼓掌用两只手。"],["To kneel is to go down on one knee.","跪下是单膝着地。"]]},{"t":"Take Hold","s":[["To catch is to get it before it lands.","接住是在落地前拿到它。"],["To snatch and to grab are the same speed with less manners.","抢夺和抓取是同样的速度,礼貌更少。"],["To grasp is to take it and understand it.","把握是拿住,也是理解。"],["To grip is to hold and not let go.","抓紧是握住不放。"],["To overtake is to pass, and to follow is to stay behind.","超过是越过,而跟随是留在后面。"]]},{"t":"Twist and Fold","s":[["To mess is to make it untidy, and to twist is to turn it as you hold it.","弄乱是把它弄得不整齐,而扭是握着它转。"],["To scatter is to throw it apart.","撒开是把它扔散。"],["To fold is to bring two sides together; to fasten is to keep them there.","折是把两边合起来;而系紧是让它们留在那儿。"],["To loosen is to let them go.","松开是放开它们。"]]},{"t":"Break and Clean","s":[["To smash is to break it into pieces.","砸碎是把它打成碎片。"],["To scratch is with a point, and to scrape is with an edge.","刮是用尖,擦是用刃。"],["To wipe is to take the dust off, and to polish is to make it shine.","擦是把灰去掉,而打磨是让它发亮。"],["To split is to break along a line.","劈开是沿着一条线断开。"]]},{"t":"Turn and Shake","s":[["To sway is to move like a tree; to shake is to move like a hand.","摇摆像树,抖动像手。"],["To vibrate is to shake very fast and very little.","振动是很快很小地抖。"],["To whirl and to rotate are the same circle at two speeds.","旋转和自转是同一个圈,两个速度。"],["To shuffle is to walk without lifting your feet.","拖着脚走是不抬脚地走。"],["To collide is to meet too fast.","相撞是相遇得太快。"]]},{"t":"Connect","s":[["Contact is the meeting, and to connect is to make it hold.","接触是相遇,而连接是让它连住。"],["To combine is to put two together, and to integrate is to make them one.","结合是把两个放在一起,而整合是让它们成为一个。"]]},{"t":"Through and Across","s":[["To penetrate is to get inside something that resists.","穿透是进入有阻力的东西内部。"],["To pierce is to make a hole, and to insert is to put it in.","刺穿是打一个洞,而插入是把它放进去。"],["To tilt is to lean it, and to tow is to pull it behind you.","倾斜是让它歪,而拖是把它拉在身后。"],["A trail is what is left behind.","痕迹是留在身后的东西。"]]},{"t":"Arrange and Steer","s":[["To arrange is to put things in order.","安排是把东西放整齐。"],["To manipulate is to move it with your hands, or with your intentions.","操纵是用手挪它,或者用意图挪它。"],["To steer is to decide the direction.","掌舵是决定方向。"]]},{"t":"Chance and Faith","s":[["To baptise is to give a name in water.","施洗是在水里给一个名字。"],["To bet is to put money on an opinion.","打赌是为一个看法押钱。"],["A stake is what you stand to lose, and to gamble is to do it again.","赌注是你可能失去的,而赌博是再来一次。"],["To promise is to say you will, and mean it.","承诺是说你会的,而且当真。"]]},{"t":"Drawing You In","s":[["To attract is to pull without touching.","吸引是不碰也拉。"],["To obsess is to fill the mind, and to mesmerise is to hold the eyes.","着迷是占满脑子,而迷住是抓住眼睛。"],["A nightmare is a dream you cannot leave.","噩梦是你离不开的梦。"],["To amaze and to astonish are the same surprise at two sizes.","使惊奇和使震惊是同一个惊讶的两种尺寸。"],["To marvel is to be astonished and enjoy it.","惊叹是震惊并且享受。"]]},{"t":"Feelings It Leaves","s":[["To involve is to bring someone in, and to annoy is to make them wish they were out.","卷入是把人带进来,而惹恼是让他们希望自己不在里面。"],["To upset is to turn the mood over.","使不安是把心情翻过来。"],["To bewilder is to leave them with no map.","使困惑是让他们手上没有地图。"],["Irony is saying one thing and meaning the other.","反讽是说一件事,意思是另一件。"],["An indignity is small and it stays for years.","屈辱很小,却留很多年。"],["Contempt is looking down; neglect is not looking at all.","蔑视是往下看;忽视是根本不看。"]]},{"t":"Bias and Disregard","s":[["Disregard is choosing not to look.","漠视是选择不看。"],["Ignorance is not having looked.","无知是没看过。"],["A bias is a scale that leans before you weigh anything.","偏见是一台还没称就先歪的秤。"],["To deviate is to leave the line.","偏离是离开那条线。"]]},{"t":"Out of Control","s":[["To expel is to make them leave.","驱逐是让他们离开。"],["To flee is to leave fast, and to panic is to leave without thinking.","逃走是快快离开,而惊慌是不想就走。"],["To bully is to push the small one every day.","欺凌是每天推那个小的。"],["To terrify is to make fear the only thought.","使恐惧是让恐惧成为唯一的念头。"],["Revenge is the second injury.","报复是第二次伤害。"]]},{"t":"Crime Again","s":[["To kidnap is to take a person; to hijack is to take the vehicle.","绑架是带走人;劫持是带走车。"],["To smuggle is to move it without being seen.","走私是不被看见地运。"],["To convict is to find them guilty, and to strangle is to stop the breath.","定罪是判定有罪,而勒死是止住呼吸。"],["A massacre is many at once, and a decimation is one in ten.","屠杀是一次很多人,而抽杀是十分之一。"],["To intervene is to step in between.","干预是走进中间。"],["To impede is to put something in the way.","阻碍是把什么挡在路上。"]]},{"t":"Tempt","s":[["To allure is to make it look good from far away.","引诱是让它从远处看着很好。"],["Bait is what you put on the hook.","饵是你挂在钩上的东西。"],["To induce is to give a reason; to tempt is to give a reason you should refuse.","促使是给一个理由;而诱惑是给一个你该拒绝的理由。"]]},{"t":"Assign and Conceal","s":[["To designate is to name it for a purpose, and to assign is to give it to a person.","指定是为一个用途命名,而分配是把它交给某个人。"],["To distribute is to give it out, and to despatch is to send it out.","分发是发出去,而派遣是送出去。"],["To detach is to take it off, and to undo is to take the effect away.","分离是把它取下,而撤销是把效果拿掉。"],["To disguise is to change how it looks, and to conceal is to make sure it is not seen.","伪装是改变它的样子,而隐藏是确保它不被看见。"]]},{"t":"Yes, No, Neither","s":[["To refuse is to say no; to exclude is to keep them out.","拒绝是说不行;而排除是把他们挡在外面。"],["To reverse is to turn it the other way.","倒转是把它转到另一边。"],["To assure is to take the doubt away now, and to reassure is to do it again later.","保证是现在把疑虑拿走,而再次保证是以后再做一次。"],["To undertake is to take the job on.","承担是把这件事接过来。"],["To stipulate is to say the condition before you agree.","规定是在同意之前说出条件。"],["To convince is to change the mind; to reassure is to calm it.","说服是改变想法;安抚是让想法安静下来。"]]},{"t":"Wanting","s":[["To wish is to want something you cannot have.","希望是想要你得不到的东西。"],["To aspire is to want something you might reach.","立志是想要你也许能达到的东西。"],["To desire is to want it in the body.","渴望是身体里想要它。"],["To yearn is to want it for years.","思念是想要它好多年。"],["To invoke is to call something in to help.","援引是叫一样东西来帮忙。"]]},{"t":"Try","s":[["To itch is to want to move your hand.","发痒是想动你的手。"],["To attempt is to try once; to strive is to try until it hurts.","尝试是试一次;而奋斗是试到疼。"],["An effort is what it cost you.","努力是它让你付出的。"],["To fulfil is to do what was promised.","履行是把承诺的做出来。"],["To sort is to put it in the right place.","分类是把它放到正确的位置。"]]},{"t":"Start Something","s":[["To loom is to be big and close and not yet here.","逼近是又大又近又还没到。"],["To launch is to send it out; to commence is to begin, formally.","发射是把它送出去;而开始是正式地起动。"],["To exploit is to use it fully, and to explore is to find out what it is.","利用是充分使用,而探索是弄清它是什么。"],["To exert is to put force into it.","施加是把力气放进去。"],["To tackle is to go at the hard part first; to cope is to get through it.","着手是先攻难的部分;而应付是把它过完。"],["To dispose is to get rid of it.","处理是把它弄走。"]]},{"t":"Do and Undo","s":[["To conduct is to lead it from the front.","进行是从前面带着它走。"],["To omit is to leave it out by accident.","遗漏是不小心落下。"],["To delete and to erase are to take the writing away.","删除和擦除是把字迹拿掉。"],["To cancel is to say it will not happen, and to clear is to make the space empty.","取消是说它不会发生,而清理是让空间空出来。"]]},{"t":"Put It Right","s":[["To rescue is to get them out; to recover is to get it back.","营救是让他们出来;恢复是把它拿回来。"],["To restore is to put it back as it was.","修复是把它放回原来的样子。"],["To rectify is to correct the mistake, and to redeem is to make up for it.","纠正是指出并改,而弥补是把它补回来。"],["To offset is to balance one loss with one gain.","抵消是用一份收获平衡一份损失。"],["To replenish is to fill it again.","补充是再装满。"],["A resort is the last thing you can try.","手段是你最后能试的办法。"]]},{"t":"Get and Give","s":[["To obtain is to get it after trying.","获得是试过之后拿到。"],["To gain is to get something extra; to supply is to give what is needed.","获得是多了些什么;而供应是给出需要的。"],["To offer is to hold it out, and to render is to give as a duty.","提供是把它伸出去,而给予是把这当义务。"],["To enlarge is to make it bigger, and to augment is to add to it.","扩大是让它更大,而增加是往上加。"],["To magnify is to make it look bigger; to amplify is to make it sound bigger.","放大是让它看起来更大;而扩音是让它听起来更大。"],["To exaggerate is to magnify on purpose.","夸张是故意放大。"]]},{"t":"Longer and Stronger","s":[["To prolong is to make it last longer.","延长是让它持续更久。"],["To uphold is to keep it standing, and a backup is what stands behind it.","维护是让它站着,而备份是站在它后面的东西。"],["To propel is to push it forward, and to update is to bring it to now.","推进是把它往前推,而更新是把它带到现在。"],["To raise is to lift it up.","举起是把它抬起来。"]]},{"t":"Leak and Flood","s":[["To leak is slow and quiet, and to spill is sudden.","漏是慢而安静的,而洒是突然的。"],["To seep is through a small space; to ooze is slowly and thickly.","渗是通过小缝;而渗出是慢慢地、稠稠地。"],["To evacuate is to empty the place.","疏散是把地方清空。"],["A trench is a long hole, and to saturate is to fill every space with water.","沟渠是一个长坑,而浸透是每个空隙都灌满水。"]]},{"t":"Forgive and Regard","s":[["To excuse is to accept the reason; to forgive is to stop wanting the debt.","原谅是接受这个理由;而宽恕是不再想要这笔债。"],["To contain is to hold it inside.","容纳是把它装在里面。"],["To regard is to look at it with judgement.","看待是带着判断看它。"],["To flatter is to praise for a reason; to worship is to praise without one.","奉承是有理由地夸;而崇拜是没有理由地夸。"]]},{"t":"Why and Because","s":[["A cause makes it happen; a sake is what you do it for.","原因让它发生;而缘故是你为它而做。"],["A purpose is the point, and an objective is the target.","目的是意义,而目标是靶子。"],["To arouse and to trigger are both to start it, one slowly and one suddenly.","唤起和触发都是开始,一个慢一个突然。"],["To seek is to look for it, and to retrieve is to bring it back.","寻找是找它,而取回是把它带回来。"]]},{"t":"Prove It","s":[["To testify is to say it in court.","作证是在法庭上说出来。"],["To verify is to check it is true, and to specify is to say exactly which.","核实是检查它是真的,而指明是说出具体哪一个。"],["To enlighten is to give light to the mind, and to impart is to hand it over.","启发是给脑子一点光,而传授是把它交出去。"],["To deserve is to have earned it.","值得是你已经挣到了。"]]},{"t":"Down","s":[["To drop is to let it fall, and to sink is to go down by itself.","掉落是让它掉,而下沉是自己往下。"],["To plummet is to go down fast and far.","暴跌是又快又远地往下。"],["To muffle is to cover the sound, and to overshadow is to make everything else dim.","闷住是盖住声音,而遮蔽是让其余的都变暗。"]]},{"t":"Welcome","s":[["To invite is to ask; to welcome is to be glad they came.","邀请是开口请;而欢迎是高兴他们来了。"],["To greet is to say the first word, and to salute is to do it with the body.","问候是说第一句话,而敬礼是用身体来做。"],["To celebrate is to mark the day, and to congratulate is to say it to the person.","庆祝是标记这一天,而祝贺是当面说出来。"],["To bless is to wish them well out loud.","祝福是大声祝他们好。"],["To participate is to be one of them.","参与是成为他们中的一个。"],["A farewell is the goodbye you make long.","告别是你长得像一场仪式的那句再见。"]]},{"t":"Match and Belong","s":[["To assort is to put like with like.","分类是同类归同类。"],["To correspond is to match, and to accord is to agree.","相符是能对上,而一致是同意。"],["To attribute is to say where it came from.","归因是说出它从哪来。"]]},{"t":"Remember","s":[["To recall is to bring it back, and to recollect is to do it slowly.","回想是把它带回来,而追忆是慢慢来。"],["To remind is to do it for someone else.","提醒是替别人想起来。"],["To retell is to tell it again, and to repeat is to say the same words.","复述是再讲一遍,而重复是同一句话再说一次。"],["In retrospect, everything was obvious.","回顾起来,一切都显而易见。"],["To impress is to leave a mark on someone.","给…留下印象是在人身上留下痕迹。"]]},{"t":"Overcome","s":[["To surmount is to get over it.","克服是越过它。"],["To mortify is to make someone wish the floor would open.","使羞辱是让人希望地板裂开。"],["To pervade is to be in every part of the room.","弥漫是出现在房间的每一处。"]]},{"t":"Instead","s":[["To replace is to put a new one in its place.","替换是放一个新的在它的位置。"],["To substitute is to use one for the other, either way round.","替代是用一个顶另一个,两个方向都行。"],["To distinguish is to see the difference; to differentiate is to state it.","区分是看出差别;而辨别是把差别说出来。"],["To incline is to lean a little, and sideways is that direction.","倾向是稍微歪一点,而侧向就是那个方向。"]]}],"21":[{"t":"Mood and Character","s":[["To feel is the widest word we have.","感觉是我们最宽的那个词。"],["A mood lasts an afternoon, and an emotion lasts a day.","心情持续一个下午,而情绪持续一天。"],["A temper is the one that gets away from you.","脾气是那个管不住的东西。"],["Manner is how you do it, and attitude is what you think of it.","举止是你怎么做,而态度是你怎么看。"],["Character is what you are; personality is how you come across.","性格是你是什么;而个性是别人眼里的你。"],["A trait is one line of it, and a virtue is the good line.","特质是其中的一条,而美德是好的那条。"],["A feature and stature describe the outside as well.","特征和身量也描述外表。"]]},{"t":"Body and Mind","s":[["Flesh is what we are made of, and mankind is all of us.","肉是构成我们的东西,而人类是我们全部。"],["A human has a bone, a backbone and a skeleton to hold the shape.","人有骨头、脊柱和骨架来撑住形状。"],["The skull holds the brain, and the brain is not the mind.","颅骨装着脑子,而脑子不是心灵。"],["Physical pain is in the body; mental pain is not.","身体的痛在身上;心理的痛不在。"]]},{"t":"The Face","s":[["A cheek, a forehead and a brow are where worry shows first.","脸颊、额头和眉间,是忧虑最先显出来的地方。"],["An eyelash catches the dust before the eye does.","睫毛比眼睛先挡住灰尘。"],["A lip, a mouth, a tongue and a throat are the whole way from sound to word.","唇、口、舌和喉,是从声音到词的整条路。"],["A gorge is a throat on a larger scale.","峡谷是放大版的喉咙。"],["A chin, a jaw and a neck carry the head.","下巴、颌骨和脖子托着头。"],["A beard hides the bottom of it.","胡子把下半截藏起来。"]]},{"t":"Arms and Chest","s":[["A shoulder begins the limb, and an elbow and a wrist bend it.","肩膀是肢体的起点,肘和腕让它弯。"],["A thumb is what makes a hand a hand.","拇指是让手成为手的东西。"],["A palm is open; a finger points; a fist closes.","手掌是张开的;手指指向;拳头合上。"],["A chest, an abdomen and a rib protect what is under them.","胸、腹和肋骨保护下面的东西。"],["A waist is the narrow part in the middle.","腰是中间窄的那一段。"]]},{"t":"Inside","s":[["An organ does one job and does it for life.","器官干一件事,而且干一辈子。"],["The liver cleans, the stomach digests, the kidney filters, and the lung breathes.","肝清洁,胃消化,肾过滤,肺呼吸。"],["A womb holds a life before it is one.","子宫在生命成为生命之前装着它。"],["A gland makes something and sends it out.","腺体制造东西并把它送出去。"],["A chamber is a room, even inside a heart.","腔室是一间房,就算在心脏里也是。"],["The intestine is the longest road in the body.","肠子是身体里最长的一条路。"]]},{"t":"Legs and What Runs Through","s":[["A thigh, a knee, a lap and an ankle are the way down.","大腿、膝、膝上和踝,是往下的路。"],["A heel takes the first hit and a toe takes the last.","脚跟先受一击,脚趾受最后一击。"],["A muscle pulls; a joint lets it move.","肌肉拉;关节让它动。"],["A pore lets the skin breathe, and a pulse tells you the heart is working.","毛孔让皮肤呼吸,而脉搏告诉你心脏在工作。"],["An artery carries it out, a nerve carries the message, and a hormone carries the order.","动脉把它送出去,神经传消息,而激素传命令。"],["The immune system remembers every enemy it has met.","免疫系统记得它见过的每个敌人。"]]},{"t":"The Senses","s":[["A stimulus is anything the body notices.","刺激是身体注意到的任何东西。"],["A biorhythm is the clock inside you.","生物节律是你体内的钟。"],["A sense lets the world in; sight is the one we trust most.","感官让世界进来;视觉是我们最信的那个。"],["Eyesight can be sharp or weak, and a view is what you look at.","视力可以锐利也可以弱,而景色是你看的东西。"],["Something visual is for the eye, and something visible can be seen.","视觉的是给眼睛的,而可见的是能被看见的。"],["Something vague is seen but not clearly.","模糊的东西是看见了却不清楚。"],["Someone blind cannot see, and someone dumb cannot speak.","盲的人看不见,哑的人说不出。"],["An aural test is for the ear, and a dental one is for the teeth.","听觉测试查耳朵,牙科检查查牙齿。"]]},{"t":"Sleep","s":[["A lifestyle is what you do every day, and a habit is what you no longer decide.","生活方式是你每天做的,而习惯是你不再决定的事。"],["To be awake is to be in charge of yourself.","清醒是自己说了算。"],["To yawn is the body asking for a nap, and to doze is agreeing.","打哈欠是身体在要一次小睡,而打盹是答应了。"],["Quiet is what a room needs; asleep is what you need.","安静是房间需要的;睡着是你需要的。"],["Insomnia is lying awake with a working mind.","失眠是躺着醒着,脑子还在转。"]]},{"t":"Body and Limit","s":[["To cripple is to take the use of a limb; to be lame is to walk badly.","致残是夺去一条肢体的用处;而跛是走得不好。"],["A dwarf is small by nature, not by accident.","侏儒是天生小,不是意外。"],["Pregnancy is nine months of change, and being born is the first hard day.","怀孕是九个月的变化,而出生是第一个艰难的日子。"],["A clone has one parent and no surprise.","克隆只有一个亲本,也没有意外。"]]},{"t":"Symptoms","s":[["A symptom is what you feel; a disease is what it is.","症状是你感觉到的;疾病是它本身。"],["An illness is the time you spend having it.","病期是你得它的那段时间。"],["To moan is to say it without words.","呻吟是不用词地说出来。"],["An infection spreads; a detriment is the harm it leaves.","感染会扩散;而损害是它留下的坏处。"],["Something broken does not work, and to disable is to make it stop.","坏了的不管用,而致残是让它停下。"],["An invalid is someone the body has stopped.","病弱者是被身体叫停的人。"],["A patient waits, and a dysfunction is a part working badly.","病人等着,而功能紊乱是某个部分干活不对劲。"]]},{"t":"What It Might Be","s":[["Diabetes is sugar in the blood, and obesity is weight the body carries.","糖尿病是血里的糖,而肥胖是身体扛着的重量。"],["To be overweight is a warning; hypertension is the one you cannot feel.","超重是一个警告;高血压是你感觉不到的那个。"],["To paralyse is to stop the movement, and to be dizzy is to lose the floor.","使瘫痪是停住动作,而头晕是失去地面。"],["Someone insane has lost the line between real and not.","精神失常的人丢了真实与不真实之间的线。"],["An allergy is the body attacking something harmless.","过敏是身体攻击无害的东西。"],["A heart attack, a stroke and a plague are all sudden.","心脏病发作、中风和瘟疫都是突然的。"]]},{"t":"The Long Illness","s":[["Cancer and arthritis are patient diseases.","癌症和关节炎是很有耐心的病。"],["A pimple is small, and flu and fever come and go.","痘痘很小,而流感和发烧来来去去。"],["A headache is the body complaining about the day.","头痛是身体在抱怨这一天。"],["To swell is to get bigger from inside.","肿是从里面变大。"],["To choke is to have no air.","噎住是没有空气。"]]},{"t":"Injury","s":[["To injure is to do damage to a body, and an injury is the damage itself.","受伤是对身体造成损害,而伤是那个损害本身。"],["To hurt is what you feel; to bleed is what it does.","疼是你感觉到的;流血是它做的事。"],["A bruise is under the skin, and a scar is what stays.","淤青在皮下,而疤是留下的东西。"],["A wound and a trauma are the same break, one seen and one felt.","伤口和创伤是同一个破损,一个看得见一个感觉得到。"],["A lump is something that was not there before.","肿块是以前不在那里的东西。"],["Pain is the body's way of asking you to stop.","疼痛是身体请你停下的方式。"]]},{"t":"The End","s":[["Death is the fact; a demise is the formal word for it.","死亡是事实;而逝世是它的正式说法。"],["Mortal means it will happen to you.","凡人意味着这也会发生在你身上。"],["Doom is death with a date already set.","劫数是日期已定的死亡。"],["Something fatal or lethal will kill you.","fatal 或 lethal 的东西会要你的命。"],["A corpus is a body used for study.","尸体是用于研究的身体。"]]},{"t":"Tired Out","s":[["Overwork is the cause and fatigue is the result.","过劳是原因,疲劳是结果。"],["To tire is to slow down, and to exhaust is to empty.","疲乏是慢下来,而耗尽是把人清空。"],["To faint is to leave for a moment.","昏倒是离开一小会儿。"],["Someone feeble has no strength, and to weaken is to lose it.","虚弱的人没有力气,而变弱是失去它。"],["To be uncomfortable is to notice your own body.","不舒服是注意到自己的身体。"],["Someone unconscious is not there at all.","失去意识的人根本不在。"]]},{"t":"Sharp or Slow","s":[["A chronic illness stays; an acute one arrives.","慢性的病留着;急性的病来了。"],["A sore throat is a small pain with a big word.","喉咙痛是一个小痛配一个大词。"],["Sorrow is quiet, and suffering is long.","悲伤是安静的,而痛苦是长的。"],["To lament is to say it out loud in public.","哀叹是当众大声说出来。"]]},{"t":"The Hospital","s":[["A hospital is where the machines are; a clinic is where the questions are.","医院是机器在的地方;诊所是问题在的地方。"],["Therapy is the slow work, and health care is the system around it.","治疗是慢的活儿,而医疗保健是它周围的系统。"],["Something sanitary is clean in a medical way, and hygiene is the habit of keeping it so.","卫生的是医学意义上的干净,而卫生习惯是保持它干净的习惯。"],["Medical training is long, and fitness is what you do yourself.","医学训练很长,而体能是你自己练的。"],["A physician thinks, and a surgeon cuts.","内科医生思考,而外科医生动刀。"]]},{"t":"Treatment","s":[["An operation is one day, and treatment is a year.","手术是一天,而治疗是一年。"],["To cure is to end it; to heal is to make it whole again.","治愈是把它结束;而愈合是让它重新完整。"],["A check finds it, a prescription names it, and a precaution prevents it.","检查发现它,处方说出它,而预防措施防止它。"],["A transplant moves a part, and an X-ray looks through you.","移植是挪一个部件,而 X 光看穿你。"],["An injection goes in; a vaccinate protects in advance.","注射是打进去;而接种是提前保护。"],["To quarantine is to keep them apart for a while; to segregate is to keep them apart for good.","隔离检疫是暂时分开;而隔离是永久分开。"],["To isolate is to make sure nobody comes near.","孤立是确保没人靠近。"]]},{"t":"Medicine","s":[["A pharmacy sells it, and medicine is what you take.","药房卖它,而药是你吃的。"],["A remedy is the old word for a cure; a drug is the new word for a business.","remedy 是治愈的旧词;drug 是商业的新词。"],["A pill is small, and an antibiotic kills what a body cannot.","药丸很小,而抗生素杀死身体杀不了的东西。"],["Acupuncture, penicillin and morphine are three different centuries.","针灸、青霉素和吗啡,是三个不同的世纪。"],["A dose is how much, and recovery is how long.","剂量是多少,而康复是多久。"]]},{"t":"Relief","s":[["To refresh is to give energy back, and relief is the moment it stops hurting.","提神是把力气还回来,而缓解是它停止疼的那一刻。"],["To relieve and to alleviate are to make it smaller.","缓解和减轻都是把它变小。"],["To resume is to start again, and to ease is to make it gentler.","恢复是重新开始,而缓和是让它更轻。"],["To relax is to stop holding.","放松是停止用力。"]]},{"t":"Normal and Otherwise","s":[["Normal is what most do, common is what many do, and usual is what happens most days.","正常是多数人做的,常见是很多人做的,而通常是最多日子里发生的。"],["An optimistic person expects it to work.","乐观的人预期它能成。"],["A pessimistic one is never disappointed.","悲观的人从不失望。"],["Positive looks for the good; negative finds the rest.","积极找好的;消极找到其余的。"],["Passive waits, and enthusiastic does not.","被动是等着,而热情不是。"],["Indifferent does not care, apathetic cannot be bothered, and negligible is too small to matter.","漠不关心是不在乎,麻木是懒得在乎,而微不足道是太小以致不重要。"]]},{"t":"Pleasure","s":[["Happiness is a state; delight is a moment.","幸福是一种状态;喜悦是一个瞬间。"],["To be merry is to be loud about it.","欢快是把这件事说得响。"],["Fun is the activity, and a joke is the thing that starts it.","乐趣是活动,而笑话是引起它的东西。"],["Laughter is the sound, and joy is the reason.","笑是声音,而快乐是原因。"],["To please is to give it to someone else.","取悦是把它给别人。"],["To rejoice and to thrill and to cheer are all louder than to be pleased.","欢庆、激动和欢呼,都比满意要响。"]]},{"t":"Good to Have","s":[["Pleasure is the body's, and something agreeable is easy to be with.","愉悦是身体的,而惬意的容易相处。"],["To exhilarate is to make the heart go faster.","使兴奋是让心跳更快。"],["Something satisfactory is enough, and something desirable is worth wanting.","令人满意的是够了,而值得要的是值得想要。"],["An exciting idea makes you move; a keen student does not need to be told.","令人兴奋的想法让你动起来;而热切的学生不用别人说。"],["Zeal is energy with a purpose, and a lively room is a lovely one.","热忱是有目的的精力,而热闹的房间是可爱的。"],["To be fond of something is to like it for years.","喜欢一样东西,是喜欢很多年。"]]},{"t":"Kind and Otherwise","s":[["A favour is a kindness you can name.","恩惠是一个你说得出来的善意。"],["To startle, to amaze and to astound are three sizes of surprise.","使惊吓、使惊奇和使震惊,是惊讶的三个尺寸。"],["A hectic day has no gaps in it.","忙乱的一天没有空隙。"],["Someone liberal gives more than expected; someone generous gives more than they have.","开明的人给得比预期多;而慷慨的人给得比自己有的还多。"],["Gentle is slow with the hands; humble is low about the self; modest is quiet about the success.","温和是手上慢;谦卑是对自己低;谦虚是对成功不多说。"],["Humorous is funny on purpose; frank is honest without warning.","幽默是有意好笑;坦率是不打招呼就诚实。"]]},{"t":"Curious and Proud","s":[["Something mysterious has no explanation yet.","神秘的东西还没有解释。"],["Someone curious wants one.","好奇的人想要一个。"],["Daring is brave with a plan; manly is an old word for the same thing.","大胆是有计划的勇敢;而 manly 是同一件事的旧词。"],["To be direct is to say it first.","直接是先把话说出来。"],["Earnest is serious and honest at once; honesty is the habit of it.","认真是严肃又诚实;而诚实是这件事的习惯。"],["Proud is the feeling; seriously is the manner.","骄傲是感觉;而严肃是举止。"]]},{"t":"With Other People","s":[["Friendly is easy; hospitable opens the door.","友好是容易的;而好客是打开门。"],["Romantic sees the story; freedom is the space to have one.","浪漫的人看见故事;而自由是有故事的空间。"],["Careful notices; concern is careful about you.","仔细是注意到;而关心是对你仔细。"],["Confidence is expecting to manage; to be considerate is to think of the other seat.","自信是预期能应付;而体贴是想到另一个座位。"],["Thoughtful remembers; sympathetic feels it with you.","体贴是记得;而同情是和你一起感受。"],["Ready means there is no wait.","准备好意味着不用等。"]]},{"t":"Sorry","s":[["To apologise is to say it; an apology is the words; mercy is not giving the punishment.","道歉是说出来;歉意是那些话;而宽恕是不给惩罚。"],["To admire is to look up; remarkable is worth the look.","钦佩是往上看;而卓越是值得一看。"],["Grateful and gratitude are the feeling and the name of it.","感激和感恩,是那种感觉和它的名字。"],["Eager wants to start now.","渴望是现在就想开始。"]]},{"t":"Sound and Solid","s":[["Something sound is in good condition.","完好的是处于良好状态。"],["A picturesque view is worth a photograph.","如画的景色值得拍一张。"],["A promising start may still fail.","有希望的开端仍可能失败。"],["A prominent person is seen first.","显要的人先被看见。"],["Something awesome is too big to answer.","令人敬畏的东西大到无法回应。"]]},{"t":"Hard Work","s":[["An arduous climb is long and steep.","艰难的攀登又长又陡。"],["A tough day does not break you; a robust body does not either.","艰难的一天不会把你弄垮;强健的身体也不会。"],["Something sturdy stands up; something steadfast does not leave.","结实的东西立得住;而坚定不离开。"],["Tender is gentle with the skin; temperate is gentle with itself.","温柔是对皮肉轻;而有节制是对自己轻。"],["Something delicate breaks if you look at it too hard.","精致的东西你多看一眼就会坏。"]]},{"t":"Plain and Plain-spoken","s":[["A mundane task is ordinary and necessary.","平凡的任务是普通且必要的。"],["Naive believes it; childish wants it.","天真是相信它;幼稚是想要它。"],["Sincere means no second meaning.","真诚意味着没有第二层意思。"],["Liable means it will probably happen to you.","liable 意味着它可能落到你身上。"],["Trustworthy means you can leave the room.","可靠意味着你可以离开这间屋子。"]]},{"t":"Willing","s":[["Enterprising starts businesses; sane does not start them all.","有事业心的会开公司;而清醒的不会全都开。"],["Strenuous takes effort, and rigorous takes care.","费力的要下功夫,而严格的要用心。"],["Strict is the rule; severe is the punishment.","严格是规则;而严厉是惩罚。"],["Mutual means both ways.","相互意味着双向。"],["To resemble is to look like; similar is only close; familiar is known.","相像是长得像;相似只是接近;熟悉是认识。"],["Naked is without clothes; bare is without cover.","裸的是没有衣服;而光的是没有遮盖。"],["Private is not for others.","私人的是不给别人的。"]]},{"t":"Gut Feeling","s":[["Intuition is knowing without the steps.","直觉是没有步骤就知道。"],["Spontaneous is done before the plan arrives.","自发是计划还没到就做了。"],["Something implicit is there but not said.","隐含的是在那里但没说。"],["An illusion is seen and not there; imaginary is not there at all.","幻觉是看见了却不在那里;想象的则根本不在。"],["Fancy is the pleasure of imagining it.","幻想是想象它的乐趣。"],["Fate is the plan you did not make, and fortune is the luck you did not earn.","命运是你没做的计划,而运气是你没挣来的好运。"]]},{"t":"Grief","s":[["Agony is pain at its loudest.","剧痛是最大声的痛。"],["Grief is the whole of it, and to grieve is to go through it.","悲伤是它的全部,而哀悼是走完它。"],["Miserable is a long low state.","悲惨是一种长久低落的状况。"],["Distress is the moment it shows.","痛苦是它显出来的那一刻。"],["Sadness is quieter, and gloomy is darker.","悲伤更安静,而忧郁更暗。"],["To disappoint is to fail an expectation; to discourage is to remove the next try.","使失望是辜负期待;而使气馁是拿掉下一次尝试。"]]},{"t":"Anger","s":[["Anger is the feeling; rage is the volume; furious is the speed.","愤怒是感觉;暴怒是音量;而狂怒是速度。"],["To frown is anger in miniature.","皱眉是微缩的愤怒。"],["To irritate is to keep touching the sore place.","激怒是不停碰那个痛处。"],["To hate is to want it gone, and hatred is the habit of it.","恨是想让它消失,而仇恨是这件事的习惯。"],["A nuisance is small and constant.","讨厌的东西很小而且不断。"],["Disgust turns the stomach; to vex is to bother until it shows.","厌恶让胃翻;而使烦恼是扰到它显出来。"]]},{"t":"Unkind","s":[["To harass is to come back again and again.","骚扰是一再回来。"],["To bore is to take the time and give nothing.","使人厌烦是拿走时间什么也不给。"],["To bother is smaller than to harass, and a troublesome task is smaller still.","打扰比骚扰小,而麻烦的任务更小。"],["Awful and unpleasant are both bad to be near.","糟糕的和不愉快的东西,靠近都不好。"],["Adverse conditions push against you, and a hostile crowd does it on purpose.","不利的条件顶着推你,而敌对的人群是有意为之。"],["Indignant is angry and sure of being right.","愤慨是生气并且确信自己是对的。"]]},{"t":"Too Much","s":[["Radical goes to the root.","激进是动到根上。"],["Mad and crazy are the same word at two temperatures.","mad 和 crazy 是同一个词的两个温度。"],["Wicked is evil with pleasure; vicious is evil with teeth.","邪恶是带着快感的恶;而恶毒是带牙的恶。"],["Vulgar is loud and low at once.","粗俗是又响又低。"],["Ego is the room you keep for yourself, and selfish is when it is the only room.","自我是你给自己留的房间,而自私是它成了唯一的房间。"]]},{"t":"Uneasy","s":[["Nasty is small and deliberate.","恶意的是小而有意的。"],["Rash acts before thinking; volatile changes without notice.","轻率是不想就动;而易变是不打招呼就变。"],["Weird is strange in a way you cannot name.","怪异是怪得你叫不出名字。"],["Excessive is more than the case needs.","过度是多过这件事所需。"],["Anxiety is fear with no object; restless is a body with no seat.","焦虑是没有对象的恐惧;而坐不住是一具没有座位的身体。"],["Uneasy is the small version, and fear is the old one.","不安是小的那个,而恐惧是旧的那个。"],["Timid steps back before anything happens.","胆怯是还没发生就先退。"]]},{"t":"Fuss","s":[["A fuss is noise about something small.","大惊小怪是为小事吵闹。"],["An insult is meant to land; unkind is careless rather than aimed.","侮辱是想打中的;而不友善只是不留心,不是瞄准的。"],["Envy wants what you have; to be jealous is to fear losing what I have.","羡慕是想要你有的;而嫉妒是怕失去我有的。"]]},{"t":"Doubt","s":[["Doubt is the open question, and suspicion has already answered.","怀疑是未决的问题,而猜疑已经答完了。"],["Sceptical wants the evidence first.","怀疑的想要先看证据。"],["Unsatisfactory, unstable and unsuitable are three ways of being not right.","不令人满意、不稳定和不合适,是“不对”的三种方式。"],["Unwilling will not, and reluctant will but slowly.","不愿意是不肯,而不情愿是肯,但很慢。"],["To hesitate is the pause before both.","犹豫是两者之前的那一顿。"]]},{"t":"Guilt","s":[["To confuse is to take the order out of it.","使困惑是把顺序拿掉。"],["Guilty is the verdict you give yourself.","有罪是你给自己下的判决。"],["To embarrass is to make the face hot.","使尴尬是让脸发烫。"],["Regret looks back, and to repent is to wish to undo it.","后悔是回头看,而悔改是希望撤销它。"],["Ashamed is regret with someone watching.","羞愧是有别人看着的后悔。"]]},{"t":"Let It Out","s":[["To sigh is to let the day out.","叹气是把这一天放出去。"],["To weep is to cry with a reason.","哭泣是有理由地哭。"],["Tolerance is the room you give others.","宽容是你给别人的空间。"]]},{"t":"Weak Points","s":[["To be ignorant is not to know; to endure is to keep going anyway.","无知是不知道;而忍耐是照样继续。"],["Sly is clever in secret; cunning is clever for gain.","狡黠是暗地里聪明;而狡猾是为获利而聪明。"],["Arbitrary is a decision with no reason behind it.","任意是没有理由在后面的决定。"],["Ridiculous and stupid are not the same: one is funny, one is slow.","可笑和愚蠢不一样:一个好笑的,一个迟钝的。"],["Awkward is uncomfortable in the body; clumsy is uncomfortable with the hands.","别扭是身体不自在;而笨拙是手不自在。"],["Careless does not look, and oblivious does not know there was anything to look at.","粗心是不看,而浑然不觉是不知道有东西可看。"]]},{"t":"Bad Habits","s":[["Naughty is small and forgivable.","淘气是小而可原谅的。"],["Greedy wants more than the table has.","贪心是想要比桌上有的更多。"],["Obtrusive pushes into the room; slothful does not leave the bed.","冒失是闯进屋子;而懒惰是不离开床。"],["Sluggish is slow like something heavy.","迟缓是像重物一样慢。"],["An impulse arrives before the reason.","冲动在理由之前到。"],["Rigid does not bend; stubborn will not.","僵硬是弯不了;而固执是不肯弯。"],["A stereotype is a picture you keep instead of a person.","刻板印象是你留着的一张画,用来代替一个真人。"]]},{"s":[["A condom is the cheapest precaution there is.","避孕套是最便宜的预防措施。"],["After a month of it you are weary, not tired.","一个月下来你是倦了,不是累了。"],["A curative dose is not always a kind one.","治病的剂量不一定是个温和的剂量。"],["Something amazing is worth stopping for; something polite costs nothing.","惊人的东西值得停下来;而客气不花一分钱。"],["A wretched week is one you would not repeat.","糟糕的一周是你不想再来一遍的。"],["Something frustrating is close and out of reach.","令人沮丧的东西很近却够不着。"],["To mourn is to keep the seat empty on purpose.","哀悼是故意让那个座位空着。"]],"t":"The Long Ward"}],"22":[{"t":"How Often","s":[["A daily paper comes every day; a monthly one comes twelve times a year.","日报每天来;月刊一年来十二次。"],["A quarterly report is written four times, and an annual or yearly one only once.","季报写四次,而年度报告只写一次。"],["An anniversary is the same day coming back.","周年纪念是同一天又回来了。"],["Something done periodically happens at intervals, and consecutive days run without a gap.","周期性地做是按间隔发生,而连续的日子中间没有空隙。"],["Duration is how long it lasts.","持续时间是它持续多久。"]]},{"t":"Which Age","s":[["An era is long, and a century is a hundred years.","时代很长,而世纪是一百年。"],["A millennium is a thousand.","千禧是一千年。"],["The present is now, and contemporary means now as well.","现在就是当下,而当代也是指当下。"],["Medieval means the middle ages, and modern means after them.","中世纪指中古,而现代指那之后。"],["Recent is a short time ago, and up-to-date is this morning.","最近的是一小段时间之前,而最新的是今天早上。"]]},{"t":"Big Numbers","s":[["A dozen is twelve, and a million is a thousand thousands.","一打是十二,而一百万是一千个一千。"],["A billion is a thousand million.","十亿是一千个百万。"]]},{"t":"Through the Day","s":[["Dawn is the first light and midday is the highest sun.","黎明是第一道光,正午是太阳最高时。"],["Midnight is the middle of the dark, and night is all of it.","午夜是黑暗的中间,而夜是全部。"],["Overnight means it happened while you slept.","一夜之间意味着它在您睡觉时发生。"]]},{"t":"In Order","s":[["First you begin, and secondly you go on.","首先你开始,其次你继续。"],["Finally you finish.","最后你结束。"],["Initially means at the start, and the opening is the start itself.","最初指在开头,而开场就是开头本身。"],["An intermediate step is in the middle, and in the midst of it you cannot see out.","中间步骤在中间,而身处其中时你看不出去。"],["Meantime and meanwhile are the same wait.","meantime 和 meanwhile 是同一场等待。"],["Simultaneous means at the very same moment.","同时是指在完全相同的那一刻。"]]},{"t":"Now or Soon","s":[["Immediately means now, and an instant is shorter than a moment.","立即就是现在,而一瞬间比一刻更短。"],["A moment is a moment, and a minute is sixty of them.","一刻就是一刻,而一分钟是六十个它。"],["Punctual means on time, not early.","准时是指按时,不是早到。"],["Something imminent is about to happen and probably will.","逼近的是即将发生,而且很可能会。"],["An ongoi /* ---- 变形与匹配 ---- */
function forms(w){
 var f=[w,w+'s',w+'es',w+"'s",w+'ed',w+'ing',w+'ly'];
 if(/e$/.test(w)) f.push(w+'d', w.slice(0,-1)+'ing');
 if(/y$/.test(w)) f.push(w.slice(0,-1)+'ies', w.slice(0,-1)+'ied');
 if(/a$/.test(w)) f.push(w+'e');
 f.push(w+w.slice(-1)+'ing', w+w.slice(-1)+'ed');
 return f;
}
function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') }
var RE={};
function build(ch){
 if(RE[ch]) return RE[ch];
 var list=CHS[ch]||[], fm=[], map={};
 for(var i=0;i<list.length;i++){
  var w=list[i][0], ws=forms(w);
  for(var j=0;j<ws.length;j++){
   var k=ws[j].toLowerCase();
   if(!map[k]){ map[k]={b:w, d:list[i][2]||0}; fm.push(ws[j]) }
  }
 }
 fm.sort(function(a,b){ return b.length-a.length });
 RE[ch]={re:new RegExp('(?<![A-Za-z])('+fm.map(esc).join('|')+')(?![A-Za-z])','gi'), map:map};
 return RE[ch];
}

   zh+=p.s[k][1];
  }
  body='<div class="ps"><p class="pen">'+body+'</p><p class="pzh">'+zh+'</p></div>';
  var ws=Object.keys(bag);

     (ws.length?'<div class="wlist">'+ws.map(function(w){ return '<span data-ww="'+w+'">'+w+'</span>' }).join('')+'</div>':'')+
     '<div class="qz"><button class="qbb" data-i="'+i+'">本篇小测</button>'+
     '<span class="qsc" data-q="'+i+'"></span></div>'+
     '</div>';
 }

}
function mark(t, r, bag){
 return t.replace(r.re, function(m){
  var o=r.map[m.toLowerCase()];
  if(!o) return m;
  used[o.b]=1; bag[o.b]=1;
  return '<mark class="pv'+(o.d?' dv':'')+'" data-w="'+o.b+'">'+m+'</mark>';
 });
}
function cov(){
 var heads=(CHS[ch]||[]).filter(function(e){ return !e[2] });
 var tot=heads.length, u=0, i;
 for(i=0;i<heads.length;i++) if(used[heads[i][0]]) u++;

  '<div class="cv1"><span>本章 <b>'+tot+'</b> 词 · 短文里用到了 <b>'+u+'</b> 个（'+pct+'%）</span>'+

   miss.map(function(e){ return '<span title="'+e[1].replace(/"/g,'&quot;')+'">'+e[0]+'</span>' }).join('')+
   '</div></details>':'');
 if(typeof qstat==='function') qstat();
}

/* ---- 章节 ---- */
function chips(){
 var h='', n;
 for(n=1;n<=22;n++) h+='<button class="cb'+(n===ch?' on':'')+'" data-ch="'+n+'"><b>'+('0'+n).slice(-2)+'</b>'+TT[n]+'</button>';
 document.getElementById('chs').innerHTML=h;
}
function go(n){
 stop();
 ch=n; set(KEY,String(n)); chips(); render();
 document.getElementById('cttl').innerHTML='Unit '+('0'+n).slice(-2)+' <em>'+TT[n]+'</em>';
 window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- 弹层 ---- */
var pop=document.getElementById('pop');
function closePop(){ pop.classList.remove('on');
 var a=document.querySelectorAll('mark.pv.on'); for(var i=0;i<a.length;i++) a[i].classList.remove('on') }
function showPop(el, word){
 closePop();
 var w=word||el.getAttribute('data-w'), mean=(TT.m[w]||''), bk=J('vj-book',{});
 var r=el.getBoundingClientRect();
 pop.innerHTML='<div class="pw">'+w+'</div><div class="pm">'+mean+'</div>'+
  '<div class="pa"><button data-p="say">朗读</button><button data-p="add" class="'+(bk[w]?'on':'')+'">'+
  (bk[w]?'★ 已收':'☆ 收词')+'</button></div>';
 pop.classList.add('on'); if(el.tagName==='MARK') el.classList.add('on');
 var pw=pop.offsetWidth, ph=pop.offsetHeight;
 var x=r.left+r.width/2-pw/2, y=r.bottom+8;
 if(y+ph>innerHeight-10) y=r.top-ph-8;
 pop.style.left=Math.max(8,Math.min(x,innerWidth-pw-8))+'px';
 pop.style.top=Math.max(8,y)+'px';
 pop.setAttribute('data-cur',w);
}

/* ---- 生词本 ---- */
function addBook(w){
 var bk=J('vj-book',{});
 if(bk[w]){ toast('「'+w+'」已经在生词本了'); return }
 bk[w]={w:w,m:TT.m[w]||'',c:('0'+ch).slice(-2),lv:0,due:Date.now(),wr:0,t:Date.now()};
 set('vj-book',JSON.stringify(bk));
 toast('已收「'+w+'」 · 生词本共 '+Object.keys(bk).length+' 词');
}
var tm=null;
function toast(s){ var t=document.getElementById('toast'); t.textContent=s; t.classList.add('on');
 clearTimeout(tm); tm=setTimeout(function(){ t.classList.remove('on') },2000) }

/* ---- 朗读 ---- */
var RT={on:false, q:[], n:0, b:null};
function canSpeak(){ return typeof speechSynthesis!=='undefined' }
function stop(){ if(RT.on&&canSpeak()) speechSynthesis.cancel();
 RT.on=false; var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.b){ RT.b.classList.remove('on') } RT.b=null; paintRead() }
function paintRead(){ var b=document.querySelector('.acts button[data-a="read"]');
 if(b&&!RT.on) b.textContent='朗读' }
function step(){
 if(!RT.on) return;
 var c=document.querySelectorAll('.sn.cur'); for(var i=0;i<c.length;i++) c[i].classList.remove('cur');
 if(RT.n>=RT.q.length){ stop(); return }
 var node=RT.q[RT.n]; node.classList.add('cur');
 var y=node.getBoundingClientRect().top;
 if(y<70||y>innerHeight-100) node.scrollIntoView({block:'center',behavior:'smooth'});
 var u=new SpeechSynthesisUtterance(node.querySelector('.en').textContent);
 u.lang='en-GB'; u.rate=parseFloat(get(RATE,'0.95'))||0.95;
 u.onend=function(){ RT.n++; step() };
 u.onerror=function(){ RT.n++; step() };
 speechSynthesis.speak(u);
}

/* ---- 交互 ---- */
document.addEventListener('click', function(e){
 var t=e.target;
 var qo=t.closest('.qo button'); if(qo){ qAnswer(qo); return }
 if(t.closest('.qnext')){ qNext(); return }
 if(t.closest('.qagain')){ qStart(QZ.p); return }
 if(t.closest('.qclose')){ qClose(); return }
 var qb=t.closest('.qbb'); if(qb){ qStart(+qb.getAttribute('data-i')); return }
 var cb=t.closest('.cb'); if(cb){ go(parseInt(cb.getAttribute('data-ch'),10)); return }
 var b=t.closest('.acts button'); if(b){ act(b.getAttribute('data-a'), b); return }
 var sb=t.closest('.say');
 if(sb){ if(!canSpeak()){ toast('这个浏览器不支持朗读'); return }
  speechSynthesis.cancel();
  var n=+sb.getAttribute('data-say'), nodes=document.querySelectorAll('.pass[data-i="'+n+'"] .sn'), q=[];
  for(var i=0;i<nodes.length;i++) q.push(nodes[i]);
  RT.q=q; RT.n=0; RT.on=true; RT.b=sb; step(); return }
 var pb=t.closest('#pop button');
 if(pb){ var w=pop.getAttribute('data-cur');
  if(pb.getAttribute('data-p')==='say') sayOne(w); else { addBook(w); pb.textContent='★ 已收'; pb.classList.add('on') } return }
 var wc=t.closest('.wlist span'); if(wc){ showPop(wc, wc.getAttribute('data-ww')); return }
 if(document.body.classList.contains('blind')){
  var bl=document.body.classList.contains('sent')? t.closest('.sn') : t.closest('.ps');
  if(bl){ bl.classList.toggle('rev'); return }
 }
 var m=t.closest('mark.pv');
 if(m){ if(document.body.classList.contains('blurred')&&!m.classList.contains('on')){ m.classList.add('on'); return }
  showPop(m); return }
 if(pop.classList.contains('on')&&!t.closest('#pop')) closePop();
});
function sayOne(w){
 if(!canSpeak()) return;
 speechSynthesis.cancel();
 var u=new SpeechSynthesisUtterance(w); u.lang='en-GB'; u.rate=0.85;
 speechSynthesis.speak(u);
}
function act(a,b){
 if(a==='blur'){ document.body.classList.toggle('blurred'); b.classList.toggle('on');
  toast(document.body.classList.contains('blurred')?'遮挡模式：先猜词，点一下看答案':'已显示所有词') }
 else if(a==='mode'){ var cm=document.body.classList.contains('sent')?'s':'p'; setMode(cm==='p'?'s':'p',1) }
 else if(a==='zh'){ document.body.classList.toggle('nozh'); b.classList.toggle('on',!document.body.classList.contains('nozh')) }
 else if(a==='blind'){ document.body.classList.toggle('blind'); b.classList.toggle('on');
  toast(document.body.classList.contains('blind')?'盲读模式：只看中文，点英文句子显形':'已恢复') }
 else if(a==='read'){
  if(RT.on){ stop(); return }
  if(!canSpeak()){ toast('这个浏览器不支持朗读'); return }
  speechSynthesis.cancel();
  var nodes=document.querySelectorAll('.pass .sn'), q=[];
  for(var i=0;i<nodes.length;i++) q.push(nodes[i]);
  RT.q=q; RT.n=0; RT.on=true; RT.b=b; b.classList.add('on'); b.textContent='停止'; step() }
 else if(a==='rnd'){ go(1+Math.floor(Math.random()*22)); }
 else if(a==='th'){ var t2=get(TH,''); set(TH,t2===''?'dark':(t2==='dark'?'light':'')); applyTH();
  b.textContent=get(TH,'')==='dark'?'深':(get(TH,'')==='light'?'浅':'自'); b.classList.toggle('on',!!get(TH,'')) }
}
document.addEventListener('keydown', function(e){
 if(e.target.tagName==='INPUT') return;
 if(QZ.p>=0&&!QZ.done){
  if(e.key>='1'&&e.key<='4'){
   var ob=document.querySelector('.pass[data-i="'+QZ.p+'"] .qo button[data-o="'+(+e.key-1)+'"]');
   if(ob){ e.preventDefault(); qAnswer(ob); return }
  }
  if(e.key==='Enter'){
   var nb=document.querySelector('.pass[data-i="'+QZ.p+'"] .qnext');
   if(nb){ e.preventDefault(); qNext(); return }
  }
 }
 if(e.key==='ArrowRight'&&ch<22) go(ch+1);
 else if(e.key==='ArrowLeft'&&ch>1) go(ch-1);
 else if(e.key==='Escape'){ closePop(); stop() }
});
window.addEventListener('resize', function(){ closePop() });
window.addEventListener('scroll', function(){ if(pop.classList.contains('on')) closePop() }, {passive:true});
document.addEventListener('visibilitychange', function(){ if(document.hidden) stop() });

var ICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.2 6.2v3.6h1.9L8 12.2V3.8L5.1 6.2H3.2z"/><path d="M10.4 6.3a2.5 2.5 0 0 1 0 3.4"/><path d="M12.1 4.7a4.8 4.8 0 0 1 0 6.6"/></svg>';
/* ================= 本篇小测 ================= */
var QK='vj-quiz';
var QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};

function qrec(){ return J(QK,{}) }
function usable(w){ var m=TT.m[w]||''; return !!m && !/的衍生词$/.test(m) }
function posOf(m){ var x=(m||'').match(/^([a-z]+)\./); return x?x[1]:'' }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t } return a }
function hesc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] }) }

function qPool(word, mean){
 var list=CHS[ch]||[], same=[], all=[], i, e;
 for(i=0;i<list.length;i++){
  e=list[i];
  if(e[0]===word||!usable(e[0])) continue;
  all.push(e[0]);
  if(posOf(e[1])===posOf(mean)) same.push(e[0]);
 }
 return same.length>=3? same : all;
}

function findSent(p, w){
 var fs=forms(w).map(function(x){ return x.toLowerCase() }), k, j;
 for(k=0;k<p.s.length;k++){
  var t=p.s[k][0], m=t.match(/[A-Za-z][A-Za-z'’-]*/g)||[];
  for(j=0;j<m.length;j++){
   if(fs.indexOf(m[j].toLowerCase())>-1) return {t:t, zh:p.s[k][1], form:m[j]};
  }
 }
 return null;
}

function inText(w, text){
 var fs=forms(w), i;
 for(i=0;i<fs.length;i++){
  if(new RegExp('(?<![A-Za-z])'+esc(fs[i])+'(?![A-Za-z])','i').test(text)) return true;
 }
 return false;
}
function optsFor(word, mean, type, ban){
 var pool=shuffle(qPool(word, mean)), out=[], seen={}, i, txt, pass;
 var right=(type==='e2z')? mean : word;
 out.push(right); seen[right]=1;
 for(pass=0;pass<2&&out.length<4;pass++){
  for(i=0;i<pool.length&&out.length<4;i++){
   if(pass===0 && ban && type!=='e2z' && inText(pool[i], ban)) continue;
   txt=(type==='e2z')? (TT.m[pool[i]]||'') : pool[i];
   if(!txt||seen[txt]) continue;
   seen[txt]=1; out.push(txt);
  }
 }
 return shuffle(out);
}

function qStart(i){
 var pass=document.querySelector('.pass[data-i="'+i+'"]');
 if(!pass) return;
 qClose();
 var ps=TXT[ch][i]; if(!ps) return;
 var ws=(pass.getAttribute('data-ws')||'').split('|').filter(function(w){ return w&&usable(w) });
 if(!ws.length){ toast('这一篇没有可以测的词'); return }
 shuffle(ws);
 var cnt = ws.length<=3? ws.length : (ws.length>=10?5:4);
 ws=ws.slice(0, cnt);
 var pat=['c','e2z','z2e','c','z2e'], qs=[];
 for(var k=0;k<ws.length;k++){
  var w=ws[k], mean=TT.m[w]||'';
  var s=(w.indexOf(' ')>=0)? null : findSent(ps, w);
  var type=pat[k]||'e2z';
  if(type==='c'&&!s) type='e2z';
  var q={w:w, m:mean, type:type, sent:s, picked:-1};
  if(type==='c'){
   q.zh=s.zh; q.form=s.form;
   q.blank=hesc(s.t).replace(new RegExp('(?<![A-Za-z])'+esc(s.form)+'(?![A-Za-z])'),
     '\u0001').replace('\u0001','<span class="blank"></span>');
   if(q.blank.indexOf('class="blank"')<0) type='e2z';
   q.fill=hesc(s.t).replace(new RegExp('(?<![A-Za-z])('+esc(s.form)+')(?![A-Za-z])'), '<b>$1</b>');
  }
  q.type=type;
  q.ans=(type==='e2z')? mean : w;
  q.opts=optsFor(w, mean, type, type==='c'? s.t : null);
  if(q.opts.indexOf(q.ans)<0) q.opts[0]=q.ans;
  qs.push(q);
 }
 QZ={p:i, qs:qs, n:0, ok:0, bad:[], done:false};
 var box=document.createElement('div'); box.className='qzbox';
 pass.appendChild(box);
 qRender();
}

function qRender(){
 if(QZ.p<0) return;
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox');
 if(!box) return;
 var total=QZ.qs.length, head;
 if(QZ.done){
  var tip = QZ.bad.length? ('不太熟的 <b>'+QZ.bad.length+'</b> 个词已经收进生词本，复习时会再见到')
                        : '全对，这一篇的词基本认住了';
  box.innerHTML='<div class="qh"><span class="qn2">完成</span><span>本篇小测</span>'+
   '<button class="qclose">收起</button></div>'+
   '<div class="qdone">答对 <b>'+QZ.ok+'</b> / '+total+' · '+tip+'</div>'+
   (QZ.bad.length? '<div class="qbad">'+QZ.bad.map(function(w){
     return '<span data-ww="'+w+'">'+w+'</span>' }).join('')+'</div>' : '')+
   '<div class="qf"><button class="prim qagain">再测一遍</button><button class="qclose">收起</button></div>';
  return;
 }
 var q=QZ.qs[QZ.n];
 var tags={c:'看句子填词', e2z:'选中文释义', z2e:'选英文单词'};
 head='<div class="qh"><span class="qn2">'+(QZ.n+1)+'/'+total+'</span><span>'+tags[q.type]+'</span>'+
  '<button class="qclose">收起</button></div>';
 var body;
 if(q.type==='c'){
  body='<div class="qq">'+q.blank+
   (document.body.classList.contains('nozh')?'':'<span class="qzh">'+hesc(q.zh)+'</span>')+'</div>';
 } else if(q.type==='e2z'){
  body='<div class="qq"><b class="qw">'+hesc(q.w)+'</b></div>';
 } else {
  body='<div class="qq"><b class="qw">'+hesc(q.m)+'</b></div>';
 }
 var opts='<div class="qo">'+q.opts.map(function(x,k){
  return '<button data-o="'+k+'"><span class="oi">'+'ABCD'.charAt(k)+'</span>'+hesc(x)+'</button>' }).join('')+'</div>';
 box.innerHTML=head+body+opts+'<div class="qf"></div>';
}

function qAnswer(btn){
 if(QZ.p<0||QZ.done) return;
 var q=QZ.qs[QZ.n]; if(!q||q.picked>=0) return;
 var k=+btn.getAttribute('data-o');
 var ok=(q.opts[k]===q.ans);
 q.picked=k;
 if(ok) QZ.ok++; else { QZ.bad.push(q.w); addBook(q.w) }
 var box=document.querySelector('.pass[data-i="'+QZ.p+'"] .qzbox'); if(!box) return;
 var bs=box.querySelectorAll('.qo button');
 for(var i=0;i<bs.length;i++){
  if(q.opts[i]===q.ans) bs[i].classList.add('ok');
  else if(i===k) bs[i].classList.add('no');
  else bs[i].classList.add('dim');
 }
 var sy=(TT.s&&TT.s[q.w])||'';
 var fb=(ok?'<span class="qy">✓ 对了</span>':'<span class="qn">✗ 错了</span>');
 if(q.type==='c'){
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
  if(q.sent.form.toLowerCase()!==q.w.toLowerCase())
   fb+='<i>（原句用的是 '+hesc(q.sent.form)+'）</i>';
  if(!ok) fb+='<span class="qzh">'+(q.fill||hesc(q.sent.t))+'<br>'+hesc(q.sent.zh)+'</span>';
 } else {
  fb+=' · <b>'+hesc(q.w)+'</b> · '+hesc(q.m);
 }

 if(sy) fb+='<span class="qzh">同义替换：'+hesc(sy)+'</span>';
 fb+='<button class="prim qnext">'+(QZ.n+1<QZ.qs.length?'下一题':'看结果')+'</button>';
 box.querySelector('.qf').innerHTML=fb;
}

function qNext(){
 if(QZ.p<0||QZ.done) return;
 QZ.n++;
 if(QZ.n>=QZ.qs.length){
  QZ.done=true;
  qsave(QZ.p, QZ.ok, QZ.qs.length);
  qRender(); qstat();
  if(QZ.bad.length) toast('答错 '+QZ.bad.length+' 个，已收进生词本');
  return;
 }
 qRender();
}

function qsave(i,r,n){
 var o=qrec(); if(!o[ch]) o[ch]={};
 o[ch][i]={r:r, n:n, t:Date.now()};
 set(QK, JSON.stringify(o));
}

function qstat(){
 var o=(qrec()[ch])||{}, k=0, r=0, n=0, i;
 for(i in o){
  if(!o[i]) continue;
  k++; r+=o[i].r||0; n+=o[i].n||0;
  var e=document.querySelector('.qsc[data-q="'+i+'"]');
  if(e) e.innerHTML='<b>'+o[i].r+'/'+o[i].n+'</b> 正确';
  var b=document.querySelector('.qbb[data-i="'+i+'"]');
  if(b) b.textContent='再测';
 }
 var sum=document.getElementById('qsum');
 if(sum) sum.innerHTML = k? ('已测 <b>'+k+'</b>/'+(TXT[ch]||[]).length+' 篇 · 平均 '+
   Math.round(r*100/Math.max(1,n))+'%') : '';
}

function qClose(){
 var b=document.querySelector('.qzbox');
 if(b&&b.parentNode) b.parentNode.removeChild(b);
 QZ={p:-1, qs:[], n:0, ok:0, bad:[], done:false};
}
document.getElementById('zhbtn').classList.add('on');
chips();
document.getElementById('cttl').innerHTML='Unit '+('0'+ch).slice(-2)+' <em>'+TT[ch]+'</em>';
render();
</script>
