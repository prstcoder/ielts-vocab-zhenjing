 going up.","建筑学是整体的艺术;而落成只是它立起来的事实。"],["A structure holds itself up, and to construct it is to put it together.","结构自己撑住自己,而建造就是把它拼起来。"],["To obstruct is to stand in the way of one.","阻碍就是挡住一座建筑的路。"],["To establish a town is to found it, and to build it is to keep going.","建立一座城镇就是奠基,而建设就是继续下去。"],["Concrete and steel give it stability.","混凝土和钢材给它稳定。"]]},{"t":"Where It Stands","s":[["A site is a piece of ground, and a venue is where the event happens.","场地是一块地,而会场是事情发生的地方。"],["A landmark is a building you can navigate by.","地标是一座你可以靠它认路的建筑。"],["The house is situated on a hill, and you can locate it on any map.","这房子位于山上,你在任何地图上都能找到它。"],["To reside is to live there formally; to inhabit is to live there in fact.","reside 是正式地住;inhabit 是事实上住着。"],["Birds migrate and people settle.","鸟迁徙,人定居。"]]},{"t":"Places People Live","s":[["A dwelling is any place you live in.","住所是你住的任何地方。"],["A skyscraper goes up, and a villa spreads out.","摩天楼往上长,别墅往外铺。"],["A mansion has more rooms than people.","豪宅的房间比人多。"],["An apartment is one floor, and a hostel is one bed.","公寓是一层,旅舍是一张床。"],["A lodge, a hut and a cabin are all made of wood.","小屋、茅舍和木屋,都是木头做的。"],["A cellar is below, a shed is behind, and a cottage is smaller than a house.","地窖在下面,棚子在后面,而村舍比房子小。"],["A nursery is for the young, and a cradle is the first bed.","育儿室给小的,而摇篮是第一张床。"],["A shelter is anything that keeps the weather out.","庇护所是任何把天气挡在外面的东西。"]]},{"t":"Inside a Block","s":[["A city is laid out on a grid of blocks.","城市按街区的网格铺开。"],["An aisle is the space you walk down.","过道是你走的那条空。"],["A porch is outside the door, and a corridor is inside.","门廊在门外,走廊在门内。"],["A stair or a staircase goes up; an elevator goes up faster and an escalator carries you.","楼梯往上走;电梯上得更快,自动扶梯把你带上。"],["A handrail is what you hold.","扶手是你抓的东西。"],["A pillar, a column, a beam and a vault hold the roof; an arch and a ceiling close it.","柱、圆柱、梁和拱顶撑住屋顶;拱和天花板把它合上。"],["Eaves keep the rain off the wall, and a chimney takes the smoke away.","屋檐把雨挡在墙外,烟囱把烟带走。"],["A storey is a floor, and a layer is anything in order.","一层楼是一层,而一层也可以是任何有顺序的东西。"]]},{"t":"Rooms and What Is in Them","s":[["A reception and a lobby are where you wait.","接待处和大堂是你等的地方。"],["A parlour and a living room are where you sit, on a bench or in a cabinet-backed chair.","客厅是你坐的地方,坐在长凳上或靠柜的椅子上。"],["A fireplace heats, and a radiator heats better.","壁炉取暖,暖气片更管用。"],["A kitchen, a lavatory, a toilet and a bath are the four you cannot share.","厨房、盥洗室、厕所和浴室,是不能共用的四间。"],["A basin holds water; a balcony holds a view.","盆盛水;阳台盛风景。"],["A reserve and a store keep what you will need later.","储备和仓库保存你以后要用的东西。"],["A mall, a supermarket, a booth and a casino are all places that want your money.","商场、超市、摊位和赌场,都是想要你钱的地方。"],["A studio is one room with everything in it.","单间公寓是一个房间装下一切。"]]},{"t":"The Shape of a City","s":[["Downtown is where the towers are, and urban life is loud.","市中心是高楼所在,而城市生活很吵。"],["Peripheral districts sit at the edge, in the vicinity of the ring road.","外围城区在边缘,在环路附近。"],["A room can be a void or a space; a spacious one is worth the rent.","房间可以是虚空也可以是空间;宽敞的那间值这个房租。"],["An airtight room has no air at all.","密不透风的房间一点空气都没有。"],["An expanse is space you can see across.","开阔地是你能望过去的空间。"],["A plaza is where the city meets itself.","广场是城市与自己相遇的地方。"],["A castle was built to be looked at and not entered.","城堡建来是给人看的,不是给进。"]]},{"t":"Craft on Site","s":[["A carpenter works wood, and a mason works stone.","木匠做木,石匠做石。"],["A tile covers a floor, and brickwork is a wall made of small blocks.","瓷砖盖住地面,而砖砌是一堵小砖块砌成的墙。"],["A suspension bridge hangs, and a hook holds.","悬索桥吊着,而钩子抓住。"],["A lever multiplies force, and a scaffold lets you reach.","杠杆放大力量,脚手架让你够得着。"],["Infrastructure is everything the city stands on.","基础设施是城市立在其上的一切。"],["An apparatus is a machine with a purpose.","器械是有用途的机器。"]]},{"t":"When It Breaks","s":[["A crane lifts, and then it malfunctions.","吊车吊起东西,然后它出故障。"],["To maintain is to keep it working; to fix and to mend are to make it work again.","维护是让它继续运转;修理和修补是让它重新运转。"],["To modify is to change the plan, and to trim is to take a little off.","改动是改方案,而修剪是去掉一点。"],["To weld is to join with heat, to saw is to cut, and to screw and to drill are two ways of making a hole.","焊接用热连接,锯是切,而拧螺丝和钻孔是打洞的两种方式。"],["To plumb is to measure depth, and a plumb line is always straight down.","测深是量深度,而铅垂线永远笔直向下。"],["A viaduct spans a valley, and a dam spans a river.","高架桥跨过山谷,水坝跨过河流。"],["To install is to put it in, and to furnish is to fill the room.","安装是把它放进去,而配家具是把房间填满。"]]},{"t":"In and Out","s":[["Placement is where it goes, and layout is how it sits.","摆放是它放在哪儿,而布局是它怎么待着。"],["Design decides both.","设计决定两者。"],["An entrance and an entry are the way in; an exit is the way out.","入口是进来的路;出口是出去的路。"],["Outside and outward face the street; exterior and external mean the same from the other side.","outside 和 outward 朝向街道;exterior 和 external 是从另一面说的同一件事。"],["Inner and interior are the inside; inward and internal point in.","inner 和 interior 是里面;inward 和 internal 指向内。"],["To enter is a verb, and an entry is the thing you wrote down.","enter 是动词,而 entry 是你记下来的那一条。"]]}],"14":[{"t":"Going Somewhere","s":[["To navigate is to know where you are and where you are going.","航行就是知道自己在哪里、要去哪里。"],["A voyage is long and by water; aviation is the same idea in the air.","voyage 是长途水路;aviation 是同一个想法搬到了空中。"],["A journey is the travelling; travel is the habit.","旅程是那一段路;旅行是那个习惯。"],["A safari is a journey to look at animals.","safari 是去看动物的旅程。"],["A parade moves through the street for people to watch.","游行穿过街道,给人看。"],["A haunt is a place you keep going back to.","常去之处是你一再回去的地方。"]]},{"t":"What People Come to See","s":[["An attraction is anything that pulls a visitor in.","景点是任何能把游客拉进来的东西。"],["A memorial keeps a name alive, and a pyramid keeps a king.","纪念碑让一个名字活着,金字塔让一位国王留着。"],["The oldest attractions are the ones nobody built to be visited.","最古老的景点,是没人为了被参观而建的。"]]},{"t":"Before You Go","s":[["A port is where you leave a country, and a visa is the permission to come back in.","口岸是你离开一个国家的地方,而签证是允许你回来的东西。"],["Traffic is the price of going anywhere at the same time as everyone else.","交通是所有人在同一时间去同一处所付的代价。"],["An airline owns the planes; an airplane and a jet are the planes themselves.","航空公司拥有飞机;而 airplane 和 jet 就是飞机本身。"],["A helicopter needs no runway, and a parachute needs no engine.","直升机不需要跑道,降落伞不需要发动机。"],["A flight has a pilot and a passenger list.","一次航班有飞行员和一份乘客名单。"]]},{"t":"What You Carry","s":[["Baggage and luggage mean the same, but only one is countable.","baggage 和 luggage 意思相同,但只有一个可数。"],["A suitcase goes in the hold, and a carry-on stays with you.","行李箱进托运,随身行李跟着你。"],["A rack holds it up, and freight is what it becomes when you sell the space.","行李架把它架起来,而运费是当你把空间卖掉之后它变成的东西。"],["A fare is the price of the seat.","票价是一个座位的价格。"],["An atlas is a book of maps, a route is a line on one, and an itinerary is the order you do it in.","地图册是一本地图,路线是上面的一条线,而行程表是你按顺序做的安排。"],["A passage is a way through, and also the ticket for it.","通道是一条穿过去的路,也是过它的那张票。"]]},{"t":"On the Road","s":[["An intersection is where two roads meet, and to cross is to go over.","路口是两条路相遇的地方,而穿过是走过去。"],["A way, a path and a lane are all narrow; an avenue is wide, and a highway is wide and fast.","way、path 和 lane 都窄;avenue 宽,highway 又宽又快。"],["A curb marks the edge, and a signpost tells you which way.","路缘标出边,而路标告诉你怎么走。"],["To pave a road is to make it smooth for a vehicle.","铺路是让车好走。"],["An auto is simply a car in older English.","auto 就是旧英语里的汽车。"]]},{"t":"Wheels","s":[["An express stops for nobody.","快车不为谁停。"],["A tram runs on rails in a street, and a coach runs between cities.","有轨电车在街上沿轨跑,长途客车在城市之间跑。"],["An ambulance goes fast for one person, and a truck or a lorry carries what people buy.","救护车为一个人开快,而卡车或货车运人们买的东西。"],["A van is small, a wagon is long, and a carriage carries people in comfort.","厢式车小,货车长,而车厢舒舒服服地载人。"],["A tractor pulls, a cart is pulled, and a pedicab is pulled by a man on a cycle.","拖拉机拉,马车被拉,而三轮车由一个骑自行车的人拉。"],["A garage keeps it, a motor turns it, and horsepower measures how hard.","车库收着它,马达转它,而马力衡量它有多大力。"],["A wheel rolls, a brake stops it, and a tyre is what meets the road.","车轮滚,刹车让它停,而轮胎是与路面接触的那部分。"],["To honk is to say something you cannot repeat.","按喇叭是说一句你不能重复的话。"]]},{"t":"In Trouble","s":[["A crew works the ship, and a captain answers for it.","船员干活,而船长对它负责。"],["A steward looks after you, and an emergency looks after nobody.","乘务员照顾你,而紧急情况谁也不照顾。"],["A wreck is what is left; a crash is how it happened.","残骸是剩下的东西;撞毁是它怎么发生的。"],["To crush is to press until it breaks, and to dash is to run until you hit something.","压碎是压到它坏,而猛冲是跑到撞上什么。"],["Things vanish and disappear in the same way.","东西以同样的方式消失。"],["A hazard is a danger you can see.","危险源是你看得见的危险。"]]},{"t":"At the Harbour","s":[["A harbour shelters, and a dock is where the ship ties up.","港口提供庇护,而码头是船系住的地方。"],["An anchor holds it down, and to submerge is to go under.","锚把它拉住,而下沉是到水面以下。"],["A sailor and a seaman do the same work with different contracts.","水手和海员干同样的活,合同不同。"],["A carrier carries, a steamer was driven by steam, and a liner was built for a line.","承运船负责运,汽船靠蒸汽驱动,邮轮是为一条航线而造的。"],["A vessel is any ship, and a ferry crosses the same water every day.","vessel 是任何船,而渡轮每天横过同一片水。"],["To sail is to use the wind; a raft, a canoe and an oar are the oldest way.","航行是利用风;木筏、独木舟和桨是最古老的办法。"],["A deck is the floor, and a turbine or a propeller is the push.","甲板是地板,而涡轮或螺旋桨是推力。"],["The stern is the back, and aboard means on it.","船尾在后面,而 aboard 表示在船上。"],["To embark is to step on.","上船是踏上那一步。"]]},{"t":"Lines Through the Land","s":[["A channel is a natural way for water, and a canal is a dug one.","水道是天然的,而运河是挖出来的。"],["A ditch is small and a tunnel is long.","沟小,隧道长。"],["A railroad or a railway carries a locomotive, and a subway or underground carries people under the city.","铁路载机车,而地铁把人送到城市下面。"],["A rail is one line of steel.","钢轨是一条钢。"]]},{"t":"Timing","s":[["You depart from one place and arrive at another.","你从一个地方出发,在另一个地方抵达。"],["The destination is the point of the whole thing.","目的地是这一切的意义。"],["A delay is short; to postpone is to move it; to defer is to move it and hope nobody notices.","延误是短的;推迟是往后挪;而延缓是往后挪并希望没人注意。"],["A lull is a quiet moment in a loud day.","间歇是吵闹的一天里安静的一刻。"],["A ticket will expire, and the payment is due before it does.","票会过期,而付款在它过期之前到期。"]]},{"t":"Send It","s":[["Postage is what you pay, and a stamp is the proof.","邮资是你付的钱,而邮票是凭证。"],["Mail goes in a packet or a package, and both are bound with tape.","邮件装进小包或包裹,两者都用胶带捆上。"],["A parcel is a package with a shape.","parcel 是有形状的包裹。"],["To load is to put it on, and a burden is a load you feel.","装载是把它放上去,而负担是你感觉得到的重量。"],["To transfer is to move it once, and to transmit is to send it through something.","转移是挪一次,而传输是通过什么把它送出去。"],["Transit is the time in between.","在途是中间那段时间。"],["To deliver is to place it in a hand, and to convey is to carry the idea as well.","投递是把它放到一只手里,而传达是把意思一起带过去。"]]},{"t":"How Fast","s":[["Speed is how far in how long.","速度是多远除以多久。"],["Velocity adds a direction to it.","速率给它加上了方向。"],["Something swift is quick and quiet about it.","swift 是快,而且快得不出声。"]]},{"t":"Tied Up","s":[["To bind a parcel is to tie it so it holds.","捆包裹是把它扎住,让它不散。"]]}],"15":[{"t":"How a Country Is Run","s":[["A republic has no king, and a democracy has no fixed answer.","共和国没有国王,而民主没有固定答案。"],["A government holds authority, and a regime holds it harder.","政府握有权威,而政权握得更紧。"],["A political system is a hierarchy of offices.","政治制度是一套职位的等级。"],["A bureaucracy grows because paperwork breeds paperwork.","官僚制度会生长,因为文书生文书。"],["Socialism, communism and Marxism are three names for one argument about who owns what.","社会主义、共产主义和马克思主义,是关于谁拥有什么的一场争论的三个名字。"],["An egalitarian wants everyone level; materialism says the level is measured in things.","平等主义者希望人人齐平;唯物主义说齐平是用东西来量的。"]]},{"t":"Change and Resistance","s":[["A revolution is fast, and a reform is slow.","革命快,改革慢。"],["The process takes longer than anyone promised.","这个过程比任何人承诺的都长。"],["A conservative wants to keep it; a municipal council wants to tidy it.","保守派想保住它;市政委员会想把它收拾整齐。"],["A meltdown is when the whole thing stops at once.","崩溃是整件事一下子停下。"],["A neutral country takes no side, and a bilateral agreement takes two.","中立国不站边,而双边协议要两方。"]]},{"t":"Where They Meet","s":[["An arena is where the argument happens.","舞台是争论发生的地方。"],["A flag and a banner both say whose side you are on.","国旗和横幅都在说你在哪一边。"],["A president leads a republic; a premier leads a government.","总统领导共和国;总理领导政府。"],["A minister runs a ministry, and a secretary keeps the record.","部长管一个部,而秘书管记录。"],["A parliament debates, and a senate revises.","议会辩论,参议院修订。"],["A conference is formal, and a meeting is not.","大会是正式的,会议不是。"],["A headquarters is where the decisions are made, and a delegation speaks on behalf of the rest.","总部是做决定的地方,而代表团代表其余的人说话。"]]},{"t":"Office and Officer","s":[["The police keep order, and a statesman keeps a promise.","警察维持秩序,而政治家守住承诺。"],["A mayor runs a city, and a service runs itself.","市长管一座城,而一个部门自己运转。"],["An office is a room, a bureau is a desk, and a department is a floor.","office 是一间房,bureau 是一张桌,而 department 是一层楼。"],["An administration is the whole machine for four years.","一届政府是这台机器运转四年。"]]},{"t":"Power and Influence","s":[["To dominate is to hold the room without speaking.","支配是不说话也握住整间屋子。"],["Power is the ability to make it happen; influence is the ability to make it likely.","权力是让它发生的能力;影响力是让它变得可能的能力。"],["To affect is to change it without meaning to.","影响是在无意中改变它。"],["Importance is how much it matters, and significance is how much it means.","重要性是它有多要紧,而意义是它有多深。"]]},{"t":"Groups of People","s":[["An organisation is planned, and an association is joined.","组织是被规划出来的,而协会是被加入的。"],["A union stands for its members, and a community stands for itself.","工会代表它的成员,而社区代表它自己。"],["A consortium is a group of companies, and a league is a group of teams.","联合体是一组公司,而联盟是一组队伍。"],["An institution outlives the people in it.","机构比里面的人活得久。"],["To unite is to become one, and unique means there is only one.","联合是变成一个,而独特意味着只有一个。"]]},{"t":"Nation and World","s":[["A nation is a people before it is a border.","民族先是一群人,然后才是一条边界。"],["A global problem is worldwide, and a federal state shares power.","全球问题是世界性的,而联邦制国家分享权力。"],["Foreign policy looks outward, and overseas means across the sea.","外交政策向外看,而 overseas 指隔着海。"],["To go abroad is to leave home for a while.","出国是离家一段时间。"],["Civil order is what holds when nothing else does.","社会秩序是别的都不管用时还管用的那个。"]]},{"t":"Coming and Going","s":[["To emigrate is to leave; to immigrate is to arrive.","移出是离开;移入是到达。"],["A king will reign for as long as the throne holds him.","国王在位多久,取决于王座能撑他多久。"],["A puppet government does what another hand decides.","傀儡政府做另一只手决定的事。"],["A crown and a wreath both sit on a head, but only one is heavy.","王冠和花环都戴在头上,但只有一个沉。"],["A colony is ruled from far away.","殖民地是从很远的地方被统治的。"],["Liberty and independence are not the same: one is inside a state, the other is a state.","自由与独立不同:一个在国家的内部,另一个是国家本身。"]]},{"t":"Who Lives Here","s":[["A slum grows where nothing else can.","贫民窟在没有别的可能的地方长出来。"],["A refuge and an asylum are both places you run to.","避难所和庇护是两种你跑去的地方。"],["Population is a number; demographic is the shape of it.","人口是一个数字;人口结构是这个数字的形状。"],["A citizen has rights, and a resident has an address.","公民有权利,而居民有地址。"],["Ethnic and racial describe groups, not persons.","ethnic 和 racial 描述的是群体,不是个人。"],["A clan is a family that got large.","氏族是一个变大了的家庭。"]]},{"t":"The Vote","s":[["The franchise is the right to vote.","选举权就是投票权。"],["A law may entitle you to it, or deny it.","法律可能赋予你这个权利,也可能否认。"],["A preference is what you choose when you can.","偏好是你能选时你选的。"],["To elect is to choose and then be bound by it.","选举是选择,然后被这个选择绑住。"],["A respondent answers the poll.","受访者回答民调。"],["Ambition makes a candidate, and a nomination makes a candidate official.","野心造出候选人,而提名让候选人正式化。"],["A checklist and a succession are both about order.","清单和继任都关乎顺序。"]]},{"t":"The Common Good","s":[["Safety is a service, not a state.","安全是一种服务,不是一个状态。"],["Welfare and well-being differ: one is paid for, the other is felt.","福利与幸福不同:一个是被支付出来的,一个是被感受到的。"],["Harmony is quiet, and steady is slow.","和谐是安静的,而稳定是缓慢的。"],["To flourish is to grow well, and to succeed is to arrive.","兴旺是长得好,而成功是到达。"],["A prospect is what may come; a perspective is where you stand to see it.","前景是可能来的东西;而视角是你站着看它的位置。"],["A viewpoint and a standpoint are the same place with different furniture.","观点和立场是同一个地方,摆了不同的家具。"],["An outlook is the view, and a guideline is the path.","outlook 是眼界,而 guideline 是路径。"],["An ethic is a rule you hold when nobody is watching.","伦理是没人看的时候你守的那条规矩。"]]},{"t":"Say It Officially","s":[["To suggest is soft, to advise is warm, and a proposal is written down.","建议是软的,劝告是热的,而提案是写下来的。"],["A hint is a suggestion that denies being one.","暗示是一个否认自己是建议的建议。"],["To declare is public, to affirm is firm, and to claim is unproven.","宣布是公开的,断言是坚定的,而声称是未证实的。"],["To proclaim is louder than to state, and to announce is more official.","宣告比陈述响,而通告更正式。"],["To clarify is to take the doubt out.","澄清是把疑虑拿掉。"]]},{"t":"Help It Happen","s":[["To assist is to be there; to aid is to send something.","协助是人在那里;援助是送出东西。"],["To encourage is to make it easier to try.","鼓励是让尝试变得容易。"],["To implement is to do what was agreed.","实施是把议定的事做出来。"],["To monitor is to watch without interfering.","监测是不干预地看。"],["To admit is to say it at last.","承认是终于说出来。"]]},{"t":"Where They Come From","s":[["An African country, a European union, a Latin economy.","一个非洲国家,一个欧洲联盟,一个拉美经济体。"],["A Jewish community, an Arabian city, a Portuguese sailor, a Roman law.","一个犹太社区,一座阿拉伯城市,一位葡萄牙水手,一部罗马法。"],["A Russian winter, a Spanish city, a Swiss bank, a Greek island, an Italian kitchen.","一个俄罗斯的冬天,一座西班牙城市,一家瑞士银行,一座希腊岛屿,一间意大利厨房。"],["A Soviet era, an Indian railway, an Australian summer, a New Zealand farm, a Canadian lake.","一个苏联时代,一条印度铁路,一个澳大利亚的夏天,一座新西兰农场,一片加拿大湖泊。"],["Britain, France and Germany sit at the same table.","英国、法国和德国坐在同一张桌子旁。"]]},{"t":"Two More Names","s":[["To nominate is to put a name forward.","提名是把一个名字推出去。"],["Australia and Canada are both federations with a federal capital nobody visits.","澳大利亚和加拿大都是联邦制国家,都有一个没人去的联邦首都。"]]}],"16":[{"t":"The Economy","s":[["An economy is what a country does all day.","经济是一个国家一整天在做的事。"],["Trade moves goods across a border, and a market decides the price.","贸易让货物过境,而市场决定价格。"],["Industry makes things; a merchant sells them.","工业制造东西;商人把它们卖掉。"],["A financial system lends the money to do both.","金融体系借出做这两件事的钱。"],["A fund collects money, and to donate or endow is to give it away.","基金收钱,而捐赠或资助是把它给出去。"],["A commercial success is one that pays for itself.","商业上的成功,是指它自己把自己付清了。"]]},{"t":"Selling It","s":[["To advertise is to buy attention.","做广告就是买注意力。"],["A slogan is the sentence you remember by accident.","标语是你不知不觉记住的那句话。"],["To purchase is to buy, and to lease is to rent for years.","purchase 是买,而 lease 是租上好几年。"],["To afford is to be able to, and retail is where most of us do it.","afford 是付得起,而零售是我们大多数人买东西的地方。"],["A grocery is a small shop by the door.","杂货店是门口那家小店。"],["A discount, a promotion, a voucher and a coupon all make the price smaller.","折扣、促销、代金券和优惠券,都把价格变小。"]]},{"t":"Money in Hand","s":[["Currency is what a country counts in.","货币是一个国家用来计数的东西。"],["To exchange is to trade one for another; to swap is to do it casually.","兑换是一种换另一种;而互换是随手换。"],["A receipt says you paid, and an invoice says you must.","收据说明你付了,而发票说明你必须付。"]]},{"t":"What the State Takes","s":[["A tax is general, and a levy is for one purpose.","税是普遍的,而征收是为一个特定目的。"],["A tariff is a tax on imports, and a duty is a tax on a thing.","关税是对进口征的税,而 duty 是对某件东西征的税。"],["To impose is to put it on whether you like it or not.","征收是无论你愿不愿意都加上去。"],["To consume is to use it up; to spend is to let it go.","消耗是用掉;花费是让它走。"],["A cost is what it takes, and an expense is what you record.","成本是它所耗费的,而开支是你记下来的。"]]},{"t":"Good Times, Bad Times","s":[["Revenue is what comes in, and gross means before anything is taken out.","收入是进来的,而 gross 指什么都还没扣。"],["A recession is two quarters of falling; a depression is a decade of it.","衰退是两个季度的下滑;萧条是十年的下滑。"],["A crisis is the moment you must choose.","危机是你必须选择的时刻。"]]},{"t":"Debt and Inflation","s":[["A security is a promise you can sell.","证券是一个你能卖掉的承诺。"],["A bond is a loan with a date on it.","债券是一笔带日期的借款。"],["Debt is what you owe, and a deficit is what you owe this year.","债务是你欠的,而赤字是你今年欠的。"],["Inflation makes money smaller, and deflation makes it bigger and harder to get.","通胀让钱变小,而通缩让钱变大也更难拿到。"]]},{"t":"Up and Down","s":[["To dwindle is to get fewer and fewer.","减少是越来越少。"],["To decrease, to decline, to diminish and to reduce all go down.","decrease、decline、diminish 和 reduce 都是往下。"],["To downsize is to do it to people.","缩减规模是把这件事做在人身上。"],["To increase, to escalate and to expand all go up.","increase、escalate 和 expand 都是往上。"],["An increment is a small step up, and growth is the whole climb.","增量是一小步上升,而增长是整段爬升。"],["An influx is when they all arrive at once.","涌入是他们一下子全到了。"]]},{"t":"Rich and Short","s":[["An affluent suburb has nothing to hide.","富裕的郊区没什么可隐藏的。"],["To enrich is to make richer, and to be sufficient or adequate is to have enough.","致富是让更富,而充足或够用是有足够的。"],["Spare money is money left over; a saving is money kept.","闲钱是剩下的钱;储蓄是存下的钱。"],["Redundant means there is more than needed, and a lack means there is not.","冗余意味着多过所需,而缺乏意味着没有。"]]},{"t":"The Firm","s":[["A company, a firm and an enterprise are the same thing at three sizes.","公司、商行和企业,是同一个东西的三种规模。"],["An agent acts for you, and an entity is anything that can be sued.","代理人替你行动,而实体是任何可以被起诉的东西。"],["To invest is to put money in and wait.","投资是把钱放进去然后等。"],["Input goes in, and a product comes out.","投入进去,产品出来。"],["An acquisition is a purchase of the whole thing.","收购是把整个买下来。"],["Goods are what you sell, and cargo is what carries them.","货物是你卖的东西,而船货是运它们的东西。"]]},{"t":"Promise and Paper","s":[["To insure is to pay now for a maybe later.","投保是为以后的可能现在付钱。"],["To guarantee is to say you will cover it.","担保是说你负责。"],["Something reliable does it every time.","可靠的东西每次都做得到。"],["A negotiation is two people finding out what the other can live with.","谈判是两个人弄清对方能接受什么。"],["To attend is to be there, and to be absent is to be counted anyway.","出席是人在那里,而缺席照样被算进去。"]]},{"t":"Buying and Selling","s":[["A sale is one, and wholesale is a hundred at once.","一次买卖是一件,批发是一次一百件。"],["An auction is a price that goes up; a bid is your offer.","拍卖是往上走的价格;出价是你的报价。"],["A deal and a transaction are the same handshake with more paper.","交易和一笔业务,是同一次握手,纸更多。"],["Turnover is how much passed through your hands.","营业额是有多少从你手里过。"],["To dump is to sell below cost and ruin the market.","倾销是低于成本卖,把市场毁掉。"],["To export is to send out, and to import is to bring in.","出口是送出去,进口是带进来。"],["A quota says how many you may bring.","配额说你可以带多少。"]]},{"t":"Shares and Wages","s":[["A share is a piece of the company, and a stock is a lot of them.","股份是公司的一块,而股票是很多块。"],["A benefit and an interest both mean something you gain.","benefit 和 interest 都指你得到的东西。"],["An account holds it, and a deposit puts it in.","账户装着它,而存款把它放进去。"],["An instalment is a payment in pieces; a cheque is a payment on paper.","分期付款是分块付的钱;支票是纸上的付款。"],["Cash and coin are money you can drop.","现金和硬币是你能掉在地上的钱。"],["A shilling and a copper are both old money.","先令和铜币都是旧钱。"]]},{"t":"Wealth and Work","s":[["Treasure is hidden, and wealth is counted.","财宝是藏起来的,而财富是被数出来的。"],["An estate is everything you leave; to possess is to hold it now.","遗产是你留下的一切;而拥有是现在握着它。"],["A legacy is what a name leaves behind.","遗赠是一个名字留下的东西。"],["To descend is to pass down to the next.","传下是交到下一代手里。"],["Something worthy deserves it, something valuable is worth money, and something cheap costs little.","worthy 值得,valuable 值钱,而 cheap 花得少。"],["An incentive makes you start, and to accelerate and to prompt both make it sooner.","激励让你开始,而加速和促使都让它更早。"]]},{"t":"Pay and Position","s":[["A salary is yearly, an income is anything in, and a wage is by the hour.","薪水是按年,收入是进来的任何钱,而工资是按小时。"],["A payment is one, and a refund or a reimbursement gives it back.","付款是一次,而退款或报销把它还回来。"],["A payroll is the list, and remuneration is the word a contract uses.","工资单是那张表,而报酬是合同用的词。"],["A subsidy is the state paying part of it.","补贴是国家替你付一部分。"],["To earn is to deserve it.","挣得是它值得你拿。"]]},{"t":"The Job","s":[["An undertaking is big, and a career is long.","事业是大工程,而生涯是长的。"],["A profession needs a licence, and an occupation only needs a day.","职业需要执照,而occupation 只需要一天。"],["A job is what you do, and a vocation is what you cannot help doing.","工作是你在做的,而天职是你忍不住要做的。"],["Labour is the work, and the workforce is the people.","劳动是活儿,而劳动力是人。"],["A workaholic cannot stop; personnel is the department that counts them; a clerk files the rest.","工作狂停不下来;人事部数他们;文员把其余的归档。"]]},{"t":"Getting and Losing It","s":[["An interview is a test you both take.","面试是你们双方都要参加的一场考试。"],["A résumé is a life in one page, and to recommend is to lend your name.","简历是一页纸的一生,而推荐是借出你的名字。"],["To employ and to hire are the same door in; to fire, to dismiss, to discharge and to sack are the same door out.","雇用和聘用是同一扇进门;解雇、开除、辞退和解职是同一扇出门。"],["A lay-off is not your fault.","裁员不是你的错。"],["To resign is to leave first, and to retire is to leave for good.","辞职是先走,而退休是彻底离开。"]]},{"t":"Outcome","s":[["A result is what happened; a failure is a result you did not want.","结果是发生了什么;失败是你不想要的那个结果。"],["A loss is what it cost you.","损失是它让你付出的代价。"],["An opportunity and a chance are the same window.","机会和机遇是同一扇窗。"],["To choose is to close the others.","选择就是关上其余的。"],["To change, to solve, to develop and to improve are four ways forward.","改变、解决、发展和改进,是往前的四条路。"],["Something sustainable can go on; something that cannot will not.","可持续的能继续;不能的就不会。"],["To manage, to regulate, to coordinate and to cooperate are four kinds of control.","管理、调节、协调和合作,是四种控制。"],["A sanction punishes, and collaboration pays.","制裁是惩罚,而协作是回报。"]]},{"t":"Money Back","s":[["To reimburse is to give the money back after you spent it.","报销是你花完之后把钱还给你。"],["An abortion is a plan that stopped early.","流产是一个早早停下的计划。"],["To collaborate is to work with someone you did not choose.","合作是和一个你没挑的人一起干。"]]}],"17":[{"t":"The Rule and the Rulebook","s":[["A law is written down, and a legal system is built on it.","法律是写下来的,而法律体系建在它上面。"],["A rule is smaller than a law, and a regulation is smaller still.","规则比法律小,而规章更小。"],["A treaty and an agreement are signed by two states.","条约和协定由两个国家签署。"],["A charter gives rights, and a protocol says how to behave.","宪章给予权利,而议定书规定怎么行事。"],["A norm is what people do, and a benchmark is what they are measured against.","规范是人们做的,而基准是他们被对照的东西。"],["Criteria are the tests, and a standard is the level.","标准是考验,而水准是水平。"]]},{"t":"Allowed or Not","s":[["To allow is to let it happen; an admission is a formal yes.","允许是让它发生;而准入是一个正式的“可以”。"],["To enforce is to make it happen whether or not anyone agrees.","执行是无论有没有人同意都让它发生。"],["A default is what happens when nobody chooses.","默认是没人选择时发生的事。"],["To reject is to say no and mean it.","拒绝是说不行,而且当真。"],["A constraint holds you in, and a mandatory rule leaves no choice.","约束把你框住,而强制性的规则不留选择。"],["Something potent has force, and something bound must happen.","potent 有力量,而 bound 是必须发生。"],["An obligation is a duty you did not ask for.","义务是你没要的责任。"]]},{"t":"In Court","s":[["A court hears it, and a supreme court hears it last.","法院审理它,而最高法院最后审理。"],["To enact and to legislate are what a parliament does.","颁行和立法是议会做的事。"],["Equity is fairness with a memory of past cases.","衡平是记着旧案的公平。"],["Something fair treats you alike; something just gives you what you are owed.","公平的同等对待你;公正的给你应得的。"],["Prejudice decides before the evidence, and discrimination acts on it.","偏见在证据之前就决定,而歧视照它行事。"]]},{"t":"The Accusation","s":[["To accuse is to say it was you.","指控是说那是你干的。"],["To sue is to ask for money, and to prosecute is to ask for punishment.","起诉是索要赔偿,而公诉是要求惩罚。"],["To condemn is to judge it wrong out loud.","谴责是当众判定它错。"],["To complain is to say you are not satisfied; to boycott is to stop buying until it changes.","投诉是说你不满意;抵制是停止购买直到它改变。"]]},{"t":"Say It in the Room","s":[["A session is one sitting, and a plea is one request.","一次庭期是一次开庭,而请求是一句话的恳求。"],["To mediate is to stand between two people and find the middle.","调解是站在两个人中间,找出中间点。"],["To appeal is to ask a higher court to look again.","上诉是请上级法院再看一遍。"],["To contradict is to say the opposite in the same breath.","反驳是同时说出相反的话。"],["To persuade is to move someone without force.","说服是不用强力把人挪动。"],["A controversy is a disagreement that will not go away.","争议是一个不肯消失的分歧。"],["To whisper, to mutter and to murmur are three volumes of quiet.","低语、嘟囔和含混地说,是安静的三个音量。"],["Someone silent is not speaking; someone mute cannot.","沉默的人是不说话;失语的人是不能说。"]]},{"t":"Finding Out","s":[["To investigate is to look for what was hidden.","调查是找藏着的东西。"],["A witness saw it, and a clue proves it.","证人看见了,而线索证明它。"],["To justify is to give a reason good enough.","证明正当是给出足够好的理由。"],["Something reasonable passes the test; something suitable fits the case.","合理的能通过检验;合适的能对上这个案子。"],["A judge decides the law, and a jury decides the facts.","法官定法律,陪审团定事实。"],["A trial is the whole thing in public.","审判是整件事公开进行。"],["A suspect is not yet guilty.","嫌疑人还不是有罪的。"],["A sentence is what the court gives, in years.","判决是法院给的,以年计。"]]},{"t":"Punishment","s":[["To arrest is to stop a person; to confine is to stop a body.","逮捕是拦住一个人;而关押是拦住一具身体。"],["A jail is short and a prison is long.","监狱短,牢房长。"],["To oversee and to supervise are to watch the work, not do it.","监督和监管是看着活干,不是自己干。"],["To restrict is to set a limit; to restrain is to hold back.","限制是设一个界限;而抑制是拉住。"],["To commit a sin is a religious matter; to commit a crime is a legal one.","犯罪在宗教上是一种罪;在法律上是一项罪行。"],["A vice is a habit that costs you.","恶习是一个让你付出代价的习惯。"]]},{"t":"Crime","s":[["A bribe buys a decision.","贿赂买一个决定。"],["To rob is to take with force; to steal is to take in secret; a thief does both.","抢劫是用强力拿走;偷是暗中拿走;小偷两样都干。"],["A pirate takes at sea, and murder takes a life.","海盗在海上夺取,而谋杀夺走生命。"],["Suicide takes your own.","自杀夺走自己的。"],["To deceive is to make someone believe; to cheat is to win by it.","欺骗是让人相信;作弊是借此获胜。"],["Fraud is a lie with paperwork, and a liar tells it twice.","欺诈是带文件的谎,而说谎的人讲两遍。"],["A trap and a trick both wait for you to move first.","陷阱和诡计都等你先动。"],["To pretend and to fool are the same smile with different intent.","假装和愚弄是同一个笑,意图不同。"]]},{"t":"After the Verdict","s":[["A stigma stays after the sentence ends.","污名在刑期结束后还在。"],["To confess is to stop denying, and to conform is to stop differing.","供认是停止否认,而遵从是停止不同。"],["To reconcile is to make two sides live together again.","和解是让两边重新一起过。"],["To obey is easy until it costs something; to succumb is to give in to it.","服从在不出代价前很容易;而屈服是向它低头。"],["A penalty is the price, and a fine is the receipt.","刑罚是代价,而罚款是收据。"],["A mortgage is a loan that owns your house until you do.","抵押贷款是一笔在你付清前拥有你房子的借款。"],["Ownership and copyright are both about who may say yes.","所有权和版权都关乎谁可以说“可以”。"],["A privilege is a right only some have; to accredit is to make it official.","特权是只有一些人有的权利;认证是让它正式。"]]},{"t":"Procedure","s":[["A procedure is the way it must be done, and a routine is the way it usually is.","程序是必须这样做的方式,而例行是通常那样的方式。"],["A consequence follows, whether you call it one or not.","后果会跟着来,不管你叫不叫它后果。"],["A demand is loud, a request is polite, and a requirement is neither.","要求很响,请求很有礼,而必需条件两者都不是。"],["A petition is a request with names on it.","请愿是一份带签名的请求。"],["To command is to speak from above, and to instruct is to speak with detail.","命令是从上面说话,而指示是说得细致。"],["Access is the door, and an anonymous call is one with no name on it.","准入是那扇门,而匿名电话是没有名字的电话。"],["Something false is not true; something genuine is not fake.","虚假的不是真的;而真正的不假。"]]},{"t":"What the Rule Says","s":[["A rule may require you to do it, not just allow it.","规则可能要求你去做,而不只是允许。"]]}],"18":[{"t":"Conflict","s":[["Violence begins where talking stops.","说话停下的时候,暴力开始。"],["A conflict can be small; the enormity of it is what it costs afterwards.","冲突可以很小;它的巨大在于事后付出的代价。"],["A raid is quick, a campaign is planned, and a battle is one day of it.","突袭很快,战役有计划,而战斗是其中的一天。"],["A struggle lasts longer than either side expected.","斗争比双方预想的都长。"]]},{"t":"Blast and Flame","s":[["An explosion is a sudden burst of air.","爆炸是空气突然爆开。"],["To bombard is to keep sending it, and a bomb is what arrives.","轰炸是不停地送过去,而炸弹是到达的东西。"],["A blast knocks you down, and gunpowder made all of this possible.","气浪把你掀倒,而火药让这一切成为可能。"],["A spark starts it, and a flame or a flare carries it.","火花点燃它,而火焰或信号弹把它传开。"],["Something glitters when it is sharp, and glows when it is warm.","闪是锐利地亮,而发红光是暖着亮。"],["A twinkle is the smallest kind of light.","闪烁是最小的一种光。"]]},{"t":"Weapons","s":[["A tank, a cannon and a missile are three distances of the same argument.","坦克、大炮和导弹,是同一场争论的三个距离。"],["A weapon is anything that ends a discussion.","武器是任何能结束讨论的东西。"],["A pistol is held, a rifle is aimed, and a bullet is already gone.","手枪是握着的,步枪是瞄着的,而子弹已经出去了。"],["A blade, a sword, an ax and a spear are older than any of them.","刀刃、剑、斧和矛,比它们都老。"],["A hammer is a tool until it is not.","锤子是工具,直到它不再是。"],["An arrow needs a bow, and a target needs someone to aim.","箭需要弓,而靶子需要有人瞄准。"],["To deflect is to make it miss.","偏转是让它打不中。"]]},{"t":"Ready","s":[["A helmet and a shield are the two things you hope you never need.","头盔和盾牌是你希望永远用不上的两样东西。"],["To equip is to give the tools, and to provide is to give the rest.","装备是给工具,而提供是给其余的东西。"],["To prepare is to do it before it is needed.","准备是在需要之前做好。"],["To deploy is to move them into place.","部署是把他们挪到位置上。"]]},{"t":"Strike","s":[["To hit and to strike are one movement with different intent.","打和击是同一个动作,意图不同。"],["To beat is to do it again and again.","揍是一下又一下。"],["To punch is with a fist, to chop is with an edge, and to stab is with a point.","拳打用拳头,劈用刃,而刺用尖。"],["A mission is a job you are sent to do.","任务是派你去做的一件事。"]]},{"t":"A Bad Position","s":[["A dilemma has two doors and neither is good.","两难有两扇门,没有一扇是好的。"],["A plight is a situation you did not choose.","困境是你没选的处境。"],["A pitfall is a hole with a nice cover on it.","陷阱是一个盖得很漂亮的坑。"],["A conspiracy is two people deciding for the rest.","阴谋是两个人替其余的人决定。"],["Someone destitute has nothing left.","一无所有的人什么也不剩。"],["Famine comes when the rain does not, and people starve slowly.","饥荒在不下雨时到来,人们慢慢饿死。"],["To deprive is to take away what was there.","剥夺是把原本在那里的拿走。"],["To seize is to take it in one movement, and to pursue is to keep going after it.","夺取是一下拿到,而追击是持续跟在后面。"]]},{"t":"Attack","s":[["A threat does not have to move.","威胁不必动。"],["To offend is to break a rule of feeling.","冒犯是破了感受上的规矩。"],["Aggressive behaviour pushes first.","攻击性的行为先推一下。"],["To invade is to cross a border you were not invited over.","入侵是越过一条没人请你越过的边界。"],["To trespass and to intrude are the same step without permission.","擅自进入和闯入是同一脚步,没有许可。"],["To violate is to break something that was promised.","违反是破坏被承诺过的东西。"],["To attack and to assault both begin it; to challenge is to ask whether they dare.","攻击和袭击都是开始;而挑战是问他们敢不敢。"],["A siege surrounds until it gives up.","围困是围到它放弃。"]]},{"t":"Stop There","s":[["To pause is short, to halt is complete, and to cease is for ever.","暂停很短,止住是彻底的,而停止是永远的。"],["To oppose is to stand against it.","反对是站在它对面。"],["To oppress is to press down on people.","压迫是往下压人。"],["To counter is to answer in kind.","反击是以同样方式回应。"],["To deter is to make them not want to start.","威慑是让他们不想开始。"],["To forbid and to prohibit are the same no, one from a person and one from a law.","禁止和严禁是同一个“不”,一个出自人,一个出自法。"],["To prevent is to make it impossible.","阻止是让它不可能。"]]},{"t":"Loyalty and Blame","s":[["To revolt is to turn against the order.","反抗是转身对着秩序。"],["To betray is to hand over what was trusted to you.","背叛是把托付给你的东西交出去。"],["Treason is betrayal with a country in it.","叛国是带着一个国家的背叛。"],["A rebel fights back, a traitor sells out, and a patriot stays.","反叛者反抗,叛徒出卖,而爱国者留下。"],["To blame is to say whose fault it is, and to reproach is to say it to their face.","归咎是说这是谁的错,而责备是当着他们的面说。"],["Evidence is what is found; proof is what convinces.","证据是被找到的;证明是让人信服的。"]]},{"t":"Fear","s":[["Terror is fear with a crowd in it.","恐怖是带人群的恐惧。"],["Something terrible is bad, something terrific is very good, and they are one letter apart.","terrible 是糟,terrific 是极好,两者只差一个字母。"],["Something horrible makes you turn away.","可怕的东西让你转过头去。"],["An alarm is fear with a sound.","警报是带声音的恐惧。"],["Dread is the fear before, and to frighten is to give it to someone else.","恐惧是事前的怕,而使惊恐是把它给别人。"],["Tension is what a room feels like before it starts.","紧张是开始之前一个房间的感觉。"],["Turbulent water and a turmoil of people are the same disorder.","翻腾的水和混乱的人群,是同一种失序。"]]},{"t":"The Scenario","s":[["A scenario is one version of how it might go.","情景是它可能怎么走的一个版本。"],["An occasion is one day that matters.","场合是重要的一天。"],["A limit and a boundary are the same line, one drawn from inside.","限度与边界是同一条线,一个是从里面画的。"],["A rein holds a horse and, by extension, a temper.","缰绳拉住一匹马,引申开去也拉住脾气。"]]},{"t":"Rivals","s":[["To compete is to want the same thing.","竞争是想要同一样东西。"],["A contest is one round, and to contend is to keep at it.","比赛是一轮,而争斗是一直较劲。"],["A rival is close; a competitor is only in the way.","对手是靠近的;竞争者只是挡在路上。"],["An enemy wants you to lose.","敌人想要你输。"],["Strategy is the plan, and a tactic is one move in it.","战略是计划,而战术是其中的一步。"],["A manoeuvre is a move you hope nobody notices.","调度是你希望没人注意的一步。"],["A blueprint is drawn before anything is built, and a warning is spoken before anything happens.","蓝图在任何东西建成之前画好,而警告在任何事情发生之前说出。"]]},{"t":"Force and Protest","s":[["To compel and to oblige both leave you no choice.","强迫和要求都让你没有选择。"],["To protest is to say it out loud in public.","抗议是在公开场合大声说出来。"],["To refute is to prove it wrong with reasons.","驳斥是用理由证明它错。"],["Might is force that has won before.","强力是曾经赢过的力量。"],["To reinforce is to make it stronger, and to impair is to make it weaker.","加强是让它更强,而损害是让它更弱。"],["To mitigate is to make it less bad; to comfort is to make it easier to bear.","减轻是让它没那么坏;而安慰是让它好受一点。"]]},{"t":"What Happened","s":[["An event is big, and a matter is only important.","事件是大的,而事情只是要紧。"],["To happen and to occur are the same, except that one sounds like a report.","happen 和 occur 一样,只是后者听起来像报告。"],["A savage attack and a reckless one both show no restraint.","野蛮的攻击和鲁莽的攻击,都毫无节制。"],["Something fierce is strong; something foul is wrong.","凶猛的是强的;污浊的是错的。"],["Evil is a choice, and the devil is only its picture.","恶是一种选择,而魔鬼只是它的画像。"]]},{"t":"The Price","s":[["Punishment comes after, and to execute is to end it.","惩罚在后面,而处决是把它结束。"],["To hang was the old way.","绞刑是旧的办法。"],["A sacrifice is what you give up on purpose.","牺牲是你有意放弃的东西。"],["A casualty is a number in a report.","伤亡是报告里的一个数。"],["To bury is the last act, and a funeral is the last day of it.","掩埋是最后一个动作,而葬礼是它的最后一天。"],["A grave and a tomb are the same ground with different walls.","坟墓和陵墓是同一片地,墙不同。"],["Hell is a place people put each other in.","地狱是人们把彼此放进去的地方。"]]},{"t":"At Sea and on Land","s":[["Maritime law begins where the land ends.","海事法从陆地结束的地方开始。"],["A naval fleet is a navy at sea, and a troop is a small group on land.","海军舰队是海上的海军,而一支队伍是陆上的小队。"],["A landing is the hardest part of either.","登陆是两者中最难的部分。"],["A helicopter can hover, and a column can proceed.","直升机可以悬停,而一列队伍可以前进。"],["Progress is the same word with a better mood.","progress 是同一个词,心情更好。"],["A military plan and a nuclear one are not the same kind of risk.","军事计划与核计划不是同一种风险。"],["Poison works without a sound.","毒药无声地起作用。"]]},{"t":"Damage","s":[["To devastate is to leave nothing standing.","毁灭是让什么都不剩。"],["A catastrophe is a disaster with a name.","大灾难是有名字的灾祸。"],["A peril is a risk you can see coming.","危险是你能看见它来的风险。"],["An adventure is a risk you chose.","冒险是你选择的风险。"],["To torture is to hurt on purpose, and to humiliate is to hurt in public.","折磨是故意伤害,而羞辱是当众伤害。"],["Damage is what is left when it stops.","损害是它停下来之后剩下的东西。"],["Something harmful does the damage, and something disturbing does it quietly.","有害的东西造成损害,而令人不安的东西安静地造成它。"]]},{"t":"Interfere","s":[["To mislead is to send someone the wrong way on purpose.","误导是故意把人指错方向。"],["To disturb is to break the quiet; to interrupt is to break the sentence.","打扰是打破安静;打断是打断句子。"],["To interfere is to put a hand in where it was not asked.","干涉是把一只手伸进没请你伸的地方。"],["To retreat and to withdraw are the same step back.","撤退和撤离是同一步后退。"],["To shrink is to become smaller, not to run away.","收缩是变小,不是逃跑。"],["To withstand is to stay standing.","顶住是仍然站着。"],["A compromise is what both sides can call a loss.","妥协是双方都能称之为损失的东西。"]]},{"t":"Give Up, Hold On","s":[["To surrender is to stop fighting; to escape is to leave before you have to.","投降是停止战斗;逃脱是趁还没必要就先走。"],["To avoid is to never be there.","避免是从来不在那里。"],["To quit and to abandon are both to leave something behind.","放弃和抛弃都是把什么留在身后。"],["To forgo is to give it up before you had it.","放弃是还没得到就放手。"],["To discard is to throw it away, and to rid yourself of it is to be glad you did.","丢弃是把它扔掉,而摆脱是庆幸自己扔了。"]]},{"t":"Defend and Win","s":[["To defend is to stand in front; to safeguard is to think ahead.","防御是站在前面;而保障是想到前面。"],["To defeat is to make them stop, and to resist is to refuse to.","击败是让他们停下,而抵抗是拒绝停下。"],["To capture is to take it whole.","俘获是整个拿下来。"],["A victory is one; a triumph is remembered.","胜利是一次;凯旋是会被记住的。"],["To conquer is to keep it afterwards.","征服是之后还留着它。"],["A monument, a tablet and a statue are three ways to make a name last.","纪念碑、铭牌和雕像是让一个名字留下去的三种办法。"],["A medal and honour are what the living get; glorious is the word used at the time.","奖章和荣誉是活人得到的;而光荣是当时用的词。"]]},{"t":"Duty","s":[["To contribute is to give part of it.","贡献是给出其中的一部分。"],["To devote is to give all of it, and to owe is to have been given first.","奉献是给出全部,而欠是先前已被给予。"],["To patrol is to walk the same line again and again.","巡逻是一遍又一遍走同一条线。"],["A guard stays, and camouflage is how he is not seen.","卫兵留下,而伪装是他不被看见的方式。"],["An obstacle is in the way, and a burrow goes under it.","障碍挡在路上,而洞穴从它下面过去。"],["A spy listens, and a scout looks.","间谍听,侦察兵看。"],["A general plans, a soldier does, and a veteran remembers.","将军计划,士兵去做,而老兵记得。"]]},{"t":"Walls and Falls","s":[["To enclose is to put a wall right round it.","围起是用墙把它整个圈住。"],["A wall may collapse before anyone hears it crack.","墙可能在有人听见裂声之前就塌了。"]]}],"19":[{"t":"First and Next","s":[["A pioneer goes first and takes the risk.","先驱走在最前面,承担风险。"],["A prophet says what will happen, and is not believed.","先知说出将要发生的事,却没人信。"],["A herald only announces it.","传令官只负责宣布。"],["An heir waits for the money, and a successor waits for the job.","继承人等的钱,继任者等的位子。"],["A generation waits for the rest of them to stop.","一代人等着其余的人停下来。"]]},{"t":"Family Names","s":[["A surname is shared; a gender is not chosen.","姓氏是共有的;性别不是选的。"],["Sex is the body, and female is one side of it.","sex 是身体,而 female 是其中的一边。"],["A couple lives together; a spouse is the word a form uses.","一对伴侣住在一起;而配偶是表格上用的词。"],["A husband, a grandfather and a father-in-law are three different relations.","丈夫、祖父和岳父,是三种不同的关系。"],["A sibling is a brother or a sister; a cousin is further out.","sibling 是兄弟姐妹;表亲更远一层。"],["A nephew and a niece are one generation down.","侄子和侄女是往下一辈。"]]},{"t":"The Very Young","s":[["Twins begin as an embryo and arrive as an infant.","双胞胎从胚胎开始,以婴儿到来。"],["An orphan has no parents, and a juvenile is young in the eyes of the law.","孤儿没有父母,而 juvenile 在法律眼里是年幼的。"],["A youngster, a youth and a teenager are the same age with different patience.","少年、青年和青少年,是同一年龄,耐心不同。"],["Adolescence is the decade that feels like a week.","青春期是感觉像一周的十年。"],["A gang is a group that will not let you out.","帮派是一个不让你出去的群体。"]]},{"t":"Kin and Folk","s":[["Kin are the ones you cannot avoid.","亲属是你躲不开的那些人。"],["Folk is a warmer word for a lot of them.","folk 是更暖的说法,指一大堆这样的人。"],["A relative is anyone on the family tree.","亲戚是家谱上的任何人。"]]},{"t":"Close to You","s":[["To be intimate is to know the small things.","亲密是知道那些小事。"],["A dear friend is old, and a darling is new.","dear 的朋友是旧的,而 darling 是新的。"],["A lover and a beloved are the same person seen from two sides.","爱人和被爱的人,是同一个人从两面看。"],["Madam is a title, and a hostess is a job.","madam 是称呼,而女主人是一份活儿。"],["A landlady owns the rooms, and a mistress owns the secrets.","女房东拥有房间,而情妇拥有秘密。"],["A housewife works where nobody clocks in.","家庭主妇在没有打卡机的地方工作。"],["A widow has outlived; a maid and a maiden are old words for being young and unmarried.","寡妇活过了他;而女仆和少女是“年轻未婚”的旧说法。"]]},{"t":"In the House","s":[["A household is everyone under one roof.","一家人是同一个屋顶下的所有人。"],["A chore is small, repeated and nobody's idea.","家务琐事是很小、不断重复、没人想出来的事。"],["A host gives, and a guest receives.","主人给,客人受。"],["A landlord owns it, and a tenant pays for it.","房东拥有它,而房客为它付钱。"],["A customer buys once; a client comes back.","顾客买一次;客户会回来。"]]},{"t":"Meeting and Missing","s":[["An encounter is not planned; an appointment is.","相遇不是计划好的;约会是的。"],["To chase is to run after it, and to miss is to arrive late.","追是在后面跑,而错过是到晚了。"],["To accompany is to walk beside.","陪同是走在旁边。"],["A dependent cannot manage alone.","受抚养的人无法独自应付。"]]},{"t":"The Wedding","s":[["To propose is to ask the question, and an engagement is the wait for the answer to become a date.","求婚是问那个问题,而订婚是等答案变成日期。"],["To marry is one day; a wedding is the same day with guests.","结婚是一天;婚礼是同一天加上客人。"],["A honeymoon is the week you do not answer the phone.","蜜月是你不接电话的那一周。"],["To kiss is the shortest ceremony.","亲吻是最短的仪式。"],["To divorce is to undo it; to separate is to stop before undoing it.","离婚是把它撤销;分居是撤销之前先停住。"]]},{"t":"One and Only","s":[["Single means not married; sole means only one.","single 指未婚;sole 指只有一个。"],["Respective means each in their own order.","各自的指按各自的顺序。"],["Each is one by one, and an individual is one on their own.","each 是一个一个,而个人是单独的一个。"]]},{"t":"Around You","s":[["A commuter goes there and back every day.","通勤者每天来回。"],["A neighbourhood is what you call a place when you live in it.","街区是你住进去之后对那个地方的称呼。"],["A member belongs, and a boss decides.","成员属于,而老板决定。"],["A manager runs it, a supervisor watches it, and a subordinate does it.","经理管它,主管盯它,而下属做它。"],["A partner shares it, a colleague works beside you, and a comrade shares the fight.","合伙人分享它,同事在你旁边干活,而同志共担这场仗。"],["An acquaintance knows your name, and a friendship knows your habits.","熟人知道你名字,而友谊知道你的习惯。"],["Affection is quieter than love and lasts longer.","喜爱比爱安静,也活得更久。"],["A stranger knows neither.","陌生人两样都不知道。"]]},{"t":"Titles","s":[["An apprentice learns by doing, and a deputy does when the other cannot.","学徒边做边学,而副手在别人不能时顶上。"],["A hero and a heroine are the same courage with two spellings.","男英雄和女英雄,是同一种勇气,两种拼法。"],["An actress acts, a director decides, and a proponent argues for it.","女演员演,导演决定,而支持者替它争辩。"],["A committee talks, and a council decides.","委员会讨论,而理事会决定。"],["A delegate speaks for others, and a specialist knows one thing well.","代表替别人说话,而专家把一件事知道得很透。"],["A consultant is paid for the opinion.","顾问是靠意见拿钱的。"],["A veterinary treats animals, and a counsellor treats the rest.","兽医治动物,而咨询师治其余。"],["A solicitor writes, and an attorney speaks in court.","事务律师写,而辩护律师在庭上说。"]]},{"t":"Jobs and Hands","s":[["An umpire has no side.","裁判不站边。"],["A cashier counts, a fireman runs in, and a nurse stays.","收银员数钱,消防员跑进去,而护士留下。"],["A gardener waits a season; a barber waits a month.","园丁等一季;理发师等一个月。"],["A haircut is the result, and the barber is the cause.","发型是结果,而理发师是原因。"],["A fisherman works at night, and a butcher works in the cold.","渔夫夜里干活,屠夫在冷里干活。"],["A groom waits at the front, and a hostage waits in a room.","新郎在前面等,而人质在房间里等。"]]},{"t":"The Bottom","s":[["To toil is to work without reward.","苦干是没有回报地干。"],["A beggar asks, a slave cannot refuse, and a coward does neither.","乞丐开口要,奴隶不能拒绝,而懦夫两样都不做。"]]},{"t":"Three Titles","s":[["A gay couple may marry in more countries than a decade ago.","同性伴侣如今能结婚的国家比十年前多。"],["A chancellor runs a university; a commander runs an army.","校长管一所大学;指挥官管一支军队。"]]}],"20":[{"t":"Act and React","s":[["To act is to do something; to behave is to do it in a certain way.","行动是做一件事;而举止是以某种方式做。"],["A deed is the act after it is done.","行为是做过之后的那个行动。"],["To accustom yourself is to do it until it is normal.","使自己习惯就是做到它变成正常。"],["To react is to answer at once; to respond is to answer with thought.","反应是立刻回应;而回应是带着思考回答。"],["To reflect is to turn it over afterwards.","反思是事后把它翻过来看。"]]},{"t":"Keep It Going","s":[["To adopt is to take it as your own.","采纳是把它当成自己的。"],["To nourish is to feed it so it grows.","滋养是喂它让它长。"],["To mow is to cut the grass, and to support is to hold it up.","割草是剪草,而支撑是把它托住。"],["To exhale is to let the air out, and intake is what goes in.","呼气是把气放出去,而摄入是进去的东西。"],["To revive is to bring it back; to survive is to never quite stop.","复苏是把它带回来;而幸存是从来没完全停下。"]]},{"t":"Look at It","s":[["To glare is to look with anger.","怒视是带着怒气看。"],["To glimpse is to see it for a second, and a glance is the look you give.","瞥见是看到一秒钟,而一瞥是你给的那一眼。"],["To peep is to look when you should not.","偷看是不该看的时候看。"],["To gaze is to look for a long time and enjoy it; to stare is to look too long and not enjoy it.","凝视是看很久且享受;而盯着是看太久且不享受。"],["To peer is to look hard because it is dark or far.","费力看是因为暗或远。"],["To contemplate is to look with the mind as well as the eyes.","沉思是用脑子一起看。"]]},{"t":"Promises","s":[["A vow is the strongest promise you can make out loud.","誓言是你能大声做出的最强承诺。"],["An oath is a vow with something holy in it.","誓词是带着神圣成分的誓言。"],["A pledge is a promise with something given as proof.","保证是带着抵押作证的承诺。"]]},{"t":"Say Something","s":[["To whistle is to speak without words.","吹口哨是不用词地说话。"],["To reply is to answer, and to notify is to make sure they know.","回复是回答,而通知是确保他们知道。"],["To assert is to say it as a fact, and to explain is to make it clear.","断言是当作事实说,而解释是把它说清。"],["A quarrel is loud and short, a dispute is long, and an argument has reasons in it.","争吵又响又短,纠纷很长,而论证里面有理由。"],["To mention is to say it in passing.","提及是顺口说到。"]]},{"t":"Push and Provoke","s":[["To hurry is to move fast because you must; to hasten is to make it happen sooner.","匆忙是不得不快;而加快是让它更早发生。"],["To urge is to push with words, and to scold is to push with blame.","催促用话推,而责骂用责备推。"],["To curse and to swear are the words you use when words fail.","诅咒和骂脏话,是词穷时用的话。"],["To provoke is to make a reaction on purpose.","挑衅是故意制造反应。"],["To preach is to tell others how to live.","说教是告诉别人该怎么活。"],["To boast is to tell everyone what you did; to tease and to mock are what they do back.","吹嘘是告诉大家你做了什么;而取笑和嘲弄是他们回敬的。"]]},{"t":"Touch and Greet","s":[["To touch is the smallest contact.","触摸是最小的接触。"],["To hug is with both arms, and to clap or to applaud is with both hands.","拥抱用两只手臂,而拍手或鼓掌用两只手。"],["To kneel is to go down on one knee.","跪下是单膝着地。"]]},{"t":"Take Hold","s":[["To catch is to get it before it lands.","接住是在落地前拿到它。"],["To snatch and to grab are the same speed with less manners.","抢夺和抓取是同样的速度,礼貌更少。"],["To grasp is to take it and understand it.","把握是拿住,也是理解。"],["To grip is to hold and not let go.","抓紧是握住不放。"],["To overtake is to pass, and to follow is to stay behind.","超过是越过,而跟随是留在后面。"]]},{"t":"Twist and Fold","s":[["To mess is to make it untidy, and to twist is to turn it as you hold it.","弄乱是把它弄得不整齐,而扭是握着它转。"],["To scatter is to throw it apart.","撒开是把它扔散。"],["To fold is to bring two sides together; to fasten is to keep them there.","折是把两边合起来;而系紧是让它们留在那儿。"],["To loosen is to let them go.","松开是放开它们。"]]},{"t":"Break and Clean","s":[["To smash is to break it into pieces.","砸碎是把它打成碎片。"],["To scratch is with a point, and to scrape is with an edge.","刮是用尖,擦是用刃。"],["To wipe is to take the dust off, and to polish is to make it shine.","擦是把灰去掉,而打磨是让它发亮。"],["To split is to break along a line.","劈开是沿着一条线断开。"]]},{"t":"Turn and Shake","s":[["To sway is to move like a tree; to shake is to move like a hand.","摇摆像树,抖动像手。"],["To vibrate is to shake very fast and very little.","振动是很快很小地抖。"],["To whirl and to rotate are the same circle at two speeds.","旋转和自转是同一个圈,两个速度。"],["To shuffle is to walk without lifting your feet.","拖着脚走是不抬脚地走。"],["To collide is to meet too fast.","相撞是相遇得太快。"]]},{"t":"Connect","s":[["Contact is the meeting, and to connect is to make it hold.","接触是相遇,而连接是让它连住。"],["To combine is to put two together, and to integrate is to make them one.","结合是把两个放在一起,而整合是让它们成为一个。"]]},{"t":"Through and Across","s":[["To penetrate is to get inside something that resists.","穿透是进入有阻力的东西内部。"],["To pierce is to make a hole, and to insert is to put it in.","刺穿是打一个洞,而插入是把它放进去。"],["To tilt is to lean it, and to tow is to pull it behind you.","倾斜是让它歪,而拖是把它拉在身后。"],["A trail is what is left behind.","痕迹是留在身后的东西。"]]},{"t":"Arrange and Steer","s":[["To arrange is to put things in order.","安排是把东西放整齐。"],["To manipulate is to move it with your hands, or with your intentions.","操纵是用手挪它,或者用意图挪它。"],["To steer is to decide the direction.","掌舵是决定方向。"]]},{"t":"Chance and Faith","s":[["To baptise is to give a name in water.","施洗是在水里给一个名字。"],["To bet is to put money on an opinion.","打赌是为一个看法押钱。"],["A stake is what you stand to lose, and to gamble is to do it again.","赌注是你可能失去的,而赌博是再来一次。"],["To promise is to say you will, and mean it.","承诺是说你会的,而且当真。"]]},{"t":"Drawing You In","s":[["To attract is to pull without touching.","吸引是不碰也拉。"],["To obsess is to fill the mind, and to mesmerise is to hold the eyes.","着迷是占满脑子,而迷住是抓住眼睛。"],["A nightmare is a dream you cannot leave.","噩梦是你离不开的梦。"],["To amaze and to astonish are the same surprise at two sizes.","使惊奇和使震惊是同一个惊讶的两种尺寸。"],["To marvel is to be astonished and enjoy it.","惊叹是震惊并且享受。"]]},{"t":"Feelings It Leaves","s":[["To involve is to bring someone in, and to annoy is to make them wish they were out.","卷入是把人带进来,而惹恼是让他们希望自己不在里面。"],["To upset is to turn the mood over.","使不安是把心情翻过来。"],["To bewilder is to leave them with no map.","使困惑是让他们手上没有地图。"],["Irony is saying one thing and meaning the other.","反讽是说一件事,意思是另一件。"],["An indignity is small and it stays for years.","屈辱很小,却留很多年。"],["Contempt is looking down; neglect is not looking at all.","蔑视是往下看;忽视是根本不看。"]]},{"t":"Bias and Disregard","s":[["Disregard is choosing not to look.","漠视是选择不看。"],["Ignorance is not having looked.","无知是没看过。"],["A bias is a scale that leans before you weigh anything.","偏见是一台还没称就先歪的秤。"],["To deviate is to leave the line.","偏离是离开那条线。"]]},{"t":"Out of Control","s":[["To expel is to make them leave.","驱逐是让他们离开。"],["To flee is to leave fast, and to panic is to leave without thinking.","逃走是快快离开,而惊慌是不想就走。"],["To bully is to push the small one every day.","欺凌是每天推那个小的。"],["To terrify is to make fear the only thought.","使恐惧是让恐惧成为唯一的念头。"],["Revenge is the second injury.","报复是第二次伤害。"]]},{"t":"Crime Again","s":[["To kidnap is to take a person; to hijack is to take the vehicle.","绑架是带走人;劫持是带走车。"],["To smuggle is to move it without being seen.","走私是不被看见地运。"],["To convict is to find them guilty, and to strangle is to stop the breath.","定罪是判定有罪,而勒死是止住呼吸。"],["A massacre is many at once, and a decimation is one in ten.","屠杀是一次很多人,而抽杀是十分之一。"],["To intervene is to step in between.","干预是走进中间。"],["To impede is to put something in the way.","阻碍是把什么挡在路上。"]]},{"t":"Tempt","s":[["To allure is to make it look good from far away.","引诱是让它从远处看着很好。"],["Bait is what you put on the hook.","饵是你挂在钩上的东西。"],["To induce is to give a reason; to tempt is to give a reason you should refuse.","促使是给一个理由;而诱惑是给一个你该拒绝的理由。"]]},{"t":"Assign and Conceal","s":[["To designate is to name it for a purpose, and to assign is to give it to a person.","指定是为一个用途命名,而分配是把它交给某个人。"],["To distribute is to give it out, and to despatch is to send it out.","分发是发出去,而派遣是送出去。"],["To detach is to take it off, and to undo is to take the effect away.","分离是把它取下,而撤销是把效果拿掉。"],["To disguise is to change how it looks, and to conceal is to make sure it is not seen.","伪装是改变它的样子,而隐藏是确保它不被看见。"]]},{"t":"Yes, No, Neither","s":[["To refuse is to say no; to exclude is to keep them out.","拒绝是说不行;而排除是把他们挡在外面。"],["To reverse is to turn it the other way.","倒转是把它转到另一边。"],["To assure is to take the doubt away now, and to reassure is to do it again later.","保证是现在把疑虑拿走,而再次保证是以后再做一次。"],["To undertake is to take the job on.","承担是把这件事接过来。"],["To stipulate is to say the condition before you agree.","规定是在同意之前说出条件。"],["To convince is to change the mind; to reassure is to calm it.","说服是改变想法;安抚是让想法安静下来。"]]},{"t":"Wanting","s":[["To wish is to want something you cannot have.","希望是想要你得不到的东西。"],["To aspire is to want something you might reach.","立志是想要你也许能达到的东西。"],["To desire is to want it in the body.","渴望是身体里想要它。"],["To yearn is to want it for years.","思念是想要它好多年。"],["To invoke is to call something in to help.","援引是叫一样东西来帮忙。"]]},{"t":"Try","s":[["To itch is to want to move your hand.","发痒是想动你的手。"],["To attempt is to try once; to strive is to try until it hurts.","尝试是试一次;而奋斗是试到疼。"],["An effort is what it cost you.","努力是它让你付出的。"],["To fulfil is to do what was promised.","履行是把承诺的做出来。"],["To sort is to put it in the right place.","分类是把它放到正确的位置。"]]},{"t":"Start Something","s":[["To loom is to be big and close and not yet here.","逼近是又大又近又还没到。"],["To launch is to send it out; to commence is to begin, formally.","发射是把它送出去;而开始是正式地起动。"],["To exploit is to use it fully, and to explore is to find out what it is.","利用是充分使用,而探索是弄清它是什么。"],["To exert is to put force into it.","施加是把力气放进去。"],["To tackle is to go at the hard part first; to cope is to get through it.","着手是先攻难的部分;而应付是把它过完。"],["To dispose is to get rid of it.","处理是把它弄走。"]]},{"t":"Do and Undo","s":[["To conduct is to lead it from the front.","进行是从前面带着它走。"],["To omit is to leave it out by accident.","遗漏是不小心落下。"],["To delete and to erase are to take the writing away.","删除和擦除是把字迹拿掉。"],["To cancel is to say it will not happen, and to clear is to make the space empty.","取消是说它不会发生,而清理是让空间空出来。"]]},{"t":"Put It Right","s":[["To rescue is to get them out; to recover is to get it back.","营救是让他们出来;恢复是把它拿回来。"],["To restore is to put it back as it was.","修复是把它放回原来的样子。"],["To rectify is to correct the mistake, and to redeem is to make up for it.","纠正是指出并改,而弥补是把它补回来。"],["To offset is to balance one loss with one gain.","抵消是用一份收获平衡一份损失。"],["To replenish is to fill it again.","补充是再装满。"],["A resort is the last thing you can try.","手段是你最后能试的办法。"]]},{"t":"Get and Give","s":[["To obtain is to get it after trying.","获得是试过之后拿到。"],["To gain is to get something extra; to supply is to give what is needed.","获得是多了些什么;而供应是给出需要的。"],["To offer is to hold it out, and to render is to give as a duty.","提供是把它伸出去,而给予是把这当义务。"],["To enlarge is to make it bigger, and to augment is to add to it.","扩大是让它更大,而增加是往上加。"],["To magnify is to make it look bigger; to amplify is to make it sound bigger.","放大是让它看起来更大;而扩音是让它听起来更大。"],["To exaggerate is to magnify on purpose.","夸张是故意放大。"]]},{"t":"Longer and Stronger","s":[["To prolong is to make it last longer.","延长是让它持续更久。"],["To uphold is to keep it standing, and a backup is what stands behind it.","维护是让它站着,而备份是站在它后面的东西。"],["To propel is to push it forward, and to update is to bring it to now.","推进是把它往前推,而更新是把它带到现在。"],["To raise is to lift it up.","举起是把它抬起来。"]]},{"t":"Leak and Flood","s":[["To leak is slow and quiet, and to spill is sudden.","漏是慢而安静的,而洒是突然的。"],["To seep is through a small space; to ooze is slowly and thickly.","渗是通过小缝;而渗出是慢慢地、稠稠地。"],["To evacuate is to empty the place.","疏散是把地方清空。"],["A trench is a long hole, and to saturate is to fill every space with water.","沟渠是一个长坑,而浸透是每个空隙都灌满水。"]]},{"t":"Forgive and Regard","s":[["To excuse is to accept the reason; to forgive is to stop wanting the debt.","原谅是接受这个理由;而宽恕是不再想要这笔债。"],["To contain is to hold it inside.","容纳是把它装在里面。"],["To regard is to look at it with judgement.","看待是带着判断看它。"],["To flatter is to praise for a reason; to worship is to praise without one.","奉承是有理由地夸;而崇拜是没有理由地夸。"]]},{"t":"Why and Because","s":[["A cause makes it happen; a sake is what you do it for.","原因让它发生;而缘故是你为它而做。"],["A purpose is the point, and an objective is the target.","目的是意义,而目标是靶子。"],["To arouse and to trigger are both to start it, one slowly and one suddenly.","唤起和触发都是开始,一个慢一个突然。"],["To seek is to look for it, and to retrieve is to bring it back.","寻找是找它,而取回是把它带回来。"]]},{"t":"Prove It","s":[["To testify is to say it in court.","作证是在法庭上说出来。"],["To verify is to check it is true, and to specify is to say exactly which.","核实是检查它是真的,而指明是说出具体哪一个。"],["To enlighten is to give light to the mind, and to impart is to hand it over.","启发是给脑子一点光,而传授是把它交出去。"],["To deserve is to have earned it.","值得是你已经挣到了。"]]},{"t":"Down","s":[["To drop is to let it fall, and to sink is to go down by itself.","掉落是让它掉,而下沉是自己往下。"],["To plummet is to go down fast and far.","暴跌是又快又远地往下。"],["To muffle is to cover the sound, and to overshadow is to make everything else dim.","闷住是盖住声音,而遮蔽是让其余的都变暗。"]]},{"t":"Welcome","s":[["To invite is to ask; to welcome is to be glad they came.","邀请是开口请;而欢迎是高兴他们来了。"],["To greet is to say the first word, and to salute is to do it with the body.","问候是说第一句话,而敬礼是用身体来做。"],["To celebrate is to mark the day, and to congratulate is to say it to the person.","庆祝是标记这一天,而祝贺是当面说出来。"],["To bless is to wish them well out loud.","祝福是大声祝他们好。"],["To participate is to be one of them.","参与是成为他们中的一个。"],["A farewell is the goodbye you make long.","告别是你长得像一场仪式的那句再见。"]]},{"t":"Match and Belong","s":[["To assort is to put like with like.","分类是同类归同类。"],["To correspond is to match, and to accord is to agree.","相符是能对上,而一致是同意。"],["To attribute is to say where it came from.","归因是说出它从哪来。"]]},{"t":"Remember","s":[["To recall is to bring it back, and to recollect is to do it slowly.","回想是把它带回来,而追忆是慢慢来。"],["To remind is to do it for someone else.","提醒是替别人想起来。"],["To retell is to tell it again, and to repeat is to say the same words.","复述是再讲一遍,而重复是同一句话再说一次。"],["In retrospect, everything was obvious.","回顾起来,一切都显而易见。"],["To impress is to leave a mark on someone.","给…留下印象是在人身上留下痕迹。"]]},{"t":"Overcome","s":[["To surmount is to get over it.","克服是越过它。"],["To mortify is to make someone wish the floor would open.","使羞辱是让人希望地板裂开。"],["To pervade is to be in every part of the room.","弥漫是出现在房间的每一处。"]]},{"t":"Instead","s":[["To replace is to put a new one in its place.","替换是放一个新的在它的位置。"],["To substitute is to use one for the other, either way round.","替代是用一个顶另一个,两个方向都行。"],["To distinguish is to see the difference; to differentiate is to state it.","区分是看出差别;而辨别是把差别说出来。"],["To incline is to lean a little, and sideways is that direction.","倾向是稍微歪一点,而侧向就是那个方向。"]]}],"21":[{"t":"Mood and Character","s":[["To feel is the widest word we have.","感觉是我们最宽的那个词。"],["A mood lasts an afternoon, and an emotion lasts a day.","心情持续一个下午,而情绪持续一天。"],["A temper is the one that gets away from you.","脾气是那个管不住的东西。"],["Manner is how you do it, and attitude is what you think of it.","举止是你怎么做,而态度是你怎么看。"],["Character is what you are; personality is how you come across.","性格是你是什么;而个性是别人眼里的你。"],["A trait is one line of it, and a virtue is the good line.","特质是其中的一条,而美德是好的那条。"],["A feature and stature describe the outside as well.","特征和身量也描述外表。"]]},{"t":"Body and Mind","s":[["Flesh is what we are made of, and mankind is all of us.","肉是构成我们的东西,而人类是我们全部。"],["A human has a bone, a backbone and a skeleton to hold the shape.","人有骨头、脊柱和骨架来撑住形状。"],["The skull holds the brain, and the brain is not the mind.","颅骨装着脑子,而脑子不是心灵。"],["Physical pain is in the body; mental pain is not.","身体的痛在身上;心理的痛不在。"]]},{"t":"The Face","s":[["A cheek, a forehead and a brow are where worry shows first.","脸颊、额头和眉间,是忧虑最先显出来的地方。"],["An eyelash catches the dust before the eye does.","睫毛比眼睛先挡住灰尘。"],["A lip, a mouth, a tongue and a throat are the whole way from sound to word.","唇、口、舌和喉,是从声音到词的整条路。"],["A gorge is a throat on a larger scale.","峡谷是放大版的喉咙。"],["A chin, a jaw and a neck carry the head.","下巴、颌骨和脖子托着头。"],["A beard hides the bottom of it.","胡子把下半截藏起来。"]]},{"t":"Arms and Chest","s":[["A shoulder begins the limb, and an elbow and a wrist bend it.","肩膀是肢体的起点,肘和腕让它弯。"],["A thumb is what makes a hand a hand.","拇指是让手成为手的东西。"],["A palm is open; a finger points; a fist closes.","手掌是张开的;手指指向;拳头合上。"],["A chest, an abdomen and a rib protect what is under them.","胸、腹和肋骨保护下面的东西。"],["A waist is the narrow part in the middle.","腰是中间窄的那一段。"]]},{"t":"Inside","s":[["An organ does one job and does it for life.","器官干一件事,而且干一辈子。"],["The liver cleans, the stomach digests, the kidney filters, and the lung breathes.","肝清洁,胃消化,肾过滤,肺呼吸。"],["A womb holds a life before it is one.","子宫在生命成为生命之前装着它。"],["A gland makes something and sends it out.","腺体制造东西并把它送出去。"],["A chamber is a room, even inside a heart.","腔室是一间房,就算在心脏里也是。"],["The intestine is the longest road in the body.","肠子是身体里最长的一条路。"]]},{"t":"Legs and What Runs Through","s":[["A thigh, a knee, a lap and an ankle are the way down.","大腿、膝、膝上和踝,是往下的路。"],["A heel takes the first hit and a toe takes the last.","脚跟先受一击,脚趾受最后一击。"],["A muscle pulls; a joint lets it move.","肌肉拉;关节让它动。"],["A pore lets the skin breathe, and a pulse tells you the heart is working.","毛孔让皮肤呼吸,而脉搏告诉你心脏在工作。"],["An artery carries it out, a nerve carries the message, and a hormone carries the order.","动脉把它送出去,神经传消息,而激素传命令。"],["The immune system remembers every enemy it has met.","免疫系统记得它见过的每个敌人。"]]},{"t":"The Senses","s":[["A stimulus is anything the body notices.","刺激是身体注意到的任何东西。"],["A biorhythm is the clock inside you.","生物节律是你体内的钟。"],["A sense lets the world in; sight is the one we trust most.","感官让世界进来;视觉是我们最信的那个。"],["Eyesight can be sharp or weak, and a view is what you look at.","视力可以锐利也可以弱,而景色是你看的东西。"],["Something visual is for the eye, and something visible can be seen.","视觉的是给眼睛的,而可见的是能被看见的。"],["Something vague is seen but not clearly.","模糊的东西是看见了却不清楚。"],["Someone blind cannot see, and someone dumb cannot speak.","盲的人看不见,哑的人说不出。"],["An aural test is for the ear, and a dental one is for the teeth.","听觉测试查耳朵,牙科检查查牙齿。"]]},{"t":"Sleep","s":[["A lifestyle is what you do every day, and a habit is what you no longer decide.","生活方式是你每天做的,而习惯是你不再决定的事。"],["To be awake is to be in charge of yourself.","清醒是自己说了算。"],["To yawn is the body asking for a nap, and to doze is agreeing.","打哈欠是身体在要一次小睡,而打盹是答应了。"],["Quiet is what a room needs; asleep is what you need.","安静是房间需要的;睡着是你需要的。"],["Insomnia is lying awake with a working mind.","失眠是躺着醒着,脑子还在转。"]]},{"t":"Body and Limit","s":[["To cripple is to take the use of a limb; to be lame is to walk badly.","致残是夺去一条肢体的用处;而跛是走得不好。"],["A dwarf is small by nature, not by accident.","侏儒是天生小,不是意外。"],["Pregnancy is nine months of change, and being born is the first hard day.","怀孕是九个月的变化,而出生是第一个艰难的日子。"],["A clone has one parent and no surprise.","克隆只有一个亲本,也没有意外。"]]},{"t":"Symptoms","s":[["A symptom is what you feel; a disease is what it is.","症状是你感觉到的;疾病是它本身。"],["An illness is the time you spend having it.","病期是你得它的那段时间。"],["To moan is to say it without words.","呻吟是不用词地说出来。"],["An infection spreads; a detriment is the harm it leaves.","感染会扩散;而损害是它留下的坏处。"],["Something broken does not work, and to disable is to make it stop.","坏了的不管用,而致残是让它停下。"],["An invalid is someone the body has stopped.","病弱者是被身体叫停的人。"],["A patient waits, and a dysfunction is a part working badly.","病人等着,而功能紊乱是某个部分干活不对劲。"]]},{"t":"What It Might Be","s":[["Diabetes is sugar in the blood, and obesity is weight the body carries.","糖尿病是血里的糖,而肥胖是身体扛着的重量。"],["To be overweight is a warning; hypertension is the one you cannot feel.","超重是一个警告;高血压是你感觉不到的那个。"],["To paralyse is to stop the movement, and to be dizzy is to lose the floor.","使瘫痪是停住动作,而头晕是失去地面。"],["Someone insane has lost the line between real and not.","精神失常的人丢了真实与不真实之间的线。"],["An allergy is the body attacking something harmless.","过敏是身体攻击无害的东西。"],["A heart attack, a stroke and a plague are all sudden.","心脏病发作、中风和瘟疫都是突然的。"]]},{"t":"The Long Illness","s":[["Cancer and arthritis are patient diseases.","癌症和关节炎是很有耐心的病。"],["A pimple is small, and flu and fever come and go.","痘痘很小,而流感和发烧来来去去。"],["A headache is the body complaining about the day.","头痛是身体在抱怨这一天。"],["To swell is to get bigger from inside.","肿是从里面变大。"],["To choke is to have no air.","噎住是没有空气。"]]},{"t":"Injury","s":[["To injure is to do damage to a body, and an injury is the damage itself.","受伤是对身体造成损害,而伤是那个损害本身。"],["To hurt is what you feel; to bleed is what it does.","疼是你感觉到的;流血是它做的事。"],["A bruise is under the skin, and a scar is what stays.","淤青在皮下,而疤是留下的东西。"],["A wound and a trauma are the same break, one seen and one felt.","伤口和创伤是同一个破损,一个看得见一个感觉得到。"],["A lump is something that was not there before.","肿块是以前不在那里的东西。"],["Pain is the body's way of asking you to stop.","疼痛是身体请你停下的方式。"]]},{"t":"The End","s":[["Death is the fact; a demise is the formal word for it.","死亡是事实;而逝世是它的正式说法。"],["Mortal means it will happen to you.","凡人意味着这也会发生在你身上。"],["Doom is death with a date already set.","劫数是日期已定的死亡。"],["Something fatal or lethal will kill you.","fatal 或 lethal 的东西会要你的命。"],["A corpus is a body used for study.","尸体是用于研究的身体。"]]},{"t":"Tired Out","s":[["Overwork is the cause and fatigue is the result.","过劳是原因,疲劳是结果。"],["To tire is to slow down, and to exhaust is to empty.","疲乏是慢下来,而耗尽是把人清空。"],["To faint is to leave for a moment.","昏倒是离开一小会儿。"],["Someone feeble has no strength, and to weaken is to lose it.","虚弱的人没有力气,而变弱是失去它。"],["To be uncomfortable is to notice your own body.","不舒服是注意到自己的身体。"],["Someone unconscious is not there at all.","失去意识的人根本不在。"]]},{"t":"Sharp or Slow","s":[["A chronic illness stays; an acute one arrives.","慢性的病留着;急性的病来了。"],["A sore throat is a small pain with a big word.","喉咙痛是一个小痛配一个大词。"],["Sorrow is quiet, and suffering is long.","悲伤是安静的,而痛苦是长的。"],["To lament is to say it out loud in public.","哀叹是当众大声说出来。"]]},{"t":"The Hospital","s":[["A hospital is where the machines are; a clinic is where the questions are.","医院是机器在的地方;诊所是问题在的地方。"],["Therapy is the slow work, and health care is the system around it.","治疗是慢的活儿,而医疗保健是它周围的系统。"],["Something sanitary is clean in a medical way, and hygiene is the habit of keeping it so.","卫生的是医学意义上的干净,而卫生习惯是保持它干净的习惯。"],["Medical training is long, and fitness is what you do yourself.","医学训练很长,而体能是你自己练的。"],["A physician thinks, and a surgeon cuts.","内科医生思考,而外科医生动刀。"]]},{"t":"Treatment","s":[["An operation is one day, and treatment is a year.","手术是一天,而治疗是一年。"],["To cure is to end it; to heal is to make it whole again.","治愈是把它结束;而愈合是让它重新完整。"],["A check finds it, a prescription names it, and a precaution prevents it.","检查发现它,处方说出它,而预防措施防止它。"],["A transplant moves a part, and an X-ray looks through you.","移植是挪一个部件,而 X 光看穿你。"],["An injection goes in; a vaccinate protects in advance.","注射是打进去;而接种是提前保护。"],["To quarantine is to keep them apart for a while; to segregate is to keep them apart for good.","隔离检疫是暂时分开;而隔离是永久分开。"],["To isolate is to make sure nobody comes near.","孤立是确保没人靠近。"]]},{"t":"Medicine","s":[["A pharmacy sells it, and medicine is what you take.","药房卖它,而药是你吃的。"],["A remedy is the old word for a cure; a drug is the new word for a business.","remedy 是治愈的旧词;drug 是商业的新词。"],["A pill is small, and an antibiotic kills what a body cannot.","药丸很小,而抗生素杀死身体杀不了的东西。"],["Acupuncture, penicillin and morphine are three different centuries.","针灸、青霉素和吗啡,是三个不同的世纪。"],["A dose is how much, and recovery is how long.","剂量是多少,而康复是多久。"]]},{"t":"Relief","s":[["To refresh is to give energy back, and relief is the moment it stops hurting.","提神是把力气还回来,而缓解是它停止疼的那一刻。"],["To relieve and to alleviate are to make it smaller.","缓解和减轻都是把它变小。"],["To resume is to start again, and to ease is to make it gentler.","恢复是重新开始,而缓和是让它更轻。"],["To relax is to stop holding.","放松是停止用力。"]]},{"t":"Normal and Otherwise","s":[["Normal is what most do, common is what many do, and usual is what happens most days.","正常是多数人做的,常见是很多人做的,而通常是最多日子里发生的。"],["An optimistic person expects it to work.","乐观的人预期它能成。"],["A pessimistic one is never disappointed.","悲观的人从不失望。"],["Positive looks for the good; negative finds the rest.","积极找好的;消极找到其余的。"],["Passive waits, and enthusiastic does not.","被动是等着,而热情不是。"],["Indifferent does not care, apathetic cannot be bothered, and negligible is too small to matter.","漠不关心是不在乎,麻木是懒得在乎,而微不足道是太小以致不重要。"]]},{"t":"Pleasure","s":[["Happiness is a state; delight is a moment.","幸福是一种状态;喜悦是一个瞬间。"],["To be merry is to be loud about it.","欢快是把这件事说得响。"],["Fun is the activity, and a joke is the thing that starts it.","乐趣是活动,而笑话是引起它的东西。"],["Laughter is the sound, and joy is the reason.","笑是声音,而快乐是原因。"],["To please is to give it to someone else.","取悦是把它给别人。"],["To rejoice and to thrill and to cheer are all louder than to be pleased.","欢庆、激动和欢呼,都比满意要响。"]]},{"t":"Good to Have","s":[["Pleasure is the body's, and something agreeable is easy to be with.","愉悦是身体的,而惬意的容易相处。"],["To exhilarate is to make the heart go faster.","使兴奋是让心跳更快。"],["Something satisfactory is enough, and something desirable is worth wanting.","令人满意的是够了,而值得要的是值得想要。"],["An exciting idea makes you move; a keen student does not need to be told.","令人兴奋的想法让你动起来;而热切的学生不用别人说。"],["Zeal is energy with a purpose, and a lively room is a lovely one.","热忱是有目的的精力,而热闹的房间是可爱的。"],["To be fond of something is to like it for years.","喜欢一样东西,是喜欢很多年。"]]},{"t":"Kind and Otherwise","s":[["A favour is a kindness you can name.","恩惠是一个你说得出来的善意。"],["To startle, to amaze and to astound are three sizes of surprise.","使惊吓、使惊奇和使震惊,是惊讶的三个尺寸。"],["A hectic day has no gaps in it.","忙乱的一天没有空隙。"],["Someone liberal gives more than expected; someone generous gives more than they have.","开明的人给得比预期多;而慷慨的人给得比自己有的还多。"],["Gentle is slow with the hands; humble is low about the self; modest is quiet about the success.","温和是手上慢;谦卑是对自己低;谦虚是对成功不多说。"],["Humorous is funny on purpose; frank is honest without warning.","幽默是有意好笑;坦率是不打招呼就诚实。"]]},{"t":"Curious and Proud","s":[["Something mysterious has no explanation yet.","神秘的东西还没有解释。"],["Someone curious wants one.","好奇的人想要一个。"],["Daring is brave with a plan; manly is an old word for the same thing.","大胆是有计划的勇敢;而 manly 是同一件事的旧词。"],["To be direct is to say it first.","直接是先把话说出来。"],["Earnest is serious and honest at once; honesty is the habit of it.","认真是严肃又诚实;而诚实是这件事的习惯。"],["Proud is the feeling; seriously is the manner.","骄傲是感觉;而严肃是举止。"]]},{"t":"With Other People","s":[["Friendly is easy; hospitable opens the door.","友好是容易的;而好客是打开门。"],["Romantic sees the story; freedom is the space to have one.","浪漫的人看见故事;而自由是有故事的空间。"],["Careful notices; concern is careful about you.","仔细是注意到;而关心是对你仔细。"],["Confidence is expecting to manage; to be considerate is to think of the other seat.","自信是预期能应付;而体贴是想到另一个座位。"],["Thoughtful remembers; sympathetic feels it with you.","体贴是记得;而同情是和你一起感受。"],["Ready means there is no wait.","准备好意味着不用等。"]]},{"t":"Sorry","s":[["To apologise is to say it; an apology is the words; mercy is not giving the punishment.","道歉是说出来;歉意是那些话;而宽恕是不给惩罚。"],["To admire is to look up; remarkable is worth the look.","钦佩是往上看;而卓越是值得一看。"],["Grateful and gratitude are the feeling and the name of it.","感激和感恩,是那种感觉和它的名字。"],["Eager wants to start now.","渴望是现在就想开始。"]]},{"t":"Sound and Solid","s":[["Something sound is in good condition.","完好的是处于良好状态。"],["A picturesque view is worth a photograph.","如画的景色值得拍一张。"],["A promising start may still fail.","有希望的开端仍可能失败。"],["A prominent person is seen first.","显要的人先被看见。"],["Something awesome is too big to answer.","令人敬畏的东西大到无法回应。"]]},{"t":"Hard Work","s":[["An arduous climb is long and steep.","艰难的攀登又长又陡。"],["A tough day does not break you; a robust body does not either.","艰难的一天不会把你弄垮;强健的身体也不会。"],["Something sturdy stands up; something steadfast does not leave.","结实的东西立得住;而坚定不离开。"],["Tender is gentle with the skin; temperate is gentle with itself.","温柔是对皮肉轻;而有节制是对自己轻。"],["Something delicate breaks if you look at it too hard.","精致的东西你多看一眼就会坏。"]]},{"t":"Plain and Plain-spoken","s":[["A mundane task is ordinary and necessary.","平凡的任务是普通且必要的。"],["Naive believes it; childish wants it.","天真是相信它;幼稚是想要它。"],["Sincere means no second meaning.","真诚意味着没有第二层意思。"],["Liable means it will probably happen to you.","liable 意味着它可能落到你身上。"],["Trustworthy means you can leave the room.","可靠意味着你可以离开这间屋子。"]]},{"t":"Willing","s":[["Enterprising starts businesses; sane does not start them all.","有事业心的会开公司;而清醒的不会全都开。"],["Strenuous takes effort, and rigorous takes care.","费力的要下功夫,而严格的要用心。"],["Strict is the rule; severe is the punishment.","严格是规则;而严厉是惩罚。"],["Mutual means both ways.","相互意味着双向。"],["To resemble is to look like; similar is only close; familiar is known.","相像是长得像;相似只是接近;熟悉是认识。"],["Naked is without clothes; bare is without cover.","裸的是没有衣服;而光的是没有遮盖。"],["Private is not for others.","私人的是不给别人的。"]]},{"t":"Gut Feeling","s":[["Intuition is knowing without the steps.","直觉是没有步骤就知道。"],["Spontaneous is done before the plan arrives.","自发是计划还没到就做了。"],["Something implicit is there but not said.","隐含的是在那里但没说。"],["An illusion is seen and not there; imaginary is not there at all.","幻觉是看见了却不在那里;想象的则根本不在。"],["Fancy is the pleasure of imagining it.","幻想是想象它的乐趣。"],["Fate is the plan you did not make, and fortune is the luck you did not earn.","命运是你没做的计划,而运气是你没挣来的好运。"]]},{"t":"Grief","s":[["Agony is pain at its loudest.","剧痛是最大声的痛。"],["Grief is the whole of it, and to grieve is to go through it.","悲伤是它的全部,而哀悼是走完它。"],["Miserable is a long low state.","悲惨是一种长久低落的状况。"],["Distress is the moment it shows.","痛苦是它显出来的那一刻。"],["Sadness is quieter, and gloomy is darker.","悲伤更安静,而忧郁更暗。"],["To disappoint is to fail an expectation; to discourage is to remove the next try.","使失望是辜负期待;而使气馁是拿掉下一次尝试。"]]},{"t":"Anger","s":[["Anger is the feeling; rage is the volume; furious is the speed.","愤怒是感觉;暴怒是音量;而狂怒是速度。"],["To frown is anger in miniature.","皱眉是微缩的愤怒。"],["To irritate is to keep touching the sore place.","激怒是不停碰那个痛处。"],["To hate is to want it gone, and hatred is the habit of it.","恨是想让它消失,而仇恨是这件事的习惯。"],["A nuisance is small and constant.","讨厌的东西很小而且不断。"],["Disgust turns the stomach; to vex is to bother until it shows.","厌恶让胃翻;而使烦恼是扰到它显出来。"]]},{"t":"Unkind","s":[["To harass is to come back again and again.","骚扰是一再回来。"],["To bore is to take the time and give nothing.","使人厌烦是拿走时间什么也不给。"],["To bother is smaller than to harass, and a troublesome task is smaller still.","打扰比骚扰小,而麻烦的任务更小。"],["Awful and unpleasant are both bad to be near.","糟糕的和不愉快的东西,靠近都不好。"],["Adverse conditions push against you, and a hostile crowd does it on purpose.","不利的条件顶着推你,而敌对的人群是有意为之。"],["Indignant is angry and sure of being right.","愤慨是生气并且确信自己是对的。"]]},{"t":"Too Much","s":[["Radical goes to the root.","激进是动到根上。"],["Mad and crazy are the same word at two temperatures.","mad 和 crazy 是同一个词的两个温度。"],["Wicked is evil with pleasure; vicious is evil with teeth.","邪恶是带着快感的恶;而恶毒是带牙的恶。"],["Vulgar is loud and low at once.","粗俗是又响又低。"],["Ego is the room you keep for yourself, and selfish is when it is the only room.","自我是你给自己留的房间,而自私是它成了唯一的房间。"]]},{"t":"Uneasy","s":[["Nasty is small and deliberate.","恶意的是小而有意的。"],["Rash acts before thinking; volatile changes without notice.","轻率是不想就动;而易变是不打招呼就变。"],["Weird is strange in a way you cannot name.","怪异是怪得你叫不出名字。"],["Excessive is more than the case needs.","过度是多过这件事所需。"],["Anxiety is fear with no object; restless is a body with no seat.","焦虑是没有对象的恐惧;而坐不住是一具没有座位的身体。"],["Uneasy is the small version, and fear is the old one.","不安是小的那个,而恐惧是旧的那个。"],["Timid steps back before anything happens.","胆怯是还没发生就先退。"]]},{"t":"Fuss","s":[["A fuss is noise about something small.","大惊小怪是为小事吵闹。"],["An insult is meant to land; unkind is careless rather than aimed.","侮辱是想打中的;而不友善只是不留心,不是瞄准的。"],["Envy wants what you have; to be jealous is to fear losing what I have.","羡慕是想要你有的;而嫉妒是怕失去我有的。"]]},{"t":"Doubt","s":[["Doubt is the open question, and suspicion has already answered.","怀疑是未决的问题,而猜疑已经答完了。"],["Sceptical wants the evidence first.","怀疑的想要先看证据。"],["Unsatisfactory, unstable and unsuitable are three ways of being not right.","不令人满意、不稳定和不合适,是“不对”的三种方式。"],["Unwilling will not, and reluctant will but slowly.","不愿意是不肯,而不情愿是肯,但很慢。"],["To hesitate is the pause before both.","犹豫是两者之前的那一顿。"]]},{"t":"Guilt","s":[["To confuse is to take the order out of it.","使困惑是把顺序拿掉。"],["Guilty is the verdict you give yourself.","有罪是你给自己下的判决。"],["To embarrass is to make the face hot.","使尴尬是让脸发烫。"],["Regret looks back, and to repent is to wish to undo it.","后悔是回头看,而悔改是希望撤销它。"],["Ashamed is regret with someone watching.","羞愧是有别人看着的后悔。"]]},{"t":"Let It Ou
