<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生词本 · 雅思词汇真经</title>
<style>
:root{
 --bg:#f7f6f3; --panel:#ffffff; --ink:#1f2328; --ink2:#5b6470; --line:#e6e2da;
 --accent:#b4442e; --accent-soft:#fdf1ec; --chip:#efece6; --mark:#fff3c4; --green:#2f7d4f;
}
@media (prefers-color-scheme: dark){
 :root{ --bg:#16181c; --panel:#1d2025; --ink:#e8eaed; --ink2:#9aa3ad; --line:#2c3037;
        --accent:#e5836a; --accent-soft:#2a211f; --chip:#242830; --mark:#4a3f1a; --green:#6cc38b; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;padding-bottom:80px}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}

.top{padding:34px 0 18px}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;
 border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:16px}
.back:hover{color:var(--accent);border-color:var(--accent)}
h1{margin:0;font-size:27px;letter-spacing:.2px;font-weight:700}
h1 .u{color:var(--accent);font-variant-numeric:tabular-nums}
.sub{margin:6px 0 0;color:var(--ink2);font-size:13.5px}

.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
 backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
 padding:10px 0;margin-bottom:18px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 200px;min-width:150px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;
 background:var(--panel);color:var(--ink);font-size:14px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);
 border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;background:var(--panel)}
.sw input{accent-color:var(--accent);margin:0}
.sw.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.btn{font:inherit;font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:5px 12px;cursor:pointer}
.btn:hover{color:var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--ink2);margin-left:auto;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;overflow:hidden}
thead th{background:var(--chip);font-size:12.5px;letter-spacing:.06em;color:var(--ink2);
 font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--accent-soft)}
td.n{width:52px;color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}
td.w{width:30%;font-weight:650;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:16.5px;
 letter-spacing:.2px;word-break:break-word}
td.m{color:var(--ink)}
td.sv{width:38px;text-align:center;padding-left:0;padding-right:8px}
.ipa{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:400;
 color:var(--ink2);letter-spacing:0;margin-top:3px;word-break:break-word}
.card .w .ipa{font-size:13px;margin-left:8px}
tr.hit td.w,tr.hit td.m{background:var(--mark)}

/* 衍生词 */
.dv{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.9}
.dv b{color:var(--accent);font-weight:700;font-size:10.5px;letter-spacing:.08em;margin-right:6px;
 font-family:-apple-system,sans-serif;vertical-align:1px}
.dv i{font-style:normal;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:13.5px;color:var(--ink);
 letter-spacing:.1px}
.dv em{font-style:normal;font-size:10.5px;opacity:.7;margin-left:2px;font-family:-apple-system,sans-serif}
.dv .sep{opacity:.3;margin:0 7px}
.hide-m .dv{display:none}

/* 星标 */
.star{font-family:inherit;font-size:15px;line-height:1;color:var(--ink2);background:transparent;border:0;
 cursor:pointer;padding:3px 5px;border-radius:7px;opacity:.4;transition:.15s;vertical-align:2px}
.star:hover{opacity:1;color:var(--accent);background:var(--accent-soft)}
.star.on{opacity:1;color:var(--accent)}
.card .w .star{font-size:17px;margin-left:6px}

.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.card .w{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;letter-spacing:.2px}
.card .w .idx{font-family:inherit;font-size:12px;color:var(--ink2);font-weight:400;margin-right:8px;
 font-variant-numeric:tabular-nums}
.card .m{margin:5px 0 0;color:var(--ink);font-size:14.5px}
.card .ex{margin:10px 0 0;padding:9px 12px;background:var(--accent-soft);border-radius:9px;font-size:14px}
.card .ex .en{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:14.8px;line-height:1.55}
.card .ex .zh{color:var(--ink2);margin-top:3px;font-size:13.5px}
.card .no{color:var(--ink2);font-size:12.5px;margin-top:8px;font-style:italic}

tr.gsep td{background:var(--chip);padding:5px 14px;border-bottom:1px solid var(--line)}
.gtag{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.gcnt{font-size:11.5px;color:var(--ink2);margin-left:8px;font-variant-numeric:tabular-nums}
tbody.grp tr:first-child td{border-top:0}
tbody.grp + tbody.grp tr.gsep td{border-top:8px solid var(--bg)}

section.grp{background:var(--panel);border:1px solid var(--line);border-radius:16px;
 margin-bottom:16px;overflow:hidden}
.ghead{display:flex;align-items:baseline;gap:9px;padding:9px 15px;background:var(--chip);
 border-bottom:1px solid var(--line)}
section.grp .cards{display:grid;gap:0;padding:1px 15px}
section.grp .card{background:transparent;border:0;border-radius:0;padding:13px 0;
 border-bottom:1px solid var(--line)}
section.grp .card:last-child{border-bottom:0}

.hide-m .m,.hide-m td.m{display:none}
.hide-z .zh{display:none}
.hide-i .ipa{display:none}
body.hide-m td.m{display:none!important}
.empty{padding:40px;text-align:center;color:var(--ink2);font-size:14px}

.nav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.nav a{font-size:13.5px;text-decoration:none;color:var(--ink2);border:1px solid var(--line);
 border-radius:999px;padding:6px 14px;background:var(--panel)}
.nav a:hover{color:var(--accent);border-color:var(--accent)}
.nav a.dis{opacity:.35;pointer-events:none}
footer{margin-top:30px;color:var(--ink2);font-size:12.5px;line-height:1.8}

/* 浮动生词本入口 */
#nbfab{position:fixed;right:20px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:8px;
 padding:10px 17px;border-radius:999px;background:var(--accent);color:var(--panel);text-decoration:none;
 font-size:13.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 24px rgba(0,0,0,.22);
 padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#nbfab b{font-variant-numeric:tabular-nums;font-size:15px}
#nbfab:hover{filter:brightness(1.06)}
#nbfab.wiggle{animation:wig .4s}
@keyframes wig{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

@media (max-width:640px){
 body{font-size:15px}
 .wrap{padding:0 12px}
 h1{font-size:22px}
 thead{display:none}
 table,tbody,tr,td{display:block;width:auto}
 table{border:0;background:transparent;border-radius:0}
 tbody tr{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:9px;position:relative}
 tbody td{border:0;padding:0}
 td.n{display:none}
 tr.gsep{display:block}
 tr.gsep td{display:block;background:transparent;padding:0 0 6px}
 tbody.grp{margin-bottom:6px;display:block}
 td.w{font-size:17px;margin-bottom:3px;width:auto}
 td.m{font-size:14px;color:var(--ink2)}
 td.sv{position:absolute;right:8px;top:9px;width:auto;padding:0}
 td.sv .star{font-size:19px}
 #nbfab{right:12px;bottom:14px;padding:9px 14px;font-size:13px}
}

/* 朗读按钮 */
.spk{font-family:inherit;line-height:1;background:transparent;border:0;cursor:pointer;
 color:var(--ink2);opacity:.4;padding:3px 5px;border-radius:6px;vertical-align:2px;display:inline-flex}
.spk:hover{opacity:1;color:var(--accent);background:var(--accent-soft)}
.spk svg{width:13px;height:13px;display:block}
.card .w .spk svg{width:15px;height:15px}
.hide-i .spk{display:none}

/* 学习统计 */
.sp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 0}
.spi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.spi b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.35}
.spi span{font-size:11.5px;color:var(--ink2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:46px;margin:14px 0 3px}
.bars i{flex:1;background:var(--chip);border-radius:3px 3px 0 0;min-height:2px;transition:.2s}
.bars i.on{background:var(--accent);opacity:.85}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2);opacity:.75}

.hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 0}
.tot{display:flex;align-items:baseline;gap:8px}
.tot b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.tot span{font-size:13px;color:var(--ink2)}
.badges{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;font-size:12.5px;color:var(--ink2)}
.badges i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:14px}
.badges .g{color:var(--green)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.acts .btn{padding:7px 14px}
.acts .btn.pri{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:650}
.acts .btn.pri:hover{filter:brightness(1.06);color:var(--panel)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:11px}
.item .h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.item .w{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;letter-spacing:.2px}
.item .ipa{font-size:12.5px;margin:0}
.item .m{font-size:14.5px;margin-top:4px}
.item .ex{margin-top:9px;padding:8px 11px;background:var(--accent-soft);border-radius:8px;font-size:13.5px}
.item .ex .en{font-family:ui-serif,Georgia,"Times New Roman",serif;line-height:1.55}
.item .ex .zh{color:var(--ink2);margin-top:2px}
.item .tag{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.item .due{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--ink2)}
.item .due.now{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.item .due.done{color:var(--green);border-color:var(--green)}
.item .del{margin-left:auto;font:inherit;font-size:12.5px;color:var(--ink2);background:transparent;
 border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
.item .del:hover{color:var(--accent);border-color:var(--accent)}
.sortsel{font:inherit;font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:6px 10px}

/* 复习模式 */
#rev{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 97%,#000 3%);
 display:none;overflow:auto;padding:20px 16px 30px}
#rev.on{display:block}
.rwrap{max-width:660px;margin:0 auto}
.rbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rbar .prog{flex:1;height:5px;background:var(--chip);border-radius:99px;overflow:hidden}
.rbar .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.rbar .num{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rbar .x{font:inherit;font-size:20px;line-height:1;background:transparent;border:0;color:var(--ink2);
 cursor:pointer;padding:4px 8px}
.modes{display:flex;gap:6px;margin-bottom:14px}
.mbtn{font:inherit;font-size:12.5px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:4px 14px;cursor:pointer}
.mbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:650}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px 24px;
 text-align:center;min-height:250px;cursor:pointer;user-select:none}
.rcard .rw{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:33px;font-weight:700;letter-spacing:.2px;
 word-break:break-word}
.rcard .ripa{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink2);margin-top:7px}
.rcard .rq{color:var(--ink2);font-size:13px;margin-top:26px;letter-spacing:.04em}
.rans{margin-top:20px;text-align:left;border-top:1px dashed var(--line);padding-top:16px;display:none}
.rans.on{display:block}
.rans .rm{font-size:16px}
.rans .rdv{font-size:13px;color:var(--ink2);margin-top:9px}
.rans .rex{margin-top:12px;font-size:14px;background:var(--accent-soft);padding:10px 12px;border-radius:9px}
.rans .rex .zh{color:var(--ink2);margin-top:3px;font-size:13px}
.rbtns{display:flex;gap:10px;margin-top:16px}
.rbtns button{flex:1;font:inherit;font-size:14.5px;font-weight:650;padding:12px 0;border-radius:12px;
 cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.rbtns button.no{color:var(--accent)}
.rbtns button.ok{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.rbtns button:disabled{opacity:.4;cursor:default}
.done{text-align:center;padding:40px 10px}
.done h2{font-size:22px;margin:0 0 8px}
.done p{color:var(--ink2);font-size:14px;line-height:1.9}
.done .acts{justify-content:center}

/* 拼写模式 */
.wcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px 24px}
.wq{font-size:19px;line-height:1.6;letter-spacing:.01em}
.wq .ip{font-family:"SF Mono",Menlo,monospace;font-size:13px;color:var(--ink2);margin-left:8px}
.wex{margin-top:12px;font-size:13.5px;color:var(--ink2);background:var(--accent-soft);padding:9px 12px;border-radius:9px}
.whint{margin-top:10px;font-family:"SF Mono",Menlo,monospace;font-size:15px;color:var(--ink2);letter-spacing:2px;min-height:20px}
.wrow{display:flex;gap:10px;margin-top:16px}
#win{flex:1;font:inherit;font-size:19px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
 background:var(--bg);color:var(--ink);outline:none;font-family:ui-serif,Georgia,serif;letter-spacing:.5px}
#win:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#win.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(63,143,95,.14)}
#win.bad{border-color:#c0392b;box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.wrow .btn{min-width:86px;font-size:14px}
.wfb{margin-top:12px;font-size:14.5px;min-height:26px;line-height:1.8}
.wfb .right{color:var(--green);font-weight:700}
.wfb .wrong{color:#c0392b;font-weight:700}
.wfb code{font-family:"SF Mono",Menlo,monospace;font-size:17px;background:var(--chip);padding:2px 8px;border-radius:6px}
.wfb s{opacity:.7}
.hintbtn{font:inherit;font-size:12px;color:var(--ink2);background:transparent;border:1px dashed var(--line);
 border-radius:999px;padding:2px 10px;cursor:pointer;margin-left:2px}

/* 手动主题：html.dark / html.light 覆盖系统偏好 */
html.dark{color-scheme:dark;--bg:#16181c; --panel:#1d2025; --ink:#e8eaed; --ink2:#9aa3ad; --line:#2c3037; --accent:#e5836a; --accent-soft:#2a211f; --chip:#242830; --mark:#4a3f1a; --green:#6cc38b;}
html.light{color-scheme:light;--bg:#f7f6f3; --panel:#ffffff; --ink:#1f2328; --ink2:#5b6470; --line:#e6e2da; --accent:#b4442e; --accent-soft:#fdf1ec; --chip:#efece6; --mark:#fff3c4; --green:#2f7d4f;}
.hist2{font-size:11px;color:var(--ink2);background:var(--chip);border-radius:5px;
   padding:1px 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <a class="back" href="index.html">← 全部单元</a>
  <h1>生词本</h1>
  <p class="sub">按遗忘曲线安排复习：答对一次就往后推一天、两天、四天……答错的词明天还会回来。数据只存在本机浏览器。</p>
 </div>

 <div class="hd">
  <div class="tot"><span>共</span><b id="tot">0</b><span>个生词</span></div>
  <div class="badges">
   <span>今日待复习 <i id="dueN">0</i></span>
   <span>已掌握 <i class="g" id="okN">0</i></span>
   <span id="tip" style="color:var(--ink2)"></span>
  </div>
 </div>

 <div class="sp">
  <div class="spi"><b id="spStreak">0</b><span>连续打卡（天）</span></div>
  <div class="spi"><b id="spToday">0</b><span>今日复习</span></div>
  <div class="spi"><b id="spAdd">0</b><span>今日新增</span></div>
  <div class="spi"><b id="spMaster">0%</b><span>掌握率</span></div>
 </div>
 <div class="bars" id="bars"></div>
 <div class="axis"><span>近 14 天复习量</span><span id="barTip"></span></div>

 <div class="acts">
  <button class="btn pri" id="start">开始复习</button>
  <button class="btn" id="startw">拼写听写</button>
  <button class="btn" id="exp">导出 TXT</button>
  <button class="btn" id="expj">备份 JSON</button>
  <button class="btn" id="imp">导入备份</button>
  <button class="btn" id="clr">清空</button>
  <input type="file" id="file" accept=".json" style="display:none">
 </div>

 <div class="toolbar" style="position:static;background:none;border:0;padding:0;margin:6px 0 14px">
  <div class="tools">
   <input id="q" type="search" placeholder="在生词本里搜索…（按 / 聚焦）">
   <select class="sortsel" id="sort">
    <option value="due">按到期时间</option>
    <option value="t">按加入时间</option>
    <option value="c">按章节</option>
    <option value="a">按字母</option>
   </select>
   <select class="sortsel" id="flt">
    <option value="all">全部</option>
    <option value="due">今日待复习</option>
    <option value="new">新加入未复习</option>
    <option value="ok">已掌握</option>
   </select>
   <span class="count" id="cnt">0 条</span>
  </div>
 </div>

 <div id="list"></div>
 <div class="empty" id="empty" style="display:none">生词本还是空的 —— 去单元页点单词旁边的 ☆ 吧</div>
</div>

<div id="rev">
 <div class="rwrap">
  <div class="rbar">
   <span class="num" id="rnum">0 / 0</span>
   <div class="prog"><i id="rprog"></i></div>
   <button class="x" id="rclose">×</button>
  </div>
  <div class="modes">
   <button class="mbtn on" data-mode="card">闪卡</button>
   <button class="mbtn" data-mode="write">拼写</button>
  </div>

  <div id="pane-card">
   <div class="rcard" id="rcard">
    <div class="rw" id="rw"></div>
    <div class="ripa" id="ripa"></div>
    <button class="spk" id="rspk" title="朗读这个单词" style="margin-top:8px"></button>
    <div class="rq" id="rq">点击卡片看释义，或按空格</div>
    <div class="rans" id="rans">

<script>
/* ---------- 朗读 ---------- */
var TTS=(function(){
 var voices=[], pref='en-GB';
 try{pref=JSON.parse(localStorage.getItem('vj-tts')||'{}').v||'en-GB'}catch(e){}
 var sup = (typeof speechSynthesis!=='undefined' && typeof SpeechSynthesisUtterance!=='undefined');
 function load(){ try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]} }
 if(sup){ load(); try{speechSynthesis.onvoiceschanged=load}catch(e){} }
 function pick(){
  if(!voices.length) load();
  var en=voices.filter(function(v){return /^en/i.test(v.lang||'')});
  var same=en.filter(function(v){return (v.lang||'').replace('_','-').toLowerCase().indexOf(pref.toLowerCase())===0});
  return same[0] || en.filter(function(v){return /en-GB/i.test(v.lang)})[0] ||
         en.filter(function(v){return /en-US/i.test(v.lang)})[0] || en[0] || null;
 }
 function speak(t, rate){
  if(!sup||!t) return false;
  try{
   speechSynthesis.cancel();
   var u=new SpeechSynthesisUtterance(t), v=pick();
   if(v){u.voice=v; u.lang=v.lang;} else u.lang=pref;
   u.rate=rate||0.92; u.pitch=1;
   speechSynthesis.speak(u);
   return true;
  }catch(e){return false}
 }
 function setPref(p){
  pref=p;
  try{localStorage.setItem('vj-tts',JSON.stringify({v:p}))}catch(e){}
  document.querySelectorAll('.ttsvg').forEach(function(b){b.classList.toggle('on',b.dataset.vp===p)});
 }
 return {speak:speak,setPref:setPref,pref:function(){return pref},ok:function(){return sup}};
})();
window.TTS=TTS;

/* ---------- 生词本 ---------- */
var NB=(function(){
 var KEY='vj-book', SETK='vj-set', STK='vj-stat';
 var mem=null, okStore=true;
 function read(){
  if(mem) return mem;
  try{var raw=localStorage.getItem(KEY); mem=raw?JSON.parse(raw):{}}catch(e){okStore=false; mem={}}
  return mem;
 }
 function write(){
  try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){
    okStore=false;
    alert('浏览器不允许本地存储，生词本无法保存（请用 https 打开，或关闭无痕模式）');
  }
 }
 function count(){return Object.keys(read()).length}
 function has(w){return !!read()[w]}
 function addOne(rec){
  var m=read();
  if(m[rec.w]) return false;
  rec.t=Date.now();
  m[rec.w]=rec; write(); bump('a'); sync(); return true;
 }
 function toggle(rec){
  var m=read();
  if(m[rec.w]){delete m[rec.w]; write(); sync(); return false}
  rec.t=Date.now(); m[rec.w]=rec; write(); bump('a'); sync(); return true;
 }
 function remove(w){var m=read(); delete m[w]; write(); sync();}
 function save(rec){var m=read(); m[rec.w]=rec; write(); sync();}
 function all(){
  var m=read(), a=[];
  for(var k in m) a.push(m[k]);
  a.sort(function(x,y){return (y.t||0)-(x.t||0)});
  return a;
 }
 /* 设置：加入时是否连带衍生词 */
 function settings(){ try{return JSON.parse(localStorage.getItem(SETK)||'{}')}catch(e){return {}} }
 function setSetting(k,v){
  var s=settings(); s[k]=v;
  try{localStorage.setItem(SETK,JSON.stringify(s))}catch(e){}
 }
 function dvOn(){ var s=settings(); return s.dv!==false }
 /* 学习统计 */
 function pad(n){return n<10?'0'+n:''+n}
 function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
 function stat(){ try{return JSON.parse(localStorage.getItem(STK)||'{}')}catch(e){return {}} }
 function bump(k,n){
  var s=stat(), key=dayKey();
  s[key]=s[key]||{a:0,r:0,c:0};
  s[key][k]=(s[key][k]||0)+(n||1);
  var ks=Object.keys(s).sort();
  if(ks.length>120){ ks.slice(0,ks.length-120).forEach(function(x){delete s[x]}) }
  try{localStorage.setItem(STK,JSON.stringify(s))}catch(e){}
 }
 function streak(){
  var s=stat(), n=0, d=new Date(), k=dayKey(d);
  if(!(s[k] && (s[k].r||s[k].a))) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
   var o=s[dayKey(d)];
   if(o && (o.r||o.a)){ n++; d.setDate(d.getDate()-1); }
   else break;
  }
  return n;
 }
 function sync(){
  var n=count();
  document.querySelectorAll('#nbfab b').forEach(function(el){el.textContent=n});
  document.querySelectorAll('.star').forEach(function(el){
    var on=has(el.dataset.star), was=el.classList.contains('on');
    el.classList.toggle('on',on);
    el.textContent=on?'★':'☆';
    if(on&&!was) el.setAttribute('title','已在生词本（点击移出）');
    else if(!on) el.setAttribute('title','加入生词本');
  });
 }
 function parseDv(s){
  if(!s) return [];
  return s.split(';;').filter(Boolean).map(function(x){
   var a=x.split('|'); return {w:a[0], p:a[1]||'', m:a[2]||''};
  });
 }
 function onStar(e){
  var b=e.target.closest('.star'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var host=b.closest('[data-w]')||b.closest('.card')||b.closest('tr');
  var w=b.dataset.star;
  if(has(w)){
   remove(w);
   var m=read();
   Object.keys(m).forEach(function(k){ if(m[k] && m[k].pw===w){ delete m[k] } });
   write(); sync();
   return;
  }
  var rec=entry(host,w);
  toggle(rec);
  if(dvOn()){
   parseDv(host?host.dataset.dv:'').forEach(function(d){
     if(!d.w || has(d.w)) return;
     addOne({w:d.w, p:'', m:d.m||'', d:'', e:'', z:'',
             c:rec.c, g:rec.g, pv:1, pw:rec.w, pm:rec.m, pp:d.p});
   });
  }
  var fab=document.getElementById('nbfab');
  if(fab){fab.classList.remove('wiggle');void fab.offsetWidth;fab.classList.add('wiggle');}
 }
 function onSpk(e){
  var b=e.target.closest('.spk'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var t=b.dataset.say;
  if(!t){ var h=b.closest('[data-w]'); t=h?h.dataset.w:''; }
  TTS.speak(t);
 }
 function txt(el){return el?el.textContent.trim():''}
 function entry(host, w){
  if(!host) return {w:w};
  var mEl=host.querySelector('.m'), ipaEl=host.querySelector('.ipa');
  var mean='';
  if(mEl){var c=mEl.cloneNode(true);var d=c.querySelector('.dv');if(d)c.removeChild(d);mean=c.textContent.trim()}
  var en=txt(host.querySelector('.ex .en'))||host.dataset.e||'',
      zh=txt(host.querySelector('.ex .zh'))||host.dataset.z||'';
  return {w:w, p:txt(ipaEl), m:mean,
          d:host.dataset.dv||'',
          e:en, z:zh,
          c:document.body.dataset.ch||'',
          g:document.body.dataset.title||''};
 }
 document.addEventListener('click',onStar);
 document.addEventListener('click',onSpk);
 window.addEventListener('storage',function(e){
  if(e.key===KEY){mem=null;sync();}
 });
 if(document.readyState!=='loading') sync(); else document.addEventListener('DOMContentLoaded',sync);
 sync();
 return {count:count,has:has,all:all,remove:remove,toggle:toggle,sync:sync,read:read,
         save:save,addOne:addOne,dvOn:dvOn,settings:settings,setSetting:setSetting,
         bump:bump,stat:stat,streak:streak,dayKey:dayKey,parseDv:parseDv};
})();
window.NB=NB;
</script>
<script>
(function(){
 var ICON='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.2 6.2v3.6h1.9L8 12.2V3.8L5.1 6.2H3.2z"/><path d="M10.4 6.3a2.5 2.5 0 0 1 0 3.4"/><path d="M12.1 4.7a4.8 4.8 0 0 1 0 6.6"/></svg>';
 var list=document.getElementById('list'), empty=document.getElementById('empty');
 var q=document.getElementById('q'), sort=document.getElementById('sort'), flt=document.getElementById('flt');
 var cnt=document.getElementById('cnt'), tot=document.getElementById('tot');
 var dueN=document.getElementById('dueN'), okN=document.getElementById('okN'), tip=document.getElementById('tip');

 /* ---------- 遗忘曲线排程 ---------- */
 var INT=[0,1,2,4,8,15,30,90];                 // 等级 → 间隔(天)
 function dueOf(r){ return r.due || r.t || 0 }
 function lvOf(r){ return r.lv||0 }
 function mastered(r){ return lvOf(r) >= 7 }
 function isDue(r){ return !mastered(r) && dueOf(r) <= Date.now() }
 function grade(r, ok){
  var now=Date.now();
  if(ok){ r.lv=Math.min(7, lvOf(r)+1); r.ok=(r.ok||0)+1; r.due=now+INT[r.lv]*864e5; }
  else  { r.lv=Math.max(0, lvOf(r)-1); r.due=now+10*6e4; r.wr=(r.wr||0)+1; }
  r.rv=(r.rv||0)+1; r.lrt=now;
  NB.save(r); NB.bump('r'); if(ok) NB.bump('c');
  return r;
 }
 function dueText(r){
  if(mastered(r)) return '已掌握';
  var d=dueOf(r), now=Date.now(), diff=d-now;
  if(diff<=0) return (r.rv?'待复习':'新词');
  if(diff<3600e3) return Math.max(1,Math.round(diff/6e4))+' 分钟后';
  var days=Math.round(diff/864e5);
  return days<=1?'明天':days+' 天后';
 }
 function dueCls(r){
  if(mastered(r)) return 'due done';
  return dueOf(r)<=Date.now()?'due now':'due';
 }

 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
   return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];})}
 function dvList(d){
  return (d||'').split(';;').filter(Boolean).map(function(s){
   var a=s.split('|'); return {w:a[0], p:a[1]||'', m:a[2]||''};
  });
 }
 function dvHtml(d){
  var arr=dvList(d); if(!arr.length) return '';
  return '衍生 · ' + arr.map(function(x){
   return '<i style="font-style:normal;font-family:ui-serif,Georgia,serif;font-size:14px">'+esc(x.w)+'</i>'+
          (x.p?'<em style="font-style:normal;font-size:10.5px;opacity:.7;margin-left:2px">'+esc(x.p)+'</em>':'');
  }).join(' <span style="opacity:.3">·</span> ');
 }

 function render(){
  var all=NB.all(), v=(q.value||'').trim().toLowerCase(), s=sort.value, f=flt.value, now=Date.now();
  var arr=all.filter(function(r){
   if(f==='due') { if(!isDue(r)) return false; }
   if(f==='ok' && !mastered(r)) return false;
   if(f==='new' && r.rv) return false;
   return !v || (r.w+' '+(r.m||'')+' '+(r.d||'')).toLowerCase().indexOf(v)>-1;
  });
  if(s==='due') arr.sort(function(a,b){return dueOf(a)-dueOf(b)});
  if(s==='c') arr.sort(function(a,b){return (a.c||99)-(b.c||99) || (a.w>b.w?1:-1)});
  if(s==='a') arr.sort(function(a,b){return a.w.toLowerCase()>b.w.toLowerCase()?1:-1});
  if(s==='t') arr.sort(function(a,b){return (b.t||0)-(a.t||0)});

  var nAll=all.length, nDue=all.filter(isDue).length, nOk=all.filter(mastered).length;
  tot.textContent=nAll; dueN.textContent=nDue; okN.textContent=nOk;

  /* 学习统计 */
  var st=NB.stat(), tk=NB.dayKey(), td=st[tk]||{a:0,r:0,c:0};
  document.getElementById('spStreak').textContent=NB.streak();
  document.getElementById('spToday').textContent=td.r||0;
  document.getElementById('spAdd').textContent=td.a||0;
  document.getElementById('spMaster').textContent=nAll? Math.round(nOk*100/nAll)+'%' : '0%';
  var days=[], mx=1;
  for(var i=13;i>=0;i--){
   var d=new Date(); d.setDate(d.getDate()-i);
   var k=NB.dayKey(d), o=st[k]||{}, v=(o.r||0);
   days.push({k:k,v:v}); if(v>mx) mx=v;
  }
  document.getElementById('bars').innerHTML=days.map(function(x){
   var h=x.v? Math.max(10, Math.round(x.v*100/mx)) : 3;
   return '<i class="'+(x.v?'on':'')+'" style="height:'+h+'%" title="'+x.k+' 复习 '+x.v+'"></i>';
  }).join('');
  document.getElementById('barTip').textContent='今天 '+days[13].v+' 个';
  cnt.textContent=arr.length+' 条';
  empty.style.display=(nAll&&arr.length)?'none':'block';
  empty.textContent=nAll?'这个筛选下没有词':'生词本还是空的 —— 去单元页点单词旁边的 ☆ 吧';

  if(!arr.length){ list.innerHTML=''; }
  else{
   list.innerHTML=arr.map(function(r){
    var ex=(r.e||r.z)?'<div class="ex">'+(r.e?'<div class="en">'+esc(r.e)+'</div>':'')+
      (r.z?'<div class="zh">'+esc(r.z)+'</div>':'')+'</div>':'';
    var tag=r.c?'<span class="tag">Unit '+String(r.c).padStart(2,'0')+(r.g?' · '+esc(r.g):'')+'</span>':'';
    var dv=dvHtml(r.d);
    var pvTag = r.pv? '<span class="tag">衍生自 '+esc(r.pw||'')+'</span>' : '';
    return '<div class="item"><div class="h"><span class="w">'+esc(r.w)+'</span>'+
      '<button class="spk" data-say="'+esc(r.w)+'" title="朗读">'+ICON+'</button>'+
      (r.p?'<span class="ipa">'+esc(r.p)+'</span>':'')+pvTag+tag+
      (r.rv?'<span class="hist2" title="背诵记录：记住 / 没记住">记住 '+(r.ok!=null?r.ok:Math.max(0,(r.rv||0)-(r.wr||0)))+' · 忘 '+(r.wr||0)+'</span>':'')+
      '<span class="'+dueCls(r)+'">'+dueText(r)+'</span>'+
      '<button class="del" data-del="'+esc(r.w)+'">移出</button></div>'+
      '<div class="m">'+(r.pv
        ? '<span style="font-weight:600">'+esc(r.pp||'')+'</span> <span style="color:var(--ink2)">← '+esc(r.pw||'')+
          (r.pm? '（'+esc(r.pm)+'）':'')+' 的派生词</span>'
        : esc(r.m||'—'))+
        (dv?'<div style="margin-top:5px;font-size:12px;color:var(--ink2)">'+dv+'</div>':'')+'</div>'+
      ex+'</div>';
   }).join('');
  }
  tip.textContent=nAll? '' : '';
  document.title=(nAll?nAll+' 词 · ':'')+'生词本 · 雅思词汇真经';
 }

 list.addEventListener('click',function(e){
  var b=e.target.closest('[data-del]'); if(!b) return;
  NB.remove(b.dataset.del); render();
 });
 q.addEventListener('input',render);
 sort.addEventListener('change',render);
 flt.addEventListener('change',render);

 function dl(name,text,type){
  var blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
 }
 document.getElementById('exp').onclick=function(){
  var all=NB.all(); if(!all.length) return alert('生词本还是空的');
  var t='雅思词汇真经 · 生词本（'+all.length+' 词）\n\n';
  all.forEach(function(r,i){
   var dv=dvList(r.d).map(function(x){return x.w}).join(', ');
   t+=(i+1)+'. '+r.w+(r.p?'  '+r.p:'')+'\n   '+(r.m||'')+'\n'+
      (dv?'   衍生：'+dv+'\n':'')+(r.e?'   例：'+r.e+'\n':'')+
      (r.z?'        '+r.z+'\n':'')+'   复习：'+dueText(r)+'\n\n';
  });
  dl('生词本-'+all.length+'词.txt',t);
 };
 document.getElementById('expj').onclick=function(){
  var all=NB.all(); if(!all.length) return alert('生词本还是空的');
  dl('生词本备份.json',JSON.stringify({app:'ielts-zhenjing',v:2,n:all.length,items:all},null,1),'application/json');
 };
 document.getElementById('imp').onclick=function(){document.getElementById('file').click()};
 document.getElementById('file').onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
   try{
    var o=JSON.parse(rd.result), items=o.items||o||[];
    if(!Array.isArray(items)) throw 0;
    var m=NB.read(), n=0;
    items.forEach(function(r){ if(r&&r.w&&!m[r.w]){r.t=r.t||Date.now();
      if(!r.due) r.due=r.t; m[r.w]=r; n++} });
    try{localStorage.setItem('vj-book',JSON.stringify(m))}catch(err){}
    alert('导入完成：新增 '+n+' 个生词'); render(); NB.sync();
   }catch(err){alert('文件格式不对，需要本页导出的 JSON 备份')}
  };
  rd.readAsText(f); e.target.value='';
 };
 document.getElementById('clr').onclick=function(){
  if(!NB.count()) return;
  if(!confirm('确定清空全部 '+NB.count()+' 个生词？此操作不可撤销。')) return;
  try{localStorage.setItem('vj-book','{}')}catch(e){}
  location.reload();
 };

 /* ---------- 复习会话 ---------- */
 var rev=document.getElementById('rev'), queue=[], idx=0, mode='card';
 var okN2=0, badN=0, shown=false, answered=false;
 var rw=document.getElementById('rw'), ripa=document.getElementById('ripa'), rq=document.getElementById('rq'),
     rans=document.getElementById('rans'), rm=document.getElementById('rm'), rdv=document.getElementById('rdv'),
     rex=document.getElementById('rex'), rnum=document.getElementById('rnum'), rprog=document.getElementById('rprog'),
     rcard=document.getElementById('rcard'), rok=document.getElementById('rok'), rno=document.getElementById('rno'),
     paneCard=document.getElementById('pane-card'), paneWrite=document.getElementById('pane-write'),
     wq=document.getElementById('wq'), wex=document.getElementById('wex'), whint=document.getElementById('whint'),
     win=document.getElementById('win'), wsubmit=document.getElementById('wsubmit'), wfb=document.getElementById('wfb'),
     wshow=document.getElementById('wshow'), wnext=document.getElementById('wnext');

 function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

 function start(m){
  var all=NB.all();
  if(!all.length) return alert('生词本还是空的，先点 ☆ 加几个词吧');
  var due=all.filter(isDue);
  var pool=due.length? due : all;
  if(!due.length && !confirm('今天没有到期的词。要复习全部 '+all.length+' 个吗？')) return;
  queue=shuffle(pool.slice()); idx=0; okN2=0; badN=0;
  queue.forEach(function(r){ r._rq=0 });
  mode=m||'card';
  setMode(mode);
  rev.classList.add('on'); document.body.style.overflow='hidden';
  paint();
 }
 function setMode(m){
  mode=m;
  document.querySelectorAll('.mbtn').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  paneCard.style.display = m==='card'?'':'none';
  paneWrite.style.display = m==='write'?'':'none';
 }
 document.querySelectorAll('.mbtn').forEach(function(b){
  b.onclick=function(){ if(!rev.classList.contains('on')) return; setMode(b.dataset.mode); paint(); };
 });

 function paint(){
  if(idx>=queue.length) return finish();
  var r=queue[idx];
  rnum.textContent=(idx+1)+' / '+queue.length;
  rprog.style.width=(idx/queue.length*100)+'%';
  if(mode==='card') paintCard(r); else paintWrite(r);
 }
 function paintCard(r){
  shown=false;
  rw.textContent=r.w; ripa.textContent=r.p||'';
  rq.style.display=''; rq.textContent='点击卡片看释义，或按空格';
  rans.classList.remove('on'); rcard.style.cursor='pointer';
  if(r.pv){
   rm.innerHTML=esc(r.pp||'')+' <span style="color:var(--ink2);font-size:13px">= '+esc(r.pw||'')+' 的派生词'+
     (r.pm?'（'+esc(r.pm)+'）':'')+'</span>';
  } else rm.textContent=r.m||'—';
  var rs=document.getElementById('rspk'); if(rs){rs.dataset.say=r.w; rs.innerHTML=ICON;}
  var dv=dvList(r.d).map(function(x){return x.w+(x.p?' '+x.p:'')}).join(' · ');
  rdv.innerHTML=dv?'衍生 · '+dv:'';
  rex.innerHTML=(r.e?'<div class="en">'+esc(r.e)+'</div>':'')+(r.z?'<div class="zh">'+esc(r.z)+'</div>':'');
  rok.disabled=rno.disabled=false;
 }
 function promptOf(r){
  if(!r.pv) return r.m||'—';
  var pm=(r.pm||'').replace(/^[a-z]+\.\s*/i,'');
  return (r.pp? r.pp+'　':'')+(pm? pm+'　':'')+'（'+ (r.pw||'') +' 的派生词）';
 }
 function paintWrite(r){
  answered=false;
  wq.innerHTML=esc(promptOf(r));
  wex.textContent=r.z?('例句：'+r.z):'';
  wex.style.display=r.z?'':'none';
  whint.textContent=''; win.value=''; win.className=''; wfb.innerHTML='';
  win.disabled=false; wsubmit.disabled=false;
  wnext.innerHTML='继续 <span style="font-size:11px;opacity:.55">回车</span>';
  setTimeout(function(){ try{win.focus()}catch(e){} },50);
 }
 function revealCard(){ if(shown) return; shown=true; rans.classList.add('on');
  rq.style.display='none'; rcard.style.cursor='default'; }

 function next(){
  idx++;
  if(idx<queue.length) rprog.style.width=(idx/queue.length*100)+'%';
  paint();
 }
 function answer(ok){
  var r=queue[idx];
  grade(r, ok);
  if(ok){ okN2++; } else {
    badN++;
    if(r._rq < 1 && queue.length < 60){ r._rq=(r._rq||0)+1; queue.push(r); }
  }
  if(mode==='card'){ next(); }
 }

 rok.onclick=function(){ if(mode!=='card')return; if(!shown){revealCard();return} answer(true) };
 rno.onclick=function(){ if(mode!=='card')return; if(!shown){revealCard();return} answer(false) };
 rcard.onclick=function(){ if(mode==='card') revealCard(); };

 /* 拼写判定 */
 function norm(s){ return (s||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').trim()
   .replace(/[.,;:!?]+$/,''); }
 function hintFor(w){
  return w.split('').map(function(c,i){
   if(c===' ') return ' ';
   return i===0? c : '_';
  }).join(' ');
 }
 function submitWrite(){
  if(answered) return;
  try{
   var r=queue[idx], typed=win.value;
   if(!typed.trim()) { win.focus(); return; }
   answered=true;
   var right = norm(typed)===norm(r.w);
   win.className = right?'ok':'bad';
   win.disabled=true; wsubmit.disabled=true;
   if(right){
    wfb.innerHTML='<span class="right">✓ 拼对了</span> &nbsp;<code>'+esc(r.w)+'</code>'+
      (r.p?'<span style="color:var(--ink2);font-size:13px;margin-left:8px">'+esc(r.p)+'</span>':'');
    answer(true);
    rprog.style.width=(Math.min(idx+1,queue.length)/queue.length*100)+'%';
    setTimeout(function(){ idx++; paint(); }, 900);
   }else{
    wfb.innerHTML='<span class="wrong">✗ 写错了</span> &nbsp;正确拼写 <code>'+esc(r.w)+'</code>'+
      '<div style="color:var(--ink2);font-size:13px;margin-top:4px">你写的是 <s>'+esc(typed)+'</s></div>';
    wnext.innerHTML='继续 <span style="font-size:11px;opacity:.55">回车</span>';
    answer(false);
   }
  }catch(e){}
 }
 wsubmit.onclick=submitWrite;
 document.getElementById('wlisten').onclick=function(){ TTS.speak(queue[idx]?queue[idx].w:'', 0.9); };
 document.getElementById('wfirst').onclick=function(){
  if(answered||!queue[idx]) return;
  whint.textContent=hintFor(queue[idx].w);
 };
 win.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); if(answered){ next(); } else submitWrite(); }
 });
 wshow.onclick=function(){
  if(answered) return;
  answered=true;
  var r=queue[idx];
  win.className=''; win.disabled=true; wsubmit.disabled=true;
  wfb.innerHTML='<span style="color:var(--ink2)">答案</span> <code>'+esc(r.w)+'</code>';
  answer(false);
 };
 wnext.onclick=function(){ if(answered) next(); else submitWrite(); };

 function finish(){
  var uniq={}, left=0;
  queue.forEach(function(r){ if(!uniq[r.w]){uniq[r.w]=1; if(!mastered(r)) left++;} });
  var nextDue=null;
  Object.keys(uniq).forEach(function(k){
    var r=NB.read()[k]; if(!r||mastered(r)) return;
    var d=dueOf(r);
    if(!nextDue||d<nextDue.d) nextDue={w:k,d:d};
  });
  rev.innerHTML='<div class="rwrap"><div class="done"><h2>这一轮过完了</h2>'+
   '<p>过词 '+Object.keys(uniq).length+' 个 · 记住 '+okN2+' 次 · 没记住 '+badN+' 次<br>'+
   (nextDue? ('下一次复习：'+ (function(){
     var diff=nextDue.d-Date.now();
     if(diff<3600e3) return Math.max(1,Math.round(diff/6e4))+' 分钟后';
     var dd=Math.round(diff/864e5); return dd<=1?'明天':dd+' 天后';
   })()) : '全部词都已掌握 🎉')+'</p>'+
   '<div class="acts"><button class="btn pri" id="again">再来一轮</button>'+
   '<button class="btn" id="back">回到列表</button></div></div></div>';
  document.getElementById('again').onclick=function(){location.reload()};
  document.getElementById('back').onclick=function(){location.reload()};
 }
 document.getElementById('start').onclick=function(){start('card')};
 document.getElementById('startw').onclick=function(){start('write')};
 document.getElementById('rclose').onclick=function(){location.reload()};

 document.addEventListener('keydown',function(e){
  if(!rev.classList.contains('on')){
   if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
   return;
  }
  if(mode==='write'){
   if(document.activeElement===win) return;      // 输入框自己处理回车
   if(e.key==='1'){ e.preventDefault(); wshow.click(); }
   if(e.key==='2'){ e.preventDefault(); if(answered) next(); }
   if(e.key==='Enter'){ e.preventDefault(); if(answered) next(); }
   if(e.key==='Escape') location.reload();
   return;
  }
  if(e.key===' '||e.key==='Enter'){e.preventDefault(); if(!shown)revealCard(); else answer(true)}
  if(e.key==='1'){ if(!shown)revealCard(); else answer(false) }
  if(e.key==='2'){ if(!shown)revealCard(); else answer(true) }
  if(e.key==='Escape') location.reload();
 });

 window.__nbRender=render;
 window.addEventListener("storage",function(e){ if(e.key==="vj-book"){ render(); } });
 render();
})();

<script>
/* ================= 多设备同步（同步码）================= */
var SYNC=(function(){
 var SITE='vj', K_BOOK='vj-book', K_REC='vj-rec', K_STAT='vj-stat', ACC='#b4442e';
 var OFF=true;   /* 总开关：true = 页面上不显示入口、也不发任何请求；改回 false 重新生成即可恢复 */
 var BAKED={url:'https://yqoxysoegjlnutcinnid.supabase.co', key:'sb_publishable_-J9znbu9mI4VzoBzN-8xZA_5K7JQLuQ'};
 var PWH='40cb6b16335fa8699278328ba343c0bf8ce0acde95c33b03f525e09e02408a9c', UNLK='sync-unlock';
 var CFG='sync-cfg', CODEK='sync-code', LASTK='sync-last';
 var UI=!!window.SYNC_UI;
 var applying=false, timer=null, busy=false, lastAt=0, status={s:'idle',m:''};

 /* ---------- 配置 ---------- */
 function cfg(){
  try{var o=JSON.parse(localStorage.getItem(CFG)||'null'); if(o&&o.url&&o.key) return o;}catch(e){}
  if(BAKED&&BAKED.url&&BAKED.key&&BAKED.key.indexOf('_')>-1) return BAKED;
  var c=window.SYNC_CONFIG;
  if(c&&c.url&&c.key) return c;
  return null;
 }
 function setCfg(url,key){
  localStorage.setItem(CFG,JSON.stringify({url:url.replace(/\/+$/,''),key:key}));
 }
 function code(){ return (localStorage.getItem(CODEK)||'').trim() }
 function setCode(c){ localStorage.setItem(CODEK,c) }

 /* 码：10 位，去掉 0/O/1/I 之类易混字符，显示成 4-4-2 */
 var AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 function newCode(){
  var s='';
  var rnd=window.crypto&&window.crypto.getRandomValues?function(n){
    var a=new Uint8Array(n); window.crypto.getRandomValues(a); return a; }:function(n){
    var a=[]; for(var i=0;i<n;i++) a.push(Math.floor(Math.random()*256)); return a; };
  var a=rnd(10);
  for(var i=0;i<10;i++) s+=AB.charAt(a[i]%AB.length);
  return s;
 }
 function pretty(c){
  c=(c||'').toUpperCase().replace(/[^A-Z2-9]/g,'');
  if(c.length===10) return c.slice(0,4)+'-'+c.slice(4,8)+'-'+c.slice(8);
  return c;
 }

 /* ---------- 访问密码：页面里只放 SHA-256，解锁状态记在本机 ---------- */
 function gate(){ return !!(PWH&&PWH.length===64) }
 function unlocked(){ return !gate() || localStorage.getItem(UNLK)===PWH }
 function _u8(s){
  var t=unescape(encodeURIComponent(String(s))), o=[];
  for(var i=0;i<t.length;i++) o.push(t.charCodeAt(i));
  return o;
 }
 function sha256hex(s){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
         0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
         0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
         0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
         0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
         0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
         0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var m=_u8(s), l=m.length*8, i, t;
  m.push(0x80);
  while(m.length%64!==56) m.push(0);
  m.push(0,0,0,0,(l>>>24)&255,(l>>>16)&255,(l>>>8)&255,l&255);
  function rr(x,n){ return (x>>>n)|(x<<(32-n)) }
  var w=new Array(64);
  for(i=0;i<m.length;i+=64){
   for(t=0;t<16;t++) w[t]=((m[i+t*4]<<24)|(m[i+t*4+1]<<16)|(m[i+t*4+2]<<8)|m[i+t*4+3])|0;
   for(t=16;t<64;t++){
    var x=w[t-15], y=w[t-2];
    var s0=rr(x,7)^rr(x,18)^(x>>>3), s1=rr(y,17)^rr(y,19)^(y>>>10);
    w[t]=(w[t-16]+s0+w[t-7]+s1)|0;
   }
   var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
   for(t=0;t<64;t++){
    var S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
    var t1=(h+S1+ch+K[t]+w[t])|0;
    var S0=rr(a,2)^rr(a,13)^rr(a,22), maj=(a&b)^(a&c)^(b&c);
    var t2=(S0+maj)|0;
    h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
   }
   H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
   H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  var out='';
  for(i=0;i<8;i++) out+=('00000000'+(H[i]>>>0).toString(16)).slice(-8);
  return out;
 }

 /* ---------- 读写本地 ---------- */
 function rd(k){ try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}} }
 function wr(k,o){
  var s=JSON.stringify(o||{});
  if(localStorage.getItem(k)===s) return false;
  applying=true;
  try{ localStorage.setItem(k,s) }finally{ applying=false }
  return true;
 }
 function local(){ return {book:rd(K_BOOK), rec:rd(K_REC), stat:rd(K_STAT)} }

 /* ---------- 合并：词条按最后修改时间取新，统计按天取大 ---------- */
 function ts(x){ return x? (x.lrt||x.t||0) : 0 }
 function pick(a,b){ if(!a) return b; if(!b) return a; return ts(b)>ts(a)? b : a }
 function mergeMap(l,r){
  var out={}, k;
  l=l||{}; r=r||{};
  for(k in l) out[k]=l[k];
  for(k in r) out[k]= out[k]? pick(out[k],r[k]) : r[k];
  return out;
 }
 function mergeStat(l,r){
  var out={}, k;
  l=l||{}; r=r||{};
  for(k in l) out[k]={a:l[k].a||0,r:l[k].r||0,c:l[k].c||0};
  for(k in r){
   var t=out[k]||{a:0,r:0,c:0}, s=r[k]||{};
   out[k]={a:Math.max(t.a,s.a||0), r:Math.max(t.r,s.r||0), c:Math.max(t.c,s.c||0)};
  }
  return out;
 }
 function mergeSite(localDoc, remote){
  remote=remote||{};
  return {
   book: mergeMap(localDoc.book, remote.book),
   rec:  mergeMap(localDoc.rec,  remote.rec),
   stat: mergeStat(localDoc.stat, remote.stat)
  };
 }
 function same(a,b){ return JSON.stringify(a)===JSON.stringify(b) }

 /* ---------- 网络 ---------- */
 function rpc(fn, body){
  var c=cfg();
  if(!c) return Promise.reject(new Error('未配置'));
  var hd={'Content-Type':'application/json','apikey':c.key};
  if(/^eyJ/.test(c.key)) hd['Authorization']='Bearer '+c.key;   // 兼容老的 anon JWT
  var ctrl=null, opt={method:'POST', headers:hd, body:JSON.stringify(body)};
  try{
   ctrl=new AbortController(); opt.signal=ctrl.signal;
   setTimeout(function(){ try{ctrl.abort()}catch(e){} }, 12000);
  }catch(e){}
  return fetch(c.url+'/rest/v1/rpc/'+fn, opt).then(function(r){
   if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+' '+(t||'').slice(0,120)) });
   return r.json();
  });
 }

 /* ---------- 同步一轮 ---------- */
 function emsg(e){
  var m=(e&&e.message)||'';
  if(/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m))
   return '连不上服务器：检查网络，或确认项目地址填对了';
  if(/abort/i.test(m)) return '请求超时，稍后再试';
  if(/HTTP 40[13]/.test(m)) return 'anon key 不对或没权限，确认那段 SQL 已经跑过';
  if(/HTTP 404/.test(m)) return '找不到接口：项目地址可能填错，或 SQL 还没跑';
  return m||'同步失败';
 }

 function host(){ var c=cfg(); return c? c.url.replace(/^https?:\/\//,'') : '' }
 /* 出错后再探一次：能连上但读不到响应 = CORS/暂停；连不上 = DNS/网络 */
 function refine(){
  var c=cfg(); if(!c) return;
  fetch(c.url+'/rest/v1/',{method:'GET',mode:'no-cors',cache:'no-store'}).then(function(){
   setStat('err','能连到 '+host()+'，但浏览器不让读响应：项目可能被暂停，或被网络/防火墙拦了');
  },function(){
   setStat('err','连不上 '+host()+'：域名解析或网络不通（换手机流量或开代理再试）');
  });
 }

 function cycle(silent){
  if(OFF) return Promise.resolve(false);
  var c=cfg(), k=code();
  if(!unlocked()){ setStat('idle','已锁定'); return Promise.resolve(false) }
  if(!c||!k){ setStat('idle',''); return Promise.resolve(false) }
  if(busy) return Promise.resolve(false);
  busy=true; setStat('run','同步中…');
  var remote=null;
  return rpc('sync_pull',{p_code:k}).then(function(r){
   remote=r||{ver:0,payload:{}};
   return mergeAndPush(remote);
  }).then(function(ok){
   busy=false; return ok;
  }).catch(function(e){
   busy=false; setStat('err', emsg(e)); refine(); return false;
  });
 }
 function mergeAndPush(rem, tryN){
  tryN=tryN||0;
  var doc=rem.payload||{};
  var cur=local();
  var merged=mergeSite(cur, doc[SITE]);
  var next={v:1};
  for(var k in doc) if(k!=='v') next[k]=doc[k];
  next[SITE]=merged;
  var changed = !same(cur.book,merged.book) || !same(cur.rec,merged.rec) || !same(cur.stat,merged.stat);
  return rpc('sync_push',{p_code:code(), p_payload:next, p_base:rem.ver}).then(function(res){
   if(res&&res.ok){
    if(changed) applyLocal(merged);
    lastAt=Date.now();
    try{localStorage.setItem(LASTK,String(lastAt))}catch(e){}
    setStat('ok', changed? '已同步（合并了远端数据）' : '已同步');
    return true;
   }
   if(res&&res.reason==='conflict'&&tryN<2){
    return mergeAndPush({ver:res.ver,payload:res.payload||{}}, tryN+1);
   }
   setStat('err','写入冲突，稍后重试');
   return false;
  });
 }

 function applyLocal(doc){
  var ch=wr(K_BOOK,doc.book);
  var ch2=wr(K_REC,doc.rec);
  wr(K_STAT,doc.stat);
  try{
   window.dispatchEvent(new StorageEvent('storage',{key:K_BOOK}));
   window.dispatchEvent(new StorageEvent('storage',{key:K_REC}));
  }catch(e){
   window.dispatchEvent(new Event('storage'));
  }
  if(ch||ch2){
   try{ if(window.NB&&NB.sync) NB.sync(); }catch(e){}
   try{ if(window.REC&&REC.refresh) REC.refresh(); }catch(e){}
  }
  setStat('ok','已拉取远端更新');
  if(UI) renderPanel();
 }

 /* ---------- 自动：本地一改就排队上传 ---------- */
 function schedule(){
  if(OFF) return;
  if(applying) return;
  if(!unlocked()) return;
  if(!cfg()||!code()) return;
  clearTimeout(timer);
  timer=setTimeout(function(){ cycle(true) }, 2500);
 }
 var _set=localStorage.setItem.bind(localStorage);
 try{
  localStorage.setItem=function(k,v){
   _set(k,v);
   if(k===K_BOOK||k===K_REC||k===K_STAT) schedule();
  };
 }catch(e){}

 /* ---------- UI ---------- */
 function setStat(s,m){
  status={s:s,m:m};
  if(!UI) return;
  var el=document.getElementById('sy-state');
  if(el){
   el.className='sy-state sy-'+s;
   el.textContent = m || ({idle:'未同步',run:'同步中…',ok:'已同步',err:'同步失败'}[s]||'');
  }
 }
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];})}

 function css(){
  if(document.getElementById('systyle')) return;
  var st=document.createElement('style'); st.id='systyle';
  st.textContent=''
  +'.sy-box{margin:16px 0 0;border:1px solid var(--line,#e6e2da);border-radius:14px;padding:14px 16px;'
  +'background:var(--panel,#fff);font-size:13.5px}'
  +'.sy-box h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}'
  +'.sy-box h3 .dot{width:7px;height:7px;border-radius:50%;background:#bbb}'
  +'.sy-state{font-size:12px;color:#888;margin-left:auto;font-weight:400}'
  +'.sy-state.sy-ok{color:#2f7d4f}.sy-state.sy-err{color:#c0392b}.sy-state.sy-run{color:'+ACC+'}'
  +'.sy-p{color:#777;line-height:1.7;margin:6px 0 10px}'
  +'.sy-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}'
  +'.sy-in{flex:1 1 160px;min-width:120px;font:inherit;font-size:13px;padding:7px 11px;'
  +'border:1px solid var(--line,#e6e2da);border-radius:9px;background:#fff;color:inherit;outline:none}'
  +'.sy-in:focus{border-color:'+ACC+';box-shadow:0 0 0 3px rgba(0,0,0,.05)}'
  +'.sy-btn{font:inherit;font-size:12.5px;font-weight:650;padding:6px 14px;border-radius:999px;cursor:pointer;'
  +'border:1px solid var(--line,#e6e2da);background:#fff;color:inherit}'
  +'.sy-btn:hover{border-color:'+ACC+';color:'+ACC+'}'
  +'.sy-btn.pri{background:'+ACC+';border-color:'+ACC+';color:#fff}'
  +'.sy-btn.pri:hover{filter:brightness(1.08);color:#fff}'
  +'.sy-code{font-family:"SF Mono",Menlo,monospace;font-size:16px;letter-spacing:1.5px;font-weight:700;'
  +'padding:5px 12px;border-radius:9px;background:rgba(0,0,0,.045)}'
  +'@media (prefers-color-scheme:dark){.sy-box,.sy-btn,.sy-in{background:#1d2025;border-color:#2c3037}'
  +'.sy-code{background:rgba(255,255,255,.08)}}'
  ;
  document.head.appendChild(st);
 }

 function panelHtml(){
  var c=cfg(), k=code();
  if(!unlocked()){
   return '<h3><span class="dot"></span>多设备同步<span class="sy-state sy-idle" id="sy-state">已锁定</span></h3>'
    +'<p class="sy-p">这个功能需要访问密码。输入一次就记在本机，以后不用再输。'

<script>
/* ================= 易混词（按拼写自动分组）================= */
(function(){
 var KEY='vj-book', ACC='#b4442e';
 function J(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}') }catch(e){ return {} } }
 function lev(a,b){
  if(a===b) return 0;
  var la=a.length, lb=b.length;
  if(Math.abs(la-lb)>2) return 9;
  var prev=[], cur=[], i, j;
  for(j=0;j<=lb;j++) prev[j]=j;
  for(i=1;i<=la;i++){
   cur[0]=i;
   var ca=a.charAt(i-1);
   for(j=1;j<=lb;j++){
    var cost = ca===b.charAt(j-1)?0:1;
    cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+cost);
   }
   for(j=0;j<=lb;j++) prev[j]=cur[j];
  }
  return prev[lb];
 }
 function build(){
  var bk=J(), ws=[], w;
  for(w in bk) if(w.length>3 && /^[a-z]+$/.test(w)) ws.push(w);
  if(ws.length<2) return [];
  var parent={}, i, j;
  for(i=0;i<ws.length;i++) parent[ws[i]]=ws[i];
  function find(x){ while(parent[x]!==x) x=parent[x]; return x }
  for(i=0;i<ws.length;i++){
   for(j=i+1;j<ws.length;j++){
    var a=ws[i], b=ws[j];
    if(Math.abs(a.length-b.length)>1) continue;
    if(a.charAt(0)!==b.charAt(0)&&a.charAt(1)!==b.charAt(1)) continue;
    if(lev(a,b)<=2){
     var ra=find(a), rb=find(b);
     if(ra!==rb) parent[ra]=rb;
    }
   }
  }
  var g={}, k;
  for(i=0;i<ws.length;i++){ var r=find(ws[i]); (g[r]=g[r]||[]).push(ws[i]) }
  var out=[];
  for(k in g) if(g[k].length>1){ g[k].sort(); out.push(g[k]) }
  out.sort(function(x,y){ return y.length-x.length });
  return out;
 }

  var groups=build();

 }
