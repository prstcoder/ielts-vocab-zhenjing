<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生词本 · 雅思词汇真经</title>
<style>
:root{
 --bg:#f7f6f3; --panel:#ffffff; --ink:#1f2328; --ink2:#5b6470; --line:#e6e2da;
 --accent:#b4442e; --accent-soft:#fdf1ec; --chip:#efece6; --mark:#fff3c4;
}
@media (prefers-color-scheme: dark){
 :root{ --bg:#16181c; --panel:#1d2025; --ink:#e8eaed; --ink2:#9aa3ad; --line:#2c3037;
        --accent:#e5836a; --accent-soft:#2a211f; --chip:#242830; --mark:#4a3f1a; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:16px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;padding-bottom:80px}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}

.top{padding:34px 0 18px}
.back{display:inline-block;font-size:13px;color:var(--ink2);text-decoration:none;
 border:1px solid var(--line);border-radius:999px;padding:3px 12px;margin-bottom:16px}
.back:hover{color:var(--accent);border-color:var(--accent)}
h1{margin:0;font-size:27px;letter-spacing:.2px;font-weight:700}
h1 .u{color:var(--accent);font-variant-numeric:tabular-nums}
.sub{margin:6px 0 0;color:var(--ink2);font-size:13.5px}

.toolbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
 backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
 padding:10px 0;margin-bottom:18px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 200px;min-width:150px;padding:8px 13px;border:1px solid var(--line);border-radius:9px;
 background:var(--panel);color:var(--ink);font-size:14px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);
 border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;background:var(--panel)}
.sw input{accent-color:var(--accent);margin:0}
.sw.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.btn{font:inherit;font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:5px 12px;cursor:pointer}
.btn:hover{color:var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--ink2);margin-left:auto;font-variant-numeric:tabular-nums}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
 border-radius:12px;overflow:hidden}
thead th{background:var(--chip);font-size:12.5px;letter-spacing:.06em;color:var(--ink2);
 font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line)}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--accent-soft)}
td.n{width:52px;color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}
td.w{width:30%;font-weight:650;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:16.5px;
 letter-spacing:.2px;word-break:break-word}
td.m{color:var(--ink)}
td.sv{width:38px;text-align:center;padding-left:0;padding-right:8px}
.ipa{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:400;
 color:var(--ink2);letter-spacing:0;margin-top:3px;word-break:break-word}
.card .w .ipa{font-size:13px;margin-left:8px}
tr.hit td.w,tr.hit td.m{background:var(--mark)}

/* 衍生词 */
.dv{margin-top:6px;font-size:12px;color:var(--ink2);line-height:1.9}
.dv b{color:var(--accent);font-weight:700;font-size:10.5px;letter-spacing:.08em;margin-right:6px;
 font-family:-apple-system,sans-serif;vertical-align:1px}
.dv i{font-style:normal;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:13.5px;color:var(--ink);
 letter-spacing:.1px}
.dv em{font-style:normal;font-size:10.5px;opacity:.7;margin-left:2px;font-family:-apple-system,sans-serif}
.dv .sep{opacity:.3;margin:0 7px}
.hide-m .dv{display:none}

/* 星标 */
.star{font-family:inherit;font-size:15px;line-height:1;color:var(--ink2);background:transparent;border:0;
 cursor:pointer;padding:3px 5px;border-radius:7px;opacity:.4;transition:.15s;vertical-align:2px}
.star:hover{opacity:1;color:var(--accent);background:var(--accent-soft)}
.star.on{opacity:1;color:var(--accent)}
.card .w .star{font-size:17px;margin-left:6px}

.cards{display:grid;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.card .w{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;letter-spacing:.2px}
.card .w .idx{font-family:inherit;font-size:12px;color:var(--ink2);font-weight:400;margin-right:8px;
 font-variant-numeric:tabular-nums}
.card .m{margin:5px 0 0;color:var(--ink);font-size:14.5px}
.card .ex{margin:10px 0 0;padding:9px 12px;background:var(--accent-soft);border-radius:9px;font-size:14px}
.card .ex .en{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:14.8px;line-height:1.55}
.card .ex .zh{color:var(--ink2);margin-top:3px;font-size:13.5px}
.card .no{color:var(--ink2);font-size:12.5px;margin-top:8px;font-style:italic}

tr.gsep td{background:var(--chip);padding:5px 14px;border-bottom:1px solid var(--line)}
.gtag{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.gcnt{font-size:11.5px;color:var(--ink2);margin-left:8px;font-variant-numeric:tabular-nums}
tbody.grp tr:first-child td{border-top:0}
tbody.grp + tbody.grp tr.gsep td{border-top:8px solid var(--bg)}

section.grp{background:var(--panel);border:1px solid var(--line);border-radius:16px;
 margin-bottom:16px;overflow:hidden}
.ghead{display:flex;align-items:baseline;gap:9px;padding:9px 15px;background:var(--chip);
 border-bottom:1px solid var(--line)}
section.grp .cards{display:grid;gap:0;padding:1px 15px}
section.grp .card{background:transparent;border:0;border-radius:0;padding:13px 0;
 border-bottom:1px solid var(--line)}
section.grp .card:last-child{border-bottom:0}

.hide-m .m,.hide-m td.m{display:none}
.hide-z .zh{display:none}
.hide-i .ipa{display:none}
body.hide-m td.m{display:none!important}
.empty{padding:40px;text-align:center;color:var(--ink2);font-size:14px}

.nav{display:flex;justify-content:space-between;gap:10px;margin:26px 0 0}
.nav a{font-size:13.5px;text-decoration:none;color:var(--ink2);border:1px solid var(--line);
 border-radius:999px;padding:6px 14px;background:var(--panel)}
.nav a:hover{color:var(--accent);border-color:var(--accent)}
.nav a.dis{opacity:.35;pointer-events:none}
footer{margin-top:30px;color:var(--ink2);font-size:12.5px;line-height:1.8}

/* 浮动生词本入口 */
#nbfab{position:fixed;right:20px;bottom:20px;z-index:60;display:inline-flex;align-items:center;gap:8px;
 padding:10px 17px;border-radius:999px;background:var(--accent);color:var(--panel);text-decoration:none;
 font-size:13.5px;font-weight:700;letter-spacing:.02em;box-shadow:0 8px 24px rgba(0,0,0,.22);
 padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#nbfab b{font-variant-numeric:tabular-nums;font-size:15px}
#nbfab:hover{filter:brightness(1.06)}
#nbfab.wiggle{animation:wig .4s}
@keyframes wig{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

@media (max-width:640px){
 body{font-size:15px}
 .wrap{padding:0 12px}
 h1{font-size:22px}
 thead{display:none}
 table,tbody,tr,td{display:block;width:auto}
 table{border:0;background:transparent;border-radius:0}
 tbody tr{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:9px;position:relative}
 tbody td{border:0;padding:0}
 td.n{display:none}
 tr.gsep{display:block}
 tr.gsep td{display:block;background:transparent;padding:0 0 6px}
 tbody.grp{margin-bottom:6px;display:block}
 td.w{font-size:17px;margin-bottom:3px;width:auto}
 td.m{font-size:14px;color:var(--ink2)}
 td.sv{position:absolute;right:8px;top:9px;width:auto;padding:0}
 td.sv .star{font-size:19px}
 #nbfab{right:12px;bottom:14px;padding:9px 14px;font-size:13px}
}

.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:4px 0 0}
.tot{display:flex;align-items:baseline;gap:8px}
.tot b{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.tot span{font-size:13px;color:var(--ink2)}
.tip{color:var(--ink2);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.acts .btn{padding:7px 14px}
.acts .btn.pri{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:650}
.acts .btn.pri:hover{filter:brightness(1.06);color:var(--panel)}
.item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 16px;margin-bottom:11px}
.item .h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.item .w{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;letter-spacing:.2px}
.item .ipa{font-size:12.5px;margin:0}
.item .m{font-size:14.5px;margin-top:4px}
.item .ex{margin-top:9px;padding:8px 11px;background:var(--accent-soft);border-radius:8px;font-size:13.5px}
.item .ex .en{font-family:ui-serif,Georgia,"Times New Roman",serif;line-height:1.55}
.item .ex .zh{color:var(--ink2);margin-top:2px}
.item .tag{font-size:11px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.item .del{margin-left:auto;font:inherit;font-size:12.5px;color:var(--ink2);background:transparent;
 border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
.item .del:hover{color:var(--accent);border-color:var(--accent)}
.sortsel{font:inherit;font-size:13px;color:var(--ink2);background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:6px 10px}

/* 复习模式 */
#rev{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--bg) 96%,#000 4%);
 display:none;overflow:auto;padding:22px 16px 30px}
#rev.on{display:block}
.rwrap{max-width:660px;margin:0 auto}
.rbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.rbar .prog{flex:1;height:5px;background:var(--chip);border-radius:99px;overflow:hidden}
.rbar .prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.rbar .num{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rbar .x{font:inherit;font-size:20px;line-height:1;background:transparent;border:0;color:var(--ink2);
 cursor:pointer;padding:4px 8px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px 24px;
 text-align:center;min-height:250px;cursor:pointer;user-select:none}
.rcard .rw{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:33px;font-weight:700;letter-spacing:.2px;
 word-break:break-word}
.rcard .ripa{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:14px;color:var(--ink2);margin-top:7px}
.rcard .rq{color:var(--ink2);font-size:13px;margin-top:26px;letter-spacing:.04em}
.rans{margin-top:20px;text-align:left;border-top:1px dashed var(--line);padding-top:16px;display:none}
.rans.on{display:block}
.rans .rm{font-size:16px}
.rans .rdv{font-size:13px;color:var(--ink2);margin-top:9px}
.rans .rex{margin-top:12px;font-size:14px;background:var(--accent-soft);padding:10px 12px;border-radius:9px}
.rans .rex .zh{color:var(--ink2);margin-top:3px;font-size:13px}
.rbtns{display:flex;gap:10px;margin-top:16px}
.rbtns button{flex:1;font:inherit;font-size:14.5px;font-weight:650;padding:12px 0;border-radius:12px;
 cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.rbtns button.no{color:#b4442e}
.rbtns button.ok{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.rbtns button:disabled{opacity:.4;cursor:default}
.done{text-align:center;padding:40px 10px}
.done h2{font-size:22px;margin:0 0 8px}
.done p{color:var(--ink2);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <a class="back" href="index.html">← 全部单元</a>
  <h1>生词本</h1>
  <p class="sub">收录你标记过的单词，连同衍生词一起复习。数据只存在本机浏览器。</p>
 </div>

 <div class="hd"><div class="tot"><b id="tot">0</b><span>个生词</span></div>
  <div class="tip" id="tip">点单词右侧的 ☆ 即可加入</div></div>

 <div class="acts">
  <button class="btn pri" id="start">开始复习</button>
  <button class="btn" id="exp">导出 TXT</button>
  <button class="btn" id="expj">备份 JSON</button>
  <button class="btn" id="imp">导入备份</button>
  <button class="btn" id="clr">清空</button>
  <input type="file" id="file" accept=".json" style="display:none">
 </div>

 <div class="toolbar" style="position:static;background:none;border:0;padding:0;margin:6px 0 14px">
  <div class="tools">
   <input id="q" type="search" placeholder="在生词本里搜索…（按 / 聚焦）">
   <select class="sortsel" id="sort">
    <option value="t">按加入时间</option>
    <option value="c">按章节</option>
    <option value="a">按字母</option>
   </select>
   <span class="count" id="cnt">0 条</span>
  </div>
 </div>

 <div id="list"></div>
 <div class="empty" id="empty" style="display:none">生词本还是空的 —— 去单元页点单词旁边的 ☆ 吧</div>
</div>

<div id="rev">
 <div class="rwrap">
  <div class="rbar">
   <span class="num" id="rnum">0 / 0</span>
   <div class="prog"><i id="rprog"></i></div>
   <button class="x" id="rclose">×</button>
  </div>
  <div class="rcard" id="rcard">
   <div class="rw" id="rw"></div>
   <div class="ripa" id="ripa"></div>
   <div class="rq" id="rq">点击卡片看释义，或按空格</div>
   <div class="rans" id="rans">
    <div class="rm" id="rm"></div>
    <div class="rdv" id="rdv"></div>
    <div class="rex" id="rex"></div>
   </div>
  </div>
  <div class="rbtns">
   <button class="no" id="rno">还没记住 <span style="font-size:11px;opacity:.6">1</span></button>
   <button class="ok" id="rok">记住了 <span style="font-size:11px;opacity:.6">2</span></button>
  </div>
 </div>
</div>

<script>
var NB=(function(){
 var KEY='vj-book';
 var mem=null, okStore=true;
 function read(){
  if(mem) return mem;
  try{var raw=localStorage.getItem(KEY); mem=raw?JSON.parse(raw):{}}catch(e){okStore=false; mem={}}
  return mem;
 }
 function write(){
  try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){
    okStore=false;
    alert('浏览器不允许本地存储，生词本无法保存（请用 https 打开，或关闭无痕模式）');
  }
 }
 function count(){return Object.keys(read()).length}
 function has(w){return !!read()[w]}
 function toggle(rec){
  var m=read();
  if(m[rec.w]){delete m[rec.w]}
  else{rec.t=Date.now(); m[rec.w]=rec}
  write(); sync(); return !!m[rec.w];
 }
 function remove(w){var m=read(); delete m[w]; write(); sync();}
 function all(){
  var m=read(), a=[];
  for(var k in m) a.push(m[k]);
  a.sort(function(x,y){return (y.t||0)-(x.t||0)});
  return a;
 }
 function sync(){
  var n=count();
  document.querySelectorAll('#nbfab b').forEach(function(el){el.textContent=n});
  document.querySelectorAll('.star').forEach(function(el){
    var on=has(el.dataset.star), was=el.classList.contains('on');
    el.classList.toggle('on',on);
    el.textContent=on?'★':'☆';
    if(on&&!was) el.setAttribute('title','已在生词本（点击移出）');
    else if(!on) el.setAttribute('title','加入生词本');
  });
 }
 function onStar(e){
  var b=e.target.closest('.star'); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  var host=b.closest('[data-w]')||b.closest('.card')||b.closest('tr');
  var rec=entry(host, b.dataset.star);
  var added=toggle(rec);
  var fab=document.getElementById('nbfab');
  if(added&&fab){fab.classList.remove('wiggle');void fab.offsetWidth;fab.classList.add('wiggle');}
 }
 function txt(el){return el?el.textContent.trim():''}
 function entry(host, w){
  if(!host) return {w:w};
  var mEl=host.querySelector('.m'), ipaEl=host.querySelector('.ipa');
  var mean='';
  if(mEl){var c=mEl.cloneNode(true);var d=c.querySelector('.dv');if(d)c.removeChild(d);mean=c.textContent.trim()}
  var en=txt(host.querySelector('.ex .en')), zh=txt(host.querySelector('.ex .zh'));
  return {w:w, p:txt(ipaEl), m:mean,
          d:host.dataset.dv||'',
          e:en, z:zh,
          c:document.body.dataset.ch||'',
          g:document.body.dataset.title||''};
 }
 document.addEventListener('click',onStar);
 window.addEventListener('storage',function(e){if(e.key===KEY){mem=null;sync();}});
 document.addEventListener('DOMContentLoaded',sync);
 sync();
 return {count:count,has:has,all:all,remove:remove,toggle:toggle,sync:sync,read:read};
})();
</script>
<script>
(function(){
 var list=document.getElementById('list'), empty=document.getElementById('empty');
 var q=document.getElementById('q'), sort=document.getElementById('sort');
 var cnt=document.getElementById('cnt'), tot=document.getElementById('tot'), tip=document.getElementById('tip');

 function dvHtml(d){
  if(!d) return '';
  var parts=d.split(';;').filter(Boolean).map(function(s){
   var a=s.split('|');
   return '<i style="font-style:normal;font-family:ui-serif,Georgia,serif;font-size:14px">'+a[0]+'</i>'+
          (a[1]?'<em style="font-style:normal;font-size:10.5px;opacity:.7;margin-left:2px">'+a[1]+'</em>':'');
  });
  return parts.length? '衍生 · '+parts.join(' <span style="opacity:.3">·</span> ') : '';
 }

 function render(){
  var all=NB.all(), v=(q.value||'').trim().toLowerCase(), s=sort.value;
  var arr=all.filter(function(r){
   return !v || (r.w+' '+(r.m||'')+' '+(r.d||'')).toLowerCase().indexOf(v)>-1;
  });
  if(s==='c') arr.sort(function(a,b){return (a.c||99)-(b.c||99) || (a.w>b.w?1:-1)});
  if(s==='a') arr.sort(function(a,b){return a.w>b.w?1:-1});
  cnt.textContent=arr.length+' 条';
  empty.style.display=all.length?'none':'block';
  empty.textContent = all.length? '' : '生词本还是空的 —— 去单元页点单词旁边的 ☆ 吧';
  if(!all.length){ list.innerHTML=''; }
  else if(!arr.length){ list.innerHTML='<div class="empty">没有匹配的生词</div>'; }
  else{
   list.innerHTML=arr.map(function(r){
    var ex = (r.e||r.z)? '<div class="ex">'+(r.e?'<div class="en">'+r.e+'</div>':'')+
             (r.z?'<div class="zh">'+r.z+'</div>':'')+'</div>' : '';
    var tag = r.c? '<span class="tag">Unit '+String(r.c).padStart(2,'0')+(r.g?' · '+r.g:'')+'</span>' : '';
    return '<div class="item" data-w="'+r.w+'">'+
      '<div class="h"><span class="w">'+r.w+'</span>'+
      (r.p?'<span class="ipa">'+r.p+'</span>':'')+tag+
      '<button class="del" data-del="'+r.w+'">移出</button></div>'+
      '<div class="m">'+(r.m||'—')+(dvHtml(r.d)?'<div class="dv" style="margin-top:5px;font-size:12px;color:var(--ink2)">'+dvHtml(r.d)+'</div>':'')+'</div>'+
      ex+'</div>';
   }).join('');
  }
  tot.textContent=all.length;
  tip.textContent = all.length? ('最近添加：'+(all[0].w)) : '点单词右侧的 ☆ 即可加入';
  document.title=(all.length?all.length+' 词 · ':'')+'生词本 · 雅思词汇真经';
 }

 list.addEventListener('click',function(e){
  var b=e.target.closest('[data-del]'); if(!b) return;
  NB.remove(b.dataset.del); render();
 });
 q.addEventListener('input',render);
 sort.addEventListener('change',render);

 // 导出
 function dl(name, text, type){
  var blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
 }
 document.getElementById('exp').onclick=function(){
  var all=NB.all();
  if(!all.length) return alert('生词本还是空的');
  var t='雅思词汇真经 · 生词本（'+all.length+' 词）\n\n';
  all.forEach(function(r,i){
   var dv=(r.d||'').split(';;').filter(Boolean).map(function(s){var a=s.split('|');return a[0]}).join(', ');
   t+=(i+1)+'. '+r.w+(r.p?'  '+r.p:'')+'\n   '+(r.m||'')+'\n'+(dv?'   衍生：'+dv+'\n':'')+
      (r.e?'   例：'+r.e+'\n':'')+(r.z?'        '+r.z+'\n':'')+'\n';
  });
  dl('生词本-'+all.length+'词.txt',t);
 };
 document.getElementById('expj').onclick=function(){
  var all=NB.all(); if(!all.length) return alert('生词本还是空的');
  dl('生词本备份.json',JSON.stringify({app:'ielts-zhenjing',n:all.length,items:all},null,1),'application/json');
 };
 document.getElementById('imp').onclick=function(){document.getElementById('file').click()};
 document.getElementById('file').onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
   try{
    var o=JSON.parse(rd.result), items=o.items||o||[];
    if(!Array.isArray(items)) throw 0;
    var m=NB.read(), n=0;
    items.forEach(function(r){ if(r&&r.w&&!m[r.w]){r.t=r.t||Date.now();m[r.w]=r;n++} });
    try{localStorage.setItem('vj-book',JSON.stringify(m))}catch(err){}
    alert('导入完成：新增 '+n+' 个生词'); render(); NB.sync();
   }catch(err){alert('文件格式不对，需要本页导出的 JSON 备份')}
  };
  rd.readAsText(f); e.target.value='';
 };
 document.getElementById('clr').onclick=function(){
  if(!NB.count()) return;
  if(!confirm('确定清空全部 '+NB.count()+' 个生词？此操作不可撤销。')) return;
  try{localStorage.setItem('vj-book','{}')}catch(e){}
  location.reload();
 };

 // ---- 复习模式 ----
 var rev=document.getElementById('rev'), queue=[], idx=0, shown=false, okN=0;
 var rw=document.getElementById('rw'), ripa=document.getElementById('ripa'),
     rq=document.getElementById('rq'), rans=document.getElementById('rans'),
     rm=document.getElementById('rm'), rdv=document.getElementById('rdv'),
     rex=document.getElementById('rex'), rnum=document.getElementById('rnum'),
     rprog=document.getElementById('rprog'), rcard=document.getElementById('rcard'),
     rok=document.getElementById('rok'), rno=document.getElementById('rno');

 function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

 function start(){
  var all=NB.all();
  if(!all.length) return alert('生词本还是空的，先点 ☆ 加几个词吧');
  queue=shuffle(all.slice()); idx=0; okN=0;
  rev.classList.add('on'); document.body.style.overflow='hidden';
  show();
 }
 function show(){
  if(idx>=queue.length){ finish(); return; }
  var r=queue[idx]; shown=false;
  rw.textContent=r.w; ripa.textContent=r.p||'';
  rq.style.display=''; rq.textContent='点击卡片看释义，或按空格';
  rans.classList.remove('on'); rcard.style.cursor='pointer';
  rm.textContent=r.m||'—';
  var dv=(r.d||'').split(';;').filter(Boolean).map(function(s){var a=s.split(';').join('').split('|');return a[0]+(a[1]?' '+a[1]:'')}).join(' · ');
  rdv.innerHTML=dv?'衍生 · '+dv:'';
  rex.innerHTML=(r.e?'<div class="en">'+r.e+'</div>':'')+(r.z?'<div class="zh">'+r.z+'</div>':'');
  rnum.textContent=(idx+1)+' / '+queue.length;
  rprog.style.width=((idx)/queue.length*100)+'%';
  rok.disabled=rno.disabled=false;
 }
 function reveal(){
  if(shown) return; shown=true;
  rans.classList.add('on'); rq.style.display='none'; rcard.style.cursor='default';
 }
 function next(remember){
  if(remember){ NB.remove(queue[idx].w); okN++; }
  idx++; if(idx<queue.length) rprog.style.width=(idx/queue.length*100)+'%';
  show();
 }
 function finish(){
  rev.innerHTML='<div class="rwrap"><div class="done"><h2>这一轮过完了</h2>'+
   '<p>共复习 '+queue.length+' 个词，记住 '+okN+' 个，还剩 '+(queue.length-okN)+' 个留待下次。</p>'+
   '<div class="acts" style="justify-content:center"><button class="btn pri" id="again">再来一轮</button>'+
   '<button class="btn" id="back">回到列表</button></div></div></div>';
  document.getElementById('again').onclick=function(){location.reload()};
  document.getElementById('back').onclick=function(){location.reload()};
 }
 document.getElementById('start').onclick=start;
 document.getElementById('rclose').onclick=function(){location.reload()};
 rcard.onclick=reveal;
 rok.onclick=function(){ if(!shown){reveal();return} next(true) };
 rno.onclick=function(){ if(!shown){reveal();return} next(false) };
 document.addEventListener('keydown',function(e){
  if(!rev.classList.contains('on')){ 
    if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
    return;
  }
  if(e.key===' '||e.key==='Enter'){e.preventDefault(); if(!shown)reveal(); else next(true)}
  if(e.key==='1'){ if(!shown)reveal(); else next(false) }
  if(e.key==='2'){ if(!shown)reveal(); else next(true) }
  if(e.key==='Escape') location.reload();
 });

 render();
})();
</script>
</body></html>
