<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><pre id="out">x</pre>
<script>
localStorage.clear();
var f=document.createElement('iframe'); f.src='shengci.html'; f.style.cssText='width:900px;height:600px;border:0';
document.body.appendChild(f);
setTimeout(function(){
 var w=f.contentWindow, d=w.document;
 var data={app:'ielts-zhenjing',v:2,n:1,items:[{w:'importedword',p:'[ɪm]',m:'n. 导入测试',e:'imported',z:'导入',t:Date.now()}]};
 try{
  var file=new w.File([JSON.stringify(data)],'backup.json',{type:'application/json'});
  var dt=new w.DataTransfer(); dt.items.add(file);
  var inp=d.getElementById('file'); inp.files=dt.files;
  inp.dispatchEvent(new w.Event('change',{bubbles:true}));
 }catch(e){ document.getElementById('out').textContent='ERR '+e.message }
 setTimeout(function(){
  var book=w.localStorage.getItem('vj-book')||'{}';
  document.getElementById('out').textContent='含 importedword='+(book.indexOf('importedword')>-1)+' | 同步面板='+!!d.getElementById('syncbox')+' | 条数='+Object.keys(JSON.parse(book||'{}')).length;
 },900);
},2400);
</script></body></html>
